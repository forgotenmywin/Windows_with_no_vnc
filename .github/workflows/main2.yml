
name: Copy GLB To Release Asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Download model
        run: |
          mkdir -p assessr
          curl -L --fail --retry 3 \
            "https://github.com/forgotenmywin/Windows_with_no_vnc/releases/download/map-of-home/model.glb" \
            -o assessr/model.glb

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload map-of-home \
            assessr/model.glb \
            --repo forgotenmywin/Windows_with_no_vnc \
            --clobber

      - name: Verify
        run: |
          gh release view map-of-home \
            --repo forgotenmywin/Windows_with_no_vnc
