
name: Download and ZIP House Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GLB from Release
        run: |
          mkdir -p assessr
          curl -L --fail --retry 3 \
            "https://github.com/forgotenmywin/Windows_with_no_vnc/releases/download/map-of-home/model.glb" \
            -o assessr/model.glb

      - name: Verify downloaded file
        run: |
          test -s assessr/model.glb
          ls -lh assessr/model.glb

      - name: Create ZIP
        run: |
          cd assessr
          zip -1 model.zip model.glb
          cd ..
          ls -lh assessr/model.zip

      - name: Upload ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload map-of-home \
            assessr/model.zip \
            --clobber

      - name: Verify uploaded ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view map-of-home
