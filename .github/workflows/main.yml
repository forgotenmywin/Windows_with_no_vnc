        def _headless_status_path(job_id):
            job_id = str(job_id or "")
            if not re.fullmatch(r"[a-f0-9]{32}", job_id):
                raise ValueError("invalid headless job id")
            return HEADLESS_ROOT / job_id / "status.json"


        def _read_headless_status(job_id):
            path = _headless_status_path(job_id)
            if not path.is_file():
                return None
            try:
                value = json.loads(path.read_text(encoding="utf-8-sig"))
                return value if isinstance(value, dict) else None
            except Exception as exc:
                return {"ok": False, "job_id": job_id, "status": "status_read_error", "error": str(exc)}


        def _headless_log_tail(job_id, stream_name, max_chars=12000):
            if stream_name not in ("stdout.log", "stderr.log"):
                raise ValueError("invalid headless log stream")
            job_dir = _headless_status_path(job_id).parent.resolve()
            log_path = (job_dir / stream_name).resolve()
            if log_path.parent != job_dir:
                raise ValueError("headless log path escaped the job directory")
            try:
                with log_path.open("rb") as handle:
                    handle.seek(0, os.SEEK_END)
                    size = handle.tell()
                    handle.seek(max(0, size - max_chars * 4), os.SEEK_SET)
                    content = handle.read().decode("utf-8", errors="replace")
                return content[-max_chars:]
            except FileNotFoundError:
                return ""
            except Exception as exc:
                return "[log read error] " + str(exc)


        def _write_headless_status(path, payload):
            path = Path(path).resolve()
            if HEADLESS_ROOT not in path.parents:
                raise ValueError("headless status path must remain inside HeadlessJobs")
            temporary = path.with_suffix(".tmp")
            temporary.write_text(json.dumps(payload, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
            os.replace(temporary, path)


        def _project_is_open_in_editor(project_file):
            project_file = str(Path(project_file).resolve()).lower()
            try:
                import psutil
                for proc in psutil.process_iter(["name", "cmdline"]):
                    try:
                        name = (proc.info.get("name") or "").lower()
                        if name not in ("unrealeditor.exe", "unrealeditor-cmd.exe"):
                            continue
                        command_line = " ".join(proc.info.get("cmdline") or []).lower()
                        if project_file in command_line:
                            return True
                    except (psutil.NoSuchProcess, psutil.AccessDenied):
                        continue
            except Exception as exc:
                log("Could not inspect Unreal process command lines: " + repr(exc))
            return bool(bridge_connected() and Path(project_file) == _current_project())


        def _enable_python_for_headless(project_file):
            project_file = Path(project_file).resolve()
            data = json.loads(project_file.read_text(encoding="utf-8-sig"))
            if not isinstance(data, dict):
                raise ValueError("Invalid .uproject JSON")
            plugins = data.get("Plugins") if isinstance(data.get("Plugins"), list) else []
            changed = False
            mapping = {str(item.get("Name")): item for item in plugins if isinstance(item, dict) and item.get("Name")}
            for name in ("PythonScriptPlugin", "EditorScriptingUtilities"):
                item = mapping.get(name)
                if item is None:
                    plugins.append({"Name": name, "Enabled": True})
                    changed = True
                elif item.get("Enabled") is not True:
                    item["Enabled"] = True
                    changed = True
            if changed:
                backup = _backup_file(project_file, "headless_uproject")
                data["Plugins"] = plugins
                temporary = project_file.with_suffix(".uproject.tmp")
                temporary.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
                os.replace(temporary, project_file)
                log("Enabled PythonScriptPlugin and EditorScriptingUtilities for headless project; backup=" + str(backup))
                return backup
            return None


        def _headless_write_command(payload):
            """Atomically hand one validated job to the PowerShell supervisor."""
            with HEADLESS_LOCK:
                if HEADLESS_COMMAND_FILE.exists():
                    raise RuntimeError("another headless job is queued or running")
                if EDITOR_COMMAND_FILE.exists():
                    raise RuntimeError("another Editor restart/project command is queued; wait for it to finish")
                command_tmp = HEADLESS_COMMAND_FILE.with_suffix(".tmp")
                command_tmp.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
                os.replace(command_tmp, HEADLESS_COMMAND_FILE)


        def _headless_set_status(job_id, **updates):
            status = _read_headless_status(job_id)
            if not status:
                raise RuntimeError("headless job status disappeared: " + str(job_id))
            status.update(updates)
            _write_headless_status(_headless_status_path(job_id), status)
            return status


        def _headless_wait_for_editor_save(job_id, save_job_id, payload, max_wait_seconds):
            """Complete an asynchronous live-Editor save before starting the commandlet."""
            global HEADLESS_PENDING_SAVE_JOB
            job_dir = _headless_status_path(job_id).parent
            cancel_flag = job_dir / "cancel-requested.flag"
            deadline = time.time() + max(60, int(max_wait_seconds))
            try:
                _headless_set_status(job_id, status="queued", phase="waiting_for_editor_save",
                    save_job_id=save_job_id, save_started_at=time.time(),
                    message="Waiting for the live Unreal Editor to save dirty packages; commandlet has not started.")
                while time.time() < deadline:
                    current = _read_headless_status(job_id) or {}
                    if current.get("status") == "cancelled" or cancel_flag.exists():
                        _headless_set_status(job_id, status="cancelled", finished_at=time.time(),
                            error="Cancelled while waiting for the Editor save; no commandlet was started.")
                        return
                    save_result, save_status = wait_unreal_job(save_job_id, 25)
                    if save_status == 202 and save_result.get("status") == "pending":
                        _headless_set_status(job_id, status="queued", phase="waiting_for_editor_save",
                            save_last_checked_at=time.time(), save_message="Editor save is still running; the job remains queued safely.")
                        continue
                    if save_status != 200 or not save_result.get("ok"):
                        raise RuntimeError("Editor save failed (HTTP %s): %s" % (save_status, save_result))

                    # Match the original flow: enable the Python plugins only after the
                    # live Editor has saved, immediately before the supervisor closes it.
                    backup = _enable_python_for_headless(Path(payload["project_file"]))
                    payload["python_plugin_backup"] = backup
                    _headless_set_status(job_id, status="queued", phase="commandlet_queued", save_completed_at=time.time(),
                        save_output=str(save_result.get("output", ""))[-4000:],
                        python_plugin_backup=backup,
                        message="Editor save completed; commandlet queued for the supervisor.")
                    _headless_write_command(payload)
                    log("Headless job save completed; command dispatched: id=%s" % job_id)
                    return
                raise TimeoutError("Timed out waiting for the live Unreal Editor save; commandlet was not started.")
            except Exception as exc:
                try:
                    _headless_set_status(job_id, status="failed", finished_at=time.time(), error=str(exc),
                        message="The live Editor save did not complete; no headless commandlet was started.")
                except Exception:
                    pass
                log("Headless job could not pass Editor-save gate: id=%s error=%s" % (job_id, repr(exc)))
            finally:
                with HEADLESS_LOCK:
                    if HEADLESS_PENDING_SAVE_JOB == job_id:
                        HEADLESS_PENDING_SAVE_JOB = ""


        def _enqueue_headless_job(args):
            global HEADLESS_PENDING_SAVE_JOB
            args = args or {}
            if args.get("confirm_run") is not True:
                raise ValueError("confirm_run=true is required; headless Python can modify project assets and files")
            code = args.get("script")
            if not isinstance(code, str) or not code.strip():
                raise ValueError("script must be a non-empty Python string")
            if len(code) > HEADLESS_MAX_SCRIPT_CHARS:
                raise ValueError("script exceeds %s characters" % HEADLESS_MAX_SCRIPT_CHARS)

            project_value = args.get("project_file") or str(_current_project())
            project = Path(project_value).resolve()
            if project.suffix.lower() != ".uproject" or not project.is_file() or not _inside_root(project):
                raise ValueError("project_file must be an existing .uproject inside D:\\UE58")

            try:
                timeout_seconds = int(args.get("timeout_seconds", 10000))
            except (TypeError, ValueError):
                timeout_seconds = 10000
            timeout_seconds = max(30, min(HEADLESS_MAX_TIMEOUT_SECONDS, timeout_seconds))
            map_path = str(args.get("map_path") or "").strip()
            if len(map_path) > 500 or (map_path and not map_path.startswith("/Game/")):
                raise ValueError("map_path must be an Unreal asset path beginning with /Game/ and <=500 characters")

            same_open_project = _project_is_open_in_editor(project)
            stop_editor = args.get("stop_editor") is True
            resume_editor = args.get("resume_editor", True) is True
            if same_open_project and not stop_editor:
                raise RuntimeError("project_is_open_in_editor: set stop_editor=true to save and close the current Editor before running a commandlet on this same project")
            if same_open_project and project != _current_project():
                raise RuntimeError("target_project_is_open_in_another_editor_instance: close that secondary Editor manually before headless execution")

            with HEADLESS_LOCK:
                if HEADLESS_PENDING_SAVE_JOB:
                    raise RuntimeError("another headless job is waiting for the live Editor save: " + HEADLESS_PENDING_SAVE_JOB)
                if HEADLESS_COMMAND_FILE.exists():
                    raise RuntimeError("another headless job is queued or running")
                if EDITOR_COMMAND_FILE.exists():
                    raise RuntimeError("another Editor restart/project command is queued; wait for it to finish")
                job_id = uuid.uuid4().hex
                job_dir = (HEADLESS_ROOT / job_id).resolve()
                job_dir.mkdir(parents=True, exist_ok=False)
                script_path = job_dir / "script.py"
                log_path = job_dir / "stdout.log"
                error_path = job_dir / "stderr.log"
                status_path = job_dir / "status.json"

                wrapper = "import unreal\n"
                if map_path:
                    wrapper += "_ue_headless_level = unreal.get_editor_subsystem(unreal.LevelEditorSubsystem)\n"
                    wrapper += "_ue_headless_loaded = _ue_headless_level.load_level(%r)\n" % map_path
                    wrapper += "if not _ue_headless_loaded:\n    raise RuntimeError('Could not load requested level: ' + %r)\n" % map_path
                wrapper += "print('UE_HEADLESS_JOB_ID=' + %r)\n" % job_id
                script_path.write_text(wrapper + code + "\n", encoding="utf-8")

                payload = {
                    "job_id": job_id,
                    "project_file": str(project),
                    "script_file": str(script_path),
                    "status_file": str(status_path),
                    "stdout_log": str(log_path),
                    "stderr_log": str(error_path),
                    "timeout_seconds": timeout_seconds,
                    "stop_editor": bool(same_open_project and stop_editor),
                    "resume_editor": bool(same_open_project and stop_editor and resume_editor),
                    "resume_project_file": str(_current_project()),
                    "created_at": time.time(),
                    "map_path": map_path,
                    "python_plugin_backup": None,
                }
                initial_status = "queued"
                initial_phase = "waiting_for_editor_save" if same_open_project and stop_editor else "commandlet_queued"
                initial = {
                    "ok": True, "job_id": job_id, "status": initial_status, "phase": initial_phase,
                    "project_file": str(project), "map_path": map_path,
                    "created_at": payload["created_at"], "started_at": None,
                    "finished_at": None, "exit_code": None,
                    "stdout_log": str(log_path), "stderr_log": str(error_path),
                    "script_file": str(script_path), "timeout_seconds": timeout_seconds,
                    "headless": True, "renderer": "nullrhi",
                    "editor_will_stop": payload["stop_editor"],
                    "editor_will_resume": payload["resume_editor"],
                    "python_plugin_backup": None,
                    "message": "Preparing headless job; waiting for Editor save." if initial_phase == "waiting_for_editor_save" else "Headless job queued.",
                }
                _write_headless_status(status_path, initial)
                if same_open_project and stop_editor:
                    # Reserve the single pending-save slot before queue_unreal waits,
                    # preventing two callers from simultaneously saving/stopping the Editor.
                    HEADLESS_PENDING_SAVE_JOB = job_id

            if same_open_project and stop_editor:
                save_code = editor_save_code()
                # Do not hold the HTTP/MCP request open while the Editor performs a save.
                # queue_unreal returns 202 when the save exceeds this short initial window;
                # the daemon waiter continues polling and dispatches the command only after
                # the save has completed successfully.
                try:
                    save_result, save_status = queue_unreal(save_code, 8)
                except Exception as exc:
                    with HEADLESS_LOCK:
                        if HEADLESS_PENDING_SAVE_JOB == job_id:
                            HEADLESS_PENDING_SAVE_JOB = ""
                    _headless_set_status(job_id, status="failed", finished_at=time.time(), error="Could not queue the Editor save: " + str(exc))
                    raise RuntimeError("Could not queue the open Editor save before headless run: " + str(exc))
                if save_status == 202 and save_result.get("job_id"):
                    waiter = threading.Thread(
                        target=_headless_wait_for_editor_save,
                        args=(job_id, str(save_result["job_id"]), payload, min(max(timeout_seconds, 600), 1800)),
                        daemon=True,
                        name="UE58-Headless-SaveWait-" + job_id[:8],
                    )
                    try:
                        waiter.start()
                    except Exception as exc:
                        with HEADLESS_LOCK:
                            if HEADLESS_PENDING_SAVE_JOB == job_id:
                                HEADLESS_PENDING_SAVE_JOB = ""
                        _headless_set_status(job_id, status="failed", finished_at=time.time(), error="Could not start Editor-save waiter: " + str(exc))
                        raise RuntimeError("Could not start asynchronous Editor-save waiter: " + str(exc))
                    log("Headless job waiting asynchronously for Editor save: id=%s save_job=%s" % (job_id, save_result["job_id"]))
                    return {"ok": True, "job_id": job_id, "status": "queued", "phase": "waiting_for_editor_save",
                            "headless": True, "renderer": "nullrhi", "project_file": str(project),
                            "status_endpoint": "/api/unreal/headless/status?job_id=" + job_id,
                            "editor_will_stop": True, "editor_will_resume": bool(resume_editor),
                            "save_job_id": save_result["job_id"],
                            "message": "Editor save is running asynchronously. The commandlet will start automatically after the save succeeds; poll the job status."}
                with HEADLESS_LOCK:
                    if HEADLESS_PENDING_SAVE_JOB == job_id:
                        HEADLESS_PENDING_SAVE_JOB = ""
                if save_status != 200 or not save_result.get("ok"):
                    _headless_set_status(job_id, status="failed", finished_at=time.time(), error="Could not save the open project: " + str(save_result))
                    raise RuntimeError("Could not save the open project before headless run: " + str(save_result))
                payload["python_plugin_backup"] = _enable_python_for_headless(project)
                _headless_set_status(job_id, status="queued", save_completed_at=time.time(),
                    save_output=str(save_result.get("output", ""))[-4000:],
                    python_plugin_backup=payload["python_plugin_backup"],
                    message="Editor save completed; commandlet queued for the supervisor.")
            else:
                payload["python_plugin_backup"] = _enable_python_for_headless(project)

            _headless_write_command(payload)
            log("Headless Unreal commandlet job queued: id=%s project=%s stop_editor=%s resume_editor=%s" %
                (job_id, project, payload["stop_editor"], payload["resume_editor"]))
            return {"ok": True, "job_id": job_id, "status": "queued", "headless": True,
                    "renderer": "nullrhi", "project_file": str(project),
                    "status_endpoint": "/api/unreal/headless/status?job_id=" + job_id,
                    "editor_will_stop": payload["stop_editor"], "editor_will_resume": payload["resume_editor"],
                    "message": "Queued for UnrealEditor-Cmd.exe -run=pythonscript -nullrhi. Poll the job status."}


        def _cancel_headless_job(job_id):
            status = _read_headless_status(job_id)
            if not status:
                raise ValueError("headless job not found")
            if status.get("status") not in ("queued", "running"):
                return {"ok": True, "job_id": job_id, "status": status.get("status"), "cancelled": False}
            job_dir = _headless_status_path(job_id).parent
            (job_dir / "cancel-requested.flag").write_text(str(time.time()), encoding="ascii")
            if status.get("phase") == "waiting_for_editor_save":
                _headless_set_status(job_id, status="cancelled", finished_at=time.time(),
                    error="Cancellation requested while waiting for Editor save; commandlet will not start.")
            return {"ok": True, "job_id": job_id, "cancel_requested": True, "status": status.get("status")}


