                "workflow-extract": LOG_DIR / "workflow-extract-transcript.log",
                "workflow-setup": LOG_DIR / "workflow-setup-transcript.log",
                "workflow-validation": LOG_DIR / "workflow-validation-transcript.log",
                "workflow-runtime": LOG_DIR / "workflow-runtime-transcript.log",
            }
            project_logs = set()
            try:
                project_logs.add(_current_project().parent / "Saved" / "Logs")
            except Exception:
                pass
            project_logs.add(ROOT / "UEControl" / "Saved" / "Logs")
            for unreal_log_dir in project_logs:
                if unreal_log_dir.is_dir():
                    for path in sorted(unreal_log_dir.glob("*.log")):
                        sources["unreal-saved:" + path.parent.parent.parent.name + ":" + path.name] = path
            return sources

        def _redact_log_line(value):
            value = str(value)
            value = re.sub(r"(?i)\b(MONITOR_PASSWORD|FILE_MANAGER_PASSWORD|GITHUB_TOKEN|GG_UE_TOKEN|BRIDGE_TOKEN|API_TOKEN)\s*[:=]\s*([^\s,;]+)", r"\1=[redacted]", value)
            value = re.sub(r"(?i)(authorization\s*[:=]\s*['\"]?(?:bearer|basic)\s+)[^'\"\s,;]+", r"\1[redacted]", value)
            value = re.sub(r"(?i)(Bearer\s+)[A-Za-z0-9._~+/-]+=*", r"\1[redacted]", value)
            value = re.sub(r"\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b", "[redacted GitHub token]", value)
            return value

        def _read_log_tail(path, max_bytes=180000):
            try:
                with path.open("rb") as handle:
                    handle.seek(0, os.SEEK_END)
                    size = handle.tell()
                    handle.seek(max(0, size - max_bytes), os.SEEK_SET)
                    data = handle.read()
                text_value = data.decode("utf-8", errors="replace")
                if size > max_bytes and "\n" in text_value:
                    text_value = text_value.split("\n", 1)[1]
                return text_value.splitlines(), path.stat().st_mtime
            except (OSError, PermissionError):
                return [], 0.0

        def _log_line_epoch(line, fallback):
            match = re.match(r"^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})", line)
            if match:
                try:
                    return time.mktime(time.strptime(match.group(1), "%Y-%m-%d %H:%M:%S"))
                except ValueError:
                    pass
            match = re.match(r"^(\d{4}\.\d{2}\.\d{2}-\d{2}\.\d{2}\.\d{2})", line)
            if match:
                try:
                    return time.mktime(time.strptime(match.group(1), "%Y.%m.%d-%H.%M.%S"))
                except ValueError:
                    pass
            return fallback

        def _collect_logs(source_filter="all", query="", level_filter="all", limit=500):
            entries = []
            sources = _available_log_sources()
            needle = str(query or "").strip().lower()
            for source_name, path in sources.items():
                if source_filter not in ("", "all") and source_name != source_filter:
                    continue
                if not path.is_file():
                    continue
                lines, fallback_time = _read_log_tail(path)
                for line_number, raw_line in enumerate(lines):
                    message = _redact_log_line(raw_line)
                    lower = message.lower()
                    if needle and needle not in lower and needle not in source_name.lower():
                        continue
                    if any(word in lower for word in ("error", "exception", "traceback", "fatal", "failed", "failure")):
                        level = "ERROR"
                    elif "warning" in lower or " warn" in lower:
                        level = "WARN"
                    elif "debug" in lower:
                        level = "DEBUG"
                    else:
                        level = "INFO"
                    if level_filter not in ("", "all") and level.lower() != level_filter.lower():
                        continue
                    epoch = _log_line_epoch(message, fallback_time)
                    entries.append({
                        "time": epoch,
                        "timestamp": time.strftime("%Y-%m-%d %H:%M:%S", time.localtime(epoch)) if epoch else "time unknown",
                        "source": source_name,
                        "level": level,
                        "message": message[:6000],
                        "line": line_number + 1
                    })
            entries.sort(key=lambda item: item["time"])
            return entries[-limit:], sorted(sources.keys())

