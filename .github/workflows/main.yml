
name: Unreal Engine 5.8 - Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal-machine:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Set RDP_PASSWORD in repository Actions secrets."
          }

          $account = Get-LocalUser -Name runneradmin -ErrorAction SilentlyContinue
          if ($null -eq $account) {
            throw "The runneradmin account was not found."
          }

          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name runneradmin -Password $password

          Set-ItemProperty `
            'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Get-NetFirewallRule |
            Where-Object { $_.DisplayGroup -eq 'Remote Desktop' } |
            Enable-NetFirewallRule -ErrorAction SilentlyContinue

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Write-Host "RDP configured."

      - name: Install TightVNC
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Set VNC_PASSWORD in repository Actions secrets."
          }

          if ($env:VNC_PASSWORD.Length -gt 8) {
            throw "Use a VNC password of 8 characters or fewer."
          }

          $work = 'D:\UE58'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $msi = Join-Path $work 'tightvnc.msi'
          $url = 'https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi'

          Invoke-WebRequest -Uri $url -OutFile $msi

          $args = @(
            '/i', "`"$msi`"",
            '/quiet', '/norestart',
            'ADDLOCAL=Server',
            'SERVER_REGISTER_AS_SERVICE=1',
            'SERVER_ADD_FIREWALL_EXCEPTION=1',
            'SET_ACCEPTRFBCONNECTIONS=1',
            'VALUE_OF_ACCEPTRFBCONNECTIONS=1',
            'SET_ALLOWLOOPBACK=1',
            'VALUE_OF_ALLOWLOOPBACK=1',
            'SET_LOOPBACKONLY=1',
            'VALUE_OF_LOOPBACKONLY=1',
            'SET_USEVNCAUTHENTICATION=1',
            'VALUE_OF_USEVNCAUTHENTICATION=1',
            'SET_PASSWORD=1',
            "VALUE_OF_PASSWORD=$($env:VNC_PASSWORD)"
          )

          $install = Start-Process msiexec.exe `
            -ArgumentList $args -Wait -PassThru

          if ($install.ExitCode -notin @(0, 3010)) {
            throw "TightVNC installation failed: $($install.ExitCode)"
          }

          $reg = 'HKLM:\SOFTWARE\TightVNC\Server'
          if (-not (Test-Path $reg)) {
            New-Item -Path $reg -Force | Out-Null
          }

          New-ItemProperty $reg -Name AllowLoopback `
            -PropertyType DWord -Value 1 -Force | Out-Null

          New-ItemProperty $reg -Name LoopbackOnly `
            -PropertyType DWord -Value 1 -Force | Out-Null

          New-ItemProperty $reg -Name AcceptRfbConnections `
            -PropertyType DWord -Value 1 -Force | Out-Null

          $tvn = 'C:\Program Files\TightVNC\tvnserver.exe'
          if (-not (Test-Path $tvn)) {
            throw "tvnserver.exe was not found."
          }

          $service = Get-Service tvnserver -ErrorAction SilentlyContinue
          if ($service) {
            if ($service.Status -eq 'Running') {
              Restart-Service tvnserver -Force
            } else {
              Start-Service tvnserver
            }
          } else {
            & $tvn -start
          }

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if (Get-NetTCPConnection -LocalPort 5900 -State Listen `
                -ErrorAction SilentlyContinue) {
              $ready = $true
              break
            }
          }

          if (-not $ready) {
            throw "TightVNC is not listening on port 5900."
          }

          Write-Host "TightVNC is listening on port 5900."

      - name: Install noVNC and Python dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $work = 'D:\UE58'
          $noVnc = Join-Path $work 'noVNC'
          $logs = Join-Path $work 'Logs'

          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          if (-not (Test-Path $noVnc)) {
            git clone --depth 1 https://github.com/novnc/noVNC.git $noVnc
            if ($LASTEXITCODE -ne 0) {
              throw "Could not clone noVNC."
            }
          }

          python -m pip install --upgrade pip websockify

          if ($LASTEXITCODE -ne 0) {
            throw "Could not install websockify."
          }

          python -c "import websockify; print('websockify module OK')"

      - name: Download and extract Unreal Engine 5.8
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $work = 'D:\UE58'
          $partsDir = Join-Path $work 'Parts'
          $zip = Join-Path $work 'UE_5.8.zip'
          $dest = Join-Path $work 'Extracted'
          $logs = Join-Path $work 'Logs'

          New-Item -ItemType Directory -Force `
            -Path $partsDir, $dest, $logs | Out-Null

          gh release download ue5.8 `
            --repo forgotenmywin/Windows_with_no_vnc `
            --pattern 'UE_5.8.zip.*' `
            --dir $partsDir

          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the release assets."
          }

          $parts = @(
            1..8 | ForEach-Object {
              Join-Path $partsDir ('UE_5.8.zip.{0:D3}' -f $_)
            }
          )

          foreach ($part in $parts) {
            if (-not (Test-Path $part)) {
              throw "Missing archive part: $part"
            }
          }

          $expected = (Get-Item $parts |
            Measure-Object Length -Sum).Sum

          $output = [System.IO.File]::Create($zip)
          try {
            foreach ($part in $parts) {
              Write-Host "Joining $(Split-Path $part -Leaf)"
              $inputStream = [System.IO.File]::OpenRead($part)
              try {
                $inputStream.CopyTo($output)
              } finally {
                $inputStream.Dispose()
              }
            }
          } finally {
            $output.Dispose()
          }

          if ((Get-Item $zip).Length -ne $expected) {
            throw "Joined ZIP size mismatch."
          }

          Remove-Item $partsDir -Recurse -Force

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Could not install 7-Zip."
            }
          }

          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip executable not found."
          }

          $test = Start-Process $sevenZip `
            -ArgumentList @('t', $zip) `
            -Wait -PassThru `
            -RedirectStandardOutput (Join-Path $logs 'zip-test.log') `
            -RedirectStandardError (Join-Path $logs 'zip-test-error.log')

          if ($test.ExitCode -ne 0) {
            Get-Content (Join-Path $logs 'zip-test.log') -Tail 60
            Get-Content (Join-Path $logs 'zip-test-error.log') -Tail 60
            throw "ZIP integrity test failed."
          }

          $extract = Start-Process $sevenZip `
            -ArgumentList @('x', $zip, "-o$dest", '-y') `
            -Wait -PassThru `
            -RedirectStandardOutput (Join-Path $logs 'extract.log') `
            -RedirectStandardError (Join-Path $logs 'extract-error.log')

          if ($extract.ExitCode -ne 0) {
            Get-Content (Join-Path $logs 'extract.log') -Tail 80
            Get-Content (Join-Path $logs 'extract-error.log') -Tail 80
            throw "Unreal Engine extraction failed."
          }

          Write-Host "Unreal Engine extraction completed."

      - name: Launch Unreal Editor
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          $dest = 'D:\UE58\Extracted'
          $logs = 'D:\UE58\Logs'

          $editor = Get-ChildItem $dest -Filter UnrealEditor.exe `
            -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '\\Engine\\Binaries\\Win64\\UnrealEditor\.exe$'
            } |
            Select-Object -First 1

          if (-not $editor) {
            Write-Host "UnrealEditor.exe not found."
            Get-ChildItem $dest -Filter UnrealEditor-Cmd.exe `
              -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 10 -ExpandProperty FullName
            exit 0
          }

          Write-Host "Editor: $($editor.FullName)"

          $log = Join-Path $logs 'unreal-editor.log'
          $p = Start-Process $editor.FullName `
            -ArgumentList @('-AllowSoftwareRendering', '-d3d11', "-log=$log") `
            -WorkingDirectory $editor.DirectoryName `
            -PassThru

          Set-Content 'D:\UE58\unreal-editor.pid' $p.Id
          Write-Host "Unreal Editor PID: $($p.Id)"

      - name: Start and maintain noVNC and Cloudflare
        shell: powershell
        timeout-minutes: 350
        run: |
          $ErrorActionPreference = 'Continue'

          $work = 'D:\UE58'
          $logs = Join-Path $work 'Logs'
          $noVnc = Join-Path $work 'noVNC'
          $cloudflared = Join-Path $work 'cloudflared.exe'

          $outProxy = Join-Path $logs 'websockify-out.log'
          $errProxy = Join-Path $logs 'websockify-err.log'
          $outTunnel = Join-Path $logs 'cloudflared-out.log'
          $errTunnel = Join-Path $logs 'cloudflared-err.log'

          Invoke-WebRequest `
            'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' `
            -OutFile $cloudflared

          function Start-Websockify {
            Write-Host "Starting Websockify..."

            # Avoid duplicate proxy processes.
            Get-CimInstance Win32_Process |
              Where-Object {
                $_.CommandLine -match 'websockify' -and
                $_.CommandLine -match '6080'
              } |
              ForEach-Object {
                Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
              }

            Start-Sleep -Seconds 2

            $p = Start-Process -FilePath (Get-Command python).Source `
              -ArgumentList @(
                '-u', '-m', 'websockify',
                '--web', $noVnc,
                '6080', '127.0.0.1:5900'
              ) `
              -WorkingDirectory $work `
              -RedirectStandardOutput $outProxy `
              -RedirectStandardError $errProxy `
              -PassThru

            Set-Content (Join-Path $work 'websockify.pid') $p.Id
            Start-Sleep -Seconds 5

            $port = Get-NetTCPConnection -LocalPort 6080 -State Listen `
              -ErrorAction SilentlyContinue

            if ($port) {
              Write-Host "Websockify is listening on 6080."
            } else {
              Write-Host "ERROR: Websockify failed to bind port 6080."
              if (Test-Path $errProxy) {
                Get-Content $errProxy -Tail 80
              }
            }
          }

          function Start-Cloudflare {
            Write-Host "Starting Cloudflare quick tunnel..."

            # Stop old tunnel processes before starting a replacement.
            Get-Process cloudflared -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 2

            Remove-Item $outTunnel, $errTunnel `
              -Force -ErrorAction SilentlyContinue

            $p = Start-Process $cloudflared `
              -ArgumentList @(
                'tunnel', '--url',
                'http://127.0.0.1:6080',
                '--no-autoupdate'
              ) `
              -WorkingDirectory $work `
              -RedirectStandardOutput $outTunnel `
              -RedirectStandardError $errTunnel `
              -PassThru

            Set-Content (Join-Path $work 'cloudflared.pid') $p.Id

            $urlFound = $false

            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2

              $combined = ''
              if (Test-Path $outTunnel) {
                $combined += Get-Content $outTunnel -Raw
              }
              if (Test-Path $errTunnel) {
                $combined += Get-Content $errTunnel -Raw
              }

              $match = [regex]::Match(
                $combined,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              )

              if ($match.Success) {
                Write-Host "============================================"
                Write-Host "OPEN THIS NEW noVNC URL:"
                Write-Host "$($match.Value)/vnc.html?autoconnect=true&resize=scale"
                Write-Host "============================================"
                $urlFound = $true
                break
              }

              if ($p.HasExited) {
                Write-Host "Cloudflare exited with code $($p.ExitCode)."
                break
              }
            }

            if (-not $urlFound) {
              Write-Host "Could not find a Cloudflare URL. Tunnel logs:"
              if (Test-Path $outTunnel) {
                Get-Content $outTunnel -Tail 50
              }
              if (Test-Path $errTunnel) {
                Get-Content $errTunnel -Tail 50
              }
            }
          }

          # Run both services from this long-lived step.
          # This avoids depending on background processes started by prior steps.
          Start-Websockify
          Start-Cloudflare

          while ($true) {
            $vnc = Get-NetTCPConnection -LocalPort 5900 -State Listen `
              -ErrorAction SilentlyContinue

            $proxy = Get-NetTCPConnection -LocalPort 6080 -State Listen `
              -ErrorAction SilentlyContinue

            $tunnel = Get-Process cloudflared -ErrorAction SilentlyContinue
            $editor = Get-Process UnrealEditor -ErrorAction SilentlyContinue

            Write-Host "VNC=$([bool]$vnc) | Websockify=$([bool]$proxy) | Cloudflare=$([bool]$tunnel) | Unreal=$([bool]$editor)"

            if (-not $vnc) {
              Write-Host "WARNING: VNC port 5900 is down."
            }

            if (-not $proxy) {
              Write-Host "Websockify stopped. Last error:"
              if (Test-Path $errProxy) {
                Get-Content $errProxy -Tail 40
              }
              Start-Websockify
            }

            if (-not $tunnel) {
              Write-Host "Cloudflare stopped. Restarting tunnel."
              Start-Cloudflare
            }

            if (-not $editor -and
                (Test-Path (Join-Path $logs 'unreal-editor.log'))) {
              Write-Host "Unreal Editor is not running. Recent log:"
              Get-Content (Join-Path $logs 'unreal-editor.log') -Tail 30
            }

            Start-Sleep -Seconds 30
          }
