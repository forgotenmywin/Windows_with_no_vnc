        @app.post("/api/fs/upload")
        @monitor_auth
        def api_fs_upload():
            upload = request.files.get("file")
            if upload is None:
                return jsonify(ok=False, error="multipart field 'file' is required"), 400
            try:
                folder = _fs_resolve(request.form.get("directory", str(UPLOAD_ROOT)))
                if not folder.is_dir():
                    return jsonify(ok=False, error="destination_must_be_a_folder"), 400
                raw_name = str(upload.filename or "upload.bin").replace("\\", "/").split("/")[-1]
                filename = _fs_safe_name(raw_name, "upload.bin")
                target = _fs_resolve(folder / filename)
                overwrite = str(request.form.get("overwrite", "false")).lower() == "true"
                if target.exists() and not overwrite:
                    return jsonify(ok=False, error="target_exists_enable_replace_to_overwrite", path=str(target)), 409
                temp = target.with_name(target.name + ".uploading-" + uuid.uuid4().hex)
                upload.save(temp)
                if target.exists() and target.is_dir():
                    temp.unlink(missing_ok=True)
                    return jsonify(ok=False, error="target_is_a_directory"), 409
                os.replace(temp, target)
                log("FILE_UPLOAD_COMPLETED path=%s bytes=%s overwritten=%s" % (target, target.stat().st_size, overwrite))
                return jsonify(ok=True, path=str(target), name=target.name, size=target.stat().st_size, overwritten=overwrite)
            except Exception as exc:
                log("FILE_UPLOAD_FAILED error=%s" % repr(exc))
                return jsonify(ok=False, error=str(exc)), 400

