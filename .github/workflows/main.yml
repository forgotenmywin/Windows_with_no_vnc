                               can_restore=bool(saved.get("original_guid")), temp_roots=temp_roots,
                               temp_cleanup_age_hours=WINDOWS_TEMP_AGE_HOURS,
                               note="Power mode changes only the active power plan. Temp cleanup only targets files older than 48 hours in the current user TEMP/TMP folders.")
            except Exception as exc:
