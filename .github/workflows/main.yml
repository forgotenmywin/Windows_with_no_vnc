name: UE 5.8 Remote Control API

on:
  workflow_dispatch:

# Request all GITHUB_TOKEN permission scopes supported by this repository.
# Repository/org policies still apply; this does not grant access to Actions secrets.
permissions: write-all

jobs:
  ue-remote:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare D drive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\UE58'
          New-Item -ItemType Directory -Force -Path $root, "$root\parts", "$root\Logs", "$root\Projects", "$root\Screenshots", "$root\Uploads" | Out-Null
          $drive = Get-PSDrive D -ErrorAction SilentlyContinue
          if (-not $drive) { throw 'Drive D is not available on this runner.' }
          Write-Host ("D: available space: {0:N2} GB" -f ($drive.Free / 1GB))
          "UE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download and extract Unreal Engine 5.8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\UE58'
          $partsDir = "$root\parts"
          $archive = "$root\UE_5.8.zip"
          $extract = "$root\Extracted"

          gh release download ue5.8 --repo forgotenmywin/Windows_with_no_vnc --pattern 'UE_5.8.zip.*' --dir $partsDir --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download release assets UE_5.8.zip.*.' }

          $parts = @(Get-ChildItem -LiteralPath $partsDir -File | Where-Object { $_.Name -like 'UE_5.8.zip.*' } | Sort-Object Name)
          if ($parts.Count -lt 2) { throw "Expected split ZIP parts; found $($parts.Count). Check release tag/assets." }

          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          $destination = [System.IO.File]::Open($archive, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try {
            $buffer = New-Object byte[] (4MB)
            foreach ($part in $parts) {
              Write-Host ("Joining {0} ({1:N2} GB)" -f $part.Name, ($part.Length / 1GB))
              $source = [System.IO.File]::OpenRead($part.FullName)
              try {
                while (($read = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {
                  $destination.Write($buffer, 0, $read)
                }
              }
              finally { $source.Dispose() }
            }
          }
          finally { $destination.Dispose() }

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $sevenZip = @('C:\Program Files\7-Zip\7z.exe','C:\Program Files (x86)\7-Zip\7z.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $sevenZip) {
            choco install 7zip -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path -LiteralPath $sevenZip)) { throw '7z.exe was not found.' }

          & $sevenZip t $archive
          if ($LASTEXITCODE -ne 0) { throw 'Joined ZIP failed integrity testing.' }
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & $sevenZip x $archive "-o$extract" -y
          if ($LASTEXITCODE -ne 0) { throw 'Unreal Engine extraction failed.' }

          $editor = Get-ChildItem -LiteralPath $extract -Filter UnrealEditor.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Engine\\Binaries\\Win64\\UnrealEditor\.exe$' } |
            Select-Object -First 1
          if (-not $editor) { throw 'UnrealEditor.exe was not found.' }
          Write-Host "EDITOR_EXE=$($editor.FullName)"
          "UE_EDITOR_EXE=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create UE project, bridge and API server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\UE58'
          $project = "$root\UEControl"
          $pythonDir = "$project\Content\Python"
          $config = "$project\Config"
          New-Item -ItemType Directory -Force -Path $pythonDir, $config, "$root\Projects", "$root\Screenshots", "$root\Uploads", "$root\Logs" | Out-Null

          $uproject = @'
          {
            "FileVersion": 3,
            "EngineAssociation": "5.8",
            "Category": "RemoteControl",
            "Description": "Unreal Editor controlled through a remote API bridge",
            "Plugins": [
              { "Name": "PythonScriptPlugin", "Enabled": true },
              { "Name": "EditorScriptingUtilities", "Enabled": true }
            ]
          }
          '@
          Set-Content -LiteralPath "$project\UEControl.uproject" -Value $uproject -Encoding utf8

          $engineConfig = @'
          [/Script/EngineSettings.GameMapsSettings]
          EditorStartupMap=/Engine/Maps/Entry
          GameDefaultMap=/Engine/Maps/Entry
          '@
          Set-Content -LiteralPath "$config\DefaultEngine.ini" -Value $engineConfig -Encoding utf8

          $bridge = @'
          import ast, contextlib, io, json, os, queue, threading, time, traceback, urllib.request
          import unreal

          API = "http://127.0.0.1:8765"
          TOKEN = os.environ.get("BRIDGE_TOKEN", "")
          ROOT = os.environ.get("UE_ROOT", r"D:\UE58")
          LOG_FILE = os.path.join(ROOT, "Logs", "unreal_bridge.log")
          INCOMING, OUTGOING = queue.Queue(), queue.Queue()
          NAMESPACE = {"__name__": "__ue_remote__"}

          def log(message):
              try:
                  with open(LOG_FILE, "a", encoding="utf-8") as stream:
                      stream.write(time.strftime("%Y-%m-%d %H:%M:%S ") + str(message) + "\n")
              except Exception:
                  pass

          def request_json(path, payload=None, timeout=5):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(API + path, data=data,
                  headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"},
                  method="GET" if payload is None else "POST")
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          def execute_code(source):
              captured, error = io.StringIO(), ""
              try:
                  parsed = ast.parse(source, filename="<remote-unreal-python>", mode="exec")
                  with contextlib.redirect_stdout(captured), contextlib.redirect_stderr(captured):
                      if parsed.body and isinstance(parsed.body[-1], ast.Expr):
                          prefix = ast.Module(body=parsed.body[:-1], type_ignores=[])
                          if prefix.body:
                              exec(compile(prefix, "<remote-unreal-python>", "exec"), NAMESPACE, NAMESPACE)
                          value = eval(compile(ast.Expression(parsed.body[-1].value), "<remote-unreal-python>", "eval"), NAMESPACE, NAMESPACE)
                          if value is not None:
                              print(repr(value))
                      else:
                          exec(compile(parsed, "<remote-unreal-python>", "exec"), NAMESPACE, NAMESPACE)
              except Exception as exc:
                  error = "".join(traceback.format_exception(type(exc), exc, exc.__traceback__))
              output = captured.getvalue().strip()
              if not output and not error:
                  output = "Executed successfully (no output)."
              return output, error

          def network_worker():
              log("Bridge network worker started")
              while True:
                  try:
                      while not OUTGOING.empty():
                          payload = OUTGOING.get_nowait()
                          try:
                              request_json("/internal/result", payload, timeout=8)
                          except Exception as exc:
                              log("Posting result failed: " + repr(exc))
                      reply = request_json("/internal/next", {"wait": 1}, timeout=5)
                      job = reply.get("job") if isinstance(reply, dict) else None
                      if job:
                          INCOMING.put(job)
                  except Exception as exc:
                      log("Polling error: " + repr(exc))
                      time.sleep(1)

          def editor_tick(delta_seconds):
              try:
                  job = INCOMING.get_nowait()
              except queue.Empty:
                  return
              job_id = job.get("id", "")
              log("Executing job " + str(job_id))
              output, error = execute_code(job.get("code", ""))
              OUTGOING.put({"id": job_id, "output": output, "error": error})

          if not TOKEN:
              log("ERROR: BRIDGE_TOKEN missing from Unreal process environment")
              raise RuntimeError("BRIDGE_TOKEN missing")
          threading.Thread(target=network_worker, name="UE-Remote-Network", daemon=True).start()
          CALLBACK_HANDLE = unreal.register_slate_post_tick_callback(editor_tick)
          version = unreal.SystemLibrary.get_engine_version()
          log("Bridge registered; UE_VERSION=" + str(version))
          print("UE_REMOTE_BRIDGE_READY " + str(version))
          '@
          Set-Content -LiteralPath "$pythonDir\init_unreal.py" -Value $bridge -Encoding utf8

          $api = @'
          import contextlib, json, os, queue, re, shutil, tempfile, threading, time, uuid
          from pathlib import Path
          from functools import wraps
          from flask import Flask, jsonify, request, send_file

          app = Flask(__name__)
          app.config["MAX_CONTENT_LENGTH"] = 8 * 1024 * 1024 * 1024
          ROOT = Path(os.environ.get("UE_ROOT", r"D:\UE58")).resolve()
          LOG_DIR = ROOT / "Logs"
          LOG_DIR.mkdir(parents=True, exist_ok=True)
          LOG_FILE = LOG_DIR / "api.log"
          BRIDGE_TOKEN = os.environ.get("BRIDGE_TOKEN", "")
          jobs, waiting, lock = queue.Queue(), {}, threading.Lock()
          last_bridge_seen = 0.0

          def log(message):
              line = time.strftime("%Y-%m-%d %H:%M:%S ") + str(message)
              try:
                  with LOG_FILE.open("a", encoding="utf-8") as out:
                      out.write(line + "\n")
              except Exception:
                  pass
              print(line, flush=True)

          def public_auth(fn):
              # Deliberately unauthenticated for temporary plugin testing only.
              @wraps(fn)
              def wrapper(*args, **kwargs):
                  return fn(*args, **kwargs)
              return wrapper

          def bridge_auth(fn):
              @wraps(fn)
              def wrapper(*args, **kwargs):
                  if not BRIDGE_TOKEN or request.headers.get("Authorization", "") != "Bearer " + BRIDGE_TOKEN:
                      return jsonify(ok=False, error="unauthorized_internal"), 401
                  return fn(*args, **kwargs)
              return wrapper

          def safe_path(value):
              if not value:
                  raise ValueError("path is required")
              candidate = Path(value)
              if not candidate.is_absolute():
                  candidate = ROOT / candidate
              resolved = candidate.resolve()
              if resolved != ROOT and ROOT not in resolved.parents:
                  raise ValueError("path must stay inside D:\\UE58")
              return resolved

          def bridge_connected():
              return time.time() - last_bridge_seen < 12

          def queue_unreal(code, timeout=60):
              if not bridge_connected():
                  return {"ok": False, "error": "unreal_bridge_not_connected"}, 503
              if not isinstance(code, str) or not code.strip():
                  return {"ok": False, "error": "code must be a non-empty string"}, 400
              if len(code) > 100000:
                  return {"ok": False, "error": "code exceeds 100000 characters"}, 413
              try:
                  timeout = max(1, min(300, int(timeout)))
              except (ValueError, TypeError):
                  timeout = 60
              job_id, event = uuid.uuid4().hex, threading.Event()
              with lock:
                  waiting[job_id] = {"event": event, "result": None}
              jobs.put({"id": job_id, "code": code})
              if not event.wait(timeout):
                  with lock:
                      waiting.pop(job_id, None)
                  return {"ok": False, "error": "unreal_command_timeout", "job_id": job_id}, 504
              with lock:
                  row = waiting.pop(job_id, None)
              result = row["result"] if row else None
              if not result:
                  return {"ok": False, "error": "missing_result", "job_id": job_id}, 500
              return {"ok": not bool(result.get("error")), "output": result.get("output", ""),
                      "error": result.get("error", ""), "job_id": job_id}, 200

          def google_drive():
              raw = os.environ.get("GG_UE_TOKEN", "")
              if not raw:
                  raise RuntimeError("GG_UE_TOKEN is missing from GitHub Actions Secrets")
              try:
                  info = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise RuntimeError("GG_UE_TOKEN must be full authorized_user.json or service-account JSON") from exc
              scopes = ["https://www.googleapis.com/auth/drive"]
              from google.auth.transport.requests import Request
              from google.auth.transport.requests import AuthorizedSession
              from googleapiclient.discovery import build
              if "client_email" in info and "private_key" in info:
                  from google.oauth2 import service_account
                  creds = service_account.Credentials.from_service_account_info(info, scopes=scopes)
              elif info.get("refresh_token") and info.get("client_id") and info.get("client_secret"):
                  from google.oauth2.credentials import Credentials
                  creds = Credentials.from_authorized_user_info(info, scopes=scopes)
              else:
                  raise RuntimeError("Unsupported credentials; use authorized_user.json or service-account JSON")
              if not creds.valid:
                  creds.refresh(Request())
              return build("drive", "v3", credentials=creds, cache_discovery=False)

          def upload_drive_file(source_path, metadata):
              from googleapiclient.http import MediaFileUpload
              media = MediaFileUpload(str(source_path), resumable=True, chunksize=8 * 1024 * 1024)
              req = google_drive().files().create(body=metadata, media_body=media,
                  fields="id,name,mimeType,size,webViewLink")
              response = None
              while response is None:
                  status, response = req.next_chunk(num_retries=2)
                  if status:
                      log("Google Drive upload progress: %s%%" % int(status.progress() * 100))
              return response

          def github_release_upload(source_path, tag, filename="", release_name="", release_notes=""):
              import requests
              from urllib.parse import quote
              from os import environ
              token = environ.get("GITHUB_TOKEN", "")
              repository = environ.get("GITHUB_REPOSITORY", "")
              if not token or "/" not in repository:
                  raise RuntimeError("GITHUB_TOKEN or GITHUB_REPOSITORY is unavailable")
              tag = str(tag or "").strip()
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,99}", tag):
                  raise ValueError("Invalid release tag")
              name = str(filename or source_path.name).strip()
              if not name or Path(name).name != name or any(c in name for c in ("/", "\\", "\r", "\n")):
                  raise ValueError("filename must be a simple filename")
              if source_path.stat().st_size <= 0:
                  raise ValueError("source file is empty")
              base = "https://api.github.com/repos/" + repository
              session = requests.Session()
              session.headers.update({"Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              resp = session.get(base + "/releases/tags/" + quote(tag, safe=""), timeout=(10, 30))
              if resp.status_code == 404:
                  resp = session.post(base + "/releases", json={"tag_name": tag,
                      "name": release_name or tag, "body": release_notes or "Uploaded by UE Remote API",
                      "draft": False, "prerelease": False, "generate_release_notes": False}, timeout=(10, 30))
                  if resp.status_code != 201:
                      raise RuntimeError("Could not create GitHub Release: HTTP %s %s" % (resp.status_code, resp.text[:500]))
                  release = resp.json()
              elif resp.ok:
                  release = resp.json()
              else:
                  raise RuntimeError("GitHub Release lookup failed: HTTP %s %s" % (resp.status_code, resp.text[:500]))
              upload_url = release.get("upload_url", "").split("{", 1)[0]
              release_id = release.get("id")
              if not upload_url or not release_id:
                  raise RuntimeError("GitHub response omitted release id/upload URL")
              aresp = session.get(base + "/releases/" + str(release_id) + "/assets", params={"per_page": 100}, timeout=(10, 30))
              if not aresp.ok:
                  raise RuntimeError("Could not list release assets: HTTP %s" % aresp.status_code)
              for old in aresp.json():
                  if old.get("name") == name or old.get("name", "").startswith(name + ".part"):
                      deleted = session.delete(base + "/releases/assets/" + str(old["id"]), timeout=(10, 30))
                      if deleted.status_code != 204:
                          raise RuntimeError("Could not replace old asset %s" % old.get("name"))
              maxpart = 1800000000
              payloads, tmp = [], None
              try:
                  if source_path.stat().st_size <= maxpart:
                      payloads = [(source_path, name)]
                  else:
                      tmp = tempfile.TemporaryDirectory(prefix="release-parts-", dir=str(ROOT / "Uploads"))
                      partno = 1
                      with source_path.open("rb") as src:
                          while True:
                              part = Path(tmp.name) / (name + ".part%03d" % partno)
                              wrote = 0
                              with part.open("wb") as dst:
                                  while wrote < maxpart:
                                      block = src.read(min(8 * 1024 * 1024, maxpart - wrote))
                                      if not block: break
                                      dst.write(block); wrote += len(block)
                              if not wrote:
                                  part.unlink(missing_ok=True); break
                              payloads.append((part, part.name)); partno += 1
                  uploaded = []
                  for path, remote_name in payloads:
                      with path.open("rb") as stream:
                          up = session.post(upload_url, params={"name": remote_name}, data=stream,
                              headers={"Content-Type": "application/octet-stream", "Content-Length": str(path.stat().st_size)}, timeout=(30, 300))
                      if up.status_code != 201:
                          raise RuntimeError("Release asset upload failed for %s: HTTP %s %s" % (remote_name, up.status_code, up.text[:500]))
                      obj = up.json()
                      uploaded.append({"name": obj.get("name", remote_name), "size": obj.get("size"), "url": obj.get("browser_download_url", "")})
                  result = {"ok": True, "repository": repository, "tag": tag, "release_url": release.get("html_url", ""),
                            "source": str(source_path), "original_size": source_path.stat().st_size,
                            "split_into_parts": len(uploaded) > 1, "assets": uploaded}
                  if len(uploaded) > 1:
                      result["reassemble_note"] = "Download the parts in order and use Windows CMD: copy /b " + "+".join(x["name"] for x in uploaded) + " " + name
                  return result
              finally:
                  if tmp is not None: tmp.cleanup()

          @app.get("/health")
          def health():
              return jsonify(ok=True, service="Unreal Remote API", bridge_connected=bridge_connected(),
                             engine_bridge_last_seen=(last_bridge_seen or None), time=time.time())

          @app.post("/command")
          @public_auth
          def command():
              body = request.get_json(silent=True) or {}
              result, status = queue_unreal(body.get("code"), body.get("timeout", 60))
              return jsonify(result), status

          @app.post("/internal/next")
          @bridge_auth
          def internal_next():
              global last_bridge_seen
              last_bridge_seen = time.time()
              try: job = jobs.get(timeout=1.5)
              except queue.Empty: job = None
              return jsonify(ok=True, job=job)

          @app.post("/internal/result")
          @bridge_auth
          def internal_result():
              body = request.get_json(silent=True) or {}
              job_id = body.get("id")
              if not job_id: return jsonify(ok=False, error="id is required"), 400
              with lock:
                  row = waiting.get(job_id)
                  if row is None: return jsonify(ok=False, error="job expired or no longer waiting"), 404
                  row["result"] = {"output": str(body.get("output", "")), "error": str(body.get("error", ""))}
                  row["event"].set()
              return jsonify(ok=True)

          @app.get("/projects")
          @public_auth
          def projects():
              found = []
              for base in (ROOT / "Projects", ROOT / "UEControl"):
                  if base.exists():
                      for item in base.rglob("*.uproject"):
                          found.append({"name": item.stem, "project_file": str(item), "directory": str(item.parent)})
              found.sort(key=lambda item: item["name"].lower())
              return jsonify(ok=True, count=len(found), projects=found)

          @app.post("/projects/rename")
          @public_auth
          def rename_project():
              body = request.get_json(silent=True) or {}
              try: source = safe_path(body.get("project_file", ""))
              except ValueError as exc: return jsonify(ok=False, error=str(exc)), 400
              new_name = str(body.get("new_name", "")).strip()
              if not re.fullmatch(r"[A-Za-z0-9_-]{1,80}", new_name):
                  return jsonify(ok=False, error="new_name permits letters, numbers, _ and -"), 400
              if source.suffix.lower() != ".uproject" or not source.is_file():
                  return jsonify(ok=False, error="existing .uproject file required"), 404
              target = source.with_name(new_name + ".uproject")
              if target.exists() and target != source:
                  return jsonify(ok=False, error="target already exists"), 409
              try:
                  source.rename(target)
                  return jsonify(ok=True, old_path=str(source), project_file=str(target), new_name=new_name,
                                 note="Only the .uproject file was renamed; its folder was not changed.")
              except OSError as exc: return jsonify(ok=False, error=str(exc)), 500

          @app.post("/files/upload")
          @public_auth
          def file_upload():
              if "file" not in request.files: return jsonify(ok=False, error="multipart field 'file' is required"), 400
              file = request.files["file"]
              try:
                  target = safe_path(request.form.get("path") or file.filename or "upload.bin")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists(): return jsonify(ok=False, error="target already exists; delete or rename it first", path=str(target)), 409
                  temp = target.with_name(target.name + ".uploading-" + uuid.uuid4().hex)
                  file.save(temp)
                  temp.replace(target)
                  return jsonify(ok=True, path=str(target), size=target.stat().st_size)
              except (ValueError, OSError) as exc: return jsonify(ok=False, error=str(exc)), 400

          @app.get("/files/download")
          @public_auth
          def file_download():
              try: target = safe_path(request.args.get("path", ""))
              except ValueError as exc: return jsonify(ok=False, error=str(exc)), 400
              if not target.is_file(): return jsonify(ok=False, error="file not found", path=str(target)), 404
              return send_file(target, as_attachment=True, download_name=target.name)

          @app.get("/files/read")
          @public_auth
          def read_text_file():
              try: target = safe_path(request.args.get("path", ""))
              except ValueError as exc: return jsonify(ok=False, error=str(exc)), 400
              if not target.is_file(): return jsonify(ok=False, error="file not found"), 404
              if target.stat().st_size > 2 * 1024 * 1024: return jsonify(ok=False, error="text file exceeds 2 MB"), 413
              try: return jsonify(ok=True, path=str(target), content=target.read_text(encoding="utf-8-sig"))
              except UnicodeDecodeError: return jsonify(ok=False, error="not a UTF-8 text file"), 415

          @app.put("/files/write")
          @public_auth
          def write_text_file():
              body = request.get_json(silent=True) or {}
              content = body.get("content")
              if not isinstance(content, str): return jsonify(ok=False, error="content must be a string"), 400
              if len(content) > 2_000_000: return jsonify(ok=False, error="content exceeds 2 MB"), 413
              try:
                  target = safe_path(body.get("path", ""))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(content, encoding="utf-8")
                  return jsonify(ok=True, path=str(target), size=target.stat().st_size)
              except (ValueError, OSError) as exc: return jsonify(ok=False, error=str(exc)), 400

          @app.post("/drive/list")
          @public_auth
          def drive_list():
              body = request.get_json(silent=True) or {}
              folder_id = str(body.get("folder_id", "root"))
              try:
                  page_size = max(1, min(1000, int(body.get("page_size", 100))))
                  query = "trashed = false"
                  if folder_id != "*": query += " and '" + folder_id.replace("'", "") + "' in parents"
                  result = google_drive().files().list(q=query, pageSize=page_size, orderBy="name",
                      fields="files(id,name,mimeType,size,modifiedTime,webViewLink,parents)").execute(num_retries=2)
                  return jsonify(ok=True, count=len(result.get("files", [])), files=result.get("files", []))
              except Exception as exc:
                  log("Drive list error: " + repr(exc))
                  return jsonify(ok=False, error=str(exc)), 502

          @app.post("/drive/download")
          @public_auth
          def drive_download():
              body = request.get_json(silent=True) or {}
              file_id = str(body.get("file_id", "")).strip()
              if not file_id: return jsonify(ok=False, error="file_id is required"), 400
              try:
                  target = safe_path(body.get("destination", ""))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  from googleapiclient.http import MediaIoBaseDownload
                  media = google_drive().files().get_media(fileId=file_id)
                  with target.open("wb") as handle:
                      downloader = MediaIoBaseDownload(handle, media, chunksize=8 * 1024 * 1024)
                      done = False
                      while not done: _, done = downloader.next_chunk(num_retries=2)
                  return jsonify(ok=True, file_id=file_id, destination=str(target), size=target.stat().st_size)
              except Exception as exc:
                  log("Drive download error: " + repr(exc))
                  return jsonify(ok=False, error=str(exc)), 502

          @app.post("/drive/upload")
          @public_auth
          def drive_upload():
              body = request.get_json(silent=True) or {}
              try:
                  source = safe_path(body.get("source", ""))
                  if not source.is_file(): return jsonify(ok=False, error="source file not found", source=str(source)), 404
                  metadata = {"name": str(body.get("filename") or source.name)}
                  folder_id = str(body.get("drive_folder_id", "root"))
                  if folder_id and folder_id != "root": metadata["parents"] = [folder_id]
                  return jsonify(ok=True, file=upload_drive_file(source, metadata))
              except Exception as exc:
                  log("Drive upload error: " + repr(exc))
                  return jsonify(ok=False, error=str(exc)), 502

          @app.post("/github/release/upload")
          @public_auth
          def release_upload():
              body = request.get_json(silent=True) or {}
              try:
                  source = safe_path(body.get("source", ""))
                  if not source.is_file(): return jsonify(ok=False, error="source file not found"), 404
                  result = github_release_upload(source, body.get("tag", ""), body.get("filename", ""),
                      body.get("release_name", ""), body.get("release_notes", ""))
                  return jsonify(result)
              except Exception as exc:
                  log("GitHub Release upload error: " + repr(exc))
                  return jsonify(ok=False, error=str(exc)), 502

          @app.post("/unreal/screenshot")
          @public_auth
          def screenshot():
              out = ROOT / "Screenshots" / ("ue_" + time.strftime("%Y%m%d_%H%M%S") + ".png")
              out.parent.mkdir(parents=True, exist_ok=True)
              target = str(out).replace("\\", "/")
              code = ("import unreal\nworld = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()\n" +
                  "unreal.SystemLibrary.execute_console_command(world, 'HighResShot 1920x1080 filename=\"" + target + "\"')\n" + repr("SCREENSHOT_REQUESTED " + target))
              result, status = queue_unreal(code, 45)
              if status != 200 or not result.get("ok"): return jsonify(result), status if status != 200 else 502
              deadline = time.time() + 30
              while time.time() < deadline:
                  if out.is_file() and out.stat().st_size > 0: return send_file(out, mimetype="image/png", as_attachment=True, download_name=out.name)
                  time.sleep(1)
              return jsonify(ok=False, error="screenshot_file_not_created", expected_path=str(out)), 502

          @app.get("/logs")
          @public_auth
          def logs():
              chunks = []
              for path in (LOG_FILE, LOG_DIR / "unreal_bridge.log", ROOT / "UEControl" / "Saved" / "Logs" / "UnrealEditor.log"):
                  if path.is_file():
                      chunks.append("===== " + path.name + " =====\n" + path.read_text(encoding="utf-8", errors="replace")[-50000:])
              return app.response_class("\n\n".join(chunks) or "No logs yet.", mimetype="text/plain")

          # MCP server (MCP Python SDK v2). Public MCP has no authentication in this test workflow.
          from contextlib import asynccontextmanager
          from starlette.applications import Starlette
          from starlette.middleware.wsgi import WSGIMiddleware
          from starlette.routing import Mount
          from mcp.server.mcpserver import MCPServer
          from mcp.server.transport_security import TransportSecuritySettings
          import uvicorn

          mcp_server = MCPServer("unreal-engine-remote-control", instructions=(
              "Remote tools for Unreal Editor 5.8.4. Tools can execute arbitrary Python in the editor. "
              "The file workspace is restricted to D:\\UE58. Destructive edits should be confirmed."
          ))

          def mcp_json(value):
              return json.dumps(value, ensure_ascii=False, default=str)

          @mcp_server.tool()
          def unreal_execute_python(code: str, timeout_seconds: int = 60) -> str:
              """Execute Python inside the running Unreal Editor; this can change the scene/project."""
              result, status = queue_unreal(code, timeout_seconds)
              return mcp_json(result if status == 200 else {**result, "http_status": status})

          @mcp_server.tool()
          def unreal_get_engine_version() -> str:
              """Return engine version reported by the active Unreal Editor."""
              result, status = queue_unreal("import unreal\nunreal.SystemLibrary.get_engine_version()", 30)
              return mcp_json(result if status == 200 else {**result, "http_status": status})

          @mcp_server.tool()
          def unreal_list_projects() -> str:
              """List .uproject files under D:\\UE58\\Projects and D:\\UE58\\UEControl."""
              found = []
              for base in (ROOT / "Projects", ROOT / "UEControl"):
                  if base.exists():
                      for item in base.rglob("*.uproject"):
                          found.append({"name": item.stem, "project_file": str(item), "directory": str(item.parent)})
              found.sort(key=lambda x: x["name"].lower())
              return mcp_json({"ok": True, "count": len(found), "projects": found})

          @mcp_server.tool()
          def unreal_list_files(path: str = "", recursive: bool = False, limit: int = 200) -> str:
              """List files and directories inside D:\\UE58."""
              try:
                  folder = ROOT if not str(path).strip() else safe_path(path)
                  if not folder.is_dir(): return mcp_json({"ok": False, "error": "directory not found", "path": str(folder)})
                  limit = max(1, min(500, int(limit)))
                  iterator = folder.rglob("*") if recursive else folder.iterdir()
                  items = []
                  for item in iterator:
                      try: items.append({"name": item.name, "path": str(item), "is_directory": item.is_dir(), "size": None if item.is_dir() else item.stat().st_size})
                      except OSError: continue
                      if len(items) >= limit: break
                  return mcp_json({"ok": True, "path": str(folder), "count": len(items), "limit": limit, "truncated_or_limited": len(items) >= limit, "items": items})
              except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def unreal_read_text_file(path: str, max_chars: int = 20000) -> str:
              """Read a UTF-8 text file inside D:\\UE58."""
              try:
                  target = safe_path(path)
                  if not target.is_file(): return mcp_json({"ok": False, "error": "file not found", "path": str(target)})
                  max_chars = max(1, min(100000, int(max_chars)))
                  with target.open("r", encoding="utf-8-sig", errors="replace") as stream: content = stream.read(max_chars + 1)
                  return mcp_json({"ok": True, "path": str(target), "content": content[:max_chars], "truncated": len(content) > max_chars})
              except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def unreal_write_text_file(path: str, content: str) -> str:
              """Write a UTF-8 text file inside D:\\UE58, creating parent folders if needed."""
              try:
                  if len(content) > 2000000: return mcp_json({"ok": False, "error": "content exceeds 2 MB"})
                  target = safe_path(path); target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(content, encoding="utf-8")
                  return mcp_json({"ok": True, "path": str(target), "size": target.stat().st_size})
              except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def google_drive_list_files(folder_id: str = "root", page_size: int = 100) -> str:
              """List files in a Google Drive folder available to GG_UE_TOKEN."""
              try:
                  folder_id = str(folder_id or "root"); page_size = max(1, min(1000, int(page_size)))
                  query = "trashed = false"
                  if folder_id != "*": query += " and '" + folder_id.replace("'", "") + "' in parents"
                  result = google_drive().files().list(q=query, pageSize=page_size, orderBy="name", fields="files(id,name,mimeType,size,modifiedTime,webViewLink,parents)").execute(num_retries=2)
                  return mcp_json({"ok": True, "count": len(result.get("files", [])), "files": result.get("files", [])})
              except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def google_drive_download_file(file_id: str, destination: str) -> str:
              """Download a Google Drive file to a path under D:\\UE58."""
              try:
                  target = safe_path(destination); target.parent.mkdir(parents=True, exist_ok=True)
                  from googleapiclient.http import MediaIoBaseDownload
                  media = google_drive().files().get_media(fileId=file_id)
                  with target.open("wb") as handle:
                      downloader = MediaIoBaseDownload(handle, media, chunksize=8 * 1024 * 1024); done = False
                      while not done: _, done = downloader.next_chunk(num_retries=2)
                  return mcp_json({"ok": True, "file_id": file_id, "destination": str(target), "size": target.stat().st_size})
              except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def google_drive_upload_file(source: str, drive_folder_id: str = "root", filename: str = "") -> str:
              """Upload a file from D:\\UE58 to Google Drive."""
              try:
                  target = safe_path(source)
                  if not target.is_file(): return mcp_json({"ok": False, "error": "source file not found", "source": str(target)})
                  metadata = {"name": filename or target.name}
                  if drive_folder_id and drive_folder_id != "root": metadata["parents"] = [drive_folder_id]
                  return mcp_json({"ok": True, "file": upload_drive_file(target, metadata)})
              except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def github_release_upload_file(source: str, tag: str, filename: str = "", release_name: str = "", release_notes: str = "") -> str:
              """Upload a file to a release in the current repository; large files are split into sub-2GB assets."""
              try:
                  target = safe_path(source)
                  if not target.is_file(): return mcp_json({"ok": False, "error": "source file not found", "source": str(target)})
                  return mcp_json(github_release_upload(target, tag, filename, release_name, release_notes))
              except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def unreal_take_screenshot(timeout_seconds: int = 60) -> str:
              """Capture a 1920x1080 Unreal screenshot and return its saved path."""
              out = ROOT / "Screenshots" / ("ue_mcp_" + time.strftime("%Y%m%d_%H%M%S") + ".png")
              target = str(out).replace("\\", "/")
              code = ("import unreal\nworld = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()\n" +
                      "unreal.SystemLibrary.execute_console_command(world, 'HighResShot 1920x1080 filename=\\\"" + target + "\\\"')\n" + repr("SCREENSHOT_REQUESTED " + target))
              result, status = queue_unreal(code, timeout_seconds)
              if status != 200 or not result.get("ok"): return mcp_json(result)
              deadline = time.time() + 30
              while time.time() < deadline:
                  if out.is_file() and out.stat().st_size > 0: return mcp_json({"ok": True, "path": str(out), "size": out.stat().st_size})
                  time.sleep(1)
              return mcp_json({"ok": False, "error": "screenshot_file_not_created"})

          @mcp_server.tool()
          def unreal_rename_project(project_file: str, new_name: str) -> str:
              """Rename an existing .uproject file under D:\\UE58 (not its parent folder)."""
              try:
                  source = safe_path(project_file); new_name = str(new_name).strip()
                  if not re.fullmatch(r"[A-Za-z0-9_-]{1,80}", new_name): return mcp_json({"ok": False, "error": "invalid new_name"})
                  if source.suffix.lower() != ".uproject" or not source.is_file(): return mcp_json({"ok": False, "error": "existing .uproject file required"})
                  target = source.with_name(new_name + ".uproject")
                  if target.exists() and target != source: return mcp_json({"ok": False, "error": "target already exists"})
                  source.rename(target)
                  return mcp_json({"ok": True, "old_path": str(source), "project_file": str(target)})
              except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

          mcp_app = mcp_server.streamable_http_app(
              streamable_http_path="/",
              transport_security=TransportSecuritySettings(enable_dns_rebinding_protection=False),
              host="0.0.0.0"
          )

          @asynccontextmanager
          async def lifespan(asgi_app):
              async with mcp_server.session_manager.run():
                  yield

          combined_app = Starlette(routes=[Mount("/mcp", app=mcp_app), Mount("/", app=WSGIMiddleware(app))], lifespan=lifespan)

          if __name__ == "__main__":
              if not BRIDGE_TOKEN: raise RuntimeError("BRIDGE_TOKEN must be set")
              log("Starting REST API on 127.0.0.1:8765; MCP endpoint=/mcp/")
              uvicorn.run(combined_app, host="127.0.0.1", port=8765, log_level="info")
          '@
          Set-Content -LiteralPath "$root\api_server.py" -Value $api -Encoding utf8
          Write-Host 'Created UE project, bridge, and API server.'

      - name: Launch API, Unreal and Cloudflare tunnel
        shell: pwsh
        env:
          GG_UE_TOKEN: ${{ secrets.GG_UE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\UE58'
          $env:UE_ROOT = $root
          if ([string]::IsNullOrWhiteSpace($env:GG_UE_TOKEN)) {
            Write-Warning 'GG_UE_TOKEN is empty; Google Drive endpoints will fail until authorized_user.json or service-account JSON is saved as this Actions secret.'
          }

          # The bridge token is only for local API <-> Unreal communication.
          $env:BRIDGE_TOKEN = [guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')
          $python = (Get-Command python).Source
          & $python -m pip install --disable-pip-version-check --upgrade Flask google-api-python-client google-auth google-auth-httplib2 requests urllib3 "mcp>=2,<3" uvicorn starlette
          if ($LASTEXITCODE -ne 0) { throw 'Python package installation failed.' }

          $apiOut = "$root\Logs\api-stdout.log"
          $apiErr = "$root\Logs\api-stderr.log"
          $apiProc = Start-Process -FilePath $python -ArgumentList @("$root\api_server.py") -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput $apiOut -RedirectStandardError $apiErr
          Write-Host "API_PID=$($apiProc.Id)"

          $localReady = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4
              if ($health.ok) { $localReady = $true; break }
            } catch { }
            if ($apiProc.HasExited) { break }
          }
          if (-not $localReady) {
            if (Test-Path $apiErr) { Get-Content $apiErr -Tail 100 }
            if (Test-Path $apiOut) { Get-Content $apiOut -Tail 100 }
            throw 'Local API did not start.'
          }
          Write-Host 'API_LOCAL_READY=true'

          # API already inherited the Drive and GitHub credentials when it started.
          # Keep only the local bridge token available to the Unreal child process.
          $env:GG_UE_TOKEN = $null
          $env:GITHUB_TOKEN = $null
          $env:GITHUB_REPOSITORY = $null

          $editor = $env:UE_EDITOR_EXE
          if ([string]::IsNullOrWhiteSpace($editor) -or -not (Test-Path -LiteralPath $editor)) {
            throw 'UE_EDITOR_EXE was not found from the extraction step.'
          }
          Write-Host "Unreal Editor found: $editor"
          $ueOut = "$root\Logs\unreal-stdout.log"
          $ueErr = "$root\Logs\unreal-stderr.log"
          $ueArgs = @("$root\UEControl\UEControl.uproject", '-log', '-stdout', '-FullStdOutLogOutput', '-AllowSoftwareRendering', '-d3d11')
          $ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory "$root\UEControl" -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError $ueErr
          Write-Host "UNREAL_PID=$($ueProc.Id)"

          $cloudflared = "$root\cloudflared.exe"
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $cloudflared
          $cfOut = "$root\Logs\cloudflared-stdout.log"
          $cfErr = "$root\Logs\cloudflared-stderr.log"
          $cfProc = Start-Process -FilePath $cloudflared -ArgumentList @('tunnel', '--url', 'http://127.0.0.1:8765', '--no-autoupdate') -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput $cfOut -RedirectStandardError $cfErr

          $publicUrl = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            $combined = ''
            foreach ($f in @($cfOut, $cfErr)) {
              if (Test-Path $f) { try { $combined += "`n" + (Get-Content $f -Raw -ErrorAction SilentlyContinue) } catch { } }
            }
            $match = [regex]::Match($combined, 'https://[a-zA-Z0-9-]+\.trycloudflare\.com')
            if ($match.Success) { $publicUrl = $match.Value; break }
            if ($cfProc.HasExited) { break }
          }
          if (-not $publicUrl) {
            if (Test-Path $cfErr) { Get-Content $cfErr -Tail 100 }
            throw 'Cloudflare Quick Tunnel did not provide a public URL.'
          }
          Write-Host "PUBLIC_API_URL=$publicUrl"

          Write-Host 'Waiting up to 3 minutes for the Unreal Python bridge...'
          $bridgeReady = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4
              if ($health.bridge_connected) { $bridgeReady = $true; break }
            } catch { }
            if ($ueProc.HasExited) { Write-Warning 'Unreal Editor exited before the Python bridge connected.'; break }
          }
          if ($bridgeReady) { Write-Host 'BRIDGE_READY=true' } else { Write-Warning 'BRIDGE_READY=false; inspect unreal-stdout.log, unreal-stderr.log and /logs.' }

          Write-Host 'REST endpoints: GET /health, POST /command, GET /projects, POST /projects/rename, POST /files/upload, GET /files/download, GET /files/read, PUT /files/write, POST /drive/list, POST /drive/download, POST /drive/upload, POST /github/release/upload, POST /unreal/screenshot, GET /logs'
          Write-Host "MCP_ENDPOINT=$publicUrl/mcp/"
          Write-Host 'MCP tools: unreal_execute_python, unreal_get_engine_version, unreal_list_projects, unreal_rename_project, unreal_list_files, unreal_read_text_file, unreal_write_text_file, google_drive_list_files, google_drive_download_file, google_drive_upload_file, github_release_upload_file, unreal_take_screenshot'
          Write-Warning 'This is an unauthenticated temporary public endpoint. Anyone with its URL may control Unreal and access workspace files. Do not share it; stop the workflow when testing is finished.'

          $lastHeartbeat = Get-Date
          while ($true) {
            Start-Sleep -Seconds 60
            if ($apiProc.HasExited) { throw 'API server stopped; inspect D:\UE58\Logs\api-stderr.log.' }
            if ($cfProc.HasExited) { throw 'Cloudflare tunnel stopped; inspect D:\UE58\Logs\cloudflared-stderr.log.' }
            if ($ueProc.HasExited) { throw "Unreal Editor stopped with exit code $($ueProc.ExitCode); inspect D:\UE58\Logs\unreal-stdout.log, unreal-stderr.log and UEControl\Saved\Logs." }
            if (((Get-Date) - $lastHeartbeat).TotalMinutes -ge 30) {
              try {
                $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4
                Write-Host ("Heartbeat {0}: API_OK={1} BRIDGE_CONNECTED={2}" -f (Get-Date), $h.ok, $h.bridge_connected)
              } catch { Write-Warning ("Heartbeat {0}: local health check failed." -f (Get-Date)) }
              $lastHeartbeat = Get-Date
            }
          }
