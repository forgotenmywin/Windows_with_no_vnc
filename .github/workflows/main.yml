name: UE 5.8 Remote Studio - Advanced Live Control + Headless Commandlets + Windows Optimization (MCP SSE 502 Fix)
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  ue-remote:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Prepare D drive
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $root = ''D:\UE58''

        New-Item -ItemType Directory -Force -Path $root, "$root\parts", "$root\Logs", "$root\Projects", "$root\Screenshots",
        "$root\Uploads" | Out-Null

        try { Start-Transcript -Path "$root\Logs\workflow-prepare-transcript.log" -Append -Force | Out-Null } catch { }

        $drive = Get-PSDrive D -ErrorAction SilentlyContinue

        if (-not $drive) { throw ''Drive D is not available on this runner.'' }

        Write-Host ("D: available space: {0:N2} GB" -f ($drive.Free / 1GB))

        "UE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        '
    - name: Download and extract Unreal Engine 5.8
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\ntry { Start-Transcript -Path \"$root\\Logs\\workflow-extract-transcript.log\"\
        \ -Append -Force | Out-Null } catch { }\n$partsDir = \"$root\\parts\"\n$archive = \"$root\\UE_5.8.zip\"\n$extract\
        \ = \"$root\\Extracted\"\n\ngh release download ue5.8 --repo forgotenmywin/Windows_with_no_vnc --pattern 'UE_5.8.zip.*'\
        \ --dir $partsDir --clobber\nif ($LASTEXITCODE -ne 0) { throw 'Could not download release assets UE_5.8.zip.*.' }\n\
        \n$parts = @(Get-ChildItem -LiteralPath $partsDir -File | Where-Object { $_.Name -like 'UE_5.8.zip.*' } | Sort-Object\
        \ Name)\nif ($parts.Count -lt 2) { throw \"Expected split ZIP parts; found $($parts.Count). Check release tag/assets.\"\
        \ }\n\nif (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }\n$destination = [System.IO.File]::Open($archive,\
        \ [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)\ntry {\n  $buffer =\
        \ New-Object byte[] (4MB)\n  foreach ($part in $parts) {\n    Write-Host (\"Joining {0} ({1:N2} GB)\" -f $part.Name,\
        \ ($part.Length / 1GB))\n    $source = [System.IO.File]::OpenRead($part.FullName)\n    try {\n      while (($read\
        \ = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {\n        $destination.Write($buffer, 0, $read)\n      }\n \
        \   }\n    finally { $source.Dispose() }\n  }\n}\nfinally { $destination.Dispose() }\n\n$sevenZip = (Get-Command 7z.exe\
        \ -ErrorAction SilentlyContinue).Source\nif (-not $sevenZip) {\n  $sevenZip = @('C:\\Program Files\\7-Zip\\7z.exe','C:\\\
        Program Files (x86)\\7-Zip\\7z.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1\n}\nif (-not $sevenZip)\
        \ {\n  choco install 7zip -y --no-progress\n  if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }\n  $sevenZip\
        \ = 'C:\\Program Files\\7-Zip\\7z.exe'\n}\nif (-not (Test-Path -LiteralPath $sevenZip)) { throw '7z.exe was not found.'\
        \ }\n\n& $sevenZip t $archive\nif ($LASTEXITCODE -ne 0) { throw 'Joined ZIP failed integrity testing.' }\nif (Test-Path\
        \ -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }\nNew-Item -ItemType Directory -Force\
        \ -Path $extract | Out-Null\n& $sevenZip x $archive \"-o$extract\" -y\nif ($LASTEXITCODE -ne 0) { throw 'Unreal Engine\
        \ extraction failed.' }\n\n$editor = Get-ChildItem -LiteralPath $extract -Filter UnrealEditor.exe -File -Recurse -ErrorAction\
        \ SilentlyContinue |\n  Where-Object { $_.FullName -match '\\\\Engine\\\\Binaries\\\\Win64\\\\UnrealEditor\\.exe$'\
        \ } |\n  Select-Object -First 1\nif (-not $editor) { throw 'UnrealEditor.exe was not found.' }\nWrite-Host \"EDITOR_EXE=$($editor.FullName)\"\
        \n\"UE_EDITOR_EXE=$($editor.FullName)\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Create UE project, bridge and API server
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\ntry { Start-Transcript -Path \"$root\\Logs\\workflow-setup-transcript.log\"\
        \ -Append -Force | Out-Null } catch { }\n$project = \"$root\\UEControl\"\n$pythonDir = \"$project\\Content\\Python\"\
        \n$config = \"$project\\Config\"\nNew-Item -ItemType Directory -Force -Path $pythonDir, $config, \"$root\\Projects\"\
        , \"$root\\Screenshots\", \"$root\\Uploads\", \"$root\\Logs\" | Out-Null\n\n$uproject = @'\n{\n  \"FileVersion\":\
        \ 3,\n  \"EngineAssociation\": \"5.8\",\n  \"Category\": \"RemoteControl\",\n  \"Description\": \"Unreal Editor controlled\
        \ through a remote API bridge\",\n  \"Plugins\": [\n    { \"Name\": \"PythonScriptPlugin\", \"Enabled\": true },\n\
        \    { \"Name\": \"EditorScriptingUtilities\", \"Enabled\": true },\n    { \"Name\": \"ModelContextProtocol\", \"\
        Enabled\": true },\n    { \"Name\": \"AllToolsets\", \"Enabled\": true },\n    { \"Name\": \"GLTFExporter\", \"Enabled\"\
        : true }\n  ]\n}\n'@\nSet-Content -LiteralPath \"$project\\UEControl.uproject\" -Value $uproject -Encoding utf8\n\n\
        $engineConfig = @'\n[/Script/EngineSettings.GameMapsSettings]\nEditorStartupMap=/Engine/Maps/Entry\nGameDefaultMap=/Engine/Maps/Entry\n\
        \n[/Script/PythonScriptPlugin.PythonScriptPluginSettings]\n+StartupScripts=D:/UE58/UEControl/Content/Python/init_unreal.py\n\
        bDeveloperMode=True\nbRemoteExecution=False\n\n[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]\n\
        bAutoStartServer=True\nServerPortNumber=8000\nServerUrlPath=/mcp\nbEnableToolSearch=True\n'@\nSet-Content -LiteralPath\
        \ \"$config\\DefaultEngine.ini\" -Value $engineConfig -Encoding utf8\n\n$bridge = @'\nimport ast\nimport builtins\n\
        import contextlib\nimport io\nimport json\nimport os\nimport queue\nimport threading\nimport time\nimport traceback\n\
        import urllib.request\n\nROOT = os.environ.get(\"UE_ROOT\", r\"D:\\UE58\")\nLOG_FILE = os.path.join(ROOT, \"Logs\"\
        , \"unreal_bridge.log\")\nAPI = \"http://127.0.0.1:8766\"\nTOKEN = os.environ.get(\"BRIDGE_TOKEN\", \"\")\nINCOMING\
        \ = queue.Queue()\nOUTGOING = queue.Queue()\nEDITOR_TICK_AT = 0.0\nJOB_QUEUE_TTL_SECONDS = 45.0\nNAMESPACE = {\"__name__\"\
        : \"__ue_remote__\"}\n\n\ndef log(message):\n    line = time.strftime(\"%Y-%m-%d %H:%M:%S \") + str(message)\n   \
        \ try:\n        os.makedirs(os.path.dirname(LOG_FILE), exist_ok=True)\n        with open(LOG_FILE, \"a\", encoding=\"\
        utf-8\") as stream:\n            stream.write(line + \"\\n\")\n    except Exception:\n        pass\n    try:\n   \
        \     unreal.log(\"[UE58 Remote Bridge] \" + str(message))\n    except Exception:\n        pass\n\n\nlog(\"Startup\
        \ file loaded; token_present=%s; python=%s\" % (bool(TOKEN), __import__(\"sys\").version.split()[0]))\n\ntry:\n  \
        \  import unreal\nexcept Exception:\n    log(\"FATAL: cannot import Unreal Python module:\\n\" + traceback.format_exc())\n\
        \    raise\n\nif not TOKEN:\n    log(\"FATAL: BRIDGE_TOKEN is missing from Unreal process environment\")\n    raise\
        \ RuntimeError(\"BRIDGE_TOKEN missing\")\n\nif getattr(builtins, \"_UE58_REMOTE_BRIDGE_ACTIVE\", False):\n    log(\"\
        Duplicate startup invocation ignored; bridge is already active\")\nelse:\n    PREVIEW_GEOMETRY_READY = False\n   \
        \ PREVIEW_GEOMETRY_LAST_LOG = 0.0\n\n    def ensure_preview_geometry():\n        \"\"\"Keep the default empty UEControl\
        \ level visibly testable; never alter a level that already has meshes.\"\"\"\n        global PREVIEW_GEOMETRY_READY,\
        \ PREVIEW_GEOMETRY_LAST_LOG\n        if PREVIEW_GEOMETRY_READY:\n            return True\n        try:\n         \
        \   world = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()\n            if world is\
        \ None:\n                return False\n            actors = unreal.EditorLevelLibrary.get_all_level_actors()\n   \
        \         mesh_component_count = 0\n            for actor in actors:\n                # Count BOTH static and skeletal\
        \ mesh components. Without this,\n                # an actor such as a dinosaur (SkeletalMeshActor) is misidentified\n\
        \                # as an empty level and preview cubes/spheres are injected over it.\n                try:\n     \
        \               components = actor.get_components_by_class(unreal.StaticMeshComponent)\n                    for component\
        \ in components:\n                        if component.get_editor_property(\"static_mesh\") is not None:\n       \
        \                     mesh_component_count += 1\n                except Exception:\n                    pass\n   \
        \             try:\n                    skeletal_components = actor.get_components_by_class(unreal.SkeletalMeshComponent)\n\
        \                    for component in skeletal_components:\n                        if component.get_editor_property(\"\
        skeletal_mesh\") is not None:\n                            mesh_component_count += 1\n                except Exception:\n\
        \                    pass\n            if mesh_component_count > 0:\n                PREVIEW_GEOMETRY_READY = True\n\
        \                log(\"Active level already contains %s static mesh component(s); preview geometry was not added\"\
        \ % mesh_component_count)\n                return True\n\n            shapes = (\n                (\"/Engine/BasicShapes/Plane\"\
        , \"UE58 Preview Ground\", (0, 0, -8), (8, 8, 1)),\n                (\"/Engine/BasicShapes/Cube\", \"UE58 Preview\
        \ Cube\", (0, 0, 150), (2, 2, 2)),\n                (\"/Engine/BasicShapes/Sphere\", \"UE58 Preview Sphere\", (260,\
        \ 0, 100), (2, 2, 2)),\n                (\"/Engine/BasicShapes/Cylinder\", \"UE58 Preview Cylinder\", (-260, 0, 100),\
        \ (1.5, 1.5, 2)),\n            )\n            spawned = []\n            for asset_path, label, position, scale in\
        \ shapes:\n                try:\n                    mesh_asset = unreal.EditorAssetLibrary.load_asset(asset_path)\n\
        \                    if mesh_asset is None:\n                        log(\"Preview asset unavailable: \" + asset_path)\n\
        \                        continue\n                    actor = unreal.EditorLevelLibrary.spawn_actor_from_object(\n\
        \                        mesh_asset,\n                        unreal.Vector(float(position[0]), float(position[1]),\
        \ float(position[2])),\n                        unreal.Rotator(0.0, 0.0, 0.0),\n                    )\n          \
        \          if actor is None:\n                        continue\n                    actor.set_actor_label(label)\n\
        \                    actor.set_actor_scale3d(unreal.Vector(float(scale[0]), float(scale[1]), float(scale[2])))\n \
        \                   spawned.append(actor)\n                except Exception as shape_error:\n                    log(\"\
        Preview shape failed (%s): %s\" % (label, shape_error))\n\n            if not any(label == \"UE58 Preview Cube\" for\
        \ label in [a.get_actor_label() for a in spawned]):\n                raise RuntimeError(\"Could not create the preview\
        \ cube from /Engine/BasicShapes/Cube\")\n\n            # A point light makes the preview geometry visible in the Editor\
        \ viewport and in GLB viewers.\n            try:\n                light = unreal.EditorLevelLibrary.spawn_actor_from_class(\n\
        \                    unreal.PointLight,\n                    unreal.Vector(0.0, -350.0, 650.0),\n                \
        \    unreal.Rotator(0.0, 0.0, 0.0),\n                )\n                if light:\n                    light.set_actor_label(\"\
        UE58 Preview Light\")\n                    component = light.get_component_by_class(unreal.PointLightComponent)\n\
        \                    if component:\n                        component.set_editor_property(\"intensity\", 15000.0)\n\
        \                        component.set_editor_property(\"attenuation_radius\", 1800.0)\n            except Exception\
        \ as light_error:\n                log(\"Preview light could not be created: \" + str(light_error))\n\n          \
        \  # Point the Editor viewport toward the preview so HighResShot is not aimed at empty space.\n            try:\n\
        \                editor_subsystem = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem)\n                editor_subsystem.set_level_viewport_camera_info(\n\
        \                    unreal.Vector(1050.0, -1450.0, 900.0),\n                    unreal.Rotator(-27.0, 126.0, 0.0),\n\
        \                )\n            except Exception as camera_error:\n                log(\"Preview viewport camera could\
        \ not be positioned: \" + str(camera_error))\n\n            PREVIEW_GEOMETRY_READY = True\n            log(\"EMPTY_LEVEL_PREVIEW_CREATED=true\
        \ meshes=%s; delete actors prefixed 'UE58 Preview' when importing your own scene\" % len(spawned))\n            return\
        \ True\n        except Exception:\n            now = time.time()\n            if now - PREVIEW_GEOMETRY_LAST_LOG >\
        \ 10:\n                log(\"Preview geometry initialization failed:\\\\n\" + traceback.format_exc()[-1800:])\n  \
        \              PREVIEW_GEOMETRY_LAST_LOG = now\n            return False\n\n    def request_json(path, payload=None, timeout=12):\n        data = None if payload is None else json.dumps(payload).encode('utf-8')\n        req = urllib.request.Request(\n            API + path,\n            data=data,\n            headers={\n                'Authorization': 'Bearer ' + TOKEN,\n                'Content-Type': 'application/json',\n                'Accept': 'application/json',\n                'Connection': 'close',\n            },\n            method='GET' if payload is None else 'POST',\n        )\n        with urllib.request.urlopen(req, timeout=timeout) as response:\n            raw_response = response.read().decode('utf-8')\n            return json.loads(raw_response) if raw_response else {}\n\n    def execute_code(source):\n        captured = io.StringIO()\n        error = \"\"\n      \
        \  try:\n            parsed = ast.parse(source, filename=\"<remote-unreal-python>\", mode=\"exec\")\n            with\
        \ contextlib.redirect_stdout(captured), contextlib.redirect_stderr(captured):\n                if parsed.body and\
        \ isinstance(parsed.body[-1], ast.Expr):\n                    prefix = ast.Module(body=parsed.body[:-1], type_ignores=[])\n\
        \                    if prefix.body:\n                        exec(compile(prefix, \"<remote-unreal-python>\", \"\
        exec\"), NAMESPACE, NAMESPACE)\n                    value = eval(\n                        compile(ast.Expression(parsed.body[-1].value),\
        \ \"<remote-unreal-python>\", \"eval\"),\n                        NAMESPACE,\n                        NAMESPACE,\n\
        \                    )\n                    if value is not None:\n                        print(repr(value))\n  \
        \              else:\n                    exec(compile(parsed, \"<remote-unreal-python>\", \"exec\"), NAMESPACE, NAMESPACE)\n\
        \        except Exception as exc:\n            error = \"\".join(traceback.format_exception(type(exc), exc, exc.__traceback__))\n\
        \        output = captured.getvalue().strip()\n        if not output and not error:\n            output = \"Executed\
        \ successfully (no output).\"\n        return output, error\n\n    def network_worker():\n        log(\"Bridge network\
        \ worker started; connecting to local API\")\n        connected_logged = False\n        last_error_log = 0.0\n   \
        \     while True:\n            try:\n                while True:\n                    try:\n                     \
        \   payload = OUTGOING.get_nowait()\n                    except queue.Empty:\n                        break\n    \
        \                try:\n                        request_json(\"/internal/result\", payload, timeout=12)\n          \
        \          except Exception as exc:\n                        OUTGOING.put(payload)\n                        time.sleep(0.5)\n                        log(\"Posting execution result failed: \" + repr(exc))\n\
        \n                # This authenticated poll is also the bridge heartbeat. The API\n                # marks the bridge\
        \ online only after it receives this request.\n                reply = request_json(\"/internal/next\", {\"wait\"\
        : 1, \"editor_tick_at\": EDITOR_TICK_AT}, timeout=12)\n                if not connected_logged:\n                 \
        \   log(\"Authenticated connection to local API established\")\n                    connected_logged = True\n    \
        \            job = reply.get(\"job\") if isinstance(reply, dict) else None\n                if job:\n            \
        \        INCOMING.put(job)\n            except Exception as exc:\n                connected_logged = False\n     \
        \           now = time.time()\n                if now - last_error_log >= 5:\n                    log(\"Local API\
        \ polling failed: \" + repr(exc))\n                    last_error_log = now\n                time.sleep(1.0)\n\n \
        \   def editor_tick(delta_seconds):\n        # This value is read by the separate network worker and forwarded to\n\
        \        # the API. It proves that the actual Unreal Editor thread is ticking.\n        global EDITOR_TICK_AT\n  \
        \      EDITOR_TICK_AT = time.time()\n\n        if not PREVIEW_GEOMETRY_READY:\n            ensure_preview_geometry()\n\
        \        try:\n            job = INCOMING.get_nowait()\n        except queue.Empty:\n            return\n\n      \
        \  job_id = str(job.get(\"id\", \"\"))\n        created_at = job.get(\"created_at\", EDITOR_TICK_AT)\n        try:\n\
        \            queue_age = max(0.0, EDITOR_TICK_AT - float(created_at))\n        except (TypeError, ValueError):\n \
        \           queue_age = 0.0\n\n        # Never execute an old command minutes after a blocked modal dialog or\n  \
        \      # a stalled Editor has recovered. Return an explicit result instead.\n        if queue_age > JOB_QUEUE_TTL_SECONDS:\n\
        \            error = \"Command expired in the Unreal Editor queue after %.1f seconds; submit it again.\" % queue_age\n\
        \            log(\"Discarding expired remote Python job %s; age=%.1fs\" % (job_id, queue_age))\n            OUTGOING.put({\"\
        id\": job_id, \"output\": \"\", \"error\": error})\n            return\n\n        started = time.perf_counter()\n\
        \        log(\"Executing remote Python job %s; queue_age=%.3fs\" % (job_id, queue_age))\n        output, error = execute_code(job.get(\"\
        code\", \"\"))\n        elapsed = time.perf_counter() - started\n        log(\"Remote Python job %s finished; duration=%.3fs\
        \ error=%s\" % (job_id, elapsed, bool(error)))\n        OUTGOING.put({\"id\": job_id, \"output\": output, \"error\"\
        : error})\n\n    try:\n        CALLBACK_HANDLE = unreal.register_slate_post_tick_callback(editor_tick)\n        threading.Thread(target=network_worker,\
        \ name=\"UE58-Remote-Network\", daemon=True).start()\n        builtins._UE58_REMOTE_BRIDGE_ACTIVE = True\n       \
        \ version = unreal.SystemLibrary.get_engine_version()\n        log(\"BRIDGE_READY; UE_VERSION=\" + str(version))\n\
        \        print(\"UE_REMOTE_BRIDGE_READY \" + str(version))\n    except Exception:\n        log(\"FATAL: bridge registration\
        \ failed:\\n\" + traceback.format_exc())\n        raise\n\n'@\nSet-Content -LiteralPath \"$pythonDir\\init_unreal.py\"\
        \ -Value $bridge -Encoding utf8\n\n$api = @'\nimport asyncio, base64, binascii, contextlib, hashlib, io, json, os,\
        \ queue, re, secrets, shutil, tempfile, threading, time, traceback, uuid, textwrap\nfrom collections import deque\n\
        from pathlib import Path\nfrom functools import wraps\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom flask import Flask, jsonify, request, send_file\n\napp\
        \ = Flask(__name__)\napp.config[\"MAX_CONTENT_LENGTH\"] = 8 * 1024 * 1024 * 1024\nROOT = Path(os.environ.get(\"UE_ROOT\"\
        , r\"D:\\UE58\")).resolve()\nLOG_DIR = ROOT / \"Logs\"\nLOG_DIR.mkdir(parents=True, exist_ok=True)\nLOG_FILE = LOG_DIR\
        \ / \"api.log\"\nBRIDGE_TOKEN = os.environ.get(\"BRIDGE_TOKEN\", \"\")\nFILE_MANAGER_USERNAME = \"viewer\"\nFILE_MANAGER_PASSWORD\
        \ = os.environ.get(\"MONITOR_PASSWORD\", \"\")\n# FILE_MANAGER_PASSWORD remains the Actions secret name for backward\
        \ compatibility.\nVIEWER_TOKEN = os.environ.get(\"VIEWER_TOKEN\", \"\")\nVIEWER_EXE_PATH = (ROOT / \"Viewer\" / \"\
        UE58SceneViewer.exe\").resolve()\nMONITOR_LOCK = threading.RLock()\nMONITOR_EVENTS = deque(maxlen=100)\nMCP_CONNECTION\
        \ = {\n    \"request_count\": 0, \"last_seen\": 0.0, \"last_method\": \"\",\n    \"last_path\": \"\", \"last_status\"\
        : None, \"last_error\": \"\",\n    \"session_fallback_count\": 0, \"last_session_seen\": 0.0\n}\nMCP_SESSION_LOCK\
        \ = threading.RLock()\nMCP_NATIVE_SESSIONS = {}\n# Public endpoint speaks the current stateless MCP protocol while\
        \ Unreal 5.8's\n# built-in ModelContextProtocol server still uses the 2025-11-25 handshake.\nMCP_LEGACY_SESSION_ID\
        \ = \"\"\nMCP_LEGACY_SESSION_INITIALIZED = False\nMCP_LEGACY_SESSION_LOCK = asyncio.Lock()\n# Unreal Editor tool execution\
        \ is serialized: concurrent AllToolsets calls can\n# contend for the same editor thread and leave every client waiting.\n\
        MCP_NATIVE_TOOL_LOCK = asyncio.Lock()\nMCP_MODERN_PROTOCOL = \"2026-07-28\"\nMCP_LEGACY_PROTOCOL = \"2025-11-25\"\n\
        # Native Unreal tool schemas can take a long time to enumerate on first access.\n# Warm them locally before exposing\
        \ the public tunnel, then serve tools/list from\n# this immutable cache so Cloudflare/client request deadlines cannot\
        \ interrupt it.\nMCP_NATIVE_TOOLS_CACHE = None\nMCP_NATIVE_TOOLS_CACHE_AT = 0.0\nMCP_NATIVE_TOOLS_CACHE_LOCK = threading.RLock()\n\
        RELEASE_UPLOAD_LOCK = threading.Lock()\nRELEASE_LAST_UPLOAD_TIME = 0.0\nFILE_MANAGER_STATE = {\"public_base_url\"\
        : \"\"}\njobs, waiting, lock = queue.Queue(), {}, threading.Lock()\nlast_bridge_seen = 0.0\nlast_editor_tick_at =\
        \ 0.0\nEDITOR_TICK_STALE_SECONDS = 8.0\nEDITOR_JOB_QUEUE_TTL_SECONDS = 45.0\nUPLOAD_ROOT = (ROOT / \"Uploads\").resolve()\n\
        UPLOAD_ROOT.mkdir(parents=True, exist_ok=True)\nUPLOAD_CHUNK_BYTES = 16 * 1024\nUPLOAD_SINGLE_FILE_LIMIT = 8 * 1024\
        \ * 1024\nUPLOAD_MAX_FILE_SIZE = 2 * 1024 * 1024 * 1024\nUPLOAD_SESSIONS = {}\nUPLOAD_LOCK = threading.Lock()\n\n\
        def log(message):\n    line = time.strftime(\"%Y-%m-%d %H:%M:%S \") + str(message)\n    try:\n        with LOG_FILE.open(\"\
        a\", encoding=\"utf-8\") as out:\n            out.write(line + \"\\n\")\n    except Exception:\n        pass\n   \
        \ print(line, flush=True)\n\n@app.before_request\ndef _request_log_started():\n    request.environ[\"ue_remote_request_started\"\
        ] = time.monotonic()\n\n@app.after_request\ndef _request_log_finished(response):\n    # Do not fill the logs with\
        \ the dashboard's 5-second polling traffic.\n    if request.path not in (\"/api/fs/roots\", \"/api/fs/list\", \"/api/logs\"\
        ):\n        started = request.environ.get(\"ue_remote_request_started\", time.monotonic())\n        elapsed_ms = (time.monotonic()\
        \ - started) * 1000.0\n        log(\"HTTP %s %s -> %s (%.1f ms)\" % (request.method, request.path, response.status_code,\
        \ elapsed_ms))\n    return response\n\n# Legacy no-op decorator retained for compatibility; exposed REST routes use\
        \ monitor_auth.\ndef public_auth(fn):\n    # Kept as a compatibility decorator for older route definitions.\n    @wraps(fn)\n\
        \    def wrapper(*args, **kwargs):\n        return fn(*args, **kwargs)\n    return wrapper\n\ndef monitor_auth(fn):\n\
        \    @wraps(fn)\n    def wrapper(*args, **kwargs):\n        auth = request.authorization\n        valid = bool(FILE_MANAGER_PASSWORD\
        \ and auth and auth.type == \"basic\"\n                     and auth.username == FILE_MANAGER_USERNAME\n         \
        \            and secrets.compare_digest(auth.password or \"\", FILE_MANAGER_PASSWORD))\n        if not valid:\n  \
        \          if not FILE_MANAGER_PASSWORD:\n                return jsonify(ok=False, error=\"file_manager_password_not_configured\"\
        ), 503\n            response = app.response_class(\"Authentication required\", status=401)\n            response.headers[\"\
        WWW-Authenticate\"] = 'Basic realm=\"UE58 File Manager\"'\n            response.headers[\"Cache-Control\"] = \"no-store\"\
        \n            return response\n        return fn(*args, **kwargs)\n    return wrapper\n\ndef viewer_auth(fn):\n  \
        \  \"\"\"Dedicated read-only token for the standalone desktop viewer.\"\"\"\n    @wraps(fn)\n    def wrapper(*args,\
