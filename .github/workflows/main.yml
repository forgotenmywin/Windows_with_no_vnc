        def _package_worker(job_id, project_file):
            import zipfile as _zipfile
            job = PACKAGE_JOBS[job_id]
            try:
                uat = next((p for p in (ROOT / 'Extracted').glob('*/Engine/Build/BatchFiles/RunUAT.bat') if p.is_file()), None)
                if not uat:
                    raise FileNotFoundError('RunUAT.bat not found in extracted Unreal Engine')
                project = Path(project_file).resolve()
                output_dir = BUILD_DIR / (project.stem + '_Win64_' + job_id[:8])
                output_dir.mkdir(parents=True, exist_ok=True)
                archive_dir = output_dir / 'Package'
                command = ['cmd.exe', '/c', str(uat), 'BuildCookRun', '-project=' + str(project), '-noP4', '-platform=Win64', '-clientconfig=Shipping', '-build', '-cook', '-stage', '-pak', '-archive', '-archivedirectory=' + str(archive_dir), '-utf8output']
                log_path = LOG_DIR / ('package_' + job_id + '.log')
                build_env = os.environ.copy()
                for secret_name in ('GITHUB_TOKEN', 'GG_UE_TOKEN', 'MONITOR_PASSWORD', 'FILE_MANAGER_PASSWORD', 'BRIDGE_TOKEN'):
                    build_env.pop(secret_name, None)
                with log_path.open('w', encoding='utf-8', errors='replace') as stream:
                    stream.write('COMMAND: ' + subprocess.list2cmdline(command) + '\n')
                    proc = subprocess.Popen(command, cwd=str(project.parent), stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace', env=build_env, creationflags=getattr(subprocess, 'CREATE_NO_WINDOW', 0))
                    job.update({'status': 'running', 'pid': proc.pid, 'log': str(log_path)})
                    for line in proc.stdout:
                        stream.write(line)
                        stream.flush()
                        job['last_line'] = line.rstrip()[-500:]
                    code = proc.wait()
                if code != 0:
                    raise RuntimeError('RunUAT BuildCookRun exited with code %s; see %s' % (code, log_path))
                exe_files = list(archive_dir.rglob('*.exe'))
                if not exe_files:
                    raise RuntimeError('Packaging completed but no .exe was found in archived output')
                zip_path = output_dir / (project.stem + '_Win64_Shipping.zip')
                with _zipfile.ZipFile(zip_path, 'w', compression=_zipfile.ZIP_DEFLATED, compresslevel=1, allowZip64=True) as zf:
                    for file in archive_dir.rglob('*'):
                        if file.is_file():
                            zf.write(file, file.relative_to(archive_dir).as_posix())
                job.update({'status': 'completed', 'exit_code': code, 'zip': str(zip_path), 'size': zip_path.stat().st_size, 'exe_files': [str(x) for x in exe_files], 'completed_at': time.time()})
                log('Package build completed: ' + str(zip_path))
            except Exception as exc:
                job.update({'status': 'failed', 'error': str(exc), 'completed_at': time.time()})
                log('Package build failed: ' + repr(exc))
        
