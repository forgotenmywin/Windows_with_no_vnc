            marker = "__UE_SCENE_JSON__"
            line = next((ln for ln in output.splitlines() if marker in ln), "")
            if not line:
                raise RuntimeError("Scene snapshot returned no JSON marker: " + output[:500])
            payload = json.loads(line.split(marker, 1)[1])
            captured_at = time.time()
            payload["updated_at"] = captured_at
            payload["updated"] = captured_at
