                if not any(root == source or root in source.parents for root in allowed_roots):
                    return jsonify(ok=False, error="source_must_be_inside_Uploads_or_Screenshots"), 400
                if not source.is_file():
                    return jsonify(ok=False, error="source_file_not_found", source=str(source)), 404
                if source.stat().st_size > 100 * 1024 * 1024:
                    return jsonify(ok=False, error="Release uploads are limited to 100 MiB per file"), 413
                if not filename and source.suffix.lower() in (".jpg", ".jpeg"):
                    filename = "UnrealViewport_" + time.strftime("%Y%m%d_%H%M%S") + ".jpg"
                result = github_release_upload(source, tag, filename)
                log("Monitor uploaded file to GitHub Release tag=%s file=%s" % (tag, filename or source.name))
                return jsonify(result)
            except Exception as exc:
                log("Monitor GitHub Release upload failed: " + repr(exc))
                return jsonify(ok=False, error=str(exc)), 502

