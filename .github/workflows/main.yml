                    if method == 'tools/list' and scope.get('method', 'POST').upper() == 'POST':
                        if modern_mode:
                            status, response_headers, raw_headers, raw, parsed, was_sse = await _mcp_post_modern_via_fresh_legacy_session(client, target, forwarded, request_obj, upstream_body)
                            if status == 404:
                                status, response_headers, raw_headers, raw, parsed, was_sse = await _mcp_post_modern_via_fresh_legacy_session(client, target, forwarded, request_obj, upstream_body)
                        else:
                            status, response_headers, raw_headers, raw, parsed, was_sse = await mcp_post_and_read(client, target, forwarded, request_obj, content=upstream_body)
                        native_session = response_headers.get('mcp-session-id', '')
                        if native_session:
                            with MCP_SESSION_LOCK:
                                MCP_NATIVE_SESSIONS[native_session] = {'seen': time.time()}
                            with MONITOR_LOCK:
                                MCP_CONNECTION['last_session_seen'] = time.time()
                        if isinstance(parsed, dict) and isinstance(parsed.get('result'), dict) and isinstance(parsed['result'].get('tools'), list):
                            existing = {item.get('name') for item in parsed['result']['tools'] if isinstance(item, dict)}
                            for item in FILE_MANAGER_MCP_TOOLS:
                                if item['name'] not in existing:
                                    parsed['result']['tools'].append(item)
                            if modern_mode:
                                _normalize_modern_mcp_result(parsed, 'tools/list')
                            headers = _mcp_downstream_headers(raw_headers, modern_mode=modern_mode)
                            await send_mcp_json(send, parsed, headers=headers, status=status)
                            return
                        if was_sse:
                            error_obj = {'jsonrpc': '2.0', 'id': request_obj.get('id') if isinstance(request_obj, dict) else None, 'error': {'code': -32603, 'message': 'Upstream tools/list SSE had no matching JSON-RPC reply'}}
                            await send_mcp_json(send, error_obj, status=502)
                            return
                        with MONITOR_LOCK:
                            MCP_CONNECTION['last_status'] = int(status)
                            if status >= 400:
                                MCP_CONNECTION['last_error'] = 'tools/list upstream HTTP %s' % status
                        log('MCP tools/list upstream response: status=%s; content-type=%s; parsed_jsonrpc=%s' % (status, response_headers.get('content-type', ''), bool(parsed)))
                        out_headers = _mcp_downstream_headers(raw_headers, modern_mode=modern_mode)
                        await send({'type': 'http.response.start', 'status': status, 'headers': out_headers})
                        await send({'type': 'http.response.body', 'body': raw, 'more_body': False})
                        return
                    if modern_mode:
                        status, response_headers_obj, raw_headers, raw, parsed, was_sse = await _mcp_post_modern_via_fresh_legacy_session(client, target, forwarded, request_obj, upstream_body)
                        if method == 'tools/call' and status == 404:
                            status, response_headers_obj, raw_headers, raw, parsed, was_sse = await _mcp_post_modern_via_fresh_legacy_session(client, target, forwarded, request_obj, upstream_body)
                        response_headers = _mcp_downstream_headers(raw_headers, modern_mode=True)
                        if isinstance(parsed, dict):
                            _normalize_modern_mcp_result(parsed, method)
                            await send_mcp_json(send, parsed, headers=response_headers, status=status)
                        elif was_sse:
                            error_obj = {'jsonrpc': '2.0', 'id': request_obj.get('id') if isinstance(request_obj, dict) else None, 'error': {'code': -32603, 'message': 'Upstream modern MCP SSE had no matching JSON-RPC reply'}}
                            await send_mcp_json(send, error_obj, headers=response_headers, status=502)
                        else:
                            await send({'type': 'http.response.start', 'status': status, 'headers': response_headers})
                            await send({'type': 'http.response.body', 'body': raw, 'more_body': False})
                        if event_id:
                            monitor_event_finish(event_id, status, response_preview=monitor_response_preview(raw[:12000]))
                        return
                    async with client.stream(scope.get('method', 'POST'), target, headers=forwarded, content=upstream_body) as response:
                        response_body, parsed_response, was_sse = await read_mcp_http_reply(response, request_obj)
                        response_headers = [(k.lower(), v) for k, v in response.headers.raw if k.decode('latin1').lower() not in hop_by_hop]
                        if was_sse and (not isinstance(parsed_response, dict)):
                            raise RuntimeError('Unreal MCP SSE response was not a JSON-RPC object')
                        session_id = response.headers.get('mcp-session-id', '')
                        if session_id:
                            with MCP_SESSION_LOCK:
                                MCP_NATIVE_SESSIONS[session_id] = {'seen': time.time()}
                                cutoff = time.time() - 3600
                                for old_session, row in list(MCP_NATIVE_SESSIONS.items()):
                                    if row.get('seen', 0) < cutoff:
                                        MCP_NATIVE_SESSIONS.pop(old_session, None)
                                if len(MCP_NATIVE_SESSIONS) > 50:
                                    oldest = sorted(MCP_NATIVE_SESSIONS.items(), key=lambda item: item[1].get('seen', 0))[:-50]
                                    for old_session, _ in oldest:
                                        MCP_NATIVE_SESSIONS.pop(old_session, None)
                            with MONITOR_LOCK:
                                MCP_CONNECTION['last_session_seen'] = time.time()
                        elif method == 'initialize':
                            log('MCP initialize response did not include Mcp-Session-Id header')
                        if method == 'initialize' and response.status_code == 200:
                            global MCP_LEGACY_SESSION_ID, MCP_LEGACY_SESSION_INITIALIZED
                            MCP_LEGACY_SESSION_ID = session_id
                            MCP_LEGACY_SESSION_INITIALIZED = True
                        with MONITOR_LOCK:
                            MCP_CONNECTION['last_status'] = int(response.status_code)
                            if response.status_code >= 400:
                                MCP_CONNECTION['last_error'] = 'Upstream MCP HTTP %s' % response.status_code
                        log('MCP upstream response: status=%s; content-type=%s; protocol-version=%s; session-id-present=%s' % (response.status_code, response.headers.get('content-type', ''), response.headers.get('mcp-protocol-version', ''), bool(session_id)))
                        if was_sse:
                            await send_mcp_json(send, parsed_response, headers=response_headers, status=response.status_code)
                        else:
                            await send({'type': 'http.response.start', 'status': response.status_code, 'headers': response_headers})
                            await send({'type': 'http.response.body', 'body': response_body, 'more_body': False})
                        if event_id:
                            monitor_event_finish(event_id, response.status_code, response_preview=monitor_response_preview(response_body[:12000]))
            except Exception as exc:
                is_timeout = isinstance(exc, (httpx.TimeoutException, TimeoutError))
                diagnostic_status = 504 if is_timeout else 502
                with MONITOR_LOCK:
                    MCP_CONNECTION['last_status'] = diagnostic_status
                    MCP_CONNECTION['last_error'] = str(exc)[:500]
                if event_id:
                    monitor_event_finish(event_id, diagnostic_status, repr(exc))
                log('Native MCP proxy %s: %s: %s' % ('timeout' if is_timeout else 'error', type(exc).__name__, str(exc)[:1200]))
                log('Native MCP proxy traceback: %s' % traceback.format_exc()[-4000:])
                request_id = request_obj.get('id') if isinstance(request_obj, dict) else None
                if isinstance(request_obj, dict) and request_obj.get('jsonrpc') == '2.0' and (request_id is not None):
                    message = 'Unreal native MCP did not answer within the configured 120-second limit. The Editor may be busy; wait for the current operation to finish before retrying.' if is_timeout else 'Unreal native MCP proxy failed: ' + type(exc).__name__ + ': ' + str(exc)[:400]
                    rpc_error = {'jsonrpc': '2.0', 'id': request_id, 'error': {'code': -32002 if is_timeout else -32003, 'message': message}}
                    await send_mcp_json(send, rpc_error, status=200, headers=[(b'x-ue-mcp-diagnostic', b'upstream-timeout' if is_timeout else b'upstream-error')])
                else:
                    err = json.dumps({'ok': False, 'error': 'native_mcp_proxy_timeout' if is_timeout else 'native_mcp_proxy_failed', 'detail': type(exc).__name__ + ': ' + str(exc)[:600]}, separators=(',', ':')).encode('utf-8')
                    await send({'type': 'http.response.start', 'status': diagnostic_status, 'headers': [(b'content-type', b'application/json; charset=utf-8'), (b'content-length', str(len(err)).encode())]})
                    await send({'type': 'http.response.body', 'body': err})
            finally:
                if native_tool_lock_acquired:
                    with MONITOR_LOCK:
                        MCP_NATIVE_TOOL_ACTIVE = False
                        MCP_NATIVE_TOOL_IDLE_UNTIL = time.monotonic() + 15.0
                    log('EDITOR_NATIVE_TOOL_ACTIVITY=completed idle_grace_seconds=15')
                    MCP_NATIVE_TOOL_LOCK.release()
        
        @app.post('/internal/mcp/warmup')
        @bridge_auth
        def internal_mcp_tools_warmup():
            """Pre-enumerate native Unreal MCP tools locally before public handshake tests."""
            started = time.time()
            try:
                parsed = asyncio.run(_fetch_native_tools_cache(timeout_seconds=210))
                native_count = len(parsed.get('result', {}).get('tools', []))
                total_count = native_count + len(FILE_MANAGER_MCP_TOOLS)
                return jsonify(ok=True, native_tool_count=native_count, total_tool_count=total_count, elapsed_seconds=round(time.time() - started, 2), cached=True)
            except Exception as exc:
                log('MCP local warmup endpoint failed: %s: %s' % (type(exc).__name__, str(exc)[:1500]))
                return (jsonify(ok=False, error=str(exc), elapsed_seconds=round(time.time() - started, 2)), 502)
        combined_app = Starlette(routes=[Mount('/', app=WSGIMiddleware(app))], lifespan=lifespan)
        
        async def public_app(scope, receive, send):
            if scope.get('type') == 'http':
                request_path = scope.get('path', '/') or '/'
                canonical_request_path = request_path.rstrip('/') or '/'
                if canonical_request_path in ('/', '/mcp'):
                    mcp_scope = dict(scope)
                    if canonical_request_path == '/mcp':
                        remainder = '/'
                    else:
                        remainder = '/'
                    mcp_scope['path'] = remainder or '/'
                    await native_mcp_proxy(mcp_scope, receive, send)
                    return
            await combined_app(scope, receive, send)
        
        class LocalBridgeHandler(BaseHTTPRequestHandler):
            protocol_version = 'HTTP/1.1'
            server_version = 'UE58LocalBridge/1.0'
        
            def log_message(self, fmt, *args):
                return
        
            def _send_json(self, status, payload):
                body = json.dumps(payload, ensure_ascii=False, default=str).encode('utf-8')
                self.send_response(status)
                self.send_header('Content-Type', 'application/json; charset=utf-8')
                self.send_header('Content-Length', str(len(body)))
                self.send_header('Cache-Control', 'no-store')
                self.send_header('Connection', 'close')
                self.end_headers()
                try:
                    self.wfile.write(body)
                except (BrokenPipeError, ConnectionResetError):
                    pass
        
            def do_POST(self):
                global last_bridge_seen, last_editor_tick_at
                try:
                    if self.client_address[0] not in ('127.0.0.1', '::1'):
                        self._send_json(403, {'ok': False, 'error': 'loopback_only'})
                        return
                    auth = self.headers.get('Authorization', '')
                    if not BRIDGE_TOKEN or not secrets.compare_digest(auth, 'Bearer ' + BRIDGE_TOKEN):
                        self._send_json(401, {'ok': False, 'error': 'unauthorized_internal'})
                        return
                    route = self.path.split('?', 1)[0]
                    if route not in ('/internal/next', '/internal/result'):
                        self._send_json(404, {'ok': False, 'error': 'not_found'})
                        return
                    length = int(self.headers.get('Content-Length', '0') or 0)
                    if length < 0 or length > 8 * 1024 * 1024:
                        self._send_json(413, {'ok': False, 'error': 'invalid_content_length'})
                        return
                    raw_body = self.rfile.read(length) if length else b'{}'
                    body = json.loads(raw_body.decode('utf-8'))
                    if not isinstance(body, dict):
                        self._send_json(400, {'ok': False, 'error': 'json_object_required'})
                        return
                    if route == '/internal/next':
                        now = time.time()
                        last_bridge_seen = now
                        try:
                            reported_tick = float(body.get('editor_tick_at', 0.0) or 0.0)
                            if 0.0 < reported_tick <= now + 1.0:
                                last_editor_tick_at = reported_tick
                        except (TypeError, ValueError):
                            pass
                        try:
                            job = jobs.get_nowait()
                        except queue.Empty:
                            job = None
                        self._send_json(200, {'ok': True, 'job': job, 'editor_tick_age_seconds': editor_tick_age_seconds(now)})
                        return
                    job_id = str(body.get('id') or '').strip()
                    if not job_id:
                        self._send_json(400, {'ok': False, 'error': 'id_is_required'})
                        return
                    with lock:
                        row = waiting.get(job_id)
                        if row is not None:
                            row['result'] = {'output': str(body.get('output', '')), 'error': str(body.get('error', ''))}
                            row['event'].set()
                    self._send_json(200, {'ok': True, 'duplicate': row is None})
                except Exception as exc:
                    log('Dedicated local bridge handler failed: ' + repr(exc))
                    try:
                        self._send_json(500, {'ok': False, 'error': str(exc)})
                    except Exception:
                        pass
        
        class LocalBridgeHTTPServer(ThreadingHTTPServer):
            allow_reuse_address = True
            daemon_threads = True
            request_queue_size = 64
        
        def start_local_bridge_http_server():
            server = LocalBridgeHTTPServer(('127.0.0.1', 8766), LocalBridgeHandler)
            thread = threading.Thread(target=server.serve_forever, kwargs={'poll_interval': 0.25}, name='UE58-Bridge-HTTP', daemon=True)
            thread.start()
            log('DEDICATED_LOCAL_BRIDGE_READY host=127.0.0.1 port=8766')
            return server
        if __name__ == '__main__':
            if not BRIDGE_TOKEN:
                raise RuntimeError('BRIDGE_TOKEN must be set')
            if not FILE_MANAGER_PASSWORD:
                raise RuntimeError('MONITOR_PASSWORD must be configured')
            log('Starting REST API on 127.0.0.1:8765; File Manager uses HTTP Basic; single MCP endpoint=/mcp -> native Unreal AllToolsets + File Manager/file/Release tools')
            bridge_http_server = start_local_bridge_http_server()
            try:
                uvicorn.run(public_app, host='127.0.0.1', port=8765, log_level='info')
            finally:
                bridge_http_server.shutdown()
                bridge_http_server.server_close()
        '@
