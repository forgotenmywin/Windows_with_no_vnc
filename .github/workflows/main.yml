        <div class="plugin-box"><div class="row"><b>Installed Unreal plugins</b><button id="refreshPlugins">Refresh plugins</button></div><div class="small muted">Toggle installed plugins or install a plugin ZIP into the active project's Plugins folder. The .uproject descriptor is backed up and Unreal restarts to apply changes. Core remote-control plugins cannot be disabled.</div><div class="row"><input id="pluginZip" type="file" accept=".zip"><button id="installPluginBtn">Install plugin ZIP</button><span class="small muted" id="pluginInstallStatus"></span></div>
