        <div class="scene-toolbar" aria-label="3D camera controls"><button id="sceneFitAll" class="primary" type="button">Frame actual model</button><button id="sceneZoomIn" type="button">Zoom +</button><button id="sceneZoomOut" type="button">Zoom −</button><button id="sceneViewIso" type="button">Isometric</button><button id="sceneViewTop" type="button">Top</button><button id="sceneViewFront" type="button">Front</button><button id="sceneViewSide" type="button">Side</button><button id="sceneViewBack" type="button">Back</button><button id="sceneRefresh" type="button">Refresh scene data</button><button id="sceneModelRefresh" class="primary" type="button">Reload real geometry</button></div>
