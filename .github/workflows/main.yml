        <section id="scenePanel" style="grid-column:1/-1"><div class="row" style="justify-content:space-between"><h2>Actual 3D Scene Viewer</h2><span class="pill" id="sceneStatus">Waiting for scene data</span></div>
        <div class="small muted">Shows the real meshes exported from the active Unreal level, including supported materials, textures and transforms — not placeholder boxes. One finger / left mouse drag: orbit · two-finger drag: pan · pinch or wheel: zoom. This is a read-only viewer and does not move objects in Unreal.</div>
