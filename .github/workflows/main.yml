        @app.post("/internal/next")
        @bridge_auth
        def internal_next():
            global last_bridge_seen, last_editor_tick_at
            now = time.time()
            last_bridge_seen = now
            body = request.get_json(silent=True) or {}
            try:
                reported_tick = float(body.get("editor_tick_at", 0.0) or 0.0)
                # Never accept a future timestamp from the bridge heartbeat.
                if 0.0 < reported_tick <= now + 1.0:
                    last_editor_tick_at = reported_tick
            except (TypeError, ValueError):
                pass
            try: job = jobs.get(timeout=1.5)
            except queue.Empty: job = None
            return jsonify(ok=True, job=job, editor_tick_age_seconds=editor_tick_age_seconds())

        @app.post("/internal/result")
