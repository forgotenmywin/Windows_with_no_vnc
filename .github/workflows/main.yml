        def api_scene_model_export():
            if not bridge_connected():
                return jsonify(ok=False, error="Unreal Python Bridge is offline"), 503
            with SCENE_MODEL_LOCK:
                if SCENE_MODEL_STATE.get("status") in ("queued", "running"):
                    return jsonify(ok=True, status=SCENE_MODEL_STATE["status"], job_id=SCENE_MODEL_STATE.get("job_id", "")), 202
                job_id = uuid.uuid4().hex
                SCENE_MODEL_STATE.update({"status": "queued", "job_id": job_id, "error": "",
