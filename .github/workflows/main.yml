name: UE 5.8 Remote Studio - Advanced Live Control + Headless Commandlets + 
  Windows Optimization (MCP SSE 502 Fix)
'on':
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ue-remote:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Prepare D drive
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = 'D:\UE58'
        New-Item -ItemType Directory -Force -Path $root, "$root\parts", "$root\Logs", "$root\Projects", "$root\Screenshots", "$root\Uploads" | Out-Null
        try { Start-Transcript -Path "$root\Logs\workflow-prepare-transcript.log" -Append -Force | Out-Null } catch { }
        $drive = Get-PSDrive D -ErrorAction SilentlyContinue
        if (-not $drive) { throw 'Drive D is not available on this runner.' }
        Write-Host ("D: available space: {0:N2} GB" -f ($drive.Free / 1GB))
        "UE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Download and extract Unreal Engine 5.8
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $root = 'D:\UE58'
        try { Start-Transcript -Path "$root\Logs\workflow-extract-transcript.log" -Append -Force | Out-Null } catch { }
        $partsDir = "$root\parts"
        $archive = "$root\UE_5.8.zip"
        $extract = "$root\Extracted"

        gh release download ue5.8 --repo forgotenmywin/Windows_with_no_vnc --pattern 'UE_5.8.zip.*' --dir $partsDir --clobber
        if ($LASTEXITCODE -ne 0) { throw 'Could not download release assets UE_5.8.zip.*.' }

        $parts = @(Get-ChildItem -LiteralPath $partsDir -File | Where-Object { $_.Name -like 'UE_5.8.zip.*' } | Sort-Object Name)
        if ($parts.Count -lt 2) { throw "Expected split ZIP parts; found $($parts.Count). Check release tag/assets." }

        if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
        $destination = [System.IO.File]::Open($archive, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
        try {
          $buffer = New-Object byte[] (4MB)
          foreach ($part in $parts) {
            Write-Host ("Joining {0} ({1:N2} GB)" -f $part.Name, ($part.Length / 1GB))
            $source = [System.IO.File]::OpenRead($part.FullName)
            try {
              while (($read = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {
                $destination.Write($buffer, 0, $read)
              }
            }
            finally { $source.Dispose() }
          }
        }
        finally { $destination.Dispose() }

        $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
        if (-not $sevenZip) {
          $sevenZip = @('C:\Program Files\7-Zip\7z.exe','C:\Program Files (x86)\7-Zip\7z.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
        }
        if (-not $sevenZip) {
          choco install 7zip -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
        }
        if (-not (Test-Path -LiteralPath $sevenZip)) { throw '7z.exe was not found.' }

        & $sevenZip t $archive
        if ($LASTEXITCODE -ne 0) { throw 'Joined ZIP failed integrity testing.' }
        if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
        New-Item -ItemType Directory -Force -Path $extract | Out-Null
        & $sevenZip x $archive "-o$extract" -y
        if ($LASTEXITCODE -ne 0) { throw 'Unreal Engine extraction failed.' }

        $editor = Get-ChildItem -LiteralPath $extract -Filter UnrealEditor.exe -File -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -match '\\Engine\\Binaries\\Win64\\UnrealEditor\.exe$' } |
          Select-Object -First 1
        if (-not $editor) { throw 'UnrealEditor.exe was not found.' }
        Write-Host "EDITOR_EXE=$($editor.FullName)"
        "UE_EDITOR_EXE=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Create UE project, bridge and API server
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = 'D:\UE58'
        try { Start-Transcript -Path "$root\Logs\workflow-setup-transcript.log" -Append -Force | Out-Null } catch { }
        $project = "$root\UEControl"
        $pythonDir = "$project\Content\Python"
        $config = "$project\Config"
        New-Item -ItemType Directory -Force -Path $pythonDir, $config, "$root\Projects", "$root\Screenshots", "$root\Uploads", "$root\Logs" | Out-Null

        $uproject = @'
        {
          "FileVersion": 3,
          "EngineAssociation": "5.8",
          "Category": "RemoteControl",
          "Description": "Unreal Editor controlled through a remote API bridge",
          "Plugins": [
            { "Name": "PythonScriptPlugin", "Enabled": true },
            { "Name": "EditorScriptingUtilities", "Enabled": true },
            { "Name": "ModelContextProtocol", "Enabled": true },
            { "Name": "AllToolsets", "Enabled": true },
            { "Name": "GLTFExporter", "Enabled": true }
          ]
        }
        '@
        Set-Content -LiteralPath "$project\UEControl.uproject" -Value $uproject -Encoding utf8

        $engineConfig = @'
        [/Script/EngineSettings.GameMapsSettings]
        EditorStartupMap=/Engine/Maps/Entry
        GameDefaultMap=/Engine/Maps/Entry

        [/Script/PythonScriptPlugin.PythonScriptPluginSettings]
        +StartupScripts=D:/UE58/UEControl/Content/Python/init_unreal.py
        bDeveloperMode=True
        bRemoteExecution=False

        [/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
        bAutoStartServer=True
        ServerPortNumber=8000
        ServerUrlPath=/mcp
        bEnableToolSearch=True
        '@
        Set-Content -LiteralPath "$config\DefaultEngine.ini" -Value $engineConfig -Encoding utf8

        # GameFeatures requires an Asset Manager rule for UGameFeatureData.
        # Keep this in DefaultGame.ini (UAssetManagerSettings uses Config=Game).
        $gameConfig = @'
        [/Script/Engine.AssetManagerSettings]
        +PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=,SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
        bShouldGuessTypeAndNameInEditor=True
        '@
        Set-Content -LiteralPath "$config\DefaultGame.ini" -Value $gameConfig -Encoding utf8

        $editorSettings = @'
        [/Script/UnrealEd.EditorPerformanceSettings]
        bAllowSlateThrottling=True
        bThrottleCPUWhenNotForeground=True
        bDisableRealtimeViewportsInRemoteSessions=True
        '@
        Set-Content -LiteralPath "$config\DefaultEditorSettings.ini" -Value $editorSettings -Encoding utf8


        $bridge = @'
        import ast
        import builtins
        import contextlib
        import io
        import json
        import os
        import queue
        import threading
        import time
        import traceback
        import urllib.request

        ROOT = os.environ.get("UE_ROOT", r"D:\UE58")
        LOG_FILE = os.path.join(ROOT, "Logs", "unreal_bridge.log")
        API = "http://127.0.0.1:8766"
        TOKEN = os.environ.get("BRIDGE_TOKEN", "")
        INCOMING = queue.Queue()
        OUTGOING = queue.Queue()
        EDITOR_TICK_AT = 0.0
        JOB_QUEUE_TTL_SECONDS = 45.0
        NAMESPACE = {"__name__": "__ue_remote__"}


        def log(message):
            line = time.strftime("%Y-%m-%d %H:%M:%S ") + str(message)
            try:
                os.makedirs(os.path.dirname(LOG_FILE), exist_ok=True)
                with open(LOG_FILE, "a", encoding="utf-8") as stream:
                    stream.write(line + "\n")
            except Exception:
                pass
            try:
                unreal.log("[UE58 Remote Bridge] " + str(message))
            except Exception:
                pass


        log("Startup file loaded; token_present=%s; python=%s" % (bool(TOKEN), __import__("sys").version.split()[0]))

        try:
            import unreal
        except Exception:
            log("FATAL: cannot import Unreal Python module:\n" + traceback.format_exc())
            raise

        if not TOKEN:
            log("FATAL: BRIDGE_TOKEN is missing from Unreal process environment")
            raise RuntimeError("BRIDGE_TOKEN missing")

        if getattr(builtins, "_UE58_REMOTE_BRIDGE_ACTIVE", False):
            log("Duplicate startup invocation ignored; bridge is already active")
        else:
            PREVIEW_GEOMETRY_READY = False
            PREVIEW_GEOMETRY_LAST_LOG = 0.0

            def ensure_preview_geometry():
                """Create the test tree in a project-owned map; never inject actors into an Engine map."""
                global PREVIEW_GEOMETRY_READY, PREVIEW_GEOMETRY_LAST_LOG
                if PREVIEW_GEOMETRY_READY:
                    return True
                try:
                    utils = unreal.EditorLoadingAndSavingUtils
                    editor = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem)
                    world = editor.get_editor_world()
                    if world is None:
                        return False

                    map_asset = "/Game/Maps/PluginTree_Test_Fixed"
                    tree_asset_path = "/PCG/SampleContent/SimpleForest/Meshes/PCG_Tree_01"
                    current_world_path = str(world.get_path_name())

                    # Never duplicate /Engine/Maps/Entry. If the project map already exists,
                    # load it; otherwise create a genuinely blank world and save it into /Game.
                    if map_asset not in current_world_path:
                        if unreal.EditorAssetLibrary.does_asset_exist(map_asset):
                            loaded_world = utils.load_map(map_asset)
                            if loaded_world is None:
                                raise RuntimeError("Existing project map could not be loaded: " + map_asset)
                            world = loaded_world
                            log("Loaded existing project-owned tree map: " + map_asset)
                        elif current_world_path.startswith("/Engine/"):
                            unreal.EditorAssetLibrary.make_directory("/Game/Maps")
                            world = utils.new_blank_map(True)
                            if world is None:
                                raise RuntimeError("EditorLoadingAndSavingUtils.new_blank_map returned None")
                            if not utils.save_map(world, map_asset):
                                raise RuntimeError("Could not save new blank map into " + map_asset)
                            log("Created independent project map; source Engine map was not duplicated")
                        else:
                            # A user-selected project map is not a disposable preview level.
                            PREVIEW_GEOMETRY_READY = True
                            log("Preserving user project map; automatic tree test map was not injected into: " + current_world_path)
                            return True

                    # Do not duplicate the tree if the startup script is invoked again.
                    actors = list(unreal.EditorLevelLibrary.get_all_level_actors() or [])
                    existing = next((a for a in actors if str(a.get_actor_label()) == "NewPlugin_TestTree_01"), None)
                    if existing is None:
                        mesh_asset = unreal.EditorAssetLibrary.load_asset(tree_asset_path)
                        if mesh_asset is None:
                            raise RuntimeError("Tree mesh asset not found: " + tree_asset_path)
                        existing = unreal.EditorLevelLibrary.spawn_actor_from_object(
                            mesh_asset,
                            unreal.Vector(0.0, 0.0, 0.0),
                            unreal.Rotator(0.0, 0.0, 0.0),
                        )
                        if existing is None:
                            raise RuntimeError("Could not spawn the plugin tree actor")
                        existing.set_actor_label("NewPlugin_TestTree_01")
                        log("Plugin tree actor spawned in project-owned map")

                    # Save the active map explicitly to /Game and verify the actual .umap file.
                    if not utils.save_map(world, map_asset):
                        raise RuntimeError("Unreal returned false while saving " + map_asset)
                    content_dir = unreal.Paths.project_content_dir()
                    map_file = os.path.join(content_dir, "Maps", "PluginTree_Test_Fixed.umap")
                    if not os.path.isfile(map_file) or os.path.getsize(map_file) <= 0:
                        raise RuntimeError("Map save was not verified on disk: " + map_file)

                    try:
                        editor.set_level_viewport_camera_info(
                            unreal.Vector(1050.0, -1450.0, 900.0),
                            unreal.Rotator(-27.0, 126.0, 0.0),
                        )
                    except Exception as camera_error:
                        log("Tree map viewport camera could not be positioned: " + str(camera_error))

                    PREVIEW_GEOMETRY_READY = True
                    log("PROJECT_TREE_MAP_READY=true map=%s actor=%s file=%s bytes=%s" % (
                        map_asset, existing.get_actor_label(), map_file, os.path.getsize(map_file)
                    ))
                    return True
                except Exception:
                    now = time.time()
                    if now - PREVIEW_GEOMETRY_LAST_LOG > 10:
                        log("Project tree map initialization failed:\n" + traceback.format_exc()[-2400:])
                        PREVIEW_GEOMETRY_LAST_LOG = now
                    return False

            def request_json(path, payload=None, timeout=12):
                """Send one authenticated request to the local bridge API."""
                data = None if payload is None else json.dumps(payload).encode("utf-8")
                req = urllib.request.Request(
                    API + path,
                    data=data,
                    headers={
                        "Authorization": "Bearer " + TOKEN,
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "Connection": "close",
                    },
                    method="GET" if payload is None else "POST",
                )
                with urllib.request.urlopen(req, timeout=timeout) as response:
                    raw_response = response.read().decode("utf-8")
                    return json.loads(raw_response) if raw_response else {}


            # The Editor process remains alive while idle. We stop continuous viewport
            # rendering and cap the Editor frame rate; the network worker keeps polling
            # independently so a new MCP job wakes the Editor without a restart.
            IDLE_AFTER_SECONDS = 15.0
            IDLE_MAX_FPS = 5
            ACTIVE_MAX_FPS = 60
            LAST_REMOTE_ACTIVITY = time.monotonic() - IDLE_AFTER_SECONDS - 1.0
            CURRENT_POWER_MODE = None
            REMOTE_TOOL_ACTIVE = False

            def set_editor_power_mode(mode):
                """Switch between low-CPU idle and normal interactive Editor modes."""
                global CURRENT_POWER_MODE
                if mode == CURRENT_POWER_MODE:
                    return

                make_realtime = (mode == "active")
                try:
                    level_editor = unreal.get_editor_subsystem(unreal.LevelEditorSubsystem)
                    if level_editor is not None:
                        # Apply the mode to every available Level Editor viewport, not
                        # only the currently active perspective viewport.
                        try:
                            viewport_keys = list(level_editor.get_viewport_config_keys() or [])
                        except Exception:
                            viewport_keys = []
                        if viewport_keys:
                            for viewport_key in viewport_keys:
                                try:
                                    level_editor.editor_set_viewport_realtime(make_realtime, viewport_key)
                                except Exception as viewport_error:
                                    log("Viewport power switch failed for %s: %s" % (str(viewport_key), repr(viewport_error)))
                        else:
                            level_editor.editor_set_viewport_realtime(make_realtime)
                        level_editor.editor_invalidate_viewports()
                except Exception as exc:
                    log("Viewport realtime switch failed (%s): %s" % (mode, repr(exc)))

                try:
                    editor = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem)
                    world = editor.get_editor_world() if editor is not None else None
                    if world is not None:
                        fps = ACTIVE_MAX_FPS if make_realtime else IDLE_MAX_FPS
                        unreal.SystemLibrary.execute_console_command(world, "t.MaxFPS %d" % fps)
                        # Slate throttling remains enabled in both modes. It reduces
                        # unnecessary UI/background work without disabling the bridge.
                        unreal.SystemLibrary.execute_console_command(world, "Slate.bAllowThrottling 1")
                except Exception as exc:
                    log("Editor frame-throttle switch failed (%s): %s" % (mode, repr(exc)))

                CURRENT_POWER_MODE = mode
                log("EDITOR_POWER_MODE=%s viewport_realtime=%s max_fps=%s" % (
                    mode, make_realtime, ACTIVE_MAX_FPS if make_realtime else IDLE_MAX_FPS
                ))


            def network_worker():
                global LAST_REMOTE_ACTIVITY, REMOTE_TOOL_ACTIVE
                log("Bridge network worker started; connecting to local API")
                connected_logged = False
                last_error_log = 0.0
                while True:
                    try:
                        while True:
                            try:
                                payload = OUTGOING.get_nowait()
                            except queue.Empty:
                                break
                            try:
                                request_json("/internal/result", payload, timeout=12)
                            except Exception as exc:
                                OUTGOING.put(payload)
                                time.sleep(0.5)
                                log("Posting execution result failed: " + repr(exc))

                        # This authenticated poll is also the bridge heartbeat. The API
                        # marks the bridge online only after it receives this request.
                        reply = request_json("/internal/next", {"wait": 1, "editor_tick_at": EDITOR_TICK_AT}, timeout=12)
                        if not connected_logged:
                            log("Authenticated connection to local API established")
                            connected_logged = True
                        REMOTE_TOOL_ACTIVE = bool(reply.get("editor_active")) if isinstance(reply, dict) else False
                        if isinstance(reply, dict) and bool(reply.get("editor_busy")):
                            LAST_REMOTE_ACTIVITY = time.monotonic()
                        job = reply.get("job") if isinstance(reply, dict) else None
                        if job:
                            LAST_REMOTE_ACTIVITY = time.monotonic()
                            INCOMING.put(job)
                    except Exception as exc:
                        connected_logged = False
                        now = time.time()
                        if now - last_error_log >= 5:
                            log("Local API polling failed: " + repr(exc))
                            last_error_log = now
                        time.sleep(1.0)


            def editor_tick(delta_seconds):
                # This value is read by the separate network worker and forwarded to
                # the API. It proves that the actual Unreal Editor thread is ticking.
                global EDITOR_TICK_AT, LAST_REMOTE_ACTIVITY
                EDITOR_TICK_AT = time.time()

                if not PREVIEW_GEOMETRY_READY:
                    ensure_preview_geometry()

                try:
                    job = INCOMING.get_nowait()
                except queue.Empty:
                    # Native AllToolsets calls are proxied directly to Unreal's MCP
                    # listener. Keep the viewport awake while one of those calls runs.
                    if REMOTE_TOOL_ACTIVE:
                        set_editor_power_mode("active")
                        return
                    # After both command queues have remained idle, stop continuous
                    # viewport rendering and run the live Editor at a low frame cap.
                    if time.monotonic() - LAST_REMOTE_ACTIVITY >= IDLE_AFTER_SECONDS:
                        set_editor_power_mode("idle")
                    return

                # Wake the viewport before executing any remote operation.
                LAST_REMOTE_ACTIVITY = time.monotonic()
                set_editor_power_mode("active")

                job_id = str(job.get("id", ""))
                created_at = job.get("created_at", EDITOR_TICK_AT)
                try:
                    queue_age = max(0.0, EDITOR_TICK_AT - float(created_at))
                except (TypeError, ValueError):
                    queue_age = 0.0

                # Never execute an old command minutes after a blocked modal dialog or
                # a stalled Editor has recovered. Return an explicit result instead.
                if queue_age > JOB_QUEUE_TTL_SECONDS:
                    error = "Command expired in the Unreal Editor queue after %.1f seconds; submit it again." % queue_age
                    log("Discarding expired remote Python job %s; age=%.1fs" % (job_id, queue_age))
                    OUTGOING.put({"id": job_id, "output": "", "error": error})
                    LAST_REMOTE_ACTIVITY = time.monotonic()
                    return

                started = time.perf_counter()
                log("Executing remote Python job %s; queue_age=%.3fs" % (job_id, queue_age))
                output, error = execute_code(job.get("code", ""))
                elapsed = time.perf_counter() - started
                log("Remote Python job %s finished; duration=%.3fs error=%s" % (job_id, elapsed, bool(error)))
                OUTGOING.put({"id": job_id, "output": output, "error": error})
                LAST_REMOTE_ACTIVITY = time.monotonic()

            def execute_code(source):
                captured = io.StringIO()
                error = ""
                try:
                    parsed = ast.parse(source, filename="<remote-unreal-python>", mode="exec")
                    with contextlib.redirect_stdout(captured), contextlib.redirect_stderr(captured):
                        if parsed.body and isinstance(parsed.body[-1], ast.Expr):
                            prefix = ast.Module(body=parsed.body[:-1], type_ignores=[])
                            if prefix.body:
                                exec(compile(prefix, "<remote-unreal-python>", "exec"), NAMESPACE, NAMESPACE)
                            value = eval(
                                compile(ast.Expression(parsed.body[-1].value), "<remote-unreal-python>", "eval"),
                                NAMESPACE,
                                NAMESPACE,
                            )
                            if value is not None:
                                print(repr(value))
                        else:
                            exec(compile(parsed, "<remote-unreal-python>", "exec"), NAMESPACE, NAMESPACE)
                except Exception as exc:
                    error = "".join(traceback.format_exception(type(exc), exc, exc.__traceback__))
                output = captured.getvalue().strip()
                if not output and not error:
                    output = "Executed successfully (no output)."
                return output, error

            try:
                CALLBACK_HANDLE = unreal.register_slate_post_tick_callback(editor_tick)
                threading.Thread(target=network_worker, name="UE58-Remote-Network", daemon=True).start()
                builtins._UE58_REMOTE_BRIDGE_ACTIVE = True
                version = unreal.SystemLibrary.get_engine_version()
                log("BRIDGE_READY; UE_VERSION=" + str(version))
                print("UE_REMOTE_BRIDGE_READY " + str(version))
            except Exception:
                log("FATAL: bridge registration failed:\n" + traceback.format_exc())
                raise

        '@
        Set-Content -LiteralPath "$pythonDir\init_unreal.py" -Value $bridge -Encoding utf8

        $api = @'
        import ast, asyncio, base64, binascii, contextlib, hashlib, io, json, os, queue, re, secrets, shutil, tempfile, threading, time, traceback, uuid, textwrap
        from collections import deque
        from pathlib import Path
        from functools import wraps
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from flask import Flask, jsonify, request, send_file
        app = Flask(__name__)
        app.config['MAX_CONTENT_LENGTH'] = 8 * 1024 * 1024 * 1024
        ROOT = Path(os.environ.get('UE_ROOT', 'D:\\UE58')).resolve()
        LOG_DIR = ROOT / 'Logs'
        LOG_DIR.mkdir(parents=True, exist_ok=True)
        LOG_FILE = LOG_DIR / 'api.log'
        BRIDGE_TOKEN = os.environ.get('BRIDGE_TOKEN', '')
        FILE_MANAGER_USERNAME = 'viewer'
        FILE_MANAGER_PASSWORD = os.environ.get('MONITOR_PASSWORD', '')
        VIEWER_TOKEN = os.environ.get('VIEWER_TOKEN', '')
        VIEWER_EXE_PATH = (ROOT / 'Viewer' / 'UE58SceneViewer.exe').resolve()
        MONITOR_LOCK = threading.RLock()
        MONITOR_EVENTS = deque(maxlen=100)
        MCP_CONNECTION = {'request_count': 0, 'last_seen': 0.0, 'last_method': '', 'last_path': '', 'last_status': None, 'last_error': '', 'session_fallback_count': 0, 'last_session_seen': 0.0}
        MCP_SESSION_LOCK = threading.RLock()
        MCP_NATIVE_SESSIONS = {}
        MCP_LEGACY_SESSION_ID = ''
        MCP_LEGACY_SESSION_INITIALIZED = False
        MCP_LEGACY_SESSION_LOCK = asyncio.Lock()
        MCP_NATIVE_TOOL_LOCK = asyncio.Lock()
        MCP_NATIVE_TOOL_ACTIVE = False
        MCP_NATIVE_TOOL_IDLE_UNTIL = 0.0
        MCP_MODERN_PROTOCOL = '2026-07-28'
        MCP_LEGACY_PROTOCOL = '2025-11-25'
        MCP_NATIVE_TOOLS_CACHE = None
        MCP_NATIVE_TOOLS_CACHE_AT = 0.0
        MCP_NATIVE_TOOLS_CACHE_LOCK = threading.RLock()
        RELEASE_UPLOAD_LOCK = threading.Lock()
        RELEASE_LAST_UPLOAD_TIME = 0.0
        FILE_MANAGER_STATE = {'public_base_url': ''}
        jobs, waiting, lock = (queue.Queue(), {}, threading.Lock())
        last_bridge_seen = 0.0
        last_editor_tick_at = 0.0
        EDITOR_TICK_STALE_SECONDS = 8.0
        EDITOR_JOB_QUEUE_TTL_SECONDS = 45.0
        UPLOAD_ROOT = (ROOT / 'Uploads').resolve()
        UPLOAD_ROOT.mkdir(parents=True, exist_ok=True)
        UPLOAD_CHUNK_BYTES = 16 * 1024
        UPLOAD_SINGLE_FILE_LIMIT = 8 * 1024 * 1024
        UPLOAD_MAX_FILE_SIZE = 2 * 1024 * 1024 * 1024
        UPLOAD_SESSIONS = {}
        UPLOAD_LOCK = threading.Lock()
        
        def log(message):
            line = time.strftime('%Y-%m-%d %H:%M:%S ') + str(message)
            try:
                with LOG_FILE.open('a', encoding='utf-8') as out:
                    out.write(line + '\n')
            except Exception:
                pass
            print(line, flush=True)
        
        @app.before_request
        def _request_log_started():
            request.environ['ue_remote_request_started'] = time.monotonic()
        
        @app.after_request
        def _request_log_finished(response):
            if request.path not in ('/api/fs/roots', '/api/fs/list', '/api/logs'):
                started = request.environ.get('ue_remote_request_started', time.monotonic())
                elapsed_ms = (time.monotonic() - started) * 1000.0
                log('HTTP %s %s -> %s (%.1f ms)' % (request.method, request.path, response.status_code, elapsed_ms))
            return response
        
        def public_auth(fn):
        
            @wraps(fn)
            def wrapper(*args, **kwargs):
                return fn(*args, **kwargs)
            return wrapper
        
        def monitor_auth(fn):
        
            @wraps(fn)
            def wrapper(*args, **kwargs):
                auth = request.authorization
                valid = bool(FILE_MANAGER_PASSWORD and auth and (auth.type == 'basic') and (auth.username == FILE_MANAGER_USERNAME) and secrets.compare_digest(auth.password or '', FILE_MANAGER_PASSWORD))
                if not valid:
                    if not FILE_MANAGER_PASSWORD:
                        return (jsonify(ok=False, error='file_manager_password_not_configured'), 503)
                    response = app.response_class('Authentication required', status=401)
                    response.headers['WWW-Authenticate'] = 'Basic realm="UE58 File Manager"'
                    response.headers['Cache-Control'] = 'no-store'
                    return response
                return fn(*args, **kwargs)
            return wrapper
        
        def viewer_auth(fn):
            """Dedicated read-only token for the standalone desktop viewer."""
        
            @wraps(fn)
            def wrapper(*args, **kwargs):
                supplied = request.headers.get('Authorization', '')
                expected = 'Bearer ' + VIEWER_TOKEN if VIEWER_TOKEN else ''
                if not expected or not secrets.compare_digest(supplied, expected):
                    return (jsonify(ok=False, error='viewer_unauthorized'), 401)
                return fn(*args, **kwargs)
            return wrapper
        
        def safe_monitor_value(value, key='', depth=0):
            if depth > 5:
                return '[nested value omitted]'
            if any((word in str(key).lower() for word in ('token', 'secret', 'password', 'authorization', 'credential', 'base64', 'private_key', 'data'))):
                return '[redacted]'
            if isinstance(value, dict):
                return {str(k): safe_monitor_value(v, str(k), depth + 1) for k, v in list(value.items())[:25]}
            if isinstance(value, (list, tuple)):
                return [safe_monitor_value(v, key, depth + 1) for v in list(value)[:20]]
            if isinstance(value, str):
                text_value = value
                text_value = re.sub('(?i)(password|passwd|token|secret|api[_-]?key|authorization)(\\s*[:=]\\s*)([\'\\"])[^\'\\"]*\\3', '\\1\\2[redacted]', text_value)
                text_value = re.sub('(?i)(Bearer\\s+)[A-Za-z0-9._~+/-]+=*', '\\1[redacted]', text_value)
                text_value = re.sub('(?i)([?&](?:token|secret|password|api_key)=)[^&\\s]+', '\\1[redacted]', text_value)
                text_value = re.sub('\\b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\\b', '[redacted]', text_value)
                return text_value if len(text_value) <= 2500 else text_value[:2500] + ' …[truncated]'
            if value is None or isinstance(value, (int, float, bool)):
                return value
            return str(value)[:500]
        
        def monitor_event_start(tool_name, arguments):
            event = {'id': uuid.uuid4().hex[:12], 'time': time.time(), 'tool': str(tool_name or 'unknown'), 'arguments': safe_monitor_value(arguments or {}), 'status': 'running', 'http_status': None, 'duration_ms': None}
            with MONITOR_LOCK:
                MONITOR_EVENTS.appendleft(event)
            log('MCP_TOOL_STARTED name=' + event['tool'])
            return event['id']
        
        def monitor_event_finish(event_id, http_status=None, error='', response_preview=''):
            now = time.time()
            with MONITOR_LOCK:
                for event in MONITOR_EVENTS:
                    if event['id'] == event_id:
                        event['status'] = 'error' if error or (http_status and http_status >= 400) else 'completed'
                        event['http_status'] = http_status
                        event['duration_ms'] = int((now - event['time']) * 1000)
                        if error:
                            event['error'] = str(safe_monitor_value(str(error)))[:1000]
                        if response_preview:
                            event['result_preview'] = str(response_preview)[:4000]
                        break
            with MONITOR_LOCK:
                finished = next((dict(item) for item in MONITOR_EVENTS if item.get('id') == event_id), {})
            status_text = finished.get('status', 'unknown')
            log('MCP_TOOL_%s name=%s http_status=%s duration_ms=%s' % (status_text.upper(), finished.get('tool', 'unknown'), http_status, finished.get('duration_ms')))
        
        def monitor_response_preview(raw_bytes):
            if not raw_bytes:
                return ''
            raw_text = raw_bytes.decode('utf-8', errors='replace')
            try:
                value = json.loads(raw_text)
                return json.dumps(safe_monitor_value(value), ensure_ascii=False, default=str)[:4000]
            except Exception:
                return str(safe_monitor_value(raw_text))[:2000]
        
        def bridge_auth(fn):
        
            @wraps(fn)
            def wrapper(*args, **kwargs):
                if not BRIDGE_TOKEN or request.headers.get('Authorization', '') != 'Bearer ' + BRIDGE_TOKEN:
                    return (jsonify(ok=False, error='unauthorized_internal'), 401)
                return fn(*args, **kwargs)
            return wrapper
        
        def safe_path(value):
            if not value:
                raise ValueError('path is required')
            candidate = Path(value)
            if not candidate.is_absolute():
                candidate = ROOT / candidate
            resolved = candidate.resolve()
            if resolved != ROOT and ROOT not in resolved.parents:
                raise ValueError('path must stay inside D:\\UE58')
            return resolved
        
        def editor_tick_age_seconds(now=None):
            now = time.time() if now is None else float(now)
            if last_editor_tick_at <= 0:
                return None
            return max(0.0, now - last_editor_tick_at)
        
        def bridge_network_connected(now=None):
            now = time.time() if now is None else float(now)
            return last_bridge_seen > 0 and now - last_bridge_seen < 12.0
        
        def editor_responsive(now=None):
            age = editor_tick_age_seconds(now)
            return age is not None and age < EDITOR_TICK_STALE_SECONDS
        
        def bridge_connected():
            return bridge_network_connected() and editor_responsive()
        
        def editor_save_code():
            """Save only packages Unreal currently marks dirty, then verify they are clean."""
            return textwrap.dedent("        import unreal, time\n        started = time.perf_counter()\n        utils = unreal.EditorLoadingAndSavingUtils\n        dirty_maps = list(utils.get_dirty_map_packages())\n        dirty_content = list(utils.get_dirty_content_packages())\n        packages = []\n        seen = set()\n        for package in dirty_maps + dirty_content:\n            try:\n                key = package.get_path_name()\n            except Exception:\n                key = str(package)\n            if key not in seen:\n                seen.add(key)\n                packages.append(package)\n        print('SAVE_DIRTY_MAPS=' + str(len(dirty_maps)))\n        print('SAVE_DIRTY_CONTENT=' + str(len(dirty_content)))\n        if not packages:\n            print('SAVE_RESULT=NO_DIRTY_PACKAGES')\n        else:\n            print('SAVE_PACKAGES=' + str(len(packages)))\n            saved = bool(utils.save_packages(packages, True))\n            remaining_maps = list(utils.get_dirty_map_packages())\n            remaining_content = list(utils.get_dirty_content_packages())\n            print('SAVE_RESULT=' + str(saved))\n            print('SAVE_REMAINING_MAPS=' + str(len(remaining_maps)))\n            print('SAVE_REMAINING_CONTENT=' + str(len(remaining_content)))\n            if not saved or remaining_maps or remaining_content:\n                raise RuntimeError('Unreal did not confirm that every dirty package was saved.')\n        print('SAVE_DURATION_MS=' + str(round((time.perf_counter() - started) * 1000.0, 1)))\n    ").strip()
        
        def queue_unreal(code, timeout=60):
            now = time.time()
            if not bridge_network_connected(now):
                return ({'ok': False, 'error': 'unreal_bridge_not_connected', 'message': 'The Unreal bridge network worker is not responding.'}, 503)
            tick_age = editor_tick_age_seconds(now)
            if tick_age is None or tick_age >= EDITOR_TICK_STALE_SECONDS:
                return ({'ok': False, 'error': 'unreal_editor_not_responsive', 'editor_tick_age_seconds': tick_age, 'message': 'The network bridge is online, but the Unreal Editor main thread is not ticking. A modal dialog or a blocked Editor operation may be active.'}, 503)
            if not isinstance(code, str) or not code.strip():
                return ({'ok': False, 'error': 'code must be a non-empty string'}, 400)
            if len(code) > 100000:
                return ({'ok': False, 'error': 'code exceeds 100000 characters'}, 413)
            try:
                timeout = max(1, min(300, int(timeout)))
            except (ValueError, TypeError):
                timeout = 60
            job_id, event = (uuid.uuid4().hex, threading.Event())
            with lock:
                waiting[job_id] = {'event': event, 'result': None, 'created': time.time()}
            jobs.put({'id': job_id, 'code': code, 'created_at': time.time()})
            if not event.wait(timeout):
                return ({'ok': True, 'status': 'pending', 'job_id': job_id, 'message': 'Still running; call unreal_wait_python_job with this job_id.'}, 202)
            with lock:
                row = waiting.pop(job_id, None)
            result = row['result'] if row else None
            if not result:
                return ({'ok': False, 'error': 'missing_result', 'job_id': job_id}, 500)
            return ({'ok': not bool(result.get('error')), 'status': 'completed', 'output': result.get('output', ''), 'error': result.get('error', ''), 'job_id': job_id}, 200)
        
        def wait_unreal_job(job_id, timeout=180):
            """Wait for an Unreal bridge job that queue_unreal returned as HTTP 202."""
            job_id = str(job_id or '').strip()
            if not job_id:
                return ({'ok': False, 'error': 'job_id is required'}, 400)
            with lock:
                row = waiting.get(job_id)
            if row is None:
                return ({'ok': False, 'error': 'job_not_found_or_expired', 'job_id': job_id}, 404)
            try:
                timeout = max(1, min(300, int(timeout)))
            except (TypeError, ValueError):
                timeout = 180
            if not row['event'].wait(timeout):
                return ({'ok': True, 'status': 'pending', 'job_id': job_id}, 202)
            with lock:
                row = waiting.pop(job_id, None)
            result = row.get('result') if row else None
            if not result:
                return ({'ok': False, 'error': 'missing_result', 'job_id': job_id}, 500)
            return ({'ok': not bool(result.get('error')), 'status': 'completed', 'output': result.get('output', ''), 'error': result.get('error', ''), 'job_id': job_id}, 200)
        
        def google_drive():
            raw = os.environ.get('GG_UE_TOKEN', '')
            if not raw:
                raise RuntimeError('GG_UE_TOKEN is missing from GitHub Actions Secrets')
            try:
                info = json.loads(raw)
            except json.JSONDecodeError as exc:
                raise RuntimeError('GG_UE_TOKEN must be full authorized_user.json or service-account JSON') from exc
            scopes = ['https://www.googleapis.com/auth/drive']
            from google.auth.transport.requests import Request
            from google.auth.transport.requests import AuthorizedSession
            from googleapiclient.discovery import build
            if 'client_email' in info and 'private_key' in info:
                from google.oauth2 import service_account
                creds = service_account.Credentials.from_service_account_info(info, scopes=scopes)
            elif info.get('refresh_token') and info.get('client_id') and info.get('client_secret'):
                from google.oauth2.credentials import Credentials
                creds = Credentials.from_authorized_user_info(info, scopes=scopes)
            else:
                raise RuntimeError('Unsupported credentials; use authorized_user.json or service-account JSON')
            if not creds.valid:
                creds.refresh(Request())
            return build('drive', 'v3', credentials=creds, cache_discovery=False)
        
        def upload_drive_file(source_path, metadata):
            from googleapiclient.http import MediaFileUpload
            media = MediaFileUpload(str(source_path), resumable=True, chunksize=8 * 1024 * 1024)
            req = google_drive().files().create(body=metadata, media_body=media, fields='id,name,mimeType,size,webViewLink')
            response = None
            while response is None:
                status, response = req.next_chunk(num_retries=2)
                if status:
                    log('Google Drive upload progress: %s%%' % int(status.progress() * 100))
            return response
        
        def github_release_upload(source_path, tag, filename='', release_name='', release_notes='', replace_existing=True):
            import requests
            from urllib.parse import quote
            from os import environ
            token = environ.get('GITHUB_TOKEN', '')
            repository = environ.get('GITHUB_REPOSITORY', '')
            if not token or '/' not in repository:
                raise RuntimeError('GITHUB_TOKEN or GITHUB_REPOSITORY is unavailable')
            tag = str(tag or '').strip()
            if not re.fullmatch('[A-Za-z0-9][A-Za-z0-9._-]{0,99}', tag):
                raise ValueError('Invalid release tag')
            name = str(filename or source_path.name).strip()
            if not name or Path(name).name != name or any((c in name for c in ('/', '\\', '\r', '\n'))):
                raise ValueError('filename must be a simple filename')
            if source_path.stat().st_size <= 0:
                raise ValueError('source file is empty')
            base = 'https://api.github.com/repos/' + repository
            session = requests.Session()
            session.headers.update({'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'})
            resp = session.get(base + '/releases/tags/' + quote(tag, safe=''), timeout=(10, 30))
            if resp.status_code == 404:
                repo_resp = session.get(base, timeout=(10, 30))
                if not repo_resp.ok:
                    raise RuntimeError('Could not read repository default branch: HTTP %s %s' % (repo_resp.status_code, repo_resp.text[:300]))
                default_branch = str(repo_resp.json().get('default_branch') or 'main')
                resp = session.post(base + '/releases', json={'tag_name': tag, 'target_commitish': default_branch, 'name': release_name or tag, 'body': release_notes or 'Uploaded by UE Remote API', 'draft': False, 'prerelease': False, 'generate_release_notes': False}, timeout=(10, 30))
                if resp.status_code != 201:
                    raise RuntimeError("Could not create GitHub Release/tag '%s' from '%s': HTTP %s %s" % (tag, default_branch, resp.status_code, resp.text[:500]))
                release = resp.json()
            elif resp.ok:
                release = resp.json()
            else:
                raise RuntimeError('GitHub Release lookup failed: HTTP %s %s' % (resp.status_code, resp.text[:500]))
            upload_url = release.get('upload_url', '').split('{', 1)[0]
            release_id = release.get('id')
            if not upload_url or not release_id:
                raise RuntimeError('GitHub response omitted release id/upload URL')
            aresp = session.get(base + '/releases/' + str(release_id) + '/assets', params={'per_page': 100}, timeout=(10, 30))
            if not aresp.ok:
                raise RuntimeError('Could not list release assets: HTTP %s' % aresp.status_code)
            for old in aresp.json():
                if old.get('name') == name or old.get('name', '').startswith(name + '.part'):
                    if not replace_existing:
                        raise RuntimeError('Release asset already exists: %s (enable Replace same-name assets or choose a different filename)' % old.get('name'))
                    deleted = session.delete(base + '/releases/assets/' + str(old['id']), timeout=(10, 30))
                    if deleted.status_code != 204:
                        raise RuntimeError('Could not replace old asset %s' % old.get('name'))
            maxpart = 1800000000
            payloads, tmp = ([], None)
            try:
                if source_path.stat().st_size <= maxpart:
                    payloads = [(source_path, name)]
                else:
                    tmp = tempfile.TemporaryDirectory(prefix='release-parts-', dir=str(ROOT / 'Uploads'))
                    partno = 1
                    with source_path.open('rb') as src:
                        while True:
                            part = Path(tmp.name) / (name + '.part%03d' % partno)
                            wrote = 0
                            with part.open('wb') as dst:
                                while wrote < maxpart:
                                    block = src.read(min(8 * 1024 * 1024, maxpart - wrote))
                                    if not block:
                                        break
                                    dst.write(block)
                                    wrote += len(block)
                            if not wrote:
                                part.unlink(missing_ok=True)
                                break
                            payloads.append((part, part.name))
                            partno += 1
                uploaded = []
                for path, remote_name in payloads:
                    with path.open('rb') as stream:
                        up = session.post(upload_url, params={'name': remote_name}, data=stream, headers={'Content-Type': 'application/octet-stream', 'Content-Length': str(path.stat().st_size)}, timeout=(30, 300))
                    if up.status_code != 201:
                        raise RuntimeError('Release asset upload failed for %s: HTTP %s %s' % (remote_name, up.status_code, up.text[:500]))
                    obj = up.json()
                    uploaded.append({'name': obj.get('name', remote_name), 'size': obj.get('size'), 'url': obj.get('browser_download_url', '')})
                result = {'ok': True, 'repository': repository, 'tag': tag, 'release_url': release.get('html_url', ''), 'source': str(source_path), 'original_size': source_path.stat().st_size, 'split_into_parts': len(uploaded) > 1, 'assets': uploaded}
                if len(uploaded) > 1:
                    result['reassemble_note'] = 'Download the parts in order and use Windows CMD: copy /b ' + '+'.join((x['name'] for x in uploaded)) + ' ' + name
                return result
            finally:
                if tmp is not None:
                    tmp.cleanup()
        
