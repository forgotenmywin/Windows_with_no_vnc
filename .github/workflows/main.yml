name: UE 5.8 Remote Studio - Advanced Live Control + Headless Commandlets + Windows Optimization (MCP SSE 502 Fix)
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  ue-remote:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Prepare D drive
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $root = ''D:\UE58''

        New-Item -ItemType Directory -Force -Path $root, "$root\parts", "$root\Logs", "$root\Projects", "$root\Screenshots",
        "$root\Uploads" | Out-Null

        try { Start-Transcript -Path "$root\Logs\workflow-prepare-transcript.log" -Append -Force | Out-Null } catch { }

        $drive = Get-PSDrive D -ErrorAction SilentlyContinue

        if (-not $drive) { throw ''Drive D is not available on this runner.'' }

        Write-Host ("D: available space: {0:N2} GB" -f ($drive.Free / 1GB))

        "UE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        '
    - name: Download and extract Unreal Engine 5.8
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\ntry { Start-Transcript -Path \"$root\\Logs\\workflow-extract-transcript.log\"\
        \ -Append -Force | Out-Null } catch { }\n$partsDir = \"$root\\parts\"\n$archive = \"$root\\UE_5.8.zip\"\n$extract\
        \ = \"$root\\Extracted\"\n\ngh release download ue5.8 --repo forgotenmywin/Windows_with_no_vnc --pattern 'UE_5.8.zip.*'\
        \ --dir $partsDir --clobber\nif ($LASTEXITCODE -ne 0) { throw 'Could not download release assets UE_5.8.zip.*.' }\n\
        \n$parts = @(Get-ChildItem -LiteralPath $partsDir -File | Where-Object { $_.Name -like 'UE_5.8.zip.*' } | Sort-Object\
        \ Name)\nif ($parts.Count -lt 2) { throw \"Expected split ZIP parts; found $($parts.Count). Check release tag/assets.\"\
        \ }\n\nif (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }\n$destination = [System.IO.File]::Open($archive,\
        \ [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)\ntry {\n  $buffer =\
        \ New-Object byte[] (4MB)\n  foreach ($part in $parts) {\n    Write-Host (\"Joining {0} ({1:N2} GB)\" -f $part.Name,\
        \ ($part.Length / 1GB))\n    $source = [System.IO.File]::OpenRead($part.FullName)\n    try {\n      while (($read\
        \ = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {\n        $destination.Write($buffer, 0, $read)\n      }\n \
        \   }\n    finally { $source.Dispose() }\n  }\n}\nfinally { $destination.Dispose() }\n\n$sevenZip = (Get-Command 7z.exe\
        \ -ErrorAction SilentlyContinue).Source\nif (-not $sevenZip) {\n  $sevenZip = @('C:\\Program Files\\7-Zip\\7z.exe','C:\\\
        Program Files (x86)\\7-Zip\\7z.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1\n}\nif (-not $sevenZip)\
        \ {\n  choco install 7zip -y --no-progress\n  if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }\n  $sevenZip\
        \ = 'C:\\Program Files\\7-Zip\\7z.exe'\n}\nif (-not (Test-Path -LiteralPath $sevenZip)) { throw '7z.exe was not found.'\
        \ }\n\n& $sevenZip t $archive\nif ($LASTEXITCODE -ne 0) { throw 'Joined ZIP failed integrity testing.' }\nif (Test-Path\
        \ -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }\nNew-Item -ItemType Directory -Force\
        \ -Path $extract | Out-Null\n& $sevenZip x $archive \"-o$extract\" -y\nif ($LASTEXITCODE -ne 0) { throw 'Unreal Engine\
        \ extraction failed.' }\n\n$editor = Get-ChildItem -LiteralPath $extract -Filter UnrealEditor.exe -File -Recurse -ErrorAction\
        \ SilentlyContinue |\n  Where-Object { $_.FullName -match '\\\\Engine\\\\Binaries\\\\Win64\\\\UnrealEditor\\.exe$'\
        \ } |\n  Select-Object -First 1\nif (-not $editor) { throw 'UnrealEditor.exe was not found.' }\nWrite-Host \"EDITOR_EXE=$($editor.FullName)\"\
        \n\"UE_EDITOR_EXE=$($editor.FullName)\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Create UE project, bridge and API server
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\ntry { Start-Transcript -Path \"$root\\Logs\\workflow-setup-transcript.log\"\
        \ -Append -Force | Out-Null } catch { }\n$project = \"$root\\UEControl\"\n$pythonDir = \"$project\\Content\\Python\"\
        \n$config = \"$project\\Config\"\nNew-Item -ItemType Directory -Force -Path $pythonDir, $config, \"$root\\Projects\"\
        , \"$root\\Screenshots\", \"$root\\Uploads\", \"$root\\Logs\" | Out-Null\n\n$uproject = @'\n{\n  \"FileVersion\":\
        \ 3,\n  \"EngineAssociation\": \"5.8\",\n  \"Category\": \"RemoteControl\",\n  \"Description\": \"Unreal Editor controlled\
        \ through a remote API bridge\",\n  \"Plugins\": [\n    { \"Name\": \"PythonScriptPlugin\", \"Enabled\": true },\n\
        \    { \"Name\": \"EditorScriptingUtilities\", \"Enabled\": true },\n    { \"Name\": \"ModelContextProtocol\", \"\
        Enabled\": true },\n    { \"Name\": \"AllToolsets\", \"Enabled\": true },\n    { \"Name\": \"GLTFExporter\", \"Enabled\"\
        : true }\n  ]\n}\n'@\nSet-Content -LiteralPath \"$project\\UEControl.uproject\" -Value $uproject -Encoding utf8\n\n\
        $engineConfig = @'\n[/Script/EngineSettings.GameMapsSettings]\nEditorStartupMap=/Engine/Maps/Entry\nGameDefaultMap=/Engine/Maps/Entry\n\
        \n[/Script/PythonScriptPlugin.PythonScriptPluginSettings]\n+StartupScripts=D:/UE58/UEControl/Content/Python/init_unreal.py\n\
        bDeveloperMode=True\nbRemoteExecution=False\n\n[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]\n\
        bAutoStartServer=True\nServerPortNumber=8000\nServerUrlPath=/mcp\nbEnableToolSearch=True\n'@\nSet-Content -LiteralPath\
        \ \"$config\\DefaultEngine.ini\" -Value $engineConfig -Encoding utf8\n\n# GameFeatures requires an Asset Manager rule\
        \ for UGameFeatureData.\n# Keep this in DefaultGame.ini (UAssetManagerSettings uses Config=Game).\n$gameConfig = @'\n\
        [/Script/Engine.AssetManagerSettings]\n+PrimaryAssetTypesToScan=(PrimaryAssetType=\"GameFeatureData\",AssetBaseClass=\"\
        /Script/GameFeatures.GameFeatureData\",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=,SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))\n\
        bShouldGuessTypeAndNameInEditor=True\n'@\nSet-Content -LiteralPath \"$config\\DefaultGame.ini\" -Value $gameConfig\
        \ -Encoding utf8\n\n$editorSettings = @'\n[/Script/UnrealEd.EditorPerformanceSettings]\nbAllowSlateThrottling=True\n\
        bThrottleCPUWhenNotForeground=True\nbDisableRealtimeViewportsInRemoteSessions=True\n'@\nSet-Content -LiteralPath \"\
        $config\\DefaultEditorSettings.ini\" -Value $editorSettings -Encoding utf8\n\n\n$bridge = @'\nimport ast\nimport builtins\n\
        import contextlib\nimport io\nimport json\nimport os\nimport queue\nimport threading\nimport time\nimport traceback\n\
        import urllib.request\n\nROOT = os.environ.get(\"UE_ROOT\", r\"D:\\UE58\")\nLOG_FILE = os.path.join(ROOT, \"Logs\"\
        , \"unreal_bridge.log\")\nAPI = \"http://127.0.0.1:8766\"\nTOKEN = os.environ.get(\"BRIDGE_TOKEN\", \"\")\nINCOMING\
        \ = queue.Queue()\nOUTGOING = queue.Queue()\nEDITOR_TICK_AT = 0.0\nJOB_QUEUE_TTL_SECONDS = 45.0\nNAMESPACE = {\"__name__\"\
        : \"__ue_remote__\"}\n\n\ndef log(message):\n    line = time.strftime(\"%Y-%m-%d %H:%M:%S \") + str(message)\n   \
        \ try:\n        os.makedirs(os.path.dirname(LOG_FILE), exist_ok=True)\n        with open(LOG_FILE, \"a\", encoding=\"\
        utf-8\") as stream:\n            stream.write(line + \"\\n\")\n    except Exception:\n        pass\n    try:\n   \
        \     unreal.log(\"[UE58 Remote Bridge] \" + str(message))\n    except Exception:\n        pass\n\n\nlog(\"Startup\
        \ file loaded; token_present=%s; python=%s\" % (bool(TOKEN), __import__(\"sys\").version.split()[0]))\n\ntry:\n  \
        \  import unreal\nexcept Exception:\n    log(\"FATAL: cannot import Unreal Python module:\\n\" + traceback.format_exc())\n\
        \    raise\n\nif not TOKEN:\n    log(\"FATAL: BRIDGE_TOKEN is missing from Unreal process environment\")\n    raise\
        \ RuntimeError(\"BRIDGE_TOKEN missing\")\n\nif getattr(builtins, \"_UE58_REMOTE_BRIDGE_ACTIVE\", False):\n    log(\"\
        Duplicate startup invocation ignored; bridge is already active\")\nelse:\n    PREVIEW_GEOMETRY_READY = False\n   \
        \ PREVIEW_GEOMETRY_LAST_LOG = 0.0\n\n    def ensure_preview_geometry():\n        \"\"\"Create the test tree in a project-owned\
        \ map; never inject actors into an Engine map.\"\"\"\n        global PREVIEW_GEOMETRY_READY, PREVIEW_GEOMETRY_LAST_LOG\n\
        \        if PREVIEW_GEOMETRY_READY:\n            return True\n        try:\n            utils = unreal.EditorLoadingAndSavingUtils\n\
        \            editor = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem)\n            world = editor.get_editor_world()\n\
        \            if world is None:\n                return False\n\n            map_asset = \"/Game/Maps/PluginTree_Test_Fixed\"\
        \n            tree_asset_path = \"/PCG/SampleContent/SimpleForest/Meshes/PCG_Tree_01\"\n            current_world_path\
        \ = str(world.get_path_name())\n\n            # Never duplicate /Engine/Maps/Entry. If the project map already exists,\n\
        \            # load it; otherwise create a genuinely blank world and save it into /Game.\n            if map_asset\
        \ not in current_world_path:\n                if unreal.EditorAssetLibrary.does_asset_exist(map_asset):\n        \
        \            loaded_world = utils.load_map(map_asset)\n                    if loaded_world is None:\n            \
        \            raise RuntimeError(\"Existing project map could not be loaded: \" + map_asset)\n                    world\
        \ = loaded_world\n                    log(\"Loaded existing project-owned tree map: \" + map_asset)\n            \
        \    elif current_world_path.startswith(\"/Engine/\"):\n                    unreal.EditorAssetLibrary.make_directory(\"\
        /Game/Maps\")\n                    world = utils.new_blank_map(True)\n                    if world is None:\n    \
        \                    raise RuntimeError(\"EditorLoadingAndSavingUtils.new_blank_map returned None\")\n           \
        \         if not utils.save_map(world, map_asset):\n                        raise RuntimeError(\"Could not save new\
        \ blank map into \" + map_asset)\n                    log(\"Created independent project map; source Engine map was\
        \ not duplicated\")\n                else:\n                    # A user-selected project map is not a disposable\
        \ preview level.\n                    PREVIEW_GEOMETRY_READY = True\n                    log(\"Preserving user project\
        \ map; automatic tree test map was not injected into: \" + current_world_path)\n                    return True\n\n\
        \            # Do not duplicate the tree if the startup script is invoked again.\n            actors = list(unreal.EditorLevelLibrary.get_all_level_actors()\
        \ or [])\n            existing = next((a for a in actors if str(a.get_actor_label()) == \"NewPlugin_TestTree_01\"\
        ), None)\n            if existing is None:\n                mesh_asset = unreal.EditorAssetLibrary.load_asset(tree_asset_path)\n\
        \                if mesh_asset is None:\n                    raise RuntimeError(\"Tree mesh asset not found: \" +\
        \ tree_asset_path)\n                existing = unreal.EditorLevelLibrary.spawn_actor_from_object(\n              \
        \      mesh_asset,\n                    unreal.Vector(0.0, 0.0, 0.0),\n                    unreal.Rotator(0.0, 0.0,\
        \ 0.0),\n                )\n                if existing is None:\n                    raise RuntimeError(\"Could not\
        \ spawn the plugin tree actor\")\n                existing.set_actor_label(\"NewPlugin_TestTree_01\")\n          \
        \      log(\"Plugin tree actor spawned in project-owned map\")\n\n            # Save the active map explicitly to\
        \ /Game and verify the actual .umap file.\n            if not utils.save_map(world, map_asset):\n                raise\
        \ RuntimeError(\"Unreal returned false while saving \" + map_asset)\n            content_dir = unreal.Paths.project_content_dir()\n\
        \            map_file = os.path.join(content_dir, \"Maps\", \"PluginTree_Test_Fixed.umap\")\n            if not os.path.isfile(map_file)\
        \ or os.path.getsize(map_file) <= 0:\n                raise RuntimeError(\"Map save was not verified on disk: \" +\
        \ map_file)\n\n            try:\n                editor.set_level_viewport_camera_info(\n                    unreal.Vector(1050.0,\
        \ -1450.0, 900.0),\n                    unreal.Rotator(-27.0, 126.0, 0.0),\n                )\n            except\
        \ Exception as camera_error:\n                log(\"Tree map viewport camera could not be positioned: \" + str(camera_error))\n\
        \n            PREVIEW_GEOMETRY_READY = True\n            log(\"PROJECT_TREE_MAP_READY=true map=%s actor=%s file=%s\
        \ bytes=%s\" % (\n                map_asset, existing.get_actor_label(), map_file, os.path.getsize(map_file)\n   \
        \         ))\n            return True\n        except Exception:\n            now = time.time()\n            if now\
        \ - PREVIEW_GEOMETRY_LAST_LOG > 10:\n                log(\"Project tree map initialization failed:\\n\" + traceback.format_exc()[-2400:])\n\
        \                PREVIEW_GEOMETRY_LAST_LOG = now\n            return False\n\n    def request_json(path, payload=None,\
        \ timeout=12):\n        \"\"\"Send one authenticated request to the local bridge API.\"\"\"\n        data = None if\
        \ payload is None else json.dumps(payload).encode(\"utf-8\")\n        req = urllib.request.Request(\n            API\
        \ + path,\n            data=data,\n            headers={\n                \"Authorization\": \"Bearer \" + TOKEN,\n\
        \                \"Content-Type\": \"application/json\",\n                \"Accept\": \"application/json\",\n    \
        \            \"Connection\": \"close\",\n            },\n            method=\"GET\" if payload is None else \"POST\"\
        ,\n        )\n        with urllib.request.urlopen(req, timeout=timeout) as response:\n            raw_response = response.read().decode(\"\
        utf-8\")\n            return json.loads(raw_response) if raw_response else {}\n\n\n    # The Editor process remains\
        \ alive while idle. We stop continuous viewport\n    # rendering and cap the Editor frame rate; the network worker\
        \ keeps polling\n    # independently so a new MCP job wakes the Editor without a restart.\n    IDLE_AFTER_SECONDS\
        \ = 15.0\n    IDLE_MAX_FPS = 5\n    ACTIVE_MAX_FPS = 60\n    LAST_REMOTE_ACTIVITY = time.monotonic() - IDLE_AFTER_SECONDS\
        \ - 1.0\n    CURRENT_POWER_MODE = None\n    REMOTE_TOOL_ACTIVE = False\n\n    def set_editor_power_mode(mode):\n \
        \       \"\"\"Switch between low-CPU idle and normal interactive Editor modes.\"\"\"\n        global CURRENT_POWER_MODE\n\
        \        if mode == CURRENT_POWER_MODE:\n            return\n\n        make_realtime = (mode == \"active\")\n    \
        \    try:\n            level_editor = unreal.get_editor_subsystem(unreal.LevelEditorSubsystem)\n            if level_editor\
        \ is not None:\n                # Apply the mode to every available Level Editor viewport, not\n                #\
        \ only the currently active perspective viewport.\n                try:\n                    viewport_keys = list(level_editor.get_viewport_config_keys()\
        \ or [])\n                except Exception:\n                    viewport_keys = []\n                if viewport_keys:\n\
        \                    for viewport_key in viewport_keys:\n                        try:\n                          \
        \  level_editor.editor_set_viewport_realtime(make_realtime, viewport_key)\n                        except Exception\
        \ as viewport_error:\n                            log(\"Viewport power switch failed for %s: %s\" % (str(viewport_key),\
        \ repr(viewport_error)))\n                else:\n                    level_editor.editor_set_viewport_realtime(make_realtime)\n\
        \                level_editor.editor_invalidate_viewports()\n        except Exception as exc:\n            log(\"\
        Viewport realtime switch failed (%s): %s\" % (mode, repr(exc)))\n\n        try:\n            editor = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem)\n\
        \            world = editor.get_editor_world() if editor is not None else None\n            if world is not None:\n\
        \                fps = ACTIVE_MAX_FPS if make_realtime else IDLE_MAX_FPS\n                unreal.SystemLibrary.execute_console_command(world,\
        \ \"t.MaxFPS %d\" % fps)\n                # Slate throttling remains enabled in both modes. It reduces\n         \
        \       # unnecessary UI/background work without disabling the bridge.\n                unreal.SystemLibrary.execute_console_command(world,\
        \ \"Slate.bAllowThrottling 1\")\n        except Exception as exc:\n            log(\"Editor frame-throttle switch\
        \ failed (%s): %s\" % (mode, repr(exc)))\n\n        CURRENT_POWER_MODE = mode\n        log(\"EDITOR_POWER_MODE=%s\
        \ viewport_realtime=%s max_fps=%s\" % (\n            mode, make_realtime, ACTIVE_MAX_FPS if make_realtime else IDLE_MAX_FPS\n\
        \        ))\n\n\n    def network_worker():\n        global LAST_REMOTE_ACTIVITY, REMOTE_TOOL_ACTIVE\n        log(\"\
        Bridge network worker started; connecting to local API\")\n        connected_logged = False\n        last_error_log\
        \ = 0.0\n        while True:\n            try:\n                while True:\n                    try:\n          \
        \              payload = OUTGOING.get_nowait()\n                    except queue.Empty:\n                        break\n\
        \                    try:\n                        request_json(\"/internal/result\", payload, timeout=12)\n     \
        \               except Exception as exc:\n                        OUTGOING.put(payload)\n                        time.sleep(0.5)\n\
        \                        log(\"Posting execution result failed: \" + repr(exc))\n\n                # This authenticated\
        \ poll is also the bridge heartbeat. The API\n                # marks the bridge online only after it receives this\
        \ request.\n                reply = request_json(\"/internal/next\", {\"wait\": 1, \"editor_tick_at\": EDITOR_TICK_AT},\
        \ timeout=12)\n                if not connected_logged:\n                    log(\"Authenticated connection to local\
        \ API established\")\n                    connected_logged = True\n                REMOTE_TOOL_ACTIVE = bool(reply.get(\"\
        editor_active\")) if isinstance(reply, dict) else False\n                if isinstance(reply, dict) and bool(reply.get(\"\
        editor_busy\")):\n                    LAST_REMOTE_ACTIVITY = time.monotonic()\n                job = reply.get(\"\
        job\") if isinstance(reply, dict) else None\n                if job:\n                    LAST_REMOTE_ACTIVITY = time.monotonic()\n\
        \                    INCOMING.put(job)\n            except Exception as exc:\n                connected_logged = False\n\
        \                now = time.time()\n                if now - last_error_log >= 5:\n                    log(\"Local\
        \ API polling failed: \" + repr(exc))\n                    last_error_log = now\n                time.sleep(1.0)\n\
        \n\n    def editor_tick(delta_seconds):\n        # This value is read by the separate network worker and forwarded\
        \ to\n        # the API. It proves that the actual Unreal Editor thread is ticking.\n        global EDITOR_TICK_AT,\
        \ LAST_REMOTE_ACTIVITY\n        EDITOR_TICK_AT = time.time()\n\n        if not PREVIEW_GEOMETRY_READY:\n         \
        \   ensure_preview_geometry()\n\n        try:\n            job = INCOMING.get_nowait()\n        except queue.Empty:\n\
        \            # Native AllToolsets calls are proxied directly to Unreal's MCP\n            # listener. Keep the viewport\
        \ awake while one of those calls runs.\n            if REMOTE_TOOL_ACTIVE:\n                set_editor_power_mode(\"\
        active\")\n                return\n            # After both command queues have remained idle, stop continuous\n \
        \           # viewport rendering and run the live Editor at a low frame cap.\n            if time.monotonic() - LAST_REMOTE_ACTIVITY\
        \ >= IDLE_AFTER_SECONDS:\n                set_editor_power_mode(\"idle\")\n            return\n\n        # Wake the\
        \ viewport before executing any remote operation.\n        LAST_REMOTE_ACTIVITY = time.monotonic()\n        set_editor_power_mode(\"\
        active\")\n\n        job_id = str(job.get(\"id\", \"\"))\n        created_at = job.get(\"created_at\", EDITOR_TICK_AT)\n\
        \        try:\n            queue_age = max(0.0, EDITOR_TICK_AT - float(created_at))\n        except (TypeError, ValueError):\n\
        \            queue_age = 0.0\n\n        # Never execute an old command minutes after a blocked modal dialog or\n \
        \       # a stalled Editor has recovered. Return an explicit result instead.\n        if queue_age > JOB_QUEUE_TTL_SECONDS:\n\
        \            error = \"Command expired in the Unreal Editor queue after %.1f seconds; submit it again.\" % queue_age\n\
        \            log(\"Discarding expired remote Python job %s; age=%.1fs\" % (job_id, queue_age))\n            OUTGOING.put({\"\
        id\": job_id, \"output\": \"\", \"error\": error})\n            LAST_REMOTE_ACTIVITY = time.monotonic()\n        \
        \    return\n\n        started = time.perf_counter()\n        log(\"Executing remote Python job %s; queue_age=%.3fs\"\
        \ % (job_id, queue_age))\n        output, error = execute_code(job.get(\"code\", \"\"))\n        elapsed = time.perf_counter()\
        \ - started\n        log(\"Remote Python job %s finished; duration=%.3fs error=%s\" % (job_id, elapsed, bool(error)))\n\
        \        OUTGOING.put({\"id\": job_id, \"output\": output, \"error\": error})\n        LAST_REMOTE_ACTIVITY = time.monotonic()\n\
        \n    def execute_code(source):\n        captured = io.StringIO()\n        error = \"\"\n        try:\n          \
        \  parsed = ast.parse(source, filename=\"<remote-unreal-python>\", mode=\"exec\")\n            with contextlib.redirect_stdout(captured),\
        \ contextlib.redirect_stderr(captured):\n                if parsed.body and isinstance(parsed.body[-1], ast.Expr):\n\
        \                    prefix = ast.Module(body=parsed.body[:-1], type_ignores=[])\n                    if prefix.body:\n\
        \                        exec(compile(prefix, \"<remote-unreal-python>\", \"exec\"), NAMESPACE, NAMESPACE)\n     \
        \               value = eval(\n                        compile(ast.Expression(parsed.body[-1].value), \"<remote-unreal-python>\"\
        , \"eval\"),\n                        NAMESPACE,\n                        NAMESPACE,\n                    )\n    \
        \                if value is not None:\n                        print(repr(value))\n                else:\n      \
        \              exec(compile(parsed, \"<remote-unreal-python>\", \"exec\"), NAMESPACE, NAMESPACE)\n        except Exception\
        \ as exc:\n            error = \"\".join(traceback.format_exception(type(exc), exc, exc.__traceback__))\n        output\
        \ = captured.getvalue().strip()\n        if not output and not error:\n            output = \"Executed successfully\
        \ (no output).\"\n        return output, error\n\n    try:\n        CALLBACK_HANDLE = unreal.register_slate_post_tick_callback(editor_tick)\n\
        \        threading.Thread(target=network_worker, name=\"UE58-Remote-Network\", daemon=True).start()\n        builtins._UE58_REMOTE_BRIDGE_ACTIVE\
        \ = True\n        version = unreal.SystemLibrary.get_engine_version()\n        log(\"BRIDGE_READY; UE_VERSION=\" +\
        \ str(version))\n        print(\"UE_REMOTE_BRIDGE_READY \" + str(version))\n    except Exception:\n        log(\"\
        FATAL: bridge registration failed:\\n\" + traceback.format_exc())\n        raise\n\n'@\nSet-Content -LiteralPath \"\
        $pythonDir\\init_unreal.py\" -Value $bridge -Encoding utf8\n\n$api = @'\nimport ast, asyncio, base64, binascii, contextlib,\
        \ hashlib, io, json, os, queue, re, secrets, shutil, tempfile, threading, time, traceback, uuid, textwrap\nfrom collections\
        \ import deque\nfrom pathlib import Path\nfrom functools import wraps\nfrom http.server import BaseHTTPRequestHandler,\
        \ ThreadingHTTPServer\nfrom flask import Flask, jsonify, request, send_file\napp = Flask(__name__)\napp.config['MAX_CONTENT_LENGTH']\
        \ = 8 * 1024 * 1024 * 1024\nROOT = Path(os.environ.get('UE_ROOT', 'D:\\\\UE58')).resolve()\nLOG_DIR = ROOT / 'Logs'\n\
        LOG_DIR.mkdir(parents=True, exist_ok=True)\nLOG_FILE = LOG_DIR / 'api.log'\nBRIDGE_TOKEN = os.environ.get('BRIDGE_TOKEN',\
        \ '')\nFILE_MANAGER_USERNAME = 'viewer'\nFILE_MANAGER_PASSWORD = os.environ.get('MONITOR_PASSWORD', '')\nVIEWER_TOKEN\
        \ = os.environ.get('VIEWER_TOKEN', '')\nVIEWER_EXE_PATH = (ROOT / 'Viewer' / 'UE58SceneViewer.exe').resolve()\nMONITOR_LOCK\
