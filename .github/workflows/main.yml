        def _write_scene_html_after_export():
            """Render the same view-only HTML response and atomically persist it beside scene assets."""
            with app.test_request_context("/api/scene/export.html", method="GET"):
                original = getattr(api_scene_export_html, "__wrapped__", api_scene_export_html)
                response = original()
                if getattr(response, "status_code", 200) != 200:
                    try:
                        detail = response.get_data(as_text=True)
                    except Exception:
                        detail = "HTML response failed"
                    raise RuntimeError("HTML generation returned HTTP %s: %s" % (response.status_code, detail[:600]))
                payload = response.get_data()
            if not payload or b"Unreal Scene" not in payload or b"scene-data" not in payload:
                raise RuntimeError("Generated HTML is empty or missing embedded scene data")
            temporary = SCENE_HTML_PATH.with_suffix(".html.tmp")
            temporary.write_bytes(payload)
            os.replace(str(temporary), str(SCENE_HTML_PATH))
            return SCENE_HTML_PATH


        def _run_scene_autocapture(tool_name=""):
            """Refresh actor metadata and export a new GLB+HTML after a successful scene-changing MCP tool."""
            if not bridge_connected():
                log("Automatic scene refresh skipped: Unreal Bridge is offline")
                return
            with SCENE_MODEL_LOCK:
                export_is_active = SCENE_MODEL_STATE.get("status") in ("queued", "running")
            if export_is_active:
                # Keep the final scene change: retry after the in-flight export completes.
                retry = threading.Timer(5.0, _run_scene_autocapture, args=(tool_name,))
                retry.daemon = True
                retry.start()
                log("Automatic scene refresh deferred: waiting for the current geometry export")
                return
            scan_id = uuid.uuid4().hex
            try:
                payload = _scene_snapshot_from_unreal(timeout=10000, job_id=scan_id)
                payload["updated"] = time.time()
                payload["updated_at"] = payload["updated"]
                with SCENE_LOCK:
                    SCENE_CACHE.update(payload)
                    SCENE_CACHE["error"] = ""
                with SCENE_MODEL_LOCK:
                    if SCENE_MODEL_STATE.get("status") in ("queued", "running"):
                        return
                    job_id = uuid.uuid4().hex
                    SCENE_MODEL_STATE.update({"status": "queued", "job_id": job_id, "error": "",
                                              "html_ready": False, "html_error": "", "progress": 0,
                                              "phase": "Automatic export after Unreal change",
                                              "completed": 0, "total": 0,
                                              "detail": "Updated after tool: " + str(tool_name)[:120],
                                              "started_at": time.time()})
                threading.Thread(target=_scene_model_export_worker, args=(job_id,),
                                 name="UE-AutoScene-" + job_id[:8], daemon=True).start()
                log("Automatic scene export queued after tool: " + str(tool_name))
            except Exception as exc:
                log("Automatic scene refresh failed after %s: %s" % (tool_name, repr(exc)))


        def _schedule_scene_autocapture(tool_name=""):
            """Debounce tool activity so a multi-step operation creates one final snapshot."""
            global SCENE_AUTO_TIMER, SCENE_AUTO_LAST_TOOL
            with SCENE_AUTO_LOCK:
                SCENE_AUTO_LAST_TOOL = str(tool_name or "Unreal tool")
                if SCENE_AUTO_TIMER is not None:
                    try:
                        SCENE_AUTO_TIMER.cancel()
                    except Exception:
                        pass
                SCENE_AUTO_TIMER = threading.Timer(3.0, _run_scene_autocapture, args=(SCENE_AUTO_LAST_TOOL,))
                SCENE_AUTO_TIMER.daemon = True
                SCENE_AUTO_TIMER.start()


