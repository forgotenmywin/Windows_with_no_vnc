
name: Unreal Engine 5.8 - noVNC and Release Download

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare folders and check disk space
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force D:\UE58,D:\UE58\Parts,D:\UE58\Extracted | Out-Null
          Get-PSDrive D
          $free = (Get-PSDrive D).Free / 1GB
          Write-Host "Free D drive: $([math]::Round($free,2)) GB"
          if ($free -lt 50) {
            throw "Not enough disk space. Need approximately 50 GB free."
          }

      - name: Enable Remote Desktop
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in repository Actions secrets."
          }

          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (-not (Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "runneradmin" -Password $secure -PasswordNeverExpires
          } else {
            Set-LocalUser -Name "runneradmin" -Password $secure
          }

          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService

      - name: Install TightVNC
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Add VNC_PASSWORD in repository Actions secrets."
          }
          if ($env:VNC_PASSWORD.Length -gt 8) {
            throw "TightVNC password must be 8 characters or fewer."
          }

          $msi = "$env:TEMP\tightvnc.msi"
          Invoke-WebRequest `
            "https://www.tightvnc.com/download/2.8.84/tightvnc-2.8.84-gpl-setup-64bit.msi" `
            -OutFile $msi

          $args = "/i `"$msi`" /quiet /norestart ADDLOCAL=Server SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=$($env:VNC_PASSWORD) SET_USECONTROLAUTHENTICATION=0"
          $p = Start-Process msiexec.exe -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) {
            throw "TightVNC installer failed with exit code $($p.ExitCode)"
          }

          Get-Service *vnc* | Format-Table Name,Status
          Get-Service tvnserver -ErrorAction SilentlyContinue |
            Set-Service -StartupType Automatic
          Start-Service tvnserver -ErrorAction SilentlyContinue

      - name: Install noVNC and websockify
        shell: powershell
        run: |
          $base = "D:\UE58\noVNC"
          New-Item -ItemType Directory -Force $base | Out-Null

          Invoke-WebRequest `
            "https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.zip" `
            -OutFile "$env:TEMP\novnc.zip"

          Expand-Archive "$env:TEMP\novnc.zip" "$env:TEMP\novnc-src" -Force
          Copy-Item "$env:TEMP\novnc-src\noVNC-1.6.0\*" $base -Recurse -Force

          py -m pip install --upgrade pip
          py -m pip install websockify

          $sock = Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue
          if (-not $sock) {
            throw "TightVNC is not listening on port 5900."
          }

          $ws = (Get-Command websockify.exe -ErrorAction SilentlyContinue).Source
          if (-not $ws) {
            $ws = (Get-Command websockify -ErrorAction Stop).Source
          }

          Start-Process -FilePath $ws `
            -ArgumentList @("--web", $base, "6080", "127.0.0.1:5900") `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5
          $port = Get-NetTCPConnection -LocalPort 6080 -State Listen -ErrorAction SilentlyContinue
          if (-not $port) {
            throw "noVNC websockify failed to start."
          }

          $r = curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:6080/vnc.html
          Write-Host "noVNC HTTP status: $r"

      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $cf = "D:\UE58\cloudflared.exe"
          Invoke-WebRequest `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cf

          $log = "D:\UE58\cloudflared.log"
          Start-Process -FilePath $cf `
            -ArgumentList @("tunnel","--no-autoupdate","--url","http://127.0.0.1:6080") `
            -RedirectStandardOutput $log `
            -RedirectStandardError $log `
            -WindowStyle Hidden

          $url = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $log) {
              $match = Select-String -Path $log `
                -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' `
                -AllMatches
              if ($match) {
                $url = $match.Matches[-1].Value
                break
              }
            }
          }

          if (-not $url) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "Cloudflare tunnel URL was not found."
          }

          Write-Host "======================================"
          Write-Host "noVNC URL: $url/vnc.html"
          Write-Host "======================================"

      - name: Download all parts from GitHub Release
        shell: powershell
        run: |
          $api = "https://api.github.com/repos/forgotenmywin/Windows_with_no_vnc/releases/tags/ue5.8"
          $release = Invoke-RestMethod -Uri $api -Headers @{
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "UE58-Workflow"
          }

          $parts = @($release.assets |
            Where-Object { $_.name -match '^UE_5\.8\.zip\.\d{3}$' } |
            Sort-Object name)

          if ($parts.Count -ne 8) {
            Write-Host "Assets found:"
            $release.assets | ForEach-Object { Write-Host $_.name }
            throw "Expected 8 UE_5.8.zip.001 through .008 assets; found $($parts.Count)."
          }

          for ($i = 0; $i -lt $parts.Count; $i++) {
            $expected = "UE_5.8.zip.{0:D3}" -f ($i + 1)
            if ($parts[$i].name -ne $expected) {
              throw "Missing part: $expected"
            }
          }

          foreach ($asset in $parts) {
            $out = Join-Path "D:\UE58\Parts" $asset.name
            Write-Host "Downloading $($asset.name) ($([math]::Round($asset.size / 1GB,2)) GB)"
            curl.exe -L --fail --retry 5 --retry-delay 3 `
              --output $out $asset.browser_download_url
            if ($LASTEXITCODE -ne 0) {
              throw "Download failed: $($asset.name)"
            }
            if ((Get-Item $out).Length -ne $asset.size) {
              throw "Size mismatch for $($asset.name)"
            }
          }

      - name: Rebuild original ZIP
        shell: powershell
        run: |
          $output = "D:\UE58\UE_5.8.zip"
          $streamOut = [System.IO.File]::Open(
            $output,
            [System.IO.FileMode]::Create,
            [System.IO.FileAccess]::Write
          )

          try {
            for ($i = 1; $i -le 8; $i++) {
              $part = "D:\UE58\Parts\UE_5.8.zip.{0:D3}" -f $i
              if (-not (Test-Path $part)) {
                throw "Missing part: $part"
              }

              $streamIn = [System.IO.File]::OpenRead($part)
              try {
                $streamIn.CopyTo($streamOut)
              } finally {
                $streamIn.Dispose()
              }
            }
          } finally {
            $streamOut.Dispose()
          }

          $zip = Get-Item $output
          Write-Host "Rebuilt ZIP size: $($zip.Length) bytes"

          $fs = [System.IO.File]::OpenRead($output)
          try {
            $b = New-Object byte[] 4
            [void]$fs.Read($b, 0, 4)
            $sig = [BitConverter]::ToString($b)
            Write-Host "ZIP signature: $sig"
            if ($sig -ne "50-4B-03-04") {
              throw "The reconstructed file does not begin with a ZIP signature."
            }
          } finally {
            $fs.Dispose()
          }

      - name: Install 7-Zip
        shell: powershell
        run: |
          $installer = "$env:TEMP\7zip.exe"
          Invoke-WebRequest `
            "https://www.7-zip.org/a/7z2409-x64.exe" `
            -OutFile $installer

          $p = Start-Process $installer `
            -ArgumentList "/S" -Wait -PassThru
          $seven = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $seven)) {
            throw "7-Zip installation failed."
          }

      - name: Extract Unreal Engine archive
        shell: powershell
        run: |
          $seven = "C:\Program Files\7-Zip\7z.exe"
          $zip = "D:\UE58\UE_5.8.zip"
          $dest = "D:\UE58\Extracted"

          & $seven t $zip
          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity test failed. Do not extract a damaged archive."
          }

          & $seven x $zip "-o$dest" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Extraction failed."
          }

          Write-Host "Extraction completed."
          Get-ChildItem $dest | Select-Object Name,Mode

      - name: Keep session alive
        shell: powershell
        run: |
          Write-Host "Session is ACTIVE. noVNC URL is in the earlier logs."
          while ($true) {
            Write-Host "ACTIVE - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
