            if name == 'file_manager_rename_path':
                source = _fs_resolve(args.get('path', ''))
                new_name = _fs_safe_name(args.get('new_name', ''))
                target = _fs_resolve(source.parent / new_name)
                if not source.exists() or target.exists():
                    raise ValueError('Source missing or destination already exists')
                source.rename(target)
                log('FILE_RENAMED_VIA_MCP old=%s new=%s' % (source, target))
                return {'ok': True, 'old_path': str(source), 'path': str(target)}
            if name == 'file_manager_delete_path':
                if args.get('confirm_delete') is not True:
