    - name: Validate Blueprint object paths and workspace path security
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$api = 'D:\\UE58\\api_server.py'\nif (-not (Test-Path -LiteralPath\
        \ $api)) { throw 'API source is missing before validation.' }\n$src = Get-Content -LiteralPath $api -Raw\n\
        $required = @(\n  'function blueprintObjectPath',\n  'uasset_object_path=_blueprint_object_path',\n  '/api/fs/path/resolve',\n\
        \  'path_outside_allowed_roots',\n  'symbol_paths_skipped',\n  'BLUEPRINT_SAVE_DISK_VERIFIED=true'\n)\n\
        foreach ($marker in $required) {\n  if ($src -notmatch [regex]::Escape($marker)) { throw \"Required v15\
        \ implementation marker missing: $marker\" }\n}\nif ($src -match 'symbol_path\\s*\\.replace.{0,30}commands\\\
        s*=') { throw 'CDB symbol path must not be concatenated into the semicolon-delimited command script.' }\n\
        if ($src -notmatch '_normalize_blueprint_mcp_arguments' -or $src -notmatch 'BLUEPRINT_MCP_OBJECT_PATH_NORMALIZED')\
        \ {\n  throw 'SERVER_SIDE_BLUEPRINT_OBJECT_PATH_NORMALIZATION_MISSING: direct MCP tool calls must normalize\
        \ /Game/package paths to full Package.Asset references.'\n}\nif ($src -notmatch 'EDITOR_MAIN_THREAD_STALLED_DURING_BLUEPRINT_SAVE'\
        \ -or $src -notmatch 'BLUEPRINT_SAVE_MAIN_THREAD_STALLED' -or $src -notmatch \"status='EDITOR_STALLED'\"\
        \ -or $src -notmatch \"row.get\\('kind'\\) == 'blueprint_save'\") {\n  throw 'BLUEPRINT_SAVE_HANG_WATCHDOG_MISSING:\
        \ MCP polling and Blueprint Explorer must surface a stalled main thread and pause automatic retries.'\n\
        }\nWrite-Host 'BLUEPRINT_OBJECT_PATH_AND_PATH_SECURITY_VALIDATION=PASS'\nWrite-Host 'SERVER_SIDE_BLUEPRINT_OBJECT_PATH_VALIDATION=PASS'\n\
        Write-Host 'BLUEPRINT_SAVE_HANG_WATCHDOG_VALIDATION=PASS'\nWrite-Host 'FILE_MANAGER_ALLOWED_ROOT=D:\\UE58'\n\
        Write-Host 'CDB_SYMBOL_PATH_IS_PASSED_AS_A_SINGLE_ARGUMENT=true'\n"
    - name: Validate generated Python scripts
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\ntry { Start-Transcript -Path 'D:\\UE58\\Logs\\workflow-validation-transcript.log'\
        \ -Append -Force | Out-Null } catch { }\n$python = (Get-Command python).Source\n& $python -m py_compile\
        \ 'D:\\UE58\\api_server.py' 'D:\\UE58\\UEControl\\Content\\Python\\init_unreal.py'\nif ($LASTEXITCODE -ne\
        \ 0) { throw 'Generated Python scripts failed syntax validation.' }\n$apiText = Get-Content -LiteralPath\
        \ 'D:\\UE58\\api_server.py' -Raw -Encoding utf8\nif ($apiText -notmatch 'BLUEPRINT_AUTOCREATE_IF_MISSING'\
        \ -or $apiText -notmatch 'AssetToolsHelpers' -or $apiText -notmatch 'EditorAssetLibrary\\.make_directory'\
        \ -or $apiText -notmatch 'BLUEPRINT_ASSET_CREATED') {\n  throw 'BLUEPRINT_AUTOCREATE_VALIDATION_FAILED:\
        \ safe Blueprint search/create/save verification is missing.'\n}\nif ($apiText -notmatch '(?m)^\\s{8}mcp_timeout\\\
        s*=\\s*httpx\\.Timeout\\(connect=10\\.0, read=120\\.0, write=60\\.0, pool=15\\.0\\)\\s*$') {\n  throw 'MCP_TIMEOUT_ASSIGNMENT_INVALID:\
        \ mcp_timeout must be a standalone executable Python line, not part of a comment.'\n}\nif ($apiText -notmatch\
        \ 'async def public_app' -or $apiText -notmatch 'canonical_request_path') {\n  throw 'PUBLIC_MCP_ROUTER_INVALID:\
        \ /mcp public ASGI dispatcher was not generated.'\n}\nif ($apiText -notmatch 'def _headless_wait_for_editor_save'\
        \ -or $apiText -notmatch 'wait_unreal_job\\(save_job_id, 25\\)' -or $apiText -notmatch 'waiting_for_editor_save')\
        \ {\n  throw 'HEADLESS_ASYNC_SAVE_INVALID: pending Editor saves must complete in the background before commandlet\
        \ dispatch.'\n}\n# Validate the actual implementation instead of requiring obsolete comment text.\n# The\
        \ SSE reader must parse a complete JSON-RPC data line before stream EOF,\n# including a final data line\
        \ that has not received its newline yet.\nif ($apiText -notmatch 'async def read_mcp_http_reply\\(' -or\n\
        \    $apiText -notmatch 'async for chunk in response\\.aiter_text\\(\\):' -or\n    $apiText -notmatch 'candidate_line\
        \ = line_buffer\\.rstrip' -or\n    $apiText -notmatch 'if candidate_line\\.startswith\\(''data:''\\):' -or\n\
        \    $apiText -notmatch 'async def mcp_post_and_read\\(') {\n  throw 'MCP_STREAM_READER_INVALID: immediate\
        \ SSE parsing of complete and unfinished data lines is required.'\n}\n# Initialized notifications must inspect\
        \ HTTP status/headers and close the\n# stream without waiting for a response body that may never arrive.\n\
        if ($apiText -notmatch 'notify_status = notify\\.status_code' -or\n    $apiText -notmatch 'notify_content_type\
        \ = notify\\.headers\\.get\\(''content-type'', ''''\\)' -or\n    $apiText -notmatch 'if notify_status not\
        \ in \\(200, 202, 204\\):') {\n  throw 'MCP_NOTIFICATION_READER_INVALID: notification handling must validate\
        \ HTTP metadata without waiting for a body.'\n}\nWrite-Host 'MCP_STREAM_READER_VALIDATION=true'\n\n# Native\
        \ C++/Windows thread-stack access: ProcDump creates a read-only snapshot,\n# then CDB emits every thread's\
        \ native stack from the dump. No live attach/kill.\nif (-not (Test-Path -LiteralPath $env:UE58_PROCDUMP)\
        \ -or -not (Test-Path -LiteralPath $env:UE58_CDB)) {\n  throw 'NATIVE_THREAD_DEBUGGER_TOOLS_MISSING: ProcDump\
        \ and CDB must be installed before the API starts.'\n}\nif ($apiText -notmatch 'def _thread_stack_capture_worker'\
        \ -or\n    $apiText -notmatch 'def _get_thread_stack_capture_status' -or\n    $apiText -notmatch \"@app.post\\\
        ('/api/diagnostics/thread-stacks'\\)\" -or\n    $apiText -notmatch 'unreal_get_thread_stack_traces' -or\n\
        \    $apiText -notmatch '~\\* kv' -or $apiText -notmatch '!uniqstack' -or $apiText -notmatch '!analyze -hang'\
        \ -or $apiText -notmatch '!analyze -v6' -or $apiText -notmatch '!locks') {\n  throw 'NATIVE_THREAD_STACKTRACE_FEATURE_MISSING:\
        \ CDB must analyze all native Unreal threads and expose a pollable MCP tool.'\n}\n$nativeBridgeText = Get-Content\
        \ -LiteralPath 'D:\\UE58\\UEControl\\Content\\Python\\init_unreal.py' -Raw -Encoding utf8\nif ($nativeBridgeText\
        \ -notmatch 'PYTHON_THREAD_MAP_BEGIN' -or $nativeBridgeText -notmatch 'native_id') {\n  throw 'PYTHON_THREAD_ID_MAP_MISSING:\
        \ faulthandler snapshots must include Python thread names and native thread IDs.'\n}\nif ($apiText -notmatch\
        \ 'returncode != 0' -or $apiText -notmatch \"b'MDMP'\" -or $apiText -notmatch 'PROCDUMP_NONZERO_EXIT_BUT_VALID_DUMP')\
        \ {\n  throw 'PROCDUMP_VALID_DUMP_HANDLING_INVALID: a valid MDMP must be analyzed even when ProcDump returns\
        \ a nonzero exit code.'\n}\nif ($apiText -notmatch 'UE58_NATIVE_THREAD_STACKS_BEGIN' -or $apiText -notmatch\
        \ '~\\* kv' -or $apiText -notmatch '!uniqstack' -or $apiText -notmatch '!analyze -hang') {\n  throw 'CDB_STACK_EXTRACTION_INVALID:\
        \ all-thread native stacks and hang analysis are required.'\n}\nWrite-Host 'NATIVE_THREAD_STACKTRACE_VALIDATION=true'\n\
        Write-Host 'PYTHON_NATIVE_THREAD_MAP_VALIDATION=true'\nWrite-Host 'MCP_NOTIFICATION_NONBLOCKING_VALIDATION=true'\n\
        if ($apiText -notmatch 'def _three_d_export_worker' -or $apiText -notmatch 'USE_MESH_DATA' -or $apiText\
        \ -notmatch 'GLTFMaterialBakeMode' -or $apiText -notmatch 'bake_material_inputs' -or $apiText -notmatch\
        \ 'MATERIAL_OR_EXPORT_WARNING' -or $apiText -notmatch 'material_count' -or $apiText -notmatch 'texture_count')\
        \ {\n  throw 'THREE_D_MATERIAL_BAKING_INVALID: 3D Export must enable compatible material baking and validate\
        \ exported material/texture references.'\n}\nif ($apiText -notmatch 'async function apiRetry' -or $apiText\
        \ -notmatch 'threeDStatusFailures' -or $apiText -notmatch 'automatic retry continues' -or $apiText -notmatch\
        \ 'threeDStatusBusy') {\n  throw 'THREE_D_STATUS_RETRY_INVALID: temporary status fetch errors must preserve\
        \ the last confirmed progress and retry without cancelling export.'\n}\nif (-not $apiText.Contains(\"max(int(row.get('progress')\
        \ or 0)\")) {\n  throw 'THREE_D_PROGRESS_REGRESSION_INVALID: progress must not move backwards between export\
        \ and packaging stages.'\n}\nWrite-Host 'THREE_D_MATERIAL_BAKING_VALIDATION=true'\nWrite-Host 'THREE_D_STATUS_RETRY_VALIDATION=true'\n\
        Write-Host 'THREE_D_MONOTONIC_PROGRESS_VALIDATION=true'\n$bridgeText = Get-Content -LiteralPath 'D:\\UE58\\\
        UEControl\\Content\\Python\\init_unreal.py' -Raw -Encoding utf8\nif ($apiText -notmatch 'class LocalBridgeHandler'\
        \ -or $apiText -notmatch 'ThreadingHTTPServer' -or $apiText -notmatch 'DEDICATED_LOCAL_BRIDGE_READY') {\n\
        \  throw 'DEDICATED_BRIDGE_VALIDATION_FAILED: isolated localhost listener was not generated.'\n}\nif (-not\
        \ $bridgeText.Contains('8766') -or -not $bridgeText.Contains('OUTGOING.put(payload)')) {\n  throw 'BRIDGE_CLIENT_VALIDATION_FAILED:\
        \ client must use isolated listener and retry undelivered results.'\n}\nif ($bridgeText -notmatch '(?m)^\\\
        s{4}def request_json\\(') {\n  throw 'BRIDGE_REQUEST_JSON_MISSING: authenticated HTTP helper must be defined\
        \ at bridge module scope.'\n}\nif ($bridgeText -notmatch 'IDLE_AFTER_SECONDS\\s*=\\s*15\\.0' -or $bridgeText\
        \ -notmatch 'def set_editor_power_mode' -or $bridgeText -notmatch 'editor_set_viewport_realtime') {\n  throw\
        \ 'EDITOR_IDLE_POWER_MODE_MISSING: automatic idle/active viewport switching was not generated.'\n}\nif ($bridgeText\
        \ -notmatch 't\\.MaxFPS %d' -or $bridgeText -notmatch 'Slate\\.bAllowThrottling 1') {\n  throw 'EDITOR_IDLE_THROTTLE_MISSING:\
        \ frame-rate and Slate throttling controls are required.'\n}\n$editorSettingsText = Get-Content -LiteralPath\
        \ 'D:\\UE58\\UEControl\\Config\\DefaultEditorSettings.ini' -Raw -Encoding utf8\nif ($editorSettingsText\
        \ -notmatch 'bThrottleCPUWhenNotForeground=True' -or $editorSettingsText -notmatch 'bDisableRealtimeViewportsInRemoteSessions=True')\
        \ {\n  throw 'EDITOR_PERFORMANCE_SETTINGS_MISSING: remote/background viewport throttling defaults were not\
        \ generated.'\n}\nif ($apiText -notmatch 'MCP_NATIVE_TOOL_ACTIVE' -or $apiText -notmatch 'editor_busy=editor_busy'\
        \ -or $bridgeText -notmatch 'REMOTE_TOOL_ACTIVE') {\n  throw 'NATIVE_MCP_WAKE_VALIDATION_FAILED: native\
        \ AllToolsets calls must wake the Editor power mode.'\n}\nWrite-Host 'NATIVE_MCP_WAKE_VALIDATION=true'\n\
        Write-Host 'EDITOR_IDLE_POWER_MODE_VALIDATION=true'\nWrite-Host 'DEDICATED_BRIDGE_VALIDATION=true'\nif ($apiText\
        \ -notmatch 'def editor_tick_age_seconds' -or $apiText -notmatch 'unreal_editor_not_responsive') {\n  throw\
        \ 'EDITOR_HEARTBEAT_VALIDATION_FAILED: API must verify the actual Unreal Editor tick, not only the bridge\
        \ network worker.'\n}\nif ($bridgeText -notmatch 'editor_tick_at' -or $bridgeText -notmatch 'EDITOR_TICK_AT\
        \ = time.time\\(\\)') {\n  throw 'EDITOR_TICK_VALIDATION_FAILED: bridge must report a live Slate Editor\
        \ tick.'\n}\nif ($bridgeText -notmatch 'def ensure_network_worker\\(' -or $bridgeText -notmatch 'def diagnostic_watchdog\\\
        (' -or $bridgeText -notmatch 'faulthandler.dump_traceback' -or $bridgeText -notmatch 'BRIDGE_NETWORK_WORKER_RESTARTED')\
        \ {\n  throw 'BRIDGE_SELF_HEAL_OR_STACKTRACE_MISSING: the bridge must restart a dead network worker and\
        \ capture Python thread stacks when the Editor stalls.'\n}\nif ($apiText -notmatch 'get_dirty_map_packages'\
        \ -or $apiText -notmatch 'get_dirty_content_packages' -or $apiText -notmatch 'save_packages\\(packages,\
        \ True\\)') {\n  throw 'TARGETED_SAVE_VALIDATION_FAILED: save must target only dirty map/content packages.'\n\
        }\nif ($apiText -match 'save_dirty_packages\\(True, True\\)') {\n  throw 'BROAD_SAVE_VALIDATION_FAILED:\
        \ obsolete broad save call remains.'\n}\nWrite-Host 'PYTHON_SYNTAX_VALIDATION=true'\nWrite-Host 'MCP_PROXY_STATIC_VALIDATION=true'\n\
        Write-Host 'EDITOR_TICK_VALIDATION=true'\nWrite-Host 'TARGETED_SAVE_VALIDATION=true'\n$setupText = Get-Content\
        \ -LiteralPath 'D:\\UE58\\UEControl\\Config\\DefaultGame.ini' -Raw -Encoding utf8\nif ($setupText -notmatch\
        \ 'PrimaryAssetType=\"GameFeatureData\"' -or $setupText -notmatch '/Script/GameFeatures.GameFeatureData')\
        \ {\n  throw 'GAMEFEATUREDATA_ASSET_MANAGER_RULE_MISSING: DefaultGame.ini must register GameFeatureData.'\n\
        }\nif ($bridgeText -match 'UE58 Preview Ground' -or $bridgeText -match 'UE58 Preview Cube') {\n  throw 'ENGINE_MAP_PREVIEW_INJECTION_FOUND:\
        \ preview actors must not be spawned into /Engine/Maps/Entry.'\n}\nif ($bridgeText -notmatch 'new_blank_map\\\
        (True\\)' -or $bridgeText -notmatch 'save_map\\(world, map_asset\\)' -or $bridgeText -notmatch 'PROJECT_TREE_MAP_READY')\
        \ {\n  throw 'PROJECT_TREE_MAP_VALIDATION_FAILED: live Editor must create/save the project-owned tree map.'\n\
        }\nif ($apiText -notmatch 'unreal_create_plugin_tree_test_map' -or $apiText -notmatch 'confirm_create')\
        \ {\n  throw 'LIVE_TREE_MAP_MCP_TOOL_MISSING: explicit non-headless map repair tool is required.'\n}\nWrite-Host\
        \ 'GAMEFEATUREDATA_ASSET_MANAGER_VALIDATION=true'\nWrite-Host 'PROJECT_TREE_MAP_VALIDATION=true'\nWrite-Host\
        \ 'LIVE_TREE_MAP_MCP_TOOL_VALIDATION=true'\n\nif ($apiText -notmatch 'def bridge_state_payload' -or $apiText\
        \ -notmatch \"state, message = \\('busy'\" -or $apiText -notmatch 'active_editor_jobs' -or $apiText -notmatch\
        \ 'EDITOR_PYTHON_JOB_STALE_SECONDS' -or $apiText -notmatch 'suspected_blueprint_save_hang' -or $apiText\
        \ -notmatch \"'kind': str\\(row.get\\('kind'\\)\") {\n  throw 'BRIDGE_BUSY_DIAGNOSTICS_INVALID: distinguish\
        \ running jobs, stale jobs, Blueprint-save hangs and an offline Bridge.'\n}\nif ($apiText -notmatch 'def\
        \ cancel_active_editor_jobs' -or $apiText -notmatch 'cancelled_python_jobs') {\n  throw 'BRIDGE_STALE_JOB_RECOVERY_MISSING:\
        \ confirmed restart must release waiting API jobs.'\n}\nif ($apiText -notmatch 'MCP_NATIVE_TOOL_ACTIVE'\
        \ -or $apiText -notmatch 'native_mcp_tool_active') {\n  throw 'BRIDGE_NATIVE_TOOL_BUSY_VALIDATION_FAILED:\
        \ native AllToolsets operations must be classified as busy, not offline.'\n}\nif ($apiText -notmatch \"\
        @app.post\\('/api/bridge/restart'\\)\" -or $apiText -notmatch \"restart_editor\") {\n  throw 'BRIDGE_RECOVERY_ENDPOINT_MISSING:\
        \ explicit save-aware Editor/Bridge restart is required.'\n}\nif ($apiText -notmatch \"@app.get\\('/api/projects/preflight'\\\
        )\" -or $apiText -notmatch 'def _project_preflight' -or $apiText -notmatch 'GLTFExporter') {\n  throw 'PROJECT_PREFLIGHT_MISSING:\
        \ export must check project, engine and required plugin files before starting.'\n}\nif ($apiText -notmatch\
        \ \"@app.post\\('/api/projects/create'\\)\" -or $apiText -notmatch 'def _create_new_project' -or $apiText\
        \ -notmatch 'confirm_create') {\n  throw 'CREATE_PROJECT_OPTION_MISSING: create-project route and guarded\
        \ confirmation are required.'\n}\nif ($apiText -notmatch 'threeDProjectSelect' -or $apiText -notmatch 'threeDCreateProjectBtn'\
        \ -or $apiText -notmatch 'threeDRestartBridgeBtn' -or $apiText -notmatch 'project_file:project') {\n  throw\
        \ 'THREE_D_PROJECT_SELECTOR_UI_MISSING: project selection, create and Bridge recovery must be visible in\
        \ 3D Export.'\n}\nif ($apiText -notmatch 'project_file.*project_name' -or $apiText -notmatch 'Selected project\
        \ is not currently open') {\n  throw 'THREE_D_PROJECT_IDENTITY_INVALID: export jobs must be tied to the\
        \ exact selected project.'\n}\nif ($apiText -notmatch 'Project changed after export was queued' -or $apiText\
        \ -notmatch 'project_local' -and $apiText -notmatch 'startup_script') {\n  throw 'THREE_D_PROJECT_GUARD_INVALID:\
        \ queued exports must recheck the selected project and each project must have its own Bridge startup script.'\n\
        }\nif ($apiText -notmatch 'section_index \\+ 1, startup_line' -or $apiText -notmatch 'PythonScriptPlugin.PythonScriptPluginSettings')\
        \ {\n  throw 'PROJECT_STARTUP_CONFIG_INVALID: StartupScripts must be written inside PythonScriptPlugin settings.'\n\
        }\nif ($apiText -notmatch 'BLUEPRINT_EXPLORER_FEATURE_MARKERS' -or $apiText -notmatch 'bpConnected=false'\
        \ -or $apiText -notmatch 'write_graph_dsl' -or $apiText -notmatch 'Send / Apply Changes' -or $apiText -notmatch\
        \ 'bpLogOutput' -or $apiText -notmatch 'BLUEPRINT_TOOL_SEARCH_DISPATCH_MARKERS') {\n  throw 'BLUEPRINT_EXPLORER_VALIDATION_FAILED:\
        \ explicit offline state, staged graph apply and logs are required.'\n}\nif ($apiText -notmatch 'BLUEPRINT_CUSTOM_PATH_UI_IMPLEMENTATION'\
        \ -or $apiText -notmatch 'bpCustomPathInput' -or $apiText -notmatch 'bpCheckCustomPathBtn' -or $apiText\
        \ -notmatch 'bpNormalizeCustomPackagePath' -or $apiText -notmatch 'bpCheckCustomPath') {\n  throw 'BLUEPRINT_CUSTOM_PATH_UI_MISSING:\
        \ the main File Manager Blueprint tab must expose a local custom package/object path field and an explicit\
        \ connected-only asset check.'\n}\nWrite-Host 'BLUEPRINT_CUSTOM_PATH_UI_VALIDATION=true'\nif ($apiText -notmatch\
        \ 'BLUEPRINT_EXPLORER_UI_IMPLEMENTATION' -or $apiText -notmatch \"@app.get\\('/blueprint-explorer'\\)\"\
        \ -or $apiText -notmatch 'BLUEPRINT_EXPLORER_HTML' -or $apiText -notmatch \"@app.get\\('/api/blueprint/explorer/status'\\\
        )\" -or $apiText -notmatch 'BLUEPRINT_EXPLORER_DYNAMIC_BASE_URL' -or $apiText -notmatch 'apiFetch\\(' -or\
        \ $apiText -notmatch 'endpoint\\(' -or $apiText -notmatch 'BLUEPRINT_EXPLORER_CORS_SUPPORT' -or $apiText\
        \ -notmatch 'UE58_BLUEPRINT_ALLOW_FILE_ORIGIN') {\n  throw 'BLUEPRINT_EXPLORER_CONNECTION_VALIDATION_FAILED:\
        \ configurable absolute server URL, authenticated API fetch and explicit CORS handling are required.'\n\
        }\nif ($apiText -notmatch 'BLUEPRINT_PROJECT_SELECTOR_FEATURE_MARKERS' -or $apiText -notmatch 'def _project_files\\\
        (' -or $apiText -notmatch 'project_root=str\\(ROOT\\)' -or $apiText -notmatch '@app\\.get\\(''/api/projects''\\\
        )') {\n  throw 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION_FAILED: project discovery must scan the configured\
        \ D:\\\\UE58 root and expose it to the Blueprint UI.'\n}\nif ($apiText -notmatch 'def api_fs_read' -or $apiText\
        \ -notmatch 'def api_fs_write' -or $apiText -notmatch 'content_base64' -or $apiText -notmatch 'def _fs_atomic_write')\
        \ {\n  throw 'FILE_MANAGER_READ_WRITE_VALIDATION_FAILED: byte-safe file read and atomic file write routes\
        \ are required.'\n}\nif ($apiText -notmatch 'def api_fs_move' -or $apiText -notmatch 'def _fs_move_paths'\
        \ -or $apiText -notmatch 'file_manager_move_paths') {\n  throw 'FILE_MANAGER_MOVE_VALIDATION_FAILED: safe\
        \ move operation is required.'\n}\nif ($apiText -notmatch 'file_manager_read_file' -or $apiText -notmatch\
        \ 'file_manager_write_file' -or $apiText -notmatch 'file_manager_create_folder' -or $apiText -notmatch 'unreal_save_blueprint_asset'\
        \ -or $apiText -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true') {\n  throw 'FILE_MANAGER_MCP_OR_BLUEPRINT_SAVE_VALIDATION_FAILED:\
        \ read/write/folder MCP tools and disk-verified Blueprint save are required.'\n}\n$listLogToolCount = [regex]::Matches($apiText,\
        \ \"'name': 'file_manager_list_logs'\").Count\n$readLogsToolCount = [regex]::Matches($apiText, \"'name':\
        \ 'file_manager_read_logs'\").Count\nif ($listLogToolCount -ne 1 -or $readLogsToolCount -ne 1 -or\n    $apiText\
        \ -notmatch 'def _log_source_catalog' -or $apiText -notmatch 'def _read_log_source_chunk' -or\n    $apiText\
        \ -notmatch 'next_offset' -or $apiText -notmatch 'max_total_bytes' -or\n    $apiText -notmatch \"@app.get\\\
        ('/api/logs/catalog'\\)\" -or $apiText -notmatch 'rate-limit-events') {\n  throw 'EXPANDED_LOG_ACCESS_VALIDATION_FAILED:\
        \ unique log-list/batch-read tools, catalog, byte paging and rate-limit log source are required.'\n}\nif\
        \ ($apiText -notmatch 'MCP_RATE_LIMIT_STATE' -or $apiText -notmatch '_record_rate_limit' -or\n    $apiText\
        \ -notmatch '_rate_limit_delay' -or $apiText -notmatch 'Retry-After' -or\n    $apiText -notmatch '_wait_for_mcp_upstream_slot'\
        \ -or $apiText -notmatch 'MCP_RATE_LIMITED' -or\n    $apiText -notmatch 'def _mcp_post_status_with_retry')\
        \ {\n  throw 'MCP_RATE_LIMIT_RECOVERY_VALIDATION_FAILED: bounded retry, Retry-After handling, request pacing\
        \ and diagnostics are required.'\n}\n$blueprintSaveRouteCount = [regex]::Matches($apiText, '(?m)^def api_blueprint_save\\\
        (').Count\nif ($blueprintSaveRouteCount -ne 1 -or $apiText -notmatch 'def api_blueprint_save_status' -or\n\
