        def _fs_drive_roots():
            roots = []
            if os.name == 'nt':
                try:
                    import ctypes
                    mask = ctypes.windll.kernel32.GetLogicalDrives()
                    for index in range(26):
                        if not mask & 1 << index:
                            continue
                        drive = chr(65 + index) + ':\\'
                        try:
                            drive_type = ctypes.windll.kernel32.GetDriveTypeW(drive)
                        except Exception:
                            drive_type = 3
                        if drive_type in (2, 3, 4) and Path(drive).exists():
                            roots.append(Path(drive).resolve())
                except Exception as exc:
                    log('Could not enumerate Windows drive letters: ' + repr(exc))
            else:
                roots.append(Path(ROOT.anchor or '/').resolve())
            if not roots and ROOT.exists():
                roots.append(Path(ROOT.anchor or str(ROOT)).resolve())
            return roots
        
        def _fs_resolve(value):
            raw = str(value or '').strip()
            if not raw:
                raise ValueError('path is required')
            if raw.startswith(('\\\\', '\\\\?\\', '\\\\.\\')):
                raise ValueError('UNC and Windows device paths are not permitted')
            candidate = Path(raw)
            if not candidate.is_absolute():
                candidate = ROOT / candidate
            resolved = candidate.resolve(strict=False)
            if os.name == 'nt':
                drive, _ = os.path.splitdrive(str(resolved))
                if not drive or drive.startswith('\\'):
                    raise ValueError('Only accessible local or mapped Windows drives are permitted')
            roots = _fs_drive_roots()
            for root in roots:
                try:
                    common = os.path.commonpath([os.path.normcase(str(root)), os.path.normcase(str(resolved))])
                    if common == os.path.normcase(str(root)):
                        return resolved
                except (ValueError, OSError):
                    continue
            raise ValueError('Path is outside the accessible Windows drives')
        
        def _fs_roots_payload():
            roots = []
            seen = set()
        
            def add(label, path, kind):
                try:
                    resolved = _fs_resolve(str(path))
                    if not resolved.exists() or not resolved.is_dir():
                        return
                    key = os.path.normcase(str(resolved))
                    if key in seen:
                        return
                    seen.add(key)
                    roots.append({'label': label, 'path': str(resolved), 'kind': kind})
                except Exception:
                    return
            for drive in _fs_drive_roots():
                label = str(drive)
                if os.name == 'nt':
                    label = 'Windows ' + label.rstrip('\\')
                add(label, drive, 'drive')
            add('UE58 Workspace', ROOT, 'unreal')
            add('Unreal Extracted', ROOT / 'Extracted', 'unreal')
            add('Projects', ROOT / 'Projects', 'unreal')
            add('Uploads', UPLOAD_ROOT, 'workspace')
            add('Logs', LOG_DIR, 'workspace')
            add('Backups', ROOT / 'Backups', 'workspace')
            editor_exe = os.environ.get('UE_EDITOR_EXE', '')
            if editor_exe:
                try:
                    engine_dir = Path(editor_exe).resolve().parents[3]
                    add('Unreal Engine', engine_dir, 'engine')
                except Exception:
                    pass
            try:
                project = _current_project() if '_current_project' in globals() else ROOT / 'UEControl' / 'UEControl.uproject'
                if project and Path(project).exists():
                    add('Active Unreal Project', Path(project).parent, 'project')
            except Exception:
                pass
            return roots
        
        def _fs_directory_payload(path_value, offset=0, limit=1000):
            folder = _fs_resolve(path_value or str(ROOT))
            if not folder.exists():
                raise FileNotFoundError('Folder does not exist: ' + str(folder))
            if not folder.is_dir():
                raise NotADirectoryError('Path is not a folder: ' + str(folder))
            try:
                offset = max(0, int(offset))
                limit = max(1, min(2000, int(limit)))
            except (ValueError, TypeError):
                offset, limit = (0, 1000)
            entries = []
            skipped = 0
            with os.scandir(str(folder)) as iterator:
                for entry in iterator:
                    try:
                        target = _fs_resolve(entry.path)
                        st = entry.stat(follow_symlinks=True)
                        is_dir = entry.is_dir(follow_symlinks=True)
                        entries.append({'name': entry.name, 'path': str(target), 'is_dir': bool(is_dir), 'extension': '[folder]' if is_dir else Path(entry.name).suffix, 'size': None if is_dir else int(st.st_size), 'modified': time.strftime('%Y-%m-%d %H:%M:%S', time.localtime(st.st_mtime)), 'modified_epoch': st.st_mtime})
                    except (OSError, PermissionError, ValueError):
                        skipped += 1
            entries.sort(key=lambda row: (not row['is_dir'], row['name'].casefold()))
            total = len(entries)
            parent = str(folder.parent) if folder.parent != folder else str(folder)
            return {'ok': True, 'path': str(folder), 'parent': parent, 'count': total, 'offset': offset, 'limit': limit, 'has_more': offset + limit < total, 'skipped': skipped, 'entries': entries[offset:offset + limit]}
        
        def _fs_safe_name(value, default='NewFolder'):
            name = str(value or '').strip().replace('\\', '/').split('/')[-1].strip().rstrip('. ')
            if not name or name in ('.', '..') or any((ch in name for ch in ('<', '>', ':', '"', '|', '?', '*', '\x00', '\r', '\n'))):
                raise ValueError('A valid single file or folder name is required')
            if len(name) > 180:
                raise ValueError('Name is too long (maximum 180 characters)')
            return name
        
        def _fs_ignore_links(directory, names):
            ignored = []
            for name in names:
                candidate = Path(directory) / name
                try:
                    if candidate.is_symlink() or (hasattr(candidate, 'is_junction') and candidate.is_junction()):
                        ignored.append(name)
                except OSError:
                    ignored.append(name)
            return ignored
        
        def _fs_iter_files(source):
            if source.is_file():
                yield (source, source.name)
                return
            if not source.is_dir():
                raise FileNotFoundError('Selected file or folder does not exist: ' + str(source))
            root_name = source.name or source.drive.rstrip(':\\') or 'Drive'
            for current, directories, filenames in os.walk(str(source), topdown=True, followlinks=False):
                safe_dirs = []
                for dirname in directories:
                    child = Path(current) / dirname
                    try:
                        resolved = _fs_resolve(child)
                        if not child.is_symlink() and resolved.is_dir():
                            safe_dirs.append(dirname)
                    except Exception:
                        continue
                directories[:] = safe_dirs
                for filename in filenames:
                    child = Path(current) / filename
                    try:
                        resolved = _fs_resolve(child)
                        if resolved.is_file() and (not child.is_symlink()):
                            relative = child.relative_to(source).as_posix()
                            yield (resolved, root_name + '/' + relative)
                    except Exception:
                        continue
        
        def _fs_create_zip(paths, archive_name='', compress=False):
            import zipfile
            if not isinstance(paths, list) or not paths or len(paths) > 100:
                raise ValueError('Select between 1 and 100 files or folders')
            sources = []
            for raw in paths:
                source = _fs_resolve(raw)
                if not source.exists():
                    raise FileNotFoundError('Selected path does not exist: ' + str(source))
                if source.is_dir() and any((source == root for root in _fs_drive_roots())):
                    raise ValueError('Do not ZIP an entire drive root; select a specific folder')
                if source not in sources:
                    sources.append(source)
            name = _fs_safe_name(archive_name or 'UE58_Files_' + time.strftime('%Y%m%d_%H%M%S') + '.zip')
            if not name.lower().endswith('.zip'):
                name += '.zip'
            UPLOAD_ROOT.mkdir(parents=True, exist_ok=True)
            destination = UPLOAD_ROOT / name
            if destination.exists():
                destination = UPLOAD_ROOT / (destination.stem + '_' + uuid.uuid4().hex[:8] + '.zip')
            temp_path = destination.with_name(destination.name + '.building-' + uuid.uuid4().hex)
            compression = zipfile.ZIP_DEFLATED if compress else zipfile.ZIP_STORED
            count = 0
            total_bytes = 0
            try:
                with zipfile.ZipFile(temp_path, 'w', compression=compression, compresslevel=3 if compress else None, allowZip64=True) as archive:
                    for source in sources:
                        for file_path, arcname in _fs_iter_files(source):
                            if file_path.resolve() == temp_path.resolve():
                                continue
                            archive.write(str(file_path), arcname=arcname, compress_type=compression)
                            count += 1
                            total_bytes += file_path.stat().st_size
                            if count > 250000:
                                raise ValueError('ZIP contains more than 250,000 files; split the selection')
                if count == 0:
                    raise ValueError('The selected folder contains no accessible files')
                os.replace(temp_path, destination)
            except Exception:
                try:
                    temp_path.unlink(missing_ok=True)
                except Exception:
                    pass
                raise
            log('FILE_ZIP_CREATED path=%s files=%s source_bytes=%s zip_bytes=%s compressed=%s' % (destination, count, total_bytes, destination.stat().st_size, bool(compress)))
            return {'ok': True, 'path': str(destination), 'name': destination.name, 'files': count, 'source_bytes': total_bytes, 'size': destination.stat().st_size, 'download_url': '/api/fs/download?path=' + __import__('urllib.parse', fromlist=['quote']).quote(str(destination), safe='')}
        
