name: UE 5.8 Remote Studio - GitHub Windows Only (Blueprint Object Paths + File Path Management + Bridge Diagnostics)
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  ue-remote:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
    - name: Prepare D drive
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = 'D:\UE58'
        New-Item -ItemType Directory -Force -Path $root, "$root\parts", "$root\Logs", "$root\Projects", "$root\Screenshots", "$root\Uploads", "$root\Diagnostics", "$root\Tools" | Out-Null
        try { Start-Transcript -Path "$root\Logs\workflow-prepare-transcript.log" -Append -Force | Out-Null } catch { }
        $drive = Get-PSDrive D -ErrorAction SilentlyContinue
        if (-not $drive) { throw 'Drive D is not available on this runner.' }
        Write-Host ("D: available space: {0:N2} GB" -f ($drive.Free / 1GB))
        "UE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Download and extract Unreal Engine 5.8
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $root = 'D:\UE58'
        try { Start-Transcript -Path "$root\Logs\workflow-extract-transcript.log" -Append -Force | Out-Null } catch { }
        $partsDir = "$root\parts"
        $archive = "$root\UE_5.8.zip"
        $extract = "$root\Extracted"

        gh release download ue5.8 --repo forgotenmywin/Windows_with_no_vnc --pattern 'UE_5.8.zip.*' --dir $partsDir --clobber
        if ($LASTEXITCODE -ne 0) { throw 'Could not download release assets UE_5.8.zip.*.' }

        $parts = @(Get-ChildItem -LiteralPath $partsDir -File | Where-Object { $_.Name -like 'UE_5.8.zip.*' } | Sort-Object Name)
        if ($parts.Count -lt 2) { throw "Expected split ZIP parts; found $($parts.Count). Check release tag/assets." }

        if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
        $destination = [System.IO.File]::Open($archive, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
        try {
          $buffer = New-Object byte[] (4MB)
          foreach ($part in $parts) {
            Write-Host ("Joining {0} ({1:N2} GB)" -f $part.Name, ($part.Length / 1GB))
            $source = [System.IO.File]::OpenRead($part.FullName)
            try {
              while (($read = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {
                $destination.Write($buffer, 0, $read)
              }
            }
            finally { $source.Dispose() }
          }
        }
        finally { $destination.Dispose() }

        $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
        if (-not $sevenZip) {
          $sevenZip = @('C:\Program Files\7-Zip\7z.exe','C:\Program Files (x86)\7-Zip\7z.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
        }
        if (-not $sevenZip) {
          choco install 7zip -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
        }
        if (-not (Test-Path -LiteralPath $sevenZip)) { throw '7z.exe was not found.' }

        & $sevenZip t $archive
        if ($LASTEXITCODE -ne 0) { throw 'Joined ZIP failed integrity testing.' }
        if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
        New-Item -ItemType Directory -Force -Path $extract | Out-Null
        & $sevenZip x $archive "-o$extract" -y
        if ($LASTEXITCODE -ne 0) { throw 'Unreal Engine extraction failed.' }

        $editor = Get-ChildItem -LiteralPath $extract -Filter UnrealEditor.exe -File -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -match '\\Engine\\Binaries\\Win64\\UnrealEditor\.exe$' } |
          Select-Object -First 1
        if (-not $editor) { throw 'UnrealEditor.exe was not found.' }
        Write-Host "EDITOR_EXE=$($editor.FullName)"
        "UE_EDITOR_EXE=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install native thread-stack diagnostic tools
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = 'D:\UE58'
        $toolsRoot = Join-Path $root 'Tools'
        $procDir = Join-Path $toolsRoot 'ProcDump'
        $dbgDir = Join-Path $toolsRoot 'Debuggers'
        New-Item -ItemType Directory -Force -Path $procDir, $dbgDir, (Join-Path $root 'Symbols'), (Join-Path $root 'Diagnostics\ThreadStacks') | Out-Null

        # ProcDump: Microsoft Sysinternals signed release. Triage dumps preserve thread
        # contexts/stacks with much less memory content than a full process dump.
        $procZip = Join-Path $procDir 'Procdump.zip'
        $procExe = Join-Path $procDir 'procdump64.exe'
        if (-not (Test-Path -LiteralPath $procExe)) {
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $procZip
          Expand-Archive -LiteralPath $procZip -DestinationPath $procDir -Force
        }
        if (-not (Test-Path -LiteralPath $procExe)) {
          $candidate = Get-ChildItem -LiteralPath $procDir -Filter 'procdump64.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candidate) { Copy-Item -LiteralPath $candidate.FullName -Destination $procExe -Force }
        }
        if (-not (Test-Path -LiteralPath $procExe)) { throw 'PROCDUMP_INSTALL_FAILED: procdump64.exe was not found after extraction.' }
        $procSignature = Get-AuthenticodeSignature -FilePath $procExe
        if ($procSignature.Status -ne 'Valid') { throw "PROCDUMP_SIGNATURE_INVALID: $($procSignature.Status)" }

        # CDB ships with the Windows SDK Debugging Tools component. GitHub's current
        # Windows Server 2025 x64 image normally has this component; install the feature
        # from the cached SDK bundle if the image does not expose cdb.exe.
        $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
        $cdbSource = Join-Path $kitsRoot 'Debuggers\x64\cdb.exe'
        if (-not (Test-Path -LiteralPath $cdbSource)) {
          $sdkEntry = Get-ItemProperty 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'Windows Software Development Kit' -and $_.BundleCachePath -and (Test-Path -LiteralPath $_.BundleCachePath) } |
            Sort-Object DisplayVersion -Descending | Select-Object -First 1
          if ($sdkEntry) {
            Write-Host 'Installing Windows SDK WindowsDesktopDebuggers feature...'
            $installer = Start-Process -FilePath $sdkEntry.BundleCachePath -ArgumentList @('/features','OptionId.WindowsDesktopDebuggers','/q','/norestart') -Wait -PassThru
            Write-Host "Windows SDK debugger feature installer exit code: $($installer.ExitCode)"
          }
        }
        if (-not (Test-Path -LiteralPath $cdbSource)) {
          $found = Get-ChildItem -LiteralPath (Join-Path $kitsRoot 'Debuggers') -Filter 'cdb.exe' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]cdb\.exe$' } | Select-Object -First 1
          if ($found) { $cdbSource = $found.FullName }
        }
        if (-not (Test-Path -LiteralPath $cdbSource)) {
          throw 'CDB_INSTALL_FAILED: Windows SDK Debugging Tools (x64 cdb.exe) are unavailable. Native thread stack extraction cannot be enabled.'
        }
        $cdbSourceDir = Split-Path -Parent $cdbSource
        Copy-Item -Path (Join-Path $cdbSourceDir '*') -Destination $dbgDir -Recurse -Force
        $cdbExe = Join-Path $dbgDir 'cdb.exe'
        if (-not (Test-Path -LiteralPath $cdbExe)) { throw 'CDB_COPY_FAILED: cdb.exe was not staged into UE58 Tools.' }

        # Pass stable local paths to the API process in later workflow steps.
        "UE58_PROCDUMP=$procExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "UE58_CDB=$cdbExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "UE58_SYMBOL_CACHE=$root\Symbols" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host 'NATIVE_THREAD_STACK_TOOLS_READY=true'
        Write-Host "PROCDUMP=$procExe"
        Write-Host "CDB=$cdbExe"
