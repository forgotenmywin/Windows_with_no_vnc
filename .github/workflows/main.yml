        def system_status_payload():
            try:
                import psutil
                vm = psutil.virtual_memory()
                disk = psutil.disk_usage(str(ROOT))
                logical_cpus = max(1, int(psutil.cpu_count(logical=True) or 1))
                proc_rows = []
                for proc in psutil.process_iter(['pid', 'name', 'memory_info', 'status']):
                    try:
                        proc.cpu_percent(None)
                        proc_rows.append(proc)
                    except (psutil.NoSuchProcess, psutil.AccessDenied):
                        continue
                system_cpu = psutil.cpu_percent(interval=0.45)
                processes = []
                unreal = None
                for proc in proc_rows:
                    try:
                        info = proc.as_dict(attrs=['pid', 'name', 'memory_info', 'status'])
                        raw_cpu = max(0.0, float(proc.cpu_percent(None)))
                        normalized_cpu = raw_cpu / logical_cpus
                        memory_info = info.get('memory_info')
                        row = {'pid': info.get('pid'), 'name': info.get('name'), 'memory_mb': round((memory_info.rss if memory_info else 0) / 1048576, 1), 'cpu_percent': round(normalized_cpu, 1), 'cpu_percent_raw': round(raw_cpu, 1), 'cpu_cores_used': round(raw_cpu / 100.0, 2), 'status': info.get('status')}
                        processes.append(row)
                        if (info.get('name') or '').lower() == 'unrealeditor.exe':
                            unreal = row
                    except (psutil.NoSuchProcess, psutil.AccessDenied):
                        continue
                processes.sort(key=lambda x: x['memory_mb'], reverse=True)
                warnings = []
                if system_cpu >= 90:
                    warnings.append('Total CPU is saturated. Inspect top processes before starting packaging or shader-heavy tasks.')
                if unreal and unreal.get('cpu_percent', 0) >= 85:
                    warnings.append('Unreal is using most of one machine-equivalent CPU share; raw per-core usage is included separately.')
                return {'ok': True, 'cpu_percent': round(float(system_cpu), 1), 'cpu_logical_cores': logical_cpus, 'ram_total_gb': round(vm.total / 1073741824, 2), 'ram_used_gb': round(vm.used / 1073741824, 2), 'ram_percent': vm.percent, 'disk_free_gb': round(disk.free / 1073741824, 2), 'disk_total_gb': round(disk.total / 1073741824, 2), 'unreal': unreal, 'top_processes': processes[:12], 'warnings': warnings, 'note': 'Process CPU percent is normalized to total logical cores. cpu_percent_raw is the sum across cores. No process or Windows service is terminated.'}
            except Exception as exc:
                return {'ok': False, 'error': str(exc)}
        
