        @app.get("/api/scene/export.html")
        @monitor_auth
        def api_scene_export_html():
            """Package the latest captured Unreal geometry into a read-only HTML viewer."""
            with SCENE_MODEL_LOCK:
                state = dict(SCENE_MODEL_STATE)
            if state.get("status") != "ready":
                return jsonify(ok=False, error="No completed 3D scene snapshot exists. Capture the Unreal scene first."), 409
            job_dir = Path(state.get("job_dir", "")).resolve() if state.get("job_dir") else None
            files = state.get("model_files", []) or []
            embedded = []
            try:
                if files:
                    for item in files:
                        filename = str(item.get("file", ""))
                        target = (job_dir / filename).resolve() if job_dir else None
                        if not target or target.parent != job_dir or not target.is_file():
                            raise RuntimeError("A scene mesh file is missing: " + filename)
                        raw = target.read_bytes()
                        if len(raw) < 32 or raw[:4] != b"glTF":
                            raise RuntimeError("Invalid GLB mesh file: " + filename)
                        embedded.append({
                            "name": str(item.get("actor_label") or filename),
                            "component": str(item.get("component_name") or ""),
                            "asset": str(item.get("asset_path") or ""),
                            "transform": item.get("transform") or {},
                            "data": base64.b64encode(raw).decode("ascii")
                        })
                else:
