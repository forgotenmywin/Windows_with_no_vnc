        \ {\n  throw 'MCP_RATE_LIMIT_RECOVERY_VALIDATION_FAILED: bounded retry, Retry-After handling, request pacing\
        \ and diagnostics are required.'\n}\n$blueprintSaveRouteCount = [regex]::Matches($apiText, '(?m)^def api_blueprint_save\\\
        (').Count\nif ($blueprintSaveRouteCount -ne 1 -or $apiText -notmatch 'def api_blueprint_save_status' -or\n\
        \    $apiText -notmatch 'EditorLoadingAndSavingUtils.save_packages' -or\n    $apiText -notmatch 'SAVE_PACKAGES_BEGIN'\
        \ -or $apiText -notmatch 'SAVE_PACKAGES_END' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_PHASE=' -or $apiText\
        \ -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true') {\n  throw 'BLUEPRINT_DISK_SAVE_ENDPOINT_MISSING: one targeted\
        \ save route, package-save begin/end markers, disk verification and phase diagnostics are required.'\n}\n\
        if ($apiText -notmatch 'queue_blueprint_save_until_bridge_returns' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_OFFLINE_QUEUE_UNTIL_WORKFLOW_TIMEOUT'\
        \ -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_LOW_LOAD_MODE=ACTIVE' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_LOW_LOAD_MODE=RESTORED'\
        \ -or\n    $apiText -notmatch 'bp_write_chunked_recovery_copy' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_CHUNKED_COPY_VERIFIED=true')\
        \ {\n  throw 'BLUEPRINT_SAVE_RECOVERY_VALIDATION_FAILED: offline queue, temporary low-load mode restoration,\
        \ and verified chunked recovery copy are required.'\n}\nWrite-Host 'EXPANDED_LOG_ACCESS_VALIDATION=true'\n\
        Write-Host 'MCP_RATE_LIMIT_RECOVERY_VALIDATION=true'\nif ($apiText -notmatch 'BLUEPRINT_MANUAL_PATH_CHECK_API'\
        \ -or\n    $apiText -notmatch \"@app.post\\('/api/blueprint/check-path'\\)\" -or\n    $apiText -notmatch\
        \ \"@app.get\\('/api/blueprint/check-path-status/<job_id>'\\)\" -or\n    $apiText -notmatch 'does_asset_exist'\
        \ -or $apiText -notmatch 'BLUEPRINT_PATH_CHECK_JSON' -or\n    $apiText -notmatch 'bpAssetPath' -or $apiText\
        \ -notmatch 'Check Asset' -or\n    $apiText -notmatch 'applyBlueprintPathToArgs') {\n  throw 'BLUEPRINT_MANUAL_PATH_CHECK_MISSING:\
        \ manual /Game asset path input, Unreal existence validation and graph-tool path binding are required.'\n\
        }\nif ($apiText -notmatch 'BLUEPRINT_MANUAL_PATH_APPLY' -or $apiText -notmatch 'bpUsePath' -or $apiText\
        \ -notmatch 'applyManualBlueprintPath' -or $apiText -notmatch 'blueprintObjectPath\\(source\\)') {\n  throw\
        \ 'BLUEPRINT_MANUAL_PATH_APPLY_VALIDATION_FAILED: manual package/object path input must be normalized and\
        \ applied to selected tool arguments.'\n}\nif ($apiText -notmatch 'BLUEPRINT_OBJECT_REF_NORMALIZATION' -or\
        \ $apiText -notmatch 'refPath:objectPath' -or $apiText -notmatch 'Custom Blueprint Object Path' -or $apiText\
        \ -notmatch 'normalizeBlueprintToolArguments') {\n  throw 'BLUEPRINT_OBJECT_REF_VALIDATION_FAILED: custom\
        \ Blueprint Object Path must be normalized and sent as an object reference with refPath.'\n}\nWrite-Host\
        \ 'BLUEPRINT_MANUAL_PATH_APPLY_VALIDATION=true'\nif ($apiText -notmatch 'BLUEPRINT_LIST_GRAPHS_BRIDGE_IMPLEMENTATION'\
        \ -or\n    $apiText -notmatch \"@app.post\\('/api/blueprint/list-graphs'\\)\" -or\n    $apiText -notmatch\
        \ \"@app.get\\('/api/blueprint/list-graphs-status/<job_id>'\\)\" -or\n    $apiText -notmatch 'queue_unreal\\\
        (_blueprint_list_graphs_python_code\\(asset_path\\), 8\\)' -or\n    $apiText -notmatch 'library\\.list_graphs\\\
        (blueprint\\)' -or\n    $apiText -notmatch 'BLUEPRINT_LIST_GRAPHS_JSON' -or\n    $apiText -notmatch 'async\
        \ function listGraphs\\(\\)' -or\n    $apiText -notmatch 'bpListGraphs') {\n  throw 'BLUEPRINT_LIVE_GRAPH_EXPLORER_VALIDATION_FAILED:\
        \ a live List Graphs UI, authenticated API and Unreal Python Bridge operation are required.'\n}\nWrite-Host\
        \ 'BLUEPRINT_LIVE_GRAPH_EXPLORER_VALIDATION=true'\nWrite-Host 'BLUEPRINT_EXPLORER_VALIDATION=true'\nWrite-Host\
        \ 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION=true'\nWrite-Host 'THREE_D_GITHUB_RELEASE_VALIDATION=true'\nWrite-Host\
        \ 'BRIDGE_BUSY_DIAGNOSTICS_VALIDATION=true'\nWrite-Host 'BRIDGE_RECOVERY_ENDPOINT_VALIDATION=true'\nWrite-Host\
        \ 'PROJECT_PREFLIGHT_VALIDATION=true'\nWrite-Host 'CREATE_PROJECT_VALIDATION=true'\nWrite-Host 'THREE_D_PROJECT_SELECTOR_VALIDATION=true'\n"
