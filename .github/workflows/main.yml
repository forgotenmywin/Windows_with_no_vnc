        @app.post("/api/system/optimize")
        @monitor_auth
        def api_system_optimize():
            try:
                import psutil
                target = next((p for p in psutil.process_iter(["pid", "name"]) if (p.info.get("name") or "").lower() == "unrealeditor.exe"), None)
                if target is None:
                    return jsonify(ok=False, error="UnrealEditor.exe is not running"), 404
                # Safer than High/Realtime: raise only the editor to Above Normal.
                target.nice(psutil.ABOVE_NORMAL_PRIORITY_CLASS)
                log("System optimization: UnrealEditor priority set to ABOVE_NORMAL; no other process was stopped")
                return jsonify(ok=True, pid=target.pid, priority="ABOVE_NORMAL", note="Only Unreal Editor priority changed. No Windows service or unrelated process was terminated.")
            except Exception as exc:
                log("System optimization failed: " + repr(exc))
                return jsonify(ok=False, error=str(exc)), 500


        # ---- Safe Windows host maintenance controls ----
        # The API deliberately does not terminate arbitrary processes, disable services,
        # edit Defender/firewall settings, or delete user documents.
        WINDOWS_POWER_STATE_FILE = LOG_DIR / "windows-power-state.json"
        WINDOWS_TEMP_MAX_FILES = 3000
        WINDOWS_TEMP_AGE_HOURS = 48


        def _powercfg(args):
            command = ["powercfg"] + list(args)
            result = subprocess.run(command, capture_output=True, text=True, timeout=20,
                                    creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
            output = ((result.stdout or "") + "\n" + (result.stderr or "")).strip()
            if result.returncode != 0:
                raise RuntimeError("powercfg failed (%s): %s" % (result.returncode, output[:700]))
            return output


        def _active_power_scheme():
            output = _powercfg(["/getactivescheme"])
            match = re.search(r"([0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12})", output)
            if not match:
                raise RuntimeError("Could not parse the active Windows power scheme")
            name = output[match.end():].strip(" \t:()\r\n") or "Windows power plan"
            return {"guid": match.group(1), "name": name, "raw": output[:500]}


        def _load_windows_power_state():
            try:
                value = json.loads(WINDOWS_POWER_STATE_FILE.read_text(encoding="utf-8"))
                return value if isinstance(value, dict) else {}
            except Exception:
                return {}


        def _save_windows_power_state(value):
            temporary = WINDOWS_POWER_STATE_FILE.with_suffix(".tmp")
            temporary.write_text(json.dumps(value, ensure_ascii=False, indent=2), encoding="utf-8")
            os.replace(temporary, WINDOWS_POWER_STATE_FILE)


