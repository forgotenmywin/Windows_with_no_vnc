        MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\ntry { Start-Transcript
        -Path \"$root\\Logs\\workflow-runtime-transcript.log\" -Append -Force | Out-Null
        } catch { }\n$env:UE_ROOT = $root\n$env:UE_PYTHONPATH = \"$root\\UEControl\\\
        Content\\Python\"\nif ([string]::IsNullOrWhiteSpace($env:MONITOR_PASSWORD)
        -or $env:MONITOR_PASSWORD.Length -lt 16) {\n  throw 'Create repository Actions
        secret MONITOR_PASSWORD with a strong password of at least 16 characters before
        running this workflow.'\n}\nif ([string]::IsNullOrWhiteSpace($env:GG_UE_TOKEN))
        {\n  Write-Warning 'GG_UE_TOKEN is empty; Google Drive endpoints will fail
        until authorized_user.json or service-account JSON is saved as this Actions
        secret.'\n}\n\n# The bridge token is only for local API <-> Unreal communication.\n\
        $env:BRIDGE_TOKEN = [guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')\n\
        $python = (Get-Command python).Source\n& $python -m pip install --disable-pip-version-check
        --upgrade Flask google-api-python-client google-auth google-auth-httplib2
        requests urllib3 httpx Pillow psutil \"mcp>=2,<3\" uvicorn starlette\nif ($LASTEXITCODE
        -ne 0) { throw 'Python package installation failed.' }\n\n$apiOut = \"$root\\\
        Logs\\api-stdout.log\"\n$apiErr = \"$root\\Logs\\api-stderr.log\"\n$apiProc
        = Start-Process -FilePath $python -ArgumentList @(\"$root\\api_server.py\"\
        ) -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput
        $apiOut -RedirectStandardError $apiErr\nWrite-Host \"API_PID=$($apiProc.Id)\"\
        \n\n$localReady = $false\nfor ($i = 0; $i -lt 45; $i++) {\n  Start-Sleep -Seconds
        2\n  try {\n    $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health'
        -TimeoutSec 4\n    if ($health.ok) { $localReady = $true; break }\n  } catch
        { }\n  if ($apiProc.HasExited) { break }\n}\nif (-not $localReady) {\n  if
        (Test-Path $apiErr) { Get-Content $apiErr -Tail 100 }\n  if (Test-Path $apiOut)
        { Get-Content $apiOut -Tail 100 }\n  throw 'Local API did not start.'\n}\n\
        Write-Host 'API_LOCAL_READY=true'\n\n# API already inherited the Drive and
        GitHub credentials when it started.\n# Keep only the local bridge token available
        to the Unreal child process.\n$env:GG_UE_TOKEN = $null\n$env:GITHUB_TOKEN
        = $null\n$env:GITHUB_REPOSITORY = $null\n$env:MONITOR_PASSWORD = $null\n\n\
        $editor = $env:UE_EDITOR_EXE\nif ([string]::IsNullOrWhiteSpace($editor) -or
        -not (Test-Path -LiteralPath $editor)) {\n  throw 'UE_EDITOR_EXE was not found
        from the extraction step.'\n}\nWrite-Host \"Unreal Editor found: $editor\"\
        \n$ueOut = \"$root\\Logs\\unreal-stdout.log\"\n$ueErr = \"$root\\Logs\\unreal-stderr.log\"\
        \n$initScript = \"$root\\UEControl\\Content\\Python\\init_unreal.py\"\nif
        (-not (Test-Path -LiteralPath $initScript)) { throw \"Unreal bridge startup
        script was not found: $initScript\" }\n# IMPORTANT: do NOT pass -ExecutePythonScript
        here. Epic documents that\n# the Editor closes after a command-line ExecutePythonScript
        finishes.\n# Content/Python/init_unreal.py is auto-detected and run by the
        Editor.\n$ueArgs = @(\"$root\\UEControl\\UEControl.uproject\", '-log', '-stdout',
        '-FullStdOutLogOutput', '-AllowSoftwareRendering', '-d3d11', '-ModelContextProtocolStartServer',
        '-ModelContextProtocolPort=8000', '-ExecCmds=\"py D:/UE58/UEControl/Content/Python/init_unreal.py\"\
        ')\n$ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory
        \"$root\\UEControl\" -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError
        $ueErr\nWrite-Host \"UNREAL_PID=$($ueProc.Id)\"\n\n$cloudflared = \"$root\\\
        cloudflared.exe\"\nInvoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'
        -OutFile $cloudflared\n$cfOut = \"$root\\Logs\\cloudflared-stdout.log\"\n\
        $cfErr = \"$root\\Logs\\cloudflared-stderr.log\"\n$cfProc = Start-Process
        -FilePath $cloudflared -ArgumentList @('tunnel', '--url', 'http://127.0.0.1:8765',
        '--no-autoupdate') -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput
        $cfOut -RedirectStandardError $cfErr\n\n$publicUrl = $null\nfor ($i = 0; $i
        -lt 90; $i++) {\n  Start-Sleep -Seconds 2\n  $combined = ''\n  foreach ($f
        in @($cfOut, $cfErr)) {\n    if (Test-Path $f) { try { $combined += \"`n\"\
        \ + (Get-Content $f -Raw -ErrorAction SilentlyContinue) } catch { } }\n  }\n\
        \  $match = [regex]::Match($combined, 'https://[a-zA-Z0-9-]+\\.trycloudflare\\\
        .com')\n  if ($match.Success) { $publicUrl = $match.Value; break }\n  if ($cfProc.HasExited)
        { break }\n}\nif (-not $publicUrl) {\n  if (Test-Path $cfErr) { Get-Content
        $cfErr -Tail 100 }\n  throw 'Cloudflare Quick Tunnel did not provide a public
