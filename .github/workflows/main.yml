                                          "started_at": time.time()})
            threading.Thread(target=_scene_model_export_worker, args=(job_id,),
                             name="UE-SceneGLB-" + job_id[:8], daemon=True).start()
            log("Actual scene geometry export queued: job=%s" % job_id)
            return jsonify(ok=True, status="queued", job_id=job_id), 202


