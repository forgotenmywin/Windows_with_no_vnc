        def _inside_root(path):
            path = Path(path).resolve()
            return path == ROOT or ROOT in path.parents
        
        def _current_project():
            global CURRENT_PROJECT_FILE
            if CURRENT_PROJECT_FILE.is_file() and _inside_root(CURRENT_PROJECT_FILE):
                return CURRENT_PROJECT_FILE
            return (ROOT / 'UEControl' / 'UEControl.uproject').resolve()
        
        def _project_files():
            found = {}
            excluded = {'Extracted', 'parts', 'Uploads', 'Screenshots', 'Logs', 'Builds', 'Backups', 'control', 'Config'}
            for base in (ROOT / 'Projects', ROOT / 'UEControl', ROOT):
                if base.exists():
                    for walk_root, dirs, files in os.walk(base):
                        dirs[:] = [name for name in dirs if name not in excluded and (not name.startswith('.'))]
                        for filename in files:
                            if filename.lower().endswith('.uproject'):
                                item = Path(walk_root) / filename
                                if _inside_root(item):
                                    found[str(item.resolve())] = item.resolve()
            current = _current_project()
            if current.is_file():
                found[str(current)] = current
            return sorted(found.values(), key=lambda p: p.name.lower())
        
        def _project_payload():
            current = str(_current_project())
            rows = []
            for item in _project_files():
                try:
                    rows.append({'name': item.stem, 'project_file': str(item), 'directory': str(item.parent), 'is_current': str(item) == current})
                except OSError:
                    continue
            return rows
        
        def _backup_file(source, label='config'):
            source = Path(source).resolve()
            if not source.is_file() or not _inside_root(source):
                return None
            stamp = time.strftime('%Y%m%d_%H%M%S') + '_' + uuid.uuid4().hex[:6]
            dest_dir = BACKUP_DIR / label
            dest_dir.mkdir(parents=True, exist_ok=True)
            dest = dest_dir / (source.name + '.' + stamp + '.bak')
            shutil.copy2(source, dest)
            return str(dest)
        
        def _write_editor_command(action, project_file, checkpoint=''):
            target = Path(project_file).resolve()
            if target.suffix.lower() != '.uproject' or not _inside_root(target) or (not target.is_file()):
                raise ValueError('project_file must be an existing .uproject inside D:\\UE58')
            payload = {'action': str(action), 'project_file': str(target), 'checkpoint': str(checkpoint or ''), 'requested_at': time.time(), 'nonce': uuid.uuid4().hex}
            tmp = EDITOR_COMMAND_FILE.with_suffix('.tmp')
            tmp.write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
            os.replace(tmp, EDITOR_COMMAND_FILE)
            log('EDITOR COMMAND queued: %s project=%s' % (action, target))
            return payload
        
        def _ensure_bridge_in_project(project_file):
            project_file = Path(project_file).resolve()
            source = ROOT / 'UEControl' / 'Content' / 'Python' / 'init_unreal.py'
            if not source.is_file():
                raise FileNotFoundError('Bridge startup template missing: ' + str(source))
            target_dir = project_file.parent / 'Content' / 'Python'
            target_dir.mkdir(parents=True, exist_ok=True)
            target = target_dir / 'init_unreal.py'
            if target.exists() and target.resolve() == source.resolve():
                return
            if target.exists():
                _backup_file(target, 'startup_scripts')
            shutil.copy2(source, target)
        
        def prepare_project(project_file, ensure_remote_plugins=True):
            project_file = Path(project_file).resolve()
            if project_file.suffix.lower() != '.uproject' or not project_file.is_file() or (not _inside_root(project_file)):
                raise ValueError('Choose an existing .uproject inside D:\\UE58')
            data = json.loads(project_file.read_text(encoding='utf-8-sig'))
            if not isinstance(data, dict):
                raise ValueError('Invalid .uproject JSON')
            if ensure_remote_plugins:
                backup = _backup_file(project_file, 'uproject')
                plugins = data.get('Plugins')
                if not isinstance(plugins, list):
                    plugins = []
                mapping = {str(p.get('Name')): p for p in plugins if isinstance(p, dict) and p.get('Name')}
                for plugin_name in ('PythonScriptPlugin', 'EditorScriptingUtilities', 'ModelContextProtocol', 'AllToolsets', 'GLTFExporter'):
                    item = mapping.get(plugin_name)
                    if item is None:
                        item = {'Name': plugin_name, 'Enabled': True}
                        plugins.append(item)
                    else:
                        item['Enabled'] = True
                data['Plugins'] = plugins
                tmp = project_file.with_suffix('.uproject.tmp')
                tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
                os.replace(tmp, project_file)
            else:
                backup = None
            _ensure_bridge_in_project(project_file)
            return {'project_file': str(project_file), 'backup': backup}
        
        def _available_plugin_descriptor_paths(project_file=None):
            project_file = Path(project_file or _current_project()).resolve()
            engine_plugins = next((p for p in (ROOT / 'Extracted').glob('*/Engine/Plugins') if p.is_dir()), None)
            roots = []
            if engine_plugins:
                roots.append(engine_plugins.resolve())
            project_plugins = (project_file.parent / 'Plugins').resolve()
            if project_plugins.is_dir():
                roots.append(project_plugins)
            roots_key = tuple((str(p) for p in roots))
            with PLUGIN_INDEX_LOCK:
                cached = PLUGIN_INDEX_CACHE.get('paths')
                if cached is not None and PLUGIN_INDEX_CACHE.get('roots') == roots_key:
                    return dict(cached)
            result = {}
            excluded_dirs = {'binaries', 'content', 'intermediate', 'saved', 'deriveddatacache', 'thirdparty', 'resources', 'documentation', 'docs', '.git'}
            for base in roots:
                if not base.is_dir():
                    continue
                for walk_root, dirs, files in os.walk(base):
                    relative = Path(walk_root).relative_to(base)
                    depth = len(relative.parts)
                    if depth >= 5:
                        dirs[:] = []
                    else:
                        dirs[:] = [name for name in dirs if not name.startswith('.') and (not name.startswith('_installing_')) and (name.lower() not in excluded_dirs)]
                    for filename in files:
                        if filename.lower().endswith('.uplugin'):
                            descriptor = Path(walk_root) / filename
                            result.setdefault(descriptor.stem, descriptor.resolve())
                            if len(result) >= 5000:
                                break
                    if len(result) >= 5000:
                        break
            with PLUGIN_INDEX_LOCK:
                PLUGIN_INDEX_CACHE.update({'roots': roots_key, 'paths': dict(result), 'built_at': time.time()})
            return result
        
        def _available_plugin_descriptors(project_file=None):
            """Return descriptor paths by plugin name; JSON metadata is loaded only for visible pages."""
            return _available_plugin_descriptor_paths(project_file)
        
        def _project_plugin_state(project_file=None, query='', offset=0, limit=75):
            project_file = Path(project_file or _current_project()).resolve()
            data = json.loads(project_file.read_text(encoding='utf-8-sig'))
            enabled = {str(item.get('Name')): bool(item.get('Enabled', False)) for item in data.get('Plugins', []) if isinstance(item, dict) and item.get('Name')}
            available = _available_plugin_descriptor_paths(project_file)
            needle = str(query or '').strip().lower()
            names = sorted((name for name in available if not needle or needle in name.lower()), key=str.lower)
            total = len(names)
            try:
                offset = max(0, int(offset))
                limit = max(10, min(200, int(limit)))
            except (TypeError, ValueError):
                offset, limit = (0, 75)
            selected = names[offset:offset + limit]
            rows = []
            for name in selected:
                descriptor = available[name]
                description, category = ('', '')
                try:
                    meta = json.loads(descriptor.read_text(encoding='utf-8-sig'))
                    description = str(meta.get('Description', ''))[:220]
                    category = str(meta.get('Category', ''))[:80]
                except Exception:
                    description = 'Plugin descriptor could not be parsed'
                rows.append({'name': name, 'path': str(descriptor), 'description': description, 'category': category, 'enabled': enabled.get(name, False), 'required': name in ('PythonScriptPlugin', 'EditorScriptingUtilities', 'ModelContextProtocol', 'AllToolsets', 'GLTFExporter')})
            return {'project_file': str(project_file), 'plugins': rows, 'enabled_count': sum(enabled.values()), 'available_count': len(available), 'filtered_count': total, 'offset': offset, 'limit': limit, 'has_more': offset + len(rows) < total, 'query': needle}
        
        def _scene_snapshot_from_unreal(timeout=10000, job_id=''):
            progress_path = (SCENE_MODEL_DIR / ('scene_scan_' + str(job_id) + '.json')).resolve()
            code = 'import json, os, time, unreal\nprogress_path = __PROGRESS_PATH__\ndef _write_progress(percent, phase, completed=0, total=0, detail=""):\n    payload = {"progress": max(0, min(100, int(percent))), "phase": str(phase),\n               "completed": int(completed or 0), "total": int(total or 0),\n               "detail": str(detail)[:240], "updated_at": time.time()}\n    try:\n        temporary = progress_path + ".tmp"\n        with open(temporary, "w", encoding="utf-8") as stream:\n            json.dump(payload, stream, ensure_ascii=False)\n        os.replace(temporary, progress_path)\n    except Exception as progress_error:\n        print("[UE58 SCAN] progress update failed: " + str(progress_error))\n_write_progress(3, "Connecting to Unreal Editor", detail="Reading active level metadata")\nworld = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()\nactors = unreal.EditorLevelLibrary.get_all_level_actors()\nrows = []\n_write_progress(8, "Enumerating level Actors", 0, len(actors), str(len(actors)) + " Actors found")\ndef _v(v): return {"x": float(v.x), "y": float(v.y), "z": float(v.z)}\nfor actor_index, actor in enumerate(actors):\n    try:\n        cls = actor.get_class().get_name()\n        label = actor.get_actor_label()\n        loc = actor.get_actor_location()\n        rot = actor.get_actor_rotation()\n        scale = actor.get_actor_scale3d()\n        try:\n            origin, extent = actor.get_actor_bounds(False)\n            ext = _v(extent)\n        except Exception:\n            origin, ext = loc, {"x": 30.0, "y": 30.0, "z": 30.0}\n        low = cls.lower()\n        component_rows = []\n        # Include component and asset names: one Actor may contain several\n        # renderable meshes, and the outliner must identify those accurately.\n        for component_class, asset_property in ((unreal.StaticMeshComponent, "static_mesh"),\n                                                (unreal.SkeletalMeshComponent, "skeletal_mesh")):\n            try:\n                for component in actor.get_components_by_class(component_class):\n                    try:\n                        asset = component.get_editor_property(asset_property)\n                        if asset is None:\n                            continue\n                        component_rows.append({\n                            "name": str(component.get_name()),\n                            "class": str(component.get_class().get_name()),\n                            "asset_name": str(asset.get_name()),\n                            "asset_path": str(asset.get_path_name())\n                        })\n                    except Exception:\n                        continue\n            except Exception:\n                pass\n        camera_info = None\n        try:\n            camera_class = getattr(unreal, "CameraComponent", None)\n            if camera_class:\n                camera_components = actor.get_components_by_class(camera_class)\n                if camera_components:\n                    camera_component = camera_components[0]\n                    camera_location = camera_component.get_world_location()\n                    camera_rotation = camera_component.get_world_rotation()\n                    try:\n                        camera_fov = float(camera_component.get_editor_property("field_of_view"))\n                    except Exception:\n                        camera_fov = 90.0\n                    camera_info = {\n                        "location": _v(camera_location),\n                        "rotation": {"pitch": float(camera_rotation.pitch), "yaw": float(camera_rotation.yaw), "roll": float(camera_rotation.roll)},\n                        "fov": camera_fov\n                    }\n        except Exception:\n            camera_info = None\n        if "light" in low: category = "Lights"\n        elif "camera" in low or camera_info: category = "Cameras"\n        elif "skeletalmesh" in low or "character" in low or "pawn" in low: category = "Characters"\n        elif "volume" in low: category = "Volumes"\n        elif "staticmesh" in low or "mesh" in low or component_rows: category = "Meshes"\n        else: category = "Actors"\n        rows.append({"name": str(label or actor.get_name()), "object_name": str(actor.get_name()),\n            "object_path": str(actor.get_path_name()), "class": str(cls), "category": category,\n            "location": _v(loc), "rotation": {"pitch": float(rot.pitch), "yaw": float(rot.yaw), "roll": float(rot.roll)},\n            "scale": _v(scale), "bounds_origin": _v(origin), "bounds_extent": ext,\n            "components": component_rows, "camera": camera_info,\n            "hidden": bool(actor.is_hidden_ed()) if hasattr(actor, "is_hidden_ed") else False})\n    except Exception as exc:\n        rows.append({"name": "Actor read error", "class": "Unknown", "category": "Errors", "error": str(exc)[:180]})\n    _write_progress(8 + int(88 * (actor_index + 1) / max(1, len(actors))),\n                    "Reading Actor metadata", actor_index + 1, len(actors),\n                    "Read " + str(actor_index + 1) + " of " + str(len(actors)) + " Actors")\nlevel = str(world.get_name()) if world else "Unknown"\n_write_progress(98, "Finalizing actor list", len(rows), len(actors), str(len(rows)) + " Actors read")\nprint("__UE_SCENE_JSON__" + json.dumps({"level": level, "count": len(rows), "actors": rows}, ensure_ascii=False))'
            code = code.replace('__PROGRESS_PATH__', repr(str(progress_path).replace('\\', '/')))
            result, status = queue_unreal(code, timeout)
            if status == 202 and result.get('job_id'):
                result, status = wait_unreal_job(result['job_id'], timeout=10000)
            if status != 200 or not result.get('ok'):
                raise RuntimeError(result.get('error') or result.get('message') or 'Unreal scene query failed: ' + str(result))
            output = str(result.get('output', ''))
            marker = '__UE_SCENE_JSON__'
            line = next((ln for ln in output.splitlines() if marker in ln), '')
            if not line:
                raise RuntimeError('Scene snapshot returned no JSON marker: ' + output[:500])
            payload = json.loads(line.split(marker, 1)[1])
            captured_at = time.time()
            payload['updated_at'] = captured_at
            payload['updated'] = captured_at
            with SCENE_LOCK:
                SCENE_CACHE.update(payload)
                SCENE_CACHE['error'] = ''
            return payload
        
        def _scene_scan_worker(job_id):
            global SCENE_ACTIVE_JOB
            with SCENE_JOB_LOCK:
                SCENE_JOBS[job_id].update({'status': 'running', 'started_at': time.time(), 'progress': 1, 'phase': 'Starting actor metadata scan', 'completed': 0, 'total': 0, 'detail': 'Waiting for Unreal Bridge'})
            try:
                if not bridge_connected():
                    raise RuntimeError('Unreal Bridge is offline')
                payload = _scene_snapshot_from_unreal(timeout=10000, job_id=job_id)
                with SCENE_JOB_LOCK:
                    SCENE_JOBS[job_id].update({'status': 'completed', 'result': payload, 'completed_at': time.time(), 'count': payload.get('count', 0), 'progress': 100, 'phase': 'Actor metadata scan complete', 'completed': payload.get('count', 0), 'total': payload.get('count', 0), 'detail': str(payload.get('count', 0)) + ' Actors read'})
                log('Scene scan completed: job=%s actors=%s level=%s' % (job_id, payload.get('count', 0), payload.get('level', '')))
            except Exception as exc:
                with SCENE_LOCK:
                    SCENE_CACHE['error'] = str(exc)[:800]
                with SCENE_JOB_LOCK:
                    SCENE_JOBS[job_id].update({'status': 'failed', 'error': str(exc)[:1200], 'phase': 'Actor metadata scan failed', 'detail': str(exc)[:240], 'completed_at': time.time()})
                log('Scene scan failed: job=%s error=%s' % (job_id, repr(exc)))
            finally:
                with SCENE_JOB_LOCK:
                    if SCENE_ACTIVE_JOB == job_id:
                        SCENE_ACTIVE_JOB = ''
        
        def _start_scene_scan(force=False):
            global SCENE_ACTIVE_JOB
            with SCENE_LOCK:
                cached = dict(SCENE_CACHE)
            if not force and cached.get('updated') and (time.time() - cached['updated'] < 10):
                return {'ok': True, 'status': 'cached', 'scene': cached}
            with SCENE_JOB_LOCK:
                if SCENE_ACTIVE_JOB and SCENE_ACTIVE_JOB in SCENE_JOBS:
                    active = SCENE_JOBS[SCENE_ACTIVE_JOB]
                    if active.get('status') in ('queued', 'running'):
                        return {'ok': True, 'status': active.get('status'), 'job_id': SCENE_ACTIVE_JOB}
                job_id = uuid.uuid4().hex
                SCENE_JOBS[job_id] = {'job_id': job_id, 'status': 'queued', 'created_at': time.time(), 'progress': 0, 'phase': 'Queued for actor metadata scan', 'completed': 0, 'total': 0, 'detail': 'Waiting for scan worker'}
                SCENE_ACTIVE_JOB = job_id
                for old_id, row in list(SCENE_JOBS.items()):
                    if old_id != job_id and row.get('status') in ('completed', 'failed') and (len(SCENE_JOBS) > 20):
                        SCENE_JOBS.pop(old_id, None)
                threading.Thread(target=_scene_scan_worker, args=(job_id,), name='UE-SceneScan-' + job_id[:8], daemon=True).start()
                log('Scene scan queued: job=%s' % job_id)
                return {'ok': True, 'status': 'queued', 'job_id': job_id}
        
        def _scene_job_payload(job_id=''):
            with SCENE_JOB_LOCK:
                chosen = str(job_id or SCENE_ACTIVE_JOB)
                row = dict(SCENE_JOBS.get(chosen, {})) if chosen else {}
            with SCENE_LOCK:
                cached = dict(SCENE_CACHE)
            if not row:
                return {'ok': bool(cached.get('updated')), 'status': 'idle', 'scene': cached, 'bridge_connected': bridge_connected()}
            row.pop('result', None)
            if row.get('status') in ('queued', 'running') and chosen:
                progress_file = (SCENE_MODEL_DIR / ('scene_scan_' + chosen + '.json')).resolve()
                try:
                    if progress_file.parent == SCENE_MODEL_DIR and progress_file.is_file():
                        progress_data = json.loads(progress_file.read_text(encoding='utf-8'))
                        if isinstance(progress_data, dict):
                            for key in ('progress', 'phase', 'completed', 'total', 'detail', 'updated_at'):
                                if key in progress_data:
                                    row[key] = progress_data[key]
                except Exception as progress_read_error:
                    row['progress_read_warning'] = str(progress_read_error)[:140]
            if SCENE_JOBS.get(chosen, {}).get('status') == 'completed':
                row['progress'] = 100
                row['scene'] = cached
            return {'ok': row.get('status') != 'failed', 'job': row, 'scene': cached if cached.get('updated') else None, 'bridge_connected': bridge_connected()}
        
        @app.get('/api/scene/snapshot')
        @monitor_auth
        def api_scene_snapshot():
            refresh = request.args.get('refresh', '1') != '0'
            force = request.args.get('force', '0') == '1'
            with SCENE_LOCK:
                cached = dict(SCENE_CACHE)
            stale = not cached.get('updated') or time.time() - cached.get('updated', 0) > 10
            job = _start_scene_scan(force=force) if refresh and bridge_connected() and (force or stale) else {'ok': True, 'status': 'cached'}
            payload = _scene_job_payload(job.get('job_id', ''))
            payload['request'] = job
            payload['bridge_connected'] = bridge_connected()
            payload['ok'] = bool(cached.get('updated') or job.get('ok'))
            return jsonify(payload)
        
        @app.get('/api/scene/status')
        @monitor_auth
        def api_scene_status():
            return jsonify(_scene_job_payload(request.args.get('job_id', '')))
        
        def _scene_model_export_worker(job_id):
            """Export actual renderable mesh geometry from the active Unreal level without modifying it."""
            job_dir = (SCENE_MODEL_DIR / ('offline_scene_' + job_id)).resolve()
            job_dir.mkdir(parents=True, exist_ok=True)
            temp_path = (job_dir / 'scene_model.glb').resolve()
            progress_path = (job_dir / 'progress.json').resolve()
        
            def _server_progress(percent, phase, completed=0, total=0, detail=''):
                payload = {'progress': max(0, min(100, int(percent))), 'phase': str(phase), 'completed': int(completed or 0), 'total': int(total or 0), 'detail': str(detail)[:300], 'updated_at': time.time()}
                try:
                    tmp_progress = progress_path.with_suffix('.tmp')
                    tmp_progress.write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
                    os.replace(tmp_progress, progress_path)
                except Exception as progress_error:
                    log('Could not write scene export progress: ' + repr(progress_error))
                with SCENE_MODEL_LOCK:
                    if SCENE_MODEL_STATE.get('job_id') == job_id:
                        SCENE_MODEL_STATE.update(payload)
            _server_progress(2, 'Starting Unreal scene export', detail='Preparing progress tracking')
            with SCENE_MODEL_LOCK:
                if SCENE_MODEL_STATE.get('job_id') == job_id:
                    SCENE_MODEL_STATE.update({'status': 'running', 'started_at': time.time()})
            try:
                if not bridge_connected():
                    raise RuntimeError('Unreal Python Bridge is offline')
                unreal_path = str(temp_path).replace('\\', '/')
                code = '\nimport json, os, time, unreal, traceback\noutput_path = __OUTPUT_PATH__\nprogress_path = __PROGRESS_PATH__\nreport = {"ok": False, "path": output_path, "error": ""}\ndef _write_progress(percent, phase, completed=0, total=0, detail=""):\n    payload = {"progress": max(0, min(100, int(percent))), "phase": str(phase),\n               "completed": int(completed or 0), "total": int(total or 0),\n               "detail": str(detail)[:300], "updated_at": time.time()}\n    try:\n        temporary = progress_path + ".tmp"\n        with open(temporary, "w", encoding="utf-8") as progress_stream:\n            json.dump(payload, progress_stream, ensure_ascii=False)\n        os.replace(temporary, progress_path)\n    except Exception as progress_error:\n        print("[UE58 GLB] progress update failed: " + str(progress_error))\n_write_progress(4, "Connecting to Unreal Editor", detail="Checking the active level and GLTFExporter")\ntry:\n    world = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()\n    if world is None:\n        raise RuntimeError("Unreal Editor has no active editor world")\n    if not hasattr(unreal, "GLTFExporter") or not hasattr(unreal, "GLTFExportOptions"):\n        raise RuntimeError("GLTFExporter is not loaded. Enable the GLTFExporter plugin and restart this project.")\n    os.makedirs(os.path.dirname(output_path), exist_ok=True)\n    if os.path.isfile(output_path):\n        os.remove(output_path)\n    options = unreal.GLTFExportOptions()\n    # Geometry-first snapshot: disable material texture baking and skip lights/cameras.\n    # Mesh geometry and component transforms remain intact, but export is much lighter.\n    try:\n        options.set_editor_property("bake_material_inputs", unreal.GLTFMaterialBakeMode.DISABLED)\n    except Exception as material_bake_error:\n        print("GLTF material baking could not be disabled: " + str(material_bake_error))\n    for property_name, property_value in (("export_lights", False), ("export_cameras", False),\n                                           ("export_vertex_colors", True), ("export_morph_targets", False),\n                                           ("export_vertex_skin_weights", True), ("make_skinned_meshes_root", True)):\n        try:\n            options.set_editor_property(property_name, property_value)\n        except Exception:\n            pass\n    # Explicitly collect renderable actor components from the active editor level.\n    # Passing a populated SelectedActors set avoids ambiguity between the editor world\n    # and the level actor list in some UE 5.8 Python builds.\n    try:\n        actor_subsystem = unreal.get_editor_subsystem(unreal.EditorActorSubsystem)\n        level_actors = list(actor_subsystem.get_all_level_actors() or [])\n    except Exception as actor_subsystem_error:\n        print("EditorActorSubsystem unavailable; using EditorLevelLibrary: " + str(actor_subsystem_error))\n        level_actors = list(unreal.EditorLevelLibrary.get_all_level_actors() or [])\n    _write_progress(10, "Scanning active Unreal level", total=len(level_actors), detail=str(len(level_actors)) + " Actors found")\n\n    mesh_actor_list = []\n    static_component_count = 0\n    skeletal_component_count = 0\n    skipped_hidden_component_count = 0\n    for actor_scan_index, actor in enumerate(level_actors):\n        if actor is None:\n            _write_progress(10 + int(12 * (actor_scan_index + 1) / max(1, len(level_actors))),\n                            "Scanning mesh components", actor_scan_index + 1, len(level_actors), "Reading Actor components")\n            continue\n        actor_has_mesh = False\n        try:\n            static_components = actor.get_components_by_class(unreal.StaticMeshComponent)\n        except Exception:\n            static_components = []\n        for component in static_components or []:\n            if component is None:\n                continue\n            try:\n                mesh_asset 