        \ -or $apiText -notmatch 'SAVE_PACKAGES_END' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_PHASE=' -or $apiText\
        \ -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true') {\n  throw 'BLUEPRINT_DISK_SAVE_ENDPOINT_MISSING: one targeted\
