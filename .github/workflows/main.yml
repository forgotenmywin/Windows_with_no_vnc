        <script type="module">
        let THREE, GLTFLoader;
        const root = document.getElementById('scene3d');
        let scene, camera, renderer, group, grid, axes, worldBounds = null, modelBounds = null;
        let actors = [], cameraHasBeenFramed = false, lastSceneTimestamp = null, lastSceneSignature = '';
        let activeSceneJob = '', scenePollBusy = false, modelExportBusy = false, modelExportPending = false, modelPollTimer = null;
        let loadedModelVersion = -1, forceFrameAfterExport = false;
        let target;
        const numberOr = (value, fallback=0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
        const clamp = (value, low, high) => Math.max(low, Math.min(high, value));

        function init(){
          target = new THREE.Vector3(0,0,0);
          scene = new THREE.Scene();
          scene.background = new THREE.Color(0x080d14);
          camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100000000);
          camera.position.set(1200, 950, 1200);
          renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'low-power'});
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.15;
          renderer.setClearColor(0x101923, 1);
          renderer.domElement.addEventListener('webglcontextlost', event => {
            event.preventDefault();
            const fallback=document.getElementById('sceneFallback');
            if(fallback){fallback.hidden=false;fallback.textContent='The browser lost its WebGL graphics context. Reload this page or use a browser with WebGL enabled.';}
          });
          root.innerHTML = '';
          root.appendChild(renderer.domElement);
          const fallback = document.createElement('div');
          fallback.id = 'sceneFallback';
          fallback.textContent = 'Waiting for Unreal scene geometry…';
          root.appendChild(fallback);
          renderer.domElement.setAttribute('aria-label','Interactive viewer showing actual Unreal Engine mesh geometry');
          renderer.domElement.addEventListener('contextmenu', event => event.preventDefault());
          installCameraControls(renderer.domElement);
          scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.9));
          const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
          keyLight.position.set(1.5, 2.2, 1.4);
          scene.add(keyLight);
          const fillLight = new THREE.DirectionalLight(0xffffff, 0.45);
          fillLight.position.set(-1.5, 0.8, -1.2);
          scene.add(fillLight);
          grid = new THREE.GridHelper(5000, 50, 0x496078, 0x26394c);
          scene.add(grid);
          group = new THREE.Group();
          scene.add(group);
          axes = new THREE.AxesHelper(250);
          scene.add(axes);
          resize();
          if(window.ResizeObserver) new ResizeObserver(resize).observe(root);
          window.addEventListener('resize', resize);
          function animate(){ requestAnimationFrame(animate); renderer.render(scene, camera); }
          animate();
        }

        function resize(){
          if(!renderer || !root.clientWidth || !root.clientHeight) return;
          const w = root.clientWidth, h = root.clientHeight;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }

        function controlsTarget(){ return target; }
        function rotateCamera(dx, dy){
          const offset = camera.position.clone().sub(controlsTarget());
          const spherical = new THREE.Spherical().setFromVector3(offset);
          const height = Math.max(1, root.clientHeight);
          spherical.theta -= (dx / height) * Math.PI * 2;
          spherical.phi -= (dy / height) * Math.PI * 2;
          spherical.makeSafe();
          camera.position.copy(controlsTarget()).add(new THREE.Vector3().setFromSpherical(spherical));
          camera.up.set(0,1,0);
          camera.lookAt(controlsTarget());
        }

        function panCamera(dx, dy){
          camera.updateMatrixWorld();
          const distance = camera.position.distanceTo(target);
          const worldPerPixel = 2 * distance * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) / Math.max(1, root.clientHeight);
          const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
          const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
          const shift = right.multiplyScalar(-dx * worldPerPixel).add(up.multiplyScalar(dy * worldPerPixel));
          camera.position.add(shift);
          target.add(shift);
          camera.lookAt(target);
        }

        function zoomCamera(factor){
          const offset = camera.position.clone().sub(target);
          const distance = offset.length();
          const minDistance = camera.userData.minDistance || 1;
          const maxDistance = camera.userData.maxDistance || 100000000;
          const nextDistance = clamp(distance * factor, minDistance, maxDistance);
          if(distance > 0){ offset.setLength(nextDistance); camera.position.copy(target).add(offset); camera.lookAt(target); }
        }

        function installCameraControls(canvas){
          const pointers = new Map();
          let lastPoint = null, lastMidpoint = null, lastPinchDistance = 0;
          canvas.addEventListener('pointerdown', event => {
            pointers.set(event.pointerId, {x:event.clientX, y:event.clientY, button:event.button});
            canvas.setPointerCapture?.(event.pointerId);
            if(pointers.size >= 2){
              const pts = [...pointers.values()].slice(0,2);
              lastMidpoint = {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
              lastPinchDistance = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
              lastPoint = null;
            }else{
              lastPoint = {x:event.clientX, y:event.clientY};
              lastMidpoint = null;
              lastPinchDistance = 0;
            }
            event.preventDefault();
          });
          canvas.addEventListener('pointermove', event => {
            if(!pointers.has(event.pointerId)) return;
            pointers.set(event.pointerId, {...pointers.get(event.pointerId), x:event.clientX, y:event.clientY});
            if(pointers.size >= 2){
              const pts = [...pointers.values()].slice(0,2);
              const midpoint = {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
              const distance = Math.max(1, Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y));
              if(lastMidpoint) panCamera(midpoint.x-lastMidpoint.x, midpoint.y-lastMidpoint.y);
              if(lastPinchDistance > 0) zoomCamera(lastPinchDistance / distance);
              lastMidpoint = midpoint;
              lastPinchDistance = distance;
            }else if(lastPoint){
              const dx = event.clientX - lastPoint.x, dy = event.clientY - lastPoint.y;
              lastPoint = {x:event.clientX, y:event.clientY};
              const pointer = pointers.get(event.pointerId);
              if(pointer.button === 2 || pointer.button === 1) panCamera(dx,dy);
              else rotateCamera(dx,dy);
            }
            event.preventDefault();
          });
          const stop = event => {
            pointers.delete(event.pointerId);
            if(pointers.size === 1){
              const remaining = [...pointers.values()][0];
              lastPoint = {x:remaining.x,y:remaining.y};
              lastMidpoint = null; lastPinchDistance = 0;
            }else if(pointers.size === 0){ lastPoint = null; lastMidpoint = null; lastPinchDistance = 0; }
          };
          canvas.addEventListener('pointerup', stop);
          canvas.addEventListener('pointercancel', stop);
          canvas.addEventListener('lostpointercapture', stop);
          canvas.addEventListener('wheel', event => { event.preventDefault(); zoomCamera(Math.exp(event.deltaY * 0.001)); }, {passive:false});
          canvas.addEventListener('dblclick', fitAll);
        }

        function disposeObject(object){
          object.traverse(child => {
            if(child.geometry?.dispose) child.geometry.dispose();
            if(child.material){
              const materials = Array.isArray(child.material) ? child.material : [child.material];
              materials.forEach(material => {
                for(const value of Object.values(material)) if(value && value.isTexture) value.dispose();
                material.dispose?.();
              });
            }
          });
        }
        function clearGroup(){
          if(!group) return;
          while(group.children.length){ const object=group.children[0]; group.remove(object); disposeObject(object); }
          modelBounds = null;
        }

        function renderActors(rows){
          actors = Array.isArray(rows) ? rows : [];
          const bounds = new THREE.Box3();
          for(const actor of actors){
            if(!actor || actor.hidden || !actor.location) continue;
            const origin = actor.bounds_origin || actor.location;
            const px = numberOr(origin.x), py = numberOr(origin.y), pz = numberOr(origin.z);
            const extent = actor.bounds_extent || {x:25,y:25,z:25};
            const half = new THREE.Vector3(Math.max(1,Math.abs(numberOr(extent.x,25))),
                                           Math.max(1,Math.abs(numberOr(extent.z,25))),
                                           Math.max(1,Math.abs(numberOr(extent.y,25))));
            const center = new THREE.Vector3(px,pz,py);
            bounds.expandByPoint(center.clone().sub(half));
            bounds.expandByPoint(center.clone().add(half));
          }
          if(!modelBounds || modelBounds.isEmpty()) worldBounds = bounds.isEmpty() ? null : bounds;
          renderList();
          // Do not frame placeholder Actor bounds. The camera is framed to the real GLB mesh after export.
        }

        function fitAll(){
          if(!worldBounds || worldBounds.isEmpty()){
            const fallback=document.getElementById('sceneFallback');
            if(fallback){fallback.hidden=false;fallback.textContent='No 3D mesh is available yet. Check the active Unreal level and the model export status above.';}
            document.getElementById('sceneModelStatus').textContent = 'No model bounds are available. Wait for the GLB export or press Reload real geometry.';
            return;
          }
          const bounds = worldBounds.clone();
          const center = bounds.getCenter(new THREE.Vector3());
          const size = bounds.getSize(new THREE.Vector3());
          const radius = Math.max(0.1, size.length() * 0.5);
          const halfVertical = THREE.MathUtils.degToRad(camera.fov * 0.5);
          const halfHorizontal = Math.atan(Math.tan(halfVertical) * Math.max(0.2, camera.aspect || 1));
          const limitingHalfFov = Math.max(0.05, Math.min(halfVertical, halfHorizontal));
          const distance = Math.max(0.5, radius / Math.sin(limitingHalfFov) * 1.35);
          const direction = new THREE.Vector3(1.25,0.88,1.25).normalize();
          target.copy(center);
          camera.up.set(0,1,0);
          camera.position.copy(center).add(direction.multiplyScalar(distance));
          camera.near = Math.max(0.001, radius / 10000);
          camera.far = Math.max(1000, radius * 100);
          camera.userData.minDistance = Math.max(0.05, radius * 0.003);
          camera.userData.maxDistance = Math.max(500, radius * 120);
          camera.updateProjectionMatrix();
          camera.lookAt(target);
          const gridScale = clamp(Math.max(size.x,size.z,radius) / 250, 0.05, 10000);
          grid.scale.setScalar(gridScale);
          grid.position.set(center.x, bounds.min.y, center.z);
          axes.position.copy(center);
          axes.scale.setScalar(clamp(radius / 250, 0.05, 10000));
          cameraHasBeenFramed = true;
          const fallback=document.getElementById('sceneFallback');
          if(fallback) fallback.hidden=true;
          document.getElementById('sceneStatus').textContent = 'Model framed · ' + actors.filter(a=>a && !a.hidden && a.location).length + ' actors';
        }

        function setView(view){
          if(!worldBounds || worldBounds.isEmpty()){ fitAll(); return; }
          const center = worldBounds.getCenter(new THREE.Vector3());
          const currentDistance = Math.max(2, camera.position.distanceTo(target));
          let direction, up = new THREE.Vector3(0,1,0);
          if(view === 'top'){ direction = new THREE.Vector3(0,1,0); up.set(0,0,-1); }
          else if(view === 'front') direction = new THREE.Vector3(0,0,1);
          else if(view === 'side') direction = new THREE.Vector3(1,0,0);
          else if(view === 'back') direction = new THREE.Vector3(0,0,-1);
          else direction = new THREE.Vector3(1,0.82,1).normalize();
          target.copy(center); camera.up.copy(up);
          camera.position.copy(center).add(direction.normalize().multiplyScalar(currentDistance));
          camera.lookAt(target);
        }

        function safe(value){
          return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function renderList(){
          const filter = document.getElementById('sceneFilter').value;
          const rows = actors.filter(actor => filter === 'all' || actor.category === filter);
          document.getElementById('actorList').innerHTML = rows.slice(0,500).map(actor => {
            const p=actor.location, e=actor.bounds_extent;
            const location=p ? `${numberOr(p.x).toFixed(1)}, ${numberOr(p.y).toFixed(1)}, ${numberOr(p.z).toFixed(1)}` : '—';
            const extent=e ? `${numberOr(e.x).toFixed(1)}, ${numberOr(e.y).toFixed(1)}, ${numberOr(e.z).toFixed(1)}` : '—';
            return '<div class="actor-row"><b>'+safe(actor.name)+'</b> <span class="actor-meta">'+safe(actor.category)+' · '+safe(actor.class)+'</span><div class="actor-meta">Location: '+location+' cm · Bounds extent: '+extent+'</div></div>';
          }).join('') || 'No actors in this category.';
          const categories={}; for(const actor of actors) categories[actor.category]=(categories[actor.category]||0)+1;
          document.getElementById('sceneCounts').innerHTML=Object.entries(categories).map(([name,count])=>'<span class="pill">'+safe(name)+': '+count+'</span>').join('');
        }

        async function loadActualModel(version, forceFrame=false){
          const status=document.getElementById('sceneModelStatus');
          status.textContent='Loading actual Unreal geometry and materials…';
          try{
            const loader=new GLTFLoader();
            const gltf=await loader.loadAsync('/api/scene/model.glb?v='+encodeURIComponent(version));
            clearGroup();
            group.add(gltf.scene);
            gltf.scene.updateMatrixWorld(true);
            let meshCount=0, vertexCount=0;
            gltf.scene.traverse(object=>{
              if(object.isMesh){
                meshCount++;
                object.frustumCulled=false;
                if(object.geometry){
                  if(!object.geometry.boundingBox) object.geometry.computeBoundingBox();
                  if(!object.geometry.boundingSphere) object.geometry.computeBoundingSphere();
                  if(object.geometry.attributes?.position) vertexCount+=object.geometry.attributes.position.count;
                }
              }
              if(object.isMesh && object.material){
                const mats=Array.isArray(object.material)?object.material:[object.material];
                mats.forEach(m=>{
                  if(m.map) m.map.colorSpace=THREE.SRGBColorSpace;
                  m.side=THREE.DoubleSide;
                  m.needsUpdate=true;
                });
              }
            });
            if(meshCount===0 || vertexCount===0) throw new Error('The GLB contains no renderable mesh data. The active Unreal level may be empty.');
            modelBounds=new THREE.Box3().setFromObject(gltf.scene, true);
            const modelSize=modelBounds.getSize(new THREE.Vector3());
            if(modelBounds.isEmpty() || !Number.isFinite(modelSize.length()) || modelSize.length()<0.000001)
              throw new Error('The exported mesh has invalid or zero-size bounds; cannot frame it.');
            worldBounds=modelBounds.clone();
            loadedModelVersion=Number(version);
            cameraHasBeenFramed=false;
            fitAll();
            status.textContent='Actual Unreal model loaded · '+meshCount+' meshes · '+vertexCount.toLocaleString()+' vertices · GLB '+(Number(document.getElementById('sceneModelStatus').dataset.bytes||0)/1048576).toFixed(1)+' MB';
            document.getElementById('sceneStatus').textContent='Real geometry loaded · '+meshCount+' meshes';
          }catch(error){
            const fallback=document.getElementById('sceneFallback');
            if(fallback){fallback.hidden=false;fallback.textContent='3D model could not be displayed: '+error.message;}
            status.textContent='Could not load the actual model: '+error.message;
          }
        }

        async function pollSceneModel(){
          try{
            const response=await fetch('/api/scene/model/status',{cache:'no-store'});
            const state=await response.json();
            if(!response.ok) throw new Error(state.error||'Model status unavailable');
            if(state.status==='queued'||state.status==='running'){
              document.getElementById('sceneModelStatus').textContent='Unreal is exporting real meshes and supported materials…';
              modelPollTimer=setTimeout(pollSceneModel,2200); return;
            }
            modelExportBusy=false;
            if(state.status==='ready' && Number(state.version)!==loadedModelVersion){
              document.getElementById('sceneModelStatus').dataset.bytes=String(state.size||0);
              const shouldFrame=forceFrameAfterExport;
              forceFrameAfterExport=false;
              await loadActualModel(state.version,shouldFrame);
              if(modelExportPending){ modelExportPending=false; requestSceneModelExport(false); }
            }else if(state.status==='ready'){
              document.getElementById('sceneModelStatus').textContent='Actual Unreal model is up to date · '+(Number(state.size||0)/1048576).toFixed(1)+' MB';
              if(modelExportPending){ modelExportPending=false; requestSceneModelExport(false); }
            }else if(state.status==='failed'){
              const message='Model export failed: '+(state.error||'unknown error');
              document.getElementById('sceneModelStatus').textContent=message;
              const fallback=document.getElementById('sceneFallback');
              if(fallback){fallback.hidden=false;fallback.textContent=message;}
            }else{
              document.getElementById('sceneModelStatus').textContent='Waiting for the first actual scene export…';
            }
          }catch(error){
            modelExportBusy=false;
            document.getElementById('sceneModelStatus').textContent='Model status error: '+error.message;
          }
        }

        async function requestSceneModelExport(forceFrame=false){
          if(modelExportBusy){ modelExportPending=true; if(forceFrame) forceFrameAfterExport=true; return; }
          modelExportBusy=true; forceFrameAfterExport=forceFrame;
          document.getElementById('sceneModelStatus').textContent='Requesting full-fidelity GLB export from Unreal…';
          try{
            const response=await fetch('/api/scene/model/export',{method:'POST',cache:'no-store'});
            const payload=await response.json();
            if(!response.ok) throw new Error(payload.error||'Could not start the Unreal GLB export');
            if(modelPollTimer) clearTimeout(modelPollTimer);
            modelPollTimer=setTimeout(pollSceneModel,700);
          }catch(error){
            modelExportBusy=false;
            document.getElementById('sceneModelStatus').textContent='Could not start actual model export: '+error.message;
          }
        }

        function applyScenePayload(sceneData){
          if(!sceneData || !Array.isArray(sceneData.actors)) return false;
          const stamp=Number(sceneData.updated_at||sceneData.updated||0);
          const signature=JSON.stringify(sceneData.actors.map(a=>[a.object_name,a.class,a.hidden,a.location,a.rotation,a.scale,a.bounds_extent]));
          if(signature!==lastSceneSignature){
            renderActors(sceneData.actors);
            lastSceneSignature=signature;
            requestSceneModelExport(!cameraHasBeenFramed);
          }
          if(!stamp || stamp!==lastSceneTimestamp) lastSceneTimestamp=stamp;
          document.getElementById('sceneStatus').textContent=(sceneData.level||'Level')+' · '+(sceneData.count??sceneData.actors.length)+' actors · updated '+new Date((stamp||Date.now()/1000)*1000).toLocaleTimeString();
          return true;
        }

        async function pollSceneJob(){
          if(scenePollBusy||!activeSceneJob)return;
          scenePollBusy=true;
          try{
            const response=await fetch('/api/scene/status?job_id='+encodeURIComponent(activeSceneJob),{cache:'no-store'});
            const payload=await response.json();
            if(!response.ok)throw new Error(payload.error||'Scene job status unavailable');
            const job=payload.job||{};
            if(job.status==='completed'){
              applyScenePayload(payload.scene||job.scene);
              activeSceneJob='';
            }else if(job.status==='failed'){
              document.getElementById('sceneStatus').textContent='Scene scan failed: '+(job.error||'unknown error');
              activeSceneJob='';
            }else document.getElementById('sceneStatus').textContent='Scanning actor metadata… '+job.status;
          }catch(error){ document.getElementById('sceneStatus').textContent='Scene status error: '+error.message; }
          finally{scenePollBusy=false;}
        }

        async function refreshSceneSnapshot(force=false){
          const status=document.getElementById('sceneStatus'); status.textContent='Requesting Unreal scene metadata…';
          try{
            const response=await fetch('/api/scene/snapshot?refresh=1'+(force?'&force=1':''),{cache:'no-store'});
            const payload=await response.json();
            if(!response.ok||!payload.ok)throw new Error(payload.error||'Scene snapshot not ready');
            if(payload.scene)applyScenePayload(payload.scene);
            const request=payload.request||{},job=payload.job||{};
            activeSceneJob=request.job_id||job.job_id||'';
            if(activeSceneJob){status.textContent='Scene scan '+(request.status||job.status||'queued')+'…';pollSceneJob();}
            else if(payload.scene){status.textContent=(payload.scene.level||'Level')+' · '+(payload.scene.count??payload.scene.actors?.length??0)+' actors';}
          }catch(error){status.textContent='Scene query failed: '+error.message;}
        }

