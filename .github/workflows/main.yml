        def _temp_cleanup_candidates():
            roots = []
            for value in (os.environ.get('TEMP'), os.environ.get('TMP')):
                if not value:
                    continue
                try:
                    root = Path(value).resolve()
                    if not root.is_dir() or root == Path(root.anchor) or '\\windows' in str(root).lower():
                        continue
                    if root not in roots:
                        roots.append(root)
                except Exception:
                    continue
            cutoff = time.time() - WINDOWS_TEMP_AGE_HOURS * 3600
            rows, total_bytes, truncated = ([], 0, False)
            for root in roots:
                for current, directories, filenames in os.walk(root, topdown=True, followlinks=False):
                    current_path = Path(current)
                    safe_dirs = []
                    for dirname in directories:
                        child = current_path / dirname
                        try:
                            st = child.lstat()
                            if child.is_symlink() or getattr(st, 'st_file_attributes', 0) & 1024:
                                continue
                            safe_dirs.append(dirname)
                        except OSError:
                            continue
                    directories[:] = safe_dirs
                    for filename in filenames:
                        candidate = current_path / filename
                        try:
                            st = candidate.lstat()
                            if candidate.is_symlink() or getattr(st, 'st_file_attributes', 0) & 1024:
                                continue
                            if not candidate.is_file() or st.st_mtime >= cutoff:
                                continue
                            resolved = candidate.resolve()
                            if root not in resolved.parents:
                                continue
                            rows.append((candidate, int(st.st_size)))
                            total_bytes += int(st.st_size)
                            if len(rows) >= WINDOWS_TEMP_MAX_FILES:
                                truncated = True
                                return (rows, total_bytes, truncated)
                        except (OSError, PermissionError):
                            continue
            return (rows, total_bytes, truncated)
        
