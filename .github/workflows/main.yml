name: Windows 11 - UE 5.8 + RDP + noVNC + Cloudflare

"on":
  workflow_dispatch:

jobs:
  windows-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # CHECK DISKS AND SELECT A DRIVE OTHER THAN C:
      # ============================================================
      - name: Select Non-C Drive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Disks = @(Get-CimInstance Win32_LogicalDisk |
            Where-Object {
              $_.DriveType -eq 3 -and
              $_.DeviceID -ne "C:"
            } |
            Sort-Object @{
              Expression = {
                if ($_.DeviceID -eq "D:") { 0 } else { 1 }
              }
            }, @{
              Expression = { $_.FreeSpace }
              Descending = $true
            })

          if ($Disks.Count -eq 0) {
            throw "No drive other than C: is available."
          }

          $Drive = $Disks[0].DeviceID
          $Root = "$Drive\UE58"

          New-Item -ItemType Directory -Path $Root -Force |
            Out-Null

          "UE_ROOT=$Root" >> $env:GITHUB_ENV
          "UE_DRIVE=$Drive" >> $env:GITHUB_ENV

          Write-Host "Selected drive: $Drive"
          Get-CimInstance Win32_LogicalDisk |
            Format-Table DeviceID,
              @{N="FreeGB";E={[math]::Round($_.FreeSpace / 1GB, 2)}}

      # ============================================================
      # DOWNLOAD UE 5.8
      # ============================================================
      - name: Download UE 5.8 ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Url = "https://share.deepstorage.dev/3f202352cf587d5c212fe11e7ee96be8/UE_5.8.zip"
          $Zip = "$env:UE_ROOT\UE_5.8.zip"

          $Disk = Get-CimInstance Win32_LogicalDisk |
            Where-Object { $_.DeviceID -eq $env:UE_DRIVE }

          Write-Host ("Available before download: {0:N2} GB" -f
            ($Disk.FreeSpace / 1GB))

          # Download only to the selected non-C drive.
          curl.exe -L --fail --retry 5 --retry-delay 5 `
            "$Url" -o "$Zip"

          if ($LASTEXITCODE -ne 0) {
            throw "UE 5.8 download failed."
          }

          if (!(Test-Path $Zip)) {
            throw "ZIP file not found."
          }

          $Size = (Get-Item $Zip).Length
          Write-Host ("ZIP size: {0:N2} GB" -f ($Size / 1GB))

          if ($Size -lt 1GB) {
            throw "Downloaded file is unexpectedly small."
          }

      # ============================================================
      # EXTRACT UE 5.8 ON THE SAME NON-C DRIVE
      # ============================================================
      - name: Extract UE 5.8
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Zip = "$env:UE_ROOT\UE_5.8.zip"
          $Dest = "$env:UE_ROOT\Extracted"

          $Disk = Get-CimInstance Win32_LogicalDisk |
            Where-Object { $_.DeviceID -eq $env:UE_DRIVE }

          $ZipSize = (Get-Item $Zip).Length
          $Free = [double]$Disk.FreeSpace

          if ($Free -lt ($ZipSize * 2)) {
            throw "Insufficient space for ZIP plus extracted files."
          }

          New-Item -ItemType Directory -Path $Dest -Force |
            Out-Null

          # Expand-Archive may be unsuitable for very large archives.
          Expand-Archive -LiteralPath $Zip `
            -DestinationPath $Dest -Force

          Write-Host "Extraction completed:"
          Write-Host $Dest

          Get-ChildItem $Dest |
            Select-Object Name, FullName

      # ============================================================
      # CONFIGURE RDP
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Username = "runneradmin"
          $Password = "WindowsRDP#2025"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1 -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $Secure = ConvertTo-SecureString $Password `
            -AsPlainText -Force

          $User = Get-LocalUser -Name $Username `
            -ErrorAction SilentlyContinue

          if ($User) {
            Set-LocalUser -Name $Username -Password $Secure
          } else {
            New-LocalUser -Name $Username -Password $Secure `
              -PasswordNeverExpires -AccountNeverExpires
          }

          Add-LocalGroupMember -Group Administrators `
            -Member $Username -ErrorAction SilentlyContinue

          "RDP_USER=$Username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

      # ============================================================
      # INSTALL TIGHTVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Installer = "$env:TEMP\tightvnc.msi"
          $VncPassword = "MyVNC123"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" `
            -OutFile $Installer

          $Args = @(
            "/i"
            "`"$Installer`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$VncPassword"
          )

          $P = Start-Process msiexec.exe `
            -ArgumentList $Args -Wait -PassThru

          if ($P.ExitCode -ne 0) {
            throw "TightVNC installation failed: $($P.ExitCode)"
          }

      - name: Configure and Verify TightVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Reg = "HKLM:\SOFTWARE\TightVNC\Server"
          $Exe = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $Reg) -or !(Test-Path $Exe)) {
            throw "TightVNC installation is incomplete."
          }

          New-ItemProperty -Path $Reg -Name AcceptRfbConnections `
            -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $Reg -Name RfbPort `
            -PropertyType DWord -Value 5900 -Force | Out-Null
          New-ItemProperty -Path $Reg -Name UseVncAuthentication `
            -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $Reg -Name AllowLoopback `
            -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $Reg -Name LoopbackOnly `
            -PropertyType DWord -Value 0 -Force | Out-Null

          & $Exe -stop -silent 2>$null
          Start-Sleep 3
          & $Exe -start -silent 2>$null
          Start-Sleep 5

          $Service = Get-Service tvnserver -ErrorAction SilentlyContinue
          if ($Service -and $Service.Status -ne "Running") {
            Start-Service tvnserver
          }

          $Ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-NetConnection 127.0.0.1 -Port 5900 `
              -WarningAction SilentlyContinue).TcpTestSucceeded) {
              $Ready = $true
              break
            }
            Start-Sleep 2
          }

          if (!$Ready) {
            throw "TightVNC is not listening on port 5900."
          }

      # ============================================================
      # INSTALL NOVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          git clone --depth 1 `
            https://github.com/novnc/noVNC.git C:\noVNC

          if (!(Test-Path C:\noVNC\vnc.html)) {
            throw "noVNC installation failed."
          }

      # ============================================================
      # INSTALL PYTHON AND WEBSOCKIFY
      # ============================================================
      - name: Install websockify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
            $Installer = "$env:TEMP\python-installer.exe"

            Invoke-WebRequest `
              "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe" `
              -OutFile $Installer

            $P = Start-Process $Installer `
              -ArgumentList "/quiet InstallAllUsers=0 PrependPath=1" `
              -Wait -PassThru

            if ($P.ExitCode -ne 0) {
              throw "Python installation failed."
            }

            $env:Path += ";$env:LocalAppData\Programs\Python\Python312;$env:LocalAppData\Programs\Python\Python312\Scripts"
          }

          $Python = Get-Command python.exe -ErrorAction SilentlyContinue

          if (!$Python) {
            throw "Python executable not found."
          }

          & $Python.Source -m pip install websockify

          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          $Scripts = Join-Path (Split-Path $Python.Source) "Scripts"
          $Websockify = Join-Path $Scripts "websockify.exe"

          if (!(Test-Path $Websockify)) {
            $Cmd = Get-Command websockify.exe -ErrorAction SilentlyContinue
            if (!$Cmd) {
              throw "websockify.exe not found."
            }
            $Websockify = $Cmd.Source
          }

          "WEBSOCKIFY_EXE=$Websockify" >> $env:GITHUB_ENV

      # ============================================================
      # INSTALL CLOUDFLARED
      # ============================================================
      - name: Install cloudflared
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile C:\cloudflared.exe

          & C:\cloudflared.exe version

      # ============================================================
      # START NOVNC AND CLOUDFLARE
      # ============================================================
      - name: Start noVNC + Cloudflare and Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $WebLog = "C:\websockify.log"
          $WebErr = "C:\websockify-error.log"
          $CfLog = "C:\cloudflared.log"
          $CfErr = "C:\cloudflared-error.log"

          $Web = Start-Process `
            -FilePath $env:WEBSOCKIFY_EXE `
            -ArgumentList @(
              "--web", "C:\noVNC",
              "--verbose",
              "0.0.0.0:6080",
              "127.0.0.1:5900"
            ) `
            -RedirectStandardOutput $WebLog `
            -RedirectStandardError $WebErr `
            -WindowStyle Hidden -PassThru

          $Ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 2

            if ($Web.HasExited) {
              Get-Content $WebErr -ErrorAction SilentlyContinue
              throw "websockify stopped."
            }

            if ((Test-NetConnection 127.0.0.1 -Port 6080 `
              -WarningAction SilentlyContinue).TcpTestSucceeded) {
              $Ready = $true
              break
            }
          }

          if (!$Ready) {
            throw "noVNC web server did not start."
          }

          $Cloud = Start-Process `
            -FilePath C:\cloudflared.exe `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--protocol", "auto",
              "--edge-ip-version", "4",
              "--logfile", $CfLog,
              "--loglevel", "info",
              "--url", "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput "C:\cloudflared-stdout.log" `
            -RedirectStandardError $CfErr `
            -WindowStyle Hidden -PassThru

          $TunnelUrl = $null

          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 2

            if ($Cloud.HasExited) {
              Get-Content $CfErr -ErrorAction SilentlyContinue
              throw "Cloudflare tunnel stopped."
            }

            $Text = ""
            foreach ($File in @(
              $CfLog,
              $CfErr,
              "C:\cloudflared-stdout.log"
            )) {
              if (Test-Path $File) {
                $Text += "`n" + (Get-Content $File -Raw `
                  -ErrorAction SilentlyContinue)
              }
            }

            $M = [regex]::Match(
              $Text,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($M.Success) {
              $TunnelUrl = $M.Value
              break
            }
          }

          if (!$TunnelUrl) {
            Get-Content $CfLog -Tail 100 -ErrorAction SilentlyContinue
            throw "Could not obtain Cloudflare tunnel URL."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "UE ROOT: $env:UE_ROOT"
          Write-Host "EXTRACTED: $env:UE_ROOT\Extracted"
          Write-Host "noVNC URL: $TunnelUrl/vnc.html"
          Write-Host "VNC PASSWORD: MyVNC123"
          Write-Host "RDP USER: runneradmin"
          Write-Host "RDP PASSWORD: WindowsRDP#2025"
          Write-Host "=============================================="

          while ($true) {
            Start-Sleep -Seconds 30

            if ($Web.HasExited) {
              throw "websockify stopped unexpectedly."
            }

            if ($Cloud.HasExited) {
              throw "Cloudflare tunnel stopped unexpectedly."
            }

            Write-Host "[$(Get-Date)] Runner and tunnel active."
          }
