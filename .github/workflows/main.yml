        CURRENT_PROJECT_FILE = (ROOT / "UEControl" / "UEControl.uproject").resolve()
        CONTROL_DIR = ROOT / "control"
        BACKUP_DIR = ROOT / "Backups"
        BUILD_DIR = ROOT / "Builds"
        CONFIG_DIR = ROOT / "Config"
        for _folder in (CONTROL_DIR, BACKUP_DIR, BUILD_DIR, CONFIG_DIR):
            _folder.mkdir(parents=True, exist_ok=True)
        EDITOR_COMMAND_FILE = CONTROL_DIR / "editor-command.json"
        MCP_REGISTRY_FILE = CONFIG_DIR / "mcp_servers.json"
        SCENE_CACHE = {"updated": 0.0, "level": "", "actors": [], "error": ""}
