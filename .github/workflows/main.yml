name: Unreal Engine 5.8 Remote Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Validate Secrets and Prepare Folders
        shell: pwsh
        env:
          COMMAND_TOKEN: ${{ secrets.COMMAND_TOKEN }}
          GG_UE_TOKEN: ${{ secrets.GG_UE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (!$env:COMMAND_TOKEN) {
            throw "Missing COMMAND_TOKEN secret"
          }

          if (!$env:GG_UE_TOKEN) {
            throw "Missing GG_UE_TOKEN secret"
          }

          $root = "D:\UE58"

          @(
            $root,
            "$root\Extracted",
            "$root\Projects",
            "$root\Uploads",
            "$root\Screenshots",
            "$root\Logs",
            "$root\UEControl",
            "$root\UEControl\Content\Python"
          ) | ForEach-Object {
            New-Item -ItemType Directory -Path $_ -Force | Out-Null
          }

          "UE_ROOT=$root" >> $env:GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask google-api-python-client google-auth

      - name: Download Unreal Engine Release Parts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:UE_ROOT

          gh release download ue5.8 `
            --repo forgotenmywin/Windows_with_no_vnc `
            --pattern "UE_5.8.zip.*" `
            --dir $root

          if ($LASTEXITCODE -ne 0) {
            throw "Could not download Unreal Engine release assets."
          }

          $parts = @(
            Get-ChildItem $root -File |
              Where-Object {
                $_.Name -match '^UE_5\.8\.zip\.\d+$'
              } |
              Sort-Object Name
          )

          if ($parts.Count -ne 8) {
            throw "Expected 8 ZIP parts, found $($parts.Count)."
          }

          $zip = "$root\UE_5.8.zip"
          $output = [System.IO.File]::Create($zip)

          try {
            foreach ($part in $parts) {
              Write-Host "Joining $($part.Name)"

              $inputStream = [System.IO.File]::OpenRead($part.FullName)

              try {
                $inputStream.CopyTo($output)
              }
              finally {
                $inputStream.Dispose()
              }
            }
          }
          finally {
            $output.Dispose()
          }

          if ((Get-Item $zip).Length -lt 1GB) {
            throw "Combined ZIP is unexpectedly small."
          }

          "UE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Extract Unreal Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:UE_ROOT
          $zip = $env:UE_ZIP

          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"

          if (!(Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress
            $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          }

          if (!(Test-Path $sevenZip)) {
            throw "7-Zip executable not found."
          }

          & $sevenZip t $zip

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP validation failed. Confirm the parts are raw sequential ZIP chunks."
          }

          & $sevenZip x $zip "-o$root\Extracted" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Unreal Engine extraction failed."
          }

          $editor = Get-ChildItem "$root\Extracted" `
            -Filter UnrealEditor.exe -Recurse -File |
            Select-Object -First 1

          if (!$editor) {
            throw "UnrealEditor.exe was not found."
          }

          "UE_EDITOR=$($editor.FullName)" >> $env:GITHUB_ENV

          Write-Host "Editor: $($editor.FullName)"

      - name: Create Unreal Control Project
        shell: pwsh
        run: |
          $project = "$env:UE_ROOT\UEControl"
          $uproject = "$project\UEControl.uproject"

          $data = @{
            FileVersion = 3
            EngineAssociation = ""
            Category = ""
            Description = "Remote Unreal Engine Control"
            Modules = @()
            Plugins = @(
              @{
                Name = "PythonScriptPlugin"
                Enabled = $true
              },
              @{
                Name = "EditorScriptingUtilities"
                Enabled = $true
              }
            )
          }

          $data |
            ConvertTo-Json -Depth 10 |
            Set-Content $uproject -Encoding utf8

      - name: Create Unreal Python Bridge
        shell: pwsh
        run: |
          $path = "$env:UE_ROOT\UEControl\Content\Python\init_unreal.py"

          @'
          import json
          import time
          import urllib.request
          import unreal

          API = "http://127.0.0.1:8765"
          TOKEN = __import__("os").environ.get("COMMAND_TOKEN", "")
          LAST_POLL = 0
          BUSY = False

          def api_request(path, payload=None):
              headers = {"Authorization": "Bearer " + TOKEN}
              data = None

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  API + path,
                  data=data,
                  headers=headers,
                  method="POST" if data is not None else "GET"
              )

              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.loads(response.read().decode("utf-8"))

          def execute_job(job):
              job_id = job["id"]
              code = job["code"]
              namespace = {"unreal": unreal, "RESULT": None}

              try:
                  exec(compile(code, "<remote-command>", "exec"),
                       namespace, namespace)

                  result = {
                      "ok": True,
                      "output": str(namespace.get("RESULT", "Command completed"))
                  }

              except Exception as exc:
                  result = {
                      "ok": False,
                      "error": str(exc)
                  }
                  unreal.log_error("Remote command error: " + str(exc))

              try:
                  api_request("/internal/result", {
                      "id": job_id,
                      "result": result
                  })
              except Exception as exc:
                  unreal.log_error("Could not return result: " + str(exc))

          def editor_tick(delta_seconds):
              global LAST_POLL, BUSY

              if BUSY or not TOKEN:
                  return

              now = time.time()

              if now - LAST_POLL < 0.5:
                  return

              LAST_POLL = now

              try:
                  response = api_request("/internal/next")
                  job = response.get("job")

                  if job:
                      BUSY = True
                      try:
                          execute_job(job)
                      finally:
                          BUSY = False

              except Exception:
                  # API may still be starting.
                  pass

          unreal.log("Remote Unreal Python bridge loaded.")
          unreal.register_slate_post_tick_callback(editor_tick)
          '@ | Set-Content $path -Encoding utf8

      - name: Create API Server
        shell: pwsh
        run: |
          $path = "$env:UE_ROOT\api_server.py"

          @'
          import os
          import io
          import json
          import uuid
          import time
          import queue
          import threading
          from pathlib import Path
          from functools import wraps

          from flask import Flask, request, jsonify, send_file
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload, MediaIoBaseDownload

          ROOT = Path(r"D:\UE58")
          PROJECTS = ROOT / "Projects"
          UPLOADS = ROOT / "Uploads"
          SCREENSHOTS = ROOT / "Screenshots"
          LOGS = ROOT / "Logs"

          for folder in (PROJECTS, UPLOADS, SCREENSHOTS, LOGS):
              folder.mkdir(parents=True, exist_ok=True)

          TOKEN = os.environ["COMMAND_TOKEN"]
          DRIVE_JSON = os.environ["GG_UE_TOKEN"]

          app = Flask(__name__)
          app.config["MAX_CONTENT_LENGTH"] = 20 * 1024 * 1024 * 1024

          jobs = {}
          job_queue = queue.Queue()
          lock = threading.Lock()

          def auth(fn):
              @wraps(fn)
              def wrapper(*args, **kwargs):
                  if request.headers.get("Authorization") != "Bearer " + TOKEN:
                      return jsonify({"ok": False, "error": "Unauthorized"}), 401
                  return fn(*args, **kwargs)
              return wrapper

          def drive():
              info = json.loads(DRIVE_JSON)
              credentials = service_account.Credentials.from_service_account_info(
                  info,
                  scopes=["https://www.googleapis.com/auth/drive"]
              )
              return build(
                  "drive", "v3",
                  credentials=credentials,
                  cache_discovery=False
              )

          def submit_command(code, timeout=240):
              job_id = str(uuid.uuid4())

              with lock:
                  jobs[job_id] = {"done": False}

              job_queue.put({"id": job_id, "code": code})
              deadline = time.time() + timeout

              while time.time() < deadline:
                  with lock:
                      job = jobs.get(job_id)
                      if job and job.get("done"):
                          return job["result"]
                  time.sleep(0.25)

              return {"ok": False, "error": "Command timed out"}

          @app.get("/health")
          @auth
          def health():
              return jsonify({
                  "ok": True,
                  "service": "Unreal Remote API",
                  "time": time.time()
              })

          @app.post("/command")
          @auth
          def command():
              body = request.get_json(silent=True) or {}
              code = body.get("code")

              if not isinstance(code, str) or not code.strip():
                  return jsonify({"ok": False, "error": "Provide code"}), 400

              timeout = min(max(int(body.get("timeout", 240)), 1), 240)
              return jsonify(submit_command(code, timeout))

          @app.get("/internal/next")
          def internal_next():
              if request.headers.get("Authorization") != "Bearer " + TOKEN:
                  return jsonify({"error": "Unauthorized"}), 401

              try:
                  return jsonify({"job": job_queue.get_nowait()})
              except queue.Empty:
                  return jsonify({"job": None})

          @app.post("/internal/result")
          def internal_result():
              if request.headers.get("Authorization") != "Bearer " + TOKEN:
                  return jsonify({"error": "Unauthorized"}), 401

              body = request.get_json(silent=True) or {}
              job_id = body.get("id")

              with lock:
                  if job_id in jobs:
                      jobs[job_id] = {
                          "done": True,
                          "result": body.get("result", {})
                      }

              return jsonify({"ok": True})

          @app.get("/projects")
          @auth
          def projects():
              found = []

              for project in ROOT.rglob("*.uproject"):
                  found.append({
                      "name": project.stem,
                      "project_file": str(project),
                      "directory": str(project.parent)
                  })

              return jsonify({"ok": True, "projects": found})

          @app.post("/files/upload")
          @auth
          def upload_file():
              file = request.files.get("file")

              if file is None:
                  return jsonify({"ok": False, "error": "Missing file"}), 400

              filename = Path(file.filename or "upload.bin").name
              destination = UPLOADS / filename
              file.save(destination)

              return jsonify({
                  "ok": True,
                  "filename": filename,
                  "path": str(destination),
                  "size": destination.stat().st_size
              })

          @app.get("/files/download")
          @auth
          def download_file():
              path = Path(request.args.get("path", ""))

              if not path.is_absolute() or not path.is_file():
                  return jsonify({"ok": False, "error": "File not found"}), 404

              return send_file(path, as_attachment=True)

          @app.post("/drive/list")
          @auth
          def drive_list():
              body = request.get_json(silent=True) or {}
              folder_id = body.get("folder_id", "root")

              result = drive().files().list(
                  q="'" + folder_id.replace("'", "\\'") + "' in parents and trashed = false",
                  pageSize=min(max(int(body.get("page_size", 100)), 1), 1000),
                  fields="files(id,name,mimeType,size,webViewLink,modifiedTime)"
              ).execute()

              return jsonify({"ok": True, "files": result.get("files", [])})

          @app.post("/drive/download")
          @auth
          def drive_download():
              body = request.get_json(silent=True) or {}
              file_id = body.get("file_id")
              destination = body.get("destination")

              if not file_id or not destination:
                  return jsonify({
                      "ok": False,
                      "error": "Provide file_id and destination"
                  }), 400

              path = Path(destination)

              if not path.is_absolute():
                  return jsonify({"ok": False, "error": "Absolute path required"}), 400

              path.parent.mkdir(parents=True, exist_ok=True)
              service = drive()

              metadata = service.files().get(
                  fileId=file_id,
                  fields="id,name,mimeType"
              ).execute()

              media = service.files().get_media(fileId=file_id)

              with open(path, "wb") as stream:
                  downloader = MediaIoBaseDownload(stream, media)
                  done = False

                  while not done:
                      _, done = downloader.next_chunk()

              return jsonify({
                  "ok": True,
                  "file_id": file_id,
                  "name": metadata.get("name"),
                  "path": str(path),
                  "size": path.stat().st_size
              })

          @app.post("/drive/upload")
          @auth
          def drive_upload():
              body = request.get_json(silent=True) or {}
              source = Path(body.get("source", ""))

              if not source.is_absolute() or not source.is_file():
                  return jsonify({"ok": False, "error": "Source file not found"}), 404

              metadata = {
                  "name": Path(body.get("filename") or source.name).name
              }

              folder_id = body.get("drive_folder_id")
              if folder_id:
                  metadata["parents"] = [folder_id]

              media = MediaFileUpload(
                  str(source),
                  resumable=True,
                  chunksize=8 * 1024 * 1024
              )

              result = drive().files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name,mimeType,webViewLink,size"
              ).execute()

              return jsonify({"ok": True, "file": result})

          @app.post("/unreal/screenshot")
          @auth
          def unreal_screenshot():
              code = (
                  "import unreal\n"
                  "unreal.SystemLibrary.execute_console_command("
                  "None, 'HighResShot 1920x1080')\n"
                  "RESULT = 'Screenshot command sent. Check the project Saved/Screenshots folder.'"
              )

              result = submit_command(code, 90)
              return jsonify({
                  "ok": result.get("ok", False),
                  "result": result,
                  "note": "The screenshot is written by Unreal to its screenshot output directory."
              })

          @app.get("/logs")
          @auth
          def logs():
              files = list(LOGS.glob("*.log"))

              if not files:
                  return jsonify({"ok": True, "logs": []})

              newest = max(files, key=lambda item: item.stat().st_mtime)
              return send_file(newest, as_attachment=True)

          @app.post("/projects/rename")
          @auth
          def rename_project():
              body = request.get_json(silent=True) or {}
              project_file = Path(body.get("project_file", ""))
              new_name = body.get("new_name", "")

              if not project_file.is_absolute() or not project_file.is_file():
                  return jsonify({"ok": False, "error": "Project file not found"}), 404

              if project_file.suffix.lower() != ".uproject":
                  return jsonify({"ok": False, "error": "Expected a .uproject file"}), 400

              if not new_name or Path(new_name).name != new_name:
                  return jsonify({"ok": False, "error": "Invalid new name"}), 400

              target = project_file.with_name(new_name + ".uproject")

              if target.exists():
                  return jsonify({"ok": False, "error": "Target already exists"}), 409

              project_file.rename(target)

              return jsonify({
                  "ok": True,
                  "project_file": str(target),
                  "note": "Renamed the .uproject file only."
              })

          if __name__ == "__main__":
              app.run(host="127.0.0.1", port=8765, threaded=True)
          '@ | Set-Content $path -Encoding utf8

      - name: Start API, Unreal and Cloudflare Tunnel
        shell: pwsh
        env:
          COMMAND_TOKEN: ${{ secrets.COMMAND_TOKEN }}
          GG_UE_TOKEN: ${{ secrets.GG_UE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:UE_ROOT

          # Child processes inherit these environment variables.
          $apiLog = "$root\Logs\api-out.log"
          $apiError = "$root\Logs\api-error.log"

          $api = Start-Process python `
            -ArgumentList "`"$root\api_server.py`"" `
            -PassThru `
            -RedirectStandardOutput $apiLog `
            -RedirectStandardError $apiError

          Start-Sleep -Seconds 3

          if ($api.HasExited) {
            Get-Content $apiError -ErrorAction SilentlyContinue
            throw "API failed to start."
          }

          $editorLog = "$root\Logs\unreal-editor.log"

          $editor = Start-Process $env:UE_EDITOR `
            -ArgumentList @(
              "$root\UEControl\UEControl.uproject",
              "-abslog=$editorLog",
              "-EnablePlugins=PythonScriptPlugin,EditorScriptingUtilities",
              "-AllowSoftwareRendering",
              "-d3d11"
            ) `
            -PassThru

          $cloudflared = "$root\cloudflared.exe"

          Invoke-WebRequest `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          $tunnelLog = "$root\Logs\cloudflared.log"
          $tunnelError = "$root\Logs\cloudflared-error.log"

          $tunnel = Start-Process $cloudflared `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:8765",
              "--no-autoupdate"
            ) `
            -PassThru `
            -RedirectStandardOutput $tunnelLog `
            -RedirectStandardError $tunnelError

          $publicUrl = $null

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2

            if ($tunnel.HasExited) {
              Get-Content $tunnelError -ErrorAction SilentlyContinue
              throw "Cloudflare tunnel exited."
            }

            $text = ""

            if (Test-Path $tunnelLog) {
              $text += Get-Content $tunnelLog -Raw
            }

            if (Test-Path $tunnelError) {
              $text += Get-Content $tunnelError -Raw
            }

            $match = [regex]::Match(
              $text,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {
              $publicUrl = $match.Value
              break
            }
          }

          if ($publicUrl) {
            Write-Host "PUBLIC_API_URL=$publicUrl"
            Write-Host "Use this URL from Termux."
          }
          else {
            Write-Host "Tunnel URL not found yet. Check cloudflared logs."
          }

          while ($true) {
            if ($api.HasExited) {
              throw "API server stopped."
            }

            if ($editor.HasExited) {
              throw "Unreal Editor stopped."
            }

            if ($tunnel.HasExited) {
              throw "Cloudflare tunnel stopped."
            }

            Start-Sleep -Seconds 30
          }
