        def _scene_model_export_worker(job_id):
            """Export the active Unreal world to a real, textured GLB without modifying the level."""
            temp_path = (SCENE_MODEL_DIR / ("scene_model_" + job_id + ".glb")).resolve()
            try:
                if not bridge_connected():
                    raise RuntimeError("Unreal Python Bridge is offline")
                unreal_path = str(temp_path).replace("\\", "/")
                code = r"""import json, os, unreal, traceback
        output_path = __OUTPUT_PATH__
        report = {"ok": False, "path": output_path, "error": ""}
        try:
            world = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()
            if world is None:
                raise RuntimeError("Unreal Editor has no active editor world")
            if not hasattr(unreal, "GLTFExporter") or not hasattr(unreal, "GLTFExportOptions"):
                raise RuntimeError("GLTFExporter is not loaded. Enable the GLTFExporter plugin and restart this project.")
            os.makedirs(os.path.dirname(output_path), exist_ok=True)
            if os.path.isfile(output_path):
                os.remove(output_path)
            options = unreal.GLTFExportOptions()
            # Bake material inputs using the mesh's UV/tangent data where the 5.8 exporter supports it.
            # This improves the appearance of many complex materials in the standalone GLB viewer.
            try:
                options.set_editor_property("bake_material_inputs", unreal.GLTFMaterialBakeMode.USE_MESH_DATA)
            except Exception as material_bake_error:
                print("GLTF material baking option unavailable; using exporter defaults: " + str(material_bake_error))
            # Keep Unreal's full scene geometry, actor transforms and supported material data.
            for property_name, property_value in (("export_lights", True), ("export_cameras", True),
                                                   ("export_vertex_colors", False), ("export_morph_targets", True)):
                try:
                    options.set_editor_property(property_name, property_value)
                except Exception:
                    pass
            raw_result = unreal.GLTFExporter.export_to_gltf(world, output_path, options, set())
            # UE's Python wrapper has exposed this call as either a bool/tuple or an
            # optional GLTFExportMessages struct depending on engine build. Do not treat
            # a successful None/empty message return as export failure; validate the
            # resulting GLB file and its actual mesh nodes below instead.
            export_messages = None
            if isinstance(raw_result, tuple):
                if raw_result and isinstance(raw_result[0], bool) and not raw_result[0]:
                    raise RuntimeError("Unreal GLTFExporter returned failure: " + str(raw_result))
                export_messages = raw_result[-1] if len(raw_result) > 1 else None
            elif isinstance(raw_result, bool):
                if not raw_result:
                    raise RuntimeError("Unreal GLTFExporter returned false")
            else:
                export_messages = raw_result
            export_errors = getattr(export_messages, "errors", None) if export_messages is not None else None
            if export_errors:
                raise RuntimeError("Unreal GLTFExporter errors: " + "; ".join(str(item) for item in export_errors)[:1600])
            if not os.path.isfile(output_path) or os.path.getsize(output_path) < 32:
                raise RuntimeError("GLTFExporter reported success but no valid GLB file was created")
            import struct
            with open(output_path, "rb") as stream:
                header = stream.read(12)
                if len(header) != 12:
                    raise RuntimeError("Exported GLB header is incomplete")
                magic, glb_version, total_length = struct.unpack("<4sII", header)
                if magic != b"glTF" or glb_version != 2 or total_length > os.path.getsize(output_path):
                    raise RuntimeError("Exported file is not a valid glTF 2.0 binary container")
                document = None
                offset = 12
                while offset + 8 <= total_length:
                    chunk_header = stream.read(8)
                    if len(chunk_header) != 8:
                        break
                    chunk_length, chunk_type = struct.unpack("<II", chunk_header)
                    chunk_data = stream.read(chunk_length)
                    if len(chunk_data) != chunk_length:
                        raise RuntimeError("GLB contains a truncated data chunk")
                    if chunk_type == 0x4E4F534A:
                        document = json.loads(chunk_data.decode("utf-8").rstrip(" \t\r\n\x00"))
                    offset += 8 + chunk_length
            if not isinstance(document, dict):
                raise RuntimeError("GLB has no JSON scene description")
            mesh_count = len(document.get("meshes", []))
            mesh_nodes = sum(1 for node in document.get("nodes", []) if "mesh" in node)
            if mesh_count < 1 or mesh_nodes < 1:
                raise RuntimeError("Unreal exported a GLB without any mesh nodes. Check that the active level contains visible Static Mesh actors.")
            report.update({"ok": True, "size": os.path.getsize(output_path),
                           "mesh_count": mesh_count, "mesh_nodes": mesh_nodes, "error": ""})
        except Exception as exc:
            report["error"] = str(exc)[:1800]
            report["traceback"] = traceback.format_exc()[-2500:]
        print("__UE_SCENE_GLB__" + json.dumps(report, ensure_ascii=False))"""
                code = code.replace("__OUTPUT_PATH__", repr(unreal_path))
                result, status = queue_unreal(code, timeout=300)
                deadline = time.monotonic() + 900
                while status == 202 and time.monotonic() < deadline:
                    result, status = wait_unreal_job(result.get("job_id", ""), timeout=60)
                if status == 202:
                    raise TimeoutError("Unreal GLB export is still running after 15 minutes")
                if status != 200 or not result.get("ok"):
                    raise RuntimeError(result.get("error") or result.get("message") or str(result))
                output = str(result.get("output", ""))
                marker = "__UE_SCENE_GLB__"
                line = next((item for item in output.splitlines() if marker in item), "")
                if not line:
                    raise RuntimeError("Unreal returned no GLB export report: " + output[-1200:])
                report = json.loads(line.split(marker, 1)[1])
                if not report.get("ok"):
                    raise RuntimeError(report.get("error") or "Unreal GLB export failed")
                if not temp_path.is_file() or temp_path.stat().st_size < 32:
                    raise RuntimeError("The exported GLB file is missing or empty")
                with temp_path.open("rb") as stream:
                    if stream.read(4) != b"glTF":
                        raise RuntimeError("The exported file is not a valid binary glTF (GLB)")
                size = temp_path.stat().st_size
                with SCENE_MODEL_LOCK:
                    previous = SCENE_MODEL_STATE.get("path", "")
                    SCENE_MODEL_STATE.update({"status": "ready", "job_id": job_id,
                                              "path": str(temp_path), "version": int(SCENE_MODEL_STATE.get("version", 0)) + 1,
                                              "updated": time.time(), "size": size, "error": ""})
                if previous and previous != str(temp_path):
                    try:
                        Path(previous).unlink(missing_ok=True)
                    except Exception:
                        pass
                log("Actual scene geometry exported: job=%s size=%s bytes meshes=%s nodes=%s" % (
                    job_id, size, report.get("mesh_count", 0), report.get("mesh_nodes", 0)))
            except Exception as exc:
                temp_path.unlink(missing_ok=True)
                with SCENE_MODEL_LOCK:
                    SCENE_MODEL_STATE.update({"status": "failed", "job_id": job_id, "error": str(exc)[:1800]})
                log("Actual scene geometry export failed: job=%s error=%s" % (job_id, repr(exc)))


