name: UE 5.8 Remote Studio - Bridge Auto-Recovery + Persistent Windows Runner
'on':
  workflow_dispatch:
    inputs:
      runner_mode:
        description: Persistent mode requires a registered Windows self-hosted runner with D:\UE58 storage and a named Cloudflare
          Tunnel.
        type: choice
        options:
        - self-hosted-persistent
        - github-hosted-test
        default: self-hosted-persistent
        required: true
permissions:
  contents: write
jobs:
  ue-remote:
    runs-on: ${{ inputs.runner_mode == 'github-hosted-test' && 'windows-latest' || fromJSON('["self-hosted","windows","x64"]')
      }}
    timeout-minutes: 1430
    steps:
    - name: Prepare D drive
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $root = ''D:\UE58''

        New-Item -ItemType Directory -Force -Path $root, "$root\parts", "$root\Logs", "$root\Projects", "$root\Screenshots",
        "$root\Uploads", "$root\Diagnostics", "$root\Tools" | Out-Null

        try { Start-Transcript -Path "$root\Logs\workflow-prepare-transcript.log" -Append -Force | Out-Null } catch { }

        $drive = Get-PSDrive D -ErrorAction SilentlyContinue

        if (-not $drive) { throw ''Drive D is not available on this runner.'' }

        Write-Host ("D: available space: {0:N2} GB" -f ($drive.Free / 1GB))

        "UE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        '
    - name: Download and extract Unreal Engine 5.8
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\ntry { Start-Transcript -Path \"$root\\Logs\\workflow-extract-transcript.log\"\
        \ -Append -Force | Out-Null } catch { }\n$partsDir = \"$root\\parts\"\n$archive = \"$root\\UE_5.8.zip\"\n$extract\
        \ = \"$root\\Extracted\"\n\ngh release download ue5.8 --repo forgotenmywin/Windows_with_no_vnc --pattern 'UE_5.8.zip.*'\
        \ --dir $partsDir --clobber\nif ($LASTEXITCODE -ne 0) { throw 'Could not download release assets UE_5.8.zip.*.' }\n\
        \n$parts = @(Get-ChildItem -LiteralPath $partsDir -File | Where-Object { $_.Name -like 'UE_5.8.zip.*' } | Sort-Object\
        \ Name)\nif ($parts.Count -lt 2) { throw \"Expected split ZIP parts; found $($parts.Count). Check release tag/assets.\"\
        \ }\n\nif (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }\n$destination = [System.IO.File]::Open($archive,\
        \ [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)\ntry {\n  $buffer =\
        \ New-Object byte[] (4MB)\n  foreach ($part in $parts) {\n    Write-Host (\"Joining {0} ({1:N2} GB)\" -f $part.Name,\
        \ ($part.Length / 1GB))\n    $source = [System.IO.File]::OpenRead($part.FullName)\n    try {\n      while (($read\
        \ = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {\n        $destination.Write($buffer, 0, $read)\n      }\n \
        \   }\n    finally { $source.Dispose() }\n  }\n}\nfinally { $destination.Dispose() }\n\n$sevenZip = (Get-Command 7z.exe\
        \ -ErrorAction SilentlyContinue).Source\nif (-not $sevenZip) {\n  $sevenZip = @('C:\\Program Files\\7-Zip\\7z.exe','C:\\\
        Program Files (x86)\\7-Zip\\7z.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1\n}\nif (-not $sevenZip)\
        \ {\n  choco install 7zip -y --no-progress\n  if ($LASTEXITCODE -ne 0) { throw '7-Zip installation failed.' }\n  $sevenZip\
        \ = 'C:\\Program Files\\7-Zip\\7z.exe'\n}\nif (-not (Test-Path -LiteralPath $sevenZip)) { throw '7z.exe was not found.'\
        \ }\n\n& $sevenZip t $archive\nif ($LASTEXITCODE -ne 0) { throw 'Joined ZIP failed integrity testing.' }\nif (Test-Path\
        \ -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }\nNew-Item -ItemType Directory -Force\
        \ -Path $extract | Out-Null\n& $sevenZip x $archive \"-o$extract\" -y\nif ($LASTEXITCODE -ne 0) { throw 'Unreal Engine\
        \ extraction failed.' }\n\n$editor = Get-ChildItem -LiteralPath $extract -Filter UnrealEditor.exe -File -Recurse -ErrorAction\
        \ SilentlyContinue |\n  Where-Object { $_.FullName -match '\\\\Engine\\\\Binaries\\\\Win64\\\\UnrealEditor\\.exe$'\
        \ } |\n  Select-Object -First 1\nif (-not $editor) { throw 'UnrealEditor.exe was not found.' }\nWrite-Host \"EDITOR_EXE=$($editor.FullName)\"\
        \n\"UE_EDITOR_EXE=$($editor.FullName)\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install native thread-stack diagnostic tools
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\n$toolsRoot = Join-Path $root 'Tools'\n$procDir = Join-Path\
        \ $toolsRoot 'ProcDump'\n$dbgDir = Join-Path $toolsRoot 'Debuggers'\nNew-Item -ItemType Directory -Force -Path $procDir,\
        \ $dbgDir, (Join-Path $root 'Symbols'), (Join-Path $root 'Diagnostics\\ThreadStacks') | Out-Null\n\n# ProcDump: Microsoft\
        \ Sysinternals signed release. Triage dumps preserve thread\n# contexts/stacks with much less memory content than\
        \ a full process dump.\n$procZip = Join-Path $procDir 'Procdump.zip'\n$procExe = Join-Path $procDir 'procdump64.exe'\n\
        if (-not (Test-Path -LiteralPath $procExe)) {\n  Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip'\
        \ -OutFile $procZip\n  Expand-Archive -LiteralPath $procZip -DestinationPath $procDir -Force\n}\nif (-not (Test-Path\
        \ -LiteralPath $procExe)) {\n  $candidate = Get-ChildItem -LiteralPath $procDir -Filter 'procdump64.exe' -File -Recurse\
        \ -ErrorAction SilentlyContinue | Select-Object -First 1\n  if ($candidate) { Copy-Item -LiteralPath $candidate.FullName\
        \ -Destination $procExe -Force }\n}\nif (-not (Test-Path -LiteralPath $procExe)) { throw 'PROCDUMP_INSTALL_FAILED:\
        \ procdump64.exe was not found after extraction.' }\n$procSignature = Get-AuthenticodeSignature -FilePath $procExe\n\
        if ($procSignature.Status -ne 'Valid') { throw \"PROCDUMP_SIGNATURE_INVALID: $($procSignature.Status)\" }\n\n# CDB\
        \ ships with the Windows SDK Debugging Tools component. GitHub's current\n# Windows Server 2025 x64 image normally\
        \ has this component; install the feature\n# from the cached SDK bundle if the image does not expose cdb.exe.\n$kitsRoot\
        \ = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\\10'\n$cdbSource = Join-Path $kitsRoot 'Debuggers\\x64\\cdb.exe'\n\
        if (-not (Test-Path -LiteralPath $cdbSource)) {\n  $sdkEntry = Get-ItemProperty 'HKLM:\\Software\\Wow6432Node\\Microsoft\\\
        Windows\\CurrentVersion\\Uninstall\\*' -ErrorAction SilentlyContinue |\n    Where-Object { $_.DisplayName -match 'Windows\
        \ Software Development Kit' -and $_.BundleCachePath -and (Test-Path -LiteralPath $_.BundleCachePath) } |\n    Sort-Object\
        \ DisplayVersion -Descending | Select-Object -First 1\n  if ($sdkEntry) {\n    Write-Host 'Installing Windows SDK\
        \ WindowsDesktopDebuggers feature...'\n    $installer = Start-Process -FilePath $sdkEntry.BundleCachePath -ArgumentList\
        \ @('/features','OptionId.WindowsDesktopDebuggers','/q','/norestart') -Wait -PassThru\n    Write-Host \"Windows SDK\
        \ debugger feature installer exit code: $($installer.ExitCode)\"\n  }\n}\nif (-not (Test-Path -LiteralPath $cdbSource))\
        \ {\n  $found = Get-ChildItem -LiteralPath (Join-Path $kitsRoot 'Debuggers') -Filter 'cdb.exe' -File -Recurse -ErrorAction\
        \ SilentlyContinue |\n    Where-Object { $_.FullName -match '[\\\\/]x64[\\\\/]cdb\\.exe$' } | Select-Object -First\
        \ 1\n  if ($found) { $cdbSource = $found.FullName }\n}\nif (-not (Test-Path -LiteralPath $cdbSource)) {\n  throw 'CDB_INSTALL_FAILED:\
        \ Windows SDK Debugging Tools (x64 cdb.exe) are unavailable. Native thread stack extraction cannot be enabled.'\n\
        }\n$cdbSourceDir = Split-Path -Parent $cdbSource\nCopy-Item -Path (Join-Path $cdbSourceDir '*') -Destination $dbgDir\
        \ -Recurse -Force\n$cdbExe = Join-Path $dbgDir 'cdb.exe'\nif (-not (Test-Path -LiteralPath $cdbExe)) { throw 'CDB_COPY_FAILED:\
        \ cdb.exe was not staged into UE58 Tools.' }\n\n# Pass stable local paths to the API process in later workflow steps.\n\
        \"UE58_PROCDUMP=$procExe\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n\"UE58_CDB=$cdbExe\" | Out-File\
        \ -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n\"UE58_SYMBOL_CACHE=$root\\Symbols\" | Out-File -FilePath $env:GITHUB_ENV\
        \ -Append -Encoding utf8\nWrite-Host 'NATIVE_THREAD_STACK_TOOLS_READY=true'\nWrite-Host \"PROCDUMP=$procExe\"\nWrite-Host\
        \ \"CDB=$cdbExe\"\n"
