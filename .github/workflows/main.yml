
name: Unreal Engine 5.8 - Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal-engine:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            "D:\UE58\Parts", `
            "D:\UE58\Extracted", `
            "D:\UE58\Logs" | Out-Null

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Set RDP_PASSWORD in repository Actions secrets."
          }

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          Set-LocalUser -Name "runneradmin" -Password $password

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP service configured."

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Set VNC_PASSWORD in repository Actions secrets."
          }

          if ($env:VNC_PASSWORD.Length -gt 8) {
            throw "TightVNC password must be at most 8 characters."
          }

          $installer = "D:\UE58\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi" `
            -OutFile $installer

          $arguments = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=$env:VNC_PASSWORD"
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "TightVNC installation failed: $($process.ExitCode)"
          }

          $service = Get-Service |
            Where-Object {
              $_.Name -match "tvnserver"
            } |
            Select-Object -First 1

          if ($service) {
            Set-Service -Name $service.Name -StartupType Automatic
            Start-Service -Name $service.Name
          }

          Write-Host "TightVNC installation completed."

      - name: Install noVNC and websockify
        shell: pwsh
        run: |
          $base = "D:\UE58\noVNC"
          $zip = "D:\UE58\novnc.zip"
          $temp = "D:\UE58\novnc-temp"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.zip" `
            -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath $temp -Force

          $source = Get-ChildItem $temp -Directory |
            Where-Object { $_.Name -like "noVNC-*" } |
            Select-Object -First 1

          if (-not $source) {
            throw "Could not locate the extracted noVNC directory."
          }

          New-Item -ItemType Directory -Force -Path $base | Out-Null
          Copy-Item "$($source.FullName)\*" $base -Recurse -Force

          # Install websockify using the same Python selected by py.
          py -m pip install --upgrade pip
          py -m pip install websockify

          # Locate websockify.exe without depending on PATH.
          $scripts = (& py -c `
            "import sysconfig; print(sysconfig.get_path('scripts'))").Trim()

          $ws = Join-Path $scripts "websockify.exe"

          if (-not (Test-Path $ws)) {
            $pythonExe = (& py -c `
              "import sys; print(sys.executable)").Trim()

            $ws = Join-Path (Split-Path $pythonExe) `
              "Scripts\websockify.exe"
          }

          if (-not (Test-Path $ws)) {
            $ws = Get-ChildItem `
              "C:\hostedtoolcache\windows\Python" `
              -Filter "websockify.exe" `
              -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $ws -or -not (Test-Path $ws)) {
            throw "websockify.exe not found after installation."
          }

          Write-Host "Using websockify: $ws"

          $webLog = "D:\UE58\Logs\websockify.log"
          $webErr = "D:\UE58\Logs\websockify-error.log"

          $arguments = @(
            "--web"
            "`"$base`""
            "6080"
            "127.0.0.1:5900"
          ) -join " "

          $proc = Start-Process `
            -FilePath $ws `
            -ArgumentList $arguments `
            -WorkingDirectory $base `
            -RedirectStandardOutput $webLog `
            -RedirectStandardError $webErr `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 5

          if ($proc.HasExited) {
            Get-Content $webErr -ErrorAction SilentlyContinue
            throw "websockify exited unexpectedly."
          }

          Write-Host "noVNC/websockify is running on port 6080."

      - name: Start Cloudflare Tunnel
        shell: pwsh
        run: |
          $cloudflared = "D:\UE58\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          $outLog = "D:\UE58\Logs\cloudflared.log"
          $errLog = "D:\UE58\Logs\cloudflared-error.log"

          $proc = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:6080",
              "--no-autoupdate"
            ) `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog `
            -WindowStyle Hidden `
            -PassThru

          $url = $null

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2

            $logs = @()
            if (Test-Path $outLog) {
              $logs += Get-Content $outLog -Raw
            }
            if (Test-Path $errLog) {
              $logs += Get-Content $errLog -Raw
            }

            $match = [regex]::Match(
              ($logs -join "`n"),
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {
              $url = $match.Value
              break
            }

            if ($proc.HasExited) {
              break
            }
          }

          if (-not $url) {
            Write-Host "Cloudflare logs:"
            Get-Content $outLog -ErrorAction SilentlyContinue
            Get-Content $errLog -ErrorAction SilentlyContinue
            throw "Could not obtain the Cloudflare Tunnel URL."
          }

          "NOVNC_URL=$url/vnc.html?autoconnect=true&resize=scale" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host ""
          Write-Host "========================================"
          Write-Host "noVNC URL: $url/vnc.html?autoconnect=true&resize=scale"
          Write-Host "========================================"
          Write-Host "Keep this URL private."

      - name: Download the 8 ZIP parts from GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = "forgotenmywin/Windows_with_no_vnc"
          $tag = "ue5.8"
          $partsDir = "D:\UE58\Parts"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            Accept = "application/vnd.github+json"
          }

          $releaseUrl = "https://api.github.com/repos/$repo/releases/tags/$tag"

          $release = Invoke-RestMethod `
            -Uri $releaseUrl `
            -Headers $headers

          $expectedNames = 1..8 | ForEach-Object {
            "UE_5.8.zip.{0:D3}" -f $_
          }

          foreach ($name in $expectedNames) {
            $asset = $release.assets |
              Where-Object { $_.name -eq $name } |
              Select-Object -First 1

            if (-not $asset) {
              throw "Missing release asset: $name"
            }

            $destination = Join-Path $partsDir $name

            Write-Host "Downloading $name ($($asset.size) bytes)..."

            & curl.exe `
              --fail `
              --location `
              --retry 5 `
              --retry-delay 3 `
              --retry-all-errors `
              --output $destination `
              $asset.browser_download_url

            if ($LASTEXITCODE -ne 0) {
              throw "Download failed: $name (curl exit $LASTEXITCODE)"
            }

            $actualSize = (Get-Item $destination).Length

            if ($actualSize -ne [long]$asset.size) {
              throw "Size mismatch for $name. Expected $($asset.size), got $actualSize"
            }

            Write-Host "Verified $name : $actualSize bytes"
          }

      - name: Reconstruct and verify UE_5.8.zip
        shell: pwsh
        run: |
          $parts = "D:\UE58\Parts"
          $zip = "D:\UE58\UE_5.8.zip"

          $ordered = 1..8 | ForEach-Object {
            Join-Path $parts ("UE_5.8.zip.{0:D3}" -f $_)
          }

          foreach ($part in $ordered) {
            if (-not (Test-Path $part)) {
              throw "Part is missing: $part"
            }
          }

          $copyArgs = @("/d", "/c", "copy", "/b")
          $joined = ($ordered | ForEach-Object {
            '"' + $_ + '"'
          }) -join "+"

          $command = "copy /b $joined `"$zip`""

          Write-Host "Joining parts into the original ZIP..."
          & cmd.exe /d /c $command

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to join ZIP parts."
          }

          $file = Get-Item $zip
          Write-Host "Reconstructed ZIP size: $($file.Length) bytes"

          $stream = [System.IO.File]::OpenRead($zip)
          try {
            $signature = New-Object byte[] 4
            [void]$stream.Read($signature, 0, 4)
          }
          finally {
            $stream.Dispose()
          }

          $hex = [BitConverter]::ToString($signature)
          Write-Host "ZIP signature: $hex"

          if ($hex -ne "50-4B-03-04") {
            throw "Reconstructed file does not have a normal ZIP signature."
          }

      - name: Install 7-Zip and test archive
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          if (-not (Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw "Could not install 7-Zip."
            }
          }

          if (-not (Test-Path $sevenZip)) {
            throw "7z.exe was not found after installation."
          }

          & $sevenZip t "D:\UE58\UE_5.8.zip"

          if ($LASTEXITCODE -ne 0) {
            throw "Archive test failed. The ZIP may be incomplete or damaged."
          }

      - name: Extract Unreal Engine 5.8
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $zip = "D:\UE58\UE_5.8.zip"
          $destination = "D:\UE58\Extracted"

          Write-Host "Extracting Unreal Engine. This may take a long time..."

          & $sevenZip x $zip "-o$destination" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Unreal Engine extraction failed."
          }

          Write-Host "Extraction completed."

          Get-ChildItem $destination -Force |
            Select-Object Name, FullName

      - name: Keep runner alive
        if: always()
        shell: pwsh
        run: |
          Write-Host "Runner keepalive started."
          Write-Host "If extraction failed, inspect earlier steps and D:\UE58\Logs."

          while ($true) {
            $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            $vnc = Get-Process -Name "tvnserver" `
              -ErrorAction SilentlyContinue

            $ws = Get-Process -Name "websockify" `
              -ErrorAction SilentlyContinue

            $cf = Get-Process -Name "cloudflared" `
              -ErrorAction SilentlyContinue

            Write-Host "[$now] ACTIVE - VNC=$([bool]$vnc) websockify=$([bool]$ws) cloudflared=$([bool]$cf)"

            Start-Sleep -Seconds 60
          
