        <section id="opsPanel" style="grid-column:1/-1"><h2>System, Checkpoints & Packaging</h2><div class="ops-grid"><div><b>Windows runner status</b><div id="systemStats" class="diag">Loading system metrics…</div><div class="row"><button id="optimizeBtn">Optimize Unreal priority</button><button id="priorityRestoreBtn">Restore normal priority</button><button id="cpuHeadroomBtn">Limit Unreal to 75% CPU cores</button><button id="cpuRestoreBtn">Restore CPU affinity</button></div><div class="row"><button id="performanceModeBtn">Enable Windows high-performance mode</button><button id="restorePowerBtn">Restore previous power plan</button></div><div class="row"><button id="previewTempBtn">Preview old TEMP files</button><button id="cleanTempBtn">Clean old TEMP files</button><span id="windowsMaintenanceStatus" class="small muted">No maintenance action has run.</span></div><details><summary>Top Windows processes</summary><div id="processList" class="actor-list">Loading…</div></details><div class="small muted">Power mode changes only the active Windows power plan. TEMP cleanup is limited to files older than 48 hours in the current user's TEMP/TMP folders. CPU affinity is optional and reversible. No arbitrary process or Windows service is terminated.</div></div>
        <div><b>Project checkpoints</b><div class="row"><button id="saveAllBtn">Save changes now</button><button id="checkpointBtn">Create checkpoint ZIP</button><select id="checkpointSelect" style="min-width:240px"></select><button id="restoreBtn">Restore selected checkpoint</button></div><div id="checkpointStatus" class="small muted">Checkpoints exclude caches, Saved, Intermediate and Binaries.</div></div>
        <div><b>Windows x64 Shipping build</b><div class="row"><button id="packageBtn">Build & ZIP project</button><label>Release tag <input id="buildReleaseTag" value="ue5.8" maxlength="100" style="width:105px"></label><button id="publishPackageBtn" disabled>Publish ZIP to GitHub Release</button></div><div id="packageStatus" class="small muted">Requires a packageable project, valid maps/configuration and Windows build tools. May use significant CPU, RAM and disk.</div></div><div><b>Unreal Headless Python</b><div class="small muted">Runs UnrealEditor-Cmd.exe with -run=pythonscript and -nullrhi: no Editor UI and no rendering. For the currently open project, the Editor is saved/closed and can be restarted after the job.</div><label>Project file <input id="headlessProject" placeholder="D:\UE58\Projects\Project\Project.uproject" style="width:100%"></label><label>Optional map path <input id="headlessMap" placeholder="/Game/Maps/MyMap" style="width:100%"></label><textarea id="headlessScript" rows="7" style="width:100%;box-sizing:border-box;background:#0e131a;color:#e8edf5;border:1px solid #3b4654;border-radius:7px;padding:8px;font:12px/1.45 Consolas,monospace">import unreal
        print("UE version:", unreal.SystemLibrary.get_engine_version())
        print("Loaded assets can be inspected or modified here.")</textarea><div class="row"><button id="headlessRunBtn">Run headless script</button><button id="headlessCancelBtn" disabled>Cancel job</button></div><div id="headlessStatus" class="small muted">No headless job running. Use unreal_execute_python for the live GUI Editor.</div><pre id="headlessLog" class="log-output" style="max-height:220px;white-space:pre-wrap">Headless stdout/stderr will appear here.</pre></div></div></section>
        <section id="mcpPanel" style="grid-column:1/-1"><h2>Additional Remote MCP Servers</h2><div class="small muted">Register external HTTPS Streamable-HTTP MCP servers. Supports no-auth or Bearer token; OAuth and local stdio servers are not supported by this gateway. Remote tool calls can change external data and require confirmation.</div>
        <div class="row mcp-form"><input id="mcpName" placeholder="Server name"><input id="mcpUrl" placeholder="https://mcp.example.com/mcp" style="min-width:300px"><input id="mcpToken" type="password" placeholder="Bearer token (optional)" style="min-width:220px"><button id="addMcpBtn">Add MCP server</button><button id="refreshMcpBtn">Refresh</button></div><div id="mcpServers" class="actor-list">No remote MCP servers registered.</div><div id="mcpStatus" class="small muted"></div></section>
        <section id="logsPanel" style="grid-column:1/-1"><div class="row" style="justify-content:space-between"><h2>Logs & Connection Diagnostics</h2><span class="muted small" id="logSummary">Loading system logs…</span></div>
        <div class="diag"><span class="pill" id="apiDiag">API: checking</span><span class="pill" id="bridgeDiag">Bridge: checking</span><span class="pill" id="mcpDiag">MCP: waiting for client</span><span class="pill" id="tunnelDiag">Tunnel: URL pending</span></div>
