                    "capture_error": MONITOR_STATE["capture_error"],
                    "image_version": int(MONITOR_STATE["image_version"]),
                    "has_image": bool(MONITOR_STATE["image_path"] and Path(MONITOR_STATE["image_path"]).is_file()),
                    "events": events,
                    "time": time.time()
                }
            return state

        def monitor_capture_worker():
            png_path = ROOT / "Screenshots" / "monitor_capture.png"
            jpg_path = ROOT / "Screenshots" / "monitor_latest.jpg"
            try:
                png_path.parent.mkdir(parents=True, exist_ok=True)
                png_path.unlink(missing_ok=True)
                target = str(png_path).replace("\\", "/")
                capture_console = "HighResShot 640x360 filename=" + chr(34) + target + chr(34)
                code = (
                    "import unreal\n"
                    "world = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()\n"
                    "unreal.SystemLibrary.execute_console_command(world, " + repr(capture_console) + ")\n"
                    "print('MONITOR_CAPTURE_REQUESTED')"
                )
                result, status = queue_unreal(code, 120)
                if status == 202 and result.get("job_id"):
                    result, status = wait_unreal_job(result["job_id"], timeout=120)
                if status != 200 or not result.get("ok"):
                    raise RuntimeError("Unreal capture command failed: " + str(result))
                deadline = time.time() + 25
                while time.time() < deadline and (not png_path.is_file() or png_path.stat().st_size == 0):
                    time.sleep(0.5)
                if not png_path.is_file() or png_path.stat().st_size == 0:
                    raise RuntimeError("Unreal did not create the monitor screenshot")
                from PIL import Image, ImageStat
                with Image.open(png_path) as source:
                    rgb = source.convert("RGB")
                    stats = ImageStat.Stat(rgb)
                    if max(stats.mean) < 2.0 or max(stats.stddev) < 1.0:
                        raise RuntimeError("Unreal viewport returned an almost-black screenshot. The scene viewer below uses the exported GLB and is independent of the viewport capture.")
                    rgb.thumbnail((640, 360))
                    rgb.save(jpg_path, format="JPEG", quality=62, optimize=True)
                png_path.unlink(missing_ok=True)
                with MONITOR_LOCK:
                    MONITOR_STATE["image_path"] = str(jpg_path)
                    MONITOR_STATE["image_version"] += 1
                    MONITOR_STATE["capture_error"] = ""
                    MONITOR_STATE["capture_running"] = False
                    MONITOR_STATE["capture_requested"] = bool(MONITOR_STATE["capture_again"])
                    MONITOR_STATE["capture_again"] = False
                log("Monitor screenshot updated: %s bytes" % jpg_path.stat().st_size)
            except Exception as exc:
                log("Monitor screenshot failed: " + repr(exc))
                with MONITOR_LOCK:
                    MONITOR_STATE["capture_error"] = str(exc)[:1000]
                    MONITOR_STATE["capture_running"] = False
                    MONITOR_STATE["capture_requested"] = False
                    MONITOR_STATE["capture_again"] = False

        @app.get("/monitor")
        @monitor_auth
        def monitor_page():
            request_monitor_capture()
            page = r'''<!doctype html>
