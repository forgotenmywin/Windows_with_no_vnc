        if ($apiText -notmatch 'queue_blueprint_save_until_bridge_returns' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_OFFLINE_QUEUE_UNTIL_WORKFLOW_TIMEOUT'\
        \ -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_LOW_LOAD_MODE=ACTIVE' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_LOW_LOAD_MODE=RESTORED'\
        \ -or\n    $apiText -notmatch 'bp_write_chunked_recovery_copy' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_CHUNKED_COPY_VERIFIED=true')\
        \ {\n  throw 'BLUEPRINT_SAVE_RECOVERY_VALIDATION_FAILED: offline queue, temporary low-load mode restoration,\
        \ and verified chunked recovery copy are required.'\n}\nWrite-Host 'EXPANDED_LOG_ACCESS_VALIDATION=true'\n\
        Write-Host 'MCP_RATE_LIMIT_RECOVERY_VALIDATION=true'\nif ($apiText -notmatch 'BLUEPRINT_MANUAL_PATH_CHECK_API'\
        \ -or\n    $apiText -notmatch \"@app.post\\('/api/blueprint/check-path'\\)\" -or\n    $apiText -notmatch\
        \ \"@app.get\\('/api/blueprint/check-path-status/<job_id>'\\)\" -or\n    $apiText -notmatch 'does_asset_exist'\
        \ -or $apiText -notmatch 'BLUEPRINT_PATH_CHECK_JSON' -or\n    $apiText -notmatch 'bpAssetPath' -or $apiText\
        \ -notmatch 'Check Asset' -or\n    $apiText -notmatch 'applyBlueprintPathToArgs') {\n  throw 'BLUEPRINT_MANUAL_PATH_CHECK_MISSING:\
