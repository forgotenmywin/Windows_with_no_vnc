        </style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body>
        <header><div><h1>Unreal Engine Live Monitor</h1><div class="muted small">Read-only view · no desktop streaming · low-frequency polling</div></div>
