        UE_ORIGINAL_AFFINITY = {}
        UE_CPU_LIMIT_DEFAULT = max(50, min(90, int(os.environ.get('UE_CPU_LIMIT_PERCENT', '75'))))
        
        def _set_unreal_cpu_affinity(enabled=True, percent=None):
            import psutil
            target = next((p for p in psutil.process_iter(['name']) if (p.info.get('name') or '').lower() == 'unrealeditor.exe'), None)
            if target is None:
                raise RuntimeError('UnrealEditor.exe is not running')
            current = list(target.cpu_affinity())
            total = len(current)
            if enabled:
                requested = UE_CPU_LIMIT_DEFAULT if percent is None else max(50, min(90, int(percent)))
                if total >= 2:
                    keep = max(1, min(total - 1, int(round(total * requested / 100.0))))
                else:
                    keep = total
                if target.pid not in UE_ORIGINAL_AFFINITY:
                    UE_ORIGINAL_AFFINITY[target.pid] = list(current)
                selected = current[:keep]
                target.cpu_affinity(selected)
                log('CPU headroom applied to Unreal: PID=%s affinity=%s/%s percent=%s' % (target.pid, len(selected), total, requested))
                return {'ok': True, 'pid': target.pid, 'enabled': True, 'affinity': selected, 'logical_cpus': total, 'reserved_logical_cpus': total - len(selected), 'percent_target': requested, 'warning': 'Unreal has fewer CPU cores available; shader compilation and packaging may take longer.'}
            original = UE_ORIGINAL_AFFINITY.pop(target.pid, None)
            if original:
                target.cpu_affinity(original)
                log('Original Unreal CPU affinity restored: PID=%s affinity=%s' % (target.pid, original))
                return {'ok': True, 'pid': target.pid, 'enabled': False, 'affinity': original, 'logical_cpus': total, 'restored': True}
            return {'ok': True, 'pid': target.pid, 'enabled': False, 'affinity': current, 'logical_cpus': total, 'restored': False, 'message': 'No saved original affinity for this Unreal process; current affinity left unchanged.'}
        
