        def _start_three_d_export(export_format, scope):
            export_format = str(export_format or '').lower().strip()
            scope = str(scope or 'level').lower().strip()
            if export_format not in ('glb', 'gltf'):
                raise ValueError('format must be glb or gltf')
            if scope not in ('level', 'selected'):
                raise ValueError('scope must be level or selected')
            if not bridge_connected():
                raise RuntimeError('Unreal Python Bridge is offline')
            with THREE_D_EXPORT_LOCK:
                running = next((row for row in THREE_D_EXPORT_JOBS.values() if row.get('status') in ('queued', 'running')), None)
                if running:
                    return {'ok': True, 'status': running.get('status'), 'job_id': running.get('job_id'), 'message': 'A 3D export is already running'}
                job_id = uuid.uuid4().hex
                THREE_D_EXPORT_JOBS[job_id] = {'job_id': job_id, 'status': 'queued', 'format': export_format, 'scope': scope, 'created_at': time.time(), 'progress': 0, 'phase': 'Queued', 'detail': 'Waiting for Unreal Editor', 'current_file': 'Unreal_Level.' + export_format, 'current_target': 'Waiting for active Unreal Level', 'targets': [], 'logs': [{'time': time.strftime('%H:%M:%S'), 'progress': 0, 'phase': 'Queued', 'message': '3D export request accepted; waiting for Unreal Editor'}], 'progress_estimated': False}
            threading.Thread(target=_three_d_export_worker, args=(job_id, export_format, scope), name='UE-3DExport-' + job_id[:8], daemon=True).start()
            log('3D_EXPORT_QUEUED job=%s format=%s scope=%s' % (job_id, export_format, scope))
            return {'ok': True, 'status': 'queued', 'job_id': job_id}
        
        @app.post('/api/3d/export')
        @monitor_auth
        def api_three_d_export():
            body = request.get_json(silent=True) or {}
            try:
                return (jsonify(_start_three_d_export(body.get('format', 'glb'), body.get('scope', 'level'))), 202)
            except Exception as exc:
                log('3D_EXPORT_REQUEST_FAILED error=%s' % repr(exc))
                return (jsonify(ok=False, error=str(exc)), 400)
        
