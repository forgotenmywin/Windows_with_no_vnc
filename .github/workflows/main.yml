        def api_three_d_file(job_id, filename):
            with THREE_D_EXPORT_LOCK:
                job = dict(THREE_D_EXPORT_JOBS.get(job_id, {}))
            if job.get('status') != 'completed':
                return (jsonify(ok=False, error='3d_export_not_ready'), 404)
            wanted = str(filename or '')
            allowed = {str(item.get('name', '')) for item in job.get('files') or []}
            if not wanted or wanted not in allowed or Path(wanted).name != wanted:
                return (jsonify(ok=False, error='3d_export_file_not_found'), 404)
            target = (Path(job['directory']).resolve() / wanted).resolve()
            base = Path(job['directory']).resolve()
            if target.parent != base or not target.is_file() or (not _inside_root(target)):
                return (jsonify(ok=False, error='3d_export_file_not_found'), 404)
            mime = {'.glb': 'model/gltf-binary', '.gltf': 'model/gltf+json', '.bin': 'application/octet-stream', '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.webp': 'image/webp', '.ktx2': 'image/ktx2', '.zip': 'application/zip'}.get(target.suffix.lower(), 'application/octet-stream')
            response = send_file(target, mimetype=mime, as_attachment=False, conditional=False, max_age=0)
            response.headers['Cache-Control'] = 'no-store, max-age=0'
            return response
        
