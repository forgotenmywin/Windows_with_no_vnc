name: Unreal Engine 5.8 - Windows RDP + noVNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal-engine:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            "D:\UE58\Parts", `
            "D:\UE58\Extracted", `
            "D:\UE58\Logs" | Out-Null

          Write-Host "Folders ready."

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Set RDP_PASSWORD in repository Actions secrets."
          }

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if ($null -ne $user) {
            Set-LocalUser -Name "runneradmin" -Password $securePassword
            $rdpUser = "runneradmin"
          }
          else {
            $user = Get-LocalUser -Name "ueadmin" `
              -ErrorAction SilentlyContinue

            if ($null -eq $user) {
              New-LocalUser `
                -Name "ueadmin" `
                -Password $securePassword `
                -AccountNeverExpires | Out-Null
            }
            else {
              Set-LocalUser -Name "ueadmin" -Password $securePassword
            }

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "ueadmin" `
              -ErrorAction SilentlyContinue

            $rdpUser = "ueadmin"
          }

          "RDP_USER=$rdpUser" |
            Set-Content "D:\UE58\Logs\rdp-user.txt"

          Restart-Service -Name TermService -Force

          Write-Host "RDP configured. Username: $rdpUser"

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Set VNC_PASSWORD in repository Actions secrets."
          }

          if ($env:VNC_PASSWORD.Length -gt 8) {
            throw "TightVNC password must be 8 characters or fewer."
          }

          $installer = "D:\UE58\tightvnc-installer.msi"
          $urls = @(
            "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi",
            "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          )

          $downloaded = $false

          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $installer
              $downloaded = $true
              break
            }
            catch {
              Write-Host "Download failed: $url"
            }
          }

          if (-not $downloaded) {
            throw "Could not download the TightVNC installer."
          }

          $arguments = @(
            "/i"
            "`"$installer`""
            "/qn"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$($env:VNC_PASSWORD)"
          ) -join " "

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "TightVNC installation failed: $($process.ExitCode)"
          }

          Set-Service -Name tvnserver -StartupType Automatic `
            -ErrorAction SilentlyContinue

          Start-Service -Name tvnserver -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          Get-Service -Name tvnserver -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

      - name: Download Unreal Engine ZIP parts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $owner = "forgotenmywin"
          $repo = "Windows_with_no_vnc"
          $tag = "ue5.8"

          $api = "https://api.github.com/repos/$owner/$repo/releases/tags/$tag"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod -Uri $api -Headers $headers

          $expected = @(
            "UE_5.8.zip.001",
            "UE_5.8.zip.002",
            "UE_5.8.zip.003",
            "UE_5.8.zip.004",
            "UE_5.8.zip.005",
            "UE_5.8.zip.006",
            "UE_5.8.zip.007",
            "UE_5.8.zip.008"
          )

          foreach ($name in $expected) {
            $asset = $release.assets |
              Where-Object { $_.name -eq $name } |
              Select-Object -First 1

            if ($null -eq $asset) {
              throw "Release asset missing: $name"
            }

            $destination = Join-Path "D:\UE58\Parts" $name

            Write-Host "Downloading $name ($($asset.size) bytes)"

            curl.exe -L `
              --fail `
              --retry 5 `
              --retry-delay 3 `
              -H "Authorization: Bearer $env:GH_TOKEN" `
              -H "Accept: application/octet-stream" `
              -o $destination `
              $asset.url

            if ($LASTEXITCODE -ne 0) {
              throw "Download failed: $name"
            }

            $actualSize = (Get-Item $destination).Length

            if ($actualSize -ne $asset.size) {
              throw "Size mismatch for $name. Expected $($asset.size), got $actualSize"
            }

            Write-Host "Verified $name : $actualSize bytes"
          }

      - name: Rebuild and test ZIP
        shell: pwsh
        run: |
          $output = "D:\UE58\UE_5.8.zip"

          if (Test-Path $output) {
            Remove-Item $output -Force
          }

          $parts = 1..8 | ForEach-Object {
            "D:\UE58\Parts\UE_5.8.zip.{0:D3}" -f $_
          }

          $stream = [System.IO.File]::Create($output)

          try {
            foreach ($part in $parts) {
              if (-not (Test-Path $part)) {
                throw "Missing part: $part"
              }

              Write-Host "Joining $part"
              $inputStream = [System.IO.File]::OpenRead($part)

              try {
                $inputStream.CopyTo($stream)
              }
              finally {
                $inputStream.Dispose()
              }
            }
          }
          finally {
            $stream.Dispose()
          }

          Write-Host "Rebuilt ZIP size: $((Get-Item $output).Length) bytes"

          $sevenZip = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          ) |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $sevenZip) {
            $installer = "D:\UE58\7zip-installer.exe"

            Invoke-WebRequest `
              -Uri "https://www.7-zip.org/a/7z2409-x64.exe" `
              -OutFile $installer

            Start-Process `
              -FilePath $installer `
              -ArgumentList "/S" `
              -Wait

            $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          }

          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip executable not found."
          }

          & $sevenZip t $output

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity test failed."
          }

          "SEVENZIP=$sevenZip" |
            Set-Content "D:\UE58\Logs\sevenzip.txt"

          Write-Host "ZIP integrity test passed."

      - name: Extract Unreal Engine
        shell: pwsh
        run: |
          $sevenZip = Get-Content "D:\UE58\Logs\sevenzip.txt" |
            ForEach-Object { $_ -replace '^SEVENZIP=', '' }

          $archive = "D:\UE58\UE_5.8.zip"
          $destination = "D:\UE58\Extracted"

          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          & $sevenZip x $archive "-o$destination" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Unreal Engine extraction failed."
          }

          Write-Host "Extraction completed."

          Get-ChildItem $destination -Force |
            Select-Object Name, FullName |
            Format-Table -AutoSize

      - name: Start Unreal Engine
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $pidFile = "D:\UE58\Logs\unreal-process.txt"
          $engineLog = "D:\UE58\Logs\unreal-headless.log"
          $stdoutLog = "D:\UE58\Logs\stdout.log"
          $stderrLog = "D:\UE58\Logs\stderr.log"

          "PID=0" | Set-Content $pidFile

          $root = "D:\UE58\Extracted"

          $engineFile = Get-ChildItem `
            -Path $root `
            -Filter "UnrealEditor-Cmd.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $engineFile) {
            $engineFile = Get-ChildItem `
              -Path $root `
              -Filter "UnrealEditor.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $engineFile) {
            Write-Host "Unreal executable was not found."
            Get-ChildItem $root -Force -ErrorAction SilentlyContinue |
              Select-Object Name, FullName |
              Format-Table -AutoSize
            exit 0
          }

          Write-Host "Engine executable: $engineFile"

          try {
            $engine = Start-Process `
              -FilePath $engineFile `
              -ArgumentList @(
                "-nullrhi",
                "-unattended",
                "-nop4",
                "-nosplash",
                "-stdout",
                "-FullStdOutLogOutput",
                "-log=$engineLog"
              ) `
              -RedirectStandardOutput $stdoutLog `
              -RedirectStandardError $stderrLog `
              -PassThru `
              -WindowStyle Hidden

            "PID=$($engine.Id)" | Set-Content $pidFile

            Write-Host "Started Unreal process PID=$($engine.Id)"
            Start-Sleep -Seconds 30

            if (Get-Process -Id $engine.Id -ErrorAction SilentlyContinue) {
              Write-Host "Unreal process is still running."
            }
            else {
              Write-Host "Unreal exited during startup."
              Get-Content $engineLog -Tail 100 -ErrorAction SilentlyContinue
              Get-Content $stdoutLog -Tail 50 -ErrorAction SilentlyContinue
              Get-Content $stderrLog -Tail 50 -ErrorAction SilentlyContinue
            }
          }
          catch {
            Write-Host "Failed to start Unreal: $_"
            $_ | Out-String |
              Set-Content "D:\UE58\Logs\unreal-start-error.log"
          }

      - name: Start noVNC and Cloudflare; keep runner alive
        if: always()
        shell: pwsh
        run: |
          $logDir = "D:\UE58\Logs"
          $noVncDir = "D:\UE58\noVNC"
          $pidFile = "$logDir\unreal-process.txt"
          $engineLog = "$logDir\unreal-headless.log"
          $stdoutLog = "$logDir\stdout.log"
          $stderrLog = "$logDir\stderr.log"

          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          Write-Host "Preparing noVNC..."

          if (-not (Test-Path "$noVncDir\vnc.html")) {
            $zip = "D:\UE58\novnc.zip"

            Invoke-WebRequest `
              -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.zip" `
              -OutFile $zip

            Expand-Archive -Path $zip -DestinationPath "D:\UE58" -Force

            $sourceDir = "D:\UE58\noVNC-1.6.0"

            if (Test-Path $sourceDir) {
              New-Item -ItemType Directory -Force -Path $noVncDir | Out-Null
              Copy-Item "$sourceDir\*" $noVncDir -Recurse -Force
            }
          }

          if (-not (Test-Path "$noVncDir\vnc.html")) {
            throw "noVNC files are missing."
          }

          Write-Host "Installing/checking websockify..."

          py -m pip install websockify

          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          $scripts = (py -c "import sysconfig; print(sysconfig.get_path('scripts'))").Trim()
          $websockify = Join-Path $scripts "websockify.exe"

          if (-not (Test-Path $websockify)) {
            throw "websockify executable not found: $websockify"
          }

          Start-Service -Name tvnserver -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $vncPort = Get-NetTCPConnection `
            -LocalPort 5900 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $vncPort) {
            Write-Host "WARNING: Nothing is listening on VNC port 5900."
            Get-Service tvnserver -ErrorAction SilentlyContinue |
              Format-Table -AutoSize
          }

          $wsProcess = Start-Process `
            -FilePath $websockify `
            -ArgumentList @(
              "--web", $noVncDir,
              "6080",
              "127.0.0.1:5900"
            ) `
            -RedirectStandardOutput "$logDir\websockify.log" `
            -RedirectStandardError "$logDir\websockify-error.log" `
            -PassThru `
            -WindowStyle Hidden

          "PID=$($wsProcess.Id)" |
            Set-Content "$logDir\websockify-process.txt"

          $websockifyReady = $false

          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1

            if (Get-NetTCPConnection `
              -LocalPort 6080 `
              -State Listen `
              -ErrorAction SilentlyContinue) {
              $websockifyReady = $true
              break
            }
          }

          if ($websockifyReady) {
            Write-Host "Websockify is listening on port 6080."
          }
          else {
            Write-Host "WARNING: Websockify is not listening on port 6080."
            Get-Content "$logDir\websockify-error.log" `
              -Tail 80 -ErrorAction SilentlyContinue
          }

          Write-Host "Starting temporary Cloudflare tunnel..."

          $cf = "D:\UE58\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cf

          $cfProcess = Start-Process `
            -FilePath $cf `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput "$logDir\cloudflared.log" `
            -RedirectStandardError "$logDir\cloudflared-error.log" `
            -PassThru `
            -WindowStyle Hidden

          "PID=$($cfProcess.Id)" |
            Set-Content "$logDir\cloudflared-process.txt"

          $tunnelUrl = $null

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2

            $cfLogs = @()

            $cfLogs += Get-Content "$logDir\cloudflared.log" `
              -ErrorAction SilentlyContinue

            $cfLogs += Get-Content "$logDir\cloudflared-error.log" `
              -ErrorAction SilentlyContinue

            $match = $cfLogs |
              Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' |
              Select-Object -Last 1

            if ($match) {
              $found = [regex]::Match(
                $match.Line,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              )

              if ($found.Success) {
                $tunnelUrl = $found.Value
                break
              }
            }

            if (-not (Get-Process -Id $cfProcess.Id -ErrorAction SilentlyContinue)) {
              Write-Host "WARNING: cloudflared exited during startup."
              break
            }
          }

          if ($tunnelUrl) {
            $url = "$tunnelUrl/vnc.html?autoconnect=true&resize=scale"

            Write-Host "=============================================="
            Write-Host "OPEN THIS noVNC URL:"
            Write-Host $url
            Write-Host "=============================================="

            $url | Set-Content "$logDir\novnc-url.txt"
          }
          else {
            Write-Host "Tunnel URL was not detected."
            Get-Content "$logDir\cloudflared.log" `
              -Tail 80 -ErrorAction SilentlyContinue
            Get-Content "$logDir\cloudflared-error.log" `
              -Tail 80 -ErrorAction SilentlyContinue
          }

          Write-Host "Monitor started. Runner will stay active until timeout."

          $exitReported = $false
          $urlReported = [bool]$tunnelUrl

          while ($true) {
            Start-Sleep -Seconds 30

            $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            $vncPort = [bool](Get-NetTCPConnection `
              -LocalPort 5900 `
              -State Listen `
              -ErrorAction SilentlyContinue)

            $webPort = [bool](Get-NetTCPConnection `
              -LocalPort 6080 `
              -State Listen `
              -ErrorAction SilentlyContinue)

            $cfAlive = [bool](Get-Process `
              -Id $cfProcess.Id `
              -ErrorAction SilentlyContinue)

            $engineState = "UNKNOWN"
            $enginePid = 0

            $pidLine = Get-Content $pidFile -ErrorAction SilentlyContinue

            if ($pidLine -match "PID=(\d+)") {
              $enginePid = [int]$Matches[1]

              if ($enginePid -gt 0) {
                $engineState = if (
                  Get-Process -Id $enginePid -ErrorAction SilentlyContinue
                ) {
                  "RUNNING"
                }
                else {
                  "STOPPED"
                }
              }
              else {
                $engineState = "NOT_STARTED"
              }
            }

            Write-Host "[$now] Unreal=$engineState | VNC5900=$vncPort | Websockify6080=$webPort | Cloudflare=$cfAlive"

            if (-not $urlReported) {
              $cfLogs = @()
              $cfLogs += Get-Content "$logDir\cloudflared.log" `
                -ErrorAction SilentlyContinue
              $cfLogs += Get-Content "$logDir\cloudflared-error.log" `
                -ErrorAction SilentlyContinue

              $match = $cfLogs |
                Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' |
                Select-Object -Last 1

              if ($match) {
                $found = [regex]::Match(
                  $match.Line,
                  'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
                )

                if ($found.Success) {
                  $url = "$($found.Value)/vnc.html?autoconnect=true&resize=scale"

                  Write-Host "noVNC URL: $url"
                  $url | Set-Content "$logDir\novnc-url.txt"
                  $urlReported = $true
                }
              }
            }

            if (
              ($engineState -eq "STOPPED" -or $engineState -eq "NOT_STARTED") `
              -and -not $exitReported
            ) {
              $exitReported = $true

              Write-Host "========== UNREAL STATUS/LOGS =========="
              Get-Content "$logDir\unreal-start-error.log" `
                -Tail 80 -ErrorAction SilentlyContinue
              Get-Content $engineLog -Tail 200 `
                -ErrorAction SilentlyContinue

              Write-Host "========== STDOUT =========="
              Get-Content $stdoutLog -Tail 100 `
                -ErrorAction SilentlyContinue

              Write-Host "========== STDERR =========="
              Get-Content $stderrLog -Tail 100 `
                -ErrorAction SilentlyContinue

              Write-Host "========== END ENGINE LOGS =========="
            }

            if (-not $webPort) {
              Write-Host "WARNING: Port 6080 is no longer listening."
              Get-Content "$logDir\websockify-error.log" `
                -Tail 30 -ErrorAction SilentlyContinue
            }

            if (-not $cfAlive) {
              Write-Host "WARNING: Cloudflare process has stopped."
              Get-Content "$logDir\cloudflared-error.log" `
                -Tail 30 -ErrorAction SilentlyContinue
            }
          }
