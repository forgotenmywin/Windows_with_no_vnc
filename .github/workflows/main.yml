name: Unreal Engine 5.8 - Windows noVNC Headless

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\UE58\Parts | Out-Null
          New-Item -ItemType Directory -Force D:\UE58\Extracted | Out-Null
          New-Item -ItemType Directory -Force D:\UE58\Logs | Out-Null

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) {
            throw "Set RDP_PASSWORD in GitHub Actions secrets."
          }

          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "runneradmin" -Password $secure
          } else {
            New-LocalUser -Name "ueadmin" -Password $secure -PasswordNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member "ueadmin"
          }

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if (-not $env:VNC_PASSWORD) {
            throw "Set VNC_PASSWORD in GitHub Actions secrets."
          }

          $installer = "$env:TEMP\tightvnc.msi"
          Invoke-WebRequest `
            "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi" `
            -OutFile $installer

          $vncPassword = $env:VNC_PASSWORD
          if ($vncPassword.Length -lt 6) {
            throw "VNC_PASSWORD must be at least 6 characters."
          }

          $args = @(
            "/i", $installer, "/qn", "/norestart",
            "ADDLOCAL=Server",
            "SERVER_REGISTER_AS_SERVICE=1",
            "SERVER_ADD_FIREWALL_EXCEPTION=1",
            "VALUE_OF_PASSWORD=$vncPassword",
            "VALUE_OF_PASSWORD_VNC=$vncPassword"
          )

          $process = Start-Process msiexec.exe `
            -ArgumentList $args -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "TightVNC installation failed: $($process.ExitCode)"
          }

          Get-Service *tvn* -ErrorAction SilentlyContinue |
            Start-Service -ErrorAction SilentlyContinue

      - name: Download Unreal Engine ZIP parts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $owner = "forgotenmywin"
          $repo = "Windows_with_no_vnc"
          $tag = "ue5.8"
          $partsDir = "D:\UE58\Parts"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            Accept = "application/vnd.github+json"
          }

          $releaseUrl = "https://api.github.com/repos/$owner/$repo/releases/tags/$tag"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers

          for ($i = 1; $i -le 8; $i++) {
            $name = "UE_5.8.zip.{0:D3}" -f $i
            $asset = $release.assets |
              Where-Object { $_.name -eq $name } |
              Select-Object -First 1

            if (-not $asset) {
              throw "Release asset not found: $name"
            }

            $destination = Join-Path $partsDir $name
            Write-Host "Downloading $name"

            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -Headers $headers `
              -OutFile $destination

            if ((Get-Item $destination).Length -ne $asset.size) {
              throw "File size mismatch: $name"
            }
          }

      - name: Join ZIP parts and test archive
        shell: pwsh
        run: |
          $partsDir = "D:\UE58\Parts"
          $zipPath = "D:\UE58\UE_5.8.zip"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          $output = [System.IO.File]::Open(
            $zipPath,
            [System.IO.FileMode]::CreateNew
          )

          try {
            for ($i = 1; $i -le 8; $i++) {
              $name = "UE_5.8.zip.{0:D3}" -f $i
              $path = Join-Path $partsDir $name

              if (-not (Test-Path $path)) {
                throw "Missing part: $name"
              }

              $input = [System.IO.File]::OpenRead($path)
              try {
                $input.CopyTo($output)
              } finally {
                $input.Dispose()
              }
            }
          } finally {
            $output.Dispose()
          }

          $sevenZip = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          ) | Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $sevenZip) {
            $sevenZip = "D:\UE58\7za.exe"
            Invoke-WebRequest `
              "https://www.7-zip.org/a/7zr.exe" `
              -OutFile $sevenZip
          }

          & $sevenZip t $zipPath
          if ($LASTEXITCODE -ne 0) {
            throw "ZIP archive test failed."
          }

      - name: Extract Unreal Engine
        shell: pwsh
        run: |
          $zipPath = "D:\UE58\UE_5.8.zip"
          $destination = "D:\UE58\Extracted"
          $sevenZip = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe",
            "D:\UE58\7za.exe"
          ) | Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $sevenZip) {
            throw "7-Zip executable not found."
          }

          & $sevenZip x $zipPath "-o$destination" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Unreal extraction failed."
          }

          $engine = Get-ChildItem $destination `
            -Filter UnrealEditor-Cmd.exe -Recurse -File |
            Select-Object -First 1

          if (-not $engine) {
            throw "UnrealEditor-Cmd.exe was not found after extraction."
          }

          $engine.FullName |
            Set-Content D:\UE58\Logs\engine-path.txt

          Write-Host "Found engine: $($engine.FullName)"

      - name: Start Unreal without rendering
        shell: pwsh
        run: |
          $engineFile = Get-Content D:\UE58\Logs\engine-path.txt
          $engineDir = Split-Path $engineFile -Parent
          $logFile = "D:\UE58\Logs\unreal-headless.log"

          Set-Location $engineDir

          Write-Host "Starting Unreal Engine with null rendering..."

          $process = Start-Process `
            -FilePath $engineFile `
            -ArgumentList @(
              "-nullrhi",
              "-unattended",
              "-nop4",
              "-nosplash",
              "-stdout",
              "-FullStdOutLogOutput",
              "-log=$logFile"
            ) `
            -RedirectStandardOutput "D:\UE58\Logs\stdout.log" `
            -RedirectStandardError "D:\UE58\Logs\stderr.log" `
            -PassThru

          Start-Sleep -Seconds 30

          if ($process.HasExited) {
            Write-Host "Unreal process exited with code $($process.ExitCode)"
            Get-Content $logFile -Tail 100 -ErrorAction SilentlyContinue
            throw "Unreal exited. Check the log above."
          }

          Write-Host "Unreal is running without rendering."
          Write-Host "PID: $($process.Id)"

      - name: Start noVNC and Cloudflare tunnel
        shell: pwsh
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          # Install noVNC/websockify
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) {
            throw "Python is not installed on the runner."
          }

          python -m pip install --upgrade pip
          python -m pip install websockify

          $noVncDir = "D:\UE58\noVNC"
          git clone --depth 1 https://github.com/novnc/noVNC.git $noVncDir

          $websockify = (Get-Command websockify).Source
          Start-Process -FilePath $python.Source `
            -ArgumentList @(
              "-m", "websockify",
              "--web", $noVncDir,
              "6080", "localhost:5900"
            ) `
            -RedirectStandardOutput "D:\UE58\Logs\novnc.log" `
            -RedirectStandardError "D:\UE58\Logs\novnc-error.log"

          if ($env:CF_TUNNEL_TOKEN) {
            $cloudflared = "D:\UE58\cloudflared.exe"
            Invoke-WebRequest `
              "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
              -OutFile $cloudflared

            Start-Process $cloudflared `
              -ArgumentList @("tunnel", "run", "--token", $env:CF_TUNNEL_TOKEN) `
              -RedirectStandardOutput "D:\UE58\Logs\cloudflared.log" `
              -RedirectStandardError "D:\UE58\Logs\cloudflared-error.log"
          } else {
            Write-Host "CF_TUNNEL_TOKEN not configured; Cloudflare tunnel skipped."
          }

          Write-Host "Runner is ready. Job remains alive until timeout."
          while ($true) {
            Start-Sleep -Seconds 60
            $p = Get-Process UnrealEditor-Cmd -ErrorAction SilentlyContinue
            if (-not $p) {
              Write-Host "UnrealEditor-Cmd is no longer running."
              Get-Content "D:\UE58\Logs\unreal-headless.log" -Tail 60 `
                -ErrorAction SilentlyContinue
            }
          }
