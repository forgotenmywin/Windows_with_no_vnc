        <script>
        const $=id=>document.getElementById(id);
        const pageMain=document.querySelector('main');
        const scenePanelFirst=document.getElementById('scenePanel');
        if(pageMain&&scenePanelFirst) pageMain.insertBefore(scenePanelFirst,pageMain.firstElementChild);
        let imageVersion=-1,captureBusy=false,logsBusy=false,lastLogText='';
        function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
        async function update(){try{const r=await fetch('/api/monitor/state',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json();
        $('bridge').textContent=s.bridge_connected?'Bridge connected':'Bridge offline';$('bridge').className='pill '+(s.bridge_connected?'green':'red');$('clock').textContent=new Date(s.time*1000).toLocaleTimeString();
        $('bridgeDiag').textContent=s.bridge_connected?'Bridge: connected':'Bridge: offline';$('bridgeDiag').className='pill '+(s.bridge_connected?'green':'red');
        $('apiDiag').textContent='API: responding';$('apiDiag').className='pill green';$('mcpAddress').textContent='MCP endpoint: '+(s.mcp_url||'not registered');
        const mc=s.mcp_connection||{};$('mcpDiag').textContent=mc.request_count?('MCP: '+mc.request_count+' requests · last '+(mc.last_method||'request')+' · HTTP '+(mc.last_status??'pending')):'MCP: no client request received';$('mcpDiag').className='pill '+(mc.request_count?'green':'muted');
        $('tunnelDiag').textContent=s.mcp_url?'Tunnel: public URL registered':'Tunnel: URL pending';$('tunnelDiag').className='pill '+(s.mcp_url?'green':'red');
        $('captureError').textContent=s.capture_error||'';$('shotInfo').textContent=s.capture_running?'Capturing…':(s.has_image?'Snapshot #'+s.image_version:'No snapshot yet');
        if(s.has_image&&s.image_version!==imageVersion){$('shot').src='/api/monitor/latest.jpg?v='+s.image_version;$('shot').hidden=false;$('empty').hidden=true;imageVersion=s.image_version;}
        if(s.capture_requested&&s.bridge_connected&&!captureBusy){captureBusy=true;fetch('/api/monitor/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}).catch(()=>{}).finally(()=>{captureBusy=false;});}
        const box=$('events');if(!s.events.length){box.innerHTML='<div class="muted">Waiting for MCP tool calls…</div>';}else{box.innerHTML=s.events.map(e=>`<article class="event"><div class="eventtop"><span class="tool">${esc(e.tool)}</span><span class="status">${esc(e.status)}${e.http_status?' · HTTP '+e.http_status:''}</span></div><div class="muted small">${new Date(e.time*1000).toLocaleString()}${e.duration_ms?' · '+e.duration_ms+' ms':''}</div><pre>${esc(JSON.stringify(e.arguments,null,2))}</pre>${e.result_preview?'<pre>Result: '+esc(e.result_preview)+'</pre>':''}${e.error?'<div class="red small">'+esc(e.error)+'</div>':''}</article>`).join('');}
        }catch(e){$('bridge').textContent='Monitor API unavailable: '+e.message;$('bridge').className='pill red';}}
        async function updateLogs(){if(logsBusy)return;logsBusy=true;try{const params=new URLSearchParams({source:$('logSource').value,level:$('logLevel').value,q:$('logSearch').value,limit:'700'});const r=await fetch('/api/monitor/logs?'+params.toString(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();
        const select=$('logSource');if(select.options.length===1){for(const source of data.sources){const option=document.createElement('option');option.value=source;option.textContent=source;select.appendChild(option);}}
        const c=data.connection||{};$('apiDiag').textContent='API: responding';$('apiDiag').className='pill green';$('bridgeDiag').textContent=c.bridge_connected?'Bridge: connected':'Bridge: offline';$('bridgeDiag').className='pill '+(c.bridge_connected?'green':'red');
        $('mcpDiag').textContent=c.request_count?('MCP: '+c.request_count+' requests · '+(c.last_method||'')+' · HTTP '+(c.last_status??'pending')):'MCP: no request has reached this server';$('mcpDiag').className='pill '+(c.request_count?'green':'muted');
        $('tunnelDiag').textContent=c.mcp_url?'Tunnel URL registered':'Tunnel URL unavailable';$('tunnelDiag').className='pill '+(c.mcp_url?'green':'red');$('mcpAddress').textContent='MCP endpoint: '+(c.mcp_url||'not registered')+(c.last_seen?' · last request '+new Date(c.last_seen*1000).toLocaleString():'');
        $('logSummary').textContent=data.count+' log lines · updated '+new Date(data.generated_at*1000).toLocaleTimeString();
        const output=data.entries.map(e=>{const cls=e.level==='ERROR'?'log-error':e.level==='WARN'?'log-warn':e.level==='DEBUG'?'log-debug':'log-info';return '<span class="'+cls+'">'+esc(e.timestamp)+' ['+esc(e.source)+'] ['+esc(e.level)+'] '+esc(e.message)+'</span>';}).join('\n');
        if(output!==lastLogText){const box=$('logOutput');const shouldScroll=box.scrollTop+box.clientHeight>=box.scrollHeight-45;box.innerHTML=output||'No matching log entries.';lastLogText=output;if(shouldScroll)box.scrollTop=box.scrollHeight;}
        }catch(e){$('logSummary').textContent='Could not load logs: '+e.message;$('logOutput').textContent='Log API error: '+e.message+'\nCheck the API process and /api/monitor/logs endpoint.';}finally{logsBusy=false;}}
        $('refreshLogs').addEventListener('click',updateLogs);$('logSource').addEventListener('change',updateLogs);$('logLevel').addEventListener('change',updateLogs);$('logSearch').addEventListener('keydown',e=>{if(e.key==='Enter')updateLogs();});
        $('captureNow').addEventListener('click',async()=>{try{$('shotInfo').textContent='Capture requested…';await fetch('/api/monitor/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({force:true})});}catch(e){$('captureError').textContent=e.message;}});
