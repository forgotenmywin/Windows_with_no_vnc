        \ Unreal diagnostics were printed above.\"\n}\nWrite-Host 'PUBLIC_MCP_ENDPOINT_READY=true PROTOCOL=2026-07-28 LEGACY_COMPATIBILITY=true'\n\
        \n$internalHeaders = @{ Authorization = \"Bearer $env:BRIDGE_TOKEN\" }\n# Reserve CPU capacity for the runner/API\
        \ while keeping the Unreal Editor responsive.\n# The affinity limit is reversible through the system-optimization\
        \ API.\ntry {\n  $cpuBody = @{ percent = 75 } | ConvertTo-Json -Compress\n  $cpuBalance = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/internal/system/optimize-cpu'\
        \ -Method Post -Headers $internalHeaders -ContentType 'application/json' -Body $cpuBody -TimeoutSec 15\n  Write-Host\
        \ (\"UNREAL_CPU_HEADROOM=true CORES={0}/{1}\" -f $cpuBalance.affinity.Count, $cpuBalance.logical_cpus)\n} catch {\n\
        \  Write-Warning (\"Could not apply reversible Unreal CPU headroom: \" + $_.Exception.Message)\n}\n$urlBody = @{ public_url\
        \ = $publicUrl } | ConvertTo-Json -Compress\n$urlRegistration = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/internal/set-public-url'\
        \ -Method Post -Headers $internalHeaders -ContentType 'application/json' -Body $urlBody -TimeoutSec 10\nif (-not $urlRegistration.ok)\
        \ { throw 'Could not register the public File Manager URL with the API.' }\n$fileManagerUrl = \"$publicUrl/files\"\
        \nWrite-Host \"FILE_MANAGER_URL=$fileManagerUrl\"\nWrite-Host 'FILE_MANAGER_USERNAME=viewer'\nWrite-Host 'File Manager\
        \ password is read from the existing repository Actions secret MONITOR_PASSWORD (never printed).'\n$summaryText =\
        \ @\"\n## UE58 File Manager\n- [Open authenticated File Manager]($fileManagerUrl)\n- **Username:** viewer\n- **Password:**\
        \ repository Actions secret MONITOR_PASSWORD (not printed to logs)\n- Browse available Windows drives and Unreal Engine\
        \ folders, select files, create ZIP archives, upload local files, download remote files, rename/create/delete entries,\
        \ and publish selected files to GitHub Releases.\n- The Activity Logs tab records API commands, Unreal/MCP operations,\
        \ file uploads/downloads, ZIP creation and Release upload results.\n- **MCP endpoint for ChatGPT:** $mcpEndpoint\n\
        - **ChatGPT Connection:** Custom URL (not a Secure MCP Tunnel ID)\n- **ChatGPT Authentication:** No authentication\n\
        - Paste the exact HTTPS MCP endpoint above, including `/mcp`; do not paste the File Manager URL or bare PUBLIC_API_URL.\n\
        - The Quick Tunnel URL is temporary and works only while this Actions workflow and cloudflared process remain running.\n\
        \"@\n$summaryText | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8\n\nWrite-Host 'REST endpoints:\
        \ GET /health; authenticated File Manager at GET /files; authenticated filesystem, Drive, GitHub Release, project\
        \ and unified logs endpoints.'\nWrite-Host \"MCP_ENDPOINT=$mcpEndpoint\"\nWrite-Host \"MCP_ENDPOINT_COPY=$($mcpEndpoint.TrimEnd('/'))\"\
        \nWrite-Host 'MCP_CONNECTOR_CONNECTION=Custom URL (not Secure MCP Tunnel ID)'\nWrite-Host \"MCP_CONNECTOR_AUTH=No\
        \ authentication\"\nWrite-Host 'IMPORTANT: Paste MCP_ENDPOINT_COPY exactly in ChatGPT Connection: HTTPS host plus\
        \ /mcp, with NO trailing slash. Never reuse a URL from an older workflow run.'\nWrite-Host 'Single MCP endpoint only:\
        \ /mcp -> native Unreal AllToolsets plus File Manager, binary-upload and guarded GitHub Release tools. No second MCP\
        \ URL.'\nWrite-Host 'Bridge startup: Python StartupScripts plus -ExecCmds py fallback; duplicate initialization is\
        \ guarded. No -ExecutePythonScript is used.'\nWrite-Host 'Binary transfer: unreal_upload_binary_file accepts files\
        \ up to 8 MiB per MCP call; place larger files under D:\\UE58\\Uploads through the authenticated API before publishing\
        \ them.'\nWrite-Host 'File Manager uses authenticated JSON APIs; directory and log listings refresh on demand or every\
        \ 5 seconds in the Logs tab. No viewport snapshots, VNC, desktop stream, WebSocket, or SSE.'\nWrite-Host 'MCP tool\
        \ list includes Unreal AllToolsets, live arbitrary Editor Python, console commands, headless UnrealEditor-Cmd Python\
        \ commandlets (-nullrhi), scene/project/plugin management, save/checkpoint/restore, packaging, Windows metrics, file\
        \ transfer, GitHub Release and external MCP gateway tools.'\nWrite-Host 'MCP transport: Streamable HTTP over HTTPS;\
        \ POST carries JSON-RPC. GET returns 405 because server-initiated event streams are not offered; upstream single-message\
        \ SSE POST replies are normalized to JSON-RPC JSON.'\nWrite-Host 'Standalone UE58SceneViewer.exe is read-only, polls\
        \ the active scene version, and automatically refreshes the displayed model after successful Unreal scene changes.'\n\
        Write-Host 'File Manager includes Windows/Unreal folder browsing, multi-select, download, ZIP, local upload, rename,\
        \ delete confirmation, GitHub Release publishing and operation logs. Existing Unreal project/plugin, checkpoint, packaging,\
        \ Windows optimization and MCP gateway APIs remain available.'\nWrite-Warning 'SECURITY: the File Manager and REST\
        \ endpoints require Basic Auth (viewer / repository secret MONITOR_PASSWORD). The /mcp endpoint remains intentionally\
        \ unauthenticated for ChatGPT; anyone who obtains the MCP URL may issue Unreal commands and access mounted files.\
        \ Do not share the MCP URL; stop the workflow when finished.'\n\n$lastHeartbeat = Get-Date\n$activeProjectFile = \"\
        $root\\UEControl\\UEControl.uproject\"\n$editorCommandFile = \"$root\\control\\editor-command.json\"\nwhile ($true)\
        \ {\n  Start-Sleep -Seconds 5\n  if ($apiProc.HasExited) { throw 'API server stopped; inspect D:\\UE58\\Logs\\api-stderr.log.'\
        \ }\n  if ($cfProc.HasExited) { throw 'Cloudflare tunnel stopped; inspect D:\\UE58\\Logs\\cloudflared-stderr.log.'\
        \ }\n\n  # Run one queued headless Unreal Python commandlet. The API writes this\n  # request only after validating\
        \ the project/script paths and, when needed,\n  # saving the live Editor session through its authenticated Python\
        \ bridge.\n  $headlessCommandFile = \"$root\\control\\headless-command.json\"\n  if (Test-Path -LiteralPath $headlessCommandFile)\
        \ {\n    $headlessCmd = $null\n    $headlessStatusPath = $null\n    try {\n      $headlessCmd = Get-Content -LiteralPath\
        \ $headlessCommandFile -Raw | ConvertFrom-Json\n      $rootPrefix = [System.IO.Path]::GetFullPath($root) + [System.IO.Path]::DirectorySeparatorChar\n\
        \      $headlessRoot = [System.IO.Path]::GetFullPath(\"$root\\HeadlessJobs\") + [System.IO.Path]::DirectorySeparatorChar\n\
        \      $targetProject = [System.IO.Path]::GetFullPath([string]$headlessCmd.project_file)\n      $scriptPath = [System.IO.Path]::GetFullPath([string]$headlessCmd.script_file)\n\
        \      $headlessStatusPath = [System.IO.Path]::GetFullPath([string]$headlessCmd.status_file)\n      $stdoutPath =\
        \ [System.IO.Path]::GetFullPath([string]$headlessCmd.stdout_log)\n      $stderrPath = [System.IO.Path]::GetFullPath([string]$headlessCmd.stderr_log)\n\
        \      if (-not $targetProject.StartsWith($rootPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or -not $targetProject.EndsWith('.uproject',\
        \ [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $targetProject)) { throw 'Headless\
        \ project path is invalid or outside D:\\UE58.' }\n      foreach ($path in @($scriptPath,$headlessStatusPath,$stdoutPath,$stderrPath))\
        \ {\n        if (-not $path.StartsWith($headlessRoot, [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Headless\
        \ job files must stay inside D:\\UE58\\HeadlessJobs.' }\n      }\n      if (-not (Test-Path -LiteralPath $scriptPath))\
        \ { throw 'Headless Python script was not found.' }\n      $jobDir = Split-Path -Parent $scriptPath\n      $cancelFlag\
        \ = Join-Path $jobDir 'cancel-requested.flag'\n      $cmdExe = Join-Path (Split-Path -Parent $editor) 'UnrealEditor-Cmd.exe'\n\
        \      if (-not (Test-Path -LiteralPath $cmdExe)) { throw \"UnrealEditor-Cmd.exe not found beside $editor.\" }\n \
        \     $timeoutSeconds = [Math]::Max(30, [Math]::Min(10000, [int]$headlessCmd.timeout_seconds))\n      $stoppedEditor\
        \ = $false\n      $resumeProject = [System.IO.Path]::GetFullPath([string]$headlessCmd.resume_project_file)\n     \
        \ if ($headlessCmd.stop_editor -eq $true) {\n        if ($ueProc -and -not $ueProc.HasExited) {\n          Write-Host\
        \ 'HEADLESS: stopping the live Editor after the API saved dirty packages.'\n          Stop-Process -Id $ueProc.Id\
        \ -Force -ErrorAction SilentlyContinue\n          $ueProc.WaitForExit(20000) | Out-Null\n          $stoppedEditor\
        \ = $true\n          $ueProc = $null\n        }\n      }\n      $status = [ordered]@{\n        ok = $true; job_id\
        \ = [string]$headlessCmd.job_id; status = 'running'\n        project_file = $targetProject; script_file = $scriptPath\n\
        \        stdout_log = $stdoutPath; stderr_log = $stderrPath\n        created_at = $headlessCmd.created_at; started_at\
        \ = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()\n        finished_at = $null; exit_code = $null; pid = $null\n  \
        \      headless = $true; renderer = 'nullrhi'; editor_stopped = $stoppedEditor\n        editor_restarted = $false;\
        \ editor_restart_warning = ''\n        timeout_seconds = $timeoutSeconds; error = ''\n      }\n      $status | ConvertTo-Json\
        \ -Depth 8 | ForEach-Object { [System.IO.File]::WriteAllText($headlessStatusPath + '.tmp', $_, [System.Text.UTF8Encoding]::new($false))\
        \ }\n      Move-Item -LiteralPath ($headlessStatusPath + '.tmp') -Destination $headlessStatusPath -Force\n      $headlessArgs\
        \ = @($targetProject, '-run=pythonscript', ('-script=\"' + $scriptPath + '\"'), '-unattended', '-nop4', '-nosplash',\
        \ '-nosound', '-nullrhi', '-stdout', '-FullStdOutLogOutput', '-UTF8Output')\n      Write-Host (\"HEADLESS_START job={0}\
        \ project={1} exe={2}\" -f $headlessCmd.job_id, $targetProject, $cmdExe)\n      $headlessProc = Start-Process -FilePath\
        \ $cmdExe -ArgumentList $headlessArgs -WorkingDirectory (Split-Path -Parent $targetProject) -PassThru -WindowStyle\
        \ Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath\n      $status.pid = $headlessProc.Id\n\
        \      $null = $headlessProc.WaitForExit(1)\n      $deadline = (Get-Date).AddSeconds($timeoutSeconds)\n      $cancelled\
        \ = $false\n      $timedOut = $false\n      while (-not $headlessProc.HasExited) {\n        if (Test-Path -LiteralPath\
        \ $cancelFlag) {\n          $cancelled = $true\n          Stop-Process -Id $headlessProc.Id -Force -ErrorAction SilentlyContinue\n\
        \          $headlessProc.WaitForExit(10000) | Out-Null\n          break\n        }\n        if ((Get-Date) -ge $deadline)\
        \ {\n          $timedOut = $true\n          Stop-Process -Id $headlessProc.Id -Force -ErrorAction SilentlyContinue\n\
        \          $headlessProc.WaitForExit(10000) | Out-Null\n          break\n        }\n        $null = $headlessProc.WaitForExit(1000)\n\
        \      }\n      $exitCode = $null\n      try { if ($headlessProc.HasExited) { $exitCode = [int]$headlessProc.ExitCode\
        \ } } catch { }\n      if ($cancelled) { $status.status = 'cancelled'; $status.error = 'Cancellation requested; commandlet\
        \ process was stopped.' }\n      elseif ($timedOut) { $status.status = 'timed_out'; $status.error = \"Headless script\
        \ exceeded $timeoutSeconds seconds and was terminated.\" }\n      elseif ($exitCode -eq 0) { $status.status = 'completed'\
        \ }\n      else { $status.status = 'failed'; $status.error = \"UnrealEditor-Cmd.exe exited with code $exitCode.\"\
        \ }\n      $status.exit_code = $exitCode\n      $status.finished_at = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()\n\
        \      if ($stoppedEditor -and $headlessCmd.resume_editor -eq $true) {\n        try {\n          if (-not (Test-Path\
        \ -LiteralPath $resumeProject)) { throw \"Saved Editor project for resume not found: $resumeProject\" }\n        \
        \  $stamp = Get-Date -Format 'yyyyMMdd_HHmmss'\n          $ueOut = \"$root\\Logs\\unreal-resume-after-headless-$stamp-stdout.log\"\
        \n          $ueErr = \"$root\\Logs\\unreal-resume-after-headless-$stamp-stderr.log\"\n          $ueArgs = @($resumeProject,\
        \ '-log', '-stdout', '-FullStdOutLogOutput', '-AllowSoftwareRendering', '-d3d11', '-ModelContextProtocolStartServer',\
        \ '-ModelContextProtocolPort=8000', '-ExecCmds=\"py D:/UE58/UEControl/Content/Python/init_unreal.py\"')\n        \
        \  $ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory (Split-Path -Parent $resumeProject)\
        \ -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError $ueErr\n          $activeProjectFile = $resumeProject\n\
        \          $resumeBridgeReady = $false\n          for ($i = 0; $i -lt 90; $i++) {\n            Start-Sleep -Seconds\
        \ 2\n            try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4; if ($health.bridge_connected)\
        \ { $resumeBridgeReady = $true; break } } catch { }\n            if ($ueProc.HasExited) { break }\n          }\n \
        \         if (-not $resumeBridgeReady) { throw \"Editor restarted but bridge did not reconnect. Inspect $ueOut and\
        \ $ueErr.\" }\n          $resumeMcpReady = $false\n          for ($i = 0; $i -lt 45; $i++) {\n            try { $probe\
        \ = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp' -Method Get -TimeoutSec 4 -UseBasicParsing; if ([int]$probe.StatusCode\
        \ -eq 405) { $resumeMcpReady = $true; break } } catch { try { if ([int]$_.Exception.Response.StatusCode -eq 405) {\
        \ $resumeMcpReady = $true; break } } catch { } }\n            Start-Sleep -Seconds 2\n            if ($ueProc.HasExited)\
        \ { break }\n          }\n          if (-not $resumeMcpReady) { throw 'Editor restarted and Bridge connected, but\
        \ native MCP did not return the expected HTTP 405.' }\n          $status.editor_restarted = $true\n        } catch\
        \ {\n          $status.editor_restart_warning = $_.Exception.Message\n          Write-Warning (\"HEADLESS_EDITOR_RESUME_WARNING:\
        \ \" + $status.editor_restart_warning)\n        }\n      }\n      $status | ConvertTo-Json -Depth 8 | ForEach-Object\
        \ { [System.IO.File]::WriteAllText($headlessStatusPath + '.tmp', $_, [System.Text.UTF8Encoding]::new($false)) }\n\
        \      Move-Item -LiteralPath ($headlessStatusPath + '.tmp') -Destination $headlessStatusPath -Force\n      Write-Host\
        \ (\"HEADLESS_FINISHED job={0} status={1} exit_code={2} editor_restarted={3}\" -f $headlessCmd.job_id, $status.status,\
        \ $status.exit_code, $status.editor_restarted)\n    } catch {\n      Write-Error (\"Headless commandlet supervisor\
        \ failed: \" + $_)\n      if ($headlessStatusPath -and (Test-Path -LiteralPath $headlessStatusPath)) {\n        try\
        \ {\n          $failedStatus = Get-Content -LiteralPath $headlessStatusPath -Raw | ConvertFrom-Json\n          $failedStatus.status\
        \ = 'failed'\n          $failedStatus.error = $_.Exception.Message\n          $failedStatus.finished_at = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()\n\
        \          $failedStatus | ConvertTo-Json -Depth 8 | ForEach-Object { [System.IO.File]::WriteAllText($headlessStatusPath\
        \ + '.tmp', $_, [System.Text.UTF8Encoding]::new($false)) }\n          Move-Item -LiteralPath ($headlessStatusPath\
        \ + '.tmp') -Destination $headlessStatusPath -Force\n        } catch { }\n      }\n    } finally {\n      Remove-Item\
        \ -LiteralPath $headlessCommandFile -Force -ErrorAction SilentlyContinue\n    }\n  }\n\n  # A project switch, plugin\
        \ change or checkpoint restore is handled here.\n  if (Test-Path -LiteralPath $editorCommandFile) {\n    try {\n \
        \     $cmd = Get-Content -LiteralPath $editorCommandFile -Raw | ConvertFrom-Json\n      $targetProject = [System.IO.Path]::GetFullPath([string]$cmd.project_file)\n\
        \      $rootPrefix = [System.IO.Path]::GetFullPath($root) + [System.IO.Path]::DirectorySeparatorChar\n      if (-not\
        \ $targetProject.StartsWith($rootPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath\
        \ $targetProject)) { throw 'Restart request project is outside D:\\UE58 or missing.' }\n      Write-Host (\"Editor\
        \ restart command received: {0} -> {1}\" -f $cmd.action, $targetProject)\n      if ($ueProc -and -not $ueProc.HasExited)\
        \ { Stop-Process -Id $ueProc.Id -Force -ErrorAction SilentlyContinue; $ueProc.WaitForExit(15000) | Out-Null }\n  \
        \    $projectDir = Split-Path -Parent $targetProject\n      if ($cmd.action -eq 'restore_checkpoint') {\n        $zipPath\
        \ = [System.IO.Path]::GetFullPath([string]$cmd.checkpoint)\n        $backupPrefix = [System.IO.Path]::GetFullPath(\"\
        $root\\Backups\") + [System.IO.Path]::DirectorySeparatorChar\n        if (-not $zipPath.StartsWith($backupPrefix,\
        \ [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $zipPath)) { throw 'Checkpoint restore\
        \ path is invalid.' }\n        Expand-Archive -LiteralPath $zipPath -DestinationPath $projectDir -Force\n        Write-Host\
        \ \"CHECKPOINT_RESTORED=$zipPath\"\n      }\n      Remove-Item -LiteralPath $editorCommandFile -Force -ErrorAction\
        \ SilentlyContinue\n      $stamp = Get-Date -Format 'yyyyMMdd_HHmmss'\n      $ueOut = \"$root\\Logs\\unreal-$stamp-stdout.log\"\
        \n      $ueErr = \"$root\\Logs\\unreal-$stamp-stderr.log\"\n      $ueArgs = @($targetProject, '-log', '-stdout', '-FullStdOutLogOutput',\
        \ '-AllowSoftwareRendering', '-d3d11', '-ModelContextProtocolStartServer', '-ModelContextProtocolPort=8000', '-ExecCmds=\"\
        py D:/UE58/UEControl/Content/Python/init_unreal.py\"')\n      $ueProc = Start-Process -FilePath $editor -ArgumentList\
        \ $ueArgs -WorkingDirectory $projectDir -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError $ueErr\n \
        \     $activeProjectFile = $targetProject\n      Write-Host \"UNREAL_RESTARTED_PID=$($ueProc.Id) PROJECT=$activeProjectFile\"\
        \n      $restartedBridge = $false\n      for ($i = 0; $i -lt 90; $i++) {\n        Start-Sleep -Seconds 2\n       \
        \ try { $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4; if ($h.bridge_connected) { $restartedBridge\
        \ = $true; break } } catch { }\n        if ($ueProc.HasExited) { break }\n      }\n      if (-not $restartedBridge)\
        \ { throw \"Bridge did not reconnect after project restart. Inspect $ueOut and $ueErr.\" }\n      $restartedMcp =\
        \ $false\n      for ($i = 0; $i -lt 45; $i++) {\n        try { $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp'\
        \ -Method Get -TimeoutSec 4 -UseBasicParsing; if ([int]$probe.StatusCode -eq 405) { $restartedMcp = $true; break }\
        \ } catch { try { if ([int]$_.Exception.Response.StatusCode -eq 405) { $restartedMcp = $true; break } } catch { }\
        \ }\n        Start-Sleep -Seconds 2\n      }\n      if (-not $restartedMcp) { throw 'Native MCP did not return HTTP\
        \ 405 after restart.' }\n      Write-Host 'PROJECT_RESTART_BRIDGE_READY=true NATIVE_MCP_LISTENER_READY=true'\n   \
        \ } catch {\n      Write-Error (\"Editor restart handler failed: \" + $_)\n      if (Test-Path -LiteralPath $editorCommandFile)\
        \ { Remove-Item -LiteralPath $editorCommandFile -Force -ErrorAction SilentlyContinue }\n      throw\n    }\n  }\n\n\
        \  if ($ueProc -and $ueProc.HasExited) { throw \"Unreal Editor stopped with exit code $($ueProc.ExitCode); inspect\
        \ $ueOut, $ueErr and the active project's Saved\\Logs folder.\" }\n  if (((Get-Date) - $lastHeartbeat).TotalMinutes\
        \ -ge 30) {\n    try {\n      $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4\n      Write-Host\
        \ (\"Heartbeat {0}: API_OK={1} BRIDGE_CONNECTED={2}\" -f (Get-Date), $h.ok, $h.bridge_connected)\n    } catch { Write-Warning\
        \ (\"Heartbeat {0}: local health check failed.\" -f (Get-Date)) }\n    $lastHeartbeat = Get-Date\n  }\n}"
