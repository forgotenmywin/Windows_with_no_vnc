            page = '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UE58 File Manager</title>\n<style>\n:root{color-scheme:dark;--bg:#0b1017;--panel:#121a25;--line:#28384a;--muted:#9baec1;--text:#e7f0fa;--accent:#4c9be8;--green:#43c58a;--red:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Segoe UI,Arial,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 20px;background:#101925;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-flex;border:1px solid #3a5069;border-radius:30px;padding:4px 9px;font-size:11px}.wrap{max-width:1600px;margin:auto;padding:16px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;min-width:0}.roots{display:flex;flex-direction:column;gap:6px}.rootbtn,.btn{border:1px solid #39516c;background:#1b2b3d;color:#e7f0fa;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left}.rootbtn:hover,.btn:hover{background:#243d56}.rootbtn.active{border-color:var(--accent);background:#18334c}.btn.primary{background:#174c77;border-color:#347db7}.btn.danger{background:#49252b;border-color:#80414a}.btn:disabled{opacity:.45;cursor:not-allowed}input,select{background:#0b131d;border:1px solid #35485c;color:var(--text);padding:8px;border-radius:7px;max-width:100%}input[type=checkbox]{accent-color:var(--accent)}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:9px 0}.pathbar{display:flex;gap:7px;align-items:center}.pathbar input{flex:1;min-width:120px}.crumb{font:12px Consolas,monospace;color:#bcd2e8;overflow-wrap:anywhere;padding:9px;background:#0b131d;border:1px solid var(--line);border-radius:7px;margin:8px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:9px 10px;border-bottom:1px solid #253447;text-align:left;font-size:12px}th{position:sticky;top:0;background:#192637;color:#bdd0e3}tr:last-child td{border-bottom:0}tr:hover td{background:#172433}.namebtn{color:#dceeff;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit}.folder{color:#81c6ff}.file{color:#dbe6f0}.status{min-height:24px;margin:8px 0;color:#a9c4de;overflow-wrap:anywhere}.status.error{color:var(--red)}.status.ok{color:var(--green)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.logs{white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;max-height:62vh;min-height:260px;background:#080d13;border:1px solid var(--line);border-radius:8px;padding:11px;font:12px/1.6 Consolas,monospace}.hidden{display:none!important}.right{margin-left:auto}.tabs{display:flex;gap:7px;margin-bottom:10px}.tab{padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:#111b27;color:var(--text);cursor:pointer}.tab.active{background:#1d3a56;border-color:var(--accent)}.drop{border:1px dashed #46617c;border-radius:8px;padding:10px}.statline{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0}.statline span{background:#0b131d;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11px}@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:9px}.roots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:12px}.grid2{grid-template-columns:1fr}}\n</style></head><body>\n<header><div><h1>UE58 File Manager</h1><div class="muted small">Windows drives · Unreal Engine files · ZIP · GitHub Releases · operation logs</div></div><div class="statline"><span id="bridgeState">Bridge: checking…</span><span id="clock">—</span><span id="selectedCount">0 selected</span></div></header>\n<div class="wrap"><aside class="panel"><h2>Windows & Unreal locations</h2><div id="roots" class="roots">Loading available drives…</div><div class="status" id="rootStatus"></div><div class="small muted">The list shows accessible drive letters plus shortcuts to the UE58 workspace, Engine, active project, uploads, backups and logs.</div></aside>\n<main style="min-width:0"><div class="tabs"><button class="tab active" data-tab="files">Files</button><button class="tab" data-tab="3d">3D Export</button><button class="tab" data-tab="logs">Activity logs</button></div>\n<section id="filesTab" class="panel"><div class="pathbar"><input id="pathInput" spellcheck="false" placeholder="Choose a Windows folder path"><button class="btn" id="goPath">Go</button><button class="btn" id="upBtn">Up</button><button class="btn" id="refreshBtn">Refresh</button></div><div class="crumb" id="currentPath">Choose a drive or Unreal folder.</div>\n<div class="toolbar"><input id="filterInput" placeholder="Filter names or extensions…"><button class="btn" id="selectAllBtn">Select visible</button><button class="btn" id="clearSelectionBtn">Clear selection</button><span class="right muted small" id="directoryInfo"></span></div>\n<div class="toolbar"><button class="btn primary" id="zipBtn">ZIP selected files / folders</button><button class="btn primary" id="releaseBtn">Send selected to GitHub Release</button><button class="btn" id="downloadBtn">Download selected</button><button class="btn" id="copySelectedBtn">Copy selected here</button><button class="btn" id="copyCurrentPathBtn">Copy folder path</button><button class="btn" id="renameBtn">Rename selected</button><button class="btn danger" id="deleteBtn">Delete selected</button><button class="btn" id="newFolderBtn">New folder</button></div>\n<div class="grid2"><div class="drop"><div class="small muted">Upload file(s) from this computer into the currently open Windows folder.</div><div class="toolbar"><input type="file" id="localFiles" multiple><label class="small"><input type="checkbox" id="uploadOverwrite"> Replace same-name files</label><button class="btn" id="uploadBtn">Upload here</button></div></div><div class="drop"><div class="small muted">GitHub Release destination (assets become publicly downloadable).</div><div class="toolbar"><label class="small">Tag <input id="releaseTag" value="ue5.8" style="width:110px"></label><label class="small"><input type="checkbox" id="replaceRelease"> Replace same-name Release assets</label></div><div class="small muted">If the tag or Release does not exist, it is created automatically from the repository default branch. Select a folder and use ZIP to include that entire folder and all subfolders. When replacement is off, unique timestamped asset names are used. Large files are split into numbered parts automatically.</div></div></div>\n<div class="status" id="fileStatus" aria-live="polite"></div><div class="tablewrap"><table><thead><tr><th><input type="checkbox" id="headerCheck"></th><th>Name</th><th>Extension / Type</th><th>Size</th><th>Modified</th><th>Action</th></tr></thead><tbody id="fileRows"><tr><td colspan="6" class="muted">Choose a location.</td></tr></tbody></table></div><div class="toolbar"><button class="btn" id="prevPageBtn">Previous</button><span class="muted small" id="pageInfo">—</span><button class="btn" id="nextPageBtn">Next</button></div></section>\n<section id="threeDTab" class="panel hidden"><h2>3D Export from Unreal Engine</h2><div class="muted small">Export directly from the currently open Unreal Editor. GLB is one binary file. glTF is JSON plus its referenced .bin/textures, and the system creates a ZIP bundle for easy download.</div><div class="toolbar"><label>Format <select id="threeDFormat"><option value="glb">GLB (.glb)</option><option value="gltf">glTF (.gltf + resources)</option></select></label><label>Source <select id="threeDScope"><option value="level">Whole active Level</option><option value="selected">Selected Actors in Unreal Editor</option></select></label><button class="btn primary" id="threeDExportBtn">Export 3D model</button><button class="btn" id="threeDOpenFolderBtn" disabled>Open export folder in Files</button></div><div class="status" id="threeDStatus" aria-live="polite">No export started.</div>\n<div id="threeDProgressWrap" hidden style="margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0b131d">\n  <div class="statline" style="align-items:center"><span id="threeDPercent" style="font-size:18px;font-weight:700">0%</span><span id="threeDPhase">Waiting</span><span id="threeDProgressKind" class="muted small">Progress</span></div>\n  <div role="progressbar" aria-label="3D export progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="threeDProgressTrack" style="height:12px;background:#263649;border-radius:20px;overflow:hidden;margin:8px 0"><div id="threeDProgressBar" style="height:100%;width:0%;background:linear-gradient(90deg,#2784d8,#43c58a);border-radius:20px;transition:width .35s ease"></div></div>\n  <div class="small" style="margin:7px 0;overflow-wrap:anywhere"><b>Currently processing:</b> <span id="threeDCurrentFile">—</span></div>\n  <div class="small muted" style="margin:7px 0">Actors and mesh assets detected in the selected source:</div><div id="threeDTargets" style="max-height:150px;overflow:auto;padding:8px;background:#080d13;border:1px solid var(--line);border-radius:7px;font:11px/1.5 Consolas,monospace">Waiting for Unreal Editor…</div>\n  <div class="small" style="margin:10px 0 5px;font-weight:700">Live export log</div><pre id="threeDExportLog" style="white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;max-height:220px;min-height:80px;margin:0;padding:9px;background:#080d13;border:1px solid var(--line);border-radius:7px;font:11px/1.55 Consolas,monospace">Export events will appear here.</pre>\n</div><div class="toolbar" id="threeDLinks" hidden></div><div class="small muted">Output folder: D:\\UE58\\Uploads\\3D_Exports. You can also start an export through ChatGPT MCP using unreal_export_3d and check it with unreal_get_3d_export_status. For an external viewer, download the model and drop it into <a href="https://sandbox.babylonjs.com/" target="_blank" rel="noopener" style="color:#9bcfff">Babylon.js Sandbox</a>.</div><div id="threeDPreview" style="height:520px;margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0b111a" hidden><iframe id="threeDFrame" title="3D model preview" style="width:100%;height:100%;border:0" allow="fullscreen"></iframe></div></section>\n<section id="logsTab" class="panel hidden"><div class="toolbar"><select id="logSource"><option value="all">All log sources</option></select><select id="logLevel"><option value="all">All levels</option><option>ERROR</option><option>WARN</option><option>INFO</option><option>DEBUG</option></select><input id="logQuery" placeholder="Search logs…"><button class="btn" id="refreshLogsBtn">Refresh logs</button><label class="small"><input type="checkbox" id="autoLogs" checked> Auto refresh</label></div><div class="statline"><span id="logSummary">Waiting for logs…</span><span id="lastLogUpdate"></span></div><div id="logOutput" class="logs">Logs will appear here. File transfers, ZIP jobs, GitHub Release uploads, API commands and MCP operations are recorded.</div></section>\n</main></div>\n<script>\nconst $=id=>document.getElementById(id);const state={path:\'\',parent:\'\',entries:[],roots:[],selected:new Set(),offset:0,limit:500,total:0,tab:\'files\',logs:[]};\nconst esc=v=>String(v??\'\').replace(/[&<>"\']/g,c=>({\'&\':\'&amp;\',\'<\':\'&lt;\',\'>\':\'&gt;\',\'"\':\'&quot;\',"\'":\'&#39;\'}[c]));\nfunction human(n){if(n==null)return \'—\';const u=[\'B\',\'KB\',\'MB\',\'GB\',\'TB\'];let i=0,x=Number(n);while(x>=1024&&i<u.length-1){x/=1024;i++;}return (i?x.toFixed(2):x)+\' \'+u[i];}\nfunction status(message,kind=\'\'){ $(\'fileStatus\').textContent=message;$(\'fileStatus\').className=\'status \'+kind; }\nasync function api(url,options={}){const r=await fetch(url,{cache:\'no-store\',...options});let j={};const ct=r.headers.get(\'content-type\')||\'\';if(ct.includes(\'application/json\'))j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||(\'HTTP \'+r.status));return j;}\nasync function apiRetry(url,options={},attempts=3){let lastError=null;for(let attempt=0;attempt<attempts;attempt++){try{const r=await fetch(url,{cache:\'no-store\',...options});let j={};const ct=r.headers.get(\'content-type\')||\'\';if(ct.includes(\'application/json\'))j=await r.json();if(!r.ok||j.ok===false){const e=new Error(j.error||(\'HTTP \'+r.status));e.status=r.status;if(r.status!==408&&r.status!==429&&r.status<500)throw e;lastError=e;}else{return j;}}catch(e){if(e.status&&e.status!==408&&e.status!==429&&e.status<500)throw e;lastError=e;}if(attempt+1<attempts)await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)));}throw lastError||new Error(\'Status request failed after retries\');}\nfunction updateSelected(){ $(\'selectedCount\').textContent=state.selected.size+\' selected\';$(\'headerCheck\').checked=state.entries.length>0&&state.entries.every(x=>state.selected.has(x.path)); }\nfunction renderRoots(){ $(\'roots\').innerHTML=state.roots.map((r,i)=>`<button class="rootbtn ${state.path===r.path?\'active\':\'\'}" data-root="${i}">${esc(r.label)}<div class="small muted">${esc(r.path)}</div></button>`).join(\'\')||\'No accessible drive found.\';document.querySelectorAll(\'[data-root]\').forEach(b=>b.onclick=()=>openDir(state.roots[Number(b.dataset.root)].path)); }\nasync function loadRoots(){try{const j=await api(\'/api/fs/roots\');state.roots=j.roots||[];$(\'bridgeState\').textContent=\'Unreal bridge: \'+(j.bridge_connected?\'connected\':\'offline\');$(\'rootStatus\').textContent=\'Active project: \'+(j.current_project||\'not detected\');renderRoots();const preferred=state.roots.find(r=>r.label===\'Active Unreal Project\')||state.roots.find(r=>r.label===\'UE58 Workspace\')||state.roots[0];if(preferred)await openDir(preferred.path); }c