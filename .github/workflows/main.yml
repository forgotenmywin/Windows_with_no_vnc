
name: Unreal Engine 5.8 - Windows Remote Session

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare D drive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force `
            -Path "D:\UE58" | Out-Null
          New-Item -ItemType Directory -Force `
            -Path "D:\RemoteDesktop" | Out-Null

          Get-PSDrive D

      - name: Download Unreal Engine from Google Drive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade gdown
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install gdown."
          }

          $url = "https://drive.google.com/file/d/1MTby51iqiUNSUOxLxLUs-oaKhJfgyV2Y/view"
          $zip = "D:\UE58\UE_5.8.zip"

          if (-not (Test-Path $zip)) {
            python -m gdown --fuzzy $url -O $zip
            if ($LASTEXITCODE -ne 0) {
              throw "Google Drive download failed."
            }
          }

          if ((Get-Item $zip).Length -lt 1000000000) {
            throw "Downloaded file is unexpectedly small."
          }

          Write-Host "Download completed:"
          Get-Item $zip | Select-Object FullName, Length

      - name: Install 7-Zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"

          if (-not (Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress
          }

          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip was not found after installation."
          }

          & $sevenZip i | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip check failed."
          }

      - name: Test and Extract Unreal Engine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $zip = "D:\UE58\UE_5.8.zip"
          $destination = "D:\UE58\Extracted"

          if (-not (Test-Path $zip)) {
            throw "Unreal Engine ZIP was not found."
          }

          New-Item -ItemType Directory -Force `
            -Path $destination | Out-Null

          & $sevenZip t $zip
          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity test failed."
          }

          & $sevenZip x $zip "-o$destination" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Unreal Engine extraction failed."
          }

          Write-Host "Extraction completed: $destination"
          Get-PSDrive D

      - name: Configure RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add the RDP_PASSWORD repository secret."
          }

          $user = "runneradmin"
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          Set-LocalUser -Name $user `
            -Password $securePassword

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

          Write-Host "RDP configured."

      - name: Install and Start TightVNC
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $password = $env:VNC_PASSWORD
          if ([string]::IsNullOrWhiteSpace($password)) {
            throw "Add the VNC_PASSWORD repository secret."
          }
          if ($password.Length -gt 8) {
            throw "VNC_PASSWORD must be 8 characters or fewer."
          }

          $root = "D:\RemoteDesktop"
          $msi = Join-Path $root "tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.84/tightvnc-2.8.84-gpl-setup-64bit.msi" `
            -OutFile $msi

          $arguments = @(
            "/i", $msi,
            "/quiet", "/norestart",
            "SET_USEVNCAUTHENTICATION=1",
            "VALUE_OF_USEVNCAUTHENTICATION=1",
            "SET_PASSWORD=1",
            "VALUE_OF_PASSWORD=$password",
            "SET_USECONTROLAUTHENTICATION=1",
            "VALUE_OF_USECONTROLAUTHENTICATION=1",
            "SET_CONTROLPASSWORD=1",
            "VALUE_OF_CONTROLPASSWORD=$password",
            "SERVER_ADD_FIREWALL_EXCEPTION=0"
          )

          $install = Start-Process msiexec.exe `
            -ArgumentList $arguments -Wait -PassThru

          if ($install.ExitCode -notin @(0, 3010)) {
            throw "TightVNC install failed: $($install.ExitCode)"
          }

          $service = Get-Service |
            Where-Object {
              $_.Name -match "tvnserver|TightVNC"
            } |
            Select-Object -First 1

          if (-not $service) {
            throw "TightVNC service was not found."
          }

          Set-Service -Name $service.Name -StartupType Automatic
          Start-Service -Name $service.Name
          Start-Sleep -Seconds 3

          $tcp = Test-NetConnection 127.0.0.1 -Port 5900 `
            -WarningAction SilentlyContinue

          if (-not $tcp.TcpTestSucceeded) {
            throw "VNC server is not listening on port 5900."
          }

          Write-Host "TightVNC is listening on port 5900."

      - name: Start noVNC Web Interface
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "D:\RemoteDesktop"
          $zip = Join-Path $root "novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.zip" `
            -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath $root -Force

          $novnc = Join-Path $root "noVNC-1.6.0"
          if (-not (Test-Path (Join-Path $novnc "vnc.html"))) {
            throw "noVNC web files were not found."
          }

          python -m pip install websockify
          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          $proc = Start-Process -FilePath "python" `
            -ArgumentList @(
              "-m", "websockify",
              "--web", $novnc,
              "6080", "127.0.0.1:5900"
            ) `
            -PassThru `
            -RedirectStandardOutput "$root\websockify.log" `
            -RedirectStandardError "$root\websockify-error.log"

          Start-Sleep -Seconds 5

          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:6080/vnc.html" `
            -TimeoutSec 15

          if ($response.StatusCode -ne 200) {
            throw "noVNC HTTP check failed."
          }

          Write-Host "NOVNC_READY"
          Write-Host "noVNC is responding on port 6080."

      - name: Start Cloudflare Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "D:\RemoteDesktop"
          $cloudflared = Join-Path $root "cloudflared.exe"
          $log = Join-Path $root "cloudflared.log"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          $proc = Start-Process -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -PassThru `
            -RedirectStandardOutput $log `
            -RedirectStandardError $log

          $urlFound = $false

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5

            if (Test-Path $log) {
              $content = Get-Content $log -Raw `
                -ErrorAction SilentlyContinue

              $match = [regex]::Match(
                $content,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              )

              if ($match.Success) {
                Write-Host "NOVNC_PUBLIC_URL=$($match.Value)"
                $urlFound = $true
                break
              }
            }

            if ($proc.HasExited) {
              throw "Cloudflare tunnel exited unexpectedly."
            }
          }

          if (-not $urlFound) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "Cloudflare tunnel URL was not detected."
          }

      - name: Keep Session Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $end = (Get-Date).AddHours(5).AddMinutes(40)

          Write-Host "Unreal Engine files: D:\UE58\Extracted"
          Write-Host "Session is active. Do not stop this workflow."

          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60

            $vnc = Test-NetConnection 127.0.0.1 -Port 5900 `
              -WarningAction SilentlyContinue
            $web = Test-NetConnection 127.0.0.1 -Port 6080 `
              -WarningAction SilentlyContinue

            if (-not $vnc.TcpTestSucceeded -or -not $web.TcpTestSucceeded) {
              Write-Host "Warning: VNC or noVNC port is not responding."
            } else {
              Write-Host "Session active: $(Get-Date -Format o)"
            }
          }
