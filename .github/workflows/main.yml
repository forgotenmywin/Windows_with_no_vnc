        @app.post("/api/fs/release-upload")
        @monitor_auth
        def api_fs_release_upload():
            body = request.get_json(silent=True) or {}
            if body.get("confirm_public_upload") is not True:
                return jsonify(ok=False, error="confirm_public_upload_true_required"), 400
            paths = body.get("paths")
            if isinstance(body.get("path"), str) and not paths:
                paths = [body.get("path")]
            if not isinstance(paths, list) or not paths or len(paths) > 50:
                return jsonify(ok=False, error="select_between_1_and_50_files"), 400
            tag = str(body.get("tag") or "ue5.8").strip()
            replace_existing = body.get("replace_existing") is True
            custom_name = str(body.get("filename") or "").strip()
            if not RELEASE_UPLOAD_LOCK.acquire(blocking=False):
                return jsonify(ok=False, error="another_release_upload_is_running"), 409
            results, failures = [], []
            try:
                for index, raw in enumerate(paths):
                    try:
                        source = _fs_resolve(raw)
                        if not source.is_file():
                            raise ValueError("Only files can be uploaded; choose a file rather than a folder: " + str(source))
                        if index == 0 and custom_name:
                            filename = _fs_safe_name(custom_name)
                        else:
                            filename = source.name
                        if not replace_existing:
                            suffix = source.suffix
                            stem = filename[:-len(suffix)] if suffix and filename.lower().endswith(suffix.lower()) else filename
                            filename = stem[:100] + "_" + time.strftime("%Y%m%d_%H%M%S") + "_" + uuid.uuid4().hex[:5] + suffix
                        log("GITHUB_RELEASE_UPLOAD_STARTED tag=%s source=%s asset=%s" % (tag, source, filename))
                        value = github_release_upload(source, tag, filename,
                            body.get("release_name", ""), body.get("release_notes", ""),
                            replace_existing=replace_existing)
                        results.append(value)
                        log("GITHUB_RELEASE_UPLOAD_COMPLETED tag=%s source=%s asset=%s bytes=%s" % (
                            tag, source, filename, source.stat().st_size))
                    except Exception as exc:
                        failures.append({"source": str(raw), "error": str(exc)})
                        log("GITHUB_RELEASE_UPLOAD_FAILED source=%s error=%s" % (raw, repr(exc)))
            finally:
                RELEASE_UPLOAD_LOCK.release()
            ok = bool(results)
            return jsonify(ok=ok, tag=tag, uploaded=len(results), failed=len(failures), results=results, failures=failures), (200 if ok else 502)

