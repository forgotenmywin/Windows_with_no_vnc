        \ applied to selected tool arguments.'\n}\nif ($apiText -notmatch 'BLUEPRINT_OBJECT_REF_NORMALIZATION' -or\
        \ $apiText -notmatch 'refPath:objectPath' -or $apiText -notmatch 'Custom Blueprint Object Path' -or $apiText\
        \ -notmatch 'normalizeBlueprintToolArguments') {\n  throw 'BLUEPRINT_OBJECT_REF_VALIDATION_FAILED: custom\
        \ Blueprint Object Path must be normalized and sent as an object reference with refPath.'\n}\nWrite-Host\
        \ 'BLUEPRINT_MANUAL_PATH_APPLY_VALIDATION=true'\nif ($apiText -notmatch 'BLUEPRINT_LIST_GRAPHS_BRIDGE_IMPLEMENTATION'\
        \ -or\n    $apiText -notmatch \"@app.post\\('/api/blueprint/list-graphs'\\)\" -or\n    $apiText -notmatch\
        \ \"@app.get\\('/api/blueprint/list-graphs-status/<job_id>'\\)\" -or\n    $apiText -notmatch 'queue_unreal\\\
        (_blueprint_list_graphs_python_code\\(asset_path\\), 8\\)' -or\n    $apiText -notmatch 'library\\.list_graphs\\\
        (blueprint\\)' -or\n    $apiText -notmatch 'BLUEPRINT_LIST_GRAPHS_JSON' -or\n    $apiText -notmatch 'async\
        \ function listGraphs\\(\\)' -or\n    $apiText -notmatch 'bpListGraphs') {\n  throw 'BLUEPRINT_LIVE_GRAPH_EXPLORER_VALIDATION_FAILED:\
        \ a live List Graphs UI, authenticated API and Unreal Python Bridge operation are required.'\n}\nWrite-Host\
        \ 'BLUEPRINT_LIVE_GRAPH_EXPLORER_VALIDATION=true'\nWrite-Host 'BLUEPRINT_EXPLORER_VALIDATION=true'\nWrite-Host\
        \ 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION=true'\nWrite-Host 'THREE_D_GITHUB_RELEASE_VALIDATION=true'\nWrite-Host\
        \ 'BRIDGE_BUSY_DIAGNOSTICS_VALIDATION=true'\nWrite-Host 'BRIDGE_RECOVERY_ENDPOINT_VALIDATION=true'\nWrite-Host\
        \ 'PROJECT_PREFLIGHT_VALIDATION=true'\nWrite-Host 'CREATE_PROJECT_VALIDATION=true'\nWrite-Host 'THREE_D_PROJECT_SELECTOR_VALIDATION=true'\n"
