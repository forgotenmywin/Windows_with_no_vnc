          def upload_target(filename: str, destination_folder: str = ""):
              """Resolve a filename under D:\\UE58\\Uploads only."""
              filename = str(filename or "").strip()
              if (not filename or filename in (".", "..")
                  or Path(filename).name != filename
                  or any(ch in filename for ch in ("/", "\\", "\r", "\n", "\x00"))):
                  raise ValueError("filename must be a simple filename without path components")
              folder_value = str(destination_folder or "").replace("\\", "/").strip(" /")
              folder_parts = [] if not folder_value else folder_value.split("/")
              if any(part in ("", ".", "..") or ":" in part for part in folder_parts):
                  raise ValueError("destination_folder must be a relative folder under Uploads")
              folder = UPLOAD_ROOT.joinpath(*folder_parts).resolve()
              if folder != UPLOAD_ROOT and UPLOAD_ROOT not in folder.parents:
                  raise ValueError("destination must remain inside D:\\UE58\\Uploads")
              folder.mkdir(parents=True, exist_ok=True)
              target = (folder / filename).resolve()
              if target.parent != folder:
                  raise ValueError("destination must remain inside its selected Uploads folder")
              return target

          def store_uploaded_bytes(target: Path, data: bytes, overwrite: bool = False):
              if not data:
                  raise ValueError("file content is empty")
              if target.exists() and not overwrite:
                  raise FileExistsError("target already exists; set overwrite=true to replace it")
              temp = target.with_name(target.name + ".uploading-" + uuid.uuid4().hex)
              try:
                  with temp.open("wb") as handle:
                      handle.write(data)
                  if target.exists() and not overwrite:
                      raise FileExistsError("target already exists; set overwrite=true to replace it")
                  os.replace(temp, target)
              finally:
                  temp.unlink(missing_ok=True)
              return {"ok": True, "path": str(target), "size": target.stat().st_size,
                      "sha256": hashlib.sha256(data).hexdigest()}

          @mcp_server.tool()
          def unreal_upload_binary_file(filename: str, content_base64: str,
                                        destination_folder: str = "", overwrite: bool = False) -> str:
              """Upload a binary attachment (for example .blend, .fbx, .zip, .png) from the MCP client into D:\\UE58\\Uploads. Pass the file bytes as Base64. Supports up to 8 MiB per call for MCP clients that can pass large arguments. For chat-attached files, prefer the chunked upload tools to keep each request small."""
              try:
                  encoded = str(content_base64 or "")
                  if len(encoded) > ((UPLOAD_SINGLE_FILE_LIMIT + 2) // 3) * 4 + 16:
                      return mcp_json({"ok": False, "error": "Base64 content exceeds the 8 MiB direct-upload limit; use the chunked upload tools."})
                  try:
                      data = base64.b64decode(encoded, validate=True)
                  except (binascii.Error, ValueError) as exc:
                      return mcp_json({"ok": False, "error": "content_base64 is not valid Base64", "detail": str(exc)})
                  if len(data) > UPLOAD_SINGLE_FILE_LIMIT:
                      return mcp_json({"ok": False, "error": "Direct upload limit is 8 MiB; use the chunked upload tools."})
                  target = upload_target(filename, destination_folder)
                  return mcp_json(store_uploaded_bytes(target, data, bool(overwrite)))
              except FileExistsError as exc:
                  return mcp_json({"ok": False, "error": str(exc)})
              except Exception as exc:
                  return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def unreal_begin_binary_upload(filename: str, total_size: int,
                                         destination_folder: str = "", overwrite: bool = False) -> str:
              """Start a chunked binary upload to D:\\UE58\\Uploads for files over 8 MiB. Then call unreal_upload_binary_chunk for each Base64 chunk and unreal_finish_binary_upload when all chunks are sent. Chunk size is 16 KiB to keep individual MCP tool arguments manageable. Maximum file size is 2 GiB."""
              try:
                  total_size = int(total_size)
                  if total_size < 1 or total_size > UPLOAD_MAX_FILE_SIZE:
                      return mcp_json({"ok": False, "error": "total_size must be between 1 byte and 2 GiB"})
                  target = upload_target(filename, destination_folder)
                  if target.exists() and not overwrite:
                      return mcp_json({"ok": False, "error": "target already exists; set overwrite=true to replace it", "path": str(target)})
                  upload_id = uuid.uuid4().hex
                  chunk_count = (total_size + UPLOAD_CHUNK_BYTES - 1) // UPLOAD_CHUNK_BYTES
                  staging = UPLOAD_ROOT / ".incoming" / upload_id
                  staging.mkdir(parents=True, exist_ok=False)
                  with UPLOAD_LOCK:
                      UPLOAD_SESSIONS[upload_id] = {
                          "target": str(target), "total_size": total_size,
                          "chunk_count": chunk_count, "staging": str(staging),
                          "received": set(), "overwrite": bool(overwrite),
                          "created": time.time()
                      }
                  return mcp_json({"ok": True, "upload_id": upload_id,
                                   "filename": target.name, "destination": str(target),
                                   "total_size": total_size, "chunk_size": UPLOAD_CHUNK_BYTES,
                                   "chunks_total": chunk_count,
                                   "next_step": "Send every chunk in index order starting at 0, then call unreal_finish_binary_upload."})
              except Exception as exc:
                  return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def unreal_upload_binary_chunk(upload_id: str, chunk_index: int, chunk_base64: str) -> str:
              """Send one Base64-encoded 16 KiB (maximum) chunk for an upload started with unreal_begin_binary_upload. Indexes start at zero."""
              try:
                  upload_id = str(upload_id or "")
                  with UPLOAD_LOCK:
                      session = UPLOAD_SESSIONS.get(upload_id)
                  if session is None:
                      return mcp_json({"ok": False, "error": "upload session not found or expired"})
                  chunk_index = int(chunk_index)
                  if chunk_index < 0 or chunk_index >= session["chunk_count"]:
                      return mcp_json({"ok": False, "error": "chunk_index is outside the expected range"})
                  encoded = str(chunk_base64 or "")
                  if len(encoded) > ((UPLOAD_CHUNK_BYTES + 2) // 3) * 4 + 16:
                      return mcp_json({"ok": False, "error": "encoded chunk exceeds the 16 KiB decoded limit"})
                  try:
                      data = base64.b64decode(encoded, validate=True)
                  except (binascii.Error, ValueError) as exc:
                      return mcp_json({"ok": False, "error": "chunk_base64 is not valid Base64", "detail": str(exc)})
                  expected = min(UPLOAD_CHUNK_BYTES, session["total_size"] - chunk_index * UPLOAD_CHUNK_BYTES)
                  if len(data) != expected:
                      return mcp_json({"ok": False, "error": "incorrect chunk length", "expected_bytes": expected, "received_bytes": len(data)})
                  staging = Path(session["staging"])
                  part = staging / ("chunk_%08d.bin" % chunk_index)
                  temp = part.with_suffix(".tmp")
                  with temp.open("wb") as handle:
                      handle.write(data)
                  os.replace(temp, part)
                  with UPLOAD_LOCK:
                      current = UPLOAD_SESSIONS.get(upload_id)
                      if current is None:
                          part.unlink(missing_ok=True)
                          return mcp_json({"ok": False, "error": "upload session was cancelled"})
                      current["received"].add(chunk_index)
                      received = len(current["received"])
                      total = current["chunk_count"]
                  return mcp_json({"ok": True, "upload_id": upload_id,
                                   "chunk_index": chunk_index, "chunk_bytes": len(data),
                                   "chunks_received": received, "chunks_total": total,
                                   "complete": received == total})
              except Exception as exc:
                  return mcp_json({"ok": False, "error": str(exc)})

          @mcp_server.tool()
          def unreal_finish_binary_upload(upload_id: str) -> str:
              """Finalize a chunked binary upload, verify byte size, calculate SHA-256 and atomically save it under D:\\UE58\\Uploads."""
              staging = None
              assembled = None
              try:
                  upload_id = str(upload_id or "")
                  with UPLOAD_LOCK:
                      session = UPLOAD_SESSIONS.get(upload_id)
                  if session is None:
                      return mcp_json({"ok": False, "error": "upload session not found or expired"})
                  missing = sorted(set(range(session["chunk_count"])) - session["received"])
                  if missing:
                      return mcp_json({"ok": False, "error": "upload has missing chunks", "missing_chunk_indexes": missing[:100], "missing_count": len(missing)})
                  target = Path(session["target"])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists() and not session["overwrite"]:
                      return mcp_json({"ok": False, "error": "target already exists; upload was not finalized", "path": str(target)})
                  staging = Path(session["staging"])
                  assembled = target.with_name(target.name + ".assembling-" + upload_id)
                  digest = hashlib.sha256()
                  written = 0
                  with assembled.open("wb") as output:
                      for index in range(session["chunk_count"]):
                          chunk_path = staging / ("chunk_%08d.bin" % index)
                          with chunk_path.open("rb") as chunk:
                              while True:
                                  block = chunk.read(1024 * 1024)
                                  if not block:
                                      break
                                  output.write(block)
                                  digest.update(block)
                                  written += len(block)
                  if written != session["total_size"]:
                      raise ValueError("assembled file size does not match total_size")
                  os.replace(assembled, target)
                  assembled = None
                  with UPLOAD_LOCK:
                      UPLOAD_SESSIONS.pop(upload_id, None)
                  shutil.rmtree(staging, ignore_errors=True)
                  return mcp_json({"ok": True, "path": str(target), "size": written,
                                   "sha256": digest.hexdigest(), "upload_id": upload_id})
              except Exception as exc:
                  return mcp_json({"ok": False, "error": str(exc)})
              finally:
                  if assembled is not None:
                      assembled.unlink(missing_ok=True)

          @mcp_server.tool()
          def unreal_abort_binary_upload(upload_id: str) -> str:
              """Cancel an unfinished binary upload and remove its temporary chunks."""
              with UPLOAD_LOCK:
                  session = UPLOAD_SESSIONS.pop(str(upload_id or ""), None)
              if session is None:
                  return mcp_json({"ok": False, "error": "upload session not found"})
              shutil.rmtree(session["staging"], ignore_errors=True)
              return mcp_json({"ok": True, "aborted": True, "upload_id": upload_id})

          _mcp_app = mcp_server.streamable_http_app(
              streamable_http_path="/",
              transport_security=TransportSecuritySettings(enable_dns_rebinding_protection=False),
              host="0.0.0.0"
          )

          async def mcp_app(scope, receive, send):
              # No bearer-token check: this MCP endpoint is intentionally unauthenticated for testing.
              await _mcp_app(scope, receive, send)

          @asynccontextmanager
          async def lifespan(asgi_app):
              async with mcp_server.session_manager.run():
                  yield

          async def native_mcp_proxy(scope, receive, send):
              # Unauthenticated streaming reverse proxy to Epic's in-editor MCP server.
              if scope.get("type") != "http":
                  return
              body = bytearray()
              more = True
              while more:
                  message = await receive()
                  if message["type"] == "http.disconnect":
                      return
                  body.extend(message.get("body", b""))
                  more = message.get("more_body", False)
              raw_path = scope.get("path", "/") or "/"
              target_path = "/mcp" + ("" if raw_path == "/" else raw_path)
              query = scope.get("query_string", b"")
              target = "http://127.0.0.1:8000" + target_path + ("?" + query.decode("latin1") if query else "")
              forwarded = {}
              hop_by_hop = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "te", "trailers", "transfer-encoding", "upgrade", "host", "origin", "authorization"}
              for key, value in scope.get("headers", []):
                  name = key.decode("latin1").lower()
                  if name not in hop_by_hop:
                      forwarded[name] = value.decode("latin1")
              forwarded["host"] = "127.0.0.1:8000"
              forwarded["origin"] = "http://127.0.0.1:8000"
              try:
                  async with httpx.AsyncClient(timeout=None) as client:
                      async with client.stream(scope.get("method", "POST"), target, headers=forwarded, content=bytes(body)) as response:
                          out_headers = [(k.lower(), v) for k, v in response.headers.raw
                                         if k.decode("latin1").lower() not in hop_by_hop]
                          await send({"type": "http.response.start", "status": response.status_code, "headers": out_headers})
                          async for chunk in response.aiter_raw():
                              await send({"type": "http.response.body", "body": chunk, "more_body": True})
                          await send({"type": "http.response.body", "body": b"", "more_body": False})
              except Exception as exc:
                  log("Native MCP proxy error: " + repr(exc))
                  err = b'{"ok":false,"error":"native_mcp_proxy_failed"}'
                  await send({"type": "http.response.start", "status": 502,
                              "headers": [(b"content-type", b"application/json"), (b"content-length", str(len(err)).encode())]})
                  await send({"type": "http.response.body", "body": err})

          combined_app = Starlette(routes=[
              Mount("/mcp", app=mcp_app),
              Mount("/native-mcp", app=native_mcp_proxy),
              Mount("/", app=WSGIMiddleware(app))
          ], lifespan=lifespan)

          if __name__ == "__main__":
              if not BRIDGE_TOKEN: raise RuntimeError("BRIDGE_TOKEN must be set")
              log("Starting unauthenticated REST API on 127.0.0.1:8765; MCP endpoint=/mcp/")
              uvicorn.run(combined_app, host="127.0.0.1", port=8765, log_level="info")
          '@
          Set-Content -LiteralPath "$root\api_server.py" -Value $api -Encoding utf8
          Write-Host 'Created UE project, bridge, and API server.'

      - name: Launch API, Unreal and Cloudflare tunnel
        shell: pwsh
        env:
          GG_UE_TOKEN: ${{ secrets.GG_UE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'D:\UE58'
          $env:UE_ROOT = $root
          if ([string]::IsNullOrWhiteSpace($env:GG_UE_TOKEN)) {
            Write-Warning 'GG_UE_TOKEN is empty; Google Drive endpoints will fail until authorized_user.json or service-account JSON is saved as this Actions secret.'
          }

          # The bridge token is only for local API <-> Unreal communication.
          $env:BRIDGE_TOKEN = [guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')
          $python = (Get-Command python).Source
          & $python -m pip install --disable-pip-version-check --upgrade Flask google-api-python-client google-auth google-auth-httplib2 requests urllib3 httpx "mcp>=2,<3" uvicorn starlette
          if ($LASTEXITCODE -ne 0) { throw 'Python package installation failed.' }

          $apiOut = "$root\Logs\api-stdout.log"
          $apiErr = "$root\Logs\api-stderr.log"
          $apiProc = Start-Process -FilePath $python -ArgumentList @("$root\api_server.py") -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput $apiOut -RedirectStandardError $apiErr
          Write-Host "API_PID=$($apiProc.Id)"

          $localReady = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4
              if ($health.ok) { $localReady = $true; break }
            } catch { }
            if ($apiProc.HasExited) { break }
          }
          if (-not $localReady) {
            if (Test-Path $apiErr) { Get-Content $apiErr -Tail 100 }
            if (Test-Path $apiOut) { Get-Content $apiOut -Tail 100 }
            throw 'Local API did not start.'
          }
          Write-Host 'API_LOCAL_READY=true'

          # API already inherited the Drive and GitHub credentials when it started.
          # Keep only the local bridge token available to the Unreal child process.
          $env:GG_UE_TOKEN = $null
          $env:GITHUB_TOKEN = $null
          $env:GITHUB_REPOSITORY = $null

          $editor = $env:UE_EDITOR_EXE
          if ([string]::IsNullOrWhiteSpace($editor) -or -not (Test-Path -LiteralPath $editor)) {
            throw 'UE_EDITOR_EXE was not found from the extraction step.'
          }
          Write-Host "Unreal Editor found: $editor"
          $ueOut = "$root\Logs\unreal-stdout.log"
          $ueErr = "$root\Logs\unreal-stderr.log"
          $ueArgs = @("$root\UEControl\UEControl.uproject", '-log', '-stdout', '-FullStdOutLogOutput', '-AllowSoftwareRendering', '-d3d11', '-ModelContextProtocolStartServer', '-ModelContextProtocolPort=8000', "-ExecutePythonScript=$root\UEControl\Content\Python\init_unreal.py")
          $ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory "$root\UEControl" -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError $ueErr
          Write-Host "UNREAL_PID=$($ueProc.Id)"

          $cloudflared = "$root\cloudflared.exe"
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $cloudflared
          $cfOut = "$root\Logs\cloudflared-stdout.log"
          $cfErr = "$root\Logs\cloudflared-stderr.log"
          $cfProc = Start-Process -FilePath $cloudflared -ArgumentList @('tunnel', '--url', 'http://127.0.0.1:8765', '--no-autoupdate') -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput $cfOut -RedirectStandardError $cfErr

          $publicUrl = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            $combined = ''
            foreach ($f in @($cfOut, $cfErr)) {
              if (Test-Path $f) { try { $combined += "`n" + (Get-Content $f -Raw -ErrorAction SilentlyContinue) } catch { } }
            }
            $match = [regex]::Match($combined, 'https://[a-zA-Z0-9-]+\.trycloudflare\.com')
            if ($match.Success) { $publicUrl = $match.Value; break }
            if ($cfProc.HasExited) { break }
          }
          if (-not $publicUrl) {
            if (Test-Path $cfErr) { Get-Content $cfErr -Tail 100 }
            throw 'Cloudflare Quick Tunnel did not provide a public URL.'
          }
          Write-Host "PUBLIC_API_URL=$publicUrl"

          Write-Host 'Waiting up to 3 minutes for the Unreal Python bridge...'
          $bridgeReady = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4
              if ($health.bridge_connected) { $bridgeReady = $true; break }
            } catch { }
            if ($ueProc.HasExited) { Write-Warning 'Unreal Editor exited before the Python bridge connected.'; break }
          }
          if ($bridgeReady) { Write-Host 'BRIDGE_READY=true' } else { Write-Warning 'BRIDGE_READY=false; inspect unreal-stdout.log, unreal-stderr.log and /logs.' }

          Write-Host 'REST endpoints: GET /health, POST /command, GET /projects, POST /projects/rename, POST /files/upload, GET /files/download, GET /files/read, PUT /files/write, POST /drive/list, POST /drive/download, POST /drive/upload, POST /github/release/upload, POST /unreal/screenshot, GET /logs'
          Write-Host "MCP_ENDPOINT=$publicUrl/mcp/"
          Write-Host "NATIVE_ALL_TOOLSETS_MCP_ENDPOINT=$publicUrl/native-mcp"
          Write-Host 'Binary transfer: files are saved under D:\UE58\Uploads; use unreal_upload_binary_file for small files or begin/chunk/finish tools for larger files. Chunk size: 16 KiB; max file size: 2 GiB.'
          Write-Host 'MCP tools: unreal_upload_binary_file, unreal_begin_binary_upload, unreal_upload_binary_chunk, unreal_finish_binary_upload, unreal_abort_binary_upload, unreal_execute_python, unreal_wait_python_job, unreal_get_engine_version, unreal_list_projects, unreal_rename_project, unreal_list_files, unreal_read_text_file, unreal_write_text_file, google_drive_list_files, google_drive_download_file, google_drive_upload_file, github_release_upload_file, unreal_take_screenshot'
          Write-Host 'No Authorization header is required for /mcp/, /native-mcp, or the REST fallback endpoints.'
          Write-Warning 'TEST MODE: endpoints are unauthenticated. Anyone who obtains the public Quick Tunnel URL may be able to issue Unreal commands or access exposed files/logs. Stop the workflow when finished.'

          $lastHeartbeat = Get-Date
          while ($true) {
            Start-Sleep -Seconds 60
            if ($apiProc.HasExited) { throw 'API server stopped; inspect D:\UE58\Logs\api-stderr.log.' }
            if ($cfProc.HasExited) { throw 'Cloudflare tunnel stopped; inspect D:\UE58\Logs\cloudflared-stderr.log.' }
            if ($ueProc.HasExited) { throw "Unreal Editor stopped with exit code $($ueProc.ExitCode); inspect D:\UE58\Logs\unreal-stdout.log, unreal-stderr.log and UEControl\Saved\Logs." }
            if (((Get-Date) - $lastHeartbeat).TotalMinutes -ge 30) {
              try {
                $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4
                Write-Host ("Heartbeat {0}: API_OK={1} BRIDGE_CONNECTED={2}" -f (Get-Date), $h.ok, $h.bridge_connected)
              } catch { Write-Warning ("Heartbeat {0}: local health check failed." -f (Get-Date)) }
              $lastHeartbeat = Get-Date
            }
          }
