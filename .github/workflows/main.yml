        def mcp_text_result(send, request_obj, value, is_error=False):
            response_obj = {'jsonrpc': '2.0', 'id': request_obj.get('id'), 'result': {'resultType': 'complete', 'content': [{'type': 'text', 'text': json.dumps(value, ensure_ascii=False, default=str)}], 'isError': bool(is_error)}}
