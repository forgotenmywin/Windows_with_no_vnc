            last_bridge_seen = now
            body = request.get_json(silent=True) or {}
            try:
                reported_tick = float(body.get('editor_tick_at', 0.0) or 0.0)
                if 0.0 < reported_tick <= now + 1.0:
                    last_editor_tick_at = reported_tick
            except (TypeError, ValueError):
