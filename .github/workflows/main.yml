            try:
                limit = max(50, min(2000, int(request.args.get("limit", 500))))
            except (TypeError, ValueError):
                limit = 500
            entries, source_names = _collect_logs(
                request.args.get("source", "all"),
                request.args.get("q", ""),
                request.args.get("level", "all"), limit
            )
            with MONITOR_LOCK:
                connection = dict(MCP_CONNECTION)
                connection["bridge_connected"] = bridge_connected()
                connection["monitor_url"] = monitor_public_url()
                connection["mcp_url"] = (MONITOR_STATE.get("public_base_url", "").rstrip("/") + "/mcp") if MONITOR_STATE.get("public_base_url") else ""
            response = jsonify(ok=True, count=len(entries), entries=entries, sources=source_names, connection=connection, generated_at=time.time())
            response.headers["Cache-Control"] = "no-store"
            return response

