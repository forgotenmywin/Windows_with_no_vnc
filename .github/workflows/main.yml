        def mcp_text_result(send, request_obj, value, is_error=False):
            response_obj = {
                "jsonrpc": "2.0", "id": request_obj.get("id"),
                "result": {"resultType": "complete", "content": [{"type": "text", "text": json.dumps(value, ensure_ascii=False, default=str)}], "isError": bool(is_error)}
            }
            return response_obj

        def parse_sse_json_messages(raw_bytes):
            """Decode JSON-RPC messages carried in an upstream SSE response."""
            decoded = raw_bytes.decode("utf-8", errors="replace")
            messages = []
            for block in re.split(r"\r?\n\r?\n", decoded):
                data_lines = []
                for line in block.splitlines():
                    if line.startswith("data:"):
                        data_lines.append(line[5:].lstrip())
                if not data_lines:
                    continue
                payload = "\n".join(data_lines).strip()
                if not payload or payload == "[DONE]":
                    continue
                try:
                    value = json.loads(payload)
                except Exception:
                    continue
                if isinstance(value, dict):
                    messages.append(value)
                elif isinstance(value, list):
                    messages.extend(item for item in value if isinstance(item, dict))
            return messages

        async def read_mcp_http_reply(response, request_obj):
            """Read one MCP JSON/SSE reply as soon as a complete JSON-RPC message arrives.

            Unreal 5.8 may keep the HTTP connection alive after writing its one reply.
            Waiting for EOF (or even for an SSE blank-line terminator) can therefore
            turn a valid response into a read timeout and an artificial HTTP 502.
            """
            content_type = response.headers.get("content-type", "").lower()
            wanted_id = request_obj.get("id") if isinstance(request_obj, dict) else None

            def decode_json_message(payload):
                payload = str(payload or "").strip()
                if not payload or payload == "[DONE]":
                    return None
                try:
                    value = json.loads(payload)
                except Exception:
                    return None
                candidates = value if isinstance(value, list) else [value]
                for item in candidates:
                    if not isinstance(item, dict):
                        continue
                    if wanted_id is None or item.get("id") == wanted_id:
                        return item
                return None

            if "text/event-stream" not in content_type:
                received = bytearray()
                async for chunk in response.aiter_bytes():
                    if chunk:
                        received.extend(chunk)
                        try:
                            parsed = json.loads(received.decode("utf-8"))
                        except Exception:
                            continue
                        if isinstance(parsed, dict) and (wanted_id is None or parsed.get("id") == wanted_id):
                            return bytes(received), parsed, False
                        if isinstance(parsed, list):
                            matched = decode_json_message(json.dumps(parsed, ensure_ascii=False))
                            if matched is not None:
                                return json.dumps(matched, ensure_ascii=False, separators=(",", ":")).encode("utf-8"), matched, False
                raw = bytes(received)
                try:
                    parsed = json.loads(raw.decode("utf-8")) if raw else None
                except Exception:
                    parsed = None
                return raw, parsed, False

            line_buffer = ""
            data_lines = []
            event_count = 0

            def consume_sse_line(line):
                nonlocal data_lines, event_count
                if line == "":
                    if data_lines:
                        event_count += 1
                        matched = decode_json_message("\n".join(data_lines))
                        data_lines = []
                        if matched is not None:
                            raw = json.dumps(matched, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                            return raw, matched
                    return None
                if line.startswith("data:"):
                    data_lines.append(line[5:].lstrip())
                    # Most MCP replies fit in one SSE data line. Parse immediately,
                    # without waiting for the server to close the stream or emit '\n\n'.
                    matched = decode_json_message("\n".join(data_lines))
                    if matched is not None:
                        event_count += 1
                        raw = json.dumps(matched, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                        data_lines = []
                        return raw, matched
                elif line.startswith(":"):
                    return None
                return None

            async for chunk in response.aiter_text():
                if not chunk:
                    continue
                line_buffer += chunk
                while "\n" in line_buffer:
                    line, line_buffer = line_buffer.split("\n", 1)
                    line = line.rstrip("\r")
                    found = consume_sse_line(line)
                    if found is not None:
                        return found[0], found[1], True

                # Unreal's one-shot SSE response can arrive without a terminating
                # newline/blank line. Try the current unfinished data line as well.
                candidate_line = line_buffer.rstrip("\r")
                if candidate_line.startswith("data:"):
                    candidate = decode_json_message(candidate_line[5:].lstrip())
                    if candidate is not None:
                        raw = json.dumps(candidate, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                        return raw, candidate, True

            if line_buffer:
                found = consume_sse_line(line_buffer.rstrip("\r"))
                if found is not None:
                    return found[0], found[1], True
            if data_lines:
                event_count += 1
                matched = decode_json_message("\n".join(data_lines))
                if matched is not None:
                    raw = json.dumps(matched, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                    return raw, matched, True
            raise RuntimeError("Upstream MCP SSE ended without matching JSON-RPC reply; id=%r events=%d" % (wanted_id, event_count))


        async def mcp_post_and_read(client, target, headers, request_obj, content=None, json_body=None):
            """POST MCP JSON-RPC and capture one response without waiting for an SSE stream to close."""
            async with client.stream("POST", target, headers=headers, content=content, json=json_body) as response:
                raw, parsed, was_sse = await read_mcp_http_reply(response, request_obj)
                return response.status_code, dict(response.headers), list(response.headers.raw), raw, parsed, was_sse

        async def _fetch_native_tools_cache(timeout_seconds=180):
            """Fetch Unreal's native tool catalog over localhost, independent of Cloudflare."""
            global MCP_NATIVE_TOOLS_CACHE, MCP_NATIVE_TOOLS_CACHE_AT
            target = "http://127.0.0.1:8000/mcp"
            timeout = httpx.Timeout(connect=10.0, read=float(timeout_seconds), write=30.0, pool=10.0)
            async with httpx.AsyncClient(timeout=timeout, trust_env=False) as client:
                last_error = None
                for attempt in range(1, 4):
                    init_id = "ue58-native-tools-cache-init-" + uuid.uuid4().hex[:12]
                    init_payload = {
                        "jsonrpc": "2.0", "id": init_id, "method": "initialize",
                        "params": {
                            "protocolVersion": MCP_LEGACY_PROTOCOL,
                            "capabilities": {},
                            "clientInfo": {"name": "UE58-Local-ToolCatalog-Warmup", "version": "1.0.0"}
                        }
                    }
                    init_headers = {
                        "Accept": "application/json, text/event-stream",
                        "Content-Type": "application/json"
                    }
                    status, response_headers, _, raw, init_result, _ = await mcp_post_and_read(
                        client, target, init_headers, init_payload, json_body=init_payload)
                    if status != 200 or not isinstance(init_result, dict) or init_result.get("error") or not isinstance(init_result.get("result"), dict):
                        last_error = "initialize HTTP %s: %s" % (status, raw.decode("utf-8", errors="replace")[:1000])
                        log("MCP local tool-catalog warmup attempt %s initialize failed: %s" % (attempt, last_error))
                        continue

                    session_id = response_headers.get("mcp-session-id", "")
                    notify_headers = {
                        "Accept": "application/json, text/event-stream",
                        "Content-Type": "application/json",
                        "MCP-Protocol-Version": MCP_LEGACY_PROTOCOL
                    }
                    if session_id:
                        notify_headers["Mcp-Session-Id"] = session_id
                    # Notifications have no JSON-RPC response. Read only the HTTP
                    # response headers; do not wait for an optional persistent SSE body.
                    async with client.stream(
                        "POST", target, headers=notify_headers,
                        json={"jsonrpc": "2.0", "method": "notifications/initialized"}) as notify:
                        notify_status = notify.status_code
                        notify_content_type = notify.headers.get("content-type", "")
                    if notify_status not in (200, 202, 204):
                        last_error = "notifications/initialized HTTP %s (content-type=%s)" % (notify_status, notify_content_type)
                        log("MCP local tool-catalog warmup attempt %s notification failed: %s" % (attempt, last_error))
                        continue

                    list_id = "ue58-native-tools-cache-list-" + uuid.uuid4().hex[:12]
                    list_payload = {"jsonrpc": "2.0", "id": list_id, "method": "tools/list", "params": {}}
                    list_headers = {
                        "Accept": "application/json, text/event-stream",
                        "Content-Type": "application/json",
                        "MCP-Protocol-Version": MCP_LEGACY_PROTOCOL
                    }
                    if session_id:
                        list_headers["Mcp-Session-Id"] = session_id
                    log("MCP local tool-catalog warmup: requesting native tools/list (attempt %s, session=%s)" % (attempt, bool(session_id)))
                    status, list_response_headers, _, list_raw, parsed, was_sse = await mcp_post_and_read(
                        client, target, list_headers, list_payload, json_body=list_payload)
                    if status == 404 and attempt == 1:
                        last_error = "tools/list returned HTTP 404 for the fresh session; retrying with a new session"
                        log("MCP local tool-catalog warmup: " + last_error)
                        continue
                    if status != 200:
                        last_error = "tools/list HTTP %s: %s" % (status, list_raw.decode("utf-8", errors="replace")[:1200])
                        log("MCP local tool-catalog warmup failed: " + last_error)
                        continue
                    if not isinstance(parsed, dict) or parsed.get("error") or not isinstance(parsed.get("result"), dict) or not isinstance(parsed["result"].get("tools"), list):
                        last_error = "tools/list returned an invalid JSON-RPC payload: " + str(parsed)[:1200]
                        log("MCP local tool-catalog warmup failed: " + last_error)
                        continue

                    native_tools = parsed["result"]["tools"]
                    with MCP_NATIVE_TOOLS_CACHE_LOCK:
                        MCP_NATIVE_TOOLS_CACHE = parsed
                        MCP_NATIVE_TOOLS_CACHE_AT = time.time()
                    log("MCP_NATIVE_TOOLS_CACHE_READY=true native_tool_count=%s bytes=%s sse=%s" % (
                        len(native_tools), len(list_raw), was_sse))
                    return parsed

            raise RuntimeError("Could not prefetch Unreal tools/list locally after 3 attempts: " + str(last_error or "unknown error"))

        async def send_mcp_json(send, obj, headers=None, status=200):
            payload = json.dumps(obj, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
            with MONITOR_LOCK:
                MCP_CONNECTION["last_status"] = int(status)
                if status >= 400:
                    MCP_CONNECTION["last_error"] = str(obj.get("error", obj.get("message", "MCP HTTP %s" % status)))[:500] if isinstance(obj, dict) else "MCP HTTP %s" % status
            log("MCP OUT status=%s content_type=application/json bytes=%s" % (status, len(payload)))
            out = [(b"content-type", b"application/json; charset=utf-8"),
                   (b"content-length", str(len(payload)).encode("ascii")),
                   (b"cache-control", b"no-store")]
            for key, value in (headers or []):
                if key.lower() not in (b"content-type", b"content-length", b"content-encoding", b"transfer-encoding", b"connection"):
                    out.append((key.lower(), value))
            await send({"type": "http.response.start", "status": status, "headers": out})
            await send({"type": "http.response.body", "body": payload, "more_body": False})

        async def _serve_mcp_event_stream(scope, receive, send):
            """Return 405: this server supports client-to-server MCP POST only.

            Streamable HTTP permits GET to return 405 when server-initiated streams
            are not supported. A never-ending comment-only SSE response caused some
            MCP connector reachability checks to hang or reject the content type.
            """
            while True:
                message = await receive()
                if message.get("type") == "http.disconnect":
                    return
                if message.get("type") == "http.request" and not message.get("more_body", False):
                    break
            with MONITOR_LOCK:
                MCP_CONNECTION["request_count"] += 1
                MCP_CONNECTION["last_seen"] = time.time()
                MCP_CONNECTION["last_method"] = "GET (unsupported; POST-only MCP)"
                MCP_CONNECTION["last_path"] = scope.get("path", "/") or "/"
                MCP_CONNECTION["last_status"] = 405
                MCP_CONNECTION["last_error"] = "GET event streams are not supported; use POST for MCP JSON-RPC."
            payload = json.dumps({"jsonrpc": "2.0", "error": {
                "code": -32000, "message": "Method Not Allowed: use POST for MCP Streamable HTTP requests."
            }, "id": None}, separators=(",", ":")).encode("utf-8")
            headers = [
                (b"content-type", b"application/json; charset=utf-8"),
                (b"content-length", str(len(payload)).encode("ascii")),
                (b"allow", b"POST, HEAD, OPTIONS"),
                (b"cache-control", b"no-store"),
            ]
            await send({"type": "http.response.start", "status": 405, "headers": headers})
            await send({"type": "http.response.body", "body": payload, "more_body": False})
            log("MCP GET rejected with 405; POST is the supported Streamable HTTP transport")


        async def _ensure_legacy_unreal_mcp_session(client, target):
            """Create/reuse the single internal legacy session used behind modern MCP."""
            global MCP_LEGACY_SESSION_ID, MCP_LEGACY_SESSION_INITIALIZED
            async with MCP_LEGACY_SESSION_LOCK:
                if MCP_LEGACY_SESSION_INITIALIZED:
                    return MCP_LEGACY_SESSION_ID

                init_id = "ue58-adapter-init-" + uuid.uuid4().hex[:12]
                init_payload = {
                    "jsonrpc": "2.0", "id": init_id, "method": "initialize",
                    "params": {
                        "protocolVersion": MCP_LEGACY_PROTOCOL,
                        "capabilities": {},
                        "clientInfo": {"name": "UE58-Modern-MCP-Adapter", "version": "1.0.0"}
                    }
                }
                init_headers = {
                    "Accept": "application/json, text/event-stream",
                    "Content-Type": "application/json"
                }
                status, response_headers, raw_headers, raw, init_result, was_sse = await mcp_post_and_read(
                    client, target, init_headers, init_payload, json_body=init_payload)
                if status != 200:
                    raise RuntimeError("Unreal legacy MCP initialize HTTP %s: %s" % (
                        status, raw.decode("utf-8", errors="replace")[:1200]))
                if not isinstance(init_result, dict) or init_result.get("error") or not isinstance(init_result.get("result"), dict):
                    raise RuntimeError("Unreal legacy MCP initialize did not return a valid JSON-RPC result: %s" % str(init_result)[:1200])

                session_id = response_headers.get("mcp-session-id", "")
                notify_payload = {"jsonrpc": "2.0", "method": "notifications/initialized"}
                notify_headers = {
                    "Accept": "application/json, text/event-stream",
                    "Content-Type": "application/json",
                    "MCP-Protocol-Version": MCP_LEGACY_PROTOCOL
                }
                if session_id:
                    notify_headers["Mcp-Session-Id"] = session_id
                notify_response = await client.post(target, headers=notify_headers, json=notify_payload)
                if notify_response.status_code not in (200, 202, 204):
                    raise RuntimeError("Unreal legacy MCP initialized notification HTTP %s: %s" % (
                        notify_response.status_code, notify_response.text[:800]))

                MCP_LEGACY_SESSION_ID = session_id
                MCP_LEGACY_SESSION_INITIALIZED = True
                if session_id:
                    with MCP_SESSION_LOCK:
                        MCP_NATIVE_SESSIONS[session_id] = {"seen": time.time()}
                with MONITOR_LOCK:
                    MCP_CONNECTION["last_session_seen"] = time.time() if session_id else 0.0
                log("Modern MCP adapter established internal Unreal legacy session; session_id_present=%s" % bool(session_id))
                return session_id


        async def _mcp_post_modern_via_fresh_legacy_session(client, target, base_headers, request_obj, request_body):
            """Bridge one stateless 2026 request through a fresh Unreal 2025 session.

            Unreal 5.8 exposes the older session-based MCP transport. Reusing one
            global Unreal session across unrelated ChatGPT requests can leave a stale
            MCP-Session-Id behind and turn tools/list or tools/call into HTTP 404/502.
            A short-lived internal session per modern request avoids cross-request
            session state while keeping the public 2026 endpoint stateless.
            """
            init_id = "ue58-modern-bridge-init-" + uuid.uuid4().hex[:12]
            init_payload = {
                "jsonrpc": "2.0", "id": init_id, "method": "initialize",
                "params": {
                    "protocolVersion": MCP_LEGACY_PROTOCOL,
                    "capabilities": {},
                    "clientInfo": {"name": "UE58-Modern-MCP-Bridge", "version": "1.0.2"}
                }
            }
            init_headers = {
                "Accept": "application/json, text/event-stream",
                "Content-Type": "application/json"
            }
            init_status, init_response_headers, _, init_raw, init_result, _ = await mcp_post_and_read(
                client, target, init_headers, init_payload, json_body=init_payload)
            if init_status != 200 or not isinstance(init_result, dict) or init_result.get("error") or not isinstance(init_result.get("result"), dict):
                raise RuntimeError("Fresh Unreal MCP initialize failed (HTTP %s): %s" % (
                    init_status, init_raw.decode("utf-8", errors="replace")[:900]))

            session_id = init_response_headers.get("mcp-session-id", "")
            notify_headers = {
                "Accept": "application/json, text/event-stream",
                "Content-Type": "application/json",
                "MCP-Protocol-Version": MCP_LEGACY_PROTOCOL
            }
            if session_id:
                notify_headers["Mcp-Session-Id"] = session_id
            notify_response = await client.post(
                target, headers=notify_headers, json={"jsonrpc": "2.0", "method": "notifications/initialized"})
            if notify_response.status_code not in (200, 202, 204):
                raise RuntimeError("Fresh Unreal MCP initialized notification failed (HTTP %s): %s" % (
                    notify_response.status_code, notify_response.text[:700]))

            request_headers = dict(base_headers or {})
            for header_name in ("content-length", "content-encoding", "transfer-encoding", "mcp-session-id", "mcp-method", "mcp-name"):
                request_headers.pop(header_name, None)
            request_headers["accept"] = "application/json, text/event-stream"
            request_headers["content-type"] = "application/json"
            request_headers["mcp-protocol-version"] = MCP_LEGACY_PROTOCOL
            if session_id:
                request_headers["mcp-session-id"] = session_id

            status, response_headers, raw_headers, raw, parsed, was_sse = await mcp_post_and_read(
                client, target, request_headers, request_obj, content=request_body)
            log("Modern MCP bridge request=%s internal_initialize=200 session=%s upstream_status=%s sse=%s" % (
                request_obj.get("method", "unknown"), bool(session_id), status, was_sse))
            return status, response_headers, raw_headers, raw, parsed, was_sse


        def _mcp_decode_header_value(value):
            value = str(value or "")
            if value.startswith("=?base64?") and value.endswith("?="):
                encoded = value[len("=?base64?"):-2]
                try:
                    return base64.b64decode(encoded, validate=True).decode("utf-8")
                except Exception:
                    return value
            return value


        def _normalize_modern_mcp_result(rpc_message, method):
            """Adapt legacy Unreal JSON-RPC results to the stateless MCP 2026-07-28 envelope."""
            if not isinstance(rpc_message, dict) or not isinstance(rpc_message.get("result"), dict):
                return rpc_message
            result = rpc_message["result"]
            result_meta = result.get("_meta")
            if not isinstance(result_meta, dict):
                result_meta = {}
                result["_meta"] = result_meta
            result_meta.setdefault("io.modelcontextprotocol/serverInfo", {
                "name": "UE 5.8 Remote Studio", "version": "1.0.1"
            })
            if method in ("tools/list", "resources/list", "prompts/list"):
                result.setdefault("resultType", "complete")
                result.setdefault("ttlMs", 10000)
                result.setdefault("cacheScope", "private")
            elif method == "tools/call":
                result.setdefault("resultType", "complete")
                result.setdefault("content", [])
            return rpc_message


        def _mcp_downstream_headers(raw_headers, modern_mode=False):
            """Do not leak the legacy Unreal transport session into stateless MCP 2.0."""
            hop_by_hop = {
                "connection", "keep-alive", "proxy-authenticate", "proxy-authorization",
                "te", "trailers", "transfer-encoding", "upgrade", "content-length",
                "content-encoding"
            }
            if modern_mode:
                # MCP 2026-07-28 removed protocol-level sessions. The 2025 header belongs
                # only on the private upstream request to Unreal, never on the public reply.
                hop_by_hop.update({"mcp-session-id", "mcp-protocol-version"})
            return [
                (key.lower(), value)
                for key, value in raw_headers
                if key.decode("latin1").lower() not in hop_by_hop
            ]


        async def _reset_legacy_unreal_mcp_session():
            global MCP_LEGACY_SESSION_ID, MCP_LEGACY_SESSION_INITIALIZED
            async with MCP_LEGACY_SESSION_LOCK:
                MCP_LEGACY_SESSION_ID = ""
                MCP_LEGACY_SESSION_INITIALIZED = False


        async def native_mcp_proxy(scope, receive, send):
            # Public single endpoint: POST carries MCP JSON-RPC. GET returns 405 because
            # this server does not provide server-initiated event streams.
            if scope.get("type") != "http":
                return
            raw_path = scope.get("path", "/") or "/"
            if raw_path not in ("", "/"):
                await send_mcp_json(send, {"ok": False, "error": "not_found", "path": raw_path}, status=404)
                return

            http_method = str(scope.get("method", "POST")).upper()
            if http_method == "GET":
                # Streamable HTTP permits GET to return 405 when server-initiated streams
                # are not supported. Do not leave a comment-only SSE stream hanging.
                await _serve_mcp_event_stream(scope, receive, send)
                return
            if http_method == "HEAD":
                await send({"type": "http.response.start", "status": 200,
                            "headers": [(b"content-type", b"application/json"),
                                        (b"cache-control", b"no-store"),
                                        (b"x-mcp-transport", b"streamable-http")]})
                await send({"type": "http.response.body", "body": b"", "more_body": False})
                return
            if http_method == "OPTIONS":
                await send({"type": "http.response.start", "status": 204,
                            "headers": [(b"allow", b"POST, HEAD, OPTIONS"),
                                        (b"access-control-allow-origin", b"*"),
                                        (b"access-control-allow-methods", b"POST, HEAD, OPTIONS"),
                                        (b"access-control-allow-headers", b"content-type, accept, mcp-protocol-version, mcp-session-id, mcp-method, mcp-name, last-event-id, authorization"),
                                        (b"cache-control", b"no-store")]})
                await send({"type": "http.response.body", "body": b"", "more_body": False})
                return
            if http_method != "POST":
                await send_mcp_json(send, {"ok": False, "error": "method_not_allowed",
                                           "message": "Use POST for JSON-RPC MCP requests."}, status=405,
                                    headers=[(b"allow", b"POST, HEAD, OPTIONS")])
                return

            body = bytearray()
            more = True
            while more:
                message = await receive()
                if message["type"] == "http.disconnect":
                    return
                body.extend(message.get("body", b""))
                more = message.get("more_body", False)
            query = scope.get("query_string", b"")
            target = "http://127.0.0.1:8000/mcp" + ("?" + query.decode("latin1") if query else "")
            forwarded = {}
            hop_by_hop = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "te", "trailers", "transfer-encoding", "upgrade", "host", "origin", "authorization"}
            for key, value in scope.get("headers", []):
                name = key.decode("latin1").lower()
                if name not in hop_by_hop:
                    forwarded[name] = value.decode("latin1")
            forwarded["host"] = "127.0.0.1:8000"
            forwarded["origin"] = "http://127.0.0.1:8000"
            request_obj = None
            try:
                if body:
                    request_obj = json.loads(bytes(body).decode("utf-8"))
            except Exception:
                request_obj = None
            method = request_obj.get("method", "") if isinstance(request_obj, dict) else ""
            params = request_obj.get("params", {}) if isinstance(request_obj, dict) else {}
            incoming_headers = {key.decode("latin1").lower(): value.decode("latin1") for key, value in scope.get("headers", [])}
            incoming_protocol = incoming_headers.get("mcp-protocol-version", "")
            modern_mode = incoming_protocol == MCP_MODERN_PROTOCOL or method == "server/discover"

            if modern_mode:
                request_id = request_obj.get("id") if isinstance(request_obj, dict) else None
                meta = params.get("_meta", {}) if isinstance(params, dict) else {}
                header_method = incoming_headers.get("mcp-method", "")
                header_name = _mcp_decode_header_value(incoming_headers.get("mcp-name", ""))
                body_protocol = meta.get("io.modelcontextprotocol/protocolVersion", "") if isinstance(meta, dict) else ""
                validation_error = None
                if incoming_protocol != MCP_MODERN_PROTOCOL:
                    validation_error = "MCP-Protocol-Version must be 2026-07-28."
                elif header_method != method:
                    validation_error = "Mcp-Method header must exactly match the JSON-RPC method."
                elif body_protocol != MCP_MODERN_PROTOCOL:
                    validation_error = "params._meta.io.modelcontextprotocol/protocolVersion must be 2026-07-28."
                elif method in ("tools/call", "resources/read", "prompts/get"):
                    expected_name = str(params.get("name") if method != "resources/read" else params.get("uri") or "")
                    if not header_name or header_name != expected_name:
                        validation_error = "Mcp-Name header must match params.name or params.uri."
                if validation_error:
                    error_obj = {"jsonrpc": "2.0", "id": request_id,
                                 "error": {"code": -32020, "message": "Header mismatch: " + validation_error}}
                    await send_mcp_json(send, error_obj, status=400)
                    return

                if method == "server/discover":
                    discover = {
                        "jsonrpc": "2.0", "id": request_id,
                        "result": {
                            "resultType": "complete",
                            "supportedVersions": [MCP_MODERN_PROTOCOL],
                            "capabilities": {"tools": {}},
                            "_meta": {"io.modelcontextprotocol/serverInfo": {
                                "name": "UE 5.8 Remote Studio", "version": "1.0.0"
                            }},
                            "instructions": "Controls the active Unreal Engine 5.8 editor and its project through the UE Remote Studio bridge.",
                            "ttlMs": 15000,
                            "cacheScope": "private"
                        }
                    }
                    await send_mcp_json(send, discover)
                    with MONITOR_LOCK:
                        MCP_CONNECTION["last_status"] = 200
                        MCP_CONNECTION["last_error"] = ""
                    log("Modern MCP server/discover accepted")
                    return

                # Translate the stateless 2026 request into the 2025 handshake transport
                # spoken by the Unreal 5.8 native MCP listener. Tool payloads are unchanged.
                translated = dict(request_obj)
                translated_params = dict(params) if isinstance(params, dict) else {}
                translated_params.pop("_meta", None)
                translated["params"] = translated_params
                request_obj = translated
                params = translated_params
                body = bytearray(json.dumps(request_obj, ensure_ascii=False, separators=(",", ":")).encode("utf-8"))
                # The modern request body has changed after removing _meta. Never forward
                # the original client's Content-Length/encoding framing to Unreal: doing
                # so makes HTTPX wait for bytes that will never arrive and returns 502.
                forwarded.pop("content-length", None)
                forwarded.pop("content-encoding", None)
                forwarded.pop("transfer-encoding", None)
                forwarded.pop("mcp-method", None)
                forwarded.pop("mcp-name", None)
                for header_name in list(forwarded):
                    if header_name.startswith("mcp-param-"):
                        forwarded.pop(header_name, None)
                forwarded["accept"] = "application/json, text/event-stream"
                forwarded["content-type"] = "application/json"
                forwarded["mcp-protocol-version"] = MCP_LEGACY_PROTOCOL

            incoming_session = next((value.decode("latin1") for key, value in scope.get("headers", []) if key.lower() == b"mcp-session-id"), "")
            if not modern_mode and not incoming_session and method not in ("initialize", "ping"):
                # Some MCP clients intermittently omit the session header on later calls.
                # Reuse the most recently established native session for this single-tenant
                # tunnel; the native server still validates the session id itself.
                with MCP_SESSION_LOCK:
                    active_sessions = sorted(MCP_NATIVE_SESSIONS.items(), key=lambda item: item[1].get("seen", 0), reverse=True)
                    fallback = active_sessions[0] if active_sessions and (time.time() - active_sessions[0][1].get("seen", 0) < 3600) else None
                if fallback:
                    incoming_session = fallback[0]
                    forwarded["mcp-session-id"] = incoming_session
                    with MCP_SESSION_LOCK:
                        MCP_NATIVE_SESSIONS[incoming_session] = {"seen": time.time()}
                    with MONITOR_LOCK:
                        MCP_CONNECTION["session_fallback_count"] += 1
                    log("MCP session header missing; using most-recent active session fallback")
            elif incoming_session:
                with MCP_SESSION_LOCK:
                    if incoming_session in MCP_NATIVE_SESSIONS:
                        MCP_NATIVE_SESSIONS[incoming_session] = {"seen": time.time()}
            with MONITOR_LOCK:
                MCP_CONNECTION["request_count"] += 1
                MCP_CONNECTION["last_seen"] = time.time()
                MCP_CONNECTION["last_method"] = str(method or scope.get("method", "HTTP"))
                MCP_CONNECTION["last_path"] = raw_path
                MCP_CONNECTION["last_error"] = ""
            log("MCP IN method=%s path=%s jsonrpc_id=%s" % (
                method or scope.get("method", "HTTP"), raw_path,
                request_obj.get("id", "-") if isinstance(request_obj, dict) else "-"))
            # Legacy 2025 clients receive their negotiated session/version headers.
            # Stateless 2026 clients must never receive legacy session metadata.
            local_response_headers = [] if modern_mode else [
                (key.lower(), value) for key, value in scope.get("headers", [])
                if key.lower() in (b"mcp-session-id", b"mcp-protocol-version")
            ]

            # Return the pre-warmed native Unreal tool catalog immediately. The first
            # native tools/list can be expensive; it is fetched on localhost before the
            # public MCP handshake, never while a Cloudflare request is waiting.
            if method == "tools/list":
                with MCP_NATIVE_TOOLS_CACHE_LOCK:
                    cached_tools_response = MCP_NATIVE_TOOLS_CACHE
                if isinstance(cached_tools_response, dict):
                    cached_response = json.loads(json.dumps(cached_tools_response, ensure_ascii=False))
                    cached_response["id"] = request_obj.get("id") if isinstance(request_obj, dict) else None
                    result_obj = cached_response.get("result")
                    if isinstance(result_obj, dict) and isinstance(result_obj.get("tools"), list):
                        existing_names = {item.get("name") for item in result_obj["tools"] if isinstance(item, dict)}
                        for item in FILE_MANAGER_MCP_TOOLS:
                            if item.get("name") not in existing_names:
                                result_obj["tools"].append(item)
                        if modern_mode:
                            _normalize_modern_mcp_result(cached_response, "tools/list")
                        log("MCP tools/list served from local cache; total_tool_count=%s" % len(result_obj["tools"]))
                        await send_mcp_json(send, cached_response, headers=local_response_headers)
                        return
                else:
                    log("MCP tools/list cache is empty; falling back to native upstream request")

            # File Manager URL/status are served locally; no viewport monitoring is performed.
            if method == "tools/call" and isinstance(params, dict) and params.get("name") in ("file_manager_get_url", "file_manager_get_status"):
                tool_name = params.get("name")
                args = params.get("arguments") or {}
                if tool_name == "file_manager_get_url":
                    result_value = {"file_manager_url": file_manager_public_url(), "username": FILE_MANAGER_USERNAME,
                                    "authentication": "HTTP Basic; password is the GitHub Actions secret MONITOR_PASSWORD",
                                    "mcp_url": (FILE_MANAGER_STATE.get("public_base_url", "").rstrip("/") + "/mcp") if FILE_MANAGER_STATE.get("public_base_url") else ""}
                else:
                    with MONITOR_LOCK:
                        events = [dict(item) for item in list(MONITOR_EVENTS)[:20]]
                        result_value = {"ok": True, "bridge_connected": bridge_connected(),
                            "file_manager_url": file_manager_public_url(), "mcp_connection": dict(MCP_CONNECTION),
                            "current_project": str(_current_project()) if "_current_project" in globals() else str(ROOT / "UEControl" / "UEControl.uproject"),
                            "events": events, "time": time.time()}
                    try:
                        result_value["events"] = result_value["events"][:max(1, min(20, int(args.get("limit", 20))))]
                    except Exception:
                        result_value["events"] = result_value["events"][:20]
                response_obj = {"jsonrpc": "2.0", "id": request_obj.get("id"),
                                "result": {"resultType": "complete", "content": [{"type": "text", "text": json.dumps(result_value, ensure_ascii=False, default=str)}]}}
                if modern_mode:
                    _normalize_modern_mcp_result(response_obj, "tools/call")
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            extra_tool_names = {
                "file_manager_list_roots", "file_manager_list_directory", "file_manager_create_zip",
                "file_manager_create_folder", "file_manager_rename_path", "file_manager_delete_path",
                "unreal_monitor_get_scene", "unreal_monitor_get_scene_status", "unreal_monitor_list_projects", "unreal_switch_project",
                "unreal_monitor_list_plugins", "unreal_monitor_set_plugin_enabled", "unreal_save_all_dirty_assets",
                "unreal_create_project_checkpoint", "unreal_package_project", "unreal_get_package_status",
                "unreal_get_system_status", "mcp_gateway_list_servers", "mcp_gateway_add_server",
                "mcp_gateway_remove_server", "mcp_gateway_list_tools", "mcp_gateway_call_tool",
                "unreal_install_plugin_from_zip", "unreal_run_headless_python",
                "unreal_get_headless_job_status", "unreal_cancel_headless_job",
                "unreal_execute_console_command", "unreal_wait_python_job",
                "unreal_save_current_world_as_project_map"
            }
            if method == "tools/call" and isinstance(params, dict) and params.get("name") in extra_tool_names:
                tool_name = params.get("name")
                args = params.get("arguments") or {}
                event_id = monitor_event_start(tool_name, args)
                failed = False
                try:
                    value = _handle_extra_mcp_tool(tool_name, args)
                    monitor_event_finish(event_id, 200, response_preview=json.dumps(safe_monitor_value(value), ensure_ascii=False))
                except Exception as exc:
                    failed = True
                    value = {"ok": False, "error": str(exc)}
                    log("Extended MCP tool failed (%s): %s" % (tool_name, repr(exc)))
                    monitor_event_finish(event_id, 400, str(exc), json.dumps(value, ensure_ascii=False))
                response_obj = mcp_text_result(send, request_obj, value, failed)
                if modern_mode:
                    _normalize_modern_mcp_result(response_obj, "tools/call")
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            if method == "tools/call" and isinstance(params, dict) and params.get("name") == "unreal_upload_binary_file":
                args = params.get("arguments") or {}
                event_id = monitor_event_start("unreal_upload_binary_file", args)
                failed = False
                try:
                    encoded = str(args.get("content_base64") or "")
                    if len(encoded) > ((UPLOAD_SINGLE_FILE_LIMIT + 2) // 3) * 4 + 16:
                        raise ValueError("Base64 content exceeds 8 MiB; use a smaller image/file")
                    try:
                        data = base64.b64decode(encoded, validate=True)
                    except (binascii.Error, ValueError) as exc:
                        raise ValueError("content_base64 is not valid Base64: " + str(exc))
                    if len(data) > UPLOAD_SINGLE_FILE_LIMIT:
                        raise ValueError("Direct upload limit is 8 MiB")
                    target = upload_target(args.get("filename", ""), args.get("destination_folder", ""))
                    value = store_uploaded_bytes(target, data, bool(args.get("overwrite", False)))
                    monitor_event_finish(event_id, 200, response_preview=json.dumps(safe_monitor_value(value), ensure_ascii=False))
                except Exception as exc:
                    failed = True
                    value = {"ok": False, "error": str(exc)}
                    monitor_event_finish(event_id, 400, str(exc), json.dumps(value, ensure_ascii=False))
                response_obj = mcp_text_result(send, request_obj, value, failed)
                if modern_mode:
                    _normalize_modern_mcp_result(response_obj, "tools/call")
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            # Release assets are public; only authenticated MCP callers that explicitly confirm can publish.
            if method == "tools/call" and isinstance(params, dict) and params.get("name") == "github_release_upload_file":
                tool_name = params.get("name")
                args = params.get("arguments") or {}
                event_id = monitor_event_start(tool_name, args)
                value, failed = None, False
                try:
                    if args.get("confirm_public_upload") is not True:
                        raise ValueError("confirm_public_upload must be true; Release assets are public")
                    if not RELEASE_UPLOAD_LOCK.acquire(blocking=False):
                        raise RuntimeError("another GitHub Release upload is already running")
                    try:
                        source = _fs_resolve(args.get("source", ""))
                        if not source.is_file():
                            raise FileNotFoundError("source file not found: " + str(source))
                        tag = str(args.get("tag") or "ue5.8").strip()
                        filename = str(args.get("filename") or source.name).strip()
                        filename = _fs_safe_name(filename)
                        if args.get("replace_existing") is not True:
                            suffix = Path(filename).suffix
                            stem = filename[:-len(suffix)] if suffix else filename
                            filename = stem[:100] + "_" + time.strftime("%Y%m%d_%H%M%S") + "_" + uuid.uuid4().hex[:5] + suffix
                        log("GITHUB_RELEASE_UPLOAD_STARTED_VIA_MCP tag=%s path=%s asset=%s" % (tag, source, filename))
                        value = github_release_upload(source, tag, filename)
                        log("GITHUB_RELEASE_UPLOAD_COMPLETED_VIA_MCP tag=%s path=%s bytes=%s" % (tag, source, source.stat().st_size))
                    finally:
                        RELEASE_UPLOAD_LOCK.release()
                    monitor_event_finish(event_id, 200, response_preview=json.dumps(safe_monitor_value(value), ensure_ascii=False))
                except Exception as exc:
                    failed = True
                    value = {"ok": False, "error": str(exc)}
                    log("GitHub Release MCP upload failed: " + repr(exc))
                    monitor_event_finish(event_id, 400, str(exc), json.dumps(value, ensure_ascii=False))
                response_obj = mcp_text_result(send, request_obj, value, failed)
                if modern_mode:
                    _normalize_modern_mcp_result(response_obj, "tools/call")
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            native_tool_lock_acquired = False
            if method == "tools/call":
                try:
                    # One native Unreal tool at a time. Fail fast rather than allowing
                    # concurrent requests to queue behind an Editor operation until the
                    # outer MCP connector's request deadline expires.
                    await asyncio.wait_for(MCP_NATIVE_TOOL_LOCK.acquire(), timeout=8.0)
                    native_tool_lock_acquired = True
                except asyncio.TimeoutError:
                    with MONITOR_LOCK:
                        MCP_CONNECTION["last_status"] = 409
                        MCP_CONNECTION["last_error"] = "Another Unreal tool call is still running."
                    request_id = request_obj.get("id") if isinstance(request_obj, dict) else None
                    busy = {"jsonrpc": "2.0", "id": request_id,
                            "error": {"code": -32004, "message": "Another Unreal Editor tool call is still running. Wait for it to finish, then retry this request."}}
                    await send_mcp_json(send, busy, status=200)
                    return

            event_id = None
            if method == "tools/call" and isinstance(params, dict):
                event_id = monitor_event_start(params.get("name", "unknown"), params.get("arguments", {}))

            log("MCP request: %s %s -> %s; method=%s" % (
                scope.get("method", "POST"), raw_path, target, method or "non-JSON-RPC"))
            try:
                # Bound upstream waits to stay inside the external MCP connector deadline. The native Unreal MCP endpoint returns one
                # finite response for POST; unlimited streaming waits can leave a
                # Cloudflare request hanging until the client cancels it.
                mcp_timeout = httpx.Timeout(connect=10.0, read=120.0, write=60.0, pool=15.0)
                async with httpx.AsyncClient(timeout=mcp_timeout, trust_env=False) as client:
                    upstream_body = bytes(body)
                    # tools/list: stop at the matching SSE event rather than waiting for EOF.
                    # Modern/stateless clients get a fresh private Unreal legacy session per request.
                    if method == "tools/list" and scope.get("method", "POST").upper() == "POST":
                        if modern_mode:
                            status, response_headers, raw_headers, raw, parsed, was_sse = await _mcp_post_modern_via_fresh_legacy_session(
                                client, target, forwarded, request_obj, upstream_body)
                            if status == 404:
                                status, response_headers, raw_headers, raw, parsed, was_sse = await _mcp_post_modern_via_fresh_legacy_session(
                                    client, target, forwarded, request_obj, upstream_body)
                        else:
                            status, response_headers, raw_headers, raw, parsed, was_sse = await mcp_post_and_read(
                                client, target, forwarded, request_obj, content=upstream_body)
                        native_session = response_headers.get("mcp-session-id", "")
                        if native_session:
                            with MCP_SESSION_LOCK:
                                MCP_NATIVE_SESSIONS[native_session] = {"seen": time.time()}
                            with MONITOR_LOCK:
                                MCP_CONNECTION["last_session_seen"] = time.time()
                        if isinstance(parsed, dict) and isinstance(parsed.get("result"), dict) and isinstance(parsed["result"].get("tools"), list):
                            existing = {item.get("name") for item in parsed["result"]["tools"] if isinstance(item, dict)}
                            for item in FILE_MANAGER_MCP_TOOLS:
                                if item["name"] not in existing:
                                    parsed["result"]["tools"].append(item)
                            if modern_mode:
                                _normalize_modern_mcp_result(parsed, "tools/list")
                            headers = _mcp_downstream_headers(raw_headers, modern_mode=modern_mode)
                            await send_mcp_json(send, parsed, headers=headers, status=status)
                            return
                        if was_sse:
                            error_obj = {"jsonrpc": "2.0", "id": request_obj.get("id") if isinstance(request_obj, dict) else None,
                                         "error": {"code": -32603, "message": "Upstream tools/list SSE had no matching JSON-RPC reply"}}
                            await send_mcp_json(send, error_obj, status=502)
                            return
                        with MONITOR_LOCK:
                            MCP_CONNECTION["last_status"] = int(status)
                            if status >= 400:
                                MCP_CONNECTION["last_error"] = "tools/list upstream HTTP %s" % status
                        log("MCP tools/list upstream response: status=%s; content-type=%s; parsed_jsonrpc=%s" % (
                            status, response_headers.get("content-type", ""), bool(parsed)))
                        out_headers = _mcp_downstream_headers(raw_headers, modern_mode=modern_mode)
                        await send({"type": "http.response.start", "status": status, "headers": out_headers})
                        await send({"type": "http.response.body", "body": raw, "more_body": False})
                        return

                    if modern_mode:
                        status, response_headers_obj, raw_headers, raw, parsed, was_sse = await _mcp_post_modern_via_fresh_legacy_session(
                            client, target, forwarded, request_obj, upstream_body)
                        if method == "tools/call" and status == 404:
                            status, response_headers_obj, raw_headers, raw, parsed, was_sse = await _mcp_post_modern_via_fresh_legacy_session(
                                client, target, forwarded, request_obj, upstream_body)
                        response_headers = _mcp_downstream_headers(raw_headers, modern_mode=True)
                        if isinstance(parsed, dict):
                            _normalize_modern_mcp_result(parsed, method)
                            await send_mcp_json(send, parsed, headers=response_headers, status=status)
                        elif was_sse:
                            error_obj = {"jsonrpc": "2.0", "id": request_obj.get("id") if isinstance(request_obj, dict) else None,
                                         "error": {"code": -32603, "message": "Upstream modern MCP SSE had no matching JSON-RPC reply"}}
                            await send_mcp_json(send, error_obj, headers=response_headers, status=502)
                        else:
                            await send({"type": "http.response.start", "status": status, "headers": response_headers})
                            await send({"type": "http.response.body", "body": raw, "more_body": False})
                        if event_id:
                            monitor_event_finish(event_id, status,
                                                 response_preview=monitor_response_preview(raw[:12000]))
                        return

                    async with client.stream(scope.get("method", "POST"), target, headers=forwarded, content=upstream_body) as response:
                        # Return on the matching SSE JSON-RPC event instead of reading
                        # the entire (potentially persistent) event stream to EOF.
                        response_body, parsed_response, was_sse = await read_mcp_http_reply(response, request_obj)
                        response_headers = [(k.lower(), v) for k, v in response.headers.raw
                                            if k.decode("latin1").lower() not in hop_by_hop]
                        if was_sse and not isinstance(parsed_response, dict):
                            raise RuntimeError("Unreal MCP SSE response was not a JSON-RPC object")
                        session_id = response.headers.get("mcp-session-id", "")
                        if session_id:
                            with MCP_SESSION_LOCK:
                                MCP_NATIVE_SESSIONS[session_id] = {"seen": time.time()}
                                cutoff = time.time() - 3600
                                for old_session, row in list(MCP_NATIVE_SESSIONS.items()):
                                    if row.get("seen", 0) < cutoff:
                                        MCP_NATIVE_SESSIONS.pop(old_session, None)
                                if len(MCP_NATIVE_SESSIONS) > 50:
                                    oldest = sorted(MCP_NATIVE_SESSIONS.items(), key=lambda item: item[1].get("seen", 0))[:-50]
                                    for old_session, _ in oldest:
                                        MCP_NATIVE_SESSIONS.pop(old_session, None)
                            with MONITOR_LOCK:
                                MCP_CONNECTION["last_session_seen"] = time.time()
                        elif method == "initialize":
                            log("MCP initialize response did not include Mcp-Session-Id header")
                        if method == "initialize" and response.status_code == 200:
                            global MCP_LEGACY_SESSION_ID, MCP_LEGACY_SESSION_INITIALIZED
                            MCP_LEGACY_SESSION_ID = session_id
                            MCP_LEGACY_SESSION_INITIALIZED = True
                        with MONITOR_LOCK:
                            MCP_CONNECTION["last_status"] = int(response.status_code)
                            if response.status_code >= 400:
                                MCP_CONNECTION["last_error"] = "Upstream MCP HTTP %s" % response.status_code
                        log("MCP upstream response: status=%s; content-type=%s; protocol-version=%s; session-id-present=%s" % (
                            response.status_code, response.headers.get("content-type", ""),
                            response.headers.get("mcp-protocol-version", ""), bool(session_id)))
                        if was_sse:
                            await send_mcp_json(send, parsed_response, headers=response_headers, status=response.status_code)
                        else:
                            await send({"type": "http.response.start", "status": response.status_code, "headers": response_headers})
                            await send({"type": "http.response.body", "body": response_body, "more_body": False})
                        if event_id:
                            monitor_event_finish(event_id, response.status_code,
                                                 response_preview=monitor_response_preview(response_body[:12000]))
            except Exception as exc:
                is_timeout = isinstance(exc, (httpx.TimeoutException, TimeoutError))
                diagnostic_status = 504 if is_timeout else 502
                with MONITOR_LOCK:
                    MCP_CONNECTION["last_status"] = diagnostic_status
                    MCP_CONNECTION["last_error"] = str(exc)[:500]
                if event_id:
                    monitor_event_finish(event_id, diagnostic_status, repr(exc))
                log("Native MCP proxy %s: %s: %s" % ("timeout" if is_timeout else "error", type(exc).__name__, str(exc)[:1200]))
                log("Native MCP proxy traceback: %s" % traceback.format_exc()[-4000:])
                request_id = request_obj.get("id") if isinstance(request_obj, dict) else None
                if isinstance(request_obj, dict) and request_obj.get("jsonrpc") == "2.0" and request_id is not None:
                    message = ("Unreal native MCP did not answer within the configured 120-second limit. "
                               "The Editor may be busy; wait for the current operation to finish before retrying.") if is_timeout else (
                               "Unreal native MCP proxy failed: " + type(exc).__name__ + ": " + str(exc)[:400])
                    rpc_error = {"jsonrpc": "2.0", "id": request_id,
                                 "error": {"code": -32002 if is_timeout else -32003, "message": message}}
                    await send_mcp_json(send, rpc_error, status=200,
                                        headers=[(b"x-ue-mcp-diagnostic", b"upstream-timeout" if is_timeout else b"upstream-error")])
                else:
                    err = json.dumps({"ok": False, "error": "native_mcp_proxy_timeout" if is_timeout else "native_mcp_proxy_failed",
                                      "detail": type(exc).__name__ + ": " + str(exc)[:600]}, separators=(",", ":")).encode("utf-8")
                    await send({"type": "http.response.start", "status": diagnostic_status,
                                "headers": [(b"content-type", b"application/json; charset=utf-8"), (b"content-length", str(len(err)).encode())]})
                    await send({"type": "http.response.body", "body": err})
            finally:
                if native_tool_lock_acquired:
                    MCP_NATIVE_TOOL_LOCK.release()

        @app.post("/internal/mcp/warmup")
        @bridge_auth
        def internal_mcp_tools_warmup():
            """Pre-enumerate native Unreal MCP tools locally before public handshake tests."""
            started = time.time()
            try:
                parsed = asyncio.run(_fetch_native_tools_cache(timeout_seconds=210))
                native_count = len(parsed.get("result", {}).get("tools", []))
                total_count = native_count + len(FILE_MANAGER_MCP_TOOLS)
                return jsonify(ok=True, native_tool_count=native_count, total_tool_count=total_count,
                               elapsed_seconds=round(time.time() - started, 2), cached=True)
            except Exception as exc:
                log("MCP local warmup endpoint failed: %s: %s" % (type(exc).__name__, str(exc)[:1500]))
                return jsonify(ok=False, error=str(exc), elapsed_seconds=round(time.time() - started, 2)), 502

        # One public MCP endpoint: /mcp (with / as a compatibility alias) proxies Unreal's native AllToolsets server
        # and adds File Manager tools plus guarded Release upload tools to tools/list.
        # REST fallback endpoints remain available under the same tunnel host and use Basic auth.
        # Keep Flask/REST as the fallback app, but dispatch MCP paths BEFORE Starlette
        # routing. This avoids Mount slash-normalization differences that can send
        # /mcp or /mcp/ to Flask and produce the observed public HTTP 404.
        combined_app = Starlette(routes=[
            Mount("/", app=WSGIMiddleware(app))
        ], lifespan=lifespan)

        async def public_app(scope, receive, send):
            if scope.get("type") == "http":
                request_path = scope.get("path", "/") or "/"
                canonical_request_path = request_path.rstrip("/") or "/"
                # Canonical endpoint is exactly /mcp (no trailing slash). Both /mcp
                # and /mcp/ are accepted without redirect so POST bodies are preserved.
                # Root is a compatibility alias; /health and /files stay on Flask.
                if canonical_request_path in ("/", "/mcp"):
                    mcp_scope = dict(scope)
                    if canonical_request_path == "/mcp":
                        remainder = "/"
                    else:
                        remainder = "/"
                    mcp_scope["path"] = remainder or "/"
                    await native_mcp_proxy(mcp_scope, receive, send)
                    return
            await combined_app(scope, receive, send)

        if __name__ == "__main__":
            if not BRIDGE_TOKEN: raise RuntimeError("BRIDGE_TOKEN must be set")
