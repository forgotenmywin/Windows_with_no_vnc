name: Unreal Engine 5.8 - Windows RDP + noVNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal-engine:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            "D:\UE58\Parts", `
            "D:\UE58\Extracted", `
            "D:\UE58\Logs" | Out-Null

          Write-Host "Folders ready."

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Set RDP_PASSWORD in repository Actions secrets."
          }

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name "ueadmin" `
              -Password $securePassword `
              -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member "ueadmin"
          }
          else {
            Set-LocalUser -Name "runneradmin" -Password $securePassword
          }

          Restart-Service -Name TermService -Force
          Write-Host "RDP configured."

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Set VNC_PASSWORD in repository Actions secrets."
          }

          if ($env:VNC_PASSWORD.Length -gt 8) {
            throw "TightVNC password must be 8 characters or fewer."
          }

          $installer = "D:\UE58\tightvnc-installer.msi"
          $url = "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi"

          try {
            Invoke-WebRequest -Uri $url -OutFile $installer
          }
          catch {
            $url = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
            Invoke-WebRequest -Uri $url -OutFile $installer
          }

          $arguments = @(
            "/i"
            "`"$installer`""
            "/qn"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$($env:VNC_PASSWORD)"
          ) -join " "

          $process = Start-Process msiexec.exe `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "TightVNC installation failed: $($process.ExitCode)"
          }

          Start-Service -Name tvnserver -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          Get-Service -Name tvnserver -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

      - name: Install noVNC and websockify
        shell: pwsh
        run: |
          $noVncDir = "D:\UE58\noVNC"
          New-Item -ItemType Directory -Force -Path $noVncDir | Out-Null

          $zip = "D:\UE58\novnc.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.zip" `
            -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath "D:\UE58" -Force

          $sourceDir = "D:\UE58\noVNC-1.6.0"
          if (Test-Path $sourceDir) {
            Copy-Item "$sourceDir\*" $noVncDir -Recurse -Force
          }

          py -m pip install --upgrade pip
          py -m pip install websockify

          $scripts = py -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $websockify = Join-Path $scripts.Trim() "websockify.exe"

          if (-not (Test-Path $websockify)) {
            throw "websockify.exe not found at $websockify"
          }

          $websockifyLog = "D:\UE58\Logs\websockify.log"

          Start-Process `
            -FilePath $websockify `
            -ArgumentList @(
              "--web", $noVncDir,
              "6080",
              "127.0.0.1:5900"
            ) `
            -RedirectStandardOutput $websockifyLog `
            -RedirectStandardError "D:\UE58\Logs\websockify-error.log" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          if (-not (Get-NetTCPConnection -LocalPort 6080 -State Listen -ErrorAction SilentlyContinue)) {
            Get-Content $websockifyLog -ErrorAction SilentlyContinue
            throw "websockify did not start on port 6080."
          }

          Write-Host "noVNC and websockify started."

      - name: Start Cloudflare tunnel
        shell: pwsh
        run: |
          $cf = "D:\UE58\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cf

          Start-Process `
            -FilePath $cf `
            -ArgumentList @("tunnel", "--url", "http://127.0.0.1:6080") `
            -RedirectStandardOutput "D:\UE58\Logs\cloudflared.log" `
            -RedirectStandardError "D:\UE58\Logs\cloudflared-error.log" `
            -WindowStyle Hidden

          $tunnelUrl = $null

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2

            $logs = Get-Content "D:\UE58\Logs\cloudflared-error.log" `
              -ErrorAction SilentlyContinue

            $match = $logs | Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com'

            if ($match) {
              $tunnelUrl = [regex]::Match(
                ($match | Select-Object -Last 1).Line,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              ).Value
              break
            }
          }

          if ($tunnelUrl) {
            Write-Host "noVNC URL: $tunnelUrl/vnc.html?autoconnect=true&resize=scale"
          }
          else {
            Write-Host "Tunnel URL not detected yet. Check cloudflared-error.log."
            Get-Content "D:\UE58\Logs\cloudflared-error.log" -Tail 30 `
              -ErrorAction SilentlyContinue
          }

      - name: Download Unreal Engine ZIP parts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $owner = "forgotenmywin"
          $repo = "Windows_with_no_vnc"
          $tag = "ue5.8"
          $api = "https://api.github.com/repos/$owner/$repo/releases/tags/$tag"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod -Uri $api -Headers $headers

          $expected = @(
            "UE_5.8.zip.001",
            "UE_5.8.zip.002",
            "UE_5.8.zip.003",
            "UE_5.8.zip.004",
            "UE_5.8.zip.005",
            "UE_5.8.zip.006",
            "UE_5.8.zip.007",
            "UE_5.8.zip.008"
          )

          foreach ($name in $expected) {
            $asset = $release.assets |
              Where-Object { $_.name -eq $name } |
              Select-Object -First 1

            if ($null -eq $asset) {
              throw "Release asset missing: $name"
            }

            $destination = Join-Path "D:\UE58\Parts" $name

            Write-Host "Downloading $name ($($asset.size) bytes)"

            curl.exe -L `
              --fail `
              --retry 5 `
              --retry-delay 3 `
              -H "Authorization: Bearer $env:GH_TOKEN" `
              -o $destination `
              $asset.url

            if ($LASTEXITCODE -ne 0) {
              throw "Download failed: $name"
            }

            $actualSize = (Get-Item $destination).Length

            if ($actualSize -ne $asset.size) {
              throw "Size mismatch for $name. Expected $($asset.size), got $actualSize"
            }

            Write-Host "Verified $name : $actualSize bytes"
          }

      - name: Rebuild and test ZIP
        shell: pwsh
        run: |
          $output = "D:\UE58\UE_5.8.zip"
          if (Test-Path $output) {
            Remove-Item $output -Force
          }

          $parts = 1..8 | ForEach-Object {
            "D:\UE58\Parts\UE_5.8.zip.{0:D3}" -f $_
          }

          $stream = [System.IO.File]::Create($output)

          try {
            foreach ($part in $parts) {
              if (-not (Test-Path $part)) {
                throw "Missing part: $part"
              }

              Write-Host "Joining $part"
              $inputStream = [System.IO.File]::OpenRead($part)

              try {
                $inputStream.CopyTo($stream)
              }
              finally {
                $inputStream.Dispose()
              }
            }
          }
          finally {
            $stream.Dispose()
          }

          Write-Host "Rebuilt ZIP size: $((Get-Item $output).Length) bytes"

          $sevenZip = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $sevenZip) {
            $sevenZipInstaller = "D:\UE58\7zip-installer.exe"
            Invoke-WebRequest `
              -Uri "https://www.7-zip.org/a/7z2409-x64.exe" `
              -OutFile $sevenZipInstaller

            Start-Process $sevenZipInstaller `
              -ArgumentList "/S" -Wait

            $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          }

          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip executable not found."
          }

          & $sevenZip t $output

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity test failed."
          }

          Write-Host "ZIP integrity test passed."

      - name: Extract Unreal Engine
        shell: pwsh
        run: |
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          $archive = "D:\UE58\UE_5.8.zip"
          $destination = "D:\UE58\Extracted"

          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          & $sevenZip x $archive "-o$destination" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Unreal Engine extraction failed."
          }

          Write-Host "Extraction completed."

          Get-ChildItem $destination -Force |
            Select-Object Name, FullName |
            Format-Table -AutoSize

      - name: Keep runner alive
        if: always()
        shell: pwsh
        run: |
          Write-Host "Runner keepalive started."
          Write-Host "Unreal Engine folder: D:\UE58\Extracted"

          while ($true) {
            $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            $vnc = Get-Process -Name "tvnserver" -ErrorAction SilentlyContinue
            $ws = Get-Process -Name "websockify" -ErrorAction SilentlyContinue
            $cf = Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue

            $vncState = if ($vnc) { "RUNNING" } else { "STOPPED" }
            $wsState = if ($ws) { "RUNNING" } else { "STOPPED" }
            $cfState = if ($cf) { "RUNNING" } else { "STOPPED" }

            Write-Host "[$now] ACTIVE | VNC=$vncState | Websockify=$wsState | Cloudflare=$cfState"

            Start-Sleep -Seconds 60
          }
