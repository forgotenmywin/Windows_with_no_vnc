                    raise ValueError("confirm_switch=true is required; the Editor will restart")
                project = Path(args.get("project_file", "")).resolve()
                save_code = "import unreal\nprint('SAVE_DIRTY_RESULT=' + str(unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)))"
                if bridge_connected():
                    save_result, save_status = queue_unreal(save_code, 25)
                    if save_status != 200:
                        raise RuntimeError("Could not save before project switch: " + str(save_result))
                prep = prepare_project(project, ensure_remote_plugins=True)
                global CURRENT_PROJECT_FILE
                CURRENT_PROJECT_FILE = project
                cmd = _write_editor_command("open_project", project)
                return {"ok": True, "project_file": str(project), "backup": prep.get("backup"), "restart": cmd}
            if name == "unreal_save_all_dirty_assets":
                code = "import unreal\nprint('SAVE_DIRTY_RESULT=' + str(unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)))"
                result, status = queue_unreal(code, 18)
                return {"ok": status == 200 and bool(result.get("ok")), "http_status": status, **result}
            if name == "unreal_create_project_checkpoint":
                if bridge_connected():
                    code = "import unreal\nprint('SAVE_DIRTY_RESULT=' + str(unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)))"
                    result, status = queue_unreal(code, 18)
                    if status != 200:
                        raise RuntimeError("Save before checkpoint failed: " + str(result))
                return _create_checkpoint()
            if name == "unreal_package_project":
                if args.get("confirm_build") is not True:
                    raise ValueError("confirm_build=true is required; packaging uses CPU, RAM and disk")
                project = Path(args.get("project_file") or str(_current_project())).resolve()
                if not project.is_file() or project.suffix.lower() != ".uproject" or not _inside_root(project):
                    raise ValueError("project_file must be a valid project under D:\\UE58")
                if bridge_connected() and project == _current_project():
                    save_result, save_status = queue_unreal("import unreal\nprint('SAVE_DIRTY_RESULT=' + str(unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)))", 25)
                    if save_status != 200:
                        raise RuntimeError("Could not save before packaging: " + str(save_result))
                job_id = uuid.uuid4().hex
                PACKAGE_JOBS[job_id] = {"id": job_id, "status": "queued", "project_file": str(project), "created_at": time.time()}
                threading.Thread(target=_package_worker, args=(job_id, str(project)), name="UE-Package-" + job_id[:8], daemon=True).start()
                return {"ok": True, "job_id": job_id, "status": "queued"}
            if name == "unreal_get_package_status":
                job = PACKAGE_JOBS.get(str(args.get("job_id", "")))
                return {"ok": bool(job), "job": job} if job else {"ok": False, "error": "package job not found"}
            if name == "unreal_get_system_status":
                return system_status_payload()
            if name == "mcp_gateway_list_servers":
                registry = _load_mcp_registry()
                return {"ok": True, "servers": [{"name": n, "url": row.get("url", ""),
                        "auth": "Bearer token" if row.get("token_dpapi") else "None"} for n, row in sorted(registry.items())]}
            if name == "mcp_gateway_add_server":
                server_name = str(args.get("name", "")).strip()
                if not re.fullmatch(r"[A-Za-z0-9_-]{2,48}", server_name):
                    raise ValueError("name must use 2-48 letters, numbers, _ or -")
                url = _validate_public_mcp_url(args.get("url"))
                token = _protect_mcp_token(str(args.get("bearer_token", "")).strip())
                registry = _load_mcp_registry()
                registry[server_name] = {"url": url, "token_dpapi": token, "added_at": time.time()}
                _save_mcp_registry(registry)
                return {"ok": True, "name": server_name, "url": url, "auth": "Bearer token" if token else "None"}
            if name == "mcp_gateway_remove_server":
                server_name = str(args.get("name", "")).strip()
                registry = _load_mcp_registry()
                if server_name not in registry:
                    raise ValueError("MCP server not found")
                registry.pop(server_name, None)
                _save_mcp_registry(registry)
                return {"ok": True, "removed": server_name}
            if name == "mcp_gateway_list_tools":
                result = _call_external_mcp(str(args.get("server", "")), "tools/list", {})
                return {"ok": True, "server": args.get("server"), "tools": result.get("result", {}).get("tools", [])}
            if name == "mcp_gateway_call_tool":
                if args.get("confirm_call") is not True:
                    raise ValueError("confirm_call=true is required; remote MCP tools can change external data")
                server = str(args.get("server", ""))
                tool_name = str(args.get("tool_name", ""))
                if not tool_name or len(tool_name) > 200:
                    raise ValueError("tool_name is required")
                arguments = args.get("arguments") or {}
                result = _call_external_mcp(server, "tools/call", {"name": tool_name, "arguments": arguments})
                return {"ok": True, "server": server, "tool_name": tool_name, "result": result}
            raise ValueError("Unknown monitor tool: " + str(name))


        # MCP server (MCP Python SDK v2). Public MCP has no authentication in this test workflow.
        from contextlib import asynccontextmanager
        from starlette.applications import Starlette
        from starlette.middleware.wsgi import WSGIMiddleware
        from starlette.routing import Mount
        import httpx
        from mcp.server.mcpserver import MCPServer
        from mcp.server.transport_security import TransportSecuritySettings
        import uvicorn

        mcp_server = MCPServer("unreal-engine-remote-control", instructions=(
            "Remote tools for Unreal Editor 5.8.4. Tools can execute arbitrary Python in the live Editor "
            "or in a finite headless UnrealEditor-Cmd commandlet. Such scripts run with the Unreal process "
            "OS permissions and can modify project assets and files; the dedicated file-helper tools are "
            "restricted to D:\\UE58. Confirm destructive actions before running them."
        ))

        def mcp_json(value):
            return json.dumps(value, ensure_ascii=False, default=str)

        @mcp_server.tool()
        def unreal_execute_python(code: str, timeout_seconds: int = 10) -> str:
            """Run Python in the Unreal Editor. Returns a job_id if execution takes longer than timeout_seconds; poll with unreal_wait_python_job. This can change the scene/project."""
            # Short first wait avoids MCP client/proxy request timeouts. Long jobs remain pollable.
            timeout_seconds = max(1, min(15, int(timeout_seconds)))
            result, status = queue_unreal(code, timeout_seconds)
            return mcp_json(result if status == 200 else {**result, "http_status": status})

        @mcp_server.tool()
        def unreal_wait_python_job(job_id: str, wait_seconds: int = 10) -> str:
            """Wait briefly for a previously submitted Unreal Python job. Call repeatedly with the returned job_id while status is pending."""
            job_id = str(job_id or "").strip()
            wait_seconds = max(1, min(15, int(wait_seconds)))
            with lock:
                row = waiting.get(job_id)
            if row is None:
                return mcp_json({"ok": False, "error": "job_not_found_or_expired", "job_id": job_id})
            if not row["event"].wait(wait_seconds):
                return mcp_json({"ok": True, "status": "pending", "job_id": job_id})
            with lock:
                row = waiting.pop(job_id, None)
            result = row.get("result") if row else None
            if not result:
                return mcp_json({"ok": False, "error": "missing_result", "job_id": job_id})
            return mcp_json({"ok": not bool(result.get("error")), "status": "completed",
                             "job_id": job_id, "output": result.get("output", ""),
                             "error": result.get("error", "")})

        @mcp_server.tool()
        def unreal_get_engine_version() -> str:
            """Get engine version; returns quickly or a pollable job_id if the editor has not responded yet."""
            result, status = queue_unreal("import unreal\nunreal.SystemLibrary.get_engine_version()", 8)
            return mcp_json(result if status == 200 else {**result, "http_status": status})

        @mcp_server.tool()
        def unreal_list_projects() -> str:
            """List .uproject files under D:\\UE58\\Projects and D:\\UE58\\UEControl."""
            found = []
            for base in (ROOT / "Projects", ROOT / "UEControl"):
                if base.exists():
                    for item in base.rglob("*.uproject"):
                        found.append({"name": item.stem, "project_file": str(item), "directory": str(item.parent)})
            found.sort(key=lambda x: x["name"].lower())
            return mcp_json({"ok": True, "count": len(found), "projects": found})

        @mcp_server.tool()
        def unreal_list_files(path: str = "", recursive: bool = False, limit: int = 200) -> str:
            """List files and directories inside D:\\UE58."""
            try:
                folder = ROOT if not str(path).strip() else safe_path(path)
                if not folder.is_dir(): return mcp_json({"ok": False, "error": "directory not found", "path": str(folder)})
                limit = max(1, min(500, int(limit)))
                iterator = folder.rglob("*") if recursive else folder.iterdir()
                items = []
                for item in iterator:
                    try: items.append({"name": item.name, "path": str(item), "is_directory": item.is_dir(), "size": None if item.is_dir() else item.stat().st_size})
                    except OSError: continue
                    if len(items) >= limit: break
                return mcp_json({"ok": True, "path": str(folder), "count": len(items), "limit": limit, "truncated_or_limited": len(items) >= limit, "items": items})
            except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def unreal_read_text_file(path: str, max_chars: int = 20000) -> str:
            """Read a UTF-8 text file inside D:\\UE58."""
            try:
                target = safe_path(path)
                if not target.is_file(): return mcp_json({"ok": False, "error": "file not found", "path": str(target)})
                max_chars = max(1, min(100000, int(max_chars)))
                with target.open("r", encoding="utf-8-sig", errors="replace") as stream: content = stream.read(max_chars + 1)
                return mcp_json({"ok": True, "path": str(target), "content": content[:max_chars], "truncated": len(content) > max_chars})
            except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def unreal_write_text_file(path: str, content: str) -> str:
            """Write a UTF-8 text file inside D:\\UE58, creating parent folders if needed."""
            try:
                if len(content) > 2000000: return mcp_json({"ok": False, "error": "content exceeds 2 MB"})
                target = safe_path(path); target.parent.mkdir(parents=True, exist_ok=True)
                target.write_text(content, encoding="utf-8")
                return mcp_json({"ok": True, "path": str(target), "size": target.stat().st_size})
            except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def google_drive_list_files(folder_id: str = "root", page_size: int = 100) -> str:
            """List files in a Google Drive folder available to GG_UE_TOKEN."""
            try:
                folder_id = str(folder_id or "root"); page_size = max(1, min(1000, int(page_size)))
                query = "trashed = false"
                if folder_id != "*": query += " and '" + folder_id.replace("'", "") + "' in parents"
                result = google_drive().files().list(q=query, pageSize=page_size, orderBy="name", fields="files(id,name,mimeType,size,modifiedTime,webViewLink,parents)").execute(num_retries=2)
                return mcp_json({"ok": True, "count": len(result.get("files", [])), "files": result.get("files", [])})
            except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def google_drive_download_file(file_id: str, destination: str) -> str:
            """Download a Google Drive file to a path under D:\\UE58."""
            try:
                target = safe_path(destination); target.parent.mkdir(parents=True, exist_ok=True)
                from googleapiclient.http import MediaIoBaseDownload
                media = google_drive().files().get_media(fileId=file_id)
                with target.open("wb") as handle:
                    downloader = MediaIoBaseDownload(handle, media, chunksize=8 * 1024 * 1024); done = False
                    while not done: _, done = downloader.next_chunk(num_retries=2)
                return mcp_json({"ok": True, "file_id": file_id, "destination": str(target), "size": target.stat().st_size})
            except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def google_drive_upload_file(source: str, drive_folder_id: str = "root", filename: str = "") -> str:
            """Upload a file from D:\\UE58 to Google Drive."""
            try:
                target = safe_path(source)
                if not target.is_file(): return mcp_json({"ok": False, "error": "source file not found", "source": str(target)})
                metadata = {"name": filename or target.name}
                if drive_folder_id and drive_folder_id != "root": metadata["parents"] = [drive_folder_id]
                return mcp_json({"ok": True, "file": upload_drive_file(target, metadata)})
            except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def github_release_upload_file(source: str, tag: str, filename: str = "", release_name: str = "", release_notes: str = "") -> str:
            """Upload a file to a release in the current repository; large files are split into sub-2GB assets."""
            try:
                target = safe_path(source)
                if not target.is_file(): return mcp_json({"ok": False, "error": "source file not found", "source": str(target)})
                return mcp_json(github_release_upload(target, tag, filename, release_name, release_notes))
            except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def unreal_take_screenshot(timeout_seconds: int = 60) -> str:
            """Capture a 1920x1080 Unreal screenshot and return its saved path."""
            out = ROOT / "Screenshots" / ("ue_mcp_" + time.strftime("%Y%m%d_%H%M%S") + ".png")
            target = str(out).replace("\\", "/")
            code = ("import unreal\nworld = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()\n" +
                    "unreal.SystemLibrary.execute_console_command(world, 'HighResShot 1920x1080 filename=\\\"" + target + "\\\"')\n" + repr("SCREENSHOT_REQUESTED " + target))
            result, status = queue_unreal(code, timeout_seconds)
            if status != 200 or not result.get("ok"): return mcp_json(result)
            deadline = time.time() + 30
            while time.time() < deadline:
                if out.is_file() and out.stat().st_size > 0: return mcp_json({"ok": True, "path": str(out), "size": out.stat().st_size})
                time.sleep(1)
            return mcp_json({"ok": False, "error": "screenshot_file_not_created"})

        @mcp_server.tool()
        def unreal_rename_project(project_file: str, new_name: str) -> str:
            """Rename an existing .uproject file under D:\\UE58 (not its parent folder)."""
            try:
                source = safe_path(project_file); new_name = str(new_name).strip()
                if not re.fullmatch(r"[A-Za-z0-9_-]{1,80}", new_name): return mcp_json({"ok": False, "error": "invalid new_name"})
                if source.suffix.lower() != ".uproject" or not source.is_file(): return mcp_json({"ok": False, "error": "existing .uproject file required"})
                target = source.with_name(new_name + ".uproject")
                if target.exists() and target != source: return mcp_json({"ok": False, "error": "target already exists"})
                source.rename(target)
                return mcp_json({"ok": True, "old_path": str(source), "project_file": str(target)})
            except Exception as exc: return mcp_json({"ok": False, "error": str(exc)})

        def upload_target(filename: str, destination_folder: str = ""):
            """Resolve a filename under D:\\UE58\\Uploads only."""
            filename = str(filename or "").strip()
            if (not filename or filename in (".", "..")
                or Path(filename).name != filename
                or any(ch in filename for ch in ("/", "\\", "\r", "\n", "\x00"))):
                raise ValueError("filename must be a simple filename without path components")
            folder_value = str(destination_folder or "").replace("\\", "/").strip(" /")
            folder_parts = [] if not folder_value else folder_value.split("/")
            if any(part in ("", ".", "..") or ":" in part for part in folder_parts):
                raise ValueError("destination_folder must be a relative folder under Uploads")
            folder = UPLOAD_ROOT.joinpath(*folder_parts).resolve()
            if folder != UPLOAD_ROOT and UPLOAD_ROOT not in folder.parents:
                raise ValueError("destination must remain inside D:\\UE58\\Uploads")
            folder.mkdir(parents=True, exist_ok=True)
            target = (folder / filename).resolve()
            if target.parent != folder:
                raise ValueError("destination must remain inside its selected Uploads folder")
            return target

        def store_uploaded_bytes(target: Path, data: bytes, overwrite: bool = False):
            if not data:
                raise ValueError("file content is empty")
            if target.exists() and not overwrite:
                raise FileExistsError("target already exists; set overwrite=true to replace it")
            temp = target.with_name(target.name + ".uploading-" + uuid.uuid4().hex)
            try:
                with temp.open("wb") as handle:
                    handle.write(data)
                if target.exists() and not overwrite:
                    raise FileExistsError("target already exists; set overwrite=true to replace it")
                os.replace(temp, target)
            finally:
                temp.unlink(missing_ok=True)
            return {"ok": True, "path": str(target), "size": target.stat().st_size,
                    "sha256": hashlib.sha256(data).hexdigest()}

        @mcp_server.tool()
        def unreal_upload_binary_file(filename: str, content_base64: str,
                                      destination_folder: str = "", overwrite: bool = False) -> str:
            """Upload a binary attachment (for example .blend, .fbx, .zip, .png) from the MCP client into D:\\UE58\\Uploads. Pass the file bytes as Base64. Supports up to 8 MiB per call for MCP clients that can pass large arguments. For chat-attached files, prefer the chunked upload tools to keep each request small."""
            try:
                encoded = str(content_base64 or "")
                if len(encoded) > ((UPLOAD_SINGLE_FILE_LIMIT + 2) // 3) * 4 + 16:
                    return mcp_json({"ok": False, "error": "Base64 content exceeds the 8 MiB direct-upload limit; use the chunked upload tools."})
                try:
                    data = base64.b64decode(encoded, validate=True)
                except (binascii.Error, ValueError) as exc:
                    return mcp_json({"ok": False, "error": "content_base64 is not valid Base64", "detail": str(exc)})
                if len(data) > UPLOAD_SINGLE_FILE_LIMIT:
                    return mcp_json({"ok": False, "error": "Direct upload limit is 8 MiB; use the chunked upload tools."})
                target = upload_target(filename, destination_folder)
                return mcp_json(store_uploaded_bytes(target, data, bool(overwrite)))
            except FileExistsError as exc:
                return mcp_json({"ok": False, "error": str(exc)})
            except Exception as exc:
                return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def unreal_begin_binary_upload(filename: str, total_size: int,
                                       destination_folder: str = "", overwrite: bool = False) -> str:
            """Start a chunked binary upload to D:\\UE58\\Uploads for files over 8 MiB. Then call unreal_upload_binary_chunk for each Base64 chunk and unreal_finish_binary_upload when all chunks are sent. Chunk size is 16 KiB to keep individual MCP tool arguments manageable. Maximum file size is 2 GiB."""
            try:
                total_size = int(total_size)
                if total_size < 1 or total_size > UPLOAD_MAX_FILE_SIZE:
                    return mcp_json({"ok": False, "error": "total_size must be between 1 byte and 2 GiB"})
                target = upload_target(filename, destination_folder)
                if target.exists() and not overwrite:
                    return mcp_json({"ok": False, "error": "target already exists; set overwrite=true to replace it", "path": str(target)})
                upload_id = uuid.uuid4().hex
                chunk_count = (total_size + UPLOAD_CHUNK_BYTES - 1) // UPLOAD_CHUNK_BYTES
                staging = UPLOAD_ROOT / ".incoming" / upload_id
                staging.mkdir(parents=True, exist_ok=False)
                with UPLOAD_LOCK:
                    UPLOAD_SESSIONS[upload_id] = {
                        "target": str(target), "total_size": total_size,
                        "chunk_count": chunk_count, "staging": str(staging),
                        "received": set(), "overwrite": bool(overwrite),
                        "created": time.time()
                    }
                return mcp_json({"ok": True, "upload_id": upload_id,
                                 "filename": target.name, "destination": str(target),
                                 "total_size": total_size, "chunk_size": UPLOAD_CHUNK_BYTES,
                                 "chunks_total": chunk_count,
                                 "next_step": "Send every chunk in index order starting at 0, then call unreal_finish_binary_upload."})
            except Exception as exc:
                return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def unreal_upload_binary_chunk(upload_id: str, chunk_index: int, chunk_base64: str) -> str:
            """Send one Base64-encoded 16 KiB (maximum) chunk for an upload started with unreal_begin_binary_upload. Indexes start at zero."""
            try:
                upload_id = str(upload_id or "")
                with UPLOAD_LOCK:
                    session = UPLOAD_SESSIONS.get(upload_id)
                if session is None:
                    return mcp_json({"ok": False, "error": "upload session not found or expired"})
                chunk_index = int(chunk_index)
                if chunk_index < 0 or chunk_index >= session["chunk_count"]:
                    return mcp_json({"ok": False, "error": "chunk_index is outside the expected range"})
                encoded = str(chunk_base64 or "")
                if len(encoded) > ((UPLOAD_CHUNK_BYTES + 2) // 3) * 4 + 16:
                    return mcp_json({"ok": False, "error": "encoded chunk exceeds the 16 KiB decoded limit"})
                try:
                    data = base64.b64decode(encoded, validate=True)
                except (binascii.Error, ValueError) as exc:
                    return mcp_json({"ok": False, "error": "chunk_base64 is not valid Base64", "detail": str(exc)})
                expected = min(UPLOAD_CHUNK_BYTES, session["total_size"] - chunk_index * UPLOAD_CHUNK_BYTES)
                if len(data) != expected:
                    return mcp_json({"ok": False, "error": "incorrect chunk length", "expected_bytes": expected, "received_bytes": len(data)})
                staging = Path(session["staging"])
                part = staging / ("chunk_%08d.bin" % chunk_index)
                temp = part.with_suffix(".tmp")
                with temp.open("wb") as handle:
                    handle.write(data)
                os.replace(temp, part)
                with UPLOAD_LOCK:
                    current = UPLOAD_SESSIONS.get(upload_id)
                    if current is None:
                        part.unlink(missing_ok=True)
                        return mcp_json({"ok": False, "error": "upload session was cancelled"})
                    current["received"].add(chunk_index)
                    received = len(current["received"])
                    total = current["chunk_count"]
                return mcp_json({"ok": True, "upload_id": upload_id,
                                 "chunk_index": chunk_index, "chunk_bytes": len(data),
                                 "chunks_received": received, "chunks_total": total,
                                 "complete": received == total})
            except Exception as exc:
                return mcp_json({"ok": False, "error": str(exc)})

        @mcp_server.tool()
        def unreal_finish_binary_upload(upload_id: str) -> str:
            """Finalize a chunked binary upload, verify byte size, calculate SHA-256 and atomically save it under D:\\UE58\\Uploads."""
            staging = None
            assembled = None
            try:
                upload_id = str(upload_id or "")
                with UPLOAD_LOCK:
                    session = UPLOAD_SESSIONS.get(upload_id)
                if session is None:
                    return mcp_json({"ok": False, "error": "upload session not found or expired"})
                missing = sorted(set(range(session["chunk_count"])) - session["received"])
                if missing:
                    return mcp_json({"ok": False, "error": "upload has missing chunks", "missing_chunk_indexes": missing[:100], "missing_count": len(missing)})
                target = Path(session["target"])
                target.parent.mkdir(parents=True, exist_ok=True)
                if target.exists() and not session["overwrite"]:
                    return mcp_json({"ok": False, "error": "target already exists; upload was not finalized", "path": str(target)})
                staging = Path(session["staging"])
                assembled = target.with_name(target.name + ".assembling-" + upload_id)
                digest = hashlib.sha256()
                written = 0
                with assembled.open("wb") as output:
                    for index in range(session["chunk_count"]):
                        chunk_path = staging / ("chunk_%08d.bin" % index)
                        with chunk_path.open("rb") as chunk:
                            while True:
                                block = chunk.read(1024 * 1024)
                                if not block:
                                    break
                                output.write(block)
                                digest.update(block)
                                written += len(block)
                if written != session["total_size"]:
                    raise ValueError("assembled file size does not match total_size")
                os.replace(assembled, target)
                assembled = None
                with UPLOAD_LOCK:
                    UPLOAD_SESSIONS.pop(upload_id, None)
                shutil.rmtree(staging, ignore_errors=True)
                return mcp_json({"ok": True, "path": str(target), "size": written,
                                 "sha256": digest.hexdigest(), "upload_id": upload_id})
            except Exception as exc:
                return mcp_json({"ok": False, "error": str(exc)})
            finally:
                if assembled is not None:
                    assembled.unlink(missing_ok=True)

        @mcp_server.tool()
        def unreal_abort_binary_upload(upload_id: str) -> str:
            """Cancel an unfinished binary upload and remove its temporary chunks."""
            with UPLOAD_LOCK:
                session = UPLOAD_SESSIONS.pop(str(upload_id or ""), None)
            if session is None:
                return mcp_json({"ok": False, "error": "upload session not found"})
            shutil.rmtree(session["staging"], ignore_errors=True)
            return mcp_json({"ok": True, "aborted": True, "upload_id": upload_id})

        _mcp_app = mcp_server.streamable_http_app(
            streamable_http_path="/",
            transport_security=TransportSecuritySettings(enable_dns_rebinding_protection=False),
            host="0.0.0.0"
        )

        async def mcp_app(scope, receive, send):
            # No bearer-token check: this MCP endpoint is intentionally unauthenticated for testing.
            await _mcp_app(scope, receive, send)

