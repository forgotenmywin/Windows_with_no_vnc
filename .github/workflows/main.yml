                SCENE_CACHE.update(payload)
                SCENE_CACHE["error"] = ""
            return payload


        def _scene_scan_worker(job_id):
            global SCENE_ACTIVE_JOB
            with SCENE_JOB_LOCK:
                SCENE_JOBS[job_id].update({"status": "running", "started_at": time.time(),
                                           "progress": 1, "phase": "Starting actor metadata scan",
                                           "completed": 0, "total": 0, "detail": "Waiting for Unreal Bridge"})
            try:
                if not bridge_connected():
                    raise RuntimeError("Unreal Bridge is offline")
                payload = _scene_snapshot_from_unreal(timeout=10000, job_id=job_id)
                with SCENE_JOB_LOCK:
                    SCENE_JOBS[job_id].update({"status": "completed", "result": payload,
                                               "completed_at": time.time(), "count": payload.get("count", 0),
                                               "progress": 100, "phase": "Actor metadata scan complete",
                                               "completed": payload.get("count", 0), "total": payload.get("count", 0),
                                               "detail": str(payload.get("count", 0)) + " Actors read"})
                log("Scene scan completed: job=%s actors=%s level=%s" % (job_id, payload.get("count", 0), payload.get("level", "")))
            except Exception as exc:
                with SCENE_LOCK:
                    SCENE_CACHE["error"] = str(exc)[:800]
                with SCENE_JOB_LOCK:
                    SCENE_JOBS[job_id].update({"status": "failed", "error": str(exc)[:1200],
                                               "phase": "Actor metadata scan failed", "detail": str(exc)[:240],
                                               "completed_at": time.time()})
                log("Scene scan failed: job=%s error=%s" % (job_id, repr(exc)))
            finally:
                with SCENE_JOB_LOCK:
                    if SCENE_ACTIVE_JOB == job_id:
                        SCENE_ACTIVE_JOB = ""


        def _start_scene_scan(force=False):
            global SCENE_ACTIVE_JOB
            with SCENE_LOCK:
                cached = dict(SCENE_CACHE)
            if not force and cached.get("updated") and (time.time() - cached["updated"] < 10):
                return {"ok": True, "status": "cached", "scene": cached}
            with SCENE_JOB_LOCK:
                if SCENE_ACTIVE_JOB and SCENE_ACTIVE_JOB in SCENE_JOBS:
                    active = SCENE_JOBS[SCENE_ACTIVE_JOB]
                    if active.get("status") in ("queued", "running"):
                        return {"ok": True, "status": active.get("status"), "job_id": SCENE_ACTIVE_JOB}
                job_id = uuid.uuid4().hex
                SCENE_JOBS[job_id] = {"job_id": job_id, "status": "queued", "created_at": time.time(),
                                      "progress": 0, "phase": "Queued for actor metadata scan",
                                      "completed": 0, "total": 0, "detail": "Waiting for scan worker"}
                SCENE_ACTIVE_JOB = job_id
                # Keep only the latest 20 scene jobs in memory.
                for old_id, row in list(SCENE_JOBS.items()):
                    if old_id != job_id and row.get("status") in ("completed", "failed") and len(SCENE_JOBS) > 20:
                        SCENE_JOBS.pop(old_id, None)
                threading.Thread(target=_scene_scan_worker, args=(job_id,), name="UE-SceneScan-" + job_id[:8], daemon=True).start()
                log("Scene scan queued: job=%s" % job_id)
                return {"ok": True, "status": "queued", "job_id": job_id}


        def _scene_job_payload(job_id=""):
            with SCENE_JOB_LOCK:
                chosen = str(job_id or SCENE_ACTIVE_JOB)
                row = dict(SCENE_JOBS.get(chosen, {})) if chosen else {}
            with SCENE_LOCK:
                cached = dict(SCENE_CACHE)
            if not row:
                return {"ok": bool(cached.get("updated")), "status": "idle", "scene": cached,
                        "bridge_connected": bridge_connected()}
            row.pop("result", None)
            if row.get("status") in ("queued", "running") and chosen:
                progress_file = (SCENE_MODEL_DIR / ("scene_scan_" + chosen + ".json")).resolve()
                try:
                    if progress_file.parent == SCENE_MODEL_DIR and progress_file.is_file():
                        progress_data = json.loads(progress_file.read_text(encoding="utf-8"))
                        if isinstance(progress_data, dict):
                            for key in ("progress", "phase", "completed", "total", "detail", "updated_at"):
                                if key in progress_data:
                                    row[key] = progress_data[key]
                except Exception as progress_read_error:
                    row["progress_read_warning"] = str(progress_read_error)[:140]
            if SCENE_JOBS.get(chosen, {}).get("status") == "completed":
                row["progress"] = 100
                row["scene"] = cached
            return {"ok": row.get("status") != "failed", "job": row,
                    "scene": cached if cached.get("updated") else None,
                    "bridge_connected": bridge_connected()}


        @app.get("/api/scene/snapshot")
        @monitor_auth
        def api_scene_snapshot():
            refresh = request.args.get("refresh", "1") != "0"
            force = request.args.get("force", "0") == "1"
            with SCENE_LOCK:
                cached = dict(SCENE_CACHE)
            stale = not cached.get("updated") or (time.time() - cached.get("updated", 0) > 10)
            job = _start_scene_scan(force=force) if refresh and bridge_connected() and (force or stale) else {"ok": True, "status": "cached"}
            payload = _scene_job_payload(job.get("job_id", ""))
            payload["request"] = job
            payload["bridge_connected"] = bridge_connected()
            payload["ok"] = bool(cached.get("updated") or job.get("ok"))
            return jsonify(payload)


        @app.get("/api/scene/status")
        @monitor_auth
        def api_scene_status():
            return jsonify(_scene_job_payload(request.args.get("job_id", "")))


        def _scene_model_export_worker(job_id):
            """Export actual renderable mesh geometry from the active Unreal level without modifying it."""
            job_dir = (SCENE_MODEL_DIR / ("offline_scene_" + job_id)).resolve()
            job_dir.mkdir(parents=True, exist_ok=True)
            temp_path = (job_dir / "scene_model.glb").resolve()
            progress_path = (job_dir / "progress.json").resolve()
            def _server_progress(percent, phase, completed=0, total=0, detail=""):
                payload = {"progress": max(0, min(100, int(percent))), "phase": str(phase),
                           "completed": int(completed or 0), "total": int(total or 0),
                           "detail": str(detail)[:300], "updated_at": time.time()}
                try:
                    tmp_progress = progress_path.with_suffix(".tmp")
                    tmp_progress.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
                    os.replace(tmp_progress, progress_path)
                except Exception as progress_error:
                    log("Could not write scene export progress: " + repr(progress_error))
                with SCENE_MODEL_LOCK:
                    if SCENE_MODEL_STATE.get("job_id") == job_id:
                        SCENE_MODEL_STATE.update(payload)
            _server_progress(2, "Starting Unreal scene export", detail="Preparing progress tracking")
            with SCENE_MODEL_LOCK:
                if SCENE_MODEL_STATE.get("job_id") == job_id:
                    SCENE_MODEL_STATE.update({"status": "running", "started_at": time.time()})
            try:
                if not bridge_connected():
                    raise RuntimeError("Unreal Python Bridge is offline")
                unreal_path = str(temp_path).replace("\\", "/")
                code = r"""
        import json, os, time, unreal, traceback
        output_path = __OUTPUT_PATH__
        progress_path = __PROGRESS_PATH__
        report = {"ok": False, "path": output_path, "error": ""}
        def _write_progress(percent, phase, completed=0, total=0, detail=""):
            payload = {"progress": max(0, min(100, int(percent))), "phase": str(phase),
                       "completed": int(completed or 0), "total": int(total or 0),
                       "detail": str(detail)[:300], "updated_at": time.time()}
            try:
                temporary = progress_path + ".tmp"
                with open(temporary, "w", encoding="utf-8") as progress_stream:
                    json.dump(payload, progress_stream, ensure_ascii=False)
                os.replace(temporary, progress_path)
            except Exception as progress_error:
                print("[UE58 GLB] progress update failed: " + str(progress_error))
        _write_progress(4, "Connecting to Unreal Editor", detail="Checking the active level and GLTFExporter")
        try:
            world = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()
            if world is None:
                raise RuntimeError("Unreal Editor has no active editor world")
            if not hasattr(unreal, "GLTFExporter") or not hasattr(unreal, "GLTFExportOptions"):
                raise RuntimeError("GLTFExporter is not loaded. Enable the GLTFExporter plugin and restart this project.")
            os.makedirs(os.path.dirname(output_path), exist_ok=True)
            if os.path.isfile(output_path):
                os.remove(output_path)
            options = unreal.GLTFExportOptions()
            # Geometry-first snapshot: disable material texture baking and skip lights/cameras.
            # Mesh geometry and component transforms remain intact, but export is much lighter.
            try:
                options.set_editor_property("bake_material_inputs", unreal.GLTFMaterialBakeMode.DISABLED)
            except Exception as material_bake_error:
                print("GLTF material baking could not be disabled: " + str(material_bake_error))
            for property_name, property_value in (("export_lights", False), ("export_cameras", False),
                                                   ("export_vertex_colors", True), ("export_morph_targets", False),
                                                   ("export_vertex_skin_weights", True), ("make_skinned_meshes_root", True)):
                try:
                    options.set_editor_property(property_name, property_value)
                except Exception:
                    pass
            # Explicitly collect renderable actor components from the active editor level.
            # Passing a populated SelectedActors set avoids ambiguity between the editor world
            # and the level actor list in some UE 5.8 Python builds.
            try:
                actor_subsystem = unreal.get_editor_subsystem(unreal.EditorActorSubsystem)
                level_actors = list(actor_subsystem.get_all_level_actors() or [])
            except Exception as actor_subsystem_error:
                print("EditorActorSubsystem unavailable; using EditorLevelLibrary: " + str(actor_subsystem_error))
                level_actors = list(unreal.EditorLevelLibrary.get_all_level_actors() or [])
            _write_progress(10, "Scanning active Unreal level", total=len(level_actors), detail=str(len(level_actors)) + " Actors found")

            mesh_actor_list = []
            static_component_count = 0
            skeletal_component_count = 0
            skipped_hidden_component_count = 0
            for actor_scan_index, actor in enumerate(level_actors):
                if actor is None:
                    _write_progress(10 + int(12 * (actor_scan_index + 1) / max(1, len(level_actors))),
                                    "Scanning mesh components", actor_scan_index + 1, len(level_actors), "Reading Actor components")
                    continue
                actor_has_mesh = False
                try:
                    static_components = actor.get_components_by_class(unreal.StaticMeshComponent)
                except Exception:
                    static_components = []
                for component in static_components or []:
                    if component is None:
                        continue
                    try:
                        mesh_asset = component.get_editor_property("static_mesh")
                    except Exception:
                        mesh_asset = None
                    if mesh_asset is None:
                        continue
                    try:
                        component_visible = bool(component.get_editor_property("visible"))
                    except Exception:
                        component_visible = True
                    if not component_visible:
                        skipped_hidden_component_count += 1
                        continue
                    static_component_count += 1
                    actor_has_mesh = True

                try:
                    skeletal_components = actor.get_components_by_class(unreal.SkeletalMeshComponent)
                except Exception:
                    skeletal_components = []
                for component in skeletal_components or []:
                    if component is None:
                        continue
                    try:
                        mesh_asset = component.get_editor_property("skeletal_mesh")
                    except Exception:
                        mesh_asset = None
                    if mesh_asset is None:
                        continue
                    try:
                        component_visible = bool(component.get_editor_property("visible"))
                    except Exception:
                        component_visible = True
                    if not component_visible:
                        skipped_hidden_component_count += 1
                        continue
                    skeletal_component_count += 1
                    actor_has_mesh = True

                if actor_has_mesh:
                    mesh_actor_list.append(actor)
                if (actor_scan_index + 1) == len(level_actors) or (actor_scan_index + 1) % max(1, len(level_actors) // 25) == 0:
                    _write_progress(10 + int(12 * (actor_scan_index + 1) / max(1, len(level_actors))),
                                    "Scanning mesh components", actor_scan_index + 1, len(level_actors),
                                    str(len(mesh_actor_list)) + " mesh Actors identified")

            if not mesh_actor_list:
                raise RuntimeError(
                    "No visible mesh components were found in the active level. "
                    "Actor count=%d, static mesh components=%d, skeletal mesh components=%d."
                    % (len(level_actors), static_component_count, skeletal_component_count)
                )

            try:
                export_actor_set = set(mesh_actor_list)
            except Exception as selection_error:
                raise RuntimeError("Could not build Unreal SelectedActors set: " + str(selection_error))

            def _read_glb_json(file_name):
                import struct
                if not os.path.isfile(file_name) or os.path.getsize(file_name) < 32:
                    raise RuntimeError("GLTFExporter did not create a valid GLB: " + str(file_name))
                with open(file_name, "rb") as stream:
                    header = stream.read(12)
                    if len(header) != 12:
                        raise RuntimeError("Exported GLB header is incomplete")
                    magic, glb_version, total_length = struct.unpack("<4sII", header)
                    file_size = os.path.getsize(file_name)
                    if magic != b"glTF" or glb_version != 2 or total_length > file_size:
                        raise RuntimeError("Exported file is not a valid glTF 2.0 binary container")
                    document = None
                    offset = 12
                    while offset + 8 <= total_length:
                        chunk_header = stream.read(8)
                        if len(chunk_header) != 8:
                            break
                        chunk_length, chunk_type = struct.unpack("<II", chunk_header)
                        chunk_data = stream.read(chunk_length)
                        if len(chunk_data) != chunk_length:
                            raise RuntimeError("GLB contains a truncated data chunk")
                        if chunk_type == 0x4E4F534A:
                            document = json.loads(chunk_data.decode("utf-8").rstrip(" \t\r\n\x00"))
                        offset += 8 + chunk_length
                if not isinstance(document, dict):
                    raise RuntimeError("GLB has no JSON scene description")
                return document

            def _run_gltf_export(target_path, selected_set, export_object=None):
                export_target = export_object if export_object is not None else world
                raw = unreal.GLTFExporter.export_to_gltf(export_target, target_path, options, selected_set)
                messages = None
                if isinstance(raw, tuple):
                    if raw and isinstance(raw[0], bool) and not raw[0]:
                        raise RuntimeError("Unreal GLTFExporter returned failure: " + str(raw))
                    messages = raw[-1] if len(raw) > 1 else None
                elif isinstance(raw, bool):
                    if not raw:
                        raise RuntimeError("Unreal GLTFExporter returned false")
                else:
                    messages = raw
                errors = getattr(messages, "errors", None) if messages is not None else None
                if errors:
                    raise RuntimeError("Unreal GLTFExporter errors: " + "; ".join(str(item) for item in errors)[:1600])
                return _read_glb_json(target_path)

            report.update({
                "scene_actor_count": len(level_actors),
                "selected_mesh_actor_count": len(mesh_actor_list),
                "static_mesh_components": static_component_count,
                "skeletal_mesh_components": skeletal_component_count,
                "skipped_hidden_components": skipped_hidden_component_count,
            })
            print("[UE58 GLB] level_actors=%d mesh_actors=%d static_components=%d skeletal_components=%d" % (
                len(level_actors), len(mesh_actor_list), static_component_count, skeletal_component_count
            ))

            # Export each actual mesh asset directly. This avoids silent-empty-world behavior
            # sometimes seen when UWorld export is passed a SelectedActors set in UE 5.8.
            # GLTFExporter supports UStaticMesh and USkeletalMesh objects as direct inputs.
            per_actor_files = []
            mesh_node_rows = []
            export_errors = []
            total_components = max(1, static_component_count + skeletal_component_count)
            processed_components = 0
            _write_progress(26, "Exporting actual mesh assets", 0, total_components,
                            "Direct UStaticMesh/USkeletalMesh export; material baking disabled")

            for actor_index, actor in enumerate(mesh_actor_list):
                try:
                    actor_label = str(actor.get_actor_label() or actor.get_name())
                except Exception:
                    actor_label = str(actor.get_name())
                component_groups = []
                try:
                    component_groups.append(("StaticMesh", list(actor.get_components_by_class(unreal.StaticMeshComponent) or []), "static_mesh"))
                except Exception as component_error:
                    export_errors.append(str(actor_label) + " static components: " + str(component_error)[:240])
                try:
                    component_groups.append(("SkeletalMesh", list(actor.get_components_by_class(unreal.SkeletalMeshComponent) or []), "skeletal_mesh"))
                except Exception as component_error:
                    export_errors.append(str(actor_label) + " skeletal components: " + str(component_error)[:240])

                for component_kind, components, asset_property in component_groups:
                    for component in components:
                        if component is None:
                            continue
                        try:
                            visible = bool(component.get_editor_property("visible"))
                        except Exception:
                            visible = True
                        if not visible:
                            continue
                        try:
                            mesh_asset = component.get_editor_property(asset_property)
                        except Exception as asset_error:
                            mesh_asset = None
                            export_errors.append(str(actor_label) + "/" + str(component.get_name()) +
                                                 " asset lookup: " + str(asset_error)[:220])
                        if mesh_asset is None:
                            continue

                        actor_file = os.path.join(os.path.dirname(output_path),
                                                  "mesh_component_%04d.glb" % processed_components)
                        try:
                            if os.path.isfile(actor_file):
                                os.remove(actor_file)
                            asset_doc = _run_gltf_export(actor_file, set(), mesh_asset)
                            asset_meshes = len(asset_doc.get("meshes", []))
                            asset_nodes = [node for node in asset_doc.get("nodes", []) if "mesh" in node]
                            if asset_meshes < 1 or not asset_nodes:
                                raise RuntimeError("asset export completed without renderable mesh nodes")
                            world_transform = component.get_world_transform()
                            translation = world_transform.translation
                            rotation = world_transform.rotation
                            scale3d = world_transform.scale3d
                            transform_payload = {
                                "location": {"x": float(translation.x), "y": float(translation.y), "z": float(translation.z)},
                                "rotation": {"x": float(rotation.x), "y": float(rotation.y),
                                             "z": float(rotation.z), "w": float(rotation.w)},
                                "scale": {"x": float(scale3d.x), "y": float(scale3d.y), "z": float(scale3d.z)}
                            }
                            component_name = str(component.get_name())
                            per_actor_files.append({
                                "file": os.path.basename(actor_file),
                                "actor_label": actor_label[:180],
                                "object_name": str(actor.get_name())[:180],
                                "component_name": component_name[:180],
                                "asset_path": str(mesh_asset.get_path_name())[:300],
                                "component_kind": component_kind,
                                "transform": transform_payload,
                                "mesh_count": asset_meshes,
                                "node_names": [str(node.get("name") or ("Mesh node " + str(i + 1)))[:180]
                                               for i, node in enumerate(asset_nodes[:100])]
                            })
                            mesh_node_rows.extend([{"name": actor_label + " / " + component_name + " / " +
                                                    str(node.get("name") or ("Mesh " + str(i + 1)))[:120]}
                                                   for i, node in enumerate(asset_nodes[:100])])
                        except Exception as asset_export_error:
                            export_errors.append(str(actor_label) + "/" + str(component.get_name()) +
                                                 " [" + component_kind + "]: " + str(asset_export_error)[:360])
                            try:
                                if os.path.isfile(actor_file):
                                    os.remove(actor_file)
                            except Exception:
                                pass
                        processed_components += 1
                        _write_progress(26 + int(64 * processed_components / total_components),
                                        "Exporting actual mesh assets", processed_components, total_components,
                                        "Exported " + str(len(per_actor_files)) + " component GLB files; " +
                                        str(processed_components) + " of " + str(total_components) + " components processed")

            if per_actor_files:
                report["export_mode"] = "direct_mesh_asset_per_component"
                report["mesh_files"] = per_actor_files
                mesh_count = sum(int(row.get("mesh_count", 0)) for row in per_actor_files)
                report["asset_export_errors"] = export_errors[:30]
            else:
                # Fallback to world export only if all direct mesh-asset exports failed.
                primary_export_error = "; ".join(export_errors[:8])[:1200]
                _write_progress(72, "Trying full-level GLB fallback", 0, 1,
                                "Direct asset export produced no files; trying the active UWorld")
                try:
                    if os.path.isfile(output_path):
                        os.remove(output_path)
                    document = _run_gltf_export(output_path, export_actor_set)
                    mesh_count = len(document.get("meshes", []))
                    mesh_node_rows = [node for node in document.get("nodes", []) if "mesh" in node]
                    if mesh_count < 1 or not mesh_node_rows:
                        raise RuntimeError("Selected-actor world export contained no mesh nodes")
                    report["export_mode"] = "selected_actor_world_fallback"
                except Exception as world_error:
                    report["world_fallback_error"] = str(world_error)[:900]
                    try:
                        if os.path.isfile(output_path):
                            os.remove(output_path)
                    except Exception:
                        pass
                    try:
                        document = _run_gltf_export(output_path, set())
                        mesh_count = len(document.get("meshes", []))
                        mesh_node_rows = [node for node in document.get("nodes", []) if "mesh" in node]
                        if mesh_count < 1 or not mesh_node_rows:
                            raise RuntimeError("All-actors world export contained no mesh nodes")
                        report["export_mode"] = "all_actor_world_fallback"
                    except Exception as all_world_error:
                        raise RuntimeError(
                            "No GLB geometry was created. Direct asset errors: %s. Selected-world fallback: %s. All-world fallback: %s"
                            % (primary_export_error or "none", report.get("world_fallback_error", "none"), str(all_world_error)[:900])
                        )

            if not mesh_node_rows and per_actor_files:
                mesh_node_rows = [{"name": row.get("actor_label", "Mesh") + " / " + row.get("component_name", "Component")}
                                  for row in per_actor_files]
            _write_progress(94, "Finalizing exported geometry", 1, 1, "Validating mesh nodes and GLB file sizes")
            mesh_node_names = [str(node.get("name") or ("Mesh node " + str(index + 1)))[:180]
                               for index, node in enumerate(mesh_node_rows[:500])]
            size_bytes = (sum(os.path.getsize(os.path.join(os.path.dirname(output_path), row["file"]))
                              for row in per_actor_files) if per_actor_files else os.path.getsize(output_path))
            report.update({"ok": True, "size": size_bytes,
                           "mesh_count": mesh_count, "mesh_nodes": len(mesh_node_rows),
                           "mesh_node_names": mesh_node_names, "error": ""})
            _write_progress(98, "Unreal export finished", 1, 1, str(mesh_count) + " mesh records created")
        except Exception as exc:
            report["error"] = str(exc)[:1800]
            report["traceback"] = traceback.format_exc()[-2500:]
            _write_progress(99, "Unreal export failed", detail=str(exc)[:250])
        print("__UE_SCENE_GLB__" + json.dumps(report, ensure_ascii=False))
        """
                # YAML already removes the outer block-scalar indentation. Do not strip
                # a fixed number of spaces from each line: that corrupts nested Python
                # blocks (for example, a try body becomes aligned with its try statement).
                # Dedent only common indentation, then syntax-check the exact code sent to UE.
                code = textwrap.dedent(code).strip()
                code = code.replace("__OUTPUT_PATH__", repr(unreal_path))
                code = code.replace("__PROGRESS_PATH__", repr(str(progress_path).replace("\\", "/")))
                try:
                    ast.parse(code, filename="<generated-scene-glb-export>", mode="exec")
                except SyntaxError as syntax_error:
                    raise RuntimeError("Generated GLB export script failed local syntax validation: " + str(syntax_error)) from syntax_error
                result, status = queue_unreal(code, timeout=10000)
                deadline = time.monotonic() + 10000
                while status == 202 and time.monotonic() < deadline:
                    result, status = wait_unreal_job(result.get("job_id", ""), timeout=60)
                if status == 202:
                    raise TimeoutError("Unreal GLB export is still running after the 10,000-second execution limit")
                if status != 200 or not result.get("ok"):
                    raise RuntimeError(result.get("error") or result.get("message") or str(result))
                output = str(result.get("output", ""))
                marker = "__UE_SCENE_GLB__"
                line = next((item for item in output.splitlines() if marker in item), "")
                if not line:
                    raise RuntimeError("Unreal returned no GLB export report: " + output[-1200:])
                report = json.loads(line.split(marker, 1)[1])
                if not report.get("ok"):
                    raise RuntimeError(report.get("error") or "Unreal GLB export failed")
                model_files = report.get("mesh_files", []) or []
                if model_files:
                    for item in model_files:
                        file_path = (job_dir / str(item.get("file", ""))).resolve()
                        if file_path.parent != job_dir or not file_path.is_file() or file_path.stat().st_size < 32:
                            raise RuntimeError("Per-actor GLB file is missing or invalid: " + str(item.get("file")))
                        with file_path.open("rb") as stream:
                            if stream.read(4) != b"glTF":
                                raise RuntimeError("Per-actor export is not a binary GLB: " + str(item.get("file")))
                    size = sum((job_dir / item["file"]).stat().st_size for item in model_files)
                    stored_path = ""
                else:
                    if not temp_path.is_file() or temp_path.stat().st_size < 32:
                        raise RuntimeError("The exported GLB file is missing or empty")
                    with temp_path.open("rb") as stream:
                        if stream.read(4) != b"glTF":
                            raise RuntimeError("The exported file is not a valid binary glTF (GLB)")
                    size = temp_path.stat().st_size
                    stored_path = str(temp_path)
                with SCENE_MODEL_LOCK:
                    previous_dir = SCENE_MODEL_STATE.get("job_dir", "")
                    SCENE_MODEL_STATE.update({"status": "ready", "job_id": job_id,
                                              "progress": 98, "phase": "GLB export complete · loading in browser",
                                              "completed": len(model_files) if model_files else 1,
                                              "total": len(model_files) if model_files else 1,
                                              "detail": str(report.get("mesh_count", 0)) + " meshes ready",
                                              "path": stored_path, "job_dir": str(job_dir),
                                              "model_files": model_files,
                                              "version": int(SCENE_MODEL_STATE.get("version", 0)) + 1,
                                              "updated": time.time(), "size": size,
                                              "mesh_node_names": report.get("mesh_node_names", []),
                                              "mesh_count": report.get("mesh_count", 0),
                                              "selected_mesh_actor_count": report.get("selected_mesh_actor_count", 0),
                                              "static_mesh_components": report.get("static_mesh_components", 0),
                                              "skeletal_mesh_components": report.get("skeletal_mesh_components", 0),
                                              "export_mode": report.get("export_mode", "whole_level"),
                                              "error": ""})
                if previous_dir and previous_dir != str(job_dir):
                    try:
                        shutil.rmtree(previous_dir, ignore_errors=True)
                    except Exception:
                        pass
                log("Offline scene snapshot exported: job=%s size=%s bytes meshes=%s nodes=%s mode=%s" % (
                    job_id, size, report.get("mesh_count", 0), report.get("mesh_nodes", 0),
                    report.get("export_mode", "whole_level")))
                try:
                    html_path = _write_scene_html_after_export()
                    with SCENE_MODEL_LOCK:
                        if SCENE_MODEL_STATE.get("job_id") == job_id:
                            SCENE_MODEL_STATE.update({"html_ready": True, "html_path": str(html_path),
                                                      "html_updated": time.time(), "phase": "3D snapshot and view-only HTML ready"})
                    log("Automatic view-only HTML created: " + str(html_path))
                except Exception as html_error:
                    with SCENE_MODEL_LOCK:
                        if SCENE_MODEL_STATE.get("job_id") == job_id:
                            SCENE_MODEL_STATE.update({"html_ready": False, "html_error": str(html_error)[:1000]})
                    log("Automatic view-only HTML creation failed: " + repr(html_error))
            except Exception as exc:
                temp_path.unlink(missing_ok=True)
                with SCENE_MODEL_LOCK:
                    SCENE_MODEL_STATE.update({"status": "failed", "job_id": job_id,
                                              "phase": "Scene export failed", "detail": str(exc)[:300],
                                              "error": str(exc)[:1800]})
                log("Actual scene geometry export failed: job=%s error=%s" % (job_id, repr(exc)))


