    - name: Validate Blueprint object paths and workspace path security
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$api = 'D:\\UE58\\api_server.py'\nif (-not (Test-Path -LiteralPath $api)) { throw\
        \ 'API source is missing before validation.' }\n$src = Get-Content -LiteralPath $api -Raw\n$required = @(\n  'function\
        \ blueprintObjectPath',\n  'uasset_object_path=_blueprint_object_path',\n  '/api/fs/path/resolve',\n  'path_outside_allowed_roots',\n\
        \  'symbol_paths_skipped',\n  'BLUEPRINT_SAVE_DISK_VERIFIED=true'\n)\nforeach ($marker in $required) {\n  if ($src\
        \ -notmatch [regex]::Escape($marker)) { throw \"Required v15 implementation marker missing: $marker\" }\n}\nif ($src\
        \ -match 'symbol_path\\s*\\.replace.{0,30}commands\\s*=') { throw 'CDB symbol path must not be concatenated into the\
        \ semicolon-delimited command script.' }\nif ($src -notmatch '_normalize_blueprint_mcp_arguments' -or $src -notmatch\
        \ 'BLUEPRINT_MCP_OBJECT_PATH_NORMALIZED') {\n  throw 'SERVER_SIDE_BLUEPRINT_OBJECT_PATH_NORMALIZATION_MISSING: direct\
        \ MCP tool calls must normalize /Game/package paths to full Package.Asset references.'\n}\nif ($src -notmatch 'EDITOR_MAIN_THREAD_STALLED_DURING_BLUEPRINT_SAVE'\
        \ -or $src -notmatch 'BLUEPRINT_SAVE_MAIN_THREAD_STALLED' -or $src -notmatch \"status='EDITOR_STALLED'\" -or $src\
        \ -notmatch \"row.get\\('kind'\\) == 'blueprint_save'\") {\n  throw 'BLUEPRINT_SAVE_HANG_WATCHDOG_MISSING: MCP polling\
        \ and Blueprint Explorer must surface a stalled main thread and pause automatic retries.'\n}\nWrite-Host 'BLUEPRINT_OBJECT_PATH_AND_PATH_SECURITY_VALIDATION=PASS'\n\
        Write-Host 'SERVER_SIDE_BLUEPRINT_OBJECT_PATH_VALIDATION=PASS'\nWrite-Host 'BLUEPRINT_SAVE_HANG_WATCHDOG_VALIDATION=PASS'\n\
        Write-Host 'FILE_MANAGER_ALLOWED_ROOT=D:\\UE58'\nWrite-Host 'CDB_SYMBOL_PATH_IS_PASSED_AS_A_SINGLE_ARGUMENT=true'\n"
    - name: Validate generated Python scripts
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\ntry { Start-Transcript -Path 'D:\\UE58\\Logs\\workflow-validation-transcript.log'\
        \ -Append -Force | Out-Null } catch { }\n$python = (Get-Command python).Source\n& $python -m py_compile 'D:\\UE58\\\
        api_server.py' 'D:\\UE58\\UEControl\\Content\\Python\\init_unreal.py'\nif ($LASTEXITCODE -ne 0) { throw 'Generated\
        \ Python scripts failed syntax validation.' }\n$apiText = Get-Content -LiteralPath 'D:\\UE58\\api_server.py' -Raw\
        \ -Encoding utf8\nif ($apiText -notmatch 'BLUEPRINT_AUTOCREATE_IF_MISSING' -or $apiText -notmatch 'AssetToolsHelpers'\
        \ -or $apiText -notmatch 'EditorAssetLibrary\\.make_directory' -or $apiText -notmatch 'BLUEPRINT_ASSET_CREATED') {\n\
        \  throw 'BLUEPRINT_AUTOCREATE_VALIDATION_FAILED: safe Blueprint search/create/save verification is missing.'\n}\n\
        if ($apiText -notmatch '(?m)^\\s{8}mcp_timeout\\s*=\\s*httpx\\.Timeout\\(connect=10\\.0, read=120\\.0, write=60\\\
        .0, pool=15\\.0\\)\\s*$') {\n  throw 'MCP_TIMEOUT_ASSIGNMENT_INVALID: mcp_timeout must be a standalone executable\
        \ Python line, not part of a comment.'\n}\nif ($apiText -notmatch 'async def public_app' -or $apiText -notmatch 'canonical_request_path')\
        \ {\n  throw 'PUBLIC_MCP_ROUTER_INVALID: /mcp public ASGI dispatcher was not generated.'\n}\nif ($apiText -notmatch\
        \ 'def _headless_write_command' -or $apiText -notmatch 'request.json' -or $apiText -notmatch 'def _enqueue_headless_job'\
        \ -or $apiText -notmatch 'isolate_project' -or $apiText -notmatch 'MCP tools/list native cache unavailable') {\n \
        \ throw 'HEADLESS_QUEUE_AND_MCP_FALLBACK_INVALID: durable per-job queue, snapshot execution and local tool catalog\
        \ fallback are required.'\n}\nif ($apiText -notmatch '_enqueue_headless_job\\(' -or $apiText -notmatch 'UnrealEditor-Cmd.exe'\
        \ -or $apiText -notmatch '__MAP_PATH__' -or $apiText -notmatch 'scope=level') {\n  throw 'HEADLESS_3D_EXPORT_INVALID:\
        \ GLTF export must execute through the headless commandlet and load an explicit level.'\n}\n# Validate the actual\
        \ implementation instead of requiring obsolete comment text.\n# The SSE reader must parse a complete JSON-RPC data\
        \ line before stream EOF,\n# including a final data line that has not received its newline yet.\nif ($apiText -notmatch\
        \ 'async def read_mcp_http_reply\\(' -or\n    $apiText -notmatch 'async for chunk in response\\.aiter_text\\(\\):'\
        \ -or\n    $apiText -notmatch 'candidate_line = line_buffer\\.rstrip' -or\n    $apiText -notmatch 'if candidate_line\\\
        .startswith\\(''data:''\\):' -or\n    $apiText -notmatch 'async def mcp_post_and_read\\(') {\n  throw 'MCP_STREAM_READER_INVALID:\
        \ immediate SSE parsing of complete and unfinished data lines is required.'\n}\n# Initialized notifications must inspect\
        \ HTTP status/headers and close the\n# stream without waiting for a response body that may never arrive.\nif ($apiText\
        \ -notmatch 'notify_status = notify\\.status_code' -or\n    $apiText -notmatch 'notify_content_type = notify\\.headers\\\
        .get\\(''content-type'', ''''\\)' -or\n    $apiText -notmatch 'if notify_status not in \\(200, 202, 204\\):') {\n\
        \  throw 'MCP_NOTIFICATION_READER_INVALID: notification handling must validate HTTP metadata without waiting for a\
        \ body.'\n}\nWrite-Host 'MCP_STREAM_READER_VALIDATION=true'\n\n# Native C++/Windows thread-stack access: ProcDump\
        \ creates a read-only snapshot,\n# then CDB emits every thread's native stack from the dump. No live attach/kill.\n\
        if (-not (Test-Path -LiteralPath $env:UE58_PROCDUMP) -or -not (Test-Path -LiteralPath $env:UE58_CDB)) {\n  throw 'NATIVE_THREAD_DEBUGGER_TOOLS_MISSING:\
        \ ProcDump and CDB must be installed before the API starts.'\n}\nif ($apiText -notmatch 'def _thread_stack_capture_worker'\
        \ -or\n    $apiText -notmatch 'def _get_thread_stack_capture_status' -or\n    $apiText -notmatch \"@app.post\\('/api/diagnostics/thread-stacks'\\\
        )\" -or\n    $apiText -notmatch 'unreal_get_thread_stack_traces' -or\n    $apiText -notmatch '~\\* kv' -or $apiText\
        \ -notmatch '!uniqstack' -or $apiText -notmatch '!analyze -hang' -or $apiText -notmatch '!analyze -v6' -or $apiText\
        \ -notmatch '!locks') {\n  throw 'NATIVE_THREAD_STACKTRACE_FEATURE_MISSING: CDB must analyze all native Unreal threads\
        \ and expose a pollable MCP tool.'\n}\n$nativeBridgeText = Get-Content -LiteralPath 'D:\\UE58\\UEControl\\Content\\\
        Python\\init_unreal.py' -Raw -Encoding utf8\nif ($nativeBridgeText -notmatch 'PYTHON_THREAD_MAP_BEGIN' -or $nativeBridgeText\
        \ -notmatch 'native_id') {\n  throw 'PYTHON_THREAD_ID_MAP_MISSING: faulthandler snapshots must include Python thread\
        \ names and native thread IDs.'\n}\nif ($apiText -notmatch 'returncode != 0' -or $apiText -notmatch \"b'MDMP'\" -or\
        \ $apiText -notmatch 'PROCDUMP_NONZERO_EXIT_BUT_VALID_DUMP') {\n  throw 'PROCDUMP_VALID_DUMP_HANDLING_INVALID: a valid\
        \ MDMP must be analyzed even when ProcDump returns a nonzero exit code.'\n}\nif ($apiText -notmatch 'UE58_NATIVE_THREAD_STACKS_BEGIN'\
        \ -or $apiText -notmatch '~\\* kv' -or $apiText -notmatch '!uniqstack' -or $apiText -notmatch '!analyze -hang') {\n\
        \  throw 'CDB_STACK_EXTRACTION_INVALID: all-thread native stacks and hang analysis are required.'\n}\nWrite-Host 'NATIVE_THREAD_STACKTRACE_VALIDATION=true'\n\
        Write-Host 'PYTHON_NATIVE_THREAD_MAP_VALIDATION=true'\nWrite-Host 'MCP_NOTIFICATION_NONBLOCKING_VALIDATION=true'\n\
        if ($apiText -notmatch 'def _three_d_export_worker' -or $apiText -notmatch 'USE_MESH_DATA' -or $apiText -notmatch\
