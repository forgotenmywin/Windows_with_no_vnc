        <section style="margin-top:14px"><h2>GitHub Release Upload</h2><div class="muted small">Upload the latest monitor screenshot to the current repository's Release using GitHub REST API.</div>
        <div class="upload row"><label>Release tag <input id="tag" value="ue5.8" maxlength="100"></label><label>Asset name <input id="assetName" value="" placeholder="auto timestamp" maxlength="120"></label>
        <button id="uploadBtn">Save latest screenshot to Release</button></div><div id="uploadStatus" class="small muted" style="margin-top:8px"></div></section></div>
        <section><div class="row" style="justify-content:space-between"><h2>Tool Activity</h2><span class="muted small">refresh every 5 sec</span></div><div id="events"><div class="muted">Waiting for MCP tool calls…</div></div></section>
        <section id="scenePanel" style="grid-column:1/-1"><div class="row" style="justify-content:space-between"><h2>Read-only 3D Scene Explorer</h2><span class="pill" id="sceneStatus">Waiting for scene data</span></div>
        <div class="small muted">Approximate spatial view built from Actor transforms and bounding boxes. Drag to orbit, scroll to zoom, right-drag to pan. This does not move the Unreal Editor camera or edit the level.</div>
        <div class="scene-layout"><div id="scene3d"><div id="sceneFallback">Loading 3D scene viewer…</div></div><div class="scene-side"><div class="row"><button id="sceneRefresh">Refresh scene</button><select id="sceneFilter"><option value="all">All objects</option><option>Characters</option><option>Lights</option><option>Cameras</option><option>Meshes</option><option>Volumes</option><option>Actors</option></select></div><div id="sceneCounts" class="diag"></div><div id="actorList" class="actor-list">No actor data yet.</div></div></div></section>
        <section id="projectPanel" style="grid-column:1/-1"><h2>Projects & Plugins</h2><div class="row"><label>Project <select id="projectSelect" style="min-width:280px"></select></label><button id="openProjectBtn">Open project (restart Unreal)</button><button id="refreshProjects">Refresh</button><span class="small muted" id="projectStatus"></span></div>
        <div class="plugin-box"><div class="row"><b>Installed Unreal plugins</b><button id="refreshPlugins">Refresh plugins</button></div><div class="small muted">Toggle installed plugins or install a plugin ZIP into the active project's Plugins folder. The .uproject descriptor is backed up and Unreal restarts to apply changes. Core remote-control plugins cannot be disabled.</div><div class="row"><input id="pluginZip" type="file" accept=".zip"><button id="installPluginBtn">Install plugin ZIP</button><span class="small muted" id="pluginInstallStatus"></span></div><div id="pluginList" class="actor-list">Loading plugins…</div></div></section>
        <section id="opsPanel" style="grid-column:1/-1"><h2>System, Checkpoints & Packaging</h2><div class="ops-grid"><div><b>Windows runner status</b><div id="systemStats" class="diag">Loading system metrics…</div><button id="optimizeBtn">Optimize Unreal priority</button><details><summary>Top Windows processes</summary><div id="processList" class="actor-list">Loading…</div></details><div class="small muted">Only Unreal Editor is raised to Above Normal priority. Windows services and other processes are never killed.</div></div>
        <div><b>Project checkpoints</b><div class="row"><button id="saveAllBtn">Save changes now</button><button id="checkpointBtn">Create checkpoint ZIP</button><select id="checkpointSelect" style="min-width:240px"></select><button id="restoreBtn">Restore selected checkpoint</button></div><div id="checkpointStatus" class="small muted">Checkpoints exclude caches, Saved, Intermediate and Binaries.</div></div>
        <div><b>Windows x64 Shipping build</b><div class="row"><button id="packageBtn">Build & ZIP project</button><label>Release tag <input id="buildReleaseTag" value="ue5.8" maxlength="100" style="width:105px"></label><button id="publishPackageBtn" disabled>Publish ZIP to GitHub Release</button></div><div id="packageStatus" class="small muted">Requires a packageable project, valid maps/configuration and Windows build tools. May use significant CPU, RAM and disk.</div></div></div></section>
        <section id="mcpPanel" style="grid-column:1/-1"><h2>Additional Remote MCP Servers</h2><div class="small muted">Register external HTTPS Streamable-HTTP MCP servers. Supports no-auth or Bearer token; OAuth and local stdio servers are not supported by this gateway. Remote tool calls can change external data and require confirmation.</div>
        <div class="row mcp-form"><input id="mcpName" placeholder="Server name"><input id="mcpUrl" placeholder="https://mcp.example.com/mcp" style="min-width:300px"><input id="mcpToken" type="password" placeholder="Bearer token (optional)" style="min-width:220px"><button id="addMcpBtn">Add MCP server</button><button id="refreshMcpBtn">Refresh</button></div><div id="mcpServers" class="actor-list">No remote MCP servers registered.</div><div id="mcpStatus" class="small muted"></div></section>
        <section id="logsPanel" style="grid-column:1/-1"><div class="row" style="justify-content:space-between"><h2>Logs & Connection Diagnostics</h2><span class="muted small" id="logSummary">Loading system logs…</span></div>
        <div class="diag"><span class="pill" id="apiDiag">API: checking</span><span class="pill" id="bridgeDiag">Bridge: checking</span><span class="pill" id="mcpDiag">MCP: waiting for client</span><span class="pill" id="tunnelDiag">Tunnel: URL pending</span></div>
        <div class="small muted" id="mcpAddress" style="overflow-wrap:anywhere">MCP endpoint: not registered</div>
        <div class="log-controls"><label>Source <select id="logSource"><option value="all">All components</option></select></label>
        <label>Level <select id="logLevel"><option value="all">All levels</option><option value="ERROR">Errors</option><option value="WARN">Warnings</option><option value="INFO">Info</option><option value="DEBUG">Debug</option></select></label>
        <label>Search <input id="logSearch" type="search" placeholder="Search connection, error, tool…" style="min-width:220px"></label>
        <button id="refreshLogs">Refresh logs</button><label class="small"><input id="autoLogs" type="checkbox" checked> Auto-refresh</label></div>
        <pre id="logOutput" class="log-output">Waiting for API, Unreal, Bridge, MCP and Cloudflare logs…</pre></section></main>
        <script>
        const $=id=>document.getElementById(id);let imageVersion=-1,captureBusy=false,logsBusy=false,lastLogText='';
        function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
        async function update(){try{const r=await fetch('/api/monitor/state',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const s=await r.json();
        $('bridge').textContent=s.bridge_connected?'Bridge connected':'Bridge offline';$('bridge').className='pill '+(s.bridge_connected?'green':'red');$('clock').textContent=new Date(s.time*1000).toLocaleTimeString();
        $('bridgeDiag').textContent=s.bridge_connected?'Bridge: connected':'Bridge: offline';$('bridgeDiag').className='pill '+(s.bridge_connected?'green':'red');
        $('apiDiag').textContent='API: responding';$('apiDiag').className='pill green';$('mcpAddress').textContent='MCP endpoint: '+(s.mcp_url||'not registered');
        const mc=s.mcp_connection||{};$('mcpDiag').textContent=mc.request_count?('MCP: '+mc.request_count+' requests · last '+(mc.last_method||'request')+' · HTTP '+(mc.last_status??'pending')):'MCP: no client request received';$('mcpDiag').className='pill '+(mc.request_count?'green':'muted');
        $('tunnelDiag').textContent=s.mcp_url?'Tunnel: public URL registered':'Tunnel: URL pending';$('tunnelDiag').className='pill '+(s.mcp_url?'green':'red');
        $('captureError').textContent=s.capture_error||'';$('shotInfo').textContent=s.capture_running?'Capturing…':(s.has_image?'Snapshot #'+s.image_version:'No snapshot yet');
        if(s.has_image&&s.image_version!==imageVersion){$('shot').src='/api/monitor/latest.jpg?v='+s.image_version;$('shot').hidden=false;$('empty').hidden=true;imageVersion=s.image_version;}
        if(s.capture_requested&&s.bridge_connected&&!captureBusy){captureBusy=true;fetch('/api/monitor/capture',{method:'POST'}).catch(()=>{}).finally(()=>{captureBusy=false;});}
        const box=$('events');if(!s.events.length){box.innerHTML='<div class="muted">Waiting for MCP tool calls…</div>';}else{box.innerHTML=s.events.map(e=>`<article class="event"><div class="eventtop"><span class="tool">${esc(e.tool)}</span><span class="status">${esc(e.status)}${e.http_status?' · HTTP '+e.http_status:''}</span></div><div class="muted small">${new Date(e.time*1000).toLocaleString()}${e.duration_ms?' · '+e.duration_ms+' ms':''}</div><pre>${esc(JSON.stringify(e.arguments,null,2))}</pre>${e.result_preview?'<pre>Result: '+esc(e.result_preview)+'</pre>':''}${e.error?'<div class="red small">'+esc(e.error)+'</div>':''}</article>`).join('');}
        }catch(e){$('bridge').textContent='Monitor API unavailable: '+e.message;$('bridge').className='pill red';}}
        async function updateLogs(){if(logsBusy)return;logsBusy=true;try{const params=new URLSearchParams({source:$('logSource').value,level:$('logLevel').value,q:$('logSearch').value,limit:'700'});const r=await fetch('/api/monitor/logs?'+params.toString(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();
        const select=$('logSource');if(select.options.length===1){for(const source of data.sources){const option=document.createElement('option');option.value=source;option.textContent=source;select.appendChild(option);}}
        const c=data.connection||{};$('apiDiag').textContent='API: responding';$('apiDiag').className='pill green';$('bridgeDiag').textContent=c.bridge_connected?'Bridge: connected':'Bridge: offline';$('bridgeDiag').className='pill '+(c.bridge_connected?'green':'red');
        $('mcpDiag').textContent=c.request_count?('MCP: '+c.request_count+' requests · '+(c.last_method||'')+' · HTTP '+(c.last_status??'pending')):'MCP: no request has reached this server';$('mcpDiag').className='pill '+(c.request_count?'green':'muted');
        $('tunnelDiag').textContent=c.mcp_url?'Tunnel URL registered':'Tunnel URL unavailable';$('tunnelDiag').className='pill '+(c.mcp_url?'green':'red');$('mcpAddress').textContent='MCP endpoint: '+(c.mcp_url||'not registered')+(c.last_seen?' · last request '+new Date(c.last_seen*1000).toLocaleString():'');
        $('logSummary').textContent=data.count+' log lines · updated '+new Date(data.generated_at*1000).toLocaleTimeString();
        const output=data.entries.map(e=>{const cls=e.level==='ERROR'?'log-error':e.level==='WARN'?'log-warn':e.level==='DEBUG'?'log-debug':'log-info';return '<span class="'+cls+'">'+esc(e.timestamp)+' ['+esc(e.source)+'] ['+esc(e.level)+'] '+esc(e.message)+'</span>';}).join('\n');
        if(output!==lastLogText){const box=$('logOutput');const shouldScroll=box.scrollTop+box.clientHeight>=box.scrollHeight-45;box.innerHTML=output||'No matching log entries.';lastLogText=output;if(shouldScroll)box.scrollTop=box.scrollHeight;}
        }catch(e){$('logSummary').textContent='Could not load logs: '+e.message;$('logOutput').textContent='Log API error: '+e.message+'\nCheck the API process and /api/monitor/logs endpoint.';}finally{logsBusy=false;}}
        $('refreshLogs').addEventListener('click',updateLogs);$('logSource').addEventListener('change',updateLogs);$('logLevel').addEventListener('change',updateLogs);$('logSearch').addEventListener('keydown',e=>{if(e.key==='Enter')updateLogs();});
        $('uploadBtn').addEventListener('click',async()=>{const b=$('uploadBtn');b.disabled=true;$('uploadStatus').textContent='Uploading via GitHub API…';try{const r=await fetch('/api/monitor/release-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag:$('tag').value,filename:$('assetName').value,latest_screenshot:true})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Upload failed');$('uploadStatus').innerHTML='Uploaded: <a target="_blank" rel="noreferrer" href="'+esc(j.assets?.[0]?.url||j.release_url)+'">open GitHub Release</a>'; }catch(e){$('uploadStatus').textContent='Upload failed: '+e.message;}finally{b.disabled=false;}});

        async function apiJson(url,options={}){const r=await fetch(url,{cache:'no-store',...options});let j={};try{j=await r.json();}catch(e){}if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));return j;}
        async function loadProjects(){try{const j=await apiJson('/api/projects');const s=$('projectSelect');s.innerHTML='';for(const p of j.projects||[]){const o=document.createElement('option');o.value=p.project_file;o.textContent=(p.is_current?'● ':'')+p.name+' — '+p.project_file;s.appendChild(o);}s.value=j.current_project||'';}catch(e){$('projectStatus').textContent='Project list error: '+e.message;}}
        async function loadPlugins(){try{const j=await apiJson('/api/plugins');$('pluginList').innerHTML=(j.plugins||[]).map(p=>'<label class="actor-row"><input type="checkbox" data-plugin="'+esc(p.name)+'" '+(p.enabled?'checked':'')+' '+(p.required?'disabled':'')+'> <b>'+esc(p.name)+'</b> <span class="actor-meta">'+esc(p.category||'')+' · '+(p.enabled?'enabled':'disabled')+'</span><div class="actor-meta">'+esc(p.description||p.path)+'</div></label>').join('');$('pluginList').querySelectorAll('input[data-plugin]').forEach(el=>el.addEventListener('change',async()=>{const n=el.dataset.plugin;el.disabled=true;try{await apiJson('/api/plugins/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,enabled:el.checked})});$('projectStatus').textContent='Plugin '+n+' updated. Unreal is restarting…';}catch(e){el.checked=!el.checked;$('projectStatus').textContent=e.message;}finally{el.disabled=false;}}));}catch(e){$('pluginList').textContent='Plugin list error: '+e.message;}}
        async function loadSystem(){try{const j=await apiJson('/api/system/status');const u=j.unreal||{};$('systemStats').innerHTML='<span class="pill">CPU '+j.cpu_percent+'%</span><span class="pill">RAM '+j.ram_used_gb+'/'+j.ram_total_gb+' GB ('+j.ram_percent+'%)</span><span class="pill">Disk free '+j.disk_free_gb+' GB</span><span class="pill">Unreal '+(u.memory_mb??'—')+' MB</span><span class="pill">UE CPU '+(u.cpu_percent??'—')+'%</span>';$('processList').innerHTML=(j.top_processes||[]).map(p=>'<div class="actor-row"><b>'+esc(p.name)+'</b><span class="actor-meta">PID '+p.pid+' · '+p.memory_mb+' MB · '+p.cpu_percent+'% CPU</span></div>').join(''); }catch(e){$('systemStats').textContent='System metrics unavailable: '+e.message;}}
        async function loadCheckpoints(){try{const j=await apiJson('/api/checkpoints');const s=$('checkpointSelect');s.innerHTML='';for(const c of j.checkpoints||[]){const o=document.createElement('option');o.value=c.path;o.textContent=c.name+' ('+(c.size/1048576).toFixed(1)+' MB)';s.appendChild(o);}}catch(e){$('checkpointStatus').textContent=e.message;}}
        async function loadMcpServers(){try{const j=await apiJson('/api/mcp/servers');$('mcpServers').innerHTML=(j.servers||[]).map(s=>'<div class="actor-row"><b>'+esc(s.name)+'</b> <span class="actor-meta">'+esc(s.auth)+'</span><div class="actor-meta">'+esc(s.url)+'</div><button data-mcp-remove="'+esc(s.name)+'">Remove</button> <button data-mcp-tools="'+esc(s.name)+'">List tools</button></div>').join('')||'No remote MCP servers registered.';$('mcpServers').querySelectorAll('[data-mcp-remove]').forEach(b=>b.onclick=async()=>{try{await apiJson('/api/mcp/servers/'+encodeURIComponent(b.dataset.mcpRemove),{method:'DELETE'});loadMcpServers();}catch(e){$('mcpStatus').textContent=e.message;}});$('mcpServers').querySelectorAll('[data-mcp-tools]').forEach(b=>b.onclick=async()=>{try{const j=await apiJson('/api/mcp/tools?server='+encodeURIComponent(b.dataset.mcpTools));$('mcpStatus').textContent=(j.tools||[]).map(t=>t.name+': '+(t.description||'')).join(' | ')||'No tools';}catch(e){$('mcpStatus').textContent='Remote MCP test failed: '+e.message;}});}catch(e){$('mcpStatus').textContent=e.message;}}
        $('refreshProjects').onclick=loadProjects;$('refreshPlugins').onclick=loadPlugins;$('refreshMcpBtn').onclick=loadMcpServers;$('installPluginBtn').onclick=async()=>{const f=$('pluginZip').files[0];if(!f){$('pluginInstallStatus').textContent='Choose a plugin ZIP first.';return;}if(!confirm('Install and enable '+f.name+'? Unreal will restart.'))return;const data=new FormData();data.append('file',f);$('installPluginBtn').disabled=true;$('pluginInstallStatus').textContent='Installing…';try{const r=await fetch('/api/plugins/install',{method:'POST',body:data});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Install failed');$('pluginInstallStatus').textContent='Installed '+j.plugin+'. Unreal is restarting…';}catch(e){$('pluginInstallStatus').textContent=e.message;}finally{$('installPluginBtn').disabled=false;}};$('sceneRefresh').onclick=()=>window.refreshSceneSnapshot?.();
        $('openProjectBtn').onclick=async()=>{const project_file=$('projectSelect').value;if(!project_file)return; if(!confirm('Save current work and restart Unreal with the selected project?'))return;try{await apiJson('/api/projects/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_file})});$('projectStatus').textContent='Switch queued. Unreal will restart.';}catch(e){$('projectStatus').textContent=e.message;}};
        $('saveAllBtn').onclick=async()=>{const b=$('saveAllBtn');b.disabled=true;$('checkpointStatus').textContent='Saving dirty Unreal packages…';try{const j=await apiJson('/api/editor/save',{method:'POST'});$('checkpointStatus').textContent=j.ok?'All dirty packages saved.':'Save result: '+JSON.stringify(j);}catch(e){$('checkpointStatus').textContent='Save failed: '+e.message;}finally{b.disabled=false;}};
        $('checkpointBtn').onclick=async()=>{const b=$('checkpointBtn');b.disabled=true;$('checkpointStatus').textContent='Saving assets and creating ZIP…';try{const j=await apiJson('/api/checkpoints/create',{method:'POST'});$('checkpointStatus').textContent='Created '+j.checkpoint+' · '+j.files+' files';await loadCheckpoints();}catch(e){$('checkpointStatus').textContent='Checkpoint failed: '+e.message;}finally{b.disabled=false;}};
        $('restoreBtn').onclick=async()=>{const checkpoint=$('checkpointSelect').value;if(!checkpoint)return;if(!confirm('Restore this checkpoint? Unreal will close and restart. Current files may be replaced.'))return;try{await apiJson('/api/checkpoints/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({checkpoint,confirm_restore:true})});$('checkpointStatus').textContent='Restore queued. Unreal is restarting…';}catch(e){$('checkpointStatus').textContent=e.message;}};
        $('optimizeBtn').onclick=async()=>{try{const j=await apiJson('/api/system/optimize',{method:'POST'});$('systemStats').textContent='Unreal priority set to '+j.priority+'.';}catch(e){$('systemStats').textContent=e.message;}};
        let packageJob=null,completedPackageZip='';$('packageBtn').onclick=async()=>{if(!confirm('Start Windows x64 Shipping build? This can use considerable CPU, RAM and disk.'))return;try{const j=await apiJson('/api/package/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm_build:true})});packageJob=j.job_id;$('packageStatus').textContent='Build queued: '+packageJob;}catch(e){$('packageStatus').textContent='Build could not start: '+e.message;}};
        $('publishPackageBtn').onclick=async()=>{if(!completedPackageZip)return;if(!confirm('Publish this executable package publicly to GitHub Release?'))return;const b=$('publishPackageBtn');b.disabled=true;$('packageStatus').textContent='Uploading package to GitHub Release…';try{const j=await apiJson('/github/release/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:completedPackageZip,tag:$('buildReleaseTag').value})});$('packageStatus').innerHTML='Published. <a target="_blank" rel="noreferrer" href="'+esc(j.assets?.[0]?.url||j.release_url)+'">Open GitHub Release</a>'+(j.split_into_parts?' · file split into parts':'');}catch(e){$('packageStatus').textContent='Release upload failed: '+e.message;}finally{b.disabled=false;}};
        $('addMcpBtn').onclick=async()=>{try{const j=await apiJson('/api/mcp/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('mcpName').value,url:$('mcpUrl').value,bearer_token:$('mcpToken').value})});$('mcpStatus').textContent='Added '+j.name+'.';$('mcpToken').value='';await loadMcpServers();}catch(e){$('mcpStatus').textContent='Could not add MCP: '+e.message;}};
        loadProjects();loadPlugins();loadSystem();loadCheckpoints();loadMcpServers();setInterval(loadSystem,10000);setInterval(()=>{if(packageJob){apiJson('/api/package/status?job_id='+encodeURIComponent(packageJob)).then(j=>{const p=j.job||{};$('packageStatus').textContent='Build '+p.status+': '+(p.last_line||p.error||'');if(p.status==='completed'){completedPackageZip=p.zip;$('publishPackageBtn').disabled=false;$('packageStatus').innerHTML='Completed. <a href="/api/package/download?path='+encodeURIComponent(p.zip)+'">Download packaged ZIP</a>';packageJob=null;}if(p.status==='failed')packageJob=null;}).catch(e=>$('packageStatus').textContent=e.message);}},5000);

        update();updateLogs();setInterval(update,5000);setInterval(()=>{if($('autoLogs').checked)updateLogs();},8000);
        </script>
        <script type="module">
        let THREE,OrbitControls;const root=document.getElementById('scene3d');let scene,camera,renderer,controls,group,actors=[];
        function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x080d14);camera=new THREE.PerspectiveCamera(55,1,0.1,1000000);camera.position.set(900,-1100,850);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));root.innerHTML='';root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const grid=new THREE.GridHelper(5000,50,0x496078,0x26394c);scene.add(grid);group=new THREE.Group();scene.add(group);const axes=new THREE.AxesHelper(250);scene.add(axes);resize();new ResizeObserver(resize).observe(root);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}animate();}
        function resize(){if(!renderer||!root.clientWidth)return;const w=root.clientWidth,h=root.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
        function colorFor(c){return ({Characters:0xffc857,Lights:0xffe08a,Cameras:0x70b7ff,Meshes:0x8ea6bd,Volumes:0xc28bff,Actors:0x55d6be,Errors:0xff7777})[c]||0xaeb7c4;}
        function renderActors(rows){actors=rows||[];while(group.children.length){const o=group.children[0];group.remove(o);o.geometry?.dispose();o.material?.dispose();}const bounds=new THREE.Box3();for(const a of actors){if(!a.location||a.hidden)continue;const e=a.bounds_extent||{x:25,y:25,z:25};const sx=Math.max(8,Math.abs(e.x*2)),sy=Math.max(8,Math.abs(e.y*2)),sz=Math.max(8,Math.abs(e.z*2));const geo=new THREE.BoxGeometry(sx,sz,sy);const mat=new THREE.MeshStandardMaterial({color:colorFor(a.category),transparent:true,opacity:0.68,roughness:0.8,metalness:0.05});const mesh=new THREE.Mesh(geo,mat);mesh.position.set(a.location.x,a.location.z,a.location.y);mesh.rotation.set(THREE.MathUtils.degToRad(a.rotation?.pitch||0),THREE.MathUtils.degToRad(a.rotation?.yaw||0),THREE.MathUtils.degToRad(a.rotation?.roll||0));mesh.userData.actor=a;group.add(mesh);const p=new THREE.Vector3(a.location.x,a.location.z,a.location.y);bounds.expandByPoint(p);}if(actors.length&&bounds.isEmpty()===false){const center=bounds.getCenter(new THREE.Vector3());controls.target.copy(center);const size=bounds.getSize(new THREE.Vector3()).length();camera.position.copy(center).add(new THREE.Vector3(size*0.8,-size*1.1,size*0.8));controls.update();}renderList();}
        function renderList(){const f=document.getElementById('sceneFilter').value;const rows=actors.filter(a=>f==='all'||a.category===f);document.getElementById('actorList').innerHTML=rows.slice(0,500).map(a=>'<div class="actor-row"><b>'+safe(a.name)+'</b> <span class="actor-meta">'+safe(a.category)+' · '+safe(a.class)+'</span><div class="actor-meta">Location: '+(a.location?`${a.location.x.toFixed(1)}, ${a.location.y.toFixed(1)}, ${a.location.z.toFixed(1)}`:'—')+' cm · Extent: '+(a.bounds_extent?`${a.bounds_extent.x.toFixed(1)}, ${a.bounds_extent.y.toFixed(1)}, ${a.bounds_extent.z.toFixed(1)}`:'—')+'</div></div>').join('')||'No actors in this category.';const cats={};for(const a of actors)cats[a.category]=(cats[a.category]||0)+1;document.getElementById('sceneCounts').innerHTML=Object.entries(cats).map(([k,v])=>'<span class="pill">'+safe(k)+': '+v+'</span>').join('');}
