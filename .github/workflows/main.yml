name: Generate Google Drive OAuth Token

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose start to get Google sign-in link, or exchange after approving access'
        type: choice
        required: true
        default: start
        options:
          - start
          - exchange
      callback_url:
        description: 'After Google approval, paste the full browser URL that starts with http://localhost/?code=... (used only for exchange)'
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Python dependency
        if: inputs.mode == 'exchange'
        run: python -m pip install --disable-pip-version-check requests

      - name: Generate Google authorization link
        if: inputs.mode == 'start'
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys
          from urllib.parse import urlencode

          raw = os.environ.get("GOOGLE_OAUTH_CLIENT_JSON", "")
          if not raw:
              sys.exit("Missing repository secret GOOGLE_OAUTH_CLIENT_JSON. Add the complete OAuth client JSON (the file containing the 'installed' section).")
          try:
              doc = json.loads(raw)
              cfg = doc.get("installed") or doc.get("web")
              if not cfg or not cfg.get("client_id") or not cfg.get("client_secret"):
                  raise ValueError("OAuth JSON must contain installed/web.client_id and client_secret")
          except Exception as e:
              sys.exit(f"Invalid GOOGLE_OAUTH_CLIENT_JSON: {e}")

          # Use the loopback redirect URI declared by the provided Desktop OAuth client.
          redirect_uri = "http://localhost"
          state = "ue-drive-oauth-manual-approval-v1"
          params = {
              "client_id": cfg["client_id"],
              "redirect_uri": redirect_uri,
              "response_type": "code",
              "scope": "https://www.googleapis.com/auth/drive",
              "access_type": "offline",
              "prompt": "consent",
              "state": state,
          }
          url = "https://accounts.google.com/o/oauth2/v2/auth?" + urlencode(params)
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as f:
              f.write("## Step 1 — Authorize Google Drive\n\n")
              f.write("1. Open this link and sign in to the Google account that owns the Drive.\n\n")
              f.write(f"[Open Google authorization page]({url})\n\n")
              f.write("2. Approve access. Google will redirect the browser to `http://localhost` and may show a connection error; that is expected because the temporary GitHub runner is not your local computer.\n\n")
              f.write("3. Copy the **full URL from the browser address bar** after the redirect. Do not send it in chat. Then run this workflow again with `mode = exchange` and paste that URL into `callback_url`.\n\n")
              f.write("If Google shows `redirect_uri_mismatch`, stop: this OAuth client does not allow the redirect URI used by this workflow, and the client configuration must be corrected.\n")
          print("Authorization URL written to the Actions run summary. The URL and OAuth secrets are not printed to the log.")
          PY

      - name: Exchange authorization code and create user token file
        if: inputs.mode == 'exchange'
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs
          import requests

          raw = os.environ.get("GOOGLE_OAUTH_CLIENT_JSON", "")
          callback = os.environ.get("CALLBACK_URL", "").strip()
          if not raw:
              sys.exit("Missing repository secret GOOGLE_OAUTH_CLIENT_JSON.")
          if not callback:
              sys.exit("You selected exchange but did not paste the full localhost redirect URL into callback_url.")
          try:
              doc = json.loads(raw)
              cfg = doc.get("installed") or doc.get("web")
              if not cfg or not cfg.get("client_id") or not cfg.get("client_secret"):
                  raise ValueError("OAuth JSON must contain installed/web.client_id and client_secret")
          except Exception as e:
              sys.exit(f"Invalid GOOGLE_OAUTH_CLIENT_JSON: {e}")

          parsed = urlparse(callback)
          query = parse_qs(parsed.query)
          if parsed.scheme != "http" or parsed.hostname != "localhost":
              sys.exit("callback_url must be the full redirected URL from the browser address bar and must start with http://localhost")
          if query.get("error"):
              sys.exit("Google authorization was not completed: " + query["error"][0])
          code = (query.get("code") or [""])[0]
          state = (query.get("state") or [""])[0]
          if not code:
              sys.exit("No authorization code was found in callback_url. Paste the full redirected URL, not just the first link.")
          if state != "ue-drive-oauth-manual-approval-v1":
              sys.exit("OAuth state did not match. Run mode=start again and use the callback URL from that run.")

          token_uri = cfg.get("token_uri", "https://oauth2.googleapis.com/token")
          try:
              response = requests.post(
                  token_uri,
                  data={
                      "code": code,
                      "client_id": cfg["client_id"],
                      "client_secret": cfg["client_secret"],
                      "redirect_uri": "http://localhost",
                      "grant_type": "authorization_code",
                  },
                  timeout=45,
              )
          except requests.RequestException as e:
              sys.exit("Could not connect to Google's token endpoint. Check runner outbound HTTPS/network. Details: " + type(e).__name__)
          if not response.ok:
              try:
                  err = response.json().get("error_description") or response.json().get("error") or f"HTTP {response.status_code}"
              except Exception:
                  err = f"HTTP {response.status_code}"
              sys.exit("Google rejected the token exchange: " + str(err))

          data = response.json()
          refresh_token = data.get("refresh_token")
          access_token = data.get("access_token")
          if not access_token or not refresh_token:
              sys.exit("Google did not return both access_token and refresh_token. Run mode=start again and approve consent; access_type=offline and prompt=consent are requested.")

          user_token = {
              "token": access_token,
              "refresh_token": refresh_token,
              "token_uri": token_uri,
              "client_id": cfg["client_id"],
              "client_secret": cfg["client_secret"],
              "scopes": data.get("scope", "https://www.googleapis.com/auth/drive").split(),
          }
          Path("authorized_user.json").write_text(json.dumps(user_token, indent=2), encoding="utf-8")
          print("OAuth user token created. Token values are intentionally not printed.")
          PY

      - name: Upload authorized_user.json as a short-lived artifact
        if: inputs.mode == 'exchange'
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-oauth-token
          path: authorized_user.json
          if-no-files-found: error
          retention-days: 1
