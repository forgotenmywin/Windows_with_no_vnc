        #scene3d{height:620px;min-height:480px;background:#080d14;border:1px solid #303946;border-radius:10px;position:relative;overflow:hidden;touch-action:none}#scene3d canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}#scene3d canvas:active{cursor:grabbing}#sceneFallback{position:absolute;inset:0;display:grid;place-items:center;color:#d7e3f4;text-align:center;padding:20px;background:rgba(8,13,20,.74);pointer-events:none;z-index:2}#sceneFallback[hidden]{display:none}.scene-model-status{margin:8px 0 12px;padding:9px 11px;background:#101720;border:1px solid #303946;border-radius:8px;color:#bcd0e8;font-size:12px;overflow-wrap:anywhere}.scene-toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0}.scene-toolbar button{white-space:nowrap}.scene-toolbar .primary{background:#254b70;border-color:#5d91c2}.scene-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:12px;margin-top:12px}.scene-side{min-width:0}.actor-list{max-height:570px;overflow:auto;margin-top:9px;display:flex;flex-direction:column;gap:6px}.actor-row{border:1px solid #303946;background:#111720;padding:8px 10px;border-radius:7px;font-size:12px;overflow-wrap:anywhere}.actor-row b{color:#dbeafe}.actor-meta{color:#9ca8b8;font-size:11px}.plugin-box{border-top:1px solid #303946;margin-top:14px;padding-top:12px}details{margin-top:10px}summary{cursor:pointer;color:#bcd0e8;font-size:12px}.ops-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.ops-grid>div{background:#111720;border:1px solid #303946;padding:12px;border-radius:9px;min-width:0}.mcp-form{margin-top:10px}.mcp-form input{min-width:160px}.scene-legend{font-size:11px;color:#9ca8b8;margin-top:8px}
