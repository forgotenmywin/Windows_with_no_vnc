        \ Python scripts failed syntax validation.' }\n$apiText = Get-Content -LiteralPath 'D:\\UE58\\api_server.py' -Raw\
        \ -Encoding utf8\nif ($apiText -notmatch 'BLUEPRINT_AUTOCREATE_IF_MISSING' -or $apiText -notmatch 'AssetToolsHelpers'\
        \ -or $apiText -notmatch 'EditorAssetLibrary\\.make_directory' -or $apiText -notmatch 'BLUEPRINT_ASSET_CREATED') {\n\
        \  throw 'BLUEPRINT_AUTOCREATE_VALIDATION_FAILED: safe Blueprint search/create/save verification is missing.'\n}\n\
        if ($apiText -notmatch '(?m)^\\s{8}mcp_timeout\\s*=\\s*httpx\\.Timeout\\(connect=10\\.0, read=120\\.0, write=60\\\
        .0, pool=15\\.0\\)\\s*$') {\n  throw 'MCP_TIMEOUT_ASSIGNMENT_INVALID: mcp_timeout must be a standalone executable\
        \ Python line, not part of a comment.'\n}\nif ($apiText -notmatch 'async def public_app' -or $apiText -notmatch 'canonical_request_path')\
        \ {\n  throw 'PUBLIC_MCP_ROUTER_INVALID: /mcp public ASGI dispatcher was not generated.'\n}\nif ($apiText -notmatch\
        \ 'def _headless_wait_for_editor_save' -or $apiText -notmatch 'wait_unreal_job\\(save_job_id, 25\\)' -or $apiText\
        \ -notmatch 'waiting_for_editor_save') {\n  throw 'HEADLESS_ASYNC_SAVE_INVALID: pending Editor saves must complete\
        \ in the background before commandlet dispatch.'\n}\n# Validate the actual implementation instead of requiring obsolete\
        \ comment text.\n# The SSE reader must parse a complete JSON-RPC data line before stream EOF,\n# including a final\
        \ data line that has not received its newline yet.\nif ($apiText -notmatch 'async def read_mcp_http_reply\\(' -or\n\
        \    $apiText -notmatch 'async for chunk in response\\.aiter_text\\(\\):' -or\n    $apiText -notmatch 'candidate_line\
        \ = line_buffer\\.rstrip' -or\n    $apiText -notmatch 'if candidate_line\\.startswith\\(''data:''\\):' -or\n    $apiText\
        \ -notmatch 'async def mcp_post_and_read\\(') {\n  throw 'MCP_STREAM_READER_INVALID: immediate SSE parsing of complete\
        \ and unfinished data lines is required.'\n}\n# Initialized notifications must inspect HTTP status/headers and close\
        \ the\n# stream without waiting for a response body that may never arrive.\nif ($apiText -notmatch 'notify_status\
        \ = notify\\.status_code' -or\n    $apiText -notmatch 'notify_content_type = notify\\.headers\\.get\\(''content-type'',\
        \ ''''\\)' -or\n    $apiText -notmatch 'if notify_status not in \\(200, 202, 204\\):') {\n  throw 'MCP_NOTIFICATION_READER_INVALID:\
        \ notification handling must validate HTTP metadata without waiting for a body.'\n}\nWrite-Host 'MCP_STREAM_READER_VALIDATION=true'\n\
        \n# Native C++/Windows thread-stack access: ProcDump creates a read-only snapshot,\n# then CDB emits every thread's\
        \ native stack from the dump. No live attach/kill.\nif (-not (Test-Path -LiteralPath $env:UE58_PROCDUMP) -or -not\
        \ (Test-Path -LiteralPath $env:UE58_CDB)) {\n  throw 'NATIVE_THREAD_DEBUGGER_TOOLS_MISSING: ProcDump and CDB must\
        \ be installed before the API starts.'\n}\nif ($apiText -notmatch 'def _thread_stack_capture_worker' -or\n    $apiText\
        \ -notmatch 'def _get_thread_stack_capture_status' -or\n    $apiText -notmatch \"@app.post\\('/api/diagnostics/thread-stacks'\\\
        )\" -or\n    $apiText -notmatch 'unreal_get_thread_stack_traces' -or\n    $apiText -notmatch '~\\* kv' -or $apiText\
        \ -notmatch '!uniqstack' -or $apiText -notmatch '!analyze -hang' -or $apiText -notmatch '!analyze -v6' -or $apiText\
        \ -notmatch '!locks') {\n  throw 'NATIVE_THREAD_STACKTRACE_FEATURE_MISSING: CDB must analyze all native Unreal threads\
        \ and expose a pollable MCP tool.'\n}\n$nativeBridgeText = Get-Content -LiteralPath 'D:\\UE58\\UEControl\\Content\\\
        Python\\init_unreal.py' -Raw -Encoding utf8\nif ($nativeBridgeText -notmatch 'PYTHON_THREAD_MAP_BEGIN' -or $nativeBridgeText\
        \ -notmatch 'native_id') {\n  throw 'PYTHON_THREAD_ID_MAP_MISSING: faulthandler snapshots must include Python thread\
        \ names and native thread IDs.'\n}\nif ($apiText -notmatch 'returncode != 0' -or $apiText -notmatch \"b'MDMP'\" -or\
        \ $apiText -notmatch 'PROCDUMP_NONZERO_EXIT_BUT_VALID_DUMP') {\n  throw 'PROCDUMP_VALID_DUMP_HANDLING_INVALID: a valid\
        \ MDMP must be analyzed even when ProcDump returns a nonzero exit code.'\n}\nif ($apiText -notmatch 'UE58_NATIVE_THREAD_STACKS_BEGIN'\
