        \ 'project_local' -or $apiText -notmatch 'startup_script' -or $apiText -notmatch 'PythonScriptPlugin.PythonScriptPluginSettings')\
        \ {\n  throw 'PROJECT_BRIDGE_STARTUP_CONFIGURATION_MISSING: Blueprint/Bridge projects still need isolated startup-script\
        \ configuration.'\n}\nif ($apiText -notmatch 'section_index \\+ 1, startup_line' -or $apiText -notmatch 'PythonScriptPlugin.PythonScriptPluginSettings')\
        \ {\n  throw 'PROJECT_STARTUP_CONFIG_INVALID: StartupScripts must be written inside PythonScriptPlugin settings.'\n\
        }\nif ($apiText -notmatch 'BLUEPRINT_EXPLORER_FEATURE_MARKERS' -or $apiText -notmatch 'bpConnected=false' -or $apiText\
        \ -notmatch 'write_graph_dsl' -or $apiText -notmatch 'Send / Apply Changes' -or $apiText -notmatch 'bpLogOutput' -or\
        \ $apiText -notmatch 'BLUEPRINT_TOOL_SEARCH_DISPATCH_MARKERS') {\n  throw 'BLUEPRINT_EXPLORER_VALIDATION_FAILED: explicit\
        \ offline state, staged graph apply and logs are required.'\n}\nif ($apiText -notmatch 'BLUEPRINT_CUSTOM_PATH_UI_IMPLEMENTATION'\
        \ -or $apiText -notmatch 'bpCustomPathInput' -or $apiText -notmatch 'bpCheckCustomPathBtn' -or $apiText -notmatch\
        \ 'bpNormalizeCustomPackagePath' -or $apiText -notmatch 'bpCheckCustomPath') {\n  throw 'BLUEPRINT_CUSTOM_PATH_UI_MISSING:\
        \ the main File Manager Blueprint tab must expose a local custom package/object path field and an explicit connected-only\
        \ asset check.'\n}\nWrite-Host 'BLUEPRINT_CUSTOM_PATH_UI_VALIDATION=true'\nif ($apiText -notmatch 'BLUEPRINT_EXPLORER_UI_IMPLEMENTATION'\
        \ -or $apiText -notmatch \"@app.get\\('/blueprint-explorer'\\)\" -or $apiText -notmatch 'BLUEPRINT_EXPLORER_HTML'\
        \ -or $apiText -notmatch \"@app.get\\('/api/blueprint/explorer/status'\\)\" -or $apiText -notmatch 'BLUEPRINT_EXPLORER_DYNAMIC_BASE_URL'\
        \ -or $apiText -notmatch 'apiFetch\\(' -or $apiText -notmatch 'endpoint\\(' -or $apiText -notmatch 'BLUEPRINT_EXPLORER_CORS_SUPPORT'\
        \ -or $apiText -notmatch 'UE58_BLUEPRINT_ALLOW_FILE_ORIGIN') {\n  throw 'BLUEPRINT_EXPLORER_CONNECTION_VALIDATION_FAILED:\
        \ configurable absolute server URL, authenticated API fetch and explicit CORS handling are required.'\n}\nif ($apiText\
        \ -notmatch 'BLUEPRINT_PROJECT_SELECTOR_FEATURE_MARKERS' -or $apiText -notmatch 'def _project_files\\(' -or $apiText\
        \ -notmatch 'project_root=str\\(ROOT\\)' -or $apiText -notmatch '@app\\.get\\(''/api/projects''\\)') {\n  throw 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION_FAILED:\
        \ project discovery must scan the configured D:\\\\UE58 root and expose it to the Blueprint UI.'\n}\nif ($apiText\
        \ -notmatch 'def api_fs_read' -or $apiText -notmatch 'def api_fs_write' -or $apiText -notmatch 'content_base64' -or\
        \ $apiText -notmatch 'def _fs_atomic_write') {\n  throw 'FILE_MANAGER_READ_WRITE_VALIDATION_FAILED: byte-safe file\
        \ read and atomic file write routes are required.'\n}\nif ($apiText -notmatch 'def api_fs_move' -or $apiText -notmatch\
        \ 'def _fs_move_paths' -or $apiText -notmatch 'file_manager_move_paths') {\n  throw 'FILE_MANAGER_MOVE_VALIDATION_FAILED:\
        \ safe move operation is required.'\n}\nif ($apiText -notmatch 'file_manager_read_file' -or $apiText -notmatch 'file_manager_write_file'\
        \ -or $apiText -notmatch 'file_manager_create_folder' -or $apiText -notmatch 'unreal_save_blueprint_asset' -or $apiText\
        \ -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true') {\n  throw 'FILE_MANAGER_MCP_OR_BLUEPRINT_SAVE_VALIDATION_FAILED:\
        \ read/write/folder MCP tools and disk-verified Blueprint save are required.'\n}\n$listLogToolCount = [regex]::Matches($apiText,\
        \ \"'name': 'file_manager_list_logs'\").Count\n$readLogsToolCount = [regex]::Matches($apiText, \"'name': 'file_manager_read_logs'\"\
        ).Count\nif ($listLogToolCount -ne 1 -or $readLogsToolCount -ne 1 -or\n    $apiText -notmatch 'def _log_source_catalog'\
        \ -or $apiText -notmatch 'def _read_log_source_chunk' -or\n    $apiText -notmatch 'next_offset' -or $apiText -notmatch\
        \ 'max_total_bytes' -or\n    $apiText -notmatch \"@app.get\\('/api/logs/catalog'\\)\" -or $apiText -notmatch 'rate-limit-events')\
        \ {\n  throw 'EXPANDED_LOG_ACCESS_VALIDATION_FAILED: unique log-list/batch-read tools, catalog, byte paging and rate-limit\
        \ log source are required.'\n}\nif ($apiText -notmatch 'MCP_RATE_LIMIT_STATE' -or $apiText -notmatch '_record_rate_limit'\
        \ -or\n    $apiText -notmatch '_rate_limit_delay' -or $apiText -notmatch 'Retry-After' -or\n    $apiText -notmatch\
        \ '_wait_for_mcp_upstream_slot' -or $apiText -notmatch 'MCP_RATE_LIMITED' -or\n    $apiText -notmatch 'def _mcp_post_status_with_retry')\
        \ {\n  throw 'MCP_RATE_LIMIT_RECOVERY_VALIDATION_FAILED: bounded retry, Retry-After handling, request pacing and diagnostics\
        \ are required.'\n}\n$blueprintSaveRouteCount = [regex]::Matches($apiText, '(?m)^def api_blueprint_save\\(').Count\n\
        if ($blueprintSaveRouteCount -ne 1 -or $apiText -notmatch 'def api_blueprint_save_status' -or\n    $apiText -notmatch\
        \ 'EditorLoadingAndSavingUtils.save_packages' -or\n    $apiText -notmatch 'SAVE_PACKAGES_BEGIN' -or $apiText -notmatch\
        \ 'SAVE_PACKAGES_END' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_PHASE=' -or $apiText -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true')\
        \ {\n  throw 'BLUEPRINT_DISK_SAVE_ENDPOINT_MISSING: one targeted save route, package-save begin/end markers, disk\
        \ verification and phase diagnostics are required.'\n}\nif ($apiText -notmatch 'queue_blueprint_save_until_bridge_returns'\
        \ -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_OFFLINE_QUEUE_UNTIL_WORKFLOW_TIMEOUT' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_LOW_LOAD_MODE=ACTIVE'\
        \ -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_LOW_LOAD_MODE=RESTORED' -or\n    $apiText -notmatch 'bp_write_chunked_recovery_copy'\
        \ -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_CHUNKED_COPY_VERIFIED=true') {\n  throw 'BLUEPRINT_SAVE_RECOVERY_VALIDATION_FAILED:\
        \ offline queue, temporary low-load mode restoration, and verified chunked recovery copy are required.'\n}\nWrite-Host\
        \ 'EXPANDED_LOG_ACCESS_VALIDATION=true'\nWrite-Host 'MCP_RATE_LIMIT_RECOVERY_VALIDATION=true'\nif ($apiText -notmatch\
        \ 'BLUEPRINT_MANUAL_PATH_CHECK_API' -or\n    $apiText -notmatch \"@app.post\\('/api/blueprint/check-path'\\)\" -or\n\
        \    $apiText -notmatch \"@app.get\\('/api/blueprint/check-path-status/<job_id>'\\)\" -or\n    $apiText -notmatch\
        \ 'does_asset_exist' -or $apiText -notmatch 'BLUEPRINT_PATH_CHECK_JSON' -or\n    $apiText -notmatch 'bpAssetPath'\
        \ -or $apiText -notmatch 'Check Asset' -or\n    $apiText -notmatch 'applyBlueprintPathToArgs') {\n  throw 'BLUEPRINT_MANUAL_PATH_CHECK_MISSING:\
        \ manual /Game asset path input, Unreal existence validation and graph-tool path binding are required.'\n}\nif ($apiText\
        \ -notmatch 'BLUEPRINT_MANUAL_PATH_APPLY' -or $apiText -notmatch 'bpUsePath' -or $apiText -notmatch 'applyManualBlueprintPath'\
        \ -or $apiText -notmatch 'blueprintObjectPath\\(source\\)') {\n  throw 'BLUEPRINT_MANUAL_PATH_APPLY_VALIDATION_FAILED:\
        \ manual package/object path input must be normalized and applied to selected tool arguments.'\n}\nif ($apiText -notmatch\
        \ 'BLUEPRINT_OBJECT_REF_NORMALIZATION' -or $apiText -notmatch 'refPath:objectPath' -or $apiText -notmatch 'Custom\
        \ Blueprint Object Path' -or $apiText -notmatch 'normalizeBlueprintToolArguments') {\n  throw 'BLUEPRINT_OBJECT_REF_VALIDATION_FAILED:\
        \ custom Blueprint Object Path must be normalized and sent as an object reference with refPath.'\n}\nWrite-Host 'BLUEPRINT_MANUAL_PATH_APPLY_VALIDATION=true'\n\
        if ($apiText -notmatch 'BLUEPRINT_LIST_GRAPHS_BRIDGE_IMPLEMENTATION' -or\n    $apiText -notmatch \"@app.post\\('/api/blueprint/list-graphs'\\\
        )\" -or\n    $apiText -notmatch \"@app.get\\('/api/blueprint/list-graphs-status/<job_id>'\\)\" -or\n    $apiText -notmatch\
        \ 'queue_unreal\\(_blueprint_list_graphs_python_code\\(asset_path\\), 8\\)' -or\n    $apiText -notmatch 'library\\\
        .list_graphs\\(blueprint\\)' -or\n    $apiText -notmatch 'BLUEPRINT_LIST_GRAPHS_JSON' -or\n    $apiText -notmatch\
        \ 'async function listGraphs\\(\\)' -or\n    $apiText -notmatch 'bpListGraphs') {\n  throw 'BLUEPRINT_LIVE_GRAPH_EXPLORER_VALIDATION_FAILED:\
        \ a live List Graphs UI, authenticated API and Unreal Python Bridge operation are required.'\n}\nWrite-Host 'BLUEPRINT_LIVE_GRAPH_EXPLORER_VALIDATION=true'\n\
        Write-Host 'BLUEPRINT_EXPLORER_VALIDATION=true'\nWrite-Host 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION=true'\nWrite-Host\
        \ 'THREE_D_GITHUB_RELEASE_VALIDATION=true'\nWrite-Host 'BRIDGE_BUSY_DIAGNOSTICS_VALIDATION=true'\nWrite-Host 'BRIDGE_RECOVERY_ENDPOINT_VALIDATION=true'\n\
        Write-Host 'PROJECT_PREFLIGHT_VALIDATION=true'\nWrite-Host 'PROJECT_CREATION_DISABLED_VALIDATION=true'\nWrite-Host\
        \ 'THREE_D_PROJECT_SELECTOR_VALIDATION=true'\n"
    - name: Validate existing project safety and headless 3D Scan-before-Export
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$apiPath = 'D:\\UE58\\api_server.py'\nif (-not (Test-Path -LiteralPath $apiPath))\
        \ { throw 'API source is missing.' }\n$apiText = Get-Content -LiteralPath $apiPath -Raw -Encoding utf8\n$required\
        \ = @(\n  'PROJECT_DISCOVERY_EXCLUDES_HEADLESS_JOBS',\n  'PROJECT_CREATION_DISABLED',\n  'THREE_D_EXPORT_SCAN',\n\
        \  'THREE_D_SCAN_UI_IMPLEMENTATION',\n  'THREE_D_SCAN_NO_GUI_REQUIRED',\n  'def _is_selectable_project_file',\n  'def\
        \ _project_files',\n  'def _headless_3d_preflight',\n  'def _three_d_scan_script',\n  'def _three_d_scan_worker',\n\
        \  'def _start_three_d_scan',\n  'def _three_d_scan_payload',\n  \"@app.post('/api/3d/scan')\",\n  \"@app.get('/api/3d/scan/status/<job_id>')\"\
        ,\n  \"@app.post('/api/3d/export')\",\n  'def _start_three_d_export(',\n  'def _three_d_export_worker',\n  'UnrealEditor-Cmd.exe',\n\
        \  'LEVEL_PATH_REQUIRED',\n  'scan_id'\n)\nforeach ($marker in $required) {\n  if (-not $apiText.Contains($marker))\
        \ { throw \"PROJECT_OR_3D_SCAN_VALIDATION_FAILED: missing $marker\" }\n}\nif ($apiText -match 'def _create_new_project\\\
        (') {\n  throw 'EXTRA_PROJECT_CREATION_HELPER_FOUND: additional project creation must remain disabled.'\n}\nif ($apiText\
        \ -match \"'name': 'unreal_create_project'\") {\n  throw 'EXTRA_PROJECT_CREATION_MCP_TOOL_FOUND: no create-project\
        \ tool may be advertised.'\n}\n$createRoute = [regex]::Match($apiText, '(?s)@app\\.post\\(''/api/projects/create''\\\
        ).*?(?=\\n@app\\.)')\nif (-not $createRoute.Success -or\n    $createRoute.Value -notmatch 'PROJECT_CREATION_DISABLED'\
        \ -or\n    $createRoute.Value -notmatch '410') {\n  throw 'PROJECT_CREATION_API_NOT_DISABLED: /api/projects/create\
        \ must return HTTP 410.'\n}\n$scanStart = $apiText.IndexOf('def _start_three_d_scan(')\n$scanEnd = $apiText.IndexOf(\"\
        `ndef \", $scanStart + 5)\nif ($scanStart -lt 0) { throw 'THREE_D_SCAN_START_MISSING' }\nif ($scanEnd -lt 0) { $scanEnd\
        \ = $apiText.Length }\n$scanBody = $apiText.Substring($scanStart, $scanEnd - $scanStart)\nif ($scanBody -notmatch\
        \ 'LEVEL_PATH_REQUIRED' -or\n    $scanBody -notmatch '_headless_3d_preflight\\(project\\)' -or\n    $scanBody -notmatch\
        \ 'UnrealEditor-Cmd.exe') {\n  throw 'THREE_D_SCAN_PREFLIGHT_OR_EXPLICIT_LEVEL_MISSING: Scan must validate the exact\
        \ level and commandlet prerequisites.'\n}\n$exportStart = $apiText.IndexOf('def _start_three_d_export(')\n$exportEnd\
        \ = $apiText.IndexOf(\"`ndef \", $exportStart + 5)\nif ($exportStart -lt 0) { throw 'THREE_D_EXPORT_START_MISSING'\
        \ }\nif ($exportEnd -lt 0) { $exportEnd = $apiText.Length }\n$exportBody = $apiText.Substring($exportStart, $exportEnd\
        \ - $exportStart)\nif ($exportBody -notmatch 'scan_id' -or\n    $exportBody -notmatch '_three_d_scan_payload\\(scan_id\\\
        )' -or\n    $exportBody -notmatch 'Run and complete a 3D Scan before export') {\n  throw 'THREE_D_EXPORT_SCAN_GUARD_MISSING:\
        \ export must validate the persisted completed Scan report.'\n}\n$scanRecovery = $apiText.IndexOf('def _three_d_scan_payload(')\n\
        $scanRecoveryEnd = $apiText.IndexOf(\"`ndef \", $scanRecovery + 5)\nif ($scanRecovery -lt 0) { throw 'THREE_D_SCAN_RECOVERY_FUNCTION_MISSING'\
        \ }\nif ($scanRecoveryEnd -lt 0) { $scanRecoveryEnd = $apiText.Length }\n$scanRecoveryBody = $apiText.Substring($scanRecovery,\
        \ $scanRecoveryEnd - $scanRecovery)\nif ($scanRecoveryBody -notmatch 'scan-.*\\.json' -or $scanRecoveryBody -notmatch\
        \ 'report\\.get\\(''scan_id''\\)') {\n  throw 'THREE_D_SCAN_DISK_RECOVERY_MISSING: completed reports must be recoverable\
        \ from disk on the same runner.'\n}\n# Decode the actual bundled dashboard and verify the UI—not just a marker comment.\n\
        $dashboardCheck = @'\nimport base64, re, sys, zlib\nfrom pathlib import Path\nsource = Path(sys.argv[1]).read_text(encoding=\"\
        utf-8\")\nhtml = None\nfor encoded in re.findall(r\"__ue_unpack\\('([^']+)'\\)\", source):\n    try:\n        candidate\
        \ = zlib.decompress(base64.b64decode(encoded)).decode(\"utf-8\")\n    except Exception:\n        continue\n    if\
        \ \"threeDScanBtn\" in candidate and \"threeDExportBtn\" in candidate:\n        html = candidate\n        break\n\
        if html is None:\n    raise SystemExit(\"3D dashboard HTML could not be decoded\")\nfor token in (\"threeDScanBtn\"\
        , \"threeDScanResults\", \"threeDExportBtn\", \"threeDExistingScanId\", \"threeDLoadScanBtn\", \"/api/3d/preflight\"\
        ):\n    if token not in html:\n        raise SystemExit(\"3D dashboard is missing: \" + token)\nfor token in (\"threeDCreateProjectBtn\"\
        , \"threeDCreateProjectSubmitBtn\", \"threeDRestartBridgeBtn\", \"ensureSelectedProjectIsOpen\"):\n    if token in\
        \ html:\n        raise SystemExit(\"Forbidden 3D dashboard control/helper remains: \" + token)\nprint(\"THREE_D_DASHBOARD_SCAN_EXPORT_VALIDATION=true\"\
        )\n'@\n$checkPath = Join-Path $env:TEMP 'validate_ue58_3d_dashboard.py'\nSet-Content -LiteralPath $checkPath -Value\
        \ $dashboardCheck -Encoding utf8\n& (Get-Command python).Source $checkPath $apiPath\nif ($LASTEXITCODE -ne 0) { throw\
        \ 'THREE_D_DASHBOARD_VALIDATION_FAILED' }\nWrite-Host 'PROJECT_CREATION_DISABLED_VALIDATION=true'\nWrite-Host 'THREE_D_READ_ONLY_HEADLESS_SCAN_VALIDATION=true'\n\
        Write-Host 'THREE_D_EXPORT_REQUIRES_VERIFIED_SCAN_VALIDATION=true'\nWrite-Host 'THREE_D_SCAN_DISK_RECOVERY_VALIDATION=true'\n\
        Write-Host 'THREE_D_NO_GUI_DEPENDENCY_VALIDATION=true'\n"
