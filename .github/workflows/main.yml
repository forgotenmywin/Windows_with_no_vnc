        <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UE58 File Manager</title>
        <style>
        :root{color-scheme:dark;--bg:#0b1017;--panel:#121a25;--line:#28384a;--muted:#9baec1;--text:#e7f0fa;--accent:#4c9be8;--green:#43c58a;--red:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Segoe UI,Arial,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px 20px;background:#101925;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0}h2{font-size:15px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-flex;border:1px solid #3a5069;border-radius:30px;padding:4px 9px;font-size:11px}.wrap{max-width:1600px;margin:auto;padding:16px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;min-width:0}.roots{display:flex;flex-direction:column;gap:6px}.rootbtn,.btn{border:1px solid #39516c;background:#1b2b3d;color:#e7f0fa;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left}.rootbtn:hover,.btn:hover{background:#243d56}.rootbtn.active{border-color:var(--accent);background:#18334c}.btn.primary{background:#174c77;border-color:#347db7}.btn.danger{background:#49252b;border-color:#80414a}.btn:disabled{opacity:.45;cursor:not-allowed}input,select{background:#0b131d;border:1px solid #35485c;color:var(--text);padding:8px;border-radius:7px;max-width:100%}input[type=checkbox]{accent-color:var(--accent)}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:9px 0}.pathbar{display:flex;gap:7px;align-items:center}.pathbar input{flex:1;min-width:120px}.crumb{font:12px Consolas,monospace;color:#bcd2e8;overflow-wrap:anywhere;padding:9px;background:#0b131d;border:1px solid var(--line);border-radius:7px;margin:8px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:9px 10px;border-bottom:1px solid #253447;text-align:left;font-size:12px}th{position:sticky;top:0;background:#192637;color:#bdd0e3}tr:last-child td{border-bottom:0}tr:hover td{background:#172433}.namebtn{color:#dceeff;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit}.folder{color:#81c6ff}.file{color:#dbe6f0}.status{min-height:24px;margin:8px 0;color:#a9c4de;overflow-wrap:anywhere}.status.error{color:var(--red)}.status.ok{color:var(--green)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.logs{white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;max-height:62vh;min-height:260px;background:#080d13;border:1px solid var(--line);border-radius:8px;padding:11px;font:12px/1.6 Consolas,monospace}.hidden{display:none!important}.right{margin-left:auto}.tabs{display:flex;gap:7px;margin-bottom:10px}.tab{padding:8px 13px;border-radius:7px;border:1px solid var(--line);background:#111b27;color:var(--text);cursor:pointer}.tab.active{background:#1d3a56;border-color:var(--accent)}.drop{border:1px dashed #46617c;border-radius:8px;padding:10px}.statline{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0}.statline span{background:#0b131d;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:11px}@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:9px}.roots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:12px}.grid2{grid-template-columns:1fr}}
        </style></head><body>
        <header><div><h1>UE58 File Manager</h1><div class="muted small">Windows drives · Unreal Engine files · ZIP · GitHub Releases · operation logs</div></div><div class="statline"><span id="bridgeState">Bridge: checking…</span><span id="clock">—</span><span id="selectedCount">0 selected</span></div></header>
        <div class="wrap"><aside class="panel"><h2>Windows & Unreal locations</h2><div id="roots" class="roots">Loading available drives…</div><div class="status" id="rootStatus"></div><div class="small muted">The list shows accessible drive letters plus shortcuts to the UE58 workspace, Engine, active project, uploads, backups and logs.</div></aside>
        <main style="min-width:0"><div class="tabs"><button class="tab active" data-tab="files">Files</button><button class="tab" data-tab="logs">Activity logs</button></div>
        <section id="filesTab" class="panel"><div class="pathbar"><input id="pathInput" spellcheck="false" placeholder="Choose a Windows folder path"><button class="btn" id="goPath">Go</button><button class="btn" id="upBtn">Up</button><button class="btn" id="refreshBtn">Refresh</button></div><div class="crumb" id="currentPath">Choose a drive or Unreal folder.</div>
        <div class="toolbar"><input id="filterInput" placeholder="Filter names or extensions…"><button class="btn" id="selectAllBtn">Select visible</button><button class="btn" id="clearSelectionBtn">Clear selection</button><span class="right muted small" id="directoryInfo"></span></div>
        <div class="toolbar"><button class="btn primary" id="zipBtn">ZIP selected files / folders</button><button class="btn primary" id="releaseBtn">Send selected to GitHub Release</button><button class="btn" id="downloadBtn">Download selected</button><button class="btn" id="renameBtn">Rename selected</button><button class="btn danger" id="deleteBtn">Delete selected</button><button class="btn" id="newFolderBtn">New folder</button></div>
        <div class="grid2"><div class="drop"><div class="small muted">Upload file(s) from this computer into the currently open Windows folder.</div><div class="toolbar"><input type="file" id="localFiles" multiple><label class="small"><input type="checkbox" id="uploadOverwrite"> Replace same-name files</label><button class="btn" id="uploadBtn">Upload here</button></div></div><div class="drop"><div class="small muted">GitHub Release destination (assets become publicly downloadable).</div><div class="toolbar"><label class="small">Tag <input id="releaseTag" value="ue5.8" style="width:110px"></label><label class="small"><input type="checkbox" id="replaceRelease"> Replace same-name Release assets</label></div><div class="small muted">If the tag or Release does not exist, it is created automatically from the repository default branch. Select a folder and use ZIP to include that entire folder and all subfolders. When replacement is off, unique timestamped asset names are used. Large files are split into numbered parts automatically.</div></div></div>
        <div class="status" id="fileStatus" aria-live="polite"></div><div class="tablewrap"><table><thead><tr><th><input type="checkbox" id="headerCheck"></th><th>Name</th><th>Extension / Type</th><th>Size</th><th>Modified</th><th>Action</th></tr></thead><tbody id="fileRows"><tr><td colspan="6" class="muted">Choose a location.</td></tr></tbody></table></div><div class="toolbar"><button class="btn" id="prevPageBtn">Previous</button><span class="muted small" id="pageInfo">—</span><button class="btn" id="nextPageBtn">Next</button></div></section>
        <section id="logsTab" class="panel hidden"><div class="toolbar"><select id="logSource"><option value="all">All log sources</option></select><select id="logLevel"><option value="all">All levels</option><option>ERROR</option><option>WARN</option><option>INFO</option><option>DEBUG</option></select><input id="logQuery" placeholder="Search logs…"><button class="btn" id="refreshLogsBtn">Refresh logs</button><label class="small"><input type="checkbox" id="autoLogs" checked> Auto refresh</label></div><div class="statline"><span id="logSummary">Waiting for logs…</span><span id="lastLogUpdate"></span></div><div id="logOutput" class="logs">Logs will appear here. File transfers, ZIP jobs, GitHub Release uploads, API commands and MCP operations are recorded.</div></section>
        </main></div>
        <script>
        const $=id=>document.getElementById(id);const state={path:'',parent:'',entries:[],roots:[],selected:new Set(),offset:0,limit:500,total:0,tab:'files',logs:[]};
        const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        function human(n){if(n==null)return '—';const u=['B','KB','MB','GB','TB'];let i=0,x=Number(n);while(x>=1024&&i<u.length-1){x/=1024;i++;}return (i?x.toFixed(2):x)+' '+u[i];}
        function status(message,kind=''){ $('fileStatus').textContent=message;$('fileStatus').className='status '+kind; }
        async function api(url,options={}){const r=await fetch(url,{cache:'no-store',...options});let j={};const ct=r.headers.get('content-type')||'';if(ct.includes('application/json'))j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||('HTTP '+r.status));return j;}
        function updateSelected(){ $('selectedCount').textContent=state.selected.size+' selected';$('headerCheck').checked=state.entries.length>0&&state.entries.every(x=>state.selected.has(x.path)); }
        function renderRoots(){ $('roots').innerHTML=state.roots.map((r,i)=>`<button class="rootbtn ${state.path===r.path?'active':''}" data-root="${i}">${esc(r.label)}<div class="small muted">${esc(r.path)}</div></button>`).join('')||'No accessible drive found.';document.querySelectorAll('[data-root]').forEach(b=>b.onclick=()=>openDir(state.roots[Number(b.dataset.root)].path)); }
        async function loadRoots(){try{const j=await api('/api/fs/roots');state.roots=j.roots||[];$('bridgeState').textContent='Unreal bridge: '+(j.bridge_connected?'connected':'offline');$('rootStatus').textContent='Active project: '+(j.current_project||'not detected');renderRoots();const preferred=state.roots.find(r=>r.label==='Active Unreal Project')||state.roots.find(r=>r.label==='UE58 Workspace')||state.roots[0];if(preferred)await openDir(preferred.path); }catch(e){$('rootStatus').textContent='Could not load drives: '+e.message;$('rootStatus').className='status error';}}
        async function openDir(path,offset=0){try{const j=await api('/api/fs/list?path='+encodeURIComponent(path)+'&offset='+offset+'&limit='+state.limit);state.path=j.path;state.parent=j.parent||j.path;state.offset=j.offset;state.total=j.count;state.entries=j.entries||[];state.selected.clear();$('pathInput').value=state.path;$('currentPath').textContent=state.path;$('directoryInfo').textContent=j.count+' items'+(j.skipped?' · '+j.skipped+' inaccessible':'');$('pageInfo').textContent=(state.total?state.offset+1:0)+'–'+Math.min(state.total,state.offset+state.entries.length)+' of '+state.total;$('prevPageBtn').disabled=state.offset<=0;$('nextPageBtn').disabled=!j.has_more;renderRows();renderRoots();status('Folder loaded: '+state.path,'ok'); }catch(e){status('Folder could not be opened: '+e.message,'error');}}
        function visibleEntries(){const q=$('filterInput').value.trim().toLowerCase();return state.entries.filter(x=>!q||x.name.toLowerCase().includes(q)||String(x.extension).toLowerCase().includes(q));}
        function renderRows(){const rows=visibleEntries();$('fileRows').innerHTML=rows.map(x=>`<tr><td><input type="checkbox" data-select="${esc(x.path)}" ${state.selected.has(x.path)?'checked':''}></td><td><button class="namebtn ${x.is_dir?'folder':'file'}" data-open="${esc(x.path)}" data-dir="${x.is_dir}">${x.is_dir?'📁':'📄'} ${esc(x.name)}</button></td><td>${esc(x.extension||'—')}</td><td>${human(x.size)}</td><td>${esc(x.modified)}</td><td>${x.is_dir?'<span class="muted">Open folder</span>':`<button class="btn" data-download="${esc(x.path)}">Download</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No matching files or folders.</td></tr>';
         document.querySelectorAll('[data-select]').forEach(c=>c.onchange=()=>{if(c.checked)state.selected.add(c.dataset.select);else state.selected.delete(c.dataset.select);updateSelected();});document.querySelectorAll('[data-open]').forEach(b=>{b.onclick=()=>{if(b.dataset.dir==='true')openDir(b.dataset.open);else{if(state.selected.has(b.dataset.open))state.selected.delete(b.dataset.open);else state.selected.add(b.dataset.open);renderRows();updateSelected();}};b.ondblclick=()=>{if(b.dataset.dir==='true')openDir(b.dataset.open);};});document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadPath(b.dataset.download));updateSelected();}
        function selectedPaths(){return [...state.selected];}
        function downloadPath(path){location.href='/api/fs/download?path='+encodeURIComponent(path);}
        $('goPath').onclick=()=>openDir($('pathInput').value);$('pathInput').addEventListener('keydown',e=>{if(e.key==='Enter')openDir($('pathInput').value);});$('upBtn').onclick=()=>{if(state.path&&state.parent&&state.parent!==state.path)openDir(state.parent);};$('refreshBtn').onclick=()=>openDir(state.path,state.offset);$('filterInput').oninput=renderRows;$('selectAllBtn').onclick=()=>{visibleEntries().forEach(x=>state.selected.add(x.path));renderRows();};$('clearSelectionBtn').onclick=()=>{state.selected.clear();renderRows();};$('headerCheck').onchange=()=>{visibleEntries().forEach(x=>x.checked=$('headerCheck').checked?(state.selected.add(x.path),true):(state.selected.delete(x.path),false));renderRows();};$('prevPageBtn').onclick=()=>openDir(state.path,Math.max(0,state.offset-state.limit));$('nextPageBtn').onclick=()=>openDir(state.path,state.offset+state.limit);
        $('downloadBtn').onclick=async()=>{const paths=selectedPaths();if(!paths.length)return status('Select at least one item.','error');if(paths.length===1){const item=state.entries.find(x=>x.path===paths[0]);if(item&&!item.is_dir)return downloadPath(paths[0]);}try{status('Creating ZIP for download…');const j=await api('/api/fs/zip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths})});status('ZIP ready: '+j.name+' · '+human(j.size),'ok');downloadPath(j.path);}catch(e){status('ZIP/download failed: '+e.message,'error');}};
        $('zipBtn').onclick=async()=>{const paths=selectedPaths();if(!paths.length)return status('Select files or folders first.','error');const name=prompt('ZIP filename (without or with .zip):','UE58_Selected_Files.zip');if(name===null)return;try{status('Creating ZIP from selected file(s)/folder(s), including all nested subfolders…');const j=await api('/api/fs/zip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths,archive_name:name,compress:false})});status('ZIP created: '+j.path+' · '+j.files+' files · '+human(j.size),'ok');}catch(e){status('ZIP failed: '+e.message,'error');}};
        $('releaseBtn').onclick=async()=>{const paths=selectedPaths();if(!paths.length)return status('Select one or more files. Folders must be ZIPped first.','error');if(paths.length>50)return status('Maximum 50 files per Release upload request.','error');const tag=$('releaseTag').value.trim()||'ue5.8';const replace=$('replaceRelease').checked;const message='Publish '+paths.length+' file(s) to GitHub Release tag '+tag+'?\n\nThese assets are publicly downloadable.'+(replace?'\nExisting assets with the same name may be replaced.':'\nUnique names will be generated; existing assets are preserved.');if(!confirm(message))return;try{status('Uploading '+paths.length+' file(s) to GitHub Release…');const j=await api('/api/fs/release-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths,tag,replace_existing:replace,confirm_public_upload:true})});const links=(j.results||[]).flatMap(x=>x.assets||[]).map(x=>x.url).filter(Boolean);status('Release upload finished: '+j.uploaded+' uploaded, '+j.failed+' failed. '+links.join(' | '),j.failed?'error':'ok');}catch(e){status('Release upload failed: '+e.message,'error');}await loadLogs();};
        $('uploadBtn').onclick=async()=>{const files=[...$('localFiles').files];if(!files.length)return status('Choose local files first.','error');const b=$('uploadBtn');b.disabled=true;let ok=0,fail=[];for(const f of files){try{const data=new FormData();data.append('file',f);data.append('directory',state.path);data.append('overwrite',$('uploadOverwrite').checked?'true':'false');await api('/api/fs/upload',{method:'POST',body:data});ok++;}catch(e){fail.push(f.name+': '+e.message);}}b.disabled=false;$('localFiles').value='';status(ok+' uploaded; '+fail.length+' failed. '+fail.join(' | '),fail.length?'error':'ok');await openDir(state.path,state.offset);await loadLogs();};
        $('newFolderBtn').onclick=async()=>{const name=prompt('New folder name:');if(!name)return;try{const j=await api('/api/fs/create-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent:state.path,name})});status('Folder created: '+j.path,'ok');await openDir(state.path,state.offset);}catch(e){status('Create folder failed: '+e.message,'error');}};
        $('renameBtn').onclick=async()=>{const paths=selectedPaths();if(paths.length!==1)return status('Select exactly one item to rename.','error');const old=paths[0].split(/[\\/]/).pop();const name=prompt('New name:',old);if(!name||name===old)return;try{const j=await api('/api/fs/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:paths[0],new_name:name})});status('Renamed: '+j.path,'ok');await openDir(state.path,state.offset);}catch(e){status('Rename failed: '+e.message,'error');}};
        $('deleteBtn').onclick=async()=>{const paths=selectedPaths();if(!paths.length)return status('Select files or folders first.','error');if(!confirm('Permanently delete '+paths.length+' selected item(s) from the Windows runner? This cannot be undone.'))return;let ok=0,fail=[];for(const path of paths){try{await api('/api/fs/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,confirm_delete:true})});ok++;}catch(e){fail.push(path+': '+e.message);}}status(ok+' deleted; '+fail.length+' failed. '+fail.join(' | '),fail.length?'error':'ok');await openDir(state.path,state.offset);await loadLogs();};
        document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('filesTab').classList.toggle('hidden',state.tab!=='files');$('logsTab').classList.toggle('hidden',state.tab!=='logs');if(state.tab==='logs')loadLogs();});
        async function loadLogs(){try{const q=new URLSearchParams({source:$('logSource').value,level:$('logLevel').value,q:$('logQuery').value,limit:'800'});const j=await api('/api/logs?'+q);const names=j.sources||[];const prev=$('logSource').value;if($('logSource').options.length!==names.length+1){$('logSource').innerHTML='<option value="all">All log sources</option>'+names.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('logSource').value=names.includes(prev)?prev:'all';}const rows=j.entries||[];$('logSummary').textContent=rows.length+' log entries · '+(j.connection?.bridge_connected?'Bridge connected':'Bridge offline');$('lastLogUpdate').textContent='Updated '+new Date().toLocaleTimeString();$('logOutput').textContent=rows.map(x=>`[${x.timestamp}] [${x.level}] [${x.source}] ${x.message}`).join('\n')||'No matching logs.';$('logOutput').scrollTop=$('logOutput').scrollHeight;}catch(e){$('logSummary').textContent='Log error: '+e.message;}}
        $('refreshLogsBtn').onclick=loadLogs;$('logSource').onchange=loadLogs;$('logLevel').onchange=loadLogs;$('logQuery').onkeydown=e=>{if(e.key==='Enter')loadLogs();};setInterval(()=>{if($('autoLogs').checked&&state.tab==='logs')loadLogs();},5000);setInterval(()=>$('clock').textContent=new Date().toLocaleString(),1000);loadRoots();
        </script></body></html>'''
            response = app.response_class(page, mimetype="text/html")
            response.headers["Cache-Control"] = "no-store"
            return response

        @app.post("/internal/set-public-url")
        @bridge_auth
        def internal_set_public_url():
            body = request.get_json(silent=True) or {}
            url = str(body.get("public_url") or "").rstrip("/")
            if not re.fullmatch(r"https://[a-zA-Z0-9-]+\.trycloudflare\.com", url):
                return jsonify(ok=False, error="invalid_quick_tunnel_url"), 400
            FILE_MANAGER_STATE["public_base_url"] = url
            log("Public Quick Tunnel URL registered for File Manager and MCP")
            return jsonify(ok=True, file_manager_url=url + "/files", mcp_url=url + "/mcp")

        # ---- Extended read-only scene monitor, project/plugin manager, checkpoints, packaging and MCP gateway ----
        import ipaddress, socket, subprocess, zipfile

        CURRENT_PROJECT_FILE = (ROOT / "UEControl" / "UEControl.uproject").resolve()
        CONTROL_DIR = ROOT / "control"
        BACKUP_DIR = ROOT / "Backups"
        BUILD_DIR = ROOT / "Builds"
        CONFIG_DIR = ROOT / "Config"
        for _folder in (CONTROL_DIR, BACKUP_DIR, BUILD_DIR, CONFIG_DIR):
            _folder.mkdir(parents=True, exist_ok=True)
        EDITOR_COMMAND_FILE = CONTROL_DIR / "editor-command.json"
        MCP_REGISTRY_FILE = CONFIG_DIR / "mcp_servers.json"
        SCENE_CACHE = {"updated": 0.0, "updated_at": 0.0, "level": "", "count": 0, "actors": [], "error": ""}
        SCENE_LOCK = threading.RLock()
        # Full-fidelity read-only scene export. The GLB is produced by Unreal's official GLTFExporter plugin.
        SCENE_MODEL_LOCK = threading.RLock()
        SCENE_MODEL_STATE = {"status": "idle", "job_id": "", "path": "", "job_dir": "", "model_files": [], "version": 0,
                             "updated": 0.0, "size": 0, "mesh_node_names": [], "mesh_count": 0, "error": "",
                             "progress": 0, "phase": "Idle", "completed": 0, "total": 0, "detail": "",
                             "html_ready": False, "html_path": "", "html_error": ""}
        SCENE_MODEL_DIR = (ROOT / "Screenshots").resolve()
        SCENE_MODEL_DIR.mkdir(parents=True, exist_ok=True)
        SCENE_HTML_PATH = (SCENE_MODEL_DIR / "unreal-scene-viewer.html").resolve()
        SCENE_AUTO_LOCK = threading.RLock()
        SCENE_AUTO_TIMER = None
        SCENE_AUTO_PENDING = False
        SCENE_AUTO_LAST_TOOL = ""
        SCENE_JOBS = {}
        SCENE_JOB_LOCK = threading.RLock()
        SCENE_ACTIVE_JOB = ""
        PLUGIN_INDEX_CACHE = {"roots": (), "paths": None, "built_at": 0.0}
        PLUGIN_INDEX_LOCK = threading.RLock()
        PACKAGE_JOBS = {}
        PACKAGE_LOCK = threading.RLock()

        # Headless Unreal commandlet jobs are supervised by the long-running PowerShell
        # process. That supervisor owns the GUI Editor lifecycle so an intentional
        # Editor shutdown never looks like a crashed GitHub Actions runner.
        HEADLESS_ROOT = (ROOT / "HeadlessJobs").resolve()
        HEADLESS_ROOT.mkdir(parents=True, exist_ok=True)
        HEADLESS_COMMAND_FILE = CONTROL_DIR / "headless-command.json"
        HEADLESS_LOCK = threading.RLock()
        HEADLESS_PENDING_SAVE_JOB = ""
        HEADLESS_MAX_SCRIPT_CHARS = 200000
        HEADLESS_MAX_TIMEOUT_SECONDS = 10000


        def _inside_root(path):
            path = Path(path).resolve()
            return path == ROOT or ROOT in path.parents


        def _current_project():
            global CURRENT_PROJECT_FILE
            if CURRENT_PROJECT_FILE.is_file() and _inside_root(CURRENT_PROJECT_FILE):
                return CURRENT_PROJECT_FILE
            return (ROOT / "UEControl" / "UEControl.uproject").resolve()


        def _project_files():
            found = {}
            excluded = {"Extracted", "parts", "Uploads", "Screenshots", "Logs", "Builds", "Backups", "control", "Config"}
            for base in (ROOT / "Projects", ROOT / "UEControl", ROOT):
                if base.exists():
                    for walk_root, dirs, files in os.walk(base):
                        dirs[:] = [name for name in dirs if name not in excluded and not name.startswith(".")]
                        for filename in files:
                            if filename.lower().endswith(".uproject"):
                                item = Path(walk_root) / filename
                                if _inside_root(item):
                                    found[str(item.resolve())] = item.resolve()
            current = _current_project()
            if current.is_file():
                found[str(current)] = current
            return sorted(found.values(), key=lambda p: p.name.lower())


        def _project_payload():
            current = str(_current_project())
            rows = []
            for item in _project_files():
                try:
                    rows.append({"name": item.stem, "project_file": str(item), "directory": str(item.parent),
                                 "is_current": str(item) == current})
                except OSError:
                    continue
            return rows


        def _backup_file(source, label="config"):
            source = Path(source).resolve()
            if not source.is_file() or not _inside_root(source):
                return None
            stamp = time.strftime("%Y%m%d_%H%M%S") + "_" + uuid.uuid4().hex[:6]
            dest_dir = BACKUP_DIR / label
            dest_dir.mkdir(parents=True, exist_ok=True)
            dest = dest_dir / (source.name + "." + stamp + ".bak")
            shutil.copy2(source, dest)
            return str(dest)


        def _write_editor_command(action, project_file, checkpoint=""):
            target = Path(project_file).resolve()
            if target.suffix.lower() != ".uproject" or not _inside_root(target) or not target.is_file():
                raise ValueError("project_file must be an existing .uproject inside D:\\UE58")
            payload = {"action": str(action), "project_file": str(target), "checkpoint": str(checkpoint or ""),
                       "requested_at": time.time(), "nonce": uuid.uuid4().hex}
            tmp = EDITOR_COMMAND_FILE.with_suffix(".tmp")
            tmp.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
            os.replace(tmp, EDITOR_COMMAND_FILE)
            log("EDITOR COMMAND queued: %s project=%s" % (action, target))
            return payload


        def _ensure_bridge_in_project(project_file):
            project_file = Path(project_file).resolve()
            source = ROOT / "UEControl" / "Content" / "Python" / "init_unreal.py"
            if not source.is_file():
                raise FileNotFoundError("Bridge startup template missing: " + str(source))
            target_dir = project_file.parent / "Content" / "Python"
            target_dir.mkdir(parents=True, exist_ok=True)
            target = target_dir / "init_unreal.py"
            if target.exists() and target.resolve() == source.resolve():
                return
            if target.exists():
                _backup_file(target, "startup_scripts")
            shutil.copy2(source, target)


        def prepare_project(project_file, ensure_remote_plugins=True):
            project_file = Path(project_file).resolve()
            if project_file.suffix.lower() != ".uproject" or not project_file.is_file() or not _inside_root(project_file):
                raise ValueError("Choose an existing .uproject inside D:\\UE58")
            data = json.loads(project_file.read_text(encoding="utf-8-sig"))
            if not isinstance(data, dict):
                raise ValueError("Invalid .uproject JSON")
            if ensure_remote_plugins:
                backup = _backup_file(project_file, "uproject")
                plugins = data.get("Plugins")
                if not isinstance(plugins, list):
                    plugins = []
                mapping = {str(p.get("Name")): p for p in plugins if isinstance(p, dict) and p.get("Name")}
                for plugin_name in ("PythonScriptPlugin", "EditorScriptingUtilities", "ModelContextProtocol", "AllToolsets", "GLTFExporter"):
                    item = mapping.get(plugin_name)
                    if item is None:
                        item = {"Name": plugin_name, "Enabled": True}
                        plugins.append(item)
                    else:
                        item["Enabled"] = True
                data["Plugins"] = plugins
                tmp = project_file.with_suffix(".uproject.tmp")
                tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
                os.replace(tmp, project_file)
            else:
                backup = None
            _ensure_bridge_in_project(project_file)
            return {"project_file": str(project_file), "backup": backup}


        def _available_plugin_descriptor_paths(project_file=None):
            project_file = Path(project_file or _current_project()).resolve()
            engine_plugins = next((p for p in (ROOT / "Extracted").glob("*/Engine/Plugins") if p.is_dir()), None)
            roots = []
            if engine_plugins:
                roots.append(engine_plugins.resolve())
            project_plugins = (project_file.parent / "Plugins").resolve()
            if project_plugins.is_dir():
                roots.append(project_plugins)
            roots_key = tuple(str(p) for p in roots)
            with PLUGIN_INDEX_LOCK:
                cached = PLUGIN_INDEX_CACHE.get("paths")
                if cached is not None and PLUGIN_INDEX_CACHE.get("roots") == roots_key:
                    return dict(cached)
            result = {}
            # Unreal plugin descriptors normally live near the plugin root (category/plugin/plugin.uplugin).
            # Do not recursively traverse huge Content, Source, Binaries and ThirdParty trees.
            excluded_dirs = {"binaries", "content", "intermediate", "saved", "deriveddatacache",
                             "thirdparty", "resources", "documentation", "docs", ".git"}
            for base in roots:
                if not base.is_dir():
                    continue
                for walk_root, dirs, files in os.walk(base):
                    relative = Path(walk_root).relative_to(base)
                    depth = len(relative.parts)
                    if depth >= 5:
                        dirs[:] = []
                    else:
                        dirs[:] = [name for name in dirs
                                   if not name.startswith(".") and not name.startswith("_installing_")
                                   and name.lower() not in excluded_dirs]
                    for filename in files:
                        if filename.lower().endswith(".uplugin"):
                            descriptor = Path(walk_root) / filename
                            result.setdefault(descriptor.stem, descriptor.resolve())
                            if len(result) >= 5000:
                                break
                    if len(result) >= 5000:
                        break
            with PLUGIN_INDEX_LOCK:
                PLUGIN_INDEX_CACHE.update({"roots": roots_key, "paths": dict(result), "built_at": time.time()})
            return result


        def _available_plugin_descriptors(project_file=None):
            """Return descriptor paths by plugin name; JSON metadata is loaded only for visible pages."""
            return _available_plugin_descriptor_paths(project_file)


        def _project_plugin_state(project_file=None, query="", offset=0, limit=75):
            project_file = Path(project_file or _current_project()).resolve()
            data = json.loads(project_file.read_text(encoding="utf-8-sig"))
            enabled = {str(item.get("Name")): bool(item.get("Enabled", False))
                       for item in data.get("Plugins", []) if isinstance(item, dict) and item.get("Name")}
            available = _available_plugin_descriptor_paths(project_file)
            needle = str(query or "").strip().lower()
            names = sorted((name for name in available if not needle or needle in name.lower()), key=str.lower)
            total = len(names)
            try:
                offset = max(0, int(offset))
                limit = max(10, min(200, int(limit)))
            except (TypeError, ValueError):
                offset, limit = 0, 75
            selected = names[offset:offset + limit]
            rows = []
            for name in selected:
                descriptor = available[name]
                description, category = "", ""
                try:
                    meta = json.loads(descriptor.read_text(encoding="utf-8-sig"))
                    description = str(meta.get("Description", ""))[:220]
                    category = str(meta.get("Category", ""))[:80]
                except Exception:
                    description = "Plugin descriptor could not be parsed"
                rows.append({"name": name, "path": str(descriptor), "description": description,
                             "category": category, "enabled": enabled.get(name, False),
                             "required": name in ("PythonScriptPlugin", "EditorScriptingUtilities", "ModelContextProtocol", "AllToolsets", "GLTFExporter")})
            return {"project_file": str(project_file), "plugins": rows,
                    "enabled_count": sum(enabled.values()), "available_count": len(available),
                    "filtered_count": total, "offset": offset, "limit": limit,
                    "has_more": offset + len(rows) < total, "query": needle}


