        maximum of 180 seconds for an authenticated Unreal Python bridge heartbeat...'\n\
        $bridgeReady = $false\n$bridgeTimer = [System.Diagnostics.Stopwatch]::StartNew()\n\
        $lastBridgeReport = -15\n$lastBridgeProbeError = ''\nwhile ($bridgeTimer.Elapsed.TotalSeconds
        -lt 180) {\n  if ($ueProc.HasExited) {\n    Write-Warning 'Unreal Editor exited
        before the Python bridge connected.'\n    break\n  }\n  try {\n    $health
        = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 2\n  \
        \  if ($health.bridge_connected) {\n      $bridgeReady = $true\n      break\n\
        \    }\n    $lastBridgeProbeError = 'API is responding, but no authenticated
        bridge heartbeat has arrived.'\n  } catch {\n    $lastBridgeProbeError = $_.Exception.Message\n\
        \  }\n  if ([int][Math]::Floor($bridgeTimer.Elapsed.TotalSeconds) -ge ($lastBridgeReport
        + 15)) {\n    $lastBridgeReport = [int][Math]::Floor($bridgeTimer.Elapsed.TotalSeconds)\n\
        \    Write-Host (\"BRIDGE_WAIT elapsed={0}s editor_exited={1} status={2}\"\
        \ -f $lastBridgeReport, $ueProc.HasExited, $lastBridgeProbeError)\n  }\n \
        \ Start-Sleep -Milliseconds 1000\n}\n$bridgeTimer.Stop()\nif ($bridgeReady)
        {\n  Write-Host 'BRIDGE_READY=true'\n} else {\n  Write-Host '--- Bridge diagnostics
        ---'\n  foreach ($diagnosticFile in @(\n    \"$root\\Logs\\unreal_bridge.log\"\
        ,\n    \"$root\\Logs\\api.log\",\n    $ueOut,\n    $ueErr\n  )) {\n    if
        ($diagnosticFile -and (Test-Path -LiteralPath $diagnosticFile)) {\n      Write-Host
        \"--- $diagnosticFile (last 80 lines) ---\"\n      Get-Content -LiteralPath
        $diagnosticFile -Tail 80 -ErrorAction SilentlyContinue\n    }\n  }\n  $projectLog
        = Get-ChildItem -LiteralPath \"$root\\UEControl\\Saved\\Logs\" -Filter '*.log'
        -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending
        | Select-Object -First 1\n  if ($projectLog) {\n    Write-Host \"--- $($projectLog.FullName)
        (last 100 lines) ---\"\n    Get-Content -LiteralPath $projectLog.FullName
        -Tail 100 -ErrorAction SilentlyContinue\n  }\n  if ($ueProc.HasExited) {\n\
        \    throw \"BRIDGE_READY=false: Unreal Editor exited with code $($ueProc.ExitCode).
        Diagnostic logs are printed above.\"\n  }\n  throw \"BRIDGE_READY=false after
        $([int]$bridgeTimer.Elapsed.TotalSeconds) seconds. The startup script did
        not establish an authenticated bridge connection. Diagnostic logs are printed
        above.\"\n}\n\n# Confirm Epic's native MCP listener is alive before publishing
        the endpoint.\n# Unreal documents GET /mcp returning HTTP 405 as a valid liveness
        response.\n$nativeMcpReady = $false\nfor ($i = 0; $i -lt 45; $i++) {\n  try
        {\n    $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp' -Method
        Get -TimeoutSec 4 -UseBasicParsing\n    if ([int]$probe.StatusCode -eq 405)
        { $nativeMcpReady = $true; break }\n    Write-Host (\"Native MCP GET probe
        returned HTTP {0}\" -f [int]$probe.StatusCode)\n  } catch {\n    $status =
        $null\n    try { $status = [int]$_.Exception.Response.StatusCode } catch {
        }\n    if ($status -eq 405) { $nativeMcpReady = $true; break }\n    if ($status)
        { Write-Host (\"Native MCP GET probe returned HTTP {0}\" -f $status) }\n \
        \ }\n  if ($ueProc.HasExited) { break }\n  Start-Sleep -Seconds 2\n}\nif ($nativeMcpReady)
        {\n  Write-Host 'NATIVE_MCP_LISTENER_READY=true (GET /mcp returned expected
        HTTP 405).'\n} else {\n  throw 'NATIVE_MCP_LISTENER_READY=false. Do not add
        the MCP URL in ChatGPT yet; inspect UEControl\\Saved\\Logs\\UnrealEditor.log
        and unreal-stdout.log for LogModelContextProtocol errors.'\n}\n\n# End-to-end
        public MCP test. A local GET/405 only proves the Unreal listener\n# exists;
        it does NOT prove ChatGPT can reach the public Cloudflare endpoint.\n# First
        wait for Cloudflare edge propagation and test the public health route.\n$publicHealthReady
        = $false\n$publicHealthError = ''\nfor ($i = 0; $i -lt 20; $i++) {\n  try
        {\n    $publicHealth = Invoke-RestMethod -Uri \"$publicUrl/health\" -TimeoutSec
        12\n    if ($publicHealth.ok) { $publicHealthReady = $true; break }\n    $publicHealthError
        = 'Public /health returned ok=false.'\n  } catch {\n    $publicHealthError
        = $_.Exception.Message\n  }\n  if ($cfProc.HasExited) { throw 'Cloudflare
        tunnel exited during public health test; inspect cloudflared-stderr.log.'
        }\n  Start-Sleep -Seconds 3\n}\nif (-not $publicHealthReady) {\n  if (Test-Path
        $cfErr) { Write-Host '--- cloudflared stderr (tail) ---'; Get-Content $cfErr
        -Tail 60 }\n  throw \"PUBLIC_TUNNEL_HEALTH_FAILED: $publicHealthError. The
        URL must not be added to ChatGPT until this passes.\"\n}\nWrite-Host 'PUBLIC_TUNNEL_HEALTH_OK=true'\n\
        \n# Perform the real MCP initialize handshake through the public HTTPS URL.\n\
        # Public Starlette mount is /mcp/; upstream Unreal listener remains /mcp.
        No OAuth or bearer token is used.\n$mcpEndpoint = \"$publicUrl/mcp\"\n# ChatGPT/MCP
        clients may open GET to establish the optional SSE channel.\n# Verify that
        GET succeeds at the same public URL before running POST initialize.\ntry {\n\
        \  $getProbe = Invoke-WebRequest -Uri \"$mcpEndpoint?probe=1\" -Method Get
        -Headers @{ Accept = 'text/event-stream' } -TimeoutSec 15 -UseBasicParsing\n\
        \  if ([int]$getProbe.StatusCode -ne 200 -or $getProbe.Headers['Content-Type']
        -notmatch 'text/event-stream') {\n    throw \"MCP GET event stream probe returned
        HTTP $([int]$getProbe.StatusCode) or an invalid content type.\"\n  }\n  Write-Host
        'PUBLIC_MCP_GET_STREAM_OK=true'\n} catch {\n  throw \"PUBLIC_MCP_GET_STREAM_FAILED:
        $($_.Exception.Message)\"\n}\n$mcpAccept = 'application/json, text/event-stream'\n\
        $initializePayload = @{\n  jsonrpc = '2.0'\n  id = 'ue58-public-connectivity-initialize'\n\
        \  method = 'initialize'\n  params = @{\n    protocolVersion = '2025-11-25'\n\
        \    capabilities = @{}\n    clientInfo = @{ name = 'ue58-workflow-connectivity-check';
        version = '1.0.0' }\n  }\n} | ConvertTo-Json -Depth 12 -Compress\ntry {\n\
        \  $initializeResponse = Invoke-WebRequest -Uri $mcpEndpoint -Method Post
        -Headers @{ Accept = $mcpAccept } -ContentType 'application/json' -Body $initializePayload
        -TimeoutSec 30 -UseBasicParsing\n  if ([int]$initializeResponse.StatusCode
        -ne 200) { throw \"MCP initialize returned HTTP $([int]$initializeResponse.StatusCode).\"\
        \ }\n  $initializeJson = $initializeResponse.Content | ConvertFrom-Json -ErrorAction
        Stop\n  if ($initializeJson.error) { throw (\"MCP initialize JSON-RPC error:
        \" + ($initializeJson.error | ConvertTo-Json -Compress -Depth 8)) }\n  if
        (-not $initializeJson.result -or -not $initializeJson.result.protocolVersion)
        { throw 'MCP initialize response has no result.protocolVersion.' }\n  $negotiatedProtocol
        = [string]$initializeJson.result.protocolVersion\n  $mcpSessionId = [string]$initializeResponse.Headers['Mcp-Session-Id']\n\
        \  Write-Host (\"PUBLIC_MCP_INITIALIZE_OK=true PROTOCOL={0} SESSION_HEADER={1}\"\
        \ -f $negotiatedProtocol, [bool]$mcpSessionId)\n\n  # Confirm tools/list works
        over the same public route and session.\n  $listHeaders = @{ Accept = $mcpAccept;
        'MCP-Protocol-Version' = $negotiatedProtocol }\n  if ($mcpSessionId) { $listHeaders['Mcp-Session-Id']
        = $mcpSessionId }\n  $listPayload = @{ jsonrpc = '2.0'; id = 'ue58-public-connectivity-tools';
        method = 'tools/list'; params = @{} } | ConvertTo-Json -Depth 8 -Compress\n\
        \  $toolsResponse = Invoke-WebRequest -Uri $mcpEndpoint -Method Post -Headers
        $listHeaders -ContentType 'application/json' -Body $listPayload -TimeoutSec
        30 -UseBasicParsing\n  if ([int]$toolsResponse.StatusCode -ne 200) { throw
        \"MCP tools/list returned HTTP $([int]$toolsResponse.StatusCode).\" }\n  $toolsJson
        = $toolsResponse.Content | ConvertFrom-Json -ErrorAction Stop\n  if ($toolsJson.error)
        { throw (\"MCP tools/list JSON-RPC error: \" + ($toolsJson.error | ConvertTo-Json
        -Compress -Depth 8)) }\n  $toolCount = @($toolsJson.result.tools).Count\n\
        \  if ($toolCount -lt 1) { throw 'MCP tools/list returned no tools.' }\n \
        \ Write-Host (\"PUBLIC_MCP_TOOLS_LIST_OK=true TOOL_COUNT={0}\" -f $toolCount)\n\
        } catch {\n  $mcpFailure = $_.Exception.Message\n  try {\n    $response =
        $_.Exception.Response\n    if ($response -and $response.GetResponseStream())
        {\n      $reader = New-Object System.IO.StreamReader($response.GetResponseStream())\n\
        \      $responseBody = $reader.ReadToEnd()\n      $reader.Dispose()\n    \
        \  if ($responseBody) { $mcpFailure += \" | response: \" + $responseBody.Substring(0,
        [Math]::Min(1500, $responseBody.Length)) }\n    }\n  } catch { }\n  if (Test-Path
        $cfErr) { Write-Host '--- cloudflared stderr (tail) ---'; Get-Content $cfErr
        -Tail 40 }\n  throw \"PUBLIC_MCP_HANDSHAKE_FAILED: $mcpFailure. Check API
        logs and Unreal LogModelContextProtocol before connecting ChatGPT.\"\n}\n\
        Write-Host 'PUBLIC_MCP_ENDPOINT_READY=true'\n\n$internalHeaders = @{ Authorization
        = \"Bearer $env:BRIDGE_TOKEN\" }\n# Reserve CPU capacity for the runner/API
        and start the first monitor snapshot.\n# The affinity limit is reversible
        from the Monitor > System panel.\ntry {\n  $cpuBody = @{ percent = 75 } |
        ConvertTo-Json -Compress\n  $cpuBalance = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/internal/system/optimize-cpu'
        -Method Post -Headers $internalHeaders -ContentType 'application/json' -Body
        $cpuBody -TimeoutSec 15\n  Write-Host (\"UNREAL_CPU_HEADROOM=true CORES={0}/{1}\"\
        \ -f $cpuBalance.affinity.Count, $cpuBalance.logical_cpus)\n} catch {\n  Write-Warning
        (\"Could not apply reversible Unreal CPU headroom: \" + $_.Exception.Message)\n\
        }\ntry {\n  $captureKick = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/internal/monitor/initial-capture'
        -Method Post -Headers $internalHeaders -ContentType 'application/json' -Body
        '{}' -TimeoutSec 10\n  Write-Host (\"MONITOR_INITIAL_CAPTURE={0}\" -f $captureKick.status)\n\
        } catch {\n  Write-Warning (\"Initial monitor capture will retry when the
        monitor page opens: \" + $_.Exception.Message)\n}\n$urlBody = @{ public_url
        = $publicUrl } | ConvertTo-Json -Compress\n$urlRegistration = Invoke-RestMethod
        -Uri 'http://127.0.0.1:8765/internal/set-public-url' -Method Post -Headers
        $internalHeaders -ContentType 'application/json' -Body $urlBody -TimeoutSec
        10\nif (-not $urlRegistration.ok) { throw 'Could not register the public monitor
        URL with the API.' }\n$monitorUrl = \"$publicUrl/monitor\"\nWrite-Host \"\
        MONITOR_URL=$monitorUrl\"\nWrite-Host 'MONITOR_USERNAME=viewer'\nWrite-Host
        'MONITOR_PASSWORD is stored only in the repository Actions secret MONITOR_PASSWORD.'\n\
        $summaryText = @\"\n## Unreal Live Monitor\n- [Open read-only monitor]($monitorUrl)\n\
        - MCP endpoint: $publicUrl/mcp\n- Username: viewer\n- Password: repository
        secret MONITOR_PASSWORD\n- GitHub Release upload: available inside the authenticated
        monitor; default tag: ue5.8.\n\"@\n$summaryText | Out-File -FilePath $env:GITHUB_STEP_SUMMARY
        -Append -Encoding utf8\n\nWrite-Host 'REST endpoints: GET /health; authenticated
        read-only monitor at GET /monitor; authenticated file, Drive, GitHub Release,
        project and unified logs endpoints.'\nWrite-Host \"MCP_ENDPOINT=$publicUrl/mcp\"\
        \nWrite-Host 'Single MCP endpoint only: /mcp -> native Unreal AllToolsets
        plus monitor, binary-upload and guarded GitHub Release tools. No second MCP
        URL.'\nWrite-Host 'Bridge startup: Python StartupScripts plus -ExecCmds py
        fallback; duplicate initialization is guarded. No -ExecutePythonScript is
        used.'\nWrite-Host 'Binary transfer: unreal_upload_binary_file accepts files
        up to 8 MiB per MCP call; place larger files under D:\\UE58\\Uploads through
        the authenticated API before publishing them.'\nWrite-Host 'Monitor uses 5-second
        JSON polling and 640x360 JPEG snapshots after MCP tool calls; no VNC, desktop
        stream, WebSocket, or SSE.'\nWrite-Host 'MCP tool list includes Unreal AllToolsets,
        scene/project/plugin management, save/checkpoint/restore, packaging, Windows
        metrics, file transfer, GitHub Release and external MCP gateway tools.'\n\
        Write-Host 'MCP transport: Streamable HTTP over HTTPS; upstream single-message
        SSE replies are normalized to JSON-RPC JSON for compatibility.'\nWrite-Host
        'Monitor includes Logs, read-only 3D Actor bounds map with orbit/zoom, project
        switching, plugin ZIP installation/toggles, save/checkpoint/restore, Win64
        Shipping packaging, system metrics and remote MCP gateway.'\nWrite-Warning
        'SECURITY: the monitor and REST endpoints are password-protected, but /mcp
        is intentionally unauthenticated for ChatGPT. Anyone who obtains the MCP URL
        may issue Unreal commands. Do not share the MCP URL; stop the workflow when
        finished.'\n\n$lastHeartbeat = Get-Date\n$activeProjectFile = \"$root\\UEControl\\\
        UEControl.uproject\"\n$editorCommandFile = \"$root\\control\\editor-command.json\"\
        \nwhile ($true) {\n  Start-Sleep -Seconds 5\n  if ($apiProc.HasExited) { throw
        'API server stopped; inspect D:\\UE58\\Logs\\api-stderr.log.' }\n  if ($cfProc.HasExited)
        { throw 'Cloudflare tunnel stopped; inspect D:\\UE58\\Logs\\cloudflared-stderr.log.'
        }\n\n  # A project switch, plugin change or checkpoint restore is handled
        here.\n  if (Test-Path -LiteralPath $editorCommandFile) {\n    try {\n   \
        \   $cmd = Get-Content -LiteralPath $editorCommandFile -Raw | ConvertFrom-Json\n\
        \      $targetProject = [System.IO.Path]::GetFullPath([string]$cmd.project_file)\n\
        \      $rootPrefix = [System.IO.Path]::GetFullPath($root) + [System.IO.Path]::DirectorySeparatorChar\n\
        \      if (-not $targetProject.StartsWith($rootPrefix, [System.StringComparison]::OrdinalIgnoreCase)
        -or -not (Test-Path -LiteralPath $targetProject)) { throw 'Restart request
        project is outside D:\\UE58 or missing.' }\n      Write-Host (\"Editor restart
        command received: {0} -> {1}\" -f $cmd.action, $targetProject)\n      if ($ueProc
        -and -not $ueProc.HasExited) { Stop-Process -Id $ueProc.Id -Force -ErrorAction
        SilentlyContinue; $ueProc.WaitForExit(15000) | Out-Null }\n      $projectDir
        = Split-Path -Parent $targetProject\n      if ($cmd.action -eq 'restore_checkpoint')
        {\n        $zipPath = [System.IO.Path]::GetFullPath([string]$cmd.checkpoint)\n\
        \        $backupPrefix = [System.IO.Path]::GetFullPath(\"$root\\Backups\"\
        ) + [System.IO.Path]::DirectorySeparatorChar\n        if (-not $zipPath.StartsWith($backupPrefix,
        [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath
        $zipPath)) { throw 'Checkpoint restore path is invalid.' }\n        Expand-Archive
        -LiteralPath $zipPath -DestinationPath $projectDir -Force\n        Write-Host
        \"CHECKPOINT_RESTORED=$zipPath\"\n      }\n      Remove-Item -LiteralPath
        $editorCommandFile -Force -ErrorAction SilentlyContinue\n      $stamp = Get-Date
        -Format 'yyyyMMdd_HHmmss'\n      $ueOut = \"$root\\Logs\\unreal-$stamp-stdout.log\"\
        \n      $ueErr = \"$root\\Logs\\unreal-$stamp-stderr.log\"\n      $ueArgs
        = @($targetProject, '-log', '-stdout', '-FullStdOutLogOutput', '-AllowSoftwareRendering',
        '-d3d11', '-ModelContextProtocolStartServer', '-ModelContextProtocolPort=8000',
        '-ExecCmds=\"py D:/UE58/UEControl/Content/Python/init_unreal.py\"')\n    \
        \  $ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory
        $projectDir -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError
        $ueErr\n      $activeProjectFile = $targetProject\n      Write-Host \"UNREAL_RESTARTED_PID=$($ueProc.Id)
        PROJECT=$activeProjectFile\"\n      $restartedBridge = $false\n      for ($i
        = 0; $i -lt 90; $i++) {\n        Start-Sleep -Seconds 2\n        try { $h
        = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4; if
        ($h.bridge_connected) { $restartedBridge = $true; break } } catch { }\n  \
        \      if ($ueProc.HasExited) { break }\n      }\n      if (-not $restartedBridge)
        { throw \"Bridge did not reconnect after project restart. Inspect $ueOut and
        $ueErr.\" }\n      $restartedMcp = $false\n      for ($i = 0; $i -lt 45; $i++)
        {\n        try { $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp'
        -Method Get -TimeoutSec 4 -UseBasicParsing; if ([int]$probe.StatusCode -eq
        405) { $restartedMcp = $true; break } } catch { try { if ([int]$_.Exception.Response.StatusCode
        -eq 405) { $restartedMcp = $true; break } } catch { } }\n        Start-Sleep
        -Seconds 2\n      }\n      if (-not $restartedMcp) { throw 'Native MCP did
        not return HTTP 405 after restart.' }\n      Write-Host 'PROJECT_RESTART_BRIDGE_READY=true
        NATIVE_MCP_LISTENER_READY=true'\n    } catch {\n      Write-Error (\"Editor
        restart handler failed: \" + $_)\n      if (Test-Path -LiteralPath $editorCommandFile)
        { Remove-Item -LiteralPath $editorCommandFile -Force -ErrorAction SilentlyContinue
        }\n      throw\n    }\n  }\n\n  if ($ueProc -and $ueProc.HasExited) { throw
        \"Unreal Editor stopped with exit code $($ueProc.ExitCode); inspect $ueOut,
        $ueErr and the active project's Saved\\Logs folder.\" }\n  if (((Get-Date)
        - $lastHeartbeat).TotalMinutes -ge 30) {\n    try {\n      $h = Invoke-RestMethod
        -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4\n      Write-Host (\"Heartbeat
        {0}: API_OK={1} BRIDGE_CONNECTED={2}\" -f (Get-Date), $h.ok, $h.bridge_connected)\n\
        \    } catch { Write-Warning (\"Heartbeat {0}: local health check failed.\"\
        \ -f (Get-Date)) }\n    $lastHeartbeat = Get-Date\n  }\n}"
