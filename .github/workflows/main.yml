name: UE 5.8 Remote Studio - Stable MCP GET+POST Compatibility + Live Monitor
'on':
  # Run automatically when this workflow file is pushed to any branch.
  # Keep workflow_dispatch so it can also be started manually from Actions.
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ue-remote:
    # GitHub-hosted Windows runner. This job is queued by push or workflow_dispatch.
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
    - name: Confirm GitHub Actions runner was allocated
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "RUNNER_ALLOCATED=true"
        Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
        Write-Host "RUNNER_OS=$env:RUNNER_OS"
        Write-Host "GITHUB_REF=$env:GITHUB_REF"
        Write-Host "GITHUB_WORKFLOW=$env:GITHUB_WORKFLOW"
        Write-Host "POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
    - name: Prepare D drive
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $root = ''D:\UE58''

        New-Item -ItemType Directory -Force -Path $root, "$root\parts", "$root\Logs",
        "$root\Projects", "$root\Screenshots", "$root\Uploads" | Out-Null

        try { Start-Transcript -Path "$root\Logs\workflow-prepare-transcript.log"
        -Append -Force | Out-Null } catch { }

        $drive = Get-PSDrive D -ErrorAction SilentlyContinue

        if (-not $drive) { throw ''Drive D is not available on this runner.'' }

        Write-Host ("D: available space: {0:N2} GB" -f ($drive.Free / 1GB))

        "UE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        '
    - name: Download and extract Unreal Engine 5.8
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\ntry { Start-Transcript
        -Path \"$root\\Logs\\workflow-extract-transcript.log\" -Append -Force | Out-Null
        } catch { }\n$partsDir = \"$root\\parts\"\n$archive = \"$root\\UE_5.8.zip\"\
        \n$extract = \"$root\\Extracted\"\n\ngh release download ue5.8 --repo forgotenmywin/Windows_with_no_vnc
        --pattern 'UE_5.8.zip.*' --dir $partsDir --clobber\nif ($LASTEXITCODE -ne
        0) { throw 'Could not download release assets UE_5.8.zip.*.' }\n\n$parts =
        @(Get-ChildItem -LiteralPath $partsDir -File | Where-Object { $_.Name -like
        'UE_5.8.zip.*' } | Sort-Object Name)\nif ($parts.Count -lt 2) { throw \"Expected
        split ZIP parts; found $($parts.Count). Check release tag/assets.\" }\n\n\
        if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force
        }\n$destination = [System.IO.File]::Open($archive, [System.IO.FileMode]::CreateNew,
        [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)\ntry {\n  $buffer
        = New-Object byte[] (4MB)\n  foreach ($part in $parts) {\n    Write-Host (\"\
        Joining {0} ({1:N2} GB)\" -f $part.Name, ($part.Length / 1GB))\n    $source
        = [System.IO.File]::OpenRead($part.FullName)\n    try {\n      while (($read
        = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {\n        $destination.Write($buffer,
        0, $read)\n      }\n    }\n    finally { $source.Dispose() }\n  }\n}\nfinally
        { $destination.Dispose() }\n\n$sevenZip = (Get-Command 7z.exe -ErrorAction
        SilentlyContinue).Source\nif (-not $sevenZip) {\n  $sevenZip = @('C:\\Program
        Files\\7-Zip\\7z.exe','C:\\Program Files (x86)\\7-Zip\\7z.exe') | Where-Object
        { Test-Path $_ } | Select-Object -First 1\n}\nif (-not $sevenZip) {\n  choco
        install 7zip -y --no-progress\n  if ($LASTEXITCODE -ne 0) { throw '7-Zip installation
        failed.' }\n  $sevenZip = 'C:\\Program Files\\7-Zip\\7z.exe'\n}\nif (-not
        (Test-Path -LiteralPath $sevenZip)) { throw '7z.exe was not found.' }\n\n\
        & $sevenZip t $archive\nif ($LASTEXITCODE -ne 0) { throw 'Joined ZIP failed
        integrity testing.' }\nif (Test-Path -LiteralPath $extract) { Remove-Item
        -LiteralPath $extract -Recurse -Force }\nNew-Item -ItemType Directory -Force
        -Path $extract | Out-Null\n& $sevenZip x $archive \"-o$extract\" -y\nif ($LASTEXITCODE
        -ne 0) { throw 'Unreal Engine extraction failed.' }\n\n$editor = Get-ChildItem
        -LiteralPath $extract -Filter UnrealEditor.exe -File -Recurse -ErrorAction
        SilentlyContinue |\n  Where-Object { $_.FullName -match '\\\\Engine\\\\Binaries\\\
        \\Win64\\\\UnrealEditor\\.exe$' } |\n  Select-Object -First 1\nif (-not $editor)
        { throw 'UnrealEditor.exe was not found.' }\nWrite-Host \"EDITOR_EXE=$($editor.FullName)\"\
        \n\"UE_EDITOR_EXE=$($editor.FullName)\" | Out-File -FilePath $env:GITHUB_ENV
        -Append -Encoding utf8\n"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Create UE project, bridge and API server
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\ntry { Start-Transcript
        -Path \"$root\\Logs\\workflow-setup-transcript.log\" -Append -Force | Out-Null
        } catch { }\n$project = \"$root\\UEControl\"\n$pythonDir = \"$project\\Content\\\
        Python\"\n$config = \"$project\\Config\"\nNew-Item -ItemType Directory -Force
        -Path $pythonDir, $config, \"$root\\Projects\", \"$root\\Screenshots\", \"\
        $root\\Uploads\", \"$root\\Logs\" | Out-Null\n\n$uproject = @'\n{\n  \"FileVersion\"\
        : 3,\n  \"EngineAssociation\": \"5.8\",\n  \"Category\": \"RemoteControl\"\
        ,\n  \"Description\": \"Unreal Editor controlled through a remote API bridge\"\
        ,\n  \"Plugins\": [\n    { \"Name\": \"PythonScriptPlugin\", \"Enabled\":
        true },\n    { \"Name\": \"EditorScriptingUtilities\", \"Enabled\": true },\n\
        \    { \"Name\": \"ModelContextProtocol\", \"Enabled\": true },\n    { \"\
        Name\": \"AllToolsets\", \"Enabled\": true }\n  ]\n}\n'@\nSet-Content -LiteralPath
        \"$project\\UEControl.uproject\" -Value $uproject -Encoding utf8\n\n$engineConfig
        = @'\n[/Script/EngineSettings.GameMapsSettings]\nEditorStartupMap=/Engine/Maps/Entry\n\
        GameDefaultMap=/Engine/Maps/Entry\n\n[/Script/PythonScriptPlugin.PythonScriptPluginSettings]\n\
        +StartupScripts=D:/UE58/UEControl/Content/Python/init_unreal.py\nbDeveloperMode=True\n\
        bRemoteExecution=False\n\n[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]\n\
        bAutoStartServer=True\nServerPortNumber=8000\nServerUrlPath=/mcp\n'@\nSet-Content
        -LiteralPath \"$config\\DefaultEngine.ini\" -Value $engineConfig -Encoding
        utf8\n\n$bridge = @'\nimport ast\nimport builtins\nimport contextlib\nimport
        io\nimport json\nimport os\nimport queue\nimport threading\nimport time\n\
        import traceback\nimport urllib.request\n\nROOT = os.environ.get(\"UE_ROOT\"\
        , r\"D:\\UE58\")\nLOG_FILE = os.path.join(ROOT, \"Logs\", \"unreal_bridge.log\"\
        )\nAPI = \"http://127.0.0.1:8765\"\nTOKEN = os.environ.get(\"BRIDGE_TOKEN\"\
        , \"\")\nINCOMING = queue.Queue()\nOUTGOING = queue.Queue()\nNAMESPACE = {\"\
        __name__\": \"__ue_remote__\"}\n\n\ndef log(message):\n    line = time.strftime(\"\
        %Y-%m-%d %H:%M:%S \") + str(message)\n    try:\n        os.makedirs(os.path.dirname(LOG_FILE),
        exist_ok=True)\n        with open(LOG_FILE, \"a\", encoding=\"utf-8\") as
        stream:\n            stream.write(line + \"\\n\")\n    except Exception:\n\
        \        pass\n    try:\n        unreal.log(\"[UE58 Remote Bridge] \" + str(message))\n\
        \    except Exception:\n        pass\n\n\nlog(\"Startup file loaded; token_present=%s;
        python=%s\" % (bool(TOKEN), __import__(\"sys\").version.split()[0]))\n\ntry:\n\
        \    import unreal\nexcept Exception:\n    log(\"FATAL: cannot import Unreal
        Python module:\\n\" + traceback.format_exc())\n    raise\n\nif not TOKEN:\n\
        \    log(\"FATAL: BRIDGE_TOKEN is missing from Unreal process environment\"\
        )\n    raise RuntimeError(\"BRIDGE_TOKEN missing\")\n\nif getattr(builtins,
        \"_UE58_REMOTE_BRIDGE_ACTIVE\", False):\n    log(\"Duplicate startup invocation
        ignored; bridge is already active\")\nelse:\n    def request_json(path, payload=None,
        timeout=6):\n        data = None if payload is None else json.dumps(payload).encode(\"\
        utf-8\")\n        req = urllib.request.Request(\n            API + path,\n\
        \            data=data,\n            headers={\n                \"Authorization\"\
        : \"Bearer \" + TOKEN,\n                \"Content-Type\": \"application/json\"\
        ,\n                \"Accept\": \"application/json\",\n            },\n   \
        \         method=\"GET\" if payload is None else \"POST\",\n        )\n  \
        \      with urllib.request.urlopen(req, timeout=timeout) as response:\n  \
        \          raw = response.read().decode(\"utf-8\")\n            return json.loads(raw)
        if raw else {}\n\n    def execute_code(source):\n        captured = io.StringIO()\n\
        \        error = \"\"\n        try:\n            parsed = ast.parse(source,
        filename=\"<remote-unreal-python>\", mode=\"exec\")\n            with contextlib.redirect_stdout(captured),
        contextlib.redirect_stderr(captured):\n                if parsed.body and
        isinstance(parsed.body[-1], ast.Expr):\n                    prefix = ast.Module(body=parsed.body[:-1],
        type_ignores=[])\n                    if prefix.body:\n                  \
        \      exec(compile(prefix, \"<remote-unreal-python>\", \"exec\"), NAMESPACE,
        NAMESPACE)\n                    value = eval(\n                        compile(ast.Expression(parsed.body[-1].value),
        \"<remote-unreal-python>\", \"eval\"),\n                        NAMESPACE,\n\
        \                        NAMESPACE,\n                    )\n             \
        \       if value is not None:\n                        print(repr(value))\n\
        \                else:\n                    exec(compile(parsed, \"<remote-unreal-python>\"\
        , \"exec\"), NAMESPACE, NAMESPACE)\n        except Exception as exc:\n   \
        \         error = \"\".join(traceback.format_exception(type(exc), exc, exc.__traceback__))\n\
        \        output = captured.getvalue().strip()\n        if not output and not
        error:\n            output = \"Executed successfully (no output).\"\n    \
        \    return output, error\n\n    def network_worker():\n        log(\"Bridge
        network worker started; connecting to local API\")\n        connected_logged
        = False\n        last_error_log = 0.0\n        while True:\n            try:\n\
        \                while True:\n                    try:\n                 \
        \       payload = OUTGOING.get_nowait()\n                    except queue.Empty:\n\
        \                        break\n                    try:\n               \
        \         request_json(\"/internal/result\", payload, timeout=8)\n       \
        \             except Exception as exc:\n                        log(\"Posting
        execution result failed: \" + repr(exc))\n\n                # This authenticated
        poll is also the bridge heartbeat. The API\n                # marks the bridge
        online only after it receives this request.\n                reply = request_json(\"\
        /internal/next\", {\"wait\": 1}, timeout=6)\n                if not connected_logged:\n\
        \                    log(\"Authenticated connection to local API established\"\
        )\n                    connected_logged = True\n                job = reply.get(\"\
        job\") if isinstance(reply, dict) else None\n                if job:\n   \
        \                 INCOMING.put(job)\n            except Exception as exc:\n\
        \                connected_logged = False\n                now = time.time()\n\
        \                if now - last_error_log >= 5:\n                    log(\"\
        Local API polling failed: \" + repr(exc))\n                    last_error_log
        = now\n                time.sleep(1.0)\n\n    def editor_tick(delta_seconds):\n\
        \        try:\n            job = INCOMING.get_nowait()\n        except queue.Empty:\n\
        \            return\n        job_id = job.get(\"id\", \"\")\n        log(\"\
        Executing remote Python job \" + str(job_id))\n        output, error = execute_code(job.get(\"\
        code\", \"\"))\n        OUTGOING.put({\"id\": job_id, \"output\": output,
        \"error\": error})\n\n    try:\n        CALLBACK_HANDLE = unreal.register_slate_post_tick_callback(editor_tick)\n\
        \        threading.Thread(target=network_worker, name=\"UE58-Remote-Network\"\
        , daemon=True).start()\n        builtins._UE58_REMOTE_BRIDGE_ACTIVE = True\n\
        \        version = unreal.SystemLibrary.get_engine_version()\n        log(\"\
        BRIDGE_READY; UE_VERSION=\" + str(version))\n        print(\"UE_REMOTE_BRIDGE_READY
        \" + str(version))\n    except Exception:\n        log(\"FATAL: bridge registration
        failed:\\n\" + traceback.format_exc())\n        raise\n\n'@\nSet-Content -LiteralPath
        \"$pythonDir\\init_unreal.py\" -Value $bridge -Encoding utf8\n\n$api = @'\n\
        import asyncio, base64, binascii, contextlib, hashlib, json, os, queue, re,
        secrets, shutil, tempfile, threading, time, uuid\nfrom collections import
        deque\nfrom pathlib import Path\nfrom functools import wraps\nfrom flask import
        Flask, jsonify, request, send_file\n\napp = Flask(__name__)\napp.config[\"\
        MAX_CONTENT_LENGTH\"] = 8 * 1024 * 1024 * 1024\nROOT = Path(os.environ.get(\"\
        UE_ROOT\", r\"D:\\UE58\")).resolve()\nLOG_DIR = ROOT / \"Logs\"\nLOG_DIR.mkdir(parents=True,
        exist_ok=True)\nLOG_FILE = LOG_DIR / \"api.log\"\nBRIDGE_TOKEN = os.environ.get(\"\
        BRIDGE_TOKEN\", \"\")\nMONITOR_USERNAME = \"viewer\"\nMONITOR_PASSWORD = os.environ.get(\"\
        MONITOR_PASSWORD\", \"\")\nMONITOR_LOCK = threading.RLock()\nMONITOR_EVENTS
        = deque(maxlen=100)\nMCP_CONNECTION = {\n    \"request_count\": 0, \"last_seen\"\
        : 0.0, \"last_method\": \"\",\n    \"last_path\": \"\", \"last_status\": None,
        \"last_error\": \"\",\n    \"session_fallback_count\": 0, \"last_session_seen\"\
        : 0.0\n}\nMCP_SESSION_LOCK = threading.RLock()\nMCP_NATIVE_SESSIONS = {}\n\
        RELEASE_UPLOAD_LOCK = threading.Lock()\nRELEASE_LAST_UPLOAD_TIME = 0.0\nMONITOR_STATE
        = {\n    \"public_base_url\": \"\", \"capture_requested\": True, \"capture_running\"\
        : False,\n    \"capture_again\": False, \"last_capture_request\": 0.0, \"\
        capture_error\": \"\",\n    \"image_path\": None, \"image_version\": 0, \"\
        last_tool_call\": None\n}\njobs, waiting, lock = queue.Queue(), {}, threading.Lock()\n\
        last_bridge_seen = 0.0\nUPLOAD_ROOT = (ROOT / \"Uploads\").resolve()\nUPLOAD_ROOT.mkdir(parents=True,
        exist_ok=True)\nUPLOAD_CHUNK_BYTES = 16 * 1024\nUPLOAD_SINGLE_FILE_LIMIT =
        8 * 1024 * 1024\nUPLOAD_MAX_FILE_SIZE = 2 * 1024 * 1024 * 1024\nUPLOAD_SESSIONS
        = {}\nUPLOAD_LOCK = threading.Lock()\n\ndef log(message):\n    line = time.strftime(\"\
        %Y-%m-%d %H:%M:%S \") + str(message)\n    try:\n        with LOG_FILE.open(\"\
        a\", encoding=\"utf-8\") as out:\n            out.write(line + \"\\n\")\n\
        \    except Exception:\n        pass\n    print(line, flush=True)\n\n@app.before_request\n\
        def _request_log_started():\n    request.environ[\"ue_remote_request_started\"\
        ] = time.monotonic()\n\n@app.after_request\ndef _request_log_finished(response):\n\
        \    # Do not fill the logs with the dashboard's 5-second polling traffic.\n\
        \    if request.path not in (\"/api/monitor/state\", \"/api/monitor/logs\"\
        , \"/api/monitor/latest.jpg\"):\n        started = request.environ.get(\"\
        ue_remote_request_started\", time.monotonic())\n        elapsed_ms = (time.monotonic()
        - started) * 1000.0\n        log(\"HTTP %s %s -> %s (%.1f ms)\" % (request.method,
        request.path, response.status_code, elapsed_ms))\n    return response\n\n\
        # Legacy no-op decorator retained for compatibility; exposed REST routes use
        monitor_auth.\ndef public_auth(fn):\n    # Kept as a compatibility decorator
        for older route definitions.\n    @wraps(fn)\n    def wrapper(*args, **kwargs):\n\
        \        return fn(*args, **kwargs)\n    return wrapper\n\ndef monitor_auth(fn):\n\
        \    @wraps(fn)\n    def wrapper(*args, **kwargs):\n        auth = request.authorization\n\
        \        valid = bool(MONITOR_PASSWORD and auth and auth.type == \"basic\"\
        \n                     and auth.username == MONITOR_USERNAME\n           \
        \          and secrets.compare_digest(auth.password or \"\", MONITOR_PASSWORD))\n\
        \        if not valid:\n            if not MONITOR_PASSWORD:\n           \
        \     return jsonify(ok=False, error=\"monitor_password_not_configured\"),
        503\n            response = app.response_class(\"Authentication required\"\
        , status=401)\n            response.headers[\"WWW-Authenticate\"] = 'Basic
        realm=\"Unreal Live Monitor\"'\n            response.headers[\"Cache-Control\"\
        ] = \"no-store\"\n            return response\n        return fn(*args, **kwargs)\n\
        \    return wrapper\n\ndef safe_monitor_value(value, key=\"\", depth=0):\n\
        \    if depth > 5:\n        return \"[nested value omitted]\"\n    if any(word
        in str(key).lower() for word in (\"token\", \"secret\", \"password\", \"authorization\"\
        , \"credential\", \"base64\", \"private_key\", \"data\")):\n        return
        \"[redacted]\"\n    if isinstance(value, dict):\n        return {str(k): safe_monitor_value(v,
        str(k), depth + 1) for k, v in list(value.items())[:25]}\n    if isinstance(value,
        (list, tuple)):\n        return [safe_monitor_value(v, key, depth + 1) for
        v in list(value)[:20]]\n    if isinstance(value, str):\n        text_value
        = value\n        # Avoid exposing accidental credentials embedded in Python
        snippets or results.\n        text_value = re.sub(r\"(?i)(password|passwd|token|secret|api[_-]?key|authorization)(\\\
        s*[:=]\\s*)(['\\\"])[^'\\\"]*\\3\", r\"\\1\\2[redacted]\", text_value)\n \
        \       text_value = re.sub(r\"(?i)(Bearer\\s+)[A-Za-z0-9._~+/-]+=*\", r\"\
        \\1[redacted]\", text_value)\n        text_value = re.sub(r\"(?i)([?&](?:token|secret|password|api_key)=)[^&\\\
        s]+\", r\"\\1[redacted]\", text_value)\n        text_value = re.sub(r\"\\\
        b(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\\b\", \"[redacted]\"\
        , text_value)\n        return text_value if len(text_value) <= 2500 else text_value[:2500]
        + \" …[truncated]\"\n    if value is None or isinstance(value, (int, float,
        bool)):\n        return value\n    return str(value)[:500]\n\ndef monitor_event_start(tool_name,
        arguments):\n    event = {\n        \"id\": uuid.uuid4().hex[:12], \"time\"\
        : time.time(),\n        \"tool\": str(tool_name or \"unknown\"),\n       \
        \ \"arguments\": safe_monitor_value(arguments or {}),\n        \"status\"\
        : \"running\", \"http_status\": None, \"duration_ms\": None\n    }\n    with
        MONITOR_LOCK:\n        MONITOR_EVENTS.appendleft(event)\n        MONITOR_STATE[\"\
        last_tool_call\"] = event[\"time\"]\n    log(\"MONITOR tool call started:
        \" + event[\"tool\"])\n    return event[\"id\"]\n\ndef monitor_event_finish(event_id,
        http_status=None, error=\"\", response_preview=\"\"):\n    now = time.time()\n\
        \    with MONITOR_LOCK:\n        for event in MONITOR_EVENTS:\n          \
        \  if event[\"id\"] == event_id:\n                event[\"status\"] = \"error\"\
        \ if error or (http_status and http_status >= 400) else \"completed\"\n  \
        \              event[\"http_status\"] = http_status\n                event[\"\
        duration_ms\"] = int((now - event[\"time\"]) * 1000)\n                if error:\n\
        \                    event[\"error\"] = str(safe_monitor_value(str(error)))[:1000]\n\
        \                if response_preview:\n                    event[\"result_preview\"\
        ] = str(response_preview)[:4000]\n                break\n    request_monitor_capture()\n\
        \ndef monitor_response_preview(raw_bytes):\n    if not raw_bytes:\n      \
        \  return \"\"\n    raw_text = raw_bytes.decode(\"utf-8\", errors=\"replace\"\
        )\n    try:\n        value = json.loads(raw_text)\n        return json.dumps(safe_monitor_value(value),
        ensure_ascii=False, default=str)[:4000]\n    except Exception:\n        return
        str(safe_monitor_value(raw_text))[:2000]\n\ndef request_monitor_capture():\n\
        \    # Coalesce activity into one pending snapshot. The HTTP route enforces\n\
        \    # the 30-second cooldown, so activity during the cooldown is not lost.\n\
        \    with MONITOR_LOCK:\n        if MONITOR_STATE[\"capture_running\"]:\n\
        \            MONITOR_STATE[\"capture_again\"] = True\n        else:\n    \
        \        MONITOR_STATE[\"capture_requested\"] = True\n\ndef bridge_auth(fn):\n\
        \    @wraps(fn)\n    def wrapper(*args, **kwargs):\n        if not BRIDGE_TOKEN
        or request.headers.get(\"Authorization\", \"\") != \"Bearer \" + BRIDGE_TOKEN:\n\
        \            return jsonify(ok=False, error=\"unauthorized_internal\"), 401\n\
        \        return fn(*args, **kwargs)\n    return wrapper\n\ndef safe_path(value):\n\
        \    if not value:\n        raise ValueError(\"path is required\")\n    candidate
        = Path(value)\n    if not candidate.is_absolute():\n        candidate = ROOT
        / candidate\n    resolved = candidate.resolve()\n    if resolved != ROOT and
        ROOT not in resolved.parents:\n        raise ValueError(\"path must stay inside
        D:\\\\UE58\")\n    return resolved\n\ndef bridge_connected():\n    return
        time.time() - last_bridge_seen < 12\n\ndef queue_unreal(code, timeout=60):\n\
        \    if not bridge_connected():\n        return {\"ok\": False, \"error\"\
        : \"unreal_bridge_not_connected\"}, 503\n    if not isinstance(code, str)
        or not code.strip():\n        return {\"ok\": False, \"error\": \"code must
        be a non-empty string\"}, 400\n    if len(code) > 100000:\n        return
        {\"ok\": False, \"error\": \"code exceeds 100000 characters\"}, 413\n    try:\n\
        \        timeout = max(1, min(300, int(timeout)))\n    except (ValueError,
        TypeError):\n        timeout = 60\n    job_id, event = uuid.uuid4().hex, threading.Event()\n\
        \    with lock:\n        waiting[job_id] = {\"event\": event, \"result\":
        None, \"created\": time.time()}\n    jobs.put({\"id\": job_id, \"code\": code})\n\
        \    if not event.wait(timeout):\n        # Keep the job registered. A caller
        can poll it without losing late results.\n        return {\"ok\": True, \"\
        status\": \"pending\", \"job_id\": job_id,\n                \"message\": \"\
        Still running; call unreal_wait_python_job with this job_id.\"}, 202\n   \
        \ with lock:\n        row = waiting.pop(job_id, None)\n    result = row[\"\
        result\"] if row else None\n    if not result:\n        return {\"ok\": False,
        \"error\": \"missing_result\", \"job_id\": job_id}, 500\n    return {\"ok\"\
        : not bool(result.get(\"error\")), \"status\": \"completed\",\n          \
        \  \"output\": result.get(\"output\", \"\"), \"error\": result.get(\"error\"\
        , \"\"),\n            \"job_id\": job_id}, 200\n\ndef wait_unreal_job(job_id,
        timeout=180):\n    \"\"\"Wait for an Unreal bridge job that queue_unreal returned
        as HTTP 202.\"\"\"\n    job_id = str(job_id or \"\").strip()\n    if not job_id:\n\
        \        return {\"ok\": False, \"error\": \"job_id is required\"}, 400\n\
        \    with lock:\n        row = waiting.get(job_id)\n    if row is None:\n\
        \        return {\"ok\": False, \"error\": \"job_not_found_or_expired\", \"\
        job_id\": job_id}, 404\n    try:\n        timeout = max(1, min(300, int(timeout)))\n\
