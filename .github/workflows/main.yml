        \ -LiteralPath $headlessCommandFile -Force -ErrorAction SilentlyContinue\n    }\n  }\n\n  # A project switch, plugin\
        \ change or checkpoint restore is handled here.\n  if (Test-Path -LiteralPath $editorCommandFile) {\n    try {\n \
        \     $cmd = Get-Content -LiteralPath $editorCommandFile -Raw | ConvertFrom-Json\n      $targetProject = [System.IO.Path]::GetFullPath([string]$cmd.project_file)\n\
        \      $rootPrefix = [System.IO.Path]::GetFullPath($root) + [System.IO.Path]::DirectorySeparatorChar\n      if (-not\
        \ $targetProject.StartsWith($rootPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath\
        \ $targetProject)) { throw 'Restart request project is outside D:\\UE58 or missing.' }\n      Write-Host (\"Editor\
        \ restart command received: {0} -> {1}\" -f $cmd.action, $targetProject)\n      if ($ueProc -and -not $ueProc.HasExited)\
        \ { Stop-Process -Id $ueProc.Id -Force -ErrorAction SilentlyContinue; $ueProc.WaitForExit(15000) | Out-Null }\n  \
        \    $projectDir = Split-Path -Parent $targetProject\n      if ($cmd.action -eq 'restore_checkpoint') {\n        $zipPath\
        \ = [System.IO.Path]::GetFullPath([string]$cmd.checkpoint)\n        $backupPrefix = [System.IO.Path]::GetFullPath(\"\
        $root\\Backups\") + [System.IO.Path]::DirectorySeparatorChar\n        if (-not $zipPath.StartsWith($backupPrefix,\
        \ [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $zipPath)) { throw 'Checkpoint restore\
        \ path is invalid.' }\n        Expand-Archive -LiteralPath $zipPath -DestinationPath $projectDir -Force\n        Write-Host\
        \ \"CHECKPOINT_RESTORED=$zipPath\"\n      }\n      Remove-Item -LiteralPath $editorCommandFile -Force -ErrorAction\
        \ SilentlyContinue\n      $stamp = Get-Date -Format 'yyyyMMdd_HHmmss'\n      $ueOut = \"$root\\Logs\\unreal-$stamp-stdout.log\"\
        \n      $ueErr = \"$root\\Logs\\unreal-$stamp-stderr.log\"\n      $startupScript = Join-Path $projectDir 'Content\\\
        Python\\init_unreal.py'\n      if (-not (Test-Path -LiteralPath $startupScript)) { throw \"Project-local Bridge startup\
        \ script is missing: $startupScript\" }\n      $startupScriptForCmd = $startupScript -replace '\\\\','/'\n      $startupExecCmd\
        \ = '-ExecCmds=\"py ' + $startupScriptForCmd + '\"'\n      $ueArgs = @($targetProject, '-log', '-stdout', '-FullStdOutLogOutput',\
        \ '-AllowSoftwareRendering', '-d3d11', '-ModelContextProtocolStartServer', '-ModelContextProtocolPort=8000', $startupExecCmd)\n\
        \      $ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory $projectDir -PassThru -RedirectStandardOutput\
        \ $ueOut -RedirectStandardError $ueErr\n      $activeProjectFile = $targetProject\n      Write-Host \"UNREAL_RESTARTED_PID=$($ueProc.Id)\
        \ PROJECT=$activeProjectFile\"\n      $restartedBridge = $false\n      for ($i = 0; $i -lt 90; $i++) {\n        Start-Sleep\
        \ -Seconds 2\n        try { $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4; if ($h.bridge_connected)\
        \ { $restartedBridge = $true; break } } catch { }\n        if ($ueProc.HasExited) { break }\n      }\n      if (-not\
        \ $restartedBridge) { throw \"Bridge did not reconnect after project restart. Inspect $ueOut and $ueErr.\" }\n   \
        \   $restartedMcp = $false\n      for ($i = 0; $i -lt 45; $i++) {\n        try { $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp'\
        \ -Method Get -TimeoutSec 4 -UseBasicParsing; if ([int]$probe.StatusCode -eq 405) { $restartedMcp = $true; break }\
        \ } catch { try { if ([int]$_.Exception.Response.StatusCode -eq 405) { $restartedMcp = $true; break } } catch { }\
        \ }\n        Start-Sleep -Seconds 2\n      }\n      if (-not $restartedMcp) { throw 'Native MCP did not return HTTP\
        \ 405 after restart.' }\n      Write-Host 'PROJECT_RESTART_BRIDGE_READY=true NATIVE_MCP_LISTENER_READY=true'\n   \
        \ } catch {\n      Write-Error (\"Editor restart handler failed: \" + $_)\n      if (Test-Path -LiteralPath $editorCommandFile)\
        \ { Remove-Item -LiteralPath $editorCommandFile -Force -ErrorAction SilentlyContinue }\n      throw\n    }\n  }\n\n\
        \  if ($ueProc -and $ueProc.HasExited) { throw \"Unreal Editor stopped with exit code $($ueProc.ExitCode); inspect\
        \ $ueOut, $ueErr and the active project's Saved\\Logs folder.\" }\n  if (((Get-Date) - $lastHeartbeat).TotalMinutes\
        \ -ge 30) {\n    try {\n      $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4\n      Write-Host\
        \ (\"Heartbeat {0}: API_OK={1} BRIDGE_CONNECTED={2}\" -f (Get-Date), $h.ok, $h.bridge_connected)\n    } catch { Write-Warning\
        \ (\"Heartbeat {0}: local health check failed.\" -f (Get-Date)) }\n    $lastHeartbeat = Get-Date\n  }\n}"
