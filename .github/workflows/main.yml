        def _install_plugin_from_path(source):
            source = Path(source).resolve()
            upload_roots = [UPLOAD_ROOT.resolve()]
            if not source.is_file() or not any(root == source or root in source.parents for root in upload_roots):
                raise ValueError("Plugin ZIP must be an existing file inside D:\\UE58\\Uploads")
            if source.suffix.lower() != ".zip" or source.stat().st_size > 500 * 1024 * 1024:
                raise ValueError("Plugin ZIP must be .zip and at most 500 MiB")
            with zipfile.ZipFile(source, "r") as archive:
                members = archive.infolist()
                descriptors = [m for m in members if m.filename.lower().endswith(".uplugin")]
                if len(descriptors) != 1:
                    raise ValueError("ZIP must contain exactly one .uplugin descriptor")
                descriptor = descriptors[0]
                descriptor_path = Path(descriptor.filename.replace("\\", "/"))
                if descriptor_path.is_absolute() or ".." in descriptor_path.parts:
                    raise ValueError("Unsafe plugin archive path")
                plugin_name = descriptor_path.stem
                if not re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", plugin_name):
                    raise ValueError("Invalid plugin name in descriptor")
                prefix = descriptor_path.parent.as_posix()
                prefix = "" if prefix == "." else prefix.rstrip("/") + "/"
                project = _current_project()
                plugin_root = project.parent / "Plugins"
                plugin_root.mkdir(parents=True, exist_ok=True)
                final_dir = (plugin_root / plugin_name).resolve()
                if final_dir.parent != plugin_root.resolve():
                    raise ValueError("Unsafe plugin destination")
                staging = plugin_root / (".installing_" + plugin_name + "_" + uuid.uuid4().hex[:8])
                staging.mkdir(parents=True, exist_ok=False)
                extracted_count = 0
                try:
                    for member in members:
                        raw_name = member.filename.replace("\\", "/")
                        if prefix and not raw_name.startswith(prefix):
                            continue
                        rel_name = raw_name[len(prefix):] if prefix else raw_name
                        if not rel_name:
                            continue
                        rel = Path(rel_name)
                        if rel.is_absolute() or ".." in rel.parts or any(":" in part for part in rel.parts):
                            raise ValueError("Unsafe path in plugin ZIP")
                        mode = (member.external_attr >> 16) & 0o170000
                        if mode == 0o120000:
                            raise ValueError("Symbolic links are not allowed in plugin ZIPs")
                        dest = (staging / rel).resolve()
                        if staging.resolve() != dest and staging.resolve() not in dest.parents:
                            raise ValueError("Plugin ZIP path escapes staging directory")
                        if member.is_dir():
                            dest.mkdir(parents=True, exist_ok=True)
                        else:
                            dest.parent.mkdir(parents=True, exist_ok=True)
                            with archive.open(member, "r") as src, dest.open("wb") as dst:
                                shutil.copyfileobj(src, dst)
                            extracted_count += 1
                    staged_descriptor = staging / descriptor_path.name
                    if not staged_descriptor.is_file():
                        matches = list(staging.rglob(plugin_name + ".uplugin"))
                        if not matches:
                            raise ValueError("Plugin descriptor was not extracted")
                        staged_descriptor = matches[0]
                    json.loads(staged_descriptor.read_text(encoding="utf-8-sig"))
                    plugin_backup = ""
                    if final_dir.exists():
                        backup_dir = BACKUP_DIR / "plugins"
                        backup_dir.mkdir(parents=True, exist_ok=True)
                        plugin_backup_path = backup_dir / (plugin_name + "_" + time.strftime("%Y%m%d_%H%M%S") + ".zip")
                        with zipfile.ZipFile(plugin_backup_path, "w", compression=zipfile.ZIP_DEFLATED, allowZip64=True) as zf:
                            for old_file in final_dir.rglob("*"):
                                if old_file.is_file():
                                    zf.write(old_file, old_file.relative_to(final_dir).as_posix())
                        plugin_backup = str(plugin_backup_path)
                        shutil.rmtree(final_dir)
                    os.replace(staging, final_dir)
                except Exception:
                    shutil.rmtree(staging, ignore_errors=True)
                    raise
            data = json.loads(project.read_text(encoding="utf-8-sig"))
            backup_project = _backup_file(project, "uproject")
            plugins = data.get("Plugins") if isinstance(data.get("Plugins"), list) else []
            row = next((x for x in plugins if isinstance(x, dict) and x.get("Name") == plugin_name), None)
            if row is None:
                plugins.append({"Name": plugin_name, "Enabled": True})
            else:
                row["Enabled"] = True
            data["Plugins"] = plugins
            tmp = project.with_suffix(".uproject.tmp")
            tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
            os.replace(tmp, project)
            _ensure_bridge_in_project(project)
            command = _write_editor_command("restart_editor", project)
            with PLUGIN_INDEX_LOCK:
                PLUGIN_INDEX_CACHE.update({"roots": (), "paths": None, "built_at": 0.0})
            log("Plugin installed through MCP: %s files=%s" % (plugin_name, extracted_count))
            return {"ok": True, "plugin": plugin_name, "files": extracted_count,
                    "plugin_backup": plugin_backup, "project_backup": backup_project,
                    "restart_queued": True, "command": command}


        def _set_project_plugin(name, enabled):
            if not re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", str(name or "")) or not isinstance(enabled, bool):
                raise ValueError("plugin name and boolean enabled value are required")
            if name in ("PythonScriptPlugin", "EditorScriptingUtilities", "ModelContextProtocol", "AllToolsets") and not enabled:
                raise ValueError("Cannot disable a plugin required by the remote-control bridge")
            project = _current_project()
            if name not in _available_plugin_descriptors(project):
                raise ValueError("Plugin descriptor not found")
            data = json.loads(project.read_text(encoding="utf-8-sig"))
            backup = _backup_file(project, "uproject")
            entries = data.get("Plugins") if isinstance(data.get("Plugins"), list) else []
            item = next((x for x in entries if isinstance(x, dict) and x.get("Name") == name), None)
            if item is None:
                item = {"Name": name, "Enabled": enabled}
                entries.append(item)
            else:
                item["Enabled"] = enabled
            data["Plugins"] = entries
            tmp = project.with_suffix(".uproject.tmp")
            tmp.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
            os.replace(tmp, project)
            _ensure_bridge_in_project(project)
            with PLUGIN_INDEX_LOCK:
                PLUGIN_INDEX_CACHE.update({"roots": (), "paths": None, "built_at": 0.0})
            command = _write_editor_command("restart_editor", project)
            return {"ok": True, "plugin": name, "enabled": enabled, "backup": backup,
                    "restart_queued": True, "command": command}


        def _handle_extra_mcp_tool(name, args):
            args = args or {}
            if name == "unreal_run_headless_python":
                return _enqueue_headless_job(args)
            if name == "unreal_get_headless_job_status":
                job_id = str(args.get("job_id", "")).strip()
                value = _read_headless_status(job_id)
                if not value:
                    return {"ok": False, "error": "headless_job_not_found", "job_id": job_id}
                value["stdout_tail"] = _headless_log_tail(job_id, "stdout.log")
                value["stderr_tail"] = _headless_log_tail(job_id, "stderr.log")
                return {"ok": True, "job": value}
            if name == "unreal_cancel_headless_job":
                return _cancel_headless_job(str(args.get("job_id", "")))
            if name == "unreal_execute_console_command":
                command = str(args.get("command") or "").strip()
                if not command or len(command) > 2000 or any(ch in command for ch in ("\x00", "\r", "\n")):
                    raise ValueError("command must be a single line of 1-2000 characters")
                code = "import unreal\n_world = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()\nunreal.SystemLibrary.execute_console_command(_world, %r)\nprint('CONSOLE_COMMAND_SENT')" % command
                result, status = queue_unreal(code, 15)
                return {"ok": status == 200 and bool(result.get("ok")), "http_status": status, **result}
            if name == "unreal_install_plugin_from_zip":
                if args.get("confirm_install") is not True:
                    raise ValueError("confirm_install=true is required; installing a plugin changes the project and restarts Unreal")
                if bridge_connected():
                    save_result, save_status = queue_unreal("import unreal\nprint('SAVE_DIRTY_RESULT=' + str(unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)))", 25)
                    if save_status != 200:
                        raise RuntimeError("Could not save project before plugin installation: " + str(save_result))
                return _install_plugin_from_path(args.get("source", ""))
            if name == "unreal_monitor_get_scene":
                return _start_scene_scan(force=bool(args.get("force", False)))
            if name == "unreal_monitor_get_scene_status":
                return _scene_job_payload(args.get("job_id", ""))
            if name == "unreal_monitor_list_projects":
                return {"ok": True, "current_project": str(_current_project()), "projects": _project_payload()}
            if name == "unreal_monitor_list_plugins":
                return _project_plugin_state(query=args.get("query", ""), offset=args.get("offset", 0), limit=args.get("limit", 75))
            if name == "unreal_monitor_set_plugin_enabled":
                if args.get("confirm_restart") is not True:
                    raise ValueError("confirm_restart=true is required; changing plugins restarts Unreal")
                if bridge_connected():
                    save_result, save_status = queue_unreal("import unreal\nprint('SAVE_DIRTY_RESULT=' + str(unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True, True)))", 25)
                    if save_status != 200:
                        raise RuntimeError("Could not save before plugin restart: " + str(save_result))
                return _set_project_plugin(str(args.get("name", "")), args.get("enabled"))
            if name == "unreal_switch_project":
