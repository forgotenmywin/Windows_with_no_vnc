        \ this passes.\"\n}\nWrite-Host 'PUBLIC_TUNNEL_HEALTH_OK=true'\n\n# Verify both the current stateless MCP protocol\
        \ and legacy 2025 handshake compatibility through the public HTTPS URL.\n# Public Starlette mount is /mcp/; upstream\
        \ Unreal listener remains /mcp. No OAuth or bearer token is used.\n# Build the MCP URL from the already validated\
        \ System.Uri object. This\n# prevents PowerShell/.NET from parsing raw cloudflared console text as a URI.\n$mcpUriBuilder\
        \ = [System.UriBuilder]::new($publicUri)\n$mcpUriBuilder.Path = '/mcp'\n$mcpUriBuilder.Query = ''\n$mcpUriBuilder.Fragment\
        \ = ''\n$mcpEndpointUri = $mcpUriBuilder.Uri\nif (-not $mcpEndpointUri.IsAbsoluteUri -or $mcpEndpointUri.Scheme -ne\
