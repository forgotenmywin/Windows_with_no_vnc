name: Unreal Engine 5.8 - Windows noVNC Headless

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\UE58\Parts | Out-Null
          New-Item -ItemType Directory -Force D:\UE58\Extracted | Out-Null
          New-Item -ItemType Directory -Force D:\UE58\Logs | Out-Null

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure the RDP_PASSWORD repository secret."
          }

          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser -Name "runneradmin" -Password $secure
          } else {
            $user = Get-LocalUser -Name "ueadmin" -ErrorAction SilentlyContinue

            if (-not $user) {
              New-LocalUser -Name "ueadmin" -Password $secure -PasswordNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "ueadmin"
            } else {
              Set-LocalUser -Name "ueadmin" -Password $secure
            }
          }

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Configure the VNC_PASSWORD repository secret."
          }

          if ($env:VNC_PASSWORD.Length -lt 6) {
            throw "VNC_PASSWORD must be at least 6 characters."
          }

          $installer = "D:\UE58\tightvnc.msi"

          Invoke-WebRequest `
            "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi" `
            -OutFile $installer

          $arguments = @(
            "/i", $installer, "/qn", "/norestart",
            "ADDLOCAL=Server",
            "SERVER_REGISTER_AS_SERVICE=1",
            "SERVER_ADD_FIREWALL_EXCEPTION=1",
            "SET_PASSWORD=1",
            "VALUE_OF_PASSWORD=$env:VNC_PASSWORD"
          )

          $install = Start-Process msiexec.exe `
            -ArgumentList $arguments -Wait -PassThru

          if ($install.ExitCode -ne 0) {
            throw "TightVNC installation failed: $($install.ExitCode)"
          }

          Get-Service *tvn* -ErrorAction SilentlyContinue |
            ForEach-Object {
              if ($_.Status -ne "Running") {
                Start-Service $_.Name -ErrorAction SilentlyContinue
              }
            }

      - name: Download Unreal Engine ZIP parts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $owner = "forgotenmywin"
          $repo = "Windows_with_no_vnc"
          $tag = "ue5.8"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$owner/$repo/releases/tags/$tag" `
            -Headers $headers

          for ($i = 1; $i -le 8; $i++) {
            $name = "UE_5.8.zip.{0:D3}" -f $i

            $asset = $release.assets |
              Where-Object { $_.name -eq $name } |
              Select-Object -First 1

            if (-not $asset) {
              throw "Release asset missing: $name"
            }

            $destination = "D:\UE58\Parts\$name"
            Write-Host "Downloading $name ($($asset.size) bytes)"

            Invoke-WebRequest `
              -Uri $asset.browser_download_url `
              -Headers $headers `
              -OutFile $destination

            $actual = (Get-Item $destination).Length

            if ($actual -ne $asset.size) {
              throw "Size mismatch for $name. Expected $($asset.size), got $actual"
            }
          }

      - name: Join ZIP parts
        shell: pwsh
        run: |
          $zip = "D:\UE58\UE_5.8.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          $output = [System.IO.File]::Open(
            $zip,
            [System.IO.FileMode]::CreateNew
          )

          try {
            for ($i = 1; $i -le 8; $i++) {
              $name = "UE_5.8.zip.{0:D3}" -f $i
              $path = "D:\UE58\Parts\$name"

              if (-not (Test-Path $path)) {
                throw "Missing ZIP part: $name"
              }

              $input = [System.IO.File]::OpenRead($path)

              try {
                $input.CopyTo($output)
              } finally {
                $input.Dispose()
              }
            }
          } finally {
            $output.Dispose()
          }

          Write-Host "Combined ZIP size: $((Get-Item $zip).Length) bytes"

      - name: Install 7-Zip and test archive
        shell: pwsh
        run: |
          $sevenZip = @(
            "C:\Program Files\7-Zip\7z.exe",
            "C:\Program Files (x86)\7-Zip\7z.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $sevenZip) {
            $installer = "D:\UE58\7zip-installer.exe"

            Invoke-WebRequest `
              "https://www.7-zip.org/a/7zr.exe" `
              -OutFile "D:\UE58\7zr.exe"

            # Try installing through winget on the hosted runner.
            winget install --id 7zip.7zip --exact --silent `
              --accept-package-agreements --accept-source-agreements

            $sevenZip = @(
              "C:\Program Files\7-Zip\7z.exe",
              "C:\Program Files (x86)\7-Zip\7z.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $sevenZip) {
            throw "7-Zip was not found. Install 7-Zip before extracting."
          }

          $sevenZip | Set-Content D:\UE58\Logs\7zip-path.txt

          & $sevenZip t "D:\UE58\UE_5.8.zip"

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity test failed."
          }

      - name: Extract Unreal Engine
        shell: pwsh
        run: |
          $sevenZip = (Get-Content D:\UE58\Logs\7zip-path.txt).Trim()
          $zip = "D:\UE58\UE_5.8.zip"
          $destination = "D:\UE58\Extracted"

          & $sevenZip x $zip "-o$destination" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Unreal extraction failed."
          }

          $engine = Get-ChildItem $destination `
            -Filter UnrealEditor-Cmd.exe -Recurse -File |
            Select-Object -First 1

          if (-not $engine) {
            throw "UnrealEditor-Cmd.exe was not found."
          }

          $engine.FullName |
            Set-Content D:\UE58\Logs\engine-path.txt

          Write-Host "Engine path: $($engine.FullName)"

      - name: Start Unreal without rendering
        shell: pwsh
        run: |
          $engineFile = (Get-Content D:\UE58\Logs\engine-path.txt).Trim()
          $logFile = "D:\UE58\Logs\unreal-headless.log"

          Write-Host "Starting Unreal with -nullrhi"

          $process = Start-Process `
            -FilePath $engineFile `
            -ArgumentList @(
              "-nullrhi",
              "-unattended",
              "-nop4",
              "-nosplash",
              "-stdout",
              "-FullStdOutLogOutput",
              "-log=$logFile"
            ) `
            -PassThru

          Start-Sleep -Seconds 30
          $process.Refresh()

          if ($process.HasExited) {
            Write-Host "Unreal exit code: $($process.ExitCode)"

            Get-Content $logFile -Tail 200 `
              -ErrorAction SilentlyContinue

            throw "Unreal exited during startup."
          }

          "PID=$($process.Id)" |
            Set-Content D:\UE58\Logs\unreal-process.txt

          Write-Host "Unreal started. PID=$($process.Id)"

      - name: Start noVNC
        shell: pwsh
        run: |
          $noVncDir = "D:\UE58\noVNC"

          if (-not (Test-Path "$noVncDir\vnc.html")) {
            git clone --depth 1 `
              https://github.com/novnc/noVNC.git $noVncDir

            if ($LASTEXITCODE -ne 0) {
              throw "Could not download noVNC."
            }
          }

          python -m pip install websockify

          if ($LASTEXITCODE -ne 0) {
            throw "websockify installation failed."
          }

          $python = (Get-Command python).Source

          Start-Process `
            -FilePath $python `
            -ArgumentList @(
              "-m", "websockify",
              "--web", $noVncDir,
              "6080", "localhost:5900"
            ) `
            -RedirectStandardOutput "D:\UE58\Logs\novnc.log" `
            -RedirectStandardError "D:\UE58\Logs\novnc-error.log"

          Start-Sleep -Seconds 5
          Write-Host "noVNC websockify started on port 6080."

      - name: Start Cloudflare Tunnel (optional)
        shell: pwsh
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CF_TUNNEL_TOKEN)) {
            Write-Host "CF_TUNNEL_TOKEN not configured; tunnel skipped."
            exit 0
          }

          $cloudflared = "D:\UE58\cloudflared.exe"

          Invoke-WebRequest `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel", "--no-autoupdate", "run",
              "--token", $env:CF_TUNNEL_TOKEN
            ) `
            -RedirectStandardOutput "D:\UE58\Logs\cloudflared.log" `
            -RedirectStandardError "D:\UE58\Logs\cloudflared-error.log"

          Write-Host "Cloudflare Tunnel process started."

      - name: Keep runner alive and monitor Unreal
        shell: pwsh
        run: |
          $logFile = "D:\UE58\Logs\unreal-headless.log"
          $reported = $false

          while ($true) {
            Start-Sleep -Seconds 30

            $pidLine = Get-Content `
              "D:\UE58\Logs\unreal-process.txt" `
              -ErrorAction SilentlyContinue

            $pidValue = 0

            if ($pidLine -match 'PID=(\d+)') {
              $pidValue = [int]$Matches[1]
            }

            $engine = Get-Process -Id $pidValue `
              -ErrorAction SilentlyContinue

            if (-not $engine -and -not $reported) {
              $reported = $true

              Write-Host "Unreal has exited. Recent logs:"
              Get-Content $logFile -Tail 200 `
                -ErrorAction SilentlyContinue

              Write-Host "Unreal will not be restarted automatically."
            }

            Write-Host "Runner alive: $(Get-Date -Format o)"
          }

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreal-diagnostic-logs
          path: D:\UE58\Logs\
          if-no-files-found: warn
          retention-days: 3
