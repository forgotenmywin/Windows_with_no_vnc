
name: Unreal Engine 5.8 - Windows RDP + noVNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal-engine:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            "D:\UE58\Parts", `
            "D:\UE58\Extracted", `
            "D:\UE58\Logs" | Out-Null

          Write-Host "Folders ready."

      - name: Configure RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Set RDP_PASSWORD in repository Actions secrets."
          }

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser `
            -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name "ueadmin" `
              -Password $securePassword `
              -AccountNeverExpires

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member "ueadmin"
          }
          else {
            Set-LocalUser `
              -Name "runneradmin" `
              -Password $securePassword
          }

          Restart-Service -Name TermService -Force
          Write-Host "RDP configured."

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Set VNC_PASSWORD in repository Actions secrets."
          }

          if ($env:VNC_PASSWORD.Length -gt 8) {
            throw "TightVNC password must be 8 characters or fewer."
          }

          $installer = "D:\UE58\tightvnc-installer.msi"

          $url = "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi"

          try {
            Invoke-WebRequest -Uri $url -OutFile $installer
          }
          catch {
            $url = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
            Invoke-WebRequest -Uri $url -OutFile $installer
          }

          $arguments = @(
            "/i"
            "`"$installer`""
            "/qn"
            "/norestart"
            "ADDLOCAL=Server"
            "SERVER_REGISTER_AS_SERVICE=1"
            "SERVER_ADD_FIREWALL_EXCEPTION=1"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$($env:VNC_PASSWORD)"
          ) -join " "

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "TightVNC installation failed: $($process.ExitCode)"
          }

          Start-Service -Name tvnserver -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          Get-Service -Name tvnserver -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

      - name: Download Unreal Engine ZIP parts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $owner = "forgotenmywin"
          $repo = "Windows_with_no_vnc"
          $tag = "ue5.8"

          $api = "https://api.github.com/repos/$owner/$repo/releases/tags/$tag"

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
            -Uri $api `
            -Headers $headers

          $names = 1..8 | ForEach-Object {
            "UE_5.8.zip.{0:D3}" -f $_
          }

          foreach ($name in $names) {
            $asset = $release.assets |
              Where-Object { $_.name -eq $name } |
              Select-Object -First 1

            if ($null -eq $asset) {
              throw "Release asset not found: $name"
            }

            $destination = "D:\UE58\Parts\$name"
            $expected = [long]$asset.size
            $success = $false

            Write-Host ""
            Write-Host "========================================"
            Write-Host "Asset: $name"
            Write-Host "Expected size: $expected bytes"
            Write-Host "========================================"

            # Try the direct download URL first.
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Remove-Item $destination `
                -Force `
                -ErrorAction SilentlyContinue

              Write-Host "Direct download attempt $attempt of 3"

              & curl.exe `
                -fL `
                --retry 2 `
                --retry-delay 3 `
                --connect-timeout 30 `
                --max-time 1800 `
                --output $destination `
                $asset.browser_download_url

              $curlExit = $LASTEXITCODE

              if ($curlExit -eq 0 -and (Test-Path $destination)) {
                $actual = (Get-Item $destination).Length

                if ($actual -eq $expected) {
                  $success = $true
                  Write-Host "Verified direct download: $actual bytes"
                  break
                }

                Write-Host "Incorrect size: $actual bytes"
              }
              else {
                Write-Host "Direct download failed: curl exit $curlExit"
              }

              Remove-Item $destination `
                -Force `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 5
            }

            # Retry through the authenticated GitHub API if needed.
            if (-not $success) {
              Write-Host "Trying GitHub API asset download."

              $downloadHeaders = @{
                Authorization = "Bearer $env:GH_TOKEN"
                Accept = "application/octet-stream"
                "X-GitHub-Api-Version" = "2022-11-28"
              }

              for ($attempt = 1; $attempt -le 3; $attempt++) {
                Remove-Item $destination `
                  -Force `
                  -ErrorAction SilentlyContinue

                Write-Host "API download attempt $attempt of 3"

                try {
                  Invoke-WebRequest `
                    -Uri $asset.url `
                    -Headers $downloadHeaders `
                    -OutFile $destination `
                    -MaximumRedirection 10 `
                    -TimeoutSec 1800 `
                    -ErrorAction Stop

                  if (Test-Path $destination) {
                    $actual = (Get-Item $destination).Length

                    if ($actual -eq $expected) {
                      $success = $true
                      Write-Host "Verified API download: $actual bytes"
                      break
                    }

                    Write-Host "Incorrect API response size: $actual bytes"
                  }
                }
                catch {
                  Write-Host "API download error: $($_.Exception.Message)"
                }

                Remove-Item $destination `
                  -Force `
                  -ErrorAction SilentlyContinue

                Start-Sleep -Seconds 5
              }
            }

            if (-not $success) {
              throw "Failed to download and verify $name."
            }

            Write-Host "VERIFIED: $name ($expected bytes)"
          }

          Write-Host "All eight ZIP parts downloaded and verified."

      - name: Rebuild and test ZIP
        shell: pwsh
        run: |
          $output = "D:\UE58\UE_5.8.zip"

          Remove-Item $output `
            -Force `
            -ErrorAction SilentlyContinue

          $parts = 1..8 | ForEach-Object {
            "D:\UE58\Parts\UE_5.8.zip.{0:D3}" -f $_
          }

          $stream = [System.IO.File]::Create($output)

          try {
            foreach ($part in $parts) {
              if (-not (Test-Path $part)) {
                throw "Missing ZIP part: $part"
              }

              Write-Host "Joining $part"

              $inputStream = [System.IO.File]::OpenRead($part)

              try {
                $inputStream.CopyTo($stream)
              }
              finally {
                $inputStream.Dispose()
              }
            }
          }
          finally {
            $stream.Dispose()
          }

          Write-Host "Reconstructed ZIP size: $((Get-Item $output).Length) bytes"

          $candidates = @(
            "$env:ProgramFiles\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          )

          $sevenZip = $candidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $sevenZip) {
            $installer = "D:\UE58\7zip-installer.exe"

            Invoke-WebRequest `
              -Uri "https://www.7-zip.org/a/7z2409-x64.exe" `
              -OutFile $installer

            $installProcess = Start-Process `
              -FilePath $installer `
              -ArgumentList "/S" `
              -Wait `
              -PassThru

            $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"

            if (-not (Test-Path $sevenZip)) {
              throw "7-Zip installation failed: $($installProcess.ExitCode)"
            }
          }

          & $sevenZip t $output

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity test failed."
          }

          Write-Host "ZIP integrity test passed."

      - name: Extract Unreal Engine
        shell: pwsh
        run: |
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          $archive = "D:\UE58\UE_5.8.zip"
          $destination = "D:\UE58\Extracted"

          if (-not (Test-Path $archive)) {
            throw "Archive not found: $archive"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $destination | Out-Null

          & $sevenZip x $archive "-o$destination" -y

          if ($LASTEXITCODE -ne 0) {
            throw "Unreal Engine extraction failed."
          }

          $engineFolder = "$destination\UE_5.8"

          if (-not (Test-Path $engineFolder)) {
            throw "Expected extracted folder not found: $engineFolder"
          }

          Write-Host "========================================"
          Write-Host "UNREAL ENGINE EXTRACTION SUCCESSFUL"
          Write-Host "Engine folder: $engineFolder"
          Write-Host "========================================"

          Get-ChildItem $engineFolder -Force |
            Select-Object Name, FullName |
            Format-Table -AutoSize

      - name: Start noVNC after extraction and keep runner alive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $base = "D:\UE58"
          $logDir = "$base\Logs"
          $noVncDir = "$base\noVNC"
          $engineFolder = "$base\Extracted\UE_5.8"

          New-Item -ItemType Directory -Force -Path $logDir |
            Out-Null

          # Only start noVNC after successful Unreal Engine extraction.
          if (-not (Test-Path $engineFolder)) {
            throw "Unreal Engine extraction folder not found: $engineFolder"
          }

          Write-Host "Unreal Engine is extracted:"
          Write-Host $engineFolder

          # Download and install noVNC after extraction.
          $noVncZip = "$base\novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.6.0.zip" `
            -OutFile $noVncZip

          Expand-Archive `
            -Path $noVncZip `
            -DestinationPath $base `
            -Force

          $sourceDir = "$base\noVNC-1.6.0"

          if (-not (Test-Path $sourceDir)) {
            throw "noVNC source directory not found."
          }

          New-Item -ItemType Directory -Force -Path $noVncDir |
            Out-Null

          Copy-Item `
            "$sourceDir\*" `
            $noVncDir `
            -Recurse `
            -Force

          # Install websockify.
          py -m pip install websockify

          $scripts = (
            py -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          ).Trim()

          $websockify = Join-Path $scripts "websockify.exe"

          if (-not (Test-Path $websockify)) {
            throw "websockify.exe not found: $websockify"
          }

          # Start websockify in this persistent step.
          Start-Process `
            -FilePath $websockify `
            -ArgumentList @(
              "--web", $noVncDir,
              "6080",
              "127.0.0.1:5900"
            ) `
            -RedirectStandardOutput "$logDir\websockify-live.log" `
            -RedirectStandardError "$logDir\websockify-live-error.log" `
            -WindowStyle Hidden

          $websockifyReady = $false

          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2

            $listener = Get-NetTCPConnection `
              -LocalPort 6080 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              $websockifyReady = $true
              break
            }
          }

          if (-not $websockifyReady) {
            Get-Content "$logDir\websockify-live-error.log" `
              -ErrorAction SilentlyContinue

            throw "websockify did not listen on port 6080."
          }

          Write-Host "Websockify is listening on port 6080."

          # Start Cloudflare only after noVNC is ready.
          $cf = "$base\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cf

          Start-Process `
            -FilePath $cf `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput "$logDir\cloudflared-live.log" `
            -RedirectStandardError "$logDir\cloudflared-live-error.log" `
            -WindowStyle Hidden

          # Wait for the public tunnel URL to appear in the log.
          $tunnelUrl = $null

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2

            $logs = Get-Content "$logDir\cloudflared-live-error.log" `
              -ErrorAction SilentlyContinue

            $matches = $logs |
              Select-String -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com'

            if ($matches) {
              $line = ($matches | Select-Object -Last 1).Line

              $tunnelUrl = [regex]::Match(
                $line,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              ).Value

              if ($tunnelUrl) {
                break
              }
            }
          }

          if ($tunnelUrl) {
            Write-Host ""
            Write-Host "========================================"
            Write-Host "UNREAL ENGINE EXTRACTED SUCCESSFULLY"
            Write-Host "noVNC URL:"
            Write-Host "$tunnelUrl/vnc.html?autoconnect=true&resize=scale"
            Write-Host "========================================"
          }
          else {
            Write-Host "Tunnel URL was not detected."
            Get-Content "$logDir\cloudflared-live-error.log" `
              -Tail 40 `
              -ErrorAction SilentlyContinue
          }

          # Keep both the machine and connection processes alive.
          while ($true) {
            $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

            $vnc = Get-Process `
              -Name "tvnserver" `
              -ErrorAction SilentlyContinue

            $websockifyListener = Get-NetTCPConnection `
              -LocalPort 6080 `
              -State Listen `
              -ErrorAction SilentlyContinue

            $cloudflaredProcess = Get-Process `
              -Name "cloudflared" `
              -ErrorAction SilentlyContinue

            $vncState = if ($vnc) { "RUNNING" } else { "STOPPED" }
            $websockifyState = if ($websockifyListener) { "LISTENING" } else { "STOPPED" }
            $cloudflareState = if ($cloudflaredProcess) { "RUNNING" } else { "STOPPED" }

            Write-Host "[$now] ACTIVE | VNC=$vncState | Websockify=$websockifyState | Cloudflare=$cloudflareState"

            Start-Sleep -Seconds 60
          }
