        def _create_checkpoint(project_file=None):
            project = Path(project_file or _current_project()).resolve()
            if not project.is_file() or not _inside_root(project):
                raise ValueError("Project not found inside D:\\UE58")
            stamp = time.strftime("%Y%m%d_%H%M%S")
            out = BACKUP_DIR / (project.stem + "_checkpoint_" + stamp + "_" + uuid.uuid4().hex[:5] + ".zip")
            skip = {"Intermediate", "DerivedDataCache", "Saved", ".git", ".vs", "Binaries", "Builds"}
            base = project.parent
            total = 0
            with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=3, allowZip64=True) as archive:
                for root, dirs, files in os.walk(base):
                    dirs[:] = [d for d in dirs if d not in skip]
                    for filename in files:
                        source = Path(root) / filename
                        rel = source.relative_to(base)
                        archive.write(source, rel.as_posix())
                        total += 1
            log("Checkpoint created: %s files=%s size=%s" % (out, total, out.stat().st_size))
            return {"ok": True, "checkpoint": str(out), "size": out.stat().st_size, "files": total,
                    "project_file": str(project), "note": "Excludes Saved, Intermediate, DerivedDataCache and Binaries. It is a source/content checkpoint, not a full runnable engine backup."}


