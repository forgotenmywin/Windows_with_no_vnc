        def mcp_text_result(send, request_obj, value, is_error=False):
            response_obj = {
                "jsonrpc": "2.0", "id": request_obj.get("id"),
                "result": {"resultType": "complete", "content": [{"type": "text", "text": json.dumps(value, ensure_ascii=False, default=str)}], "isError": bool(is_error)}
            }
            return response_obj

        def parse_sse_json_messages(raw_bytes):
            """Decode JSON-RPC messages carried in an upstream SSE response."""
            decoded = raw_bytes.decode("utf-8", errors="replace")
            messages = []
            for block in re.split(r"\r?\n\r?\n", decoded):
                data_lines = []
                for line in block.splitlines():
                    if line.startswith("data:"):
                        data_lines.append(line[5:].lstrip())
                if not data_lines:
                    continue
                payload = "\n".join(data_lines).strip()
                if not payload or payload == "[DONE]":
                    continue
                try:
                    value = json.loads(payload)
                except Exception:
                    continue
                if isinstance(value, dict):
                    messages.append(value)
                elif isinstance(value, list):
                    messages.extend(item for item in value if isinstance(item, dict))
            return messages

        async def read_mcp_http_reply(response, request_obj):
            """Read one MCP response; return on the matching SSE event, not stream EOF."""
            content_type = response.headers.get("content-type", "").lower()
            if "text/event-stream" not in content_type:
                raw = await response.aread()
                try:
                    parsed = json.loads(raw.decode("utf-8")) if raw else None
                except Exception:
                    parsed = None
                return raw, parsed, False

            wanted_id = request_obj.get("id") if isinstance(request_obj, dict) else None
            data_lines = []
            event_count = 0

            def decode_event(lines):
                payload = "\n".join(lines).strip()
                if not payload or payload == "[DONE]":
                    return None
                try:
                    value = json.loads(payload)
                except Exception:
                    return None
                for item in (value if isinstance(value, list) else [value]):
                    if isinstance(item, dict) and (wanted_id is None or item.get("id") == wanted_id):
                        return item
                return None

            async for line in response.aiter_lines():
                if line == "":
                    if data_lines:
                        event_count += 1
                        matched = decode_event(data_lines)
                        data_lines = []
                        if matched is not None:
                            raw = json.dumps(matched, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                            return raw, matched, True
                elif line.startswith("data:"):
                    data_lines.append(line[5:].lstrip())
                elif line.startswith(":"):
                    # SSE keep-alive comment: the JSON-RPC event may follow later.
                    continue

            if data_lines:
                event_count += 1
                matched = decode_event(data_lines)
                if matched is not None:
                    raw = json.dumps(matched, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                    return raw, matched, True
            raise RuntimeError("Upstream MCP SSE ended without matching JSON-RPC reply; id=%r events=%d" % (wanted_id, event_count))

        async def mcp_post_and_read(client, target, headers, request_obj, content=None, json_body=None):
            """POST MCP JSON-RPC and capture one response without waiting for an SSE stream to close."""
            async with client.stream("POST", target, headers=headers, content=content, json=json_body) as response:
                raw, parsed, was_sse = await read_mcp_http_reply(response, request_obj)
                return response.status_code, dict(response.headers), list(response.headers.raw), raw, parsed, was_sse

        async def send_mcp_json(send, obj, headers=None, status=200):
            payload = json.dumps(obj, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
            with MONITOR_LOCK:
                MCP_CONNECTION["last_status"] = int(status)
                if status >= 400:
                    MCP_CONNECTION["last_error"] = str(obj.get("error", obj.get("message", "MCP HTTP %s" % status)))[:500] if isinstance(obj, dict) else "MCP HTTP %s" % status
            log("MCP OUT status=%s content_type=application/json bytes=%s" % (status, len(payload)))
            out = [(b"content-type", b"application/json; charset=utf-8"),
                   (b"content-length", str(len(payload)).encode("ascii")),
                   (b"cache-control", b"no-store")]
            for key, value in (headers or []):
                if key.lower() not in (b"content-type", b"content-length", b"content-encoding", b"transfer-encoding", b"connection"):
                    out.append((key.lower(), value))
            await send({"type": "http.response.start", "status": status, "headers": out})
            await send({"type": "http.response.body", "body": payload, "more_body": False})

        async def _serve_mcp_event_stream(scope, receive, send):
            """Return 405: this server supports client-to-server MCP POST only.

            Streamable HTTP permits GET to return 405 when server-initiated streams
            are not supported. A never-ending comment-only SSE response caused some
            MCP connector reachability checks to hang or reject the content type.
            """
            while True:
                message = await receive()
                if message.get("type") == "http.disconnect":
                    return
                if message.get("type") == "http.request" and not message.get("more_body", False):
                    break
            with MONITOR_LOCK:
                MCP_CONNECTION["request_count"] += 1
                MCP_CONNECTION["last_seen"] = time.time()
                MCP_CONNECTION["last_method"] = "GET (unsupported; POST-only MCP)"
                MCP_CONNECTION["last_path"] = scope.get("path", "/") or "/"
                MCP_CONNECTION["last_status"] = 405
                MCP_CONNECTION["last_error"] = "GET event streams are not supported; use POST for MCP JSON-RPC."
            payload = json.dumps({"jsonrpc": "2.0", "error": {
                "code": -32000, "message": "Method Not Allowed: use POST for MCP Streamable HTTP requests."
            }, "id": None}, separators=(",", ":")).encode("utf-8")
            headers = [
                (b"content-type", b"application/json; charset=utf-8"),
                (b"content-length", str(len(payload)).encode("ascii")),
                (b"allow", b"POST, HEAD, OPTIONS"),
                (b"cache-control", b"no-store"),
            ]
            await send({"type": "http.response.start", "status": 405, "headers": headers})
            await send({"type": "http.response.body", "body": payload, "more_body": False})
            log("MCP GET rejected with 405; POST is the supported Streamable HTTP transport")


        async def _ensure_legacy_unreal_mcp_session(client, target):
            """Create/reuse the single internal legacy session used behind modern MCP."""
            global MCP_LEGACY_SESSION_ID, MCP_LEGACY_SESSION_INITIALIZED
            async with MCP_LEGACY_SESSION_LOCK:
                if MCP_LEGACY_SESSION_INITIALIZED:
                    return MCP_LEGACY_SESSION_ID

                init_id = "ue58-adapter-init-" + uuid.uuid4().hex[:12]
                init_payload = {
                    "jsonrpc": "2.0", "id": init_id, "method": "initialize",
                    "params": {
                        "protocolVersion": MCP_LEGACY_PROTOCOL,
                        "capabilities": {},
                        "clientInfo": {"name": "UE58-Modern-MCP-Adapter", "version": "1.0.0"}
                    }
                }
                init_headers = {
                    "Accept": "application/json, text/event-stream",
                    "Content-Type": "application/json"
                }
                status, response_headers, raw_headers, raw, init_result, was_sse = await mcp_post_and_read(
                    client, target, init_headers, init_payload, json_body=init_payload)
                if status != 200:
                    raise RuntimeError("Unreal legacy MCP initialize HTTP %s: %s" % (
                        status, raw.decode("utf-8", errors="replace")[:1200]))
                if not isinstance(init_result, dict) or init_result.get("error") or not isinstance(init_result.get("result"), dict):
                    raise RuntimeError("Unreal legacy MCP initialize did not return a valid JSON-RPC result: %s" % str(init_result)[:1200])

                session_id = response_headers.get("mcp-session-id", "")
                notify_payload = {"jsonrpc": "2.0", "method": "notifications/initialized"}
                notify_headers = {
                    "Accept": "application/json, text/event-stream",
                    "Content-Type": "application/json",
                    "MCP-Protocol-Version": MCP_LEGACY_PROTOCOL
                }
                if session_id:
                    notify_headers["Mcp-Session-Id"] = session_id
                notify_response = await client.post(target, headers=notify_headers, json=notify_payload)
                if notify_response.status_code not in (200, 202, 204):
                    raise RuntimeError("Unreal legacy MCP initialized notification HTTP %s: %s" % (
                        notify_response.status_code, notify_response.text[:800]))

                MCP_LEGACY_SESSION_ID = session_id
                MCP_LEGACY_SESSION_INITIALIZED = True
                if session_id:
                    with MCP_SESSION_LOCK:
                        MCP_NATIVE_SESSIONS[session_id] = {"seen": time.time()}
                with MONITOR_LOCK:
                    MCP_CONNECTION["last_session_seen"] = time.time() if session_id else 0.0
                log("Modern MCP adapter established internal Unreal legacy session; session_id_present=%s" % bool(session_id))
                return session_id


        def _mcp_decode_header_value(value):
            value = str(value or "")
            if value.startswith("=?base64?") and value.endswith("?="):
                encoded = value[len("=?base64?"):-2]
                try:
                    return base64.b64decode(encoded, validate=True).decode("utf-8")
                except Exception:
                    return value
            return value


        def _normalize_modern_mcp_result(rpc_message, method):
            """Adapt legacy Unreal JSON-RPC results to the stateless MCP 2026-07-28 envelope."""
            if not isinstance(rpc_message, dict) or not isinstance(rpc_message.get("result"), dict):
                return rpc_message
            result = rpc_message["result"]
            result_meta = result.get("_meta")
            if not isinstance(result_meta, dict):
                result_meta = {}
                result["_meta"] = result_meta
            result_meta.setdefault("io.modelcontextprotocol/serverInfo", {
                "name": "UE 5.8 Remote Studio", "version": "1.0.1"
            })
            if method in ("tools/list", "resources/list", "prompts/list"):
                result.setdefault("resultType", "complete")
                result.setdefault("ttlMs", 10000)
                result.setdefault("cacheScope", "private")
            elif method == "tools/call":
                result.setdefault("resultType", "complete")
                result.setdefault("content", [])
            return rpc_message


        def _mcp_downstream_headers(raw_headers, modern_mode=False):
            """Do not leak the legacy Unreal transport session into stateless MCP 2.0."""
            hop_by_hop = {
                "connection", "keep-alive", "proxy-authenticate", "proxy-authorization",
                "te", "trailers", "transfer-encoding", "upgrade", "content-length",
                "content-encoding"
            }
            if modern_mode:
                # MCP 2026-07-28 removed protocol-level sessions. The 2025 header belongs
                # only on the private upstream request to Unreal, never on the public reply.
                hop_by_hop.update({"mcp-session-id", "mcp-protocol-version"})
            return [
                (key.lower(), value)
                for key, value in raw_headers
                if key.decode("latin1").lower() not in hop_by_hop
            ]


        async def _reset_legacy_unreal_mcp_session():
            global MCP_LEGACY_SESSION_ID, MCP_LEGACY_SESSION_INITIALIZED
            async with MCP_LEGACY_SESSION_LOCK:
                MCP_LEGACY_SESSION_ID = ""
                MCP_LEGACY_SESSION_INITIALIZED = False


        async def native_mcp_proxy(scope, receive, send):
            # Public single endpoint: POST carries MCP JSON-RPC. GET returns 405 because
            # this server does not provide server-initiated event streams.
            if scope.get("type") != "http":
                return
            raw_path = scope.get("path", "/") or "/"
            if raw_path not in ("", "/"):
                await send_mcp_json(send, {"ok": False, "error": "not_found", "path": raw_path}, status=404)
                return

            http_method = str(scope.get("method", "POST")).upper()
            if http_method == "GET":
                # Streamable HTTP permits GET to return 405 when server-initiated streams
                # are not supported. Do not leave a comment-only SSE stream hanging.
                await _serve_mcp_event_stream(scope, receive, send)
                return
            if http_method == "HEAD":
                await send({"type": "http.response.start", "status": 200,
                            "headers": [(b"content-type", b"application/json"),
                                        (b"cache-control", b"no-store"),
                                        (b"x-mcp-transport", b"streamable-http")]})
                await send({"type": "http.response.body", "body": b"", "more_body": False})
                return
            if http_method == "OPTIONS":
                await send({"type": "http.response.start", "status": 204,
                            "headers": [(b"allow", b"POST, HEAD, OPTIONS"),
                                        (b"access-control-allow-origin", b"*"),
                                        (b"access-control-allow-methods", b"POST, HEAD, OPTIONS"),
                                        (b"access-control-allow-headers", b"content-type, accept, mcp-protocol-version, mcp-session-id, mcp-method, mcp-name, last-event-id, authorization"),
                                        (b"cache-control", b"no-store")]})
                await send({"type": "http.response.body", "body": b"", "more_body": False})
                return
            if http_method != "POST":
                await send_mcp_json(send, {"ok": False, "error": "method_not_allowed",
                                           "message": "Use POST for JSON-RPC MCP requests."}, status=405,
                                    headers=[(b"allow", b"POST, HEAD, OPTIONS")])
                return

            body = bytearray()
            more = True
            while more:
                message = await receive()
                if message["type"] == "http.disconnect":
                    return
                body.extend(message.get("body", b""))
                more = message.get("more_body", False)
            query = scope.get("query_string", b"")
            target = "http://127.0.0.1:8000/mcp" + ("?" + query.decode("latin1") if query else "")
            forwarded = {}
            hop_by_hop = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "te", "trailers", "transfer-encoding", "upgrade", "host", "origin", "authorization"}
            for key, value in scope.get("headers", []):
                name = key.decode("latin1").lower()
                if name not in hop_by_hop:
                    forwarded[name] = value.decode("latin1")
            forwarded["host"] = "127.0.0.1:8000"
            forwarded["origin"] = "http://127.0.0.1:8000"
            request_obj = None
            try:
                if body:
                    request_obj = json.loads(bytes(body).decode("utf-8"))
            except Exception:
                request_obj = None
            method = request_obj.get("method", "") if isinstance(request_obj, dict) else ""
            params = request_obj.get("params", {}) if isinstance(request_obj, dict) else {}
            incoming_headers = {key.decode("latin1").lower(): value.decode("latin1") for key, value in scope.get("headers", [])}
            incoming_protocol = incoming_headers.get("mcp-protocol-version", "")
            modern_mode = incoming_protocol == MCP_MODERN_PROTOCOL or method == "server/discover"

            if modern_mode:
                request_id = request_obj.get("id") if isinstance(request_obj, dict) else None
                meta = params.get("_meta", {}) if isinstance(params, dict) else {}
                header_method = incoming_headers.get("mcp-method", "")
                header_name = _mcp_decode_header_value(incoming_headers.get("mcp-name", ""))
                body_protocol = meta.get("io.modelcontextprotocol/protocolVersion", "") if isinstance(meta, dict) else ""
                validation_error = None
                if incoming_protocol != MCP_MODERN_PROTOCOL:
                    validation_error = "MCP-Protocol-Version must be 2026-07-28."
                elif header_method != method:
                    validation_error = "Mcp-Method header must exactly match the JSON-RPC method."
                elif body_protocol != MCP_MODERN_PROTOCOL:
                    validation_error = "params._meta.io.modelcontextprotocol/protocolVersion must be 2026-07-28."
                elif method in ("tools/call", "resources/read", "prompts/get"):
                    expected_name = str(params.get("name") if method != "resources/read" else params.get("uri") or "")
                    if not header_name or header_name != expected_name:
                        validation_error = "Mcp-Name header must match params.name or params.uri."
                if validation_error:
                    error_obj = {"jsonrpc": "2.0", "id": request_id,
                                 "error": {"code": -32020, "message": "Header mismatch: " + validation_error}}
                    await send_mcp_json(send, error_obj, status=400)
                    return

                if method == "server/discover":
                    discover = {
                        "jsonrpc": "2.0", "id": request_id,
                        "result": {
                            "resultType": "complete",
                            "supportedVersions": [MCP_MODERN_PROTOCOL],
                            "capabilities": {"tools": {}},
                            "_meta": {"io.modelcontextprotocol/serverInfo": {
                                "name": "UE 5.8 Remote Studio", "version": "1.0.0"
                            }},
                            "instructions": "Controls the active Unreal Engine 5.8 editor and its project through the UE Remote Studio bridge.",
                            "ttlMs": 15000,
                            "cacheScope": "private"
                        }
                    }
                    await send_mcp_json(send, discover)
                    with MONITOR_LOCK:
                        MCP_CONNECTION["last_status"] = 200
                        MCP_CONNECTION["last_error"] = ""
                    log("Modern MCP server/discover accepted")
                    return

                # Translate the stateless 2026 request into the 2025 handshake transport
                # spoken by the Unreal 5.8 native MCP listener. Tool payloads are unchanged.
                translated = dict(request_obj)
                translated_params = dict(params) if isinstance(params, dict) else {}
                translated_params.pop("_meta", None)
                translated["params"] = translated_params
                request_obj = translated
                params = translated_params
                body = bytearray(json.dumps(request_obj, ensure_ascii=False, separators=(",", ":")).encode("utf-8"))
                # The modern request body has changed after removing _meta. Never forward
                # the original client's Content-Length/encoding framing to Unreal: doing
                # so makes HTTPX wait for bytes that will never arrive and returns 502.
                forwarded.pop("content-length", None)
                forwarded.pop("content-encoding", None)
                forwarded.pop("transfer-encoding", None)
                forwarded.pop("mcp-method", None)
                forwarded.pop("mcp-name", None)
                for header_name in list(forwarded):
                    if header_name.startswith("mcp-param-"):
                        forwarded.pop(header_name, None)
                forwarded["accept"] = "application/json, text/event-stream"
                forwarded["content-type"] = "application/json"
                forwarded["mcp-protocol-version"] = MCP_LEGACY_PROTOCOL

            incoming_session = next((value.decode("latin1") for key, value in scope.get("headers", []) if key.lower() == b"mcp-session-id"), "")
            if not modern_mode and not incoming_session and method not in ("initialize", "ping"):
                # Some MCP clients intermittently omit the session header on later calls.
                # Reuse the most recently established native session for this single-tenant
                # tunnel; the native server still validates the session id itself.
                with MCP_SESSION_LOCK:
                    active_sessions = sorted(MCP_NATIVE_SESSIONS.items(), key=lambda item: item[1].get("seen", 0), reverse=True)
                    fallback = active_sessions[0] if active_sessions and (time.time() - active_sessions[0][1].get("seen", 0) < 3600) else None
                if fallback:
                    incoming_session = fallback[0]
                    forwarded["mcp-session-id"] = incoming_session
                    with MCP_SESSION_LOCK:
                        MCP_NATIVE_SESSIONS[incoming_session] = {"seen": time.time()}
                    with MONITOR_LOCK:
                        MCP_CONNECTION["session_fallback_count"] += 1
                    log("MCP session header missing; using most-recent active session fallback")
            elif incoming_session:
                with MCP_SESSION_LOCK:
                    if incoming_session in MCP_NATIVE_SESSIONS:
                        MCP_NATIVE_SESSIONS[incoming_session] = {"seen": time.time()}
            with MONITOR_LOCK:
                MCP_CONNECTION["request_count"] += 1
                MCP_CONNECTION["last_seen"] = time.time()
                MCP_CONNECTION["last_method"] = str(method or scope.get("method", "HTTP"))
                MCP_CONNECTION["last_path"] = raw_path
                MCP_CONNECTION["last_error"] = ""
            log("MCP IN method=%s path=%s jsonrpc_id=%s" % (
                method or scope.get("method", "HTTP"), raw_path,
                request_obj.get("id", "-") if isinstance(request_obj, dict) else "-"))
            # Legacy 2025 clients receive their negotiated session/version headers.
            # Stateless 2026 clients must never receive legacy session metadata.
            local_response_headers = [] if modern_mode else [
                (key.lower(), value) for key, value in scope.get("headers", [])
                if key.lower() in (b"mcp-session-id", b"mcp-protocol-version")
            ]

            # Handle safe monitor tools locally so ChatGPT can obtain the browser link.
            if method == "tools/call" and isinstance(params, dict) and params.get("name") in ("unreal_monitor_get_url", "unreal_monitor_get_state"):
                tool_name = params.get("name")
                args = params.get("arguments") or {}
                if tool_name == "unreal_monitor_get_url":
                    result_value = {"monitor_url": monitor_public_url(), "username": MONITOR_USERNAME,
                                    "authentication": "HTTP Basic; password is the repository Actions secret MONITOR_PASSWORD",
                                    "mcp_url": (MONITOR_STATE.get("public_base_url", "").rstrip("/") + "/mcp") if MONITOR_STATE.get("public_base_url") else ""}
                else:
                    result_value = monitor_state_payload()
                    try:
                        result_value["events"] = result_value["events"][:max(1, min(20, int(args.get("limit", 20))))]
                    except Exception:
                        result_value["events"] = result_value["events"][:20]
                response_obj = {"jsonrpc": "2.0", "id": request_obj.get("id"),
                                "result": {"resultType": "complete", "content": [{"type": "text", "text": json.dumps(result_value, ensure_ascii=False, default=str)}]}}
                if modern_mode:
                    _normalize_modern_mcp_result(response_obj, "tools/call")
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            extra_tool_names = {
                "unreal_monitor_get_scene", "unreal_monitor_get_scene_status", "unreal_monitor_list_projects", "unreal_switch_project",
                "unreal_monitor_list_plugins", "unreal_monitor_set_plugin_enabled", "unreal_save_all_dirty_assets",
                "unreal_create_project_checkpoint", "unreal_package_project", "unreal_get_package_status",
                "unreal_get_system_status", "mcp_gateway_list_servers", "mcp_gateway_add_server",
                "mcp_gateway_remove_server", "mcp_gateway_list_tools", "mcp_gateway_call_tool",
                "unreal_install_plugin_from_zip", "unreal_run_headless_python",
                "unreal_get_headless_job_status", "unreal_cancel_headless_job",
                "unreal_execute_console_command"
            }
            if method == "tools/call" and isinstance(params, dict) and params.get("name") in extra_tool_names:
                tool_name = params.get("name")
                args = params.get("arguments") or {}
                event_id = monitor_event_start(tool_name, args)
                failed = False
                try:
                    value = _handle_extra_mcp_tool(tool_name, args)
                    monitor_event_finish(event_id, 200, response_preview=json.dumps(safe_monitor_value(value), ensure_ascii=False))
                except Exception as exc:
                    failed = True
                    value = {"ok": False, "error": str(exc)}
                    log("Extended MCP tool failed (%s): %s" % (tool_name, repr(exc)))
                    monitor_event_finish(event_id, 400, str(exc), json.dumps(value, ensure_ascii=False))
                response_obj = mcp_text_result(send, request_obj, value, failed)
                if modern_mode:
                    _normalize_modern_mcp_result(response_obj, "tools/call")
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            if method == "tools/call" and isinstance(params, dict) and params.get("name") == "unreal_upload_binary_file":
                args = params.get("arguments") or {}
                event_id = monitor_event_start("unreal_upload_binary_file", args)
                failed = False
                try:
                    encoded = str(args.get("content_base64") or "")
                    if len(encoded) > ((UPLOAD_SINGLE_FILE_LIMIT + 2) // 3) * 4 + 16:
                        raise ValueError("Base64 content exceeds 8 MiB; use a smaller image/file")
                    try:
                        data = base64.b64decode(encoded, validate=True)
                    except (binascii.Error, ValueError) as exc:
                        raise ValueError("content_base64 is not valid Base64: " + str(exc))
                    if len(data) > UPLOAD_SINGLE_FILE_LIMIT:
                        raise ValueError("Direct upload limit is 8 MiB")
                    target = upload_target(args.get("filename", ""), args.get("destination_folder", ""))
                    value = store_uploaded_bytes(target, data, bool(args.get("overwrite", False)))
                    monitor_event_finish(event_id, 200, response_preview=json.dumps(safe_monitor_value(value), ensure_ascii=False))
                except Exception as exc:
                    failed = True
                    value = {"ok": False, "error": str(exc)}
                    monitor_event_finish(event_id, 400, str(exc), json.dumps(value, ensure_ascii=False))
                response_obj = mcp_text_result(send, request_obj, value, failed)
                if modern_mode:
                    _normalize_modern_mcp_result(response_obj, "tools/call")
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            # Release upload tools are intentionally narrow: current repository, one existing
            # release tag, files under Uploads/Screenshots, timestamped names, size/rate limited.
            if method == "tools/call" and isinstance(params, dict) and params.get("name") in ("github_release_upload_file", "unreal_monitor_publish_latest_screenshot"):
                global RELEASE_LAST_UPLOAD_TIME
                tool_name = params.get("name")
                args = params.get("arguments") or {}
                event_id = monitor_event_start(tool_name, args)
                value, failed = None, False
                try:
                    if args.get("confirm_public_upload") is not True:
                        raise ValueError("confirm_public_upload must be true; this makes the asset publicly downloadable")
                    if not RELEASE_UPLOAD_LOCK.acquire(blocking=False):
                        raise RuntimeError("another GitHub Release upload is already running")
                    try:
                        now = time.time()
                        if now - RELEASE_LAST_UPLOAD_TIME < 60:
                            raise RuntimeError("Release uploads are rate-limited to one per minute")
                        RELEASE_LAST_UPLOAD_TIME = now
                        if str(args.get("tag") or "ue5.8") != "ue5.8":
                            raise ValueError("MCP uploads are restricted to the existing ue5.8 Release")
                        if tool_name == "unreal_monitor_publish_latest_screenshot":
                            with MONITOR_LOCK:
                                source_value = MONITOR_STATE.get("image_path")
                            if not source_value:
                                raise FileNotFoundError("no monitor screenshot has been captured yet")
                            source = safe_path(source_value)
                            stem, suffix = "UnrealViewport", ".jpg"
                        else:
                            source = safe_path(args.get("source", ""))
                            allowed_roots = [UPLOAD_ROOT, (ROOT / "Screenshots").resolve()]
                            if not any(root == source or root in source.parents for root in allowed_roots):
                                raise ValueError("source must be inside D:\\UE58\\Uploads or D:\\UE58\\Screenshots")
                            stem, suffix = source.stem, source.suffix
                        if not source.is_file():
                            raise FileNotFoundError("source file not found: " + str(source))
                        if source.stat().st_size > 100 * 1024 * 1024:
                            raise ValueError("MCP Release uploads are limited to 100 MiB per file")
                        unique = time.strftime("%Y%m%d_%H%M%S") + "_" + uuid.uuid4().hex[:6]
                        filename = stem[:80] + "_" + unique + suffix[:12]
                        value = github_release_upload(source, "ue5.8", filename)
                    finally:
                        RELEASE_UPLOAD_LOCK.release()
                    monitor_event_finish(event_id, 200, response_preview=json.dumps(safe_monitor_value(value), ensure_ascii=False))
                except Exception as exc:
                    failed = True
                    value = {"ok": False, "error": str(exc)}
                    monitor_event_finish(event_id, 400, str(exc), json.dumps(value, ensure_ascii=False))
                response_obj = mcp_text_result(send, request_obj, value, failed)
                if modern_mode:
                    _normalize_modern_mcp_result(response_obj, "tools/call")
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            event_id = None
            if method == "tools/call" and isinstance(params, dict):
                event_id = monitor_event_start(params.get("name", "unknown"), params.get("arguments", {}))

            log("MCP request: %s %s -> %s; method=%s" % (
                scope.get("method", "POST"), raw_path, target, method or "non-JSON-RPC"))
            try:
                # Bound upstream waits. The native Unreal MCP endpoint returns one
                # finite response for POST; unlimited streaming waits can leave a
                # Cloudflare request hanging until the client cancels it.
                mcp_timeout = httpx.Timeout(connect=10.0, read=90.0, write=30.0, pool=10.0)
                async with httpx.AsyncClient(timeout=mcp_timeout, trust_env=False) as client:
                    upstream_body = bytes(body)
                    if modern_mode:
                        internal_session = await _ensure_legacy_unreal_mcp_session(client, target)
                        if internal_session:
                            forwarded["mcp-session-id"] = internal_session
                    # tools/list: stop at the matching SSE event rather than waiting for EOF.
                    if method == "tools/list" and scope.get("method", "POST").upper() == "POST":
                        status, response_headers, raw_headers, raw, parsed, was_sse = await mcp_post_and_read(
                            client, target, forwarded, request_obj, content=upstream_body)
                        if modern_mode and status == 404:
                            await _reset_legacy_unreal_mcp_session()
                            internal_session = await _ensure_legacy_unreal_mcp_session(client, target)
                            if internal_session:
                                forwarded["mcp-session-id"] = internal_session
                            status, response_headers, raw_headers, raw, parsed, was_sse = await mcp_post_and_read(
                                client, target, forwarded, request_obj, content=upstream_body)
                        native_session = response_headers.get("mcp-session-id", "")
                        if native_session:
                            with MCP_SESSION_LOCK:
                                MCP_NATIVE_SESSIONS[native_session] = {"seen": time.time()}
                            with MONITOR_LOCK:
                                MCP_CONNECTION["last_session_seen"] = time.time()
                        if isinstance(parsed, dict) and isinstance(parsed.get("result"), dict) and isinstance(parsed["result"].get("tools"), list):
                            existing = {item.get("name") for item in parsed["result"]["tools"] if isinstance(item, dict)}
                            for item in monitor_mcp_tools():
                                if item["name"] not in existing:
                                    parsed["result"]["tools"].append(item)
                            if modern_mode:
                                _normalize_modern_mcp_result(parsed, "tools/list")
                            headers = _mcp_downstream_headers(raw_headers, modern_mode=modern_mode)
                            await send_mcp_json(send, parsed, headers=headers, status=status)
                            return
                        if was_sse:
                            error_obj = {"jsonrpc": "2.0", "id": request_obj.get("id") if isinstance(request_obj, dict) else None,
                                         "error": {"code": -32603, "message": "Upstream tools/list SSE had no matching JSON-RPC reply"}}
                            await send_mcp_json(send, error_obj, status=502)
                            return
                        with MONITOR_LOCK:
                            MCP_CONNECTION["last_status"] = int(status)
                            if status >= 400:
                                MCP_CONNECTION["last_error"] = "tools/list upstream HTTP %s" % status
                        log("MCP tools/list upstream response: status=%s; content-type=%s; parsed_jsonrpc=%s" % (
                            status, response_headers.get("content-type", ""), bool(parsed)))
                        out_headers = _mcp_downstream_headers(raw_headers, modern_mode=modern_mode)
                        await send({"type": "http.response.start", "status": status, "headers": out_headers})
                        await send({"type": "http.response.body", "body": raw, "more_body": False})
                        return

                    if modern_mode:
                        status, response_headers_obj, raw_headers, raw, parsed, was_sse = await mcp_post_and_read(
                            client, target, forwarded, request_obj, content=upstream_body)
                        if method == "tools/call" and status == 404:
                            await _reset_legacy_unreal_mcp_session()
                            internal_session = await _ensure_legacy_unreal_mcp_session(client, target)
                            if internal_session:
                                forwarded["mcp-session-id"] = internal_session
                            status, response_headers_obj, raw_headers, raw, parsed, was_sse = await mcp_post_and_read(
                                client, target, forwarded, request_obj, content=upstream_body)
                        response_headers = _mcp_downstream_headers(raw_headers, modern_mode=True)
                        if isinstance(parsed, dict):
                            _normalize_modern_mcp_result(parsed, method)
                            await send_mcp_json(send, parsed, headers=response_headers, status=status)
                        elif was_sse:
                            error_obj = {"jsonrpc": "2.0", "id": request_obj.get("id") if isinstance(request_obj, dict) else None,
                                         "error": {"code": -32603, "message": "Upstream modern MCP SSE had no matching JSON-RPC reply"}}
                            await send_mcp_json(send, error_obj, headers=response_headers, status=502)
                        else:
                            await send({"type": "http.response.start", "status": status, "headers": response_headers})
                            await send({"type": "http.response.body", "body": raw, "more_body": False})
                        if event_id:
                            monitor_event_finish(event_id, status,
                                                 response_preview=monitor_response_preview(raw[:12000]))
                        return

                    async with client.stream(scope.get("method", "POST"), target, headers=forwarded, content=upstream_body) as response:
                        # Return on the matching SSE JSON-RPC event instead of reading
                        # the entire (potentially persistent) event stream to EOF.
                        response_body, parsed_response, was_sse = await read_mcp_http_reply(response, request_obj)
                        response_headers = [(k.lower(), v) for k, v in response.headers.raw
                                            if k.decode("latin1").lower() not in hop_by_hop]
                        if was_sse and not isinstance(parsed_response, dict):
                            raise RuntimeError("Unreal MCP SSE response was not a JSON-RPC object")
                        session_id = response.headers.get("mcp-session-id", "")
                        if session_id:
                            with MCP_SESSION_LOCK:
                                MCP_NATIVE_SESSIONS[session_id] = {"seen": time.time()}
                                cutoff = time.time() - 3600
                                for old_session, row in list(MCP_NATIVE_SESSIONS.items()):
                                    if row.get("seen", 0) < cutoff:
                                        MCP_NATIVE_SESSIONS.pop(old_session, None)
                                if len(MCP_NATIVE_SESSIONS) > 50:
                                    oldest = sorted(MCP_NATIVE_SESSIONS.items(), key=lambda item: item[1].get("seen", 0))[:-50]
                                    for old_session, _ in oldest:
                                        MCP_NATIVE_SESSIONS.pop(old_session, None)
                            with MONITOR_LOCK:
                                MCP_CONNECTION["last_session_seen"] = time.time()
                        elif method == "initialize":
                            log("MCP initialize response did not include Mcp-Session-Id header")
                        if method == "initialize" and response.status_code == 200:
                            global MCP_LEGACY_SESSION_ID, MCP_LEGACY_SESSION_INITIALIZED
                            MCP_LEGACY_SESSION_ID = session_id
                            MCP_LEGACY_SESSION_INITIALIZED = True
                        with MONITOR_LOCK:
                            MCP_CONNECTION["last_status"] = int(response.status_code)
                            if response.status_code >= 400:
                                MCP_CONNECTION["last_error"] = "Upstream MCP HTTP %s" % response.status_code
                        log("MCP upstream response: status=%s; content-type=%s; protocol-version=%s; session-id-present=%s" % (
                            response.status_code, response.headers.get("content-type", ""),
                            response.headers.get("mcp-protocol-version", ""), bool(session_id)))
                        if was_sse:
                            await send_mcp_json(send, parsed_response, headers=response_headers, status=response.status_code)
                        else:
                            await send({"type": "http.response.start", "status": response.status_code, "headers": response_headers})
                            await send({"type": "http.response.body", "body": response_body, "more_body": False})
                        if event_id:
                            monitor_event_finish(event_id, response.status_code,
                                                 response_preview=monitor_response_preview(response_body[:12000]))
            except Exception as exc:
                with MONITOR_LOCK:
                    MCP_CONNECTION["last_status"] = 502
                    MCP_CONNECTION["last_error"] = str(exc)[:500]
                if event_id:
                    monitor_event_finish(event_id, 502, repr(exc))
                log("Native MCP proxy error: %s: %s" % (type(exc).__name__, str(exc)[:1200]))
                err = json.dumps({"ok": False, "error": "native_mcp_proxy_failed",
                                  "detail": type(exc).__name__ + ": " + str(exc)[:600]}, separators=(",", ":")).encode("utf-8")
                await send({"type": "http.response.start", "status": 502,
                            "headers": [(b"content-type", b"application/json; charset=utf-8"), (b"content-length", str(len(err)).encode())]})
                await send({"type": "http.response.body", "body": err})

        # One public MCP endpoint: /mcp (with / as a compatibility alias) proxies Unreal's native AllToolsets server
        # and adds monitor tools plus guarded Release upload tools to tools/list.
        # REST fallback endpoints remain available under the same tunnel host and use Basic auth.
        # Keep Flask/REST as the fallback app, but dispatch MCP paths BEFORE Starlette
        # routing. This avoids Mount slash-normalization differences that can send
        # /mcp or /mcp/ to Flask and produce the observed public HTTP 404.
        combined_app = Starlette(routes=[
            Mount("/", app=WSGIMiddleware(app))
        ], lifespan=lifespan)

        async def public_app(scope, receive, send):
            if scope.get("type") == "http":
                request_path = scope.get("path", "/") or "/"
                # Canonical endpoint is /mcp. Also accept the domain root as a safe
                # compatibility alias in case a client setup form drops the path.
                # /health and /monitor remain routed to the Flask REST application.
                if request_path in ("", "/") or request_path == "/mcp" or request_path.startswith("/mcp/"):
                    mcp_scope = dict(scope)
                    if request_path.startswith("/mcp"):
                        remainder = request_path[len("/mcp"): ]
                    else:
                        remainder = "/"
                    mcp_scope["path"] = remainder or "/"
                    await native_mcp_proxy(mcp_scope, receive, send)
                    return
            await combined_app(scope, receive, send)

        if __name__ == "__main__":
            if not BRIDGE_TOKEN: raise RuntimeError("BRIDGE_TOKEN must be set")
            if not MONITOR_PASSWORD: raise RuntimeError("MONITOR_PASSWORD must be configured")
            log("Starting REST API on 127.0.0.1:8765; monitor uses HTTP Basic; single MCP endpoint=/mcp -> native Unreal AllToolsets + monitor/file/Release tools")
            uvicorn.run(public_app, host="127.0.0.1", port=8765, log_level="info")

        '@
        Set-Content -LiteralPath "$root\api_server.py" -Value $api -Encoding utf8
        Write-Host 'Created UE project, bridge, and API server.'
    - name: Validate generated Python scripts
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        try { Start-Transcript -Path 'D:\UE58\Logs\workflow-validation-transcript.log' -Append -Force | Out-Null } catch { }
        $python = (Get-Command python).Source
        & $python -m py_compile 'D:\UE58\api_server.py' 'D:\UE58\UEControl\Content\Python\init_unreal.py'
        if ($LASTEXITCODE -ne 0) { throw 'Generated Python scripts failed syntax validation.' }
        Write-Host 'PYTHON_SYNTAX_VALIDATION=true'
    - name: Launch API, Unreal and Cloudflare tunnel
      shell: pwsh
      env:
        GG_UE_TOKEN: ${{ secrets.GG_UE_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
      run: |-
        $ErrorActionPreference = 'Stop'
        $root = 'D:\UE58'
        try { Start-Transcript -Path "$root\Logs\workflow-runtime-transcript.log" -Append -Force | Out-Null } catch { }
        $env:UE_ROOT = $root
        $env:UE_PYTHONPATH = "$root\UEControl\Content\Python"
        if ([string]::IsNullOrWhiteSpace($env:MONITOR_PASSWORD) -or $env:MONITOR_PASSWORD.Length -lt 16) {
          throw 'Create repository Actions secret MONITOR_PASSWORD with a strong password of at least 16 characters before running this workflow.'
        }
        if ([string]::IsNullOrWhiteSpace($env:GG_UE_TOKEN)) {
          Write-Warning 'GG_UE_TOKEN is empty; Google Drive endpoints will fail until authorized_user.json or service-account JSON is saved as this Actions secret.'
        }

        # The bridge token is only for local API <-> Unreal communication.
        $env:BRIDGE_TOKEN = [guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')
        $python = (Get-Command python).Source
        & $python -m pip install --disable-pip-version-check --upgrade Flask google-api-python-client google-auth google-auth-httplib2 requests urllib3 httpx Pillow psutil "mcp>=2,<3" uvicorn starlette
        if ($LASTEXITCODE -ne 0) { throw 'Python package installation failed.' }

        $apiOut = "$root\Logs\api-stdout.log"
        $apiErr = "$root\Logs\api-stderr.log"
        $apiProc = Start-Process -FilePath $python -ArgumentList @("$root\api_server.py") -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput $apiOut -RedirectStandardError $apiErr
        Write-Host "API_PID=$($apiProc.Id)"

        $localReady = $false
        for ($i = 0; $i -lt 45; $i++) {
          Start-Sleep -Seconds 2
          try {
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4
            if ($health.ok) { $localReady = $true; break }
          } catch { }
          if ($apiProc.HasExited) { break }
        }
        if (-not $localReady) {
          if (Test-Path $apiErr) { Get-Content $apiErr -Tail 100 }
          if (Test-Path $apiOut) { Get-Content $apiOut -Tail 100 }
          throw 'Local API did not start.'
        }
        Write-Host 'API_LOCAL_READY=true'

        # API already inherited the Drive and GitHub credentials when it started.
        # Keep only the local bridge token available to the Unreal child process.
        $env:GG_UE_TOKEN = $null
        $env:GITHUB_TOKEN = $null
        $env:GITHUB_REPOSITORY = $null
        $env:MONITOR_PASSWORD = $null

        $editor = $env:UE_EDITOR_EXE
        if ([string]::IsNullOrWhiteSpace($editor) -or -not (Test-Path -LiteralPath $editor)) {
          throw 'UE_EDITOR_EXE was not found from the extraction step.'
        }
        $engineDir = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $editor))
        $gltfPlugin = Join-Path $engineDir 'Plugins\Enterprise\GLTFExporter\GLTFExporter.uplugin'
        if (-not (Test-Path -LiteralPath $gltfPlugin)) { throw "Unreal GLTFExporter plugin was not found: $gltfPlugin" }
        Write-Host 'GLTF_EXPORTER_PLUGIN_FOUND=true'
        Write-Host "Unreal Editor found: $editor"
        $ueOut = "$root\Logs\unreal-stdout.log"
        $ueErr = "$root\Logs\unreal-stderr.log"
        $initScript = "$root\UEControl\Content\Python\init_unreal.py"
        if (-not (Test-Path -LiteralPath $initScript)) { throw "Unreal bridge startup script was not found: $initScript" }
        # IMPORTANT: do NOT pass -ExecutePythonScript here. Epic documents that
        # the Editor closes after a command-line ExecutePythonScript finishes.
        # Content/Python/init_unreal.py is auto-detected and run by the Editor.
        $ueArgs = @("$root\UEControl\UEControl.uproject", '-log', '-stdout', '-FullStdOutLogOutput', '-AllowSoftwareRendering', '-d3d11', '-ModelContextProtocolStartServer', '-ModelContextProtocolPort=8000', '-ExecCmds="py D:/UE58/UEControl/Content/Python/init_unreal.py"')
        $ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory "$root\UEControl" -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError $ueErr
        Write-Host "UNREAL_PID=$($ueProc.Id)"

        $cloudflared = "$root\cloudflared.exe"
        Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $cloudflared
        $cfOut = "$root\Logs\cloudflared-stdout.log"
        $cfErr = "$root\Logs\cloudflared-stderr.log"
        $cfProc = Start-Process -FilePath $cloudflared -ArgumentList @('tunnel', '--url', 'http://127.0.0.1:8765', '--no-autoupdate') -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput $cfOut -RedirectStandardError $cfErr

        # Extract ONLY the hostname from cloudflared output. Never build request
        # URIs from an untrimmed log line: ANSI escapes/CRLF can make .NET Uri parsing
        # fail with 'Invalid URI: The hostname could not be parsed'.
        $publicUri = $null
        $publicUrl = $null
        for ($i = 0; $i -lt 90; $i++) {
          Start-Sleep -Seconds 2
          $combined = ''
          foreach ($f in @($cfOut, $cfErr)) {
            if (Test-Path $f) { try { $combined += "`n" + (Get-Content $f -Raw -ErrorAction SilentlyContinue) } catch { } }
          }
          $match = [regex]::Match($combined, '(?i)https://(?<host>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.trycloudflare\.com)')
          if ($match.Success) {
            $tunnelHost = ([string]$match.Groups['host'].Value).Trim().TrimEnd('.').ToLowerInvariant()
            $candidateUri = $null
            if ([System.Uri]::TryCreate(('https://' + $tunnelHost + '/'), [System.UriKind]::Absolute, [ref]$candidateUri) -and
                $candidateUri.Scheme -eq 'https' -and $candidateUri.Host -eq $tunnelHost -and
                $candidateUri.Host.EndsWith('.trycloudflare.com')) {
              $publicUri = $candidateUri
              $publicUrl = $candidateUri.GetLeftPart([System.UriPartial]::Authority)
              break
            }
            Write-Host ("Ignoring malformed Quick Tunnel hostname: [{0}]" -f $tunnelHost)
          }
          if ($cfProc.HasExited) { break }
        }
        if (-not $publicUri -or -not $publicUrl) {
          if (Test-Path $cfErr) { Get-Content $cfErr -Tail 100 }
          throw 'Cloudflare Quick Tunnel did not provide a valid HTTPS *.trycloudflare.com hostname.'
        }
        Write-Host "PUBLIC_API_URL=$publicUrl"
        Write-Host ("PUBLIC_API_URI_VALID=true HOST={0}" -f $publicUri.DnsSafeHost)
        Write-Host 'Waiting a maximum of 180 seconds for an authenticated Unreal Python bridge heartbeat...'
        $bridgeReady = $false
        $bridgeTimer = [System.Diagnostics.Stopwatch]::StartNew()
        $lastBridgeReport = -15
        $lastBridgeProbeError = ''
        while ($bridgeTimer.Elapsed.TotalSeconds -lt 180) {
          if ($ueProc.HasExited) {
            Write-Warning 'Unreal Editor exited before the Python bridge connected.'
            break
          }
          try {
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 2
            if ($health.bridge_connected) {
              $bridgeReady = $true
              break
            }
            $lastBridgeProbeError = 'API is responding, but no authenticated bridge heartbeat has arrived.'
          } catch {
            $lastBridgeProbeError = $_.Exception.Message
          }
          if ([int][Math]::Floor($bridgeTimer.Elapsed.TotalSeconds) -ge ($lastBridgeReport + 15)) {
            $lastBridgeReport = [int][Math]::Floor($bridgeTimer.Elapsed.TotalSeconds)
            Write-Host ("BRIDGE_WAIT elapsed={0}s editor_exited={1} status={2}" -f $lastBridgeReport, $ueProc.HasExited, $lastBridgeProbeError)
          }
          Start-Sleep -Milliseconds 1000
        }
        $bridgeTimer.Stop()
        if ($bridgeReady) {
          Write-Host 'BRIDGE_READY=true'
        } else {
          Write-Host '--- Bridge diagnostics ---'
          foreach ($diagnosticFile in @(
            "$root\Logs\unreal_bridge.log",
            "$root\Logs\api.log",
            $ueOut,
            $ueErr
          )) {
            if ($diagnosticFile -and (Test-Path -LiteralPath $diagnosticFile)) {
              Write-Host "--- $diagnosticFile (last 80 lines) ---"
              Get-Content -LiteralPath $diagnosticFile -Tail 80 -ErrorAction SilentlyContinue
            }
          }
          $projectLog = Get-ChildItem -LiteralPath "$root\UEControl\Saved\Logs" -Filter '*.log' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($projectLog) {
            Write-Host "--- $($projectLog.FullName) (last 100 lines) ---"
            Get-Content -LiteralPath $projectLog.FullName -Tail 100 -ErrorAction SilentlyContinue
          }
          if ($ueProc.HasExited) {
            throw "BRIDGE_READY=false: Unreal Editor exited with code $($ueProc.ExitCode). Diagnostic logs are printed above."
          }
          throw "BRIDGE_READY=false after $([int]$bridgeTimer.Elapsed.TotalSeconds) seconds. The startup script did not establish an authenticated bridge connection. Diagnostic logs are printed above."
        }

        # Confirm Epic's native MCP listener is alive before publishing the endpoint.
        # Unreal documents GET /mcp returning HTTP 405 as a valid liveness response.
        $nativeMcpReady = $false
        for ($i = 0; $i -lt 45; $i++) {
          try {
            $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp' -Method Get -TimeoutSec 4 -UseBasicParsing
            if ([int]$probe.StatusCode -eq 405) { $nativeMcpReady = $true; break }
            Write-Host ("Native MCP GET probe returned HTTP {0}" -f [int]$probe.StatusCode)
          } catch {
            $status = $null
            try { $status = [int]$_.Exception.Response.StatusCode } catch { }
            if ($status -eq 405) { $nativeMcpReady = $true; break }
            if ($status) { Write-Host ("Native MCP GET probe returned HTTP {0}" -f $status) }
          }
          if ($ueProc.HasExited) { break }
          Start-Sleep -Seconds 2
        }
        if ($nativeMcpReady) {
          Write-Host 'NATIVE_MCP_LISTENER_READY=true (GET /mcp returned expected HTTP 405).'
        } else {
          throw 'NATIVE_MCP_LISTENER_READY=false. Do not add the MCP URL in ChatGPT yet; inspect UEControl\Saved\Logs\UnrealEditor.log and unreal-stdout.log for LogModelContextProtocol errors.'
        }

        # End-to-end public MCP test. A local GET/405 only proves the Unreal listener
        # exists; it does NOT prove ChatGPT can reach the public Cloudflare endpoint.
        # First wait for Cloudflare edge propagation and test the public health route.
        $healthUriBuilder = [System.UriBuilder]::new($publicUri)
        $healthUriBuilder.Path = '/health'
        $healthUriBuilder.Query = ''
        $healthUriBuilder.Fragment = ''
        $publicHealthUri = $healthUriBuilder.Uri
        if (-not $publicHealthUri.IsAbsoluteUri -or $publicHealthUri.Host -ne $publicUri.Host) {
          throw 'PUBLIC_HEALTH_URI_INVALID: failed to construct a valid public health URI from the Quick Tunnel hostname.'
        }
        $publicHealthReady = $false
        $publicHealthError = ''
        for ($i = 0; $i -lt 20; $i++) {
          try {
            $publicHealth = Invoke-RestMethod -Uri $publicHealthUri -TimeoutSec 12
            if ($publicHealth.ok) { $publicHealthReady = $true; break }
            $publicHealthError = 'Public /health returned ok=false.'
          } catch {
            $publicHealthError = $_.Exception.Message
          }
          if ($cfProc.HasExited) { throw 'Cloudflare tunnel exited during public health test; inspect cloudflared-stderr.log.' }
          Start-Sleep -Seconds 3
        }
        if (-not $publicHealthReady) {
          if (Test-Path $cfErr) { Write-Host '--- cloudflared stderr (tail) ---'; Get-Content $cfErr -Tail 60 }
          throw "PUBLIC_TUNNEL_HEALTH_FAILED: $publicHealthError. The URL must not be added to ChatGPT until this passes."
        }
        Write-Host 'PUBLIC_TUNNEL_HEALTH_OK=true'

        # Verify both the current stateless MCP protocol and legacy 2025 handshake compatibility through the public HTTPS URL.
        # Public Starlette mount is /mcp/; upstream Unreal listener remains /mcp. No OAuth or bearer token is used.
        # Build the MCP URL from the already validated System.Uri object. This
        # prevents PowerShell/.NET from parsing raw cloudflared console text as a URI.
        $mcpUriBuilder = [System.UriBuilder]::new($publicUri)
        $mcpUriBuilder.Path = '/mcp'
        $mcpUriBuilder.Query = ''
        $mcpUriBuilder.Fragment = ''
        $mcpEndpointUri = $mcpUriBuilder.Uri
        if (-not $mcpEndpointUri.IsAbsoluteUri -or $mcpEndpointUri.Scheme -ne 'https' -or
            $mcpEndpointUri.Host -ne $publicUri.Host -or $mcpEndpointUri.AbsolutePath -ne '/mcp') {
          throw 'PUBLIC_MCP_URI_INVALID: failed to construct a valid HTTPS /mcp URI.'
        }
        $mcpEndpoint = $mcpEndpointUri.AbsoluteUri
        Write-Host ("PUBLIC_MCP_URI_VALID=true URI={0}" -f $mcpEndpoint)

        # Streamable HTTP GET is optional. This server intentionally does not
        # offer server-initiated streams, so GET returns 405 quickly. POST is
        # the actual initialize/tools/call transport used by MCP clients.
        try {
          $getProbe = Invoke-WebRequest -Uri $mcpEndpointUri -Method Get -TimeoutSec 15 -UseBasicParsing
          throw ("GET probe unexpectedly returned HTTP {0}; expected 405." -f [int]$getProbe.StatusCode)
        } catch {
          $getStatus = $null
          try { $getStatus = [int]$_.Exception.Response.StatusCode } catch { }
          if ($getStatus -ne 405) { throw ("PUBLIC_MCP_GET_CHECK_FAILED: expected 405, got [{0}]. {1}" -f $getStatus, $_.Exception.Message) }
          Write-Host 'PUBLIC_MCP_GET_METHOD_NOT_SUPPORTED_OK=true STATUS=405'
        }
        $mcpAccept = 'application/json, text/event-stream'
        $initializePayload = @{
          jsonrpc = '2.0'
          id = 'ue58-public-connectivity-initialize'
          method = 'initialize'
          params = @{
            protocolVersion = '2025-11-25'
            capabilities = @{}
            clientInfo = @{ name = 'ue58-workflow-connectivity-check'; version = '1.0.0' }
          }
        } | ConvertTo-Json -Depth 12 -Compress
        try {
          $initializeResponse = Invoke-WebRequest -Uri $mcpEndpointUri -Method Post -Headers @{ Accept = $mcpAccept } -ContentType 'application/json' -Body $initializePayload -TimeoutSec 30 -UseBasicParsing
          if ([int]$initializeResponse.StatusCode -ne 200) { throw "MCP initialize returned HTTP $([int]$initializeResponse.StatusCode)." }
          $initializeJson = $initializeResponse.Content | ConvertFrom-Json -ErrorAction Stop
          if ($initializeJson.error) { throw ("MCP initialize JSON-RPC error: " + ($initializeJson.error | ConvertTo-Json -Compress -Depth 8)) }
          if (-not $initializeJson.result -or -not $initializeJson.result.protocolVersion) { throw 'MCP initialize response has no result.protocolVersion.' }
          $negotiatedProtocol = [string]$initializeJson.result.protocolVersion
          $mcpSessionId = [string]$initializeResponse.Headers['Mcp-Session-Id']
          Write-Host ("PUBLIC_MCP_INITIALIZE_OK=true PROTOCOL={0} SESSION_HEADER={1}" -f $negotiatedProtocol, [bool]$mcpSessionId)

          # Confirm tools/list works over the same public route and session.
          $listHeaders = @{ Accept = $mcpAccept; 'MCP-Protocol-Version' = $negotiatedProtocol }
          if ($mcpSessionId) { $listHeaders['Mcp-Session-Id'] = $mcpSessionId }
          $listPayload = @{ jsonrpc = '2.0'; id = 'ue58-public-connectivity-tools'; method = 'tools/list'; params = @{} } | ConvertTo-Json -Depth 8 -Compress
          $toolsResponse = Invoke-WebRequest -Uri $mcpEndpointUri -Method Post -Headers $listHeaders -ContentType 'application/json' -Body $listPayload -TimeoutSec 30 -UseBasicParsing
          if ([int]$toolsResponse.StatusCode -ne 200) { throw "MCP tools/list returned HTTP $([int]$toolsResponse.StatusCode)." }
          $toolsJson = $toolsResponse.Content | ConvertFrom-Json -ErrorAction Stop
          if ($toolsJson.error) { throw ("MCP tools/list JSON-RPC error: " + ($toolsJson.error | ConvertTo-Json -Compress -Depth 8)) }
          $toolCount = @($toolsJson.result.tools).Count
          if ($toolCount -lt 1) { throw 'MCP tools/list returned no tools.' }
                  Write-Host ("PUBLIC_MCP_LEGACY_TOOLS_LIST_OK=true TOOL_COUNT={0}" -f $toolCount)

                  # Current MCP generation: stateless protocol, server/discover, and
                  # required per-request metadata headers. The API adapter translates
                  # these requests to the legacy protocol exposed by Unreal 5.8.
                  $modernMeta = @{
                    'io.modelcontextprotocol/protocolVersion' = '2026-07-28'
                    'io.modelcontextprotocol/clientInfo' = @{ name = 'ue58-workflow-modern-connectivity-check'; version = '1.0.0' }
                    'io.modelcontextprotocol/clientCapabilities' = @{}
                  }
                  $modernBaseHeaders = @{
                    Accept = $mcpAccept
                    'MCP-Protocol-Version' = '2026-07-28'
                  }
                  $discoverPayload = @{
                    jsonrpc = '2.0'; id = 'ue58-modern-discover'; method = 'server/discover';
                    params = @{ _meta = $modernMeta }
                  } | ConvertTo-Json -Depth 12 -Compress
                  $discoverHeaders = $modernBaseHeaders.Clone()
                  $discoverHeaders['Mcp-Method'] = 'server/discover'
                  $discoverResponse = Invoke-WebRequest -Uri $mcpEndpointUri -Method Post -Headers $discoverHeaders -ContentType 'application/json' -Body $discoverPayload -TimeoutSec 30 -UseBasicParsing
                  if ([int]$discoverResponse.StatusCode -ne 200) { throw "Modern MCP server/discover returned HTTP $([int]$discoverResponse.StatusCode)." }
                  $discoverJson = $discoverResponse.Content | ConvertFrom-Json -ErrorAction Stop
                  if ($discoverJson.error) { throw ("Modern MCP discover JSON-RPC error: " + ($discoverJson.error | ConvertTo-Json -Compress -Depth 8)) }
                  if ($discoverJson.result.resultType -ne 'complete' -or @($discoverJson.result.supportedVersions) -notcontains '2026-07-28' -or -not $discoverJson.result.capabilities.tools) {
                    throw 'Modern MCP server/discover response is missing the required protocol version or tools capability.'
                  }
                  Write-Host 'PUBLIC_MCP_MODERN_DISCOVER_OK=true PROTOCOL=2026-07-28'

                  $modernListPayload = @{
                    jsonrpc = '2.0'; id = 'ue58-modern-tools-list'; method = 'tools/list';
                    params = @{ _meta = $modernMeta }
                  } | ConvertTo-Json -Depth 12 -Compress
                  $modernListHeaders = $modernBaseHeaders.Clone()
                  $modernListHeaders['Mcp-Method'] = 'tools/list'
                  $modernToolsResponse = Invoke-WebRequest -Uri $mcpEndpointUri -Method Post -Headers $modernListHeaders -ContentType 'application/json' -Body $modernListPayload -TimeoutSec 45 -UseBasicParsing
                  if ([int]$modernToolsResponse.StatusCode -ne 200) { throw "Modern MCP tools/list returned HTTP $([int]$modernToolsResponse.StatusCode)." }
                  $modernToolsJson = $modernToolsResponse.Content | ConvertFrom-Json -ErrorAction Stop
                  if ($modernToolsJson.error) { throw ("Modern MCP tools/list JSON-RPC error: " + ($modernToolsJson.error | ConvertTo-Json -Compress -Depth 8)) }
                  $modernToolCount = @($modernToolsJson.result.tools).Count
                  if ($modernToolCount -lt 1) { throw 'Modern MCP tools/list returned no tools.' }
                  Write-Host ("PUBLIC_MCP_MODERN_TOOLS_LIST_OK=true TOOL_COUNT={0}" -f $modernToolCount)

                  # Exercise a harmless read-only modern tools/call, not just discovery.
                  $modernCallPayload = @{
                    jsonrpc = '2.0'; id = 'ue58-modern-safe-tool-call'; method = 'tools/call';
                    params = @{ name = 'unreal_monitor_get_state'; arguments = @{ limit = 1 }; _meta = $modernMeta }
                  } | ConvertTo-Json -Depth 12 -Compress
                  $modernCallHeaders = $modernBaseHeaders.Clone()
                  $modernCallHeaders['Mcp-Method'] = 'tools/call'
                  $modernCallHeaders['Mcp-Name'] = 'unreal_monitor_get_state'
                  $modernCallResponse = Invoke-WebRequest -Uri $mcpEndpointUri -Method Post -Headers $modernCallHeaders -ContentType 'application/json' -Body $modernCallPayload -TimeoutSec 30 -UseBasicParsing
                  if ([int]$modernCallResponse.StatusCode -ne 200) { throw "Modern MCP tools/call returned HTTP $([int]$modernCallResponse.StatusCode)." }
                  $modernCallJson = $modernCallResponse.Content | ConvertFrom-Json -ErrorAction Stop
                  if ($modernCallJson.error -or -not $modernCallJson.result.content) { throw 'Modern MCP safe tools/call did not return a valid tool result.' }
                  Write-Host 'PUBLIC_MCP_MODERN_TOOLS_CALL_OK=true'
                } catch {
          $mcpFailure = $_.Exception.Message
          try {
            $response = $_.Exception.Response
            if ($response -and $response.GetResponseStream()) {
              $reader = New-Object System.IO.StreamReader($response.GetResponseStream())
              $responseBody = $reader.ReadToEnd()
              $reader.Dispose()
              if ($responseBody) { $mcpFailure += " | response: " + $responseBody.Substring(0, [Math]::Min(1500, $responseBody.Length)) }
            }
          } catch { }
          if (Test-Path $cfErr) { Write-Host '--- cloudflared stderr (tail) ---'; Get-Content $cfErr -Tail 40 }
          foreach ($diagnosticFile in @($apiErr, $apiOut, "$root\Logs\api.log", "$root\Logs\unreal-stdout.log", "$root\Logs\unreal-stderr.log")) {
            if ($diagnosticFile -and (Test-Path -LiteralPath $diagnosticFile)) {
              Write-Host "--- $diagnosticFile (last 100 lines) ---"
              Get-Content -LiteralPath $diagnosticFile -Tail 100 -ErrorAction SilentlyContinue
            }
          }
          $diagnosticProjectLog = Get-ChildItem -LiteralPath "$root\UEControl\Saved\Logs" -Filter '*.log' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($diagnosticProjectLog) {
            Write-Host "--- $($diagnosticProjectLog.FullName) (last 100 lines) ---"
            Get-Content -LiteralPath $diagnosticProjectLog.FullName -Tail 100 -ErrorAction SilentlyContinue
          }
          throw "PUBLIC_MCP_HANDSHAKE_FAILED: $mcpFailure. Proxy/API and Unreal diagnostics were printed above."
        }
        Write-Host 'PUBLIC_MCP_ENDPOINT_READY=true PROTOCOL=2026-07-28 LEGACY_COMPATIBILITY=true'

        $internalHeaders = @{ Authorization = "Bearer $env:BRIDGE_TOKEN" }
        # Reserve CPU capacity for the runner/API and start the first monitor snapshot.
        # The affinity limit is reversible from the Monitor > System panel.
        try {
          $cpuBody = @{ percent = 75 } | ConvertTo-Json -Compress
          $cpuBalance = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/internal/system/optimize-cpu' -Method Post -Headers $internalHeaders -ContentType 'application/json' -Body $cpuBody -TimeoutSec 15
          Write-Host ("UNREAL_CPU_HEADROOM=true CORES={0}/{1}" -f $cpuBalance.affinity.Count, $cpuBalance.logical_cpus)
        } catch {
          Write-Warning ("Could not apply reversible Unreal CPU headroom: " + $_.Exception.Message)
        }
        try {
          $captureKick = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/internal/monitor/initial-capture' -Method Post -Headers $internalHeaders -ContentType 'application/json' -Body '{}' -TimeoutSec 10
          Write-Host ("MONITOR_INITIAL_CAPTURE={0}" -f $captureKick.status)
        } catch {
          Write-Warning ("Initial monitor capture will retry when the monitor page opens: " + $_.Exception.Message)
        }
        $urlBody = @{ public_url = $publicUrl } | ConvertTo-Json -Compress
        $urlRegistration = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/internal/set-public-url' -Method Post -Headers $internalHeaders -ContentType 'application/json' -Body $urlBody -TimeoutSec 10
        if (-not $urlRegistration.ok) { throw 'Could not register the public monitor URL with the API.' }
        $monitorUrl = "$publicUrl/monitor"
        Write-Host "MONITOR_URL=$monitorUrl"
        Write-Host 'MONITOR_USERNAME=viewer'
        Write-Host 'MONITOR_PASSWORD is stored only in the repository Actions secret MONITOR_PASSWORD.'
        $summaryText = @"
        ## Unreal Live Monitor
        - [Open read-only monitor]($monitorUrl)
        - **MCP endpoint for ChatGPT (No authentication):** $mcpEndpoint
        - Use the exact MCP endpoint above; do not paste the monitor URL or the bare PUBLIC_API_URL.
        - The Quick Tunnel URL is temporary and works only while this Actions workflow and cloudflared process remain running.
        - Monitor username: viewer
        - Monitor password: repository secret MONITOR_PASSWORD
        - GitHub Release upload: available inside the authenticated monitor; default tag: ue5.8.
        "@
        $summaryText | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

        Write-Host 'REST endpoints: GET /health; authenticated read-only monitor at GET /monitor; authenticated file, Drive, GitHub Release, project and unified logs endpoints.'
        Write-Host "MCP_ENDPOINT=$mcpEndpoint"
        Write-Host "MCP_ENDPOINT_COPY=$mcpEndpoint"
        Write-Host "MCP_CONNECTOR_AUTH=No authentication"
        Write-Host 'IMPORTANT: In ChatGPT Connection, paste the current MCP_ENDPOINT_COPY exactly. Keep /mcp; remove any trailing slash. Do not reuse a trycloudflare.com URL from an older workflow run.'
        Write-Host 'Single MCP endpoint only: /mcp -> native Unreal AllToolsets plus monitor, binary-upload and guarded GitHub Release tools. No second MCP URL.'
        Write-Host 'Bridge startup: Python StartupScripts plus -ExecCmds py fallback; duplicate initialization is guarded. No -ExecutePythonScript is used.'
        Write-Host 'Binary transfer: unreal_upload_binary_file accepts files up to 8 MiB per MCP call; place larger files under D:\UE58\Uploads through the authenticated API before publishing them.'
        Write-Host 'Monitor uses 5-second JSON polling and 640x360 JPEG snapshots after MCP tool calls; no VNC, desktop stream, WebSocket, or SSE.'
        Write-Host 'MCP tool list includes Unreal AllToolsets, live arbitrary Editor Python, console commands, headless UnrealEditor-Cmd Python commandlets (-nullrhi), scene/project/plugin management, save/checkpoint/restore, packaging, Windows metrics, file transfer, GitHub Release and external MCP gateway tools.'
        Write-Host 'MCP transport: Streamable HTTP over HTTPS; POST carries JSON-RPC. GET returns 405 because server-initiated event streams are not offered; upstream single-message SSE POST replies are normalized to JSON-RPC JSON.'
        Write-Host 'Monitor includes Logs, full-fidelity Unreal GLB scene viewer (real meshes and supported materials), orbit/pan/pinch/zoom, project switching, plugin ZIP installation/toggles, save/checkpoint/restore, Win64 Shipping packaging, system metrics and remote MCP gateway.'
        Write-Warning 'SECURITY: the monitor and REST endpoints are password-protected, but /mcp is intentionally unauthenticated for ChatGPT. Anyone who obtains the MCP URL may issue Unreal commands. Do not share the MCP URL; stop the workflow when finished.'

        $lastHeartbeat = Get-Date
        $activeProjectFile = "$root\UEControl\UEControl.uproject"
        $editorCommandFile = "$root\control\editor-command.json"
        while ($true) {
          Start-Sleep -Seconds 5
          if ($apiProc.HasExited) { throw 'API server stopped; inspect D:\UE58\Logs\api-stderr.log.' }
          if ($cfProc.HasExited) { throw 'Cloudflare tunnel stopped; inspect D:\UE58\Logs\cloudflared-stderr.log.' }

          # Run one queued headless Unreal Python commandlet. The API writes this
          # request only after validating the project/script paths and, when needed,
          # saving the live Editor session through its authenticated Python bridge.
          $headlessCommandFile = "$root\control\headless-command.json"
          if (Test-Path -LiteralPath $headlessCommandFile) {
            $headlessCmd = $null
            $headlessStatusPath = $null
            try {
              $headlessCmd = Get-Content -LiteralPath $headlessCommandFile -Raw | ConvertFrom-Json
              $rootPrefix = [System.IO.Path]::GetFullPath($root) + [System.IO.Path]::DirectorySeparatorChar
              $headlessRoot = [System.IO.Path]::GetFullPath("$root\HeadlessJobs") + [System.IO.Path]::DirectorySeparatorChar
              $targetProject = [System.IO.Path]::GetFullPath([string]$headlessCmd.project_file)
              $scriptPath = [System.IO.Path]::GetFullPath([string]$headlessCmd.script_file)
              $headlessStatusPath = [System.IO.Path]::GetFullPath([string]$headlessCmd.status_file)
              $stdoutPath = [System.IO.Path]::GetFullPath([string]$headlessCmd.stdout_log)
              $stderrPath = [System.IO.Path]::GetFullPath([string]$headlessCmd.stderr_log)
              if (-not $targetProject.StartsWith($rootPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or -not $targetProject.EndsWith('.uproject', [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $targetProject)) { throw 'Headless project path is invalid or outside D:\UE58.' }
              foreach ($path in @($scriptPath,$headlessStatusPath,$stdoutPath,$stderrPath)) {
                if (-not $path.StartsWith($headlessRoot, [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Headless job files must stay inside D:\UE58\HeadlessJobs.' }
              }
              if (-not (Test-Path -LiteralPath $scriptPath)) { throw 'Headless Python script was not found.' }
              $jobDir = Split-Path -Parent $scriptPath
              $cancelFlag = Join-Path $jobDir 'cancel-requested.flag'
              $cmdExe = Join-Path (Split-Path -Parent $editor) 'UnrealEditor-Cmd.exe'
              if (-not (Test-Path -LiteralPath $cmdExe)) { throw "UnrealEditor-Cmd.exe not found beside $editor." }
              $timeoutSeconds = [Math]::Max(30, [Math]::Min(7200, [int]$headlessCmd.timeout_seconds))
              $stoppedEditor = $false
              $resumeProject = [System.IO.Path]::GetFullPath([string]$headlessCmd.resume_project_file)
              if ($headlessCmd.stop_editor -eq $true) {
                if ($ueProc -and -not $ueProc.HasExited) {
                  Write-Host 'HEADLESS: stopping the live Editor after the API saved dirty packages.'
                  Stop-Process -Id $ueProc.Id -Force -ErrorAction SilentlyContinue
                  $ueProc.WaitForExit(20000) | Out-Null
                  $stoppedEditor = $true
                  $ueProc = $null
                }
              }
              $status = [ordered]@{
                ok = $true; job_id = [string]$headlessCmd.job_id; status = 'running'
                project_file = $targetProject; script_file = $scriptPath
                stdout_log = $stdoutPath; stderr_log = $stderrPath
                created_at = $headlessCmd.created_at; started_at = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
                finished_at = $null; exit_code = $null; pid = $null
                headless = $true; renderer = 'nullrhi'; editor_stopped = $stoppedEditor
                editor_restarted = $false; editor_restart_warning = ''
                timeout_seconds = $timeoutSeconds; error = ''
              }
              $status | ConvertTo-Json -Depth 8 | ForEach-Object { [System.IO.File]::WriteAllText($headlessStatusPath + '.tmp', $_, [System.Text.UTF8Encoding]::new($false)) }
              Move-Item -LiteralPath ($headlessStatusPath + '.tmp') -Destination $headlessStatusPath -Force
              $headlessArgs = @($targetProject, '-run=pythonscript', ('-script="' + $scriptPath + '"'), '-unattended', '-nop4', '-nosplash', '-nosound', '-nullrhi', '-stdout', '-FullStdOutLogOutput', '-UTF8Output')
              Write-Host ("HEADLESS_START job={0} project={1} exe={2}" -f $headlessCmd.job_id, $targetProject, $cmdExe)
              $headlessProc = Start-Process -FilePath $cmdExe -ArgumentList $headlessArgs -WorkingDirectory (Split-Path -Parent $targetProject) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
              $status.pid = $headlessProc.Id
              $null = $headlessProc.WaitForExit(1)
              $deadline = (Get-Date).AddSeconds($timeoutSeconds)
              $cancelled = $false
              $timedOut = $false
              while (-not $headlessProc.HasExited) {
                if (Test-Path -LiteralPath $cancelFlag) {
                  $cancelled = $true
                  Stop-Process -Id $headlessProc.Id -Force -ErrorAction SilentlyContinue
                  $headlessProc.WaitForExit(10000) | Out-Null
                  break
                }
                if ((Get-Date) -ge $deadline) {
                  $timedOut = $true
                  Stop-Process -Id $headlessProc.Id -Force -ErrorAction SilentlyContinue
                  $headlessProc.WaitForExit(10000) | Out-Null
                  break
                }
                $null = $headlessProc.WaitForExit(1000)
              }
              $exitCode = $null
              try { if ($headlessProc.HasExited) { $exitCode = [int]$headlessProc.ExitCode } } catch { }
              if ($cancelled) { $status.status = 'cancelled'; $status.error = 'Cancellation requested; commandlet process was stopped.' }
              elseif ($timedOut) { $status.status = 'timed_out'; $status.error = "Headless script exceeded $timeoutSeconds seconds and was terminated." }
              elseif ($exitCode -eq 0) { $status.status = 'completed' }
              else { $status.status = 'failed'; $status.error = "UnrealEditor-Cmd.exe exited with code $exitCode." }
              $status.exit_code = $exitCode
              $status.finished_at = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
              if ($stoppedEditor -and $headlessCmd.resume_editor -eq $true) {
                try {
                  if (-not (Test-Path -LiteralPath $resumeProject)) { throw "Saved Editor project for resume not found: $resumeProject" }
                  $stamp = Get-Date -Format 'yyyyMMdd_HHmmss'
                  $ueOut = "$root\Logs\unreal-resume-after-headless-$stamp-stdout.log"
                  $ueErr = "$root\Logs\unreal-resume-after-headless-$stamp-stderr.log"
                  $ueArgs = @($resumeProject, '-log', '-stdout', '-FullStdOutLogOutput', '-AllowSoftwareRendering', '-d3d11', '-ModelContextProtocolStartServer', '-ModelContextProtocolPort=8000', '-ExecCmds="py D:/UE58/UEControl/Content/Python/init_unreal.py"')
                  $ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory (Split-Path -Parent $resumeProject) -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError $ueErr
                  $activeProjectFile = $resumeProject
                  $resumeBridgeReady = $false
                  for ($i = 0; $i -lt 90; $i++) {
                    Start-Sleep -Seconds 2
                    try { $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4; if ($health.bridge_connected) { $resumeBridgeReady = $true; break } } catch { }
                    if ($ueProc.HasExited) { break }
                  }
                  if (-not $resumeBridgeReady) { throw "Editor restarted but bridge did not reconnect. Inspect $ueOut and $ueErr." }
                  $resumeMcpReady = $false
                  for ($i = 0; $i -lt 45; $i++) {
                    try { $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp' -Method Get -TimeoutSec 4 -UseBasicParsing; if ([int]$probe.StatusCode -eq 405) { $resumeMcpReady = $true; break } } catch { try { if ([int]$_.Exception.Response.StatusCode -eq 405) { $resumeMcpReady = $true; break } } catch { } }
                    Start-Sleep -Seconds 2
                    if ($ueProc.HasExited) { break }
                  }
                  if (-not $resumeMcpReady) { throw 'Editor restarted and Bridge connected, but native MCP did not return the expected HTTP 405.' }
                  $status.editor_restarted = $true
                } catch {
                  $status.editor_restart_warning = $_.Exception.Message
                  Write-Warning ("HEADLESS_EDITOR_RESUME_WARNING: " + $status.editor_restart_warning)
                }
              }
              $status | ConvertTo-Json -Depth 8 | ForEach-Object { [System.IO.File]::WriteAllText($headlessStatusPath + '.tmp', $_, [System.Text.UTF8Encoding]::new($false)) }
              Move-Item -LiteralPath ($headlessStatusPath + '.tmp') -Destination $headlessStatusPath -Force
              Write-Host ("HEADLESS_FINISHED job={0} status={1} exit_code={2} editor_restarted={3}" -f $headlessCmd.job_id, $status.status, $status.exit_code, $status.editor_restarted)
            } catch {
              Write-Error ("Headless commandlet supervisor failed: " + $_)
              if ($headlessStatusPath -and (Test-Path -LiteralPath $headlessStatusPath)) {
                try {
                  $failedStatus = Get-Content -LiteralPath $headlessStatusPath -Raw | ConvertFrom-Json
                  $failedStatus.status = 'failed'
                  $failedStatus.error = $_.Exception.Message
                  $failedStatus.finished_at = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
                  $failedStatus | ConvertTo-Json -Depth 8 | ForEach-Object { [System.IO.File]::WriteAllText($headlessStatusPath + '.tmp', $_, [System.Text.UTF8Encoding]::new($false)) }
                  Move-Item -LiteralPath ($headlessStatusPath + '.tmp') -Destination $headlessStatusPath -Force
                } catch { }
              }
            } finally {
              Remove-Item -LiteralPath $headlessCommandFile -Force -ErrorAction SilentlyContinue
            }
          }

          # A project switch, plugin change or checkpoint restore is handled here.
          if (Test-Path -LiteralPath $editorCommandFile) {
            try {
              $cmd = Get-Content -LiteralPath $editorCommandFile -Raw | ConvertFrom-Json
              $targetProject = [System.IO.Path]::GetFullPath([string]$cmd.project_file)
              $rootPrefix = [System.IO.Path]::GetFullPath($root) + [System.IO.Path]::DirectorySeparatorChar
              if (-not $targetProject.StartsWith($rootPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $targetProject)) { throw 'Restart request project is outside D:\UE58 or missing.' }
              Write-Host ("Editor restart command received: {0} -> {1}" -f $cmd.action, $targetProject)
              if ($ueProc -and -not $ueProc.HasExited) { Stop-Process -Id $ueProc.Id -Force -ErrorAction SilentlyContinue; $ueProc.WaitForExit(15000) | Out-Null }
              $projectDir = Split-Path -Parent $targetProject
              if ($cmd.action -eq 'restore_checkpoint') {
                $zipPath = [System.IO.Path]::GetFullPath([string]$cmd.checkpoint)
                $backupPrefix = [System.IO.Path]::GetFullPath("$root\Backups") + [System.IO.Path]::DirectorySeparatorChar
                if (-not $zipPath.StartsWith($backupPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $zipPath)) { throw 'Checkpoint restore path is invalid.' }
                Expand-Archive -LiteralPath $zipPath -DestinationPath $projectDir -Force
                Write-Host "CHECKPOINT_RESTORED=$zipPath"
              }
              Remove-Item -LiteralPath $editorCommandFile -Force -ErrorAction SilentlyContinue
              $stamp = Get-Date -Format 'yyyyMMdd_HHmmss'
              $ueOut = "$root\Logs\unreal-$stamp-stdout.log"
              $ueErr = "$root\Logs\unreal-$stamp-stderr.log"
              $ueArgs = @($targetProject, '-log', '-stdout', '-FullStdOutLogOutput', '-AllowSoftwareRendering', '-d3d11', '-ModelContextProtocolStartServer', '-ModelContextProtocolPort=8000', '-ExecCmds="py D:/UE58/UEControl/Content/Python/init_unreal.py"')
              $ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory $projectDir -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError $ueErr
              $activeProjectFile = $targetProject
              Write-Host "UNREAL_RESTARTED_PID=$($ueProc.Id) PROJECT=$activeProjectFile"
              $restartedBridge = $false
              for ($i = 0; $i -lt 90; $i++) {
                Start-Sleep -Seconds 2
                try { $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4; if ($h.bridge_connected) { $restartedBridge = $true; break } } catch { }
                if ($ueProc.HasExited) { break }
              }
              if (-not $restartedBridge) { throw "Bridge did not reconnect after project restart. Inspect $ueOut and $ueErr." }
              $restartedMcp = $false
              for ($i = 0; $i -lt 45; $i++) {
                try { $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp' -Method Get -TimeoutSec 4 -UseBasicParsing; if ([int]$probe.StatusCode -eq 405) { $restartedMcp = $true; break } } catch { try { if ([int]$_.Exception.Response.StatusCode -eq 405) { $restartedMcp = $true; break } } catch { } }
                Start-Sleep -Seconds 2
              }
              if (-not $restartedMcp) { throw 'Native MCP did not return HTTP 405 after restart.' }
              Write-Host 'PROJECT_RESTART_BRIDGE_READY=true NATIVE_MCP_LISTENER_READY=true'
            } catch {
              Write-Error ("Editor restart handler failed: " + $_)
              if (Test-Path -LiteralPath $editorCommandFile) { Remove-Item -LiteralPath $editorCommandFile -Force -ErrorAction SilentlyContinue }
              throw
            }
          }

          if ($ueProc -and $ueProc.HasExited) { throw "Unreal Editor stopped with exit code $($ueProc.ExitCode); inspect $ueOut, $ueErr and the active project's Saved\Logs folder." }
          if (((Get-Date) - $lastHeartbeat).TotalMinutes -ge 30) {
            try {
              $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4
              Write-Host ("Heartbeat {0}: API_OK={1} BRIDGE_CONNECTED={2}" -f (Get-Date), $h.ok, $h.bridge_connected)
            } catch { Write-Warning ("Heartbeat {0}: local health check failed." -f (Get-Date)) }
            $lastHeartbeat = Get-Date
          }
        }
