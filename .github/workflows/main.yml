        $bytes = [Convert]::FromBase64String(($payload -replace '\s', ''))
        $inputStream = [IO.MemoryStream]::new($bytes)
        $gzipStream = [IO.Compression.GzipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
        $reader = [IO.StreamReader]::new($gzipStream, [Text.Encoding]::UTF8)
        try { $scriptText = $reader.ReadToEnd() } finally { $reader.Dispose(); $inputStream.Dispose() }
        Invoke-Expression $scriptText
    - name: Validate generated Python scripts
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        try { Start-Transcript -Path 'D:\UE58\Logs\workflow-validation-transcript.log' -Append -Force | Out-Null } catch { }
        $python = (Get-Command python).Source
        & $python -m py_compile 'D:\UE58\api_server.py' 'D:\UE58\UEControl\Content\Python\init_unreal.py'
        if ($LASTEXITCODE -ne 0) { throw 'Generated Python scripts failed syntax validation.' }
        $apiText = Get-Content -LiteralPath 'D:\UE58\api_server.py' -Raw -Encoding utf8
        if ($apiText -notmatch 'BLUEPRINT_AUTOCREATE_IF_MISSING' -or $apiText -notmatch 'AssetToolsHelpers' -or $apiText -notmatch 'EditorAssetLibrary\.make_directory' -or $apiText -notmatch 'BLUEPRINT_ASSET_CREATED') {
          throw 'BLUEPRINT_AUTOCREATE_VALIDATION_FAILED: safe Blueprint search/create/save verification is missing.'
        }
        if ($apiText -notmatch '(?m)^\s{8}mcp_timeout\s*=\s*httpx\.Timeout\(connect=10\.0, read=120\.0, write=60\.0, pool=15\.0\)\s*$') {
          throw 'MCP_TIMEOUT_ASSIGNMENT_INVALID: mcp_timeout must be a standalone executable Python line, not part of a comment.'
        }
        if ($apiText -notmatch 'async def public_app' -or $apiText -notmatch 'canonical_request_path') {
          throw 'PUBLIC_MCP_ROUTER_INVALID: /mcp public ASGI dispatcher was not generated.'
        }
        if ($apiText -notmatch 'def _headless_wait_for_editor_save' -or $apiText -notmatch 'wait_unreal_job\(save_job_id, 25\)' -or $apiText -notmatch 'waiting_for_editor_save') {
          throw 'HEADLESS_ASYNC_SAVE_INVALID: pending Editor saves must complete in the background before commandlet dispatch.'
        }
        # Validate the actual implementation instead of requiring obsolete comment text.
        # The SSE reader must parse a complete JSON-RPC data line before stream EOF,
        # including a final data line that has not received its newline yet.
        if ($apiText -notmatch 'async def read_mcp_http_reply\(' -or
            $apiText -notmatch 'async for chunk in response\.aiter_text\(\):' -or
            $apiText -notmatch 'candidate_line = line_buffer\.rstrip' -or
            $apiText -notmatch 'if candidate_line\.startswith\(''data:''\):' -or
            $apiText -notmatch 'async def mcp_post_and_read\(') {
          throw 'MCP_STREAM_READER_INVALID: immediate SSE parsing of complete and unfinished data lines is required.'
        }
        # Initialized notifications must inspect HTTP status/headers and close the
        # stream without waiting for a response body that may never arrive.
        if ($apiText -notmatch 'notify_status = notify\.status_code' -or
            $apiText -notmatch 'notify_content_type = notify\.headers\.get\(''content-type'', ''''\)' -or
            $apiText -notmatch 'if notify_status not in \(200, 202, 204\):') {
          throw 'MCP_NOTIFICATION_READER_INVALID: notification handling must validate HTTP metadata without waiting for a body.'
        }
        Write-Host 'MCP_STREAM_READER_VALIDATION=true'

        # Native C++/Windows thread-stack access: ProcDump creates a read-only snapshot,
        # then CDB emits every thread's native stack from the dump. No live attach/kill.
        if (-not (Test-Path -LiteralPath $env:UE58_PROCDUMP) -or -not (Test-Path -LiteralPath $env:UE58_CDB)) {
          throw 'NATIVE_THREAD_DEBUGGER_TOOLS_MISSING: ProcDump and CDB must be installed before the API starts.'
        }
        if ($apiText -notmatch 'def _thread_stack_capture_worker' -or
            $apiText -notmatch 'def _get_thread_stack_capture_status' -or
            $apiText -notmatch "@app.post\('/api/diagnostics/thread-stacks'\)" -or
            $apiText -notmatch 'unreal_get_thread_stack_traces' -or
            $apiText -notmatch '~\* kv' -or $apiText -notmatch '!uniqstack' -or $apiText -notmatch '!analyze -hang' -or $apiText -notmatch '!analyze -v6' -or $apiText -notmatch '!locks') {
          throw 'NATIVE_THREAD_STACKTRACE_FEATURE_MISSING: CDB must analyze all native Unreal threads and expose a pollable MCP tool.'
        }
        $nativeBridgeText = Get-Content -LiteralPath 'D:\UE58\UEControl\Content\Python\init_unreal.py' -Raw -Encoding utf8
        if ($nativeBridgeText -notmatch 'PYTHON_THREAD_MAP_BEGIN' -or $nativeBridgeText -notmatch 'native_id') {
          throw 'PYTHON_THREAD_ID_MAP_MISSING: faulthandler snapshots must include Python thread names and native thread IDs.'
        }
        if ($apiText -notmatch 'returncode != 0' -or $apiText -notmatch "b'MDMP'" -or $apiText -notmatch 'PROCDUMP_NONZERO_EXIT_BUT_VALID_DUMP') {
          throw 'PROCDUMP_VALID_DUMP_HANDLING_INVALID: a valid MDMP must be analyzed even when ProcDump returns a nonzero exit code.'
        }
        if ($apiText -notmatch 'UE58_NATIVE_THREAD_STACKS_BEGIN' -or $apiText -notmatch '~\* kv' -or $apiText -notmatch '!uniqstack' -or $apiText -notmatch '!analyze -hang') {
          throw 'CDB_STACK_EXTRACTION_INVALID: all-thread native stacks and hang analysis are required.'
        }
        Write-Host 'NATIVE_THREAD_STACKTRACE_VALIDATION=true'
        Write-Host 'PYTHON_NATIVE_THREAD_MAP_VALIDATION=true'
        Write-Host 'MCP_NOTIFICATION_NONBLOCKING_VALIDATION=true'
        if ($apiText -notmatch 'def _three_d_export_worker' -or $apiText -notmatch 'USE_MESH_DATA' -or $apiText -notmatch 'GLTFMaterialBakeMode' -or $apiText -notmatch 'bake_material_inputs' -or $apiText -notmatch 'MATERIAL_OR_EXPORT_WARNING' -or $apiText -notmatch 'material_count' -or $apiText -notmatch 'texture_count') {
          throw 'THREE_D_MATERIAL_BAKING_INVALID: 3D Export must enable compatible material baking and validate exported material/texture references.'
        }
        if ($apiText -notmatch 'async function apiRetry' -or $apiText -notmatch 'threeDStatusFailures' -or $apiText -notmatch 'automatic retry continues' -or $apiText -notmatch 'threeDStatusBusy') {
          throw 'THREE_D_STATUS_RETRY_INVALID: temporary status fetch errors must preserve the last confirmed progress and retry without cancelling export.'
        }
        if (-not $apiText.Contains("max(int(row.get('progress') or 0)")) {
          throw 'THREE_D_PROGRESS_REGRESSION_INVALID: progress must not move backwards between export and packaging stages.'
        }
        Write-Host 'THREE_D_MATERIAL_BAKING_VALIDATION=true'
        Write-Host 'THREE_D_STATUS_RETRY_VALIDATION=true'
        Write-Host 'THREE_D_MONOTONIC_PROGRESS_VALIDATION=true'
        $bridgeText = Get-Content -LiteralPath 'D:\UE58\UEControl\Content\Python\init_unreal.py' -Raw -Encoding utf8
        if ($apiText -notmatch 'class LocalBridgeHandler' -or $apiText -notmatch 'ThreadingHTTPServer' -or $apiText -notmatch 'DEDICATED_LOCAL_BRIDGE_READY') {
          throw 'DEDICATED_BRIDGE_VALIDATION_FAILED: isolated localhost listener was not generated.'
        }
        if (-not $bridgeText.Contains('8766') -or -not $bridgeText.Contains('OUTGOING.put(payload)')) {
          throw 'BRIDGE_CLIENT_VALIDATION_FAILED: client must use isolated listener and retry undelivered results.'
        }
        if ($bridgeText -notmatch '(?m)^\s{4}def request_json\(') {
          throw 'BRIDGE_REQUEST_JSON_MISSING: authenticated HTTP helper must be defined at bridge module scope.'
        }
        if ($bridgeText -notmatch 'HTTPConnection\(API_HOST, API_PORT, timeout=timeout\)' -or
            $bridgeText -notmatch "'Connection': 'close'" -and $bridgeText -notmatch '"Connection": "close"' -or
            $bridgeText -match 'API_CONNECTION\s*=') {
          throw 'BRIDGE_SOCKET_LIFECYCLE_INVALID: every poll must use a fresh closed HTTP socket, not a shared stale handle.'
        }
        if ($bridgeText -notmatch 'for _ in range\(8\)' -or $bridgeText -notmatch 'Posting execution result failed; queued for retry') {
          throw 'BRIDGE_RESULT_QUEUE_STARVATION_INVALID: a failed result POST must not starve the heartbeat poll.'
        }
        if ($bridgeText -notmatch 'PREVIEW_GEOMETRY_NEXT_TRY_AT' -or $bridgeText -notmatch 'retry_seconds = min\(60\.0') {
          throw 'PREVIEW_TREE_RETRY_THROTTLE_MISSING: a failed tree setup must not run every Slate frame.'
        }
        if ($bridgeText -notmatch 'IDLE_AFTER_SECONDS\s*=\s*15\.0' -or $bridgeText -notmatch 'def set_editor_power_mode' -or $bridgeText -notmatch 'editor_set_viewport_realtime') {
          throw 'EDITOR_IDLE_POWER_MODE_MISSING: automatic idle/active viewport switching was not generated.'
        }
        if ($bridgeText -notmatch 't\.MaxFPS %d' -or $bridgeText -notmatch 'Slate\.bAllowThrottling 1') {
          throw 'EDITOR_IDLE_THROTTLE_MISSING: frame-rate and Slate throttling controls are required.'
        }
        $editorSettingsText = Get-Content -LiteralPath 'D:\UE58\UEControl\Config\DefaultEditorSettings.ini' -Raw -Encoding utf8
        if ($editorSettingsText -notmatch 'bThrottleCPUWhenNotForeground=True' -or $editorSettingsText -notmatch 'bDisableRealtimeViewportsInRemoteSessions=True') {
          throw 'EDITOR_PERFORMANCE_SETTINGS_MISSING: remote/background viewport throttling defaults were not generated.'
        }
        if ($apiText -notmatch 'MCP_NATIVE_TOOL_ACTIVE' -or $apiText -notmatch 'editor_busy=editor_busy' -or $bridgeText -notmatch 'REMOTE_TOOL_ACTIVE') {
          throw 'NATIVE_MCP_WAKE_VALIDATION_FAILED: native AllToolsets calls must wake the Editor power mode.'
        }
        Write-Host 'NATIVE_MCP_WAKE_VALIDATION=true'
        Write-Host 'EDITOR_IDLE_POWER_MODE_VALIDATION=true'
        Write-Host 'DEDICATED_BRIDGE_VALIDATION=true'
        if ($apiText -notmatch 'def editor_tick_age_seconds' -or $apiText -notmatch 'unreal_editor_not_responsive') {
          throw 'EDITOR_HEARTBEAT_VALIDATION_FAILED: API must verify the actual Unreal Editor tick, not only the bridge network worker.'
        }
        if ($apiText -notmatch 'JOB_STATE_DIR' -or $apiText -notmatch 'def _persist_editor_job_state' -or
            $apiText -notmatch "'recovered_from_disk': True" -or $apiText -notmatch "'dispatched'") {
          throw 'EDITOR_JOB_PERSISTENCE_MISSING: job receipts/results must survive an API process restart.'
        }
        if ($apiText -notmatch 'BLUEPRINT_SAVE_PACKAGE_CLEAN=true' -or $apiText -notmatch 'get_dirty_content_packages') {
          throw 'BLUEPRINT_DIRTY_STATE_VERIFY_MISSING: successful Blueprint save must also verify its package is no longer dirty.'
        }
        if ($bridgeText -notmatch 'editor_tick_at' -or $bridgeText -notmatch 'EDITOR_TICK_AT = time.time\(\)') {
          throw 'EDITOR_TICK_VALIDATION_FAILED: bridge must report a live Slate Editor tick.'
        }
        if ($bridgeText -notmatch 'def ensure_network_worker\(' -or $bridgeText -notmatch 'def diagnostic_watchdog\(' -or $bridgeText -notmatch 'faulthandler.dump_traceback' -or $bridgeText -notmatch 'BRIDGE_NETWORK_WORKER_RESTARTED') {
          throw 'BRIDGE_SELF_HEAL_OR_STACKTRACE_MISSING: the bridge must restart a dead network worker and capture Python thread stacks when the Editor stalls.'
        }
        if ($apiText -notmatch 'get_dirty_map_packages' -or $apiText -notmatch 'get_dirty_content_packages' -or $apiText -notmatch 'save_packages\(packages, True\)') {
          throw 'TARGETED_SAVE_VALIDATION_FAILED: save must target only dirty map/content packages.'
        }
        if ($apiText -match 'save_dirty_packages\(True, True\)') {
          throw 'BROAD_SAVE_VALIDATION_FAILED: obsolete broad save call remains.'
        }
        Write-Host 'PYTHON_SYNTAX_VALIDATION=true'
        Write-Host 'MCP_PROXY_STATIC_VALIDATION=true'
        Write-Host 'EDITOR_TICK_VALIDATION=true'
        Write-Host 'TARGETED_SAVE_VALIDATION=true'
        $setupText = Get-Content -LiteralPath 'D:\UE58\UEControl\Config\DefaultGame.ini' -Raw -Encoding utf8
        if ($setupText -notmatch 'PrimaryAssetType="GameFeatureData"' -or $setupText -notmatch '/Script/GameFeatures.GameFeatureData') {
          throw 'GAMEFEATUREDATA_ASSET_MANAGER_RULE_MISSING: DefaultGame.ini must register GameFeatureData.'
        }
        if ($bridgeText -match 'UE58 Preview Ground' -or $bridgeText -match 'UE58 Preview Cube') {
          throw 'ENGINE_MAP_PREVIEW_INJECTION_FOUND: preview actors must not be spawned into /Engine/Maps/Entry.'
        }
        if ($bridgeText -notmatch 'new_blank_map\(True\)' -or $bridgeText -notmatch 'save_map\(world, map_asset\)' -or $bridgeText -notmatch 'PROJECT_TREE_MAP_READY') {
          throw 'PROJECT_TREE_MAP_VALIDATION_FAILED: live Editor must create/save the project-owned tree map.'
        }
        if ($apiText -notmatch 'unreal_create_plugin_tree_test_map' -or $apiText -notmatch 'confirm_create') {
          throw 'LIVE_TREE_MAP_MCP_TOOL_MISSING: explicit non-headless map repair tool is required.'
        }
        Write-Host 'GAMEFEATUREDATA_ASSET_MANAGER_VALIDATION=true'
        Write-Host 'PROJECT_TREE_MAP_VALIDATION=true'
        Write-Host 'LIVE_TREE_MAP_MCP_TOOL_VALIDATION=true'

        if ($apiText -notmatch 'def bridge_state_payload' -or $apiText -notmatch "state, message = \('busy'" -or $apiText -notmatch 'active_editor_jobs' -or $apiText -notmatch 'EDITOR_PYTHON_JOB_STALE_SECONDS') {
          throw 'BRIDGE_BUSY_DIAGNOSTICS_INVALID: distinguish running jobs, stale jobs and an offline Bridge.'
        }
        if ($apiText -notmatch 'def cancel_active_editor_jobs' -or $apiText -notmatch 'cancelled_python_jobs') {
          throw 'BRIDGE_STALE_JOB_RECOVERY_MISSING: confirmed restart must release waiting API jobs.'
        }
        if ($apiText -notmatch 'MCP_NATIVE_TOOL_ACTIVE' -or $apiText -notmatch 'native_mcp_tool_active') {
          throw 'BRIDGE_NATIVE_TOOL_BUSY_VALIDATION_FAILED: native AllToolsets operations must be classified as busy, not offline.'
        }
        if ($apiText -notmatch "@app.post\('/api/bridge/restart'\)" -or $apiText -notmatch "restart_editor") {
          throw 'BRIDGE_RECOVERY_ENDPOINT_MISSING: explicit save-aware Editor/Bridge restart is required.'
        }
        if ($apiText -notmatch "@app.get\('/api/projects/preflight'\)" -or $apiText -notmatch 'def _project_preflight' -or $apiText -notmatch 'GLTFExporter') {
          throw 'PROJECT_PREFLIGHT_MISSING: export must check project, engine and required plugin files before starting.'
        }
        if ($apiText -notmatch "@app.post\('/api/projects/create'\)" -or $apiText -notmatch 'def _create_new_project' -or $apiText -notmatch 'confirm_create') {
          throw 'CREATE_PROJECT_OPTION_MISSING: create-project route and guarded confirmation are required.'
        }
        if ($apiText -notmatch 'threeDProjectSelect' -or $apiText -notmatch 'threeDCreateProjectBtn' -or $apiText -notmatch 'threeDRestartBridgeBtn' -or $apiText -notmatch 'project_file:project') {
          throw 'THREE_D_PROJECT_SELECTOR_UI_MISSING: project selection, create and Bridge recovery must be visible in 3D Export.'
        }
        if ($apiText -notmatch 'project_file.*project_name' -or $apiText -notmatch 'Selected project is not currently open') {
          throw 'THREE_D_PROJECT_IDENTITY_INVALID: export jobs must be tied to the exact selected project.'
        }
        if ($apiText -notmatch 'Project changed after export was queued' -or $apiText -notmatch 'project_local' -and $apiText -notmatch 'startup_script') {
          throw 'THREE_D_PROJECT_GUARD_INVALID: queued exports must recheck the selected project and each project must have its own Bridge startup script.'
        }
        if ($apiText -notmatch 'section_index \+ 1, startup_line' -or $apiText -notmatch 'PythonScriptPlugin.PythonScriptPluginSettings') {
          throw 'PROJECT_STARTUP_CONFIG_INVALID: StartupScripts must be written inside PythonScriptPlugin settings.'
        }
        if ($apiText -notmatch 'BLUEPRINT_EXPLORER_FEATURE_MARKERS' -or $apiText -notmatch 'bpConnected=false' -or $apiText -notmatch 'write_graph_dsl' -or $apiText -notmatch 'Send / Apply Changes' -or $apiText -notmatch 'bpLogOutput' -or $apiText -notmatch 'BLUEPRINT_TOOL_SEARCH_DISPATCH_MARKERS') {
          throw 'BLUEPRINT_EXPLORER_VALIDATION_FAILED: explicit offline state, staged graph apply and logs are required.'
        }
        if ($apiText -notmatch 'BLUEPRINT_PROJECT_SELECTOR_FEATURE_MARKERS' -or $apiText -notmatch 'def _project_files\(' -or $apiText -notmatch 'project_root=str\(ROOT\)' -or $apiText -notmatch '@app\.get\(''/api/projects''\)') {
          throw 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION_FAILED: project discovery must scan the configured D:\\UE58 root and expose it to the Blueprint UI.'
        }
        if ($apiText -notmatch 'def api_fs_read' -or $apiText -notmatch 'def api_fs_write' -or $apiText -notmatch 'content_base64' -or $apiText -notmatch 'def _fs_atomic_write') {
          throw 'FILE_MANAGER_READ_WRITE_VALIDATION_FAILED: byte-safe file read and atomic file write routes are required.'
        }
        if ($apiText -notmatch 'def api_fs_move' -or $apiText -notmatch 'def _fs_move_paths' -or $apiText -notmatch 'file_manager_move_paths') {
          throw 'FILE_MANAGER_MOVE_VALIDATION_FAILED: safe move operation is required.'
        }
        if ($apiText -notmatch 'file_manager_read_file' -or $apiText -notmatch 'file_manager_write_file' -or $apiText -notmatch 'file_manager_create_folder' -or $apiText -notmatch 'unreal_save_blueprint_asset' -or $apiText -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true') {
          throw 'FILE_MANAGER_MCP_OR_BLUEPRINT_SAVE_VALIDATION_FAILED: read/write/folder MCP tools and disk-verified Blueprint save are required.'
        }
        $blueprintSaveRouteCount = [regex]::Matches($apiText, '(?m)^def api_blueprint_save\(').Count
        if ($blueprintSaveRouteCount -ne 1 -or $apiText -notmatch 'def api_blueprint_save_status' -or
            $apiText -notmatch 'EditorLoadingAndSavingUtils.save_packages' -or
            $apiText -notmatch 'SAVE_PACKAGES_BEGIN' -or $apiText -notmatch 'SAVE_PACKAGES_END' -or
            $apiText -notmatch 'BLUEPRINT_SAVE_PHASE=' -or $apiText -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true') {
          throw 'BLUEPRINT_DISK_SAVE_ENDPOINT_MISSING: one targeted save route, package-save begin/end markers, disk verification and phase diagnostics are required.'
        }
        $startupConfig = Get-Content -LiteralPath 'D:\UE58\UEControl\Config\DefaultEngine.ini' -Raw -Encoding utf8
        if ($startupConfig -notmatch '(?m)^\+StartupScripts=D:/UE58/UEControl/Content/Python/init_unreal\.py$') {
          throw 'BRIDGE_STARTUP_CONFIG_MISSING: the Python Bridge must be loaded once through PythonScriptPlugin StartupScripts.'
        }
        Write-Host 'BRIDGE_RECOVERY_PERSISTENCE_VALIDATION=true'
        Write-Host 'BRIDGE_ONE_SHOT_SOCKET_VALIDATION=true'
        Write-Host 'BRIDGE_HEARTBEAT_NONSTARVING_VALIDATION=true'
        Write-Host 'BLUEPRINT_EXPLORER_VALIDATION=true'
        Write-Host 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION=true'
        Write-Host 'THREE_D_GITHUB_RELEASE_VALIDATION=true'
        Write-Host 'BRIDGE_BUSY_DIAGNOSTICS_VALIDATION=true'
        Write-Host 'BRIDGE_RECOVERY_ENDPOINT_VALIDATION=true'
        Write-Host 'PROJECT_PREFLIGHT_VALIDATION=true'
        Write-Host 'CREATE_PROJECT_VALIDATION=true'
        Write-Host 'THREE_D_PROJECT_SELECTOR_VALIDATION=true'
