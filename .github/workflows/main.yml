        @app.post("/api/windows/performance")
        @monitor_auth
        def api_windows_performance():
            body = request.get_json(silent=True) or {}
            enabled = body.get("enabled") is True
            try:
                saved = _load_windows_power_state()
                if enabled:
                    current = _active_power_scheme()
                    if not saved.get("original_guid"):
                        saved = {"original_guid": current["guid"], "original_name": current["name"],
                                 "changed_at": time.time()}
                    # SCHEME_MIN is Windows' built-in High performance power-plan alias.
                    _powercfg(["/setactive", "SCHEME_MIN"])
                    active = _active_power_scheme()
                    saved["performance_guid"] = active["guid"]
                    _save_windows_power_state(saved)
                    log("Windows performance mode enabled: %s (%s)" % (active["name"], active["guid"]))
                    return jsonify(ok=True, enabled=True, power_scheme=active,
                                   original_power_scheme=saved.get("original_name"),
                                   note="Only the active power plan was changed. No process or Windows service was stopped.")
                original = saved.get("original_guid")
                if not original:
                    return jsonify(ok=True, enabled=False, restored=False,
                                   message="No saved original power plan is available to restore.")
                _powercfg(["/setactive", str(original)])
                active = _active_power_scheme()
                try:
                    WINDOWS_POWER_STATE_FILE.unlink(missing_ok=True)
                except Exception:
                    pass
                log("Original Windows power plan restored: %s (%s)" % (active["name"], active["guid"]))
                return jsonify(ok=True, enabled=False, restored=True, power_scheme=active)
            except Exception as exc:
                log("Windows power mode operation failed: " + repr(exc))
                return jsonify(ok=False, error=str(exc)), 500


        def _temp_cleanup_candidates():
            roots = []
            for value in (os.environ.get("TEMP"), os.environ.get("TMP")):
                if not value:
                    continue
                try:
                    root = Path(value).resolve()
                    # Refuse drive roots, the Windows directory, and non-user locations.
                    if not root.is_dir() or root == Path(root.anchor) or "\\windows" in str(root).lower():
                        continue
                    if root not in roots:
                        roots.append(root)
                except Exception:
                    continue
            cutoff = time.time() - WINDOWS_TEMP_AGE_HOURS * 3600
            rows, total_bytes, truncated = [], 0, False
            for root in roots:
                for current, directories, filenames in os.walk(root, topdown=True, followlinks=False):
                    current_path = Path(current)
                    safe_dirs = []
                    for dirname in directories:
                        child = current_path / dirname
                        try:
                            st = child.lstat()
                            if child.is_symlink() or (getattr(st, "st_file_attributes", 0) & 0x400):
                                continue
                            safe_dirs.append(dirname)
                        except OSError:
                            continue
                    directories[:] = safe_dirs
                    for filename in filenames:
                        candidate = current_path / filename
                        try:
                            st = candidate.lstat()
                            if candidate.is_symlink() or (getattr(st, "st_file_attributes", 0) & 0x400):
                                continue
                            if not candidate.is_file() or st.st_mtime >= cutoff:
                                continue
                            resolved = candidate.resolve()
                            if root not in resolved.parents:
                                continue
                            rows.append((candidate, int(st.st_size)))
                            total_bytes += int(st.st_size)
                            if len(rows) >= WINDOWS_TEMP_MAX_FILES:
                                truncated = True
                                return rows, total_bytes, truncated
                        except (OSError, PermissionError):
                            continue
            return rows, total_bytes, truncated


        @app.post("/api/windows/cleanup-temp")
        @monitor_auth
        def api_windows_cleanup_temp():
            body = request.get_json(silent=True) or {}
            confirm = body.get("confirm") is True
            try:
                candidates, total_bytes, truncated = _temp_cleanup_candidates()
                if not confirm:
                    return jsonify(ok=True, preview=True, files_found=len(candidates), bytes_found=total_bytes,
                                   mb_found=round(total_bytes / 1048576, 2), truncated=truncated,
                                   older_than_hours=WINDOWS_TEMP_AGE_HOURS,
                                   message="Preview only; no files have been deleted.")
                deleted_files, deleted_bytes, skipped = 0, 0, 0
                for path, size in candidates:
                    try:
                        path.unlink()
                        deleted_files += 1
                        deleted_bytes += size
                    except (OSError, PermissionError):
                        skipped += 1
                log("Windows TEMP cleanup: deleted=%s skipped=%s bytes=%s" % (deleted_files, skipped, deleted_bytes))
                return jsonify(ok=True, preview=False, deleted_files=deleted_files, deleted_bytes=deleted_bytes,
                               mb_freed=round(deleted_bytes / 1048576, 2), skipped_files=skipped,
                               candidates_seen=len(candidates), truncated=truncated,
                               older_than_hours=WINDOWS_TEMP_AGE_HOURS,
                               note="Only old files inside the current user's TEMP/TMP folders were considered. Locked files were skipped; folders and user documents were not removed.")
            except Exception as exc:
                log("Windows TEMP cleanup failed: " + repr(exc))
                return jsonify(ok=False, error=str(exc)), 500


