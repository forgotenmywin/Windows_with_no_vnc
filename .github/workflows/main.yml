        @app.post("/api/monitor/capture")
        @monitor_auth
        def monitor_capture_request():
            with MONITOR_LOCK:
                if MONITOR_STATE["capture_running"]:
                    return jsonify(ok=True, status="already_running"), 202
                if not MONITOR_STATE["capture_requested"]:
                    return jsonify(ok=True, status="not_requested"), 200
                now = time.time()
                cooldown_left = 30 - (now - MONITOR_STATE["last_capture_request"])
                if cooldown_left > 0:
                    # Keep capture_requested=True; the dashboard retries on its next
                    # low-frequency poll and captures once the cooldown has elapsed.
                    return jsonify(ok=True, status="throttled", retry_after_seconds=int(cooldown_left) + 1), 202
                MONITOR_STATE["capture_requested"] = False
                MONITOR_STATE["capture_running"] = True
                MONITOR_STATE["last_capture_request"] = now
            threading.Thread(target=monitor_capture_worker, name="UE-Monitor-Capture", daemon=True).start()
            return jsonify(ok=True, status="capture_started"), 202

