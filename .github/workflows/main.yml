        def mcp_text_result(send, request_obj, value, is_error=False):
            response_obj = {
                "jsonrpc": "2.0", "id": request_obj.get("id"),
                "result": {"content": [{"type": "text", "text": json.dumps(value, ensure_ascii=False, default=str)}], "isError": bool(is_error)}
            }
            return response_obj

        def parse_sse_json_messages(raw_bytes):
            """Decode JSON-RPC messages carried in an upstream SSE response."""
            decoded = raw_bytes.decode("utf-8", errors="replace")
            messages = []
            for block in re.split(r"\r?\n\r?\n", decoded):
                data_lines = []
                for line in block.splitlines():
                    if line.startswith("data:"):
                        data_lines.append(line[5:].lstrip())
                if not data_lines:
                    continue
                payload = "\n".join(data_lines).strip()
                if not payload or payload == "[DONE]":
                    continue
                try:
                    value = json.loads(payload)
                except Exception:
                    continue
                if isinstance(value, dict):
                    messages.append(value)
                elif isinstance(value, list):
                    messages.extend(item for item in value if isinstance(item, dict))
            return messages

        async def send_mcp_json(send, obj, headers=None, status=200):
            payload = json.dumps(obj, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
            with MONITOR_LOCK:
                MCP_CONNECTION["last_status"] = int(status)
                if status >= 400:
                    MCP_CONNECTION["last_error"] = str(obj.get("error", obj.get("message", "MCP HTTP %s" % status)))[:500] if isinstance(obj, dict) else "MCP HTTP %s" % status
            log("MCP OUT status=%s content_type=application/json bytes=%s" % (status, len(payload)))
            out = [(b"content-type", b"application/json; charset=utf-8"),
                   (b"content-length", str(len(payload)).encode("ascii")),
                   (b"cache-control", b"no-store")]
            for key, value in (headers or []):
                if key.lower() not in (b"content-type", b"content-length", b"content-encoding", b"transfer-encoding", b"connection"):
                    out.append((key.lower(), value))
            await send({"type": "http.response.start", "status": status, "headers": out})
            await send({"type": "http.response.body", "body": payload, "more_body": False})

        async def native_mcp_proxy(scope, receive, send):
            # One public MCP endpoint. Native Unreal tools are proxied unchanged;
            # monitor-link/status and confirmed, path-restricted Release tools are added to tools/list.
            if scope.get("type") != "http":
                return
            body = bytearray()
            more = True
            while more:
                message = await receive()
                if message["type"] == "http.disconnect":
                    return
                body.extend(message.get("body", b""))
                more = message.get("more_body", False)
            raw_path = scope.get("path", "/") or "/"
            query = scope.get("query_string", b"")
            target = "http://127.0.0.1:8000/mcp" + ("?" + query.decode("latin1") if query else "")
            forwarded = {}
            hop_by_hop = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "te", "trailers", "transfer-encoding", "upgrade", "host", "origin", "authorization"}
            for key, value in scope.get("headers", []):
                name = key.decode("latin1").lower()
                if name not in hop_by_hop:
                    forwarded[name] = value.decode("latin1")
            forwarded["host"] = "127.0.0.1:8000"
            forwarded["origin"] = "http://127.0.0.1:8000"
            request_obj = None
            try:
                if body:
                    request_obj = json.loads(bytes(body).decode("utf-8"))
            except Exception:
                request_obj = None
            method = request_obj.get("method", "") if isinstance(request_obj, dict) else ""
            params = request_obj.get("params", {}) if isinstance(request_obj, dict) else {}
            with MONITOR_LOCK:
                MCP_CONNECTION["request_count"] += 1
                MCP_CONNECTION["last_seen"] = time.time()
                MCP_CONNECTION["last_method"] = str(method or scope.get("method", "HTTP"))
                MCP_CONNECTION["last_path"] = raw_path
                MCP_CONNECTION["last_error"] = ""
            log("MCP IN method=%s path=%s jsonrpc_id=%s" % (
                method or scope.get("method", "HTTP"), raw_path,
                request_obj.get("id", "-") if isinstance(request_obj, dict) else "-"))
            local_response_headers = [(key.lower(), value) for key, value in scope.get("headers", [])
                                      if key.lower() in (b"mcp-session-id", b"mcp-protocol-version")]

            # Handle safe monitor tools locally so ChatGPT can obtain the browser link.
            if method == "tools/call" and isinstance(params, dict) and params.get("name") in ("unreal_monitor_get_url", "unreal_monitor_get_state"):
                tool_name = params.get("name")
                args = params.get("arguments") or {}
                if tool_name == "unreal_monitor_get_url":
                    result_value = {"monitor_url": monitor_public_url(), "username": MONITOR_USERNAME,
                                    "authentication": "HTTP Basic; password is the repository Actions secret MONITOR_PASSWORD",
                                    "mcp_url": (MONITOR_STATE.get("public_base_url", "").rstrip("/") + "/mcp") if MONITOR_STATE.get("public_base_url") else ""}
                else:
                    result_value = monitor_state_payload()
                    try:
                        result_value["events"] = result_value["events"][:max(1, min(20, int(args.get("limit", 20))))]
                    except Exception:
                        result_value["events"] = result_value["events"][:20]
                response_obj = {"jsonrpc": "2.0", "id": request_obj.get("id"),
                                "result": {"content": [{"type": "text", "text": json.dumps(result_value, ensure_ascii=False, default=str)}]}}
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            extra_tool_names = {
                "unreal_monitor_get_scene", "unreal_monitor_list_projects", "unreal_switch_project",
                "unreal_monitor_list_plugins", "unreal_monitor_set_plugin_enabled", "unreal_save_all_dirty_assets",
                "unreal_create_project_checkpoint", "unreal_package_project", "unreal_get_package_status",
                "unreal_get_system_status", "mcp_gateway_list_servers", "mcp_gateway_add_server",
                "mcp_gateway_remove_server", "mcp_gateway_list_tools", "mcp_gateway_call_tool",
                "unreal_install_plugin_from_zip"
            }
            if method == "tools/call" and isinstance(params, dict) and params.get("name") in extra_tool_names:
                tool_name = params.get("name")
                args = params.get("arguments") or {}
                event_id = monitor_event_start(tool_name, args)
                failed = False
                try:
                    value = _handle_extra_mcp_tool(tool_name, args)
                    monitor_event_finish(event_id, 200, response_preview=json.dumps(safe_monitor_value(value), ensure_ascii=False))
                except Exception as exc:
                    failed = True
                    value = {"ok": False, "error": str(exc)}
                    log("Extended MCP tool failed (%s): %s" % (tool_name, repr(exc)))
                    monitor_event_finish(event_id, 400, str(exc), json.dumps(value, ensure_ascii=False))
                await send_mcp_json(send, mcp_text_result(send, request_obj, value, failed), headers=local_response_headers)
                return

            if method == "tools/call" and isinstance(params, dict) and params.get("name") == "unreal_upload_binary_file":
                args = params.get("arguments") or {}
                event_id = monitor_event_start("unreal_upload_binary_file", args)
                failed = False
                try:
                    encoded = str(args.get("content_base64") or "")
                    if len(encoded) > ((UPLOAD_SINGLE_FILE_LIMIT + 2) // 3) * 4 + 16:
                        raise ValueError("Base64 content exceeds 8 MiB; use a smaller image/file")
                    try:
                        data = base64.b64decode(encoded, validate=True)
                    except (binascii.Error, ValueError) as exc:
                        raise ValueError("content_base64 is not valid Base64: " + str(exc))
                    if len(data) > UPLOAD_SINGLE_FILE_LIMIT:
                        raise ValueError("Direct upload limit is 8 MiB")
                    target = upload_target(args.get("filename", ""), args.get("destination_folder", ""))
                    value = store_uploaded_bytes(target, data, bool(args.get("overwrite", False)))
                    monitor_event_finish(event_id, 200, response_preview=json.dumps(safe_monitor_value(value), ensure_ascii=False))
                except Exception as exc:
                    failed = True
                    value = {"ok": False, "error": str(exc)}
                    monitor_event_finish(event_id, 400, str(exc), json.dumps(value, ensure_ascii=False))
                response_obj = mcp_text_result(send, request_obj, value, failed)
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            # Release upload tools are intentionally narrow: current repository, one existing
            # release tag, files under Uploads/Screenshots, timestamped names, size/rate limited.
            if method == "tools/call" and isinstance(params, dict) and params.get("name") in ("github_release_upload_file", "unreal_monitor_publish_latest_screenshot"):
                global RELEASE_LAST_UPLOAD_TIME
                tool_name = params.get("name")
                args = params.get("arguments") or {}
                event_id = monitor_event_start(tool_name, args)
                value, failed = None, False
                try:
                    if args.get("confirm_public_upload") is not True:
                        raise ValueError("confirm_public_upload must be true; this makes the asset publicly downloadable")
                    if not RELEASE_UPLOAD_LOCK.acquire(blocking=False):
                        raise RuntimeError("another GitHub Release upload is already running")
                    try:
                        now = time.time()
                        if now - RELEASE_LAST_UPLOAD_TIME < 60:
                            raise RuntimeError("Release uploads are rate-limited to one per minute")
                        RELEASE_LAST_UPLOAD_TIME = now
                        if str(args.get("tag") or "ue5.8") != "ue5.8":
                            raise ValueError("MCP uploads are restricted to the existing ue5.8 Release")
                        if tool_name == "unreal_monitor_publish_latest_screenshot":
                            with MONITOR_LOCK:
                                source_value = MONITOR_STATE.get("image_path")
                            if not source_value:
                                raise FileNotFoundError("no monitor screenshot has been captured yet")
                            source = safe_path(source_value)
                            stem, suffix = "UnrealViewport", ".jpg"
                        else:
                            source = safe_path(args.get("source", ""))
                            allowed_roots = [UPLOAD_ROOT, (ROOT / "Screenshots").resolve()]
                            if not any(root == source or root in source.parents for root in allowed_roots):
                                raise ValueError("source must be inside D:\\UE58\\Uploads or D:\\UE58\\Screenshots")
                            stem, suffix = source.stem, source.suffix
                        if not source.is_file():
                            raise FileNotFoundError("source file not found: " + str(source))
                        if source.stat().st_size > 100 * 1024 * 1024:
                            raise ValueError("MCP Release uploads are limited to 100 MiB per file")
                        unique = time.strftime("%Y%m%d_%H%M%S") + "_" + uuid.uuid4().hex[:6]
                        filename = stem[:80] + "_" + unique + suffix[:12]
                        value = github_release_upload(source, "ue5.8", filename)
                    finally:
                        RELEASE_UPLOAD_LOCK.release()
                    monitor_event_finish(event_id, 200, response_preview=json.dumps(safe_monitor_value(value), ensure_ascii=False))
                except Exception as exc:
                    failed = True
                    value = {"ok": False, "error": str(exc)}
                    monitor_event_finish(event_id, 400, str(exc), json.dumps(value, ensure_ascii=False))
                response_obj = mcp_text_result(send, request_obj, value, failed)
                await send_mcp_json(send, response_obj, headers=local_response_headers)
                return

            event_id = None
            if method == "tools/call" and isinstance(params, dict):
                event_id = monitor_event_start(params.get("name", "unknown"), params.get("arguments", {}))

            log("MCP request: %s %s -> %s; method=%s" % (
                scope.get("method", "POST"), raw_path, target, method or "non-JSON-RPC"))
            try:
                async with httpx.AsyncClient(timeout=None, trust_env=False) as client:
                    # tools/list is a short JSON-RPC response: merge monitor and guarded upload tools.
                    if method == "tools/list" and scope.get("method", "POST").upper() == "POST":
                        response = await client.post(target, headers=forwarded, content=bytes(body))
                        raw = response.content
                        parsed = None
                        try:
                            parsed = response.json()
                        except Exception:
                            # Some Streamable HTTP servers may encode the single JSON-RPC
                            # message as an SSE data frame. Quick Tunnels do not support SSE
                            # as a browser transport, but MCP negotiation may still use it.
                            if "text/event-stream" in response.headers.get("content-type", "").lower():
                                messages = parse_sse_json_messages(raw)
                                if isinstance(request_obj, dict) and "id" in request_obj:
                                    parsed = next((item for item in reversed(messages) if item.get("id") == request_obj.get("id")), None)
                                elif messages:
                                    parsed = messages[-1]
                        if isinstance(parsed, dict) and isinstance(parsed.get("result"), dict) and isinstance(parsed["result"].get("tools"), list):
                            existing = {item.get("name") for item in parsed["result"]["tools"] if isinstance(item, dict)}
                            for item in monitor_mcp_tools():
                                if item["name"] not in existing:
                                    parsed["result"]["tools"].append(item)
                            raw = json.dumps(parsed, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                            headers = [(k.lower(), v) for k, v in response.headers.raw
                                       if k.decode("latin1").lower() not in hop_by_hop]
                            await send_mcp_json(send, parsed, headers=headers, status=response.status_code)
                            return
                        with MONITOR_LOCK:
                            MCP_CONNECTION["last_status"] = int(response.status_code)
                            if response.status_code >= 400:
                                MCP_CONNECTION["last_error"] = "tools/list upstream HTTP %s" % response.status_code
                        log("MCP tools/list upstream response: status=%s; content-type=%s; parsed_jsonrpc=%s" % (
                            response.status_code, response.headers.get("content-type", ""), bool(parsed)))
                        out_headers = [(k.lower(), v) for k, v in response.headers.raw
                                       if k.decode("latin1").lower() not in hop_by_hop]
                        await send({"type": "http.response.start", "status": response.status_code, "headers": out_headers})
                        await send({"type": "http.response.body", "body": raw, "more_body": False})
                        return

                    async with client.stream(scope.get("method", "POST"), target, headers=forwarded, content=bytes(body)) as response:
                        # Cloudflare Quick Tunnels do not carry SSE streams. Unreal may
                        # answer a Streamable HTTP POST with either JSON or SSE, both of
                        # which are valid MCP responses. Buffer an SSE response locally,
                        # extract the matching JSON-RPC reply, and return it as JSON so
                        # the public tunnel only has to carry ordinary HTTP responses.
                        upstream_content_type = response.headers.get("content-type", "").lower()
                        if (scope.get("method", "POST").upper() == "POST"
                                and "text/event-stream" in upstream_content_type
                                and isinstance(request_obj, dict) and "id" in request_obj):
                            raw_sse = await response.aread()
                            messages = parse_sse_json_messages(raw_sse)
                            rpc_response = next(
                                (item for item in reversed(messages) if item.get("id") == request_obj.get("id")),
                                None
                            )
                            response_headers = [(k.lower(), v) for k, v in response.headers.raw
                                                if k.decode("latin1").lower() not in hop_by_hop]
                            if rpc_response is None:
                                log("MCP SSE response had no JSON-RPC message matching request id=%s; parsed_messages=%s" % (
                                    request_obj.get("id"), len(messages)))
                                rpc_response = {
                                    "jsonrpc": "2.0", "id": request_obj.get("id"),
                                    "error": {"code": -32603, "message": "Upstream SSE stream contained no matching JSON-RPC response"}
                                }
                                await send_mcp_json(send, rpc_response, headers=response_headers, status=502)
                                if event_id:
                                    monitor_event_finish(event_id, 502, "upstream SSE had no matching JSON-RPC response")
                            else:
                                await send_mcp_json(send, rpc_response, headers=response_headers, status=response.status_code)
                                if event_id:
                                    monitor_event_finish(event_id, response.status_code,
                                        response_preview=json.dumps(safe_monitor_value(rpc_response), ensure_ascii=False))
                            return

                        session_id = response.headers.get("mcp-session-id", "")
                        with MONITOR_LOCK:
                            MCP_CONNECTION["last_status"] = int(response.status_code)
                            if response.status_code >= 400:
                                MCP_CONNECTION["last_error"] = "Upstream MCP HTTP %s" % response.status_code
                        log("MCP upstream response: status=%s; content-type=%s; protocol-version=%s; session-id-present=%s" % (
                            response.status_code, response.headers.get("content-type", ""),
                            response.headers.get("mcp-protocol-version", ""), bool(session_id)))
                        out_headers = [(k.lower(), v) for k, v in response.headers.raw
                                       if k.decode("latin1").lower() not in hop_by_hop]
                        await send({"type": "http.response.start", "status": response.status_code, "headers": out_headers})
                        response_preview_bytes = bytearray()
                        async for chunk in response.aiter_raw():
                            if event_id and len(response_preview_bytes) < 12000:
                                response_preview_bytes.extend(chunk[:12000 - len(response_preview_bytes)])
                            await send({"type": "http.response.body", "body": chunk, "more_body": True})
                        await send({"type": "http.response.body", "body": b"", "more_body": False})
                        if event_id:
                            monitor_event_finish(event_id, response.status_code,
                                                 response_preview=monitor_response_preview(bytes(response_preview_bytes)))
            except Exception as exc:
                with MONITOR_LOCK:
                    MCP_CONNECTION["last_status"] = 502
                    MCP_CONNECTION["last_error"] = str(exc)[:500]
                if event_id:
                    monitor_event_finish(event_id, 502, repr(exc))
                log("Native MCP proxy error: " + repr(exc))
                err = b'{"ok":false,"error":"native_mcp_proxy_failed"}'
                await send({"type": "http.response.start", "status": 502,
                            "headers": [(b"content-type", b"application/json"), (b"content-length", str(len(err)).encode())]})
                await send({"type": "http.response.body", "body": err})

        # One public MCP endpoint only: /mcp/ proxies Unreal's native AllToolsets server
        # and adds monitor tools plus guarded Release upload tools to tools/list.
        # REST fallback endpoints remain available under the same tunnel host and use Basic auth.
        combined_app = Starlette(routes=[
            Mount("/mcp", app=native_mcp_proxy),
            Mount("/", app=WSGIMiddleware(app))
        ], lifespan=lifespan)

        if __name__ == "__main__":
            if not BRIDGE_TOKEN: raise RuntimeError("BRIDGE_TOKEN must be set")
            if not MONITOR_PASSWORD: raise RuntimeError("MONITOR_PASSWORD must be configured")
            log("Starting REST API on 127.0.0.1:8765; monitor uses HTTP Basic; single MCP endpoint=/mcp -> native Unreal AllToolsets + monitor/file/Release tools")
            uvicorn.run(combined_app, host="127.0.0.1", port=8765, log_level="info")
        '@
        Set-Content -LiteralPath "$root\api_server.py" -Value $api -Encoding utf8
        Write-Host 'Created UE project, bridge, and API server.'
    - name: Validate generated Python scripts
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        try { Start-Transcript -Path 'D:\UE58\Logs\workflow-validation-transcript.log' -Append -Force | Out-Null } catch { }
        $python = (Get-Command python).Source
        & $python -m py_compile 'D:\UE58\api_server.py' 'D:\UE58\UEControl\Content\Python\init_unreal.py'
        if ($LASTEXITCODE -ne 0) { throw 'Generated Python scripts failed syntax validation.' }
        Write-Host 'PYTHON_SYNTAX_VALIDATION=true'
    - name: Launch API, Unreal and Cloudflare tunnel
      shell: pwsh
      env:
        GG_UE_TOKEN: ${{ secrets.GG_UE_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        MONITOR_PASSWORD: ${{ secrets.MONITOR_PASSWORD }}
      run: "$ErrorActionPreference = 'Stop'\n$root = 'D:\\UE58'\ntry { Start-Transcript -Path \"$root\\Logs\\workflow-runtime-transcript.log\"\
        \ -Append -Force | Out-Null } catch { }\n$env:UE_ROOT = $root\nif ([string]::IsNullOrWhiteSpace($env:MONITOR_PASSWORD)\
        \ -or $env:MONITOR_PASSWORD.Length -lt 16) {\n  throw 'Create repository Actions secret MONITOR_PASSWORD with a strong\
        \ password of at least 16 characters before running this workflow.'\n}\nif ([string]::IsNullOrWhiteSpace($env:GG_UE_TOKEN))\
        \ {\n  Write-Warning 'GG_UE_TOKEN is empty; Google Drive endpoints will fail until authorized_user.json or service-account\
        \ JSON is saved as this Actions secret.'\n}\n\n# The bridge token is only for local API <-> Unreal communication.\n\
        $env:BRIDGE_TOKEN = [guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')\n$python = (Get-Command python).Source\n\
        & $python -m pip install --disable-pip-version-check --upgrade Flask google-api-python-client google-auth google-auth-httplib2\
        \ requests urllib3 httpx Pillow psutil \"mcp>=2,<3\" uvicorn starlette\nif ($LASTEXITCODE -ne 0) { throw 'Python package\
        \ installation failed.' }\n\n$apiOut = \"$root\\Logs\\api-stdout.log\"\n$apiErr = \"$root\\Logs\\api-stderr.log\"\n\
        $apiProc = Start-Process -FilePath $python -ArgumentList @(\"$root\\api_server.py\") -WorkingDirectory $root -PassThru\
        \ -WindowStyle Hidden -RedirectStandardOutput $apiOut -RedirectStandardError $apiErr\nWrite-Host \"API_PID=$($apiProc.Id)\"\
        \n\n$localReady = $false\nfor ($i = 0; $i -lt 45; $i++) {\n  Start-Sleep -Seconds 2\n  try {\n    $health = Invoke-RestMethod\
        \ -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4\n    if ($health.ok) { $localReady = $true; break }\n  } catch\
        \ { }\n  if ($apiProc.HasExited) { break }\n}\nif (-not $localReady) {\n  if (Test-Path $apiErr) { Get-Content $apiErr\
        \ -Tail 100 }\n  if (Test-Path $apiOut) { Get-Content $apiOut -Tail 100 }\n  throw 'Local API did not start.'\n}\n\
        Write-Host 'API_LOCAL_READY=true'\n\n# API already inherited the Drive and GitHub credentials when it started.\n#\
        \ Keep only the local bridge token available to the Unreal child process.\n$env:GG_UE_TOKEN = $null\n$env:GITHUB_TOKEN\
        \ = $null\n$env:GITHUB_REPOSITORY = $null\n$env:MONITOR_PASSWORD = $null\n\n$editor = $env:UE_EDITOR_EXE\nif ([string]::IsNullOrWhiteSpace($editor)\
        \ -or -not (Test-Path -LiteralPath $editor)) {\n  throw 'UE_EDITOR_EXE was not found from the extraction step.'\n\
        }\nWrite-Host \"Unreal Editor found: $editor\"\n$ueOut = \"$root\\Logs\\unreal-stdout.log\"\n$ueErr = \"$root\\Logs\\\
        unreal-stderr.log\"\n$initScript = \"$root\\UEControl\\Content\\Python\\init_unreal.py\"\nif (-not (Test-Path -LiteralPath\
        \ $initScript)) { throw \"Unreal bridge startup script was not found: $initScript\" }\n# IMPORTANT: do NOT pass -ExecutePythonScript\
        \ here. Epic documents that\n# the Editor closes after a command-line ExecutePythonScript finishes.\n# Content/Python/init_unreal.py\
        \ is auto-detected and run by the Editor.\n$ueArgs = @(\"$root\\UEControl\\UEControl.uproject\", '-log', '-stdout',\
        \ '-FullStdOutLogOutput', '-AllowSoftwareRendering', '-d3d11', '-ModelContextProtocolStartServer', '-ModelContextProtocolPort=8000')\n\
        $ueProc = Start-Process -FilePath $editor -ArgumentList $ueArgs -WorkingDirectory \"$root\\UEControl\" -PassThru -RedirectStandardOutput\
        \ $ueOut -RedirectStandardError $ueErr\nWrite-Host \"UNREAL_PID=$($ueProc.Id)\"\n\n$cloudflared = \"$root\\cloudflared.exe\"\
        \nInvoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'\
        \ -OutFile $cloudflared\n$cfOut = \"$root\\Logs\\cloudflared-stdout.log\"\n$cfErr = \"$root\\Logs\\cloudflared-stderr.log\"\
        \n$cfProc = Start-Process -FilePath $cloudflared -ArgumentList @('tunnel', '--url', 'http://127.0.0.1:8765', '--no-autoupdate')\
        \ -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput $cfOut -RedirectStandardError $cfErr\n\
        \n$publicUrl = $null\nfor ($i = 0; $i -lt 90; $i++) {\n  Start-Sleep -Seconds 2\n  $combined = ''\n  foreach ($f in\
        \ @($cfOut, $cfErr)) {\n    if (Test-Path $f) { try { $combined += \"`n\" + (Get-Content $f -Raw -ErrorAction SilentlyContinue)\
        \ } catch { } }\n  }\n  $match = [regex]::Match($combined, 'https://[a-zA-Z0-9-]+\\.trycloudflare\\.com')\n  if ($match.Success)\
        \ { $publicUrl = $match.Value; break }\n  if ($cfProc.HasExited) { break }\n}\nif (-not $publicUrl) {\n  if (Test-Path\
        \ $cfErr) { Get-Content $cfErr -Tail 100 }\n  throw 'Cloudflare Quick Tunnel did not provide a public URL.'\n}\nWrite-Host\
        \ \"PUBLIC_API_URL=$publicUrl\"\nWrite-Host 'Waiting up to 3 minutes for the Unreal Python bridge...'\n$bridgeReady\
        \ = $false\nfor ($i = 0; $i -lt 90; $i++) {\n  Start-Sleep -Seconds 2\n  try {\n    $health = Invoke-RestMethod -Uri\
        \ 'http://127.0.0.1:8765/health' -TimeoutSec 4\n    if ($health.bridge_connected) { $bridgeReady = $true; break }\n\
        \  } catch { }\n  if ($ueProc.HasExited) { Write-Warning 'Unreal Editor exited before the Python bridge connected.';\
        \ break }\n}\nif ($bridgeReady) {\n  Write-Host 'BRIDGE_READY=true'\n} else {\n  if ($ueProc.HasExited) { throw \"\
        Unreal Editor exited before the Python bridge connected (exit code $($ueProc.ExitCode)). Inspect $ueOut and $ueErr.\"\
        \ }\n  throw 'BRIDGE_READY=false after 3 minutes. The MCP URL will not be published because Unreal Python bridge is\
        \ unavailable.'\n}\n\n# Confirm Epic's native MCP listener is alive before publishing the endpoint.\n# Unreal documents\
        \ GET /mcp returning HTTP 405 as a valid liveness response.\n$nativeMcpReady = $false\nfor ($i = 0; $i -lt 45; $i++)\
        \ {\n  try {\n    $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp' -Method Get -TimeoutSec 4 -UseBasicParsing\n\
        \    if ([int]$probe.StatusCode -eq 405) { $nativeMcpReady = $true; break }\n    Write-Host (\"Native MCP GET probe\
        \ returned HTTP {0}\" -f [int]$probe.StatusCode)\n  } catch {\n    $status = $null\n    try { $status = [int]$_.Exception.Response.StatusCode\
        \ } catch { }\n    if ($status -eq 405) { $nativeMcpReady = $true; break }\n    if ($status) { Write-Host (\"Native\
        \ MCP GET probe returned HTTP {0}\" -f $status) }\n  }\n  if ($ueProc.HasExited) { break }\n  Start-Sleep -Seconds\
        \ 2\n}\nif ($nativeMcpReady) {\n  Write-Host 'NATIVE_MCP_LISTENER_READY=true (GET /mcp returned expected HTTP 405).'\
        \ \n} else {\n  throw 'NATIVE_MCP_LISTENER_READY=false. Do not add the MCP URL in ChatGPT yet; inspect UEControl\\\
        Saved\\Logs\\UnrealEditor.log and unreal-stdout.log for LogModelContextProtocol errors.'\n}\n\n$internalHeaders =\
        \ @{ Authorization = \"Bearer $env:BRIDGE_TOKEN\" }\n$urlBody = @{ public_url = $publicUrl } | ConvertTo-Json -Compress\n\
        $urlRegistration = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/internal/set-public-url' -Method Post -Headers $internalHeaders\
        \ -ContentType 'application/json' -Body $urlBody -TimeoutSec 10\nif (-not $urlRegistration.ok) { throw 'Could not\
        \ register the public monitor URL with the API.' }\n$monitorUrl = \"$publicUrl/monitor\"\nWrite-Host \"MONITOR_URL=$monitorUrl\"\
        \nWrite-Host 'MONITOR_USERNAME=viewer'\nWrite-Host 'MONITOR_PASSWORD is stored only in the repository Actions secret\
        \ MONITOR_PASSWORD.'\n$summaryText = @\"\n## Unreal Live Monitor\n- [Open read-only monitor]($monitorUrl)\n- MCP endpoint:\
        \ $publicUrl/mcp\n- Username: viewer\n- Password: repository secret MONITOR_PASSWORD\n- GitHub Release upload: available\
        \ inside the authenticated monitor; default tag: ue5.8.\n\"@\n$summaryText | Out-File -FilePath $env:GITHUB_STEP_SUMMARY\
        \ -Append -Encoding utf8\n\nWrite-Host 'REST endpoints: GET /health; authenticated read-only monitor at GET /monitor;\
        \ authenticated file, Drive, GitHub Release, project and unified logs endpoints.'\nWrite-Host \"MCP_ENDPOINT=$publicUrl/mcp\"\
        \nWrite-Host 'Single MCP endpoint only: /mcp -> native Unreal AllToolsets plus monitor, binary-upload and guarded\
        \ GitHub Release tools. No second MCP URL.'\nWrite-Host 'Bridge startup: Content/Python/init_unreal.py auto-loads;\
        \ Unreal is intentionally launched without -ExecutePythonScript so the Editor stays open.'\nWrite-Host 'Binary transfer:\
        \ unreal_upload_binary_file accepts files up to 8 MiB per MCP call; place larger files under D:\\UE58\\Uploads through\
        \ the authenticated API before publishing them.'\nWrite-Host 'Monitor uses 5-second JSON polling and 640x360 JPEG\
        \ snapshots after MCP tool calls; no VNC, desktop stream, WebSocket, or SSE.'\nWrite-Host 'MCP tool list includes\
        \ Unreal AllToolsets, scene/project/plugin management, save/checkpoint/restore, packaging, Windows metrics, file transfer,\
        \ GitHub Release and external MCP gateway tools.'\nWrite-Host 'MCP transport: upstream SSE replies are converted to\
        \ JSON-RPC JSON locally because Cloudflare Quick Tunnels do not support SSE.'\nWrite-Host 'Monitor includes Logs,\
        \ read-only 3D Actor bounds map with orbit/zoom, project switching, plugin ZIP installation/toggles, save/checkpoint/restore,\
        \ Win64 Shipping packaging, system metrics and remote MCP gateway.'\nWrite-Warning 'SECURITY: the monitor and REST\
        \ endpoints are password-protected, but /mcp is intentionally unauthenticated for ChatGPT. Anyone who obtains the\
        \ MCP URL may issue Unreal commands. Do not share the MCP URL; stop the workflow when finished.'\n\n$lastHeartbeat\
        \ = Get-Date\n$activeProjectFile = \"$root\\UEControl\\UEControl.uproject\"\n$editorCommandFile = \"$root\\control\\\
        editor-command.json\"\nwhile ($true) {\n  Start-Sleep -Seconds 5\n  if ($apiProc.HasExited) { throw 'API server stopped;\
        \ inspect D:\\UE58\\Logs\\api-stderr.log.' }\n  if ($cfProc.HasExited) { throw 'Cloudflare tunnel stopped; inspect\
        \ D:\\UE58\\Logs\\cloudflared-stderr.log.' }\n\n  # A project switch, plugin change or checkpoint restore is handled\
        \ here.\n  if (Test-Path -LiteralPath $editorCommandFile) {\n    try {\n      $cmd = Get-Content -LiteralPath $editorCommandFile\
        \ -Raw | ConvertFrom-Json\n      $targetProject = [System.IO.Path]::GetFullPath([string]$cmd.project_file)\n     \
        \ $rootPrefix = [System.IO.Path]::GetFullPath($root) + [System.IO.Path]::DirectorySeparatorChar\n      if (-not $targetProject.StartsWith($rootPrefix,\
        \ [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $targetProject)) { throw 'Restart\
        \ request project is outside D:\\UE58 or missing.' }\n      Write-Host (\"Editor restart command received: {0} ->\
        \ {1}\" -f $cmd.action, $targetProject)\n      if ($ueProc -and -not $ueProc.HasExited) { Stop-Process -Id $ueProc.Id\
        \ -Force -ErrorAction SilentlyContinue; $ueProc.WaitForExit(15000) | Out-Null }\n      $projectDir = Split-Path -Parent\
        \ $targetProject\n      if ($cmd.action -eq 'restore_checkpoint') {\n        $zipPath = [System.IO.Path]::GetFullPath([string]$cmd.checkpoint)\n\
        \        $backupPrefix = [System.IO.Path]::GetFullPath(\"$root\\Backups\") + [System.IO.Path]::DirectorySeparatorChar\n\
        \        if (-not $zipPath.StartsWith($backupPrefix, [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path\
        \ -LiteralPath $zipPath)) { throw 'Checkpoint restore path is invalid.' }\n        Expand-Archive -LiteralPath $zipPath\
        \ -DestinationPath $projectDir -Force\n        Write-Host \"CHECKPOINT_RESTORED=$zipPath\"\n      }\n      Remove-Item\
        \ -LiteralPath $editorCommandFile -Force -ErrorAction SilentlyContinue\n      $stamp = Get-Date -Format 'yyyyMMdd_HHmmss'\n\
        \      $ueOut = \"$root\\Logs\\unreal-$stamp-stdout.log\"\n      $ueErr = \"$root\\Logs\\unreal-$stamp-stderr.log\"\
        \n      $ueArgs = @($targetProject, '-log', '-stdout', '-FullStdOutLogOutput', '-AllowSoftwareRendering', '-d3d11',\
        \ '-ModelContextProtocolStartServer', '-ModelContextProtocolPort=8000')\n      $ueProc = Start-Process -FilePath $editor\
        \ -ArgumentList $ueArgs -WorkingDirectory $projectDir -PassThru -RedirectStandardOutput $ueOut -RedirectStandardError\
        \ $ueErr\n      $activeProjectFile = $targetProject\n      Write-Host \"UNREAL_RESTARTED_PID=$($ueProc.Id) PROJECT=$activeProjectFile\"\
        \n      $restartedBridge = $false\n      for ($i = 0; $i -lt 90; $i++) {\n        Start-Sleep -Seconds 2\n       \
        \ try { $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4; if ($h.bridge_connected) { $restartedBridge\
        \ = $true; break } } catch { }\n        if ($ueProc.HasExited) { break }\n      }\n      if (-not $restartedBridge)\
        \ { throw \"Bridge did not reconnect after project restart. Inspect $ueOut and $ueErr.\" }\n      $restartedMcp =\
        \ $false\n      for ($i = 0; $i -lt 45; $i++) {\n        try { $probe = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/mcp'\
        \ -Method Get -TimeoutSec 4 -UseBasicParsing; if ([int]$probe.StatusCode -eq 405) { $restartedMcp = $true; break }\
        \ } catch { try { if ([int]$_.Exception.Response.StatusCode -eq 405) { $restartedMcp = $true; break } } catch { }\
        \ }\n        Start-Sleep -Seconds 2\n      }\n      if (-not $restartedMcp) { throw 'Native MCP did not return HTTP\
        \ 405 after restart.' }\n      Write-Host 'PROJECT_RESTART_BRIDGE_READY=true NATIVE_MCP_LISTENER_READY=true'\n   \
        \ } catch {\n      Write-Error (\"Editor restart handler failed: \" + $_)\n      if (Test-Path -LiteralPath $editorCommandFile)\
        \ { Remove-Item -LiteralPath $editorCommandFile -Force -ErrorAction SilentlyContinue }\n      throw\n    }\n  }\n\n\
        \  if ($ueProc -and $ueProc.HasExited) { throw \"Unreal Editor stopped with exit code $($ueProc.ExitCode); inspect\
        \ $ueOut, $ueErr and the active project's Saved\\Logs folder.\" }\n  if (((Get-Date) - $lastHeartbeat).TotalMinutes\
        \ -ge 30) {\n    try {\n      $h = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/health' -TimeoutSec 4\n      Write-Host\
        \ (\"Heartbeat {0}: API_OK={1} BRIDGE_CONNECTED={2}\" -f (Get-Date), $h.ok, $h.bridge_connected)\n    } catch { Write-Warning\
        \ (\"Heartbeat {0}: local health check failed.\" -f (Get-Date)) }\n    $lastHeartbeat = Get-Date\n  }\n}"
