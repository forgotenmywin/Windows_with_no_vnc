            return jsonify(ok=True, servers=[{'name': name, 'url': row.get('url', ''), 'auth': 'Bearer token' if row.get('token_dpapi') else 'None'} for name, row in sorted(registry.items())])
        
        @app.post('/api/mcp/servers')
        @monitor_auth
        def api_mcp_server_add():
            body = request.get_json(silent=True) or {}
            name = str(body.get('name', '')).strip()
            if not re.fullmatch('[A-Za-z0-9_-]{2,48}', name):
                return (jsonify(ok=False, error='Server name must use 2-48 letters, numbers, _ or -'), 400)
            try:
                url = _validate_public_mcp_url(body.get('url'))
                token = _protect_mcp_token(str(body.get('bearer_token', '')).strip())
                registry = _load_mcp_registry()
                registry[name] = {'url': url, 'token_dpapi': token, 'added_at': time.time()}
                _save_mcp_registry(registry)
                log('Registered external MCP server: %s (%s)' % (name, url))
                return jsonify(ok=True, name=name, url=url, auth='Bearer token' if token else 'None')
            except Exception as exc:
                return (jsonify(ok=False, error=str(exc)), 400)
        
        @app.delete('/api/mcp/servers/<name>')
        @monitor_auth
        def api_mcp_server_remove(name):
            registry = _load_mcp_registry()
            if name not in registry:
                return (jsonify(ok=False, error='MCP server not found'), 404)
            registry.pop(name, None)
            _save_mcp_registry(registry)
            log('Removed external MCP server: ' + name)
            return jsonify(ok=True, removed=name)
        
        @app.get('/api/mcp/tools')
