        @monitor_auth
        def api_scene_model_status():
            with SCENE_MODEL_LOCK:
                state = dict(SCENE_MODEL_STATE)
            current_job = str(state.get("job_id", ""))
            if current_job:
                progress_file = (SCENE_MODEL_DIR / ("offline_scene_" + current_job) / "progress.json").resolve()
                try:
                    if progress_file.parent.parent == SCENE_MODEL_DIR and progress_file.is_file():
                        progress_data = json.loads(progress_file.read_text(encoding="utf-8"))
                        if isinstance(progress_data, dict):
                            for key in ("progress", "phase", "completed", "total", "detail", "updated_at"):
                                if key in progress_data:
                                    state[key] = progress_data[key]
                except Exception as progress_read_error:
                    state["progress_read_warning"] = str(progress_read_error)[:160]
            state.setdefault("progress", 0)
            state.setdefault("phase", state.get("status", "idle"))
            state.pop("path", None)
            state["model_url"] = "/api/scene/model.glb" if state.get("status") == "ready" and state.get("path") else ""
            state["model_files"] = [dict(item, url="/api/scene/model/file/%s/%s" %
                                          (state.get("job_id", ""), item.get("file", "")))
                                    for item in (state.get("model_files", []) or [])]
            state.pop("job_dir", None)
            state["offline_snapshot"] = True
            state["html_ready"] = bool(state.get("html_ready") and SCENE_HTML_PATH.is_file())
            state["html_url"] = "/api/scene/viewer.html" if state["html_ready"] else ""
            state.pop("html_path", None)
            state["ok"] = state.get("status") != "failed"
            return jsonify(state)


