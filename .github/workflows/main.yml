        \ -or $apiText -notmatch \"@app.get\\('/blueprint-explorer'\\)\" -or $apiText -notmatch 'BLUEPRINT_EXPLORER_HTML'\
        \ -or $apiText -notmatch \"@app.get\\('/api/blueprint/explorer/status'\\)\" -or $apiText -notmatch 'BLUEPRINT_EXPLORER_DYNAMIC_BASE_URL'\
        \ -or $apiText -notmatch 'apiFetch\\(' -or $apiText -notmatch 'endpoint\\(' -or $apiText -notmatch 'BLUEPRINT_EXPLORER_CORS_SUPPORT'\
        \ -or $apiText -notmatch 'UE58_BLUEPRINT_ALLOW_FILE_ORIGIN') {\n  throw 'BLUEPRINT_EXPLORER_CONNECTION_VALIDATION_FAILED:\
        \ configurable absolute server URL, authenticated API fetch and explicit CORS handling are required.'\n}\nif ($apiText\
        \ -notmatch 'BLUEPRINT_PROJECT_SELECTOR_FEATURE_MARKERS' -or $apiText -notmatch 'def _project_files\\(' -or $apiText\
        \ -notmatch 'project_root=str\\(ROOT\\)' -or $apiText -notmatch '@app\\.get\\(''/api/projects''\\)') {\n  throw 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION_FAILED:\
        \ project discovery must scan the configured D:\\\\UE58 root and expose it to the Blueprint UI.'\n}\nif ($apiText\
        \ -notmatch 'def api_fs_read' -or $apiText -notmatch 'def api_fs_write' -or $apiText -notmatch 'content_base64' -or\
        \ $apiText -notmatch 'def _fs_atomic_write') {\n  throw 'FILE_MANAGER_READ_WRITE_VALIDATION_FAILED: byte-safe file\
        \ read and atomic file write routes are required.'\n}\nif ($apiText -notmatch 'def api_fs_move' -or $apiText -notmatch\
        \ 'def _fs_move_paths' -or $apiText -notmatch 'file_manager_move_paths') {\n  throw 'FILE_MANAGER_MOVE_VALIDATION_FAILED:\
        \ safe move operation is required.'\n}\nif ($apiText -notmatch 'file_manager_read_file' -or $apiText -notmatch 'file_manager_write_file'\
        \ -or $apiText -notmatch 'file_manager_create_folder' -or $apiText -notmatch 'unreal_save_blueprint_asset' -or $apiText\
        \ -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true') {\n  throw 'FILE_MANAGER_MCP_OR_BLUEPRINT_SAVE_VALIDATION_FAILED:\
        \ read/write/folder MCP tools and disk-verified Blueprint save are required.'\n}\n$listLogToolCount = [regex]::Matches($apiText,\
        \ \"'name': 'file_manager_list_logs'\").Count\n$readLogsToolCount = [regex]::Matches($apiText, \"'name': 'file_manager_read_logs'\"\
        ).Count\nif ($listLogToolCount -ne 1 -or $readLogsToolCount -ne 1 -or\n    $apiText -notmatch 'def _log_source_catalog'\
        \ -or $apiText -notmatch 'def _read_log_source_chunk' -or\n    $apiText -notmatch 'next_offset' -or $apiText -notmatch\
        \ 'max_total_bytes' -or\n    $apiText -notmatch \"@app.get\\('/api/logs/catalog'\\)\" -or $apiText -notmatch 'rate-limit-events')\
        \ {\n  throw 'EXPANDED_LOG_ACCESS_VALIDATION_FAILED: unique log-list/batch-read tools, catalog, byte paging and rate-limit\
        \ log source are required.'\n}\nif ($apiText -notmatch 'MCP_RATE_LIMIT_STATE' -or $apiText -notmatch '_record_rate_limit'\
        \ -or\n    $apiText -notmatch '_rate_limit_delay' -or $apiText -notmatch 'Retry-After' -or\n    $apiText -notmatch\
        \ '_wait_for_mcp_upstream_slot' -or $apiText -notmatch 'MCP_RATE_LIMITED' -or\n    $apiText -notmatch 'def _mcp_post_status_with_retry')\
        \ {\n  throw 'MCP_RATE_LIMIT_RECOVERY_VALIDATION_FAILED: bounded retry, Retry-After handling, request pacing and diagnostics\
        \ are required.'\n}\n$blueprintSaveRouteCount = [regex]::Matches($apiText, '(?m)^def api_blueprint_save\\(').Count\n\
        if ($blueprintSaveRouteCount -ne 1 -or $apiText -notmatch 'def api_blueprint_save_status' -or\n    $apiText -notmatch\
        \ 'EditorLoadingAndSavingUtils.save_packages' -or\n    $apiText -notmatch 'SAVE_PACKAGES_BEGIN' -or $apiText -notmatch\
        \ 'SAVE_PACKAGES_END' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_PHASE=' -or $apiText -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true')\
        \ {\n  throw 'BLUEPRINT_DISK_SAVE_ENDPOINT_MISSING: one targeted save route, package-save begin/end markers, disk\
        \ verification and phase diagnostics are required.'\n}\nif ($apiText -notmatch 'queue_blueprint_save_until_bridge_returns'\
        \ -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_OFFLINE_QUEUE_UNTIL_WORKFLOW_TIMEOUT' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_LOW_LOAD_MODE=ACTIVE'\
        \ -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_LOW_LOAD_MODE=RESTORED' -or\n    $apiText -notmatch 'bp_write_chunked_recovery_copy'\
        \ -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_CHUNKED_COPY_VERIFIED=true') {\n  throw 'BLUEPRINT_SAVE_RECOVERY_VALIDATION_FAILED:\
        \ offline queue, temporary low-load mode restoration, and verified chunked recovery copy are required.'\n}\nWrite-Host\
        \ 'EXPANDED_LOG_ACCESS_VALIDATION=true'\nWrite-Host 'MCP_RATE_LIMIT_RECOVERY_VALIDATION=true'\nif ($apiText -notmatch\
        \ 'BLUEPRINT_MANUAL_PATH_CHECK_API' -or\n    $apiText -notmatch \"@app.post\\('/api/blueprint/check-path'\\)\" -or\n\
        \    $apiText -notmatch \"@app.get\\('/api/blueprint/check-path-status/<job_id>'\\)\" -or\n    $apiText -notmatch\
        \ 'does_asset_exist' -or $apiText -notmatch 'BLUEPRINT_PATH_CHECK_JSON' -or\n    $apiText -notmatch 'bpAssetPath'\
        \ -or $apiText -notmatch 'Check Asset' -or\n    $apiText -notmatch 'applyBlueprintPathToArgs') {\n  throw 'BLUEPRINT_MANUAL_PATH_CHECK_MISSING:\
        \ manual /Game asset path input, Unreal existence validation and graph-tool path binding are required.'\n}\nif ($apiText\
        \ -notmatch 'BLUEPRINT_MANUAL_PATH_APPLY' -or $apiText -notmatch 'bpUsePath' -or $apiText -notmatch 'applyManualBlueprintPath'\
        \ -or $apiText -notmatch 'blueprintObjectPath\\(source\\)') {\n  throw 'BLUEPRINT_MANUAL_PATH_APPLY_VALIDATION_FAILED:\
        \ manual package/object path input must be normalized and applied to selected tool arguments.'\n}\nif ($apiText -notmatch\
        \ 'BLUEPRINT_OBJECT_REF_NORMALIZATION' -or $apiText -notmatch 'refPath:objectPath' -or $apiText -notmatch 'Custom\
        \ Blueprint Object Path' -or $apiText -notmatch 'normalizeBlueprintToolArguments') {\n  throw 'BLUEPRINT_OBJECT_REF_VALIDATION_FAILED:\
        \ custom Blueprint Object Path must be normalized and sent as an object reference with refPath.'\n}\nWrite-Host 'BLUEPRINT_MANUAL_PATH_APPLY_VALIDATION=true'\n\
        if ($apiText -notmatch 'BLUEPRINT_LIST_GRAPHS_BRIDGE_IMPLEMENTATION' -or\n    $apiText -notmatch \"@app.post\\('/api/blueprint/list-graphs'\\\
        )\" -or\n    $apiText -notmatch \"@app.get\\('/api/blueprint/list-graphs-status/<job_id>'\\)\" -or\n    $apiText -notmatch\
        \ 'queue_unreal\\(_blueprint_list_graphs_python_code\\(asset_path\\), 8\\)' -or\n    $apiText -notmatch 'library\\\
        .list_graphs\\(blueprint\\)' -or\n    $apiText -notmatch 'BLUEPRINT_LIST_GRAPHS_JSON' -or\n    $apiText -notmatch\
        \ 'async function listGraphs\\(\\)' -or\n    $apiText -notmatch 'bpListGraphs') {\n  throw 'BLUEPRINT_LIVE_GRAPH_EXPLORER_VALIDATION_FAILED:\
        \ a live List Graphs UI, authenticated API and Unreal Python Bridge operation are required.'\n}\nWrite-Host 'BLUEPRINT_LIVE_GRAPH_EXPLORER_VALIDATION=true'\n\
        Write-Host 'BLUEPRINT_EXPLORER_VALIDATION=true'\nWrite-Host 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION=true'\nWrite-Host\
        \ 'THREE_D_GITHUB_RELEASE_VALIDATION=true'\nWrite-Host 'BRIDGE_BUSY_DIAGNOSTICS_VALIDATION=true'\nWrite-Host 'BRIDGE_RECOVERY_ENDPOINT_VALIDATION=true'\n\
        Write-Host 'PROJECT_PREFLIGHT_VALIDATION=true'\nWrite-Host 'CREATE_PROJECT_VALIDATION=true'\nWrite-Host 'THREE_D_PROJECT_SELECTOR_VALIDATION=true'\n"
