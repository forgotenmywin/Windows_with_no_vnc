            try:
                candidates, total_bytes, truncated = _temp_cleanup_candidates()
                if not confirm:
                    return jsonify(ok=True, preview=True, files_found=len(candidates), bytes_found=total_bytes, mb_found=round(total_bytes / 1048576, 2), truncated=truncated, older_than_hours=WINDOWS_TEMP_AGE_HOURS, message='Preview only; no files have been deleted.')
                deleted_files, deleted_bytes, skipped = (0, 0, 0)
                for path, size in candidates:
                    try:
                        path.unlink()
                        deleted_files += 1
                        deleted_bytes += size
                    except (OSError, PermissionError):
                        skipped += 1
                log('Windows TEMP cleanup: deleted=%s skipped=%s bytes=%s' % (deleted_files, skipped, deleted_bytes))
                return jsonify(ok=True, preview=False, deleted_files=deleted_files, deleted_bytes=deleted_bytes, mb_freed=round(deleted_bytes / 1048576, 2), skipped_files=skipped, candidates_seen=len(candidates), truncated=truncated, older_than_hours=WINDOWS_TEMP_AGE_HOURS, note="Only old files inside the current user's TEMP/TMP folders were considered. Locked files were skipped; folders and user documents were not removed.")
            except Exception as exc:
