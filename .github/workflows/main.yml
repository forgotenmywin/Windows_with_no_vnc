            parsed = urlparse(str(value or '').strip())
            if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password:
                raise ValueError('MCP endpoint must be an HTTPS URL without embedded credentials')
            host = parsed.hostname.lower()
            if host in ('localhost', 'localhost.localdomain'):
                raise ValueError('Localhost endpoints are not allowed')
            try:
                addresses = {item[4][0] for item in socket.getaddrinfo(host, parsed.port or 443, type=socket.SOCK_STREAM)}
                if not addresses:
                    raise ValueError('Host did not resolve')
                for address in addresses:
                    ip = ipaddress.ip_address(address)
                    if ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_reserved:
                        raise ValueError('Private/local network MCP endpoints are not allowed')
            except socket.gaierror as exc:
                raise ValueError('Could not resolve MCP server hostname') from exc
            return parsed.geturl().rstrip('/')
        
        def _protect_mcp_token(token):
            if not token:
                return ''
            try:
                import win32crypt
                protected = win32crypt.CryptProtectData(token.encode('utf-8'), 'UE Remote MCP token', None, None, None, 0)
                return base64.b64encode(protected).decode('ascii')
            except Exception as exc:
                raise RuntimeError('Could not protect the bearer token with Windows DPAPI; no token was saved') from exc
        
        def _unprotect_mcp_token(value):
            if not value:
                return ''
            import win32crypt
            return win32crypt.CryptUnprotectData(base64.b64decode(value), None, None, None, 0)[1].decode('utf-8')
        
        def _mcp_rpc(url, method, params=None, session_id=None, bearer='', timeout=35, notification=False):
            import requests
            headers = {'Accept': 'application/json, text/event-stream', 'Content-Type': 'application/json', 'MCP-Protocol-Version': '2025-11-25'}
            if session_id:
                headers['Mcp-Session-Id'] = session_id
            if bearer:
                headers['Authorization'] = 'Bearer ' + bearer
            payload = {'jsonrpc': '2.0', 'method': method}
            if params is not None:
                payload['params'] = params
            if not notification:
                payload['id'] = uuid.uuid4().hex[:12]
            response = requests.post(url, headers=headers, json=payload, timeout=(10, timeout), allow_redirects=False)
            new_session = response.headers.get('Mcp-Session-Id') or session_id
            try:
                data = response.json()
            except Exception:
                parsed = parse_sse_json_messages(response.content)
                data = next((x for x in reversed(parsed) if not notification and x.get('id') == payload.get('id')), parsed[-1] if parsed else {})
            if 300 <= response.status_code < 400:
                raise RuntimeError('Remote MCP redirected to another URL; enter the final HTTPS endpoint directly')
            if response.status_code >= 400:
                raise RuntimeError('Remote MCP HTTP %s: %s' % (response.status_code, str(data)[:800]))
            if isinstance(data, dict) and data.get('error'):
                raise RuntimeError('Remote MCP RPC error: ' + str(data['error'])[:800])
            return (data, new_session)
        
        def _call_external_mcp(server_name, method, params=None, timeout=35):
            registry = _load_mcp_registry()
            item = registry.get(server_name)
            if not item:
                raise ValueError('MCP server is not registered')
            url = _validate_public_mcp_url(item.get('url'))
            token = _unprotect_mcp_token(item.get('token_dpapi', ''))
            init, session = _mcp_rpc(url, 'initialize', {'protocolVersion': '2025-11-25', 'capabilities': {}, 'clientInfo': {'name': 'UE-Remote-MCP-Gateway', 'version': '1.0'}}, bearer=token, timeout=timeout)
            _mcp_rpc(url, 'notifications/initialized', bearer=token, session_id=session, notification=True, timeout=timeout)
            result, session = _mcp_rpc(url, method, params or {}, bearer=token, session_id=session, timeout=timeout)
            return result
        
