name: Unreal Engine 5.8 - Python API Quick Tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal-python-api:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare and validate
        shell: pwsh
        env:
          COMMAND_TOKEN: ${{ secrets.COMMAND_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:COMMAND_TOKEN) -or
              $env:COMMAND_TOKEN.Length -lt 32) {
            throw "Create a COMMAND_TOKEN repository secret with at least 32 characters."
          }

          New-Item -ItemType Directory -Force -Path `
            D:\UE58, D:\UE58\Parts, D:\UE58\Extracted, `
            D:\UE58\Logs, D:\UE58\Queue, `
            D:\UE58\UEControl\Config, `
            D:\UE58\UEControl\Content\Python | Out-Null

          Write-Host "Prepared Unreal workspace."

      - name: Download Unreal Engine release parts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          gh release download ue5.8 `
            --repo forgotenmywin/Windows_with_no_vnc `
            --pattern 'UE_5.8.zip.*' `
            --dir D:\UE58\Parts

          if ($LASTEXITCODE -ne 0) {
            throw "Could not download release assets."
          }

          $parts = @(1..8 | ForEach-Object {
            "D:\UE58\Parts\UE_5.8.zip.{0:D3}" -f $_
          })

          foreach ($part in $parts) {
            if (!(Test-Path $part)) {
              throw "Missing release part: $part"
            }
          }

          $zip = "D:\UE58\UE_5.8.zip"
          $out = [System.IO.File]::Create($zip)

          try {
            foreach ($part in $parts) {
              Write-Host "Joining $(Split-Path $part -Leaf)"
              $inputStream = [System.IO.File]::OpenRead($part)
              try {
                $inputStream.CopyTo($out)
              }
              finally {
                $inputStream.Dispose()
              }
            }
          }
          finally {
            $out.Dispose()
          }

          Remove-Item D:\UE58\Parts -Recurse -Force

          Write-Host "Combined ZIP:"
          Get-Item $zip | Format-List FullName, Length

      - name: Extract Unreal Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          choco install 7zip -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install 7-Zip."
          }

          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          $zip = "D:\UE58\UE_5.8.zip"
          $dest = "D:\UE58\Extracted"

          & $sevenZip t $zip
          if ($LASTEXITCODE -ne 0) {
            throw "The combined ZIP failed its integrity test."
          }

          & $sevenZip x $zip "-o$dest" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Unreal Engine extraction failed."
          }

          Remove-Item $zip -Force
          Write-Host "Engine extracted."

      - name: Create project and Python API bridge
        shell: pwsh
        env:
          COMMAND_TOKEN: ${{ secrets.COMMAND_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $project = "D:\UE58\UEControl"
          $config = "$project\Config"
          $pythonDir = "$project\Content\Python"

          New-Item -ItemType Directory -Force `
            -Path $config, $pythonDir | Out-Null

          @'
          {
            "FileVersion": 3,
            "EngineAssociation": "",
            "Category": "",
            "Description": "Unreal Python HTTP API",
            "Plugins": [
              {
                "Name": "PythonScriptPlugin",
                "Enabled": true
              },
              {
                "Name": "EditorScriptingUtilities",
                "Enabled": true
              }
            ]
          }
          '@ | Set-Content "$project\UEControl.uproject" -Encoding utf8

          @'
          [/Script/PythonScriptPlugin.PythonScriptPluginSettings]
          bRemoteExecution=False
          '@ | Set-Content "$config\DefaultEngine.ini" -Encoding utf8

          $python = @'
          import contextlib
          import hmac
          import http.server
          import io
          import json
          import os
          import queue
          import threading
          import time
          import traceback
          from collections import deque
          from urllib.parse import urlparse, parse_qs
          import unreal

          HOST = "127.0.0.1"
          PORT = 8765
          TOKEN = os.environ.get("UE_COMMAND_TOKEN", "")
          LOG_FILE = os.environ.get(
              "UE_EDITOR_LOG_FILE",
              r"D:\UE58\Logs\unreal-editor.log"
          )
          jobs = queue.Queue()
          started = False
          recent_logs = deque(maxlen=1000)
          log_lock = threading.Lock()

          def remember(message):
              entry = {
                  "time": time.strftime("%Y-%m-%d %H:%M:%S"),
                  "message": str(message)
              }
              with log_lock:
                  recent_logs.append(entry)

          def get_recent_logs(count):
              with log_lock:
                  return list(recent_logs)[-count:]

          def read_editor_log(count):
              # Read only the last 4 MiB so a large log cannot exhaust memory.
              if not os.path.isfile(LOG_FILE):
                  return [], "Log file does not exist yet"
              try:
                  with open(LOG_FILE, "rb") as handle:
                      handle.seek(0, os.SEEK_END)
                      size = handle.tell()
                      handle.seek(max(0, size - 4 * 1024 * 1024), os.SEEK_SET)
                      raw = handle.read()
                  lines = raw.decode("utf-8", errors="replace").splitlines()
                  return lines[-count:], None
              except Exception as exc:
                  return [], str(exc)

          def authorized(handler):
              supplied = handler.headers.get("Authorization", "")
              expected = "Bearer " + TOKEN
              return bool(TOKEN) and hmac.compare_digest(supplied, expected)

          class Job:
              def __init__(self, code):
                  self.code = code
                  self.done = threading.Event()
                  self.result = None

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  remember("HTTP " + (fmt % args))

              def reply(self, status, data):
                  body = json.dumps(data, ensure_ascii=False).encode("utf-8")
                  self.send_response(status)
                  self.send_header(
                      "Content-Type",
                      "application/json; charset=utf-8"
                  )
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  parsed = urlparse(self.path)

                  if parsed.path == "/health":
                      self.reply(200, {
                          "ok": True,
                          "service": "unreal-python-api",
                          "api_version": "logs-v2-2026-10-27",
                          "endpoints": ["/health", "/command", "/logs"],
                          "editor_log_configured": bool(LOG_FILE)
                      })
                      return

                  if parsed.path == "/logs":
                      if not authorized(self):
                          self.reply(401, {
                              "ok": False,
                              "error": "Unauthorized; send Authorization: Bearer <token>"
                          })
                          return

                      try:
                          query = parse_qs(parsed.query)
                          count = int(query.get("lines", ["200"])[0])
                          count = max(1, min(count, 2000))
                      except (ValueError, TypeError):
                          count = 200

                      editor_lines, log_error = read_editor_log(count)
                      self.reply(200, {
                          "ok": True,
                          "log_file": LOG_FILE,
                          "requested_lines": count,
                          "editor_log": editor_lines,
                          "api_log": get_recent_logs(count),
                          "log_file_error": log_error
                      })
                      return

                  self.reply(404, {"ok": False, "error": "Not found"})

              def do_POST(self):
                  parsed = urlparse(self.path)
                  if parsed.path != "/command":
                      self.reply(404, {"ok": False, "error": "Not found"})
                      return

                  if not authorized(self):
                      self.reply(401, {"ok": False, "error": "Unauthorized"})
                      return

                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                      if length < 1 or length > 1048576:
                          self.reply(413, {
                              "ok": False,
                              "error": "Body must be between 1 byte and 1 MB"
                          })
                          return

                      data = json.loads(
                          self.rfile.read(length).decode("utf-8")
                      )
                      code = data.get("code") if isinstance(data, dict) else None

                      if not isinstance(code, str) or not code.strip():
                          self.reply(400, {
                              "ok": False,
                              "error": "Provide a non-empty code string"
                          })
                          return

                      job = Job(code)
                      jobs.put(job)
                      remember("Queued remote Python command")

                      if not job.done.wait(240):
                          remember("Remote command timed out waiting for Unreal Editor")
                          self.reply(504, {
                              "ok": False,
                              "error": "Unreal command timed out"
                          })
                          return

                      result = job.result or {
                          "ok": False,
                          "error": "No result"
                      }
                      self.reply(200 if result.get("ok") else 500, result)

                  except Exception as exc:
                      remember("HTTP command error: " + str(exc))
                      self.reply(400, {
                          "ok": False,
                          "error": str(exc)
                      })

          def editor_tick(delta_seconds):
              try:
                  job = jobs.get_nowait()
              except queue.Empty:
                  return

              output = io.StringIO()
              namespace = {"unreal": unreal}
              remember("Executing remote Python command")

              try:
                  with contextlib.redirect_stdout(output):
                      with contextlib.redirect_stderr(output):
                          exec(
                              compile(job.code, "<remote-command>", "exec"),
                              namespace,
                              namespace
                          )

                  captured = output.getvalue()
                  job.result = {"ok": True, "output": captured}
                  remember("Command succeeded. Captured output: " + (captured or "<empty>"))
                  unreal.log("Remote Python command completed.")
                  if captured:
                      unreal.log("Remote Python output: " + captured[-4000:])

              except Exception:
                  captured = output.getvalue()
                  error = traceback.format_exc()
                  job.result = {
                      "ok": False,
                      "output": captured,
                      "error": error
                  }
                  remember("Command failed: " + error)
                  unreal.log_error(error)

              finally:
                  job.done.set()

          def start_api():
              global started

              if started:
                  return

              if not TOKEN:
                  unreal.log_error(
                      "UE_COMMAND_TOKEN is missing; API not started."
                  )
                  return

              started = True
              unreal.register_slate_post_tick_callback(editor_tick)

              def serve():
                  try:
                      server = http.server.ThreadingHTTPServer(
                          (HOST, PORT), Handler
                      )
                      server.daemon_threads = True
                      remember("HTTP API listening on {}:{}".format(HOST, PORT))
                      server.serve_forever()
                  except Exception as exc:
                      remember("HTTP server failed: " + repr(exc))

              threading.Thread(
                  target=serve,
                  name="UEPythonAPI",
                  daemon=True
              ).start()

              remember("Unreal Python API initialized")
              unreal.log("Unreal Python API initialized.")

          start_api()
          '@

          $bootstrap = "$pythonDir\init_unreal.py"
          Set-Content $bootstrap -Value $python -Encoding utf8
          Write-Host "Python API bridge with /logs endpoint created: $bootstrap"
          Write-Host "API version: logs-v2-2026-10-27"

      - name: Start Unreal and Cloudflare Quick Tunnel
        shell: pwsh
        env:
          COMMAND_TOKEN: ${{ secrets.COMMAND_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $root = "D:\UE58"
          $log = "$root\Logs\unreal-editor.log"
          $tunnelLog = "$root\Logs\cloudflared.log"
          $tunnelErr = "$root\Logs\cloudflared-error.log"

          $engine = Get-ChildItem "$root\Extracted" `
            -Filter UnrealEditor.exe -File -Recurse |
            Where-Object {
              $_.FullName -match `
                '\\Engine\\Binaries\\Win64\\UnrealEditor\.exe$'
            } |
            Select-Object -First 1

          if (!$engine) {
            throw "UnrealEditor.exe was not found."
          }

          $env:UE_COMMAND_TOKEN = $env:COMMAND_TOKEN
          $env:UE_EDITOR_LOG_FILE = $log
          $startupScript = "$root\UEControl\Content\Python\init_unreal.py"

          if (!(Test-Path $startupScript)) {
            throw "Python startup script was not created: $startupScript"
          }

          $editorArgs = @(
            "$root\UEControl\UEControl.uproject",
            '-EnablePlugins=PythonScriptPlugin,EditorScriptingUtilities',
            '-AllowSoftwareRendering',
            '-d3d11',
            "-abslog=$log"
          )

          $editor = Start-Process `
            -FilePath $engine.FullName `
            -ArgumentList $editorArgs `
            -WorkingDirectory $engine.DirectoryName `
            -PassThru

          Set-Content "$root\unreal-editor.pid" $editor.Id

          $cf = "$root\cloudflared.exe"
          Invoke-WebRequest `
            'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' `
            -OutFile $cf

          $tunnel = Start-Process `
            -FilePath $cf `
            -ArgumentList @(
              'tunnel',
              '--no-autoupdate',
              '--url',
              'http://127.0.0.1:8765',
              '--logfile',
              $tunnelLog
            ) `
            -PassThru `
            -RedirectStandardError $tunnelErr `
            -RedirectStandardOutput "$root\Logs\cloudflared-stdout.log"

          Set-Content "$root\cloudflared.pid" $tunnel.Id

          $deadline = (Get-Date).AddMinutes(5)
          $url = $null

          while ((Get-Date) -lt $deadline) {
            if (!(Get-Process -Id $editor.Id -ErrorAction SilentlyContinue)) {
              if (Test-Path $log) { Get-Content $log -Tail 100 }
              throw "Unreal Editor exited during startup."
            }

            foreach ($file in @(
              $tunnelLog,
              $tunnelErr,
              "$root\Logs\cloudflared-stdout.log"
            )) {
              if (Test-Path $file) {
                $match = Select-String -Path $file `
                  -Pattern 'https://[a-z0-9-]+\.trycloudflare\.com' `
                  -AllMatches -ErrorAction SilentlyContinue |
                  Select-Object -First 1

                if ($match -and $match.Matches.Count -gt 0) {
                  $url = $match.Matches[0].Value
                  break
                }
              }
            }

            if ($url) { break }
            Start-Sleep -Seconds 3
          }

          if (!$url) {
            if (Test-Path $tunnelLog) { Get-Content $tunnelLog -Tail 80 }
            if (Test-Path $tunnelErr) { Get-Content $tunnelErr -Tail 80 }
            throw "Cloudflare Quick Tunnel URL was not found."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "PUBLIC API URL: $url"
          Write-Host "HEALTH URL:     $url/health"
          Write-Host "COMMAND URL:    $url/command"
          Write-Host "LOGS URL:       $url/logs?lines=200"
          Write-Host "LOGS AUTH:      Authorization: Bearer YOUR_TOKEN"
          Write-Host "METHOD:         POST for /command; GET for /logs"
          Write-Host 'JSON BODY:      {"code":"import unreal; unreal.log(\"Hi\")"}'
          Write-Host "=============================================="

          $ready = $false
          $readyDeadline = (Get-Date).AddMinutes(5)

          while ((Get-Date) -lt $readyDeadline) {
            if (!(Get-Process -Id $editor.Id -ErrorAction SilentlyContinue)) {
              if (Test-Path $log) { Get-Content $log -Tail 160 }
              throw "Unreal Editor stopped before the API became ready."
            }

            try {
              $health = Invoke-RestMethod `
                -Uri 'http://127.0.0.1:8765/health' `
                -TimeoutSec 3
              if ($health.ok -and
                  $health.service -eq 'unreal-python-api' -and
                  $health.api_version -eq 'logs-v2-2026-10-27') {
                $ready = $true
                break
              }
            }
            catch {}

            Start-Sleep -Seconds 3
          }

          if (!$ready) {
            Write-Host "ERROR: Local Unreal Python API health check failed."
            if (Test-Path $log) { Get-Content $log -Tail 160 }
            throw "Python API did not start. Check init_unreal.py startup errors in the Unreal log."
          }

          Write-Host "Local Unreal Python API is ready."

          $publicReady = $false
          $publicDeadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $publicDeadline) {
            try {
              $publicHealth = Invoke-RestMethod `
                -Uri "$url/health" `
                -TimeoutSec 10
              if ($publicHealth.ok -and
                  $publicHealth.service -eq 'unreal-python-api' -and
                  $publicHealth.api_version -eq 'logs-v2-2026-10-27') {
                $publicReady = $true
                break
              }
            }
            catch {}
            Start-Sleep -Seconds 4
          }

          if (!$publicReady) {
            Write-Host "WARNING: Local API works, but public tunnel health check failed."
            if (Test-Path $tunnelLog) { Get-Content $tunnelLog -Tail 80 }
          }
          else {
            Write-Host "PUBLIC API HEALTH CHECK PASSED."
          }

          while (
            (Get-Process -Id $editor.Id -ErrorAction SilentlyContinue) -and
            (Get-Process -Id $tunnel.Id -ErrorAction SilentlyContinue)
          ) {
            Start-Sleep -Seconds 30
            Write-Host (
              "Unreal={0} | Tunnel={1}" -f
              [bool](Get-Process -Id $editor.Id -ErrorAction SilentlyContinue),
              [bool](Get-Process -Id $tunnel.Id -ErrorAction SilentlyContinue)
            )
          }

          if (Test-Path $log) { Get-Content $log -Tail 120 }
          throw "Unreal or Cloudflare stopped. The API is offline."
