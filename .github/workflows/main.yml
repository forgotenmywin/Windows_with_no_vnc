        def _available_log_sources():
            sources = {'api': LOG_FILE, 'api-stdout': LOG_DIR / 'api-stdout.log', 'api-stderr': LOG_DIR / 'api-stderr.log', 'bridge': LOG_DIR / 'unreal_bridge.log', 'unreal-stdout': LOG_DIR / 'unreal-stdout.log', 'unreal-stderr': LOG_DIR / 'unreal-stderr.log', 'cloudflared-stdout': LOG_DIR / 'cloudflared-stdout.log', 'cloudflared-stderr': LOG_DIR / 'cloudflared-stderr.log', 'workflow-prepare': LOG_DIR / 'workflow-prepare-transcript.log', 'workflow-extract': LOG_DIR / 'workflow-extract-transcript.log', 'workflow-setup': LOG_DIR / 'workflow-setup-transcript.log', 'workflow-validation': LOG_DIR / 'workflow-validation-transcript.log', 'workflow-runtime': LOG_DIR / 'workflow-runtime-transcript.log'}
            project_logs = set()
            try:
                project_logs.add(_current_project().parent / 'Saved' / 'Logs')
            except Exception:
                pass
            project_logs.add(ROOT / 'UEControl' / 'Saved' / 'Logs')
            for unreal_log_dir in project_logs:
                if unreal_log_dir.is_dir():
