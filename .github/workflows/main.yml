        def _start_monitor_capture(force=False):
            """Start at most one low-frequency viewport capture worker."""
            with MONITOR_LOCK:
                if MONITOR_STATE["capture_running"]:
                    if force:
                        MONITOR_STATE["capture_again"] = True
                    return {"ok": True, "status": "already_running"}, 202
                if force:
                    MONITOR_STATE["capture_requested"] = True
                if not MONITOR_STATE["capture_requested"]:
                    return {"ok": True, "status": "not_requested"}, 200
                now = time.time()
                cooldown_left = 30 - (now - MONITOR_STATE["last_capture_request"])
                if cooldown_left > 0 and not force:
                    return {"ok": True, "status": "throttled",
                            "retry_after_seconds": int(cooldown_left) + 1}, 202
                MONITOR_STATE["capture_requested"] = False
                MONITOR_STATE["capture_running"] = True
                MONITOR_STATE["last_capture_request"] = now
            threading.Thread(target=monitor_capture_worker, name="UE-Monitor-Capture", daemon=True).start()
            return {"ok": True, "status": "capture_started"}, 202


