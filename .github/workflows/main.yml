name: Unreal Engine 5.8 - Windows Remote Session

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Select non-C drive and check disk space
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $drives = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Where-Object { $_.DeviceID -ne "C:" } |
            Sort-Object FreeSpace -Descending

          if (-not $drives) {
            throw "No local drive other than C: is available."
          }

          $drive = $drives | Select-Object -First 1
          $freeGB = [math]::Round($drive.FreeSpace / 1GB, 2)

          Write-Host "Selected drive: $($drive.DeviceID)"
          Write-Host "Free space: $freeGB GB"

          if ($freeGB -lt 100) {
            throw "Insufficient free space for a large Unreal Engine ZIP and extraction. Available: $freeGB GB"
          }

          $work = "$($drive.DeviceID)\UE58"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          "UE_WORK_DIR=$work" | Out-File $env:GITHUB_ENV -Append

      - name: Download Unreal Engine from Google Drive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade gdown
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install gdown."
          }

          $zip = "$env:UE_WORK_DIR\UE_5.8.zip"
          $url = "https://drive.google.com/uc?id=1MTby51iqiUNSUOxLxLUs-oaKhJfgyV2Y"

          python -m gdown "$url" -O "$zip"
          if ($LASTEXITCODE -ne 0) {
            throw "Google Drive download failed. Check link access and download quota."
          }

          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 100MB) {
            throw "Downloaded file is missing or unexpectedly small."
          }

          Write-Host "ZIP downloaded successfully."

      - name: Extract Unreal Engine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "$env:UE_WORK_DIR\UE_5.8.zip"
          $dest = "$env:UE_WORK_DIR\Extracted"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # Install 7-Zip for large archives
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"

          if (!(Test-Path $sevenZip)) {
            winget install --id 7zip.7zip --exact `
              --silent --accept-package-agreements `
              --accept-source-agreements

            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip installation failed."
            }
          }

          if (!(Test-Path $sevenZip)) {
            throw "7-Zip executable was not found."
          }

          & $sevenZip t "$zip"
          if ($LASTEXITCODE -ne 0) {
            throw "ZIP integrity test failed."
          }

          & $sevenZip x "$zip" "-o$dest" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Extraction failed. Check available disk space."
          }

          Write-Host "Extraction completed: $dest"

      - name: Configure RDP account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in GitHub repository Actions secrets."
          }

          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "runneradmin" -Password $secure
          } else {
            New-LocalUser -Name "runneradmin" `
              -Password $secure `
              -PasswordNeverExpires `
              -AccountNeverExpires | Out-Null
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "runneradmin" -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $cloudflared = "$env:RUNNER_TEMP\cloudflared.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          $log = "$env:RUNNER_TEMP\cloudflared.log"

          $proc = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList "tunnel --no-autoupdate --url http://localhost:6080" `
            -RedirectStandardOutput $log `
            -RedirectStandardError "$env:RUNNER_TEMP\cloudflared-error.log" `
            -PassThru

          Start-Sleep -Seconds 15

          if (Test-Path $log) {
            Get-Content $log
          }

          Write-Host "Cloudflare process ID: $($proc.Id)"
          Write-Host "The tunnel only works when a web service is listening on port 6080."

      - name: Keep session alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Unreal Engine files are located at: $env:UE_WORK_DIR"
          Write-Host "The GitHub-hosted session is temporary."

          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "Session active: $(Get-Date -Format o)"
          }
