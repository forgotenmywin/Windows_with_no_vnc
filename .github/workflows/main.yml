
name: Unreal Engine 5.8 - Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unreal-machine:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in GitHub Actions secrets."
          }

          $account = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue

          if ($null -eq $account) {
            $accountName = $env:USERNAME
          } else {
            $accountName = "runneradmin"
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          Set-LocalUser -Name $accountName -Password $securePassword

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Get-NetFirewallRule |
            Where-Object { $_.DisplayGroup -eq 'Remote Desktop' } |
            Enable-NetFirewallRule -ErrorAction SilentlyContinue

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP configured for account: $accountName"

      - name: Install TightVNC with Loopback enabled
        shell: powershell
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Add VNC_PASSWORD in GitHub Actions secrets."
          }

          if ($env:VNC_PASSWORD.Length -gt 8) {
            throw "For TightVNC 2.8, use a VNC password of 8 characters or fewer."
          }

          $work = 'D:\UE58'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $msi = Join-Path $work 'tightvnc.msi'
          $url = 'https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi'

          Invoke-WebRequest -Uri $url -OutFile $msi

          $msiArgs = @(
            '/i'
            "`"$msi`""
            '/quiet'
            '/norestart'
            'ADDLOCAL=Server'
            'SERVER_REGISTER_AS_SERVICE=1'
            'SERVER_ADD_FIREWALL_EXCEPTION=1'
            'SET_ACCEPTRFBCONNECTIONS=1'
            'VALUE_OF_ACCEPTRFBCONNECTIONS=1'
            'SET_USEVNCAUTHENTICATION=1'
            'VALUE_OF_USEVNCAUTHENTICATION=1'
            'SET_PASSWORD=1'
            "VALUE_OF_PASSWORD=$($env:VNC_PASSWORD)"
            'SET_ALLOWLOOPBACK=1'
            'VALUE_OF_ALLOWLOOPBACK=1'
            'SET_LOOPBACKONLY=1'
            'VALUE_OF_LOOPBACKONLY=1'
          )

          $install = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList $msiArgs `
            -Wait -PassThru

          if ($install.ExitCode -notin @(0, 3010)) {
            throw "TightVNC installation failed. Exit code: $($install.ExitCode)"
          }

          # Apply the loopback settings explicitly as well.
          $regPath = 'HKLM:\SOFTWARE\TightVNC\Server'
          if (-not (Test-Path $regPath)) {
            New-Item -Path $regPath -Force | Out-Null
          }

          New-ItemProperty -Path $regPath -Name 'AllowLoopback' `
            -PropertyType DWord -Value 1 -Force | Out-Null

          New-ItemProperty -Path $regPath -Name 'LoopbackOnly' `
            -PropertyType DWord -Value 1 -Force | Out-Null

          New-ItemProperty -Path $regPath -Name 'AcceptRfbConnections' `
            -PropertyType DWord -Value 1 -Force | Out-Null

          $tvn = 'C:\Program Files\TightVNC\tvnserver.exe'

          if (-not (Test-Path $tvn)) {
            throw "TightVNC server executable was not found."
          }

          # Reload the configuration and restart the service.
          & $tvn -reload
          Start-Sleep -Seconds 2

          $service = Get-Service -Name 'tvnserver' -ErrorAction SilentlyContinue

          if ($null -ne $service) {
            if ($service.Status -eq 'Running') {
              Restart-Service -Name 'tvnserver' -Force
            } else {
              Start-Service -Name 'tvnserver'
            }
          } else {
            & $tvn -start
          }

          Start-Sleep -Seconds 5

          $listening = $false
          for ($i = 0; $i -lt 30; $i++) {
            $socket = Get-NetTCPConnection `
              -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue

            if ($socket) {
              $listening = $true
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $listening) {
            Write-Host "TightVNC is not listening on port 5900."
            Get-Service | Where-Object {
              $_.Name -match 'tvnserver|tightvnc'
            } | Format-Table -AutoSize

            throw "VNC port 5900 did not start."
          }

          Write-Host "TightVNC is listening on port 5900."
          Write-Host "AllowLoopback=1; LoopbackOnly=1"

      - name: Install noVNC and start Websockify
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $work = 'D:\UE58'
          $noVnc = Join-Path $work 'noVNC'
          $logs = Join-Path $work 'Logs'

          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          if (-not (Test-Path $noVnc)) {
            git clone --depth 1 https://github.com/novnc/noVNC.git $noVnc
          }

          python -m pip install --upgrade pip websockify

          $python = (Get-Command python).Source
          $scripts = Join-Path (Split-Path $python) 'Scripts'
          $websockify = Join-Path $scripts 'websockify.exe'

          if (-not (Test-Path $websockify)) {
            $websockifyCommand = Get-Command websockify -ErrorAction SilentlyContinue

            if ($null -eq $websockifyCommand) {
              throw "Could not find the websockify executable."
            }

            $websockify = $websockifyCommand.Source
          }

          $outLog = Join-Path $logs 'websockify-out.log'
          $errLog = Join-Path $logs 'websockify-err.log'

          $proxy = Start-Process `
            -FilePath $websockify `
            -ArgumentList @('--web', $noVnc, '6080', '127.0.0.1:5900') `
            -WorkingDirectory $work `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog `
            -PassThru

          Set-Content -Path (Join-Path $work 'websockify.pid') `
            -Value $proxy.Id

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1

            $port = Get-NetTCPConnection `
              -LocalPort 6080 -State Listen -ErrorAction SilentlyContinue

            if ($port) {
              $ready = $true
              break
            }
          }

          if (-not $ready) {
            if (Test-Path $outLog) { Get-Content $outLog -Tail 50 }
            if (Test-Path $errLog) { Get-Content $errLog -Tail 50 }
            throw "Websockify did not start on port 6080."
          }

          Write-Host "Websockify is listening on port 6080."
          Write-Host "VNC target: 127.0.0.1:5900"

      - name: Start temporary Cloudflare tunnel
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $work = 'D:\UE58'
          $logs = Join-Path $work 'Logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          $cloudflared = Join-Path $work 'cloudflared.exe'
          $url = 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'

          Invoke-WebRequest -Uri $url -OutFile $cloudflared

          $stdout = Join-Path $logs 'cloudflared-out.log'
          $stderr = Join-Path $logs 'cloudflared-err.log'

          $tunnel = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @('tunnel', '--url', 'http://127.0.0.1:6080', '--no-autoupdate') `
            -WorkingDirectory $work `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          Set-Content -Path (Join-Path $work 'cloudflared.pid') `
            -Value $tunnel.Id

          $publicUrl = $null

          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2

            $combined = ''

            if (Test-Path $stdout) {
              $combined += Get-Content $stdout -Raw
            }

            if (Test-Path $stderr) {
              $combined += Get-Content $stderr -Raw
            }

            $match = [regex]::Match(
              $combined,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {
              $publicUrl = $match.Value
              break
            }

            if ($tunnel.HasExited) {
              throw "Cloudflare tunnel exited before providing a URL."
            }
          }

          if (-not $publicUrl) {
            if (Test-Path $stdout) { Get-Content $stdout -Tail 60 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 60 }
            throw "Cloudflare did not provide a public URL."
          }

          $novncUrl = "$publicUrl/vnc.html?autoconnect=true&resize=scale"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "OPEN THIS noVNC URL:"
          Write-Host $novncUrl
          Write-Host "=============================================="
          Write-Host "The tunnel is temporary and lasts only while this job runs."

      - name: Download and extract Unreal Engine 5.8
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $work = 'D:\UE58'
          $partsDir = Join-Path $work 'Parts'
          $zip = Join-Path $work 'UE_5.8.zip'
          $dest = Join-Path $work 'Extracted'
          $logs = Join-Path $work 'Logs'

          New-Item -ItemType Directory -Force -Path $partsDir, $dest, $logs | Out-Null

          gh release download ue5.8 `
            --repo forgotenmywin/Windows_with_no_vnc `
            --pattern 'UE_5.8.zip.*' `
            --dir $partsDir

          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the Unreal Engine ZIP parts from release ue5.8."
          }

          $files = @(
            1..8 | ForEach-Object {
              Join-Path $partsDir ('UE_5.8.zip.{0:D3}' -f $_)
            }
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing ZIP part: $file"
            }
          }

          Write-Host "Joining the eight ZIP parts..."

          $expectedSize = (
            Get-Item $files |
              Measure-Object -Property Length -Sum
          ).Sum

          $output = [System.IO.File]::Create($zip)

          try {
            foreach ($file in $files) {
              Write-Host "Joining $([System.IO.Path]::GetFileName($file))"

              $inputStream = [System.IO.File]::OpenRead($file)

              try {
                $inputStream.CopyTo($output)
              }
              finally {
                $inputStream.Dispose()
              }
            }
          }
          finally {
            $output.Dispose()
          }

          if ((Get-Item $zip).Length -ne $expectedSize) {
            throw "The joined ZIP size does not match the combined part sizes."
          }

          # Free space before extracting the large archive.
          Remove-Item -Path $partsDir -Recurse -Force

          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'

          if (-not (Test-Path $sevenZip)) {
            $sevenZipCommand = Get-Command 7z.exe -ErrorAction SilentlyContinue

            if ($null -ne $sevenZipCommand) {
              $sevenZip = $sevenZipCommand.Source
            } else {
              choco install 7zip -y --no-progress

              if ($LASTEXITCODE -ne 0) {
                throw "Could not install 7-Zip."
              }
            }
          }

          if (-not (Test-Path $sevenZip)) {
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          }

          if (-not (Test-Path $sevenZip)) {
            throw "7-Zip executable was not found."
          }

          Write-Host "Testing the joined archive..."

          $testLog = Join-Path $logs 'zip-test.log'
          $testError = Join-Path $logs 'zip-test-error.log'

          $test = Start-Process `
            -FilePath $sevenZip `
            -ArgumentList @('t', $zip) `
            -Wait -PassThru `
            -RedirectStandardOutput $testLog `
            -RedirectStandardError $testError

          if ($test.ExitCode -ne 0) {
            if (Test-Path $testLog) { Get-Content $testLog -Tail 80 }
            if (Test-Path $testError) { Get-Content $testError -Tail 80 }
            throw "ZIP integrity test failed."
          }

          Write-Host "Extracting Unreal Engine..."

          $extractLog = Join-Path $logs 'extract.log'
          $extractError = Join-Path $logs 'extract-error.log'

          $extract = Start-Process `
            -FilePath $sevenZip `
            -ArgumentList @('x', $zip, "-o$dest", '-y') `
            -Wait -PassThru `
            -RedirectStandardOutput $extractLog `
            -RedirectStandardError $extractError

          if ($extract.ExitCode -ne 0) {
            if (Test-Path $extractLog) { Get-Content $extractLog -Tail 100 }
            if (Test-Path $extractError) { Get-Content $extractError -Tail 100 }
            throw "Unreal Engine extraction failed."
          }

          Write-Host "Unreal Engine extraction completed."

      - name: Start Unreal Editor
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'

          $dest = 'D:\UE58\Extracted'
          $logs = 'D:\UE58\Logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          $editor = Get-ChildItem -Path $dest `
            -Filter 'UnrealEditor.exe' -File -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '\\Engine\\Binaries\\Win64\\UnrealEditor\.exe$'
            } |
            Select-Object -First 1

          if ($null -eq $editor) {
            Write-Host "UnrealEditor.exe was not found in the extracted files."
            Get-ChildItem -Path $dest -Filter 'UnrealEditor-Cmd.exe' `
              -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 5 -ExpandProperty FullName
            exit 0
          }

          Write-Host "Editor path: $($editor.FullName)"

          $editorLog = Join-Path $logs 'unreal-editor.log'

          $process = Start-Process `
            -FilePath $editor.FullName `
            -ArgumentList @('-AllowSoftwareRendering', '-d3d11', "-log=$editorLog") `
            -WorkingDirectory $editor.DirectoryName `
            -PassThru

          Set-Content -Path 'D:\UE58\unreal-editor.pid' -Value $process.Id

          Write-Host "Unreal Editor launched with PID $($process.Id)."
          Write-Host "If no project is supplied, the editor may display the project browser."

      - name: Keep remote machine alive and report status
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $work = 'D:\UE58'
          $logs = Join-Path $work 'Logs'

          while ($true) {
            $vnc = Get-NetTCPConnection `
              -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue

            $proxy = Get-NetTCPConnection `
              -LocalPort 6080 -State Listen -ErrorAction SilentlyContinue

            $editor = Get-Process -Name 'UnrealEditor' `
              -ErrorAction SilentlyContinue

            $tunnel = Get-Process -Name 'cloudflared' `
              -ErrorAction SilentlyContinue

            $vncStatus = if ($vnc) { 'LISTENING' } else { 'STOPPED' }
            $proxyStatus = if ($proxy) { 'LISTENING' } else { 'STOPPED' }
            $editorStatus = if ($editor) { 'RUNNING' } else { 'STOPPED' }
            $tunnelStatus = if ($tunnel) { 'RUNNING' } else { 'STOPPED' }

            Write-Host "VNC=$vncStatus | Websockify=$proxyStatus | Unreal=$editorStatus | Cloudflare=$tunnelStatus"

            if (-not $proxy) {
              Write-Host "Websockify is no longer listening. Check websockify logs."
              if (Test-Path (Join-Path $logs 'websockify-err.log')) {
                Get-Content (Join-Path $logs 'websockify-err.log') -Tail 30
              }
            }

            if (-not $vnc) {
              Write-Host "TightVNC is no longer listening on port 5900."
            }

            if (-not $editor -and (Test-Path (Join-Path $logs 'unreal-editor.log'))) {
              Write-Host "Recent Unreal Editor log:"
              Get-Content (Join-Path $logs 'unreal-editor.log') -Tail 40
            }

            Start-Sleep -Seconds 60
          }
