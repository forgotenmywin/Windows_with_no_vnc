        \ controls are required.'\n}\n$editorSettingsText = Get-Content -LiteralPath 'D:\\UE58\\UEControl\\Config\\DefaultEditorSettings.ini'\
        \ -Raw -Encoding utf8\nif ($editorSettingsText -notmatch 'bThrottleCPUWhenNotForeground=True' -or $editorSettingsText\
        \ -notmatch 'bDisableRealtimeViewportsInRemoteSessions=True') {\n  throw 'EDITOR_PERFORMANCE_SETTINGS_MISSING: remote/background\
        \ viewport throttling defaults were not generated.'\n}\nif ($apiText -notmatch 'MCP_NATIVE_TOOL_ACTIVE' -or $apiText\
        \ -notmatch 'editor_busy=editor_busy' -or $bridgeText -notmatch 'REMOTE_TOOL_ACTIVE') {\n  throw 'NATIVE_MCP_WAKE_VALIDATION_FAILED:\
        \ native AllToolsets calls must wake the Editor power mode.'\n}\nWrite-Host 'NATIVE_MCP_WAKE_VALIDATION=true'\nWrite-Host\
        \ 'EDITOR_IDLE_POWER_MODE_VALIDATION=true'\nWrite-Host 'DEDICATED_BRIDGE_VALIDATION=true'\nif ($apiText -notmatch\
        \ 'def editor_tick_age_seconds' -or $apiText -notmatch 'unreal_editor_not_responsive') {\n  throw 'EDITOR_HEARTBEAT_VALIDATION_FAILED:\
        \ API must verify the actual Unreal Editor tick, not only the bridge network worker.'\n}\nif ($bridgeText -notmatch\
        \ 'editor_tick_at' -or $bridgeText -notmatch 'EDITOR_TICK_AT = time.time\\(\\)') {\n  throw 'EDITOR_TICK_VALIDATION_FAILED:\
        \ bridge must report a live Slate Editor tick.'\n}\nif ($bridgeText -notmatch 'def ensure_network_worker\\(' -or $bridgeText\
        \ -notmatch 'def diagnostic_watchdog\\(' -or $bridgeText -notmatch 'faulthandler.dump_traceback' -or $bridgeText -notmatch\
        \ 'BRIDGE_NETWORK_WORKER_RESTARTED') {\n  throw 'BRIDGE_SELF_HEAL_OR_STACKTRACE_MISSING: the bridge must restart a\
        \ dead network worker and capture Python thread stacks when the Editor stalls.'\n}\nif ($apiText -notmatch 'get_dirty_map_packages'\
        \ -or $apiText -notmatch 'get_dirty_content_packages' -or $apiText -notmatch 'save_packages\\(packages, True\\)')\
        \ {\n  throw 'TARGETED_SAVE_VALIDATION_FAILED: save must target only dirty map/content packages.'\n}\nif ($apiText\
        \ -match 'save_dirty_packages\\(True, True\\)') {\n  throw 'BROAD_SAVE_VALIDATION_FAILED: obsolete broad save call\
        \ remains.'\n}\nWrite-Host 'PYTHON_SYNTAX_VALIDATION=true'\nWrite-Host 'MCP_PROXY_STATIC_VALIDATION=true'\nWrite-Host\
        \ 'EDITOR_TICK_VALIDATION=true'\nWrite-Host 'TARGETED_SAVE_VALIDATION=true'\n$setupText = Get-Content -LiteralPath\
        \ 'D:\\UE58\\UEControl\\Config\\DefaultGame.ini' -Raw -Encoding utf8\nif ($setupText -notmatch 'PrimaryAssetType=\"\
        GameFeatureData\"' -or $setupText -notmatch '/Script/GameFeatures.GameFeatureData') {\n  throw 'GAMEFEATUREDATA_ASSET_MANAGER_RULE_MISSING:\
        \ DefaultGame.ini must register GameFeatureData.'\n}\nif ($bridgeText -match 'UE58 Preview Ground' -or $bridgeText\
        \ -match 'UE58 Preview Cube') {\n  throw 'ENGINE_MAP_PREVIEW_INJECTION_FOUND: preview actors must not be spawned into\
        \ /Engine/Maps/Entry.'\n}\nif ($bridgeText -notmatch 'new_blank_map\\(True\\)' -or $bridgeText -notmatch 'save_map\\\
        (world, map_asset\\)' -or $bridgeText -notmatch 'PROJECT_TREE_MAP_READY') {\n  throw 'PROJECT_TREE_MAP_VALIDATION_FAILED:\
        \ live Editor must create/save the project-owned tree map.'\n}\nif ($apiText -notmatch 'unreal_create_plugin_tree_test_map'\
        \ -or $apiText -notmatch 'confirm_create') {\n  throw 'LIVE_TREE_MAP_MCP_TOOL_MISSING: explicit non-headless map repair\
        \ tool is required.'\n}\nWrite-Host 'GAMEFEATUREDATA_ASSET_MANAGER_VALIDATION=true'\nWrite-Host 'PROJECT_TREE_MAP_VALIDATION=true'\n\
        Write-Host 'LIVE_TREE_MAP_MCP_TOOL_VALIDATION=true'\n\nif ($apiText -notmatch 'def bridge_state_payload' -or $apiText\
        \ -notmatch \"state, message = \\('busy'\" -or $apiText -notmatch 'active_editor_jobs' -or $apiText -notmatch 'EDITOR_PYTHON_JOB_STALE_SECONDS')\
        \ {\n  throw 'BRIDGE_BUSY_DIAGNOSTICS_INVALID: distinguish running jobs, stale jobs and an offline Bridge.'\n}\nif\
        \ ($apiText -notmatch 'def cancel_active_editor_jobs' -or $apiText -notmatch 'cancelled_python_jobs') {\n  throw 'BRIDGE_STALE_JOB_RECOVERY_MISSING:\
        \ confirmed restart must release waiting API jobs.'\n}\nif ($apiText -notmatch 'MCP_NATIVE_TOOL_ACTIVE' -or $apiText\
        \ -notmatch 'native_mcp_tool_active') {\n  throw 'BRIDGE_NATIVE_TOOL_BUSY_VALIDATION_FAILED: native AllToolsets operations\
        \ must be classified as busy, not offline.'\n}\nif ($apiText -notmatch \"@app.post\\('/api/bridge/restart'\\)\" -or\
        \ $apiText -notmatch \"restart_editor\") {\n  throw 'BRIDGE_RECOVERY_ENDPOINT_MISSING: explicit save-aware Editor/Bridge\
        \ restart is required.'\n}\nif ($apiText -notmatch \"@app.get\\('/api/projects/preflight'\\)\" -or $apiText -notmatch\
        \ 'def _project_preflight' -or $apiText -notmatch 'GLTFExporter') {\n  throw 'PROJECT_PREFLIGHT_MISSING: export must\
        \ check project, engine and required plugin files before starting.'\n}\nif ($apiText -notmatch \"@app.post\\('/api/projects/create'\\\
        )\" -or $apiText -notmatch 'def _create_new_project' -or $apiText -notmatch 'confirm_create') {\n  throw 'CREATE_PROJECT_OPTION_MISSING:\
        \ create-project route and guarded confirmation are required.'\n}\nif ($apiText -notmatch 'threeDProjectSelect' -or\
        \ $apiText -notmatch 'threeDCreateProjectBtn' -or $apiText -notmatch 'threeDRestartBridgeBtn' -or $apiText -notmatch\
        \ 'project_file:project') {\n  throw 'THREE_D_PROJECT_SELECTOR_UI_MISSING: project selection, create and Bridge recovery\
        \ must be visible in 3D Export.'\n}\nif ($apiText -notmatch 'project_file.*project_name' -or $apiText -notmatch 'Selected\
        \ project is not currently open') {\n  throw 'THREE_D_PROJECT_IDENTITY_INVALID: export jobs must be tied to the exact\
        \ selected project.'\n}\nif ($apiText -notmatch 'Project changed after export was queued' -or $apiText -notmatch 'project_local'\
        \ -and $apiText -notmatch 'startup_script') {\n  throw 'THREE_D_PROJECT_GUARD_INVALID: queued exports must recheck\
        \ the selected project and each project must have its own Bridge startup script.'\n}\nif ($apiText -notmatch 'section_index\
        \ \\+ 1, startup_line' -or $apiText -notmatch 'PythonScriptPlugin.PythonScriptPluginSettings') {\n  throw 'PROJECT_STARTUP_CONFIG_INVALID:\
        \ StartupScripts must be written inside PythonScriptPlugin settings.'\n}\nif ($apiText -notmatch 'BLUEPRINT_EXPLORER_FEATURE_MARKERS'\
        \ -or $apiText -notmatch 'bpConnected=false' -or $apiText -notmatch 'write_graph_dsl' -or $apiText -notmatch 'Send\
        \ / Apply Changes' -or $apiText -notmatch 'bpLogOutput' -or $apiText -notmatch 'BLUEPRINT_TOOL_SEARCH_DISPATCH_MARKERS')\
        \ {\n  throw 'BLUEPRINT_EXPLORER_VALIDATION_FAILED: explicit offline state, staged graph apply and logs are required.'\n\
        }\nif ($apiText -notmatch 'BLUEPRINT_EXPLORER_UI_IMPLEMENTATION' -or $apiText -notmatch \"@app.get\\('/blueprint-explorer'\\\
        )\" -or $apiText -notmatch 'BLUEPRINT_EXPLORER_HTML' -or $apiText -notmatch \"@app.get\\('/api/blueprint/explorer/status'\\\
        )\" -or $apiText -notmatch 'BLUEPRINT_EXPLORER_DYNAMIC_BASE_URL' -or $apiText -notmatch 'apiFetch\\(' -or $apiText\
        \ -notmatch 'endpoint\\(' -or $apiText -notmatch 'BLUEPRINT_EXPLORER_CORS_SUPPORT' -or $apiText -notmatch 'UE58_BLUEPRINT_ALLOW_FILE_ORIGIN')\
        \ {\n  throw 'BLUEPRINT_EXPLORER_CONNECTION_VALIDATION_FAILED: configurable absolute server URL, authenticated API\
        \ fetch and explicit CORS handling are required.'\n}\nif ($apiText -notmatch 'BLUEPRINT_PROJECT_SELECTOR_FEATURE_MARKERS'\
        \ -or $apiText -notmatch 'def _project_files\\(' -or $apiText -notmatch 'project_root=str\\(ROOT\\)' -or $apiText\
        \ -notmatch '@app\\.get\\(''/api/projects''\\)') {\n  throw 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION_FAILED: project\
        \ discovery must scan the configured D:\\\\UE58 root and expose it to the Blueprint UI.'\n}\nif ($apiText -notmatch\
        \ 'def api_fs_read' -or $apiText -notmatch 'def api_fs_write' -or $apiText -notmatch 'content_base64' -or $apiText\
        \ -notmatch 'def _fs_atomic_write') {\n  throw 'FILE_MANAGER_READ_WRITE_VALIDATION_FAILED: byte-safe file read and\
        \ atomic file write routes are required.'\n}\nif ($apiText -notmatch 'def api_fs_move' -or $apiText -notmatch 'def\
        \ _fs_move_paths' -or $apiText -notmatch 'file_manager_move_paths') {\n  throw 'FILE_MANAGER_MOVE_VALIDATION_FAILED:\
        \ safe move operation is required.'\n}\nif ($apiText -notmatch 'file_manager_read_file' -or $apiText -notmatch 'file_manager_write_file'\
        \ -or $apiText -notmatch 'file_manager_create_folder' -or $apiText -notmatch 'unreal_save_blueprint_asset' -or $apiText\
        \ -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true') {\n  throw 'FILE_MANAGER_MCP_OR_BLUEPRINT_SAVE_VALIDATION_FAILED:\
        \ read/write/folder MCP tools and disk-verified Blueprint save are required.'\n}\n$listLogToolCount = [regex]::Matches($apiText,\
        \ \"'name': 'file_manager_list_logs'\").Count\n$readLogsToolCount = [regex]::Matches($apiText, \"'name': 'file_manager_read_logs'\"\
        ).Count\nif ($listLogToolCount -ne 1 -or $readLogsToolCount -ne 1 -or\n    $apiText -notmatch 'def _log_source_catalog'\
        \ -or $apiText -notmatch 'def _read_log_source_chunk' -or\n    $apiText -notmatch 'next_offset' -or $apiText -notmatch\
        \ 'max_total_bytes' -or\n    $apiText -notmatch \"@app.get\\('/api/logs/catalog'\\)\" -or $apiText -notmatch 'rate-limit-events')\
        \ {\n  throw 'EXPANDED_LOG_ACCESS_VALIDATION_FAILED: unique log-list/batch-read tools, catalog, byte paging and rate-limit\
        \ log source are required.'\n}\nif ($apiText -notmatch 'MCP_RATE_LIMIT_STATE' -or $apiText -notmatch '_record_rate_limit'\
        \ -or\n    $apiText -notmatch '_rate_limit_delay' -or $apiText -notmatch 'Retry-After' -or\n    $apiText -notmatch\
        \ '_wait_for_mcp_upstream_slot' -or $apiText -notmatch 'MCP_RATE_LIMITED' -or\n    $apiText -notmatch 'def _mcp_post_status_with_retry')\
        \ {\n  throw 'MCP_RATE_LIMIT_RECOVERY_VALIDATION_FAILED: bounded retry, Retry-After handling, request pacing and diagnostics\
        \ are required.'\n}\n$blueprintSaveRouteCount = [regex]::Matches($apiText, '(?m)^def api_blueprint_save\\(').Count\n\
        if ($blueprintSaveRouteCount -ne 1 -or $apiText -notmatch 'def api_blueprint_save_status' -or\n    $apiText -notmatch\
        \ 'EditorLoadingAndSavingUtils.save_packages' -or\n    $apiText -notmatch 'SAVE_PACKAGES_BEGIN' -or $apiText -notmatch\
        \ 'SAVE_PACKAGES_END' -or\n    $apiText -notmatch 'BLUEPRINT_SAVE_PHASE=' -or $apiText -notmatch 'BLUEPRINT_SAVE_DISK_VERIFIED=true')\
        \ {\n  throw 'BLUEPRINT_DISK_SAVE_ENDPOINT_MISSING: one targeted save route, package-save begin/end markers, disk\
        \ verification and phase diagnostics are required.'\n}\nWrite-Host 'EXPANDED_LOG_ACCESS_VALIDATION=true'\nWrite-Host\
        \ 'MCP_RATE_LIMIT_RECOVERY_VALIDATION=true'\nWrite-Host 'BLUEPRINT_EXPLORER_VALIDATION=true'\nWrite-Host 'BLUEPRINT_PROJECT_SELECTOR_VALIDATION=true'\n\
        Write-Host 'THREE_D_GITHUB_RELEASE_VALIDATION=true'\nWrite-Host 'BRIDGE_BUSY_DIAGNOSTICS_VALIDATION=true'\nWrite-Host\
        \ 'BRIDGE_RECOVERY_ENDPOINT_VALIDATION=true'\nWrite-Host 'PROJECT_PREFLIGHT_VALIDATION=true'\nWrite-Host 'CREATE_PROJECT_VALIDATION=true'\n\
        Write-Host 'THREE_D_PROJECT_SELECTOR_VALIDATION=true'\n"
